<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2d3d" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#00d4ff"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#22c55e"/></marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#f97316"/></marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#8b5cf6"/></marker>
    <marker id="arrow-gold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#eab308"/></marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#e11d2a"/></marker>
    <marker id="arrow-white" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/></marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- background -->
  <rect width="800" height="600" fill="#0d1117"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <!-- title -->
  <text x="400" y="38" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">System One vs System Two</text>
  <line x1="60" y1="52" x2="740" y2="52" stroke="#e11d2a" stroke-width="2"/>

  <!-- ===== BODY ===== -->
  <!-- Shared security decision point (left) -->
  <rect x="40" y="255" width="130" height="90" rx="10" fill="#0f1b2d" stroke="#eab308" stroke-width="1.8" filter="url(#glow)"/>
  <text x="105" y="292" text-anchor="middle" fill="#eab308" font-size="13" font-weight="600">Security</text>
  <text x="105" y="309" text-anchor="middle" fill="#eab308" font-size="13" font-weight="600">decision point</text>
  <text x="105" y="328" text-anchor="middle" fill="#8ea3b8" font-size="11">same input, two paths</text>

  <!-- feeds to both lanes -->
  <line x1="170" y1="278" x2="205" y2="165" stroke="#f97316" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <line x1="170" y1="322" x2="205" y2="435" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <!-- ===== TOP LANE: System Two (orange) ===== -->
  <rect x="185" y="80" width="600" height="150" rx="12" fill="none" stroke="#f97316" stroke-width="1" stroke-dasharray="5 4" opacity="0.6"/>
  <text x="205" y="100" fill="#f97316" font-size="13" font-weight="700">System Two — generative LLM</text>

  <rect x="200" y="115" width="120" height="60" rx="10" fill="#0f1b2d" stroke="#f97316" stroke-width="1.6"/>
  <text x="260" y="142" text-anchor="middle" fill="#f97316" font-size="12" font-weight="600">Prompt</text>
  <text x="260" y="160" text-anchor="middle" fill="#8ea3b8" font-size="11">natural language</text>

  <rect x="345" y="115" width="120" height="60" rx="10" fill="#0f1b2d" stroke="#f97316" stroke-width="1.6"/>
  <text x="405" y="142" text-anchor="middle" fill="#f97316" font-size="12" font-weight="600">Generate tokens</text>
  <text x="405" y="160" text-anchor="middle" fill="#8ea3b8" font-size="11">autoregressive</text>

  <rect x="490" y="115" width="120" height="60" rx="10" fill="#0f1b2d" stroke="#f97316" stroke-width="1.6"/>
  <text x="550" y="142" text-anchor="middle" fill="#f97316" font-size="12" font-weight="600">Parse prose</text>
  <text x="550" y="160" text-anchor="middle" fill="#8ea3b8" font-size="11">regex / JSON coax</text>

  <rect x="635" y="115" width="130" height="60" rx="10" fill="#0f1b2d" stroke="#f97316" stroke-width="1.6"/>
  <text x="700" y="142" text-anchor="middle" fill="#f97316" font-size="12" font-weight="600">Hope it's right</text>
  <text x="700" y="160" text-anchor="middle" fill="#8ea3b8" font-size="11">no probabilities</text>

  <line x1="320" y1="145" x2="345" y2="145" stroke="#f97316" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <line x1="465" y1="145" x2="490" y2="145" stroke="#f97316" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <line x1="610" y1="145" x2="635" y2="145" stroke="#f97316" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <text x="483" y="207" text-anchor="middle" fill="#f97316" font-size="11">slow (~seconds) · not auditable · uncalibrated</text>

  <!-- ===== BOTTOM LANE: System One (cyan/green) ===== -->
  <rect x="185" y="370" width="600" height="160" rx="12" fill="none" stroke="#22c55e" stroke-width="1" stroke-dasharray="5 4" opacity="0.6"/>
  <text x="205" y="390" fill="#22c55e" font-size="13" font-weight="700">System One — typed judgment</text>

  <rect x="200" y="405" width="120" height="60" rx="10" fill="#0f1b2d" stroke="#00d4ff" stroke-width="1.6"/>
  <text x="260" y="432" text-anchor="middle" fill="#00d4ff" font-size="12" font-weight="600">State</text>
  <text x="260" y="450" text-anchor="middle" fill="#8ea3b8" font-size="11">typed inputs</text>

  <rect x="345" y="405" width="120" height="60" rx="10" fill="#0f1b2d" stroke="#00d4ff" stroke-width="1.6"/>
  <text x="405" y="428" text-anchor="middle" fill="#00d4ff" font-size="12" font-weight="600">Single forward</text>
  <text x="405" y="444" text-anchor="middle" fill="#00d4ff" font-size="12" font-weight="600">pass</text>
  <text x="405" y="460" text-anchor="middle" fill="#8ea3b8" font-size="11">non-autoregressive</text>

  <rect x="490" y="405" width="130" height="60" rx="10" fill="#0f1b2d" stroke="#22c55e" stroke-width="1.6"/>
  <text x="555" y="428" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="600">Typed answer</text>
  <text x="555" y="446" text-anchor="middle" fill="#8ea3b8" font-size="11">choice / noul / score</text>
  <text x="555" y="460" text-anchor="middle" fill="#8ea3b8" font-size="11">+ probability</text>

  <rect x="645" y="405" width="120" height="60" rx="10" fill="#0f1b2d" stroke="#22c55e" stroke-width="1.6"/>
  <text x="705" y="432" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="600">Code consumes</text>
  <text x="705" y="450" text-anchor="middle" fill="#8ea3b8" font-size="11">branch on type</text>

  <line x1="320" y1="435" x2="345" y2="435" stroke="#00d4ff" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <line x1="465" y1="435" x2="490" y2="435" stroke="#00d4ff" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <line x1="620" y1="435" x2="645" y2="435" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="483" y="497" text-anchor="middle" fill="#22c55e" font-size="11">fast (~33ms) · calibrated · auditable</text>
  <!-- ===== END BODY ===== -->

  <!-- footer -->
  <text x="400" y="585" text-anchor="middle" fill="#3d4c5e" font-size="11">System One Security — JEV &amp; Laya · Red Team Leaders</text>
</svg>
