<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2d3d" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#00d4ff"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#22c55e"/></marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#f97316"/></marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#8b5cf6"/></marker>
    <marker id="arrow-gold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#eab308"/></marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#e11d2a"/></marker>
    <marker id="arrow-white" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/></marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- background -->
  <rect width="800" height="600" fill="#0d1117"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <!-- title -->
  <text x="400" y="38" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">Anatomy of a Decision Contract</text>
  <line x1="60" y1="52" x2="740" y2="52" stroke="#e11d2a" stroke-width="2"/>

  <!-- ===== BODY ===== -->
  <!-- LEFT: STATE -->
  <rect x="40" y="110" width="180" height="185" rx="10" fill="#0f1b2d" stroke="#00d4ff" stroke-width="1.8"/>
  <text x="130" y="135" text-anchor="middle" fill="#00d4ff" font-size="14" font-weight="700">STATE</text>
  <text x="130" y="152" text-anchor="middle" fill="#8ea3b8" font-size="11">named JSON fields</text>
  <rect x="58" y="166" width="144" height="30" rx="6" fill="#0d1117" stroke="#00d4ff" stroke-width="1"/>
  <text x="130" y="185" text-anchor="middle" fill="#e2e8f0" font-size="12">from: string</text>
  <rect x="58" y="204" width="144" height="30" rx="6" fill="#0d1117" stroke="#00d4ff" stroke-width="1"/>
  <text x="130" y="223" text-anchor="middle" fill="#e2e8f0" font-size="12">subject: string</text>
  <rect x="58" y="242" width="144" height="30" rx="6" fill="#0d1117" stroke="#00d4ff" stroke-width="1"/>
  <text x="130" y="261" text-anchor="middle" fill="#e2e8f0" font-size="12">body: string</text>

  <!-- CENTER: QUESTIONS -->
  <rect x="290" y="90" width="220" height="240" rx="10" fill="#0f1b2d" stroke="#eab308" stroke-width="1.8"/>
  <text x="400" y="115" text-anchor="middle" fill="#eab308" font-size="14" font-weight="700">QUESTIONS</text>
  <rect x="308" y="128" width="184" height="55" rx="8" fill="#0d1117" stroke="#eab308" stroke-width="1.2"/>
  <text x="400" y="150" text-anchor="middle" fill="#eab308" font-size="13" font-weight="600">choice</text>
  <text x="400" y="169" text-anchor="middle" fill="#8ea3b8" font-size="11">criteria: options</text>
  <rect x="308" y="192" width="184" height="55" rx="8" fill="#0d1117" stroke="#eab308" stroke-width="1.2"/>
  <text x="400" y="214" text-anchor="middle" fill="#eab308" font-size="13" font-weight="600">noul</text>
  <text x="400" y="233" text-anchor="middle" fill="#8ea3b8" font-size="11">P(true)</text>
  <rect x="308" y="256" width="184" height="55" rx="8" fill="#0d1117" stroke="#eab308" stroke-width="1.2"/>
  <text x="400" y="278" text-anchor="middle" fill="#eab308" font-size="13" font-weight="600">score</text>
  <text x="400" y="297" text-anchor="middle" fill="#8ea3b8" font-size="11">ordered levels</text>

  <!-- RIGHT: TYPED OUTPUTS -->
  <rect x="580" y="110" width="185" height="185" rx="10" fill="#0f1b2d" stroke="#22c55e" stroke-width="1.8"/>
  <text x="672" y="135" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="700">TYPED OUTPUTS</text>
  <rect x="596" y="150" width="153" height="42" rx="6" fill="#0d1117" stroke="#22c55e" stroke-width="1"/>
  <text x="672" y="167" text-anchor="middle" fill="#e2e8f0" font-size="11">choice + probabilities</text>
  <text x="672" y="183" text-anchor="middle" fill="#8ea3b8" font-size="11">+ confidence</text>
  <rect x="596" y="200" width="153" height="34" rx="6" fill="#0d1117" stroke="#22c55e" stroke-width="1"/>
  <text x="672" y="222" text-anchor="middle" fill="#e2e8f0" font-size="11">noul: P(true)</text>
  <rect x="596" y="242" width="153" height="42" rx="6" fill="#0d1117" stroke="#22c55e" stroke-width="1"/>
  <text x="672" y="259" text-anchor="middle" fill="#e2e8f0" font-size="11">score + legend</text>
  <text x="672" y="275" text-anchor="middle" fill="#8ea3b8" font-size="11">level meanings</text>

  <!-- Arrows -->
  <line x1="220" y1="202" x2="288" y2="202" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="254" y="194" text-anchor="middle" fill="#8ea3b8" font-size="10">ask</text>
  <line x1="510" y1="202" x2="578" y2="202" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="544" y="194" text-anchor="middle" fill="#8ea3b8" font-size="10">answer</text>

  <!-- version + fingerprint tag -->
  <rect x="290" y="360" width="220" height="46" rx="8" fill="#0f1b2d" stroke="#8b5cf6" stroke-width="1.6" filter="url(#glow)"/>
  <text x="400" y="380" text-anchor="middle" fill="#8b5cf6" font-size="12" font-weight="600">version + fingerprint</text>
  <text x="400" y="397" text-anchor="middle" fill="#8ea3b8" font-size="11">contract v · sha256 hash</text>
  <line x1="400" y1="330" x2="400" y2="358" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
  <text x="400" y="440" text-anchor="middle" fill="#8ea3b8" font-size="11">one contract = state + questions + typed outputs, pinned and reproducible</text>
  <!-- ===== END BODY ===== -->

  <!-- footer -->
  <text x="400" y="585" text-anchor="middle" fill="#3d4c5e" font-size="11">System One Security — JEV &amp; Laya · Red Team Leaders</text>
</svg>
