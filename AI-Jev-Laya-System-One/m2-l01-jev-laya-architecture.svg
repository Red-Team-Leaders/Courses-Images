<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2d3d" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#00d4ff"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#22c55e"/></marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#f97316"/></marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#8b5cf6"/></marker>
    <marker id="arrow-gold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#eab308"/></marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#e11d2a"/></marker>
    <marker id="arrow-white" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/></marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- background -->
  <rect width="800" height="600" fill="#0d1117"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <!-- title -->
  <text x="400" y="38" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">One Contract, Two Engines</text>
  <line x1="60" y1="52" x2="740" y2="52" stroke="#e11d2a" stroke-width="2"/>

  <!-- ===== BODY ===== -->
  <!-- TOP: JEV (cyan) -->
  <rect x="230" y="80" width="290" height="80" rx="10" fill="#0f1b2d" stroke="#00d4ff" stroke-width="1.8"/>
  <text x="375" y="106" text-anchor="middle" fill="#00d4ff" font-size="14" font-weight="700">JEV — hosted TypeSafe</text>
  <text x="375" y="126" text-anchor="middle" fill="#8ea3b8" font-size="11">POST /v1/systemone</text>
  <text x="375" y="144" text-anchor="middle" fill="#8ea3b8" font-size="11">managed API · scale on demand</text>

  <!-- CENTER: shared contract (gold) -->
  <rect x="255" y="250" width="240" height="90" rx="10" fill="#0f1b2d" stroke="#eab308" stroke-width="2" filter="url(#glow)"/>
  <text x="375" y="282" text-anchor="middle" fill="#eab308" font-size="14" font-weight="700">Decision Contract</text>
  <text x="375" y="303" text-anchor="middle" fill="#8ea3b8" font-size="11">choice / noul / score</text>
  <text x="375" y="321" text-anchor="middle" fill="#8ea3b8" font-size="11">same schema, any engine</text>

  <!-- BOTTOM: Laya (purple) -->
  <rect x="210" y="430" width="330" height="95" rx="10" fill="#0f1b2d" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="375" y="455" text-anchor="middle" fill="#8b5cf6" font-size="14" font-weight="700">Laya — local engine</text>
  <text x="375" y="474" text-anchor="middle" fill="#8ea3b8" font-size="11">non-autoregressive · runs on device</text>
  <text x="375" y="491" text-anchor="middle" fill="#8ea3b8" font-size="11">Router + checkpoints:</text>
  <text x="375" y="508" text-anchor="middle" fill="#8ea3b8" font-size="11">english / multilingual / typed-decisions</text>

  <!-- Router node (feeds Laya) -->
  <rect x="40" y="440" width="130" height="75" rx="10" fill="#0f1b2d" stroke="#8b5cf6" stroke-width="1.6"/>
  <text x="105" y="466" text-anchor="middle" fill="#8b5cf6" font-size="13" font-weight="600">Router</text>
  <text x="105" y="484" text-anchor="middle" fill="#8ea3b8" font-size="11">picks checkpoint</text>
  <text x="105" y="500" text-anchor="middle" fill="#8ea3b8" font-size="11">by language / script</text>
  <line x1="170" y1="478" x2="208" y2="478" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arrow-purple)"/>

  <!-- contract <-> JEV -->
  <line x1="375" y1="248" x2="375" y2="162" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="392" y="205" text-anchor="start" fill="#8ea3b8" font-size="10">hosted</text>
  <!-- contract <-> Laya -->
  <line x1="375" y1="342" x2="375" y2="428" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="392" y="390" text-anchor="start" fill="#8ea3b8" font-size="10">local</text>

  <!-- RIGHT: normalized Answer (green) -->
  <rect x="595" y="245" width="165" height="100" rx="10" fill="#0f1b2d" stroke="#22c55e" stroke-width="1.8"/>
  <text x="677" y="278" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="700">Answer</text>
  <text x="677" y="299" text-anchor="middle" fill="#8ea3b8" font-size="11">normalized result</text>
  <text x="677" y="316" text-anchor="middle" fill="#8ea3b8" font-size="11">+ probabilities</text>
  <text x="677" y="333" text-anchor="middle" fill="#8ea3b8" font-size="11">app code consumes</text>
  <line x1="495" y1="295" x2="593" y2="295" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="544" y="287" text-anchor="middle" fill="#8ea3b8" font-size="10">either engine</text>
  <!-- ===== END BODY ===== -->

  <!-- footer -->
  <text x="400" y="585" text-anchor="middle" fill="#3d4c5e" font-size="11">System One Security — JEV &amp; Laya · Red Team Leaders</text>
</svg>
