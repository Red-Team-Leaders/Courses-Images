<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2d3d" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#00d4ff"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#22c55e"/></marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#f97316"/></marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#8b5cf6"/></marker>
    <marker id="arrow-gold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#eab308"/></marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#e11d2a"/></marker>
    <marker id="arrow-white" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/></marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- background -->
  <rect width="800" height="600" fill="#0d1117"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <!-- title -->
  <text x="400" y="38" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">The Integration Layer</text>
  <line x1="60" y1="52" x2="740" y2="52" stroke="#e11d2a" stroke-width="2"/>

  <!-- ===== BODY ===== -->
  <!-- Untrusted input -->
  <rect x="55" y="120" width="150" height="70" rx="10" fill="#0f1b2d" stroke="#e11d2a" stroke-width="1.8"/>
  <text x="130" y="150" text-anchor="middle" fill="#e11d2a" font-size="13" font-weight="700">Untrusted input</text>
  <text x="130" y="169" text-anchor="middle" fill="#8ea3b8" font-size="11">user / network data</text>

  <!-- Validation -->
  <rect x="270" y="120" width="150" height="70" rx="10" fill="#0f1b2d" stroke="#00d4ff" stroke-width="1.8"/>
  <text x="345" y="150" text-anchor="middle" fill="#00d4ff" font-size="13" font-weight="600">Validation</text>
  <text x="345" y="169" text-anchor="middle" fill="#8ea3b8" font-size="11">schema / bounds</text>

  <!-- Contract + Backend -->
  <rect x="485" y="115" width="260" height="80" rx="10" fill="#0f1b2d" stroke="#eab308" stroke-width="1.8"/>
  <text x="615" y="142" text-anchor="middle" fill="#eab308" font-size="13" font-weight="600">Decision Contract</text>
  <text x="615" y="161" text-anchor="middle" fill="#8ea3b8" font-size="11">+ Backend (JEV / Laya)</text>
  <text x="615" y="179" text-anchor="middle" fill="#8ea3b8" font-size="11">typed judgment engine</text>

  <!-- Normalize -->
  <rect x="530" y="290" width="170" height="70" rx="10" fill="#0f1b2d" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="615" y="320" text-anchor="middle" fill="#8b5cf6" font-size="13" font-weight="600">Normalize Answer</text>
  <text x="615" y="339" text-anchor="middle" fill="#8ea3b8" font-size="11">uniform typed shape</text>

  <!-- Confidence gate -->
  <rect x="300" y="285" width="180" height="80" rx="10" fill="#0f1b2d" stroke="#22c55e" stroke-width="1.8"/>
  <text x="390" y="311" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="600">Confidence Gate</text>
  <text x="390" y="330" text-anchor="middle" fill="#8ea3b8" font-size="11">threshold on P</text>
  <text x="390" y="348" text-anchor="middle" fill="#8ea3b8" font-size="11">act / review / abstain</text>

  <!-- Decision log -->
  <rect x="55" y="285" width="185" height="80" rx="10" fill="#0f1b2d" stroke="#eab308" stroke-width="1.8" filter="url(#glow)"/>
  <text x="147" y="309" text-anchor="middle" fill="#eab308" font-size="12" font-weight="600">Tamper-evident</text>
  <text x="147" y="326" text-anchor="middle" fill="#eab308" font-size="12" font-weight="600">Decision Log</text>
  <text x="147" y="345" text-anchor="middle" fill="#8ea3b8" font-size="11">hash chain (append-only)</text>

  <!-- Arrows: pipeline -->
  <line x1="205" y1="155" x2="268" y2="155" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-white)"/>
  <line x1="420" y1="155" x2="483" y2="155" stroke="#00d4ff" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <text x="452" y="147" text-anchor="middle" fill="#8ea3b8" font-size="10">clean</text>
  <!-- backend down to normalize -->
  <line x1="615" y1="195" x2="615" y2="288" stroke="#eab308" stroke-width="1.8" marker-end="url(#arrow-gold)"/>
  <!-- normalize to gate -->
  <line x1="528" y1="325" x2="482" y2="325" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
  <!-- gate to log -->
  <line x1="298" y1="325" x2="242" y2="325" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="270" y="317" text-anchor="middle" fill="#8ea3b8" font-size="10">record</text>

  <!-- side tag -->
  <rect x="255" y="430" width="290" height="55" rx="8" fill="#0f1b2d" stroke="#f97316" stroke-width="1.6"/>
  <text x="400" y="452" text-anchor="middle" fill="#f97316" font-size="12" font-weight="600">contract version + model version pinned</text>
  <text x="400" y="470" text-anchor="middle" fill="#8ea3b8" font-size="11">every logged decision is reproducible</text>
  <line x1="147" y1="365" x2="147" y2="457" stroke="#f97316" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow-orange)"/>
  <line x1="390" y1="430" x2="390" y2="367" stroke="#f97316" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow-orange)"/>
  <!-- ===== END BODY ===== -->

  <!-- footer -->
  <text x="400" y="585" text-anchor="middle" fill="#3d4c5e" font-size="11">System One Security — JEV &amp; Laya · Red Team Leaders</text>
</svg>
