<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2d3d" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#00d4ff"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#22c55e"/></marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#f97316"/></marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#8b5cf6"/></marker>
    <marker id="arrow-gold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#eab308"/></marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#e11d2a"/></marker>
    <marker id="arrow-white" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/></marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- background -->
  <rect width="800" height="600" fill="#0d1117"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <!-- title -->
  <text x="400" y="38" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">Finding-Verdict Service</text>
  <line x1="60" y1="52" x2="740" y2="52" stroke="#e11d2a" stroke-width="2"/>

  <!-- ===== BODY ===== -->
  <!-- Security finding (in) -->
  <rect x="40" y="95" width="150" height="60" rx="10" fill="#0f1b2d" stroke="#00d4ff" stroke-width="1.6"/>
  <text x="115" y="122" text-anchor="middle" fill="#00d4ff" font-size="14" font-weight="600">Security finding</text>
  <text x="115" y="140" text-anchor="middle" fill="#8ea3b8" font-size="11">raw input</text>

  <!-- Decision Contract -->
  <rect x="300" y="80" width="200" height="90" rx="10" fill="#0f1b2d" stroke="#8b5cf6" stroke-width="1.6"/>
  <text x="400" y="105" text-anchor="middle" fill="#8b5cf6" font-size="14" font-weight="600">Decision Contract</text>
  <text x="400" y="124" text-anchor="middle" fill="#8ea3b8" font-size="11">three typed questions</text>
  <text x="400" y="145" text-anchor="middle" fill="#8ea3b8" font-size="10">feeds backend</text>

  <!-- three sub-nodes -->
  <rect x="70" y="220" width="180" height="56" rx="10" fill="#0f1b2d" stroke="#eab308" stroke-width="1.6"/>
  <text x="160" y="245" text-anchor="middle" fill="#eab308" font-size="13" font-weight="600">category</text>
  <text x="160" y="263" text-anchor="middle" fill="#8ea3b8" font-size="11">choice</text>

  <rect x="310" y="220" width="180" height="56" rx="10" fill="#0f1b2d" stroke="#f97316" stroke-width="1.6"/>
  <text x="400" y="245" text-anchor="middle" fill="#f97316" font-size="13" font-weight="600">exploitable</text>
  <text x="400" y="263" text-anchor="middle" fill="#8ea3b8" font-size="11">noul (yes / no / unsure)</text>

  <rect x="550" y="220" width="180" height="56" rx="10" fill="#0f1b2d" stroke="#00d4ff" stroke-width="1.6"/>
  <text x="640" y="245" text-anchor="middle" fill="#00d4ff" font-size="13" font-weight="600">severity</text>
  <text x="640" y="263" text-anchor="middle" fill="#8ea3b8" font-size="11">score</text>

  <!-- Backend -->
  <rect x="600" y="80" width="160" height="90" rx="10" fill="#0f1b2d" stroke="#22c55e" stroke-width="1.6"/>
  <text x="680" y="112" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="600">Backend</text>
  <text x="680" y="132" text-anchor="middle" fill="#8ea3b8" font-size="11">JEV / Laya</text>
  <text x="680" y="150" text-anchor="middle" fill="#8ea3b8" font-size="10">model inference</text>

  <!-- Normalized verdict -->
  <rect x="300" y="340" width="200" height="70" rx="10" fill="#0f1b2d" stroke="#22c55e" stroke-width="1.6"/>
  <text x="400" y="368" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="600">Normalized verdict</text>
  <text x="400" y="388" text-anchor="middle" fill="#8ea3b8" font-size="11">+ confidence</text>

  <!-- Gate -->
  <rect x="300" y="450" width="200" height="80" rx="10" fill="#0f1b2d" stroke="#eab308" stroke-width="1.6"/>
  <text x="400" y="476" text-anchor="middle" fill="#eab308" font-size="14" font-weight="600">Gate</text>
  <text x="400" y="498" text-anchor="middle" fill="#22c55e" font-size="11">ACT</text>
  <text x="400" y="516" text-anchor="middle" fill="#f97316" font-size="11">REVIEW  /  ABSTAIN</text>

  <!-- logged -->
  <rect x="580" y="455" width="170" height="70" rx="10" fill="#0f1b2d" stroke="#00d4ff" stroke-width="1.6"/>
  <text x="665" y="486" text-anchor="middle" fill="#00d4ff" font-size="14" font-weight="600">Logged</text>
  <text x="665" y="506" text-anchor="middle" fill="#8ea3b8" font-size="11">audit trail</text>

  <!-- arrows -->
  <line x1="190" y1="125" x2="298" y2="125" stroke="#00d4ff" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <line x1="500" y1="125" x2="598" y2="125" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <!-- contract to sub-questions -->
  <line x1="360" y1="170" x2="200" y2="218" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <line x1="400" y1="170" x2="400" y2="218" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <line x1="440" y1="170" x2="600" y2="218" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <!-- backend to verdict -->
  <line x1="660" y1="170" x2="470" y2="338" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <!-- verdict to gate -->
  <line x1="400" y1="410" x2="400" y2="448" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <!-- gate to logged -->
  <line x1="500" y1="490" x2="578" y2="490" stroke="#eab308" stroke-width="1.8" marker-end="url(#arrow-gold)"/>
  <!-- ===== END BODY ===== -->

  <!-- footer -->
  <text x="400" y="585" text-anchor="middle" fill="#3d4c5e" font-size="11">System One Security — JEV &amp; Laya · Red Team Leaders</text>
</svg>
