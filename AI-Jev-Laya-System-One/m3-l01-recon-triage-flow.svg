<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2d3d" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#00d4ff"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#22c55e"/></marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#f97316"/></marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#8b5cf6"/></marker>
    <marker id="arrow-gold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#eab308"/></marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#e11d2a"/></marker>
    <marker id="arrow-white" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/></marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- background -->
  <rect width="800" height="600" fill="#0d1117"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <!-- title -->
  <text x="400" y="38" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">Reconnaissance Triage</text>
  <line x1="60" y1="52" x2="740" y2="52" stroke="#e11d2a" stroke-width="2"/>

  <!-- ===== BODY ===== -->
  <!-- raw sources -->
  <text x="120" y="90" text-anchor="middle" fill="#8ea3b8" font-size="12" font-weight="600">raw sources</text>
  <rect x="40" y="105" width="160" height="50" rx="10" fill="#0f1b2d" stroke="#00d4ff" stroke-width="1.6"/>
  <text x="120" y="128" text-anchor="middle" fill="#00d4ff" font-size="13" font-weight="600">nmap services</text>
  <text x="120" y="145" text-anchor="middle" fill="#8ea3b8" font-size="10">open ports / banners</text>

  <rect x="40" y="175" width="160" height="50" rx="10" fill="#0f1b2d" stroke="#22c55e" stroke-width="1.6"/>
  <text x="120" y="198" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="600">httpx</text>
  <text x="120" y="215" text-anchor="middle" fill="#8ea3b8" font-size="10">live hosts / titles</text>

  <rect x="40" y="245" width="160" height="50" rx="10" fill="#0f1b2d" stroke="#f97316" stroke-width="1.6"/>
  <text x="120" y="268" text-anchor="middle" fill="#f97316" font-size="13" font-weight="600">nuclei JSONL</text>
  <text x="120" y="285" text-anchor="middle" fill="#8ea3b8" font-size="10">template hits</text>

  <!-- Parse/normalize -->
  <rect x="280" y="150" width="180" height="100" rx="10" fill="#0f1b2d" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="370" y="192" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">Parse / normalize</text>
  <text x="370" y="212" text-anchor="middle" fill="#8ea3b8" font-size="11">to unified state</text>
  <text x="370" y="230" text-anchor="middle" fill="#8ea3b8" font-size="10">one record per host</text>

  <!-- Decision Contract -->
  <rect x="540" y="120" width="220" height="160" rx="10" fill="#0f1b2d" stroke="#8b5cf6" stroke-width="1.6"/>
  <text x="650" y="146" text-anchor="middle" fill="#8b5cf6" font-size="14" font-weight="600">Decision Contract</text>
  <line x1="560" y1="156" x2="740" y2="156" stroke="#1e2d3d" stroke-width="1"/>
  <text x="650" y="178" text-anchor="middle" fill="#eab308" font-size="12" font-weight="600">service_type</text>
  <text x="650" y="194" text-anchor="middle" fill="#8ea3b8" font-size="10">choice</text>
  <text x="650" y="218" text-anchor="middle" fill="#00d4ff" font-size="12" font-weight="600">tech_stack</text>
  <text x="650" y="234" text-anchor="middle" fill="#8ea3b8" font-size="10">choice</text>
  <text x="650" y="258" text-anchor="middle" fill="#f97316" font-size="12" font-weight="600">interestingness</text>
  <text x="650" y="274" text-anchor="middle" fill="#8ea3b8" font-size="10">score</text>

  <!-- triaged queue -->
  <rect x="480" y="400" width="200" height="70" rx="10" fill="#0f1b2d" stroke="#22c55e" stroke-width="1.6"/>
  <text x="580" y="430" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="600">Triaged queue</text>
  <text x="580" y="450" text-anchor="middle" fill="#8ea3b8" font-size="11">ranked by score</text>

  <!-- arrows from sources (colored by source) -->
  <line x1="200" y1="130" x2="278" y2="175" stroke="#00d4ff" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <line x1="200" y1="200" x2="278" y2="200" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <line x1="200" y1="270" x2="278" y2="225" stroke="#f97316" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <!-- parse to contract -->
  <line x1="460" y1="200" x2="538" y2="200" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-white)"/>
  <!-- contract to queue -->
  <line x1="650" y1="280" x2="600" y2="398" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
  <!-- ===== END BODY ===== -->

  <!-- footer -->
  <text x="400" y="585" text-anchor="middle" fill="#3d4c5e" font-size="11">System One Security — JEV &amp; Laya · Red Team Leaders</text>
</svg>
