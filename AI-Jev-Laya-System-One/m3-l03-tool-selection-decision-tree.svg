<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2d3d" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#00d4ff"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#22c55e"/></marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#f97316"/></marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#8b5cf6"/></marker>
    <marker id="arrow-gold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#eab308"/></marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#e11d2a"/></marker>
    <marker id="arrow-white" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/></marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- background -->
  <rect width="800" height="600" fill="#0d1117"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <!-- title -->
  <text x="400" y="38" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">Tool Selection: Enumerate / Validate / Stop</text>
  <line x1="60" y1="52" x2="740" y2="52" stroke="#e11d2a" stroke-width="2"/>

  <!-- ===== BODY ===== -->
  <!-- Evidence state -->
  <rect x="300" y="80" width="200" height="60" rx="10" fill="#0f1b2d" stroke="#00d4ff" stroke-width="1.6"/>
  <text x="400" y="106" text-anchor="middle" fill="#00d4ff" font-size="14" font-weight="600">Evidence state</text>
  <text x="400" y="125" text-anchor="middle" fill="#8ea3b8" font-size="11">current findings</text>

  <!-- confidence Gate -->
  <rect x="300" y="175" width="200" height="70" rx="10" fill="#0f1b2d" stroke="#eab308" stroke-width="1.6"/>
  <text x="400" y="202" text-anchor="middle" fill="#eab308" font-size="14" font-weight="600">Confidence Gate</text>
  <text x="400" y="221" text-anchor="middle" fill="#8ea3b8" font-size="11">governs the branch</text>
  <text x="400" y="237" text-anchor="middle" fill="#8ea3b8" font-size="10">choice{enumerate,validate,stop}</text>

  <!-- enumerate -->
  <rect x="40" y="320" width="200" height="80" rx="10" fill="#0f1b2d" stroke="#22c55e" stroke-width="1.6"/>
  <text x="140" y="348" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="600">Enumerate</text>
  <text x="140" y="368" text-anchor="middle" fill="#8ea3b8" font-size="11">gather more evidence</text>
  <text x="140" y="386" text-anchor="middle" fill="#8ea3b8" font-size="10">loops back to state</text>

  <!-- validate -->
  <rect x="300" y="320" width="200" height="80" rx="10" fill="#0f1b2d" stroke="#f97316" stroke-width="1.6"/>
  <text x="400" y="348" text-anchor="middle" fill="#f97316" font-size="14" font-weight="600">Validate</text>
  <text x="400" y="368" text-anchor="middle" fill="#8ea3b8" font-size="11">needs in-scope</text>
  <text x="400" y="386" text-anchor="middle" fill="#8ea3b8" font-size="10">+ capability</text>

  <!-- stop -->
  <rect x="560" y="320" width="200" height="80" rx="10" fill="#0f1b2d" stroke="#e11d2a" stroke-width="1.6"/>
  <text x="660" y="348" text-anchor="middle" fill="#e11d2a" font-size="14" font-weight="600">Stop</text>
  <text x="660" y="368" text-anchor="middle" fill="#8ea3b8" font-size="11">diminishing returns</text>
  <text x="660" y="386" text-anchor="middle" fill="#8ea3b8" font-size="10">or out of scope</text>

  <!-- arrows -->
  <line x1="400" y1="140" x2="400" y2="173" stroke="#00d4ff" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <line x1="340" y1="245" x2="180" y2="318" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="230" y="285" text-anchor="middle" fill="#22c55e" font-size="11">enumerate</text>
  <line x1="400" y1="245" x2="400" y2="318" stroke="#f97316" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <text x="450" y="285" text-anchor="middle" fill="#f97316" font-size="11">validate</text>
  <line x1="460" y1="245" x2="620" y2="318" stroke="#e11d2a" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="575" y="285" text-anchor="middle" fill="#e11d2a" font-size="11">stop</text>

  <!-- enumerate loop back -->
  <path d="M 140 400 L 140 470 L 250 470 L 250 110 L 298 110" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-green)"/>
  <text x="250" y="490" text-anchor="middle" fill="#22c55e" font-size="10">loop: gather more, re-evaluate</text>
  <!-- ===== END BODY ===== -->

  <!-- footer -->
  <text x="400" y="585" text-anchor="middle" fill="#3d4c5e" font-size="11">System One Security — JEV &amp; Laya · Red Team Leaders</text>
</svg>
