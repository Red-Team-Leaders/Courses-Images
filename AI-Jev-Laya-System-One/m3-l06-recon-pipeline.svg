<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2d3d" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#00d4ff"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#22c55e"/></marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#f97316"/></marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#8b5cf6"/></marker>
    <marker id="arrow-gold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#eab308"/></marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#e11d2a"/></marker>
    <marker id="arrow-white" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/></marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- background -->
  <rect width="800" height="600" fill="#0d1117"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <!-- title -->
  <text x="400" y="38" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">Recon Decision Pipeline</text>
  <line x1="60" y1="52" x2="740" y2="52" stroke="#e11d2a" stroke-width="2"/>

  <!-- ===== BODY ===== -->
  <!-- inputs -->
  <rect x="40" y="90" width="200" height="55" rx="10" fill="#0f1b2d" stroke="#00d4ff" stroke-width="1.6"/>
  <text x="140" y="113" text-anchor="middle" fill="#00d4ff" font-size="13" font-weight="600">Synthetic Nmap XML</text>
  <text x="140" y="131" text-anchor="middle" fill="#8ea3b8" font-size="10">hosts / ports</text>

  <rect x="40" y="160" width="200" height="55" rx="10" fill="#0f1b2d" stroke="#22c55e" stroke-width="1.6"/>
  <text x="140" y="183" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="600">Web-scanner JSONL</text>
  <text x="140" y="201" text-anchor="middle" fill="#8ea3b8" font-size="10">endpoints / findings</text>

  <!-- Ingest/parse -->
  <rect x="310" y="120" width="170" height="65" rx="10" fill="#0f1b2d" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="395" y="148" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Ingest / parse</text>
  <text x="395" y="168" text-anchor="middle" fill="#8ea3b8" font-size="10">unified state</text>

  <!-- Triage contract -->
  <rect x="550" y="120" width="210" height="65" rx="10" fill="#0f1b2d" stroke="#8b5cf6" stroke-width="1.6"/>
  <text x="655" y="148" text-anchor="middle" fill="#8b5cf6" font-size="13" font-weight="600">Triage contract</text>
  <text x="655" y="168" text-anchor="middle" fill="#8ea3b8" font-size="10">service / stack / interest</text>

  <!-- Attack-surface prioritization -->
  <rect x="530" y="280" width="230" height="75" rx="10" fill="#0f1b2d" stroke="#f97316" stroke-width="1.6"/>
  <text x="645" y="308" text-anchor="middle" fill="#f97316" font-size="13" font-weight="600">Attack-surface priority</text>
  <text x="645" y="328" text-anchor="middle" fill="#8ea3b8" font-size="11">composite score</text>
  <text x="645" y="345" text-anchor="middle" fill="#8ea3b8" font-size="10">rank targets</text>

  <!-- Next-step selection -->
  <rect x="300" y="285" width="190" height="70" rx="10" fill="#0f1b2d" stroke="#00d4ff" stroke-width="1.6"/>
  <text x="395" y="313" text-anchor="middle" fill="#00d4ff" font-size="13" font-weight="600">Next-step selection</text>
  <text x="395" y="333" text-anchor="middle" fill="#8ea3b8" font-size="11">pick best action</text>

  <!-- Scope check -->
  <rect x="300" y="410" width="190" height="65" rx="10" fill="#0f1b2d" stroke="#eab308" stroke-width="1.6"/>
  <text x="395" y="438" text-anchor="middle" fill="#eab308" font-size="13" font-weight="600">Scope check</text>
  <text x="395" y="457" text-anchor="middle" fill="#8ea3b8" font-size="10">in-scope guardrail</text>

  <!-- Proposes next PERMITTED step -->
  <rect x="80" y="405" width="190" height="75" rx="10" fill="#0f1b2d" stroke="#22c55e" stroke-width="1.6"/>
  <text x="175" y="433" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="600">Next PERMITTED</text>
  <text x="175" y="451" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="600">step</text>
  <text x="175" y="469" text-anchor="middle" fill="#8ea3b8" font-size="10">proposed action</text>

  <!-- arrows -->
  <line x1="240" y1="118" x2="308" y2="145" stroke="#00d4ff" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <line x1="240" y1="185" x2="308" y2="160" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <line x1="480" y1="152" x2="548" y2="152" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-white)"/>
  <line x1="655" y1="185" x2="650" y2="278" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
  <line x1="530" y1="318" x2="492" y2="318" stroke="#f97316" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <line x1="395" y1="355" x2="395" y2="408" stroke="#00d4ff" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <line x1="300" y1="443" x2="272" y2="443" stroke="#eab308" stroke-width="1.8" marker-end="url(#arrow-gold)"/>
  <!-- ===== END BODY ===== -->

  <!-- footer -->
  <text x="400" y="585" text-anchor="middle" fill="#3d4c5e" font-size="11">System One Security — JEV &amp; Laya · Red Team Leaders</text>
</svg>
