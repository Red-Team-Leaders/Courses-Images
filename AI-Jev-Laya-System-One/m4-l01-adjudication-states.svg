<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2d3d" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#00d4ff"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#22c55e"/></marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#f97316"/></marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#8b5cf6"/></marker>
    <marker id="arrow-gold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#eab308"/></marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#e11d2a"/></marker>
    <marker id="arrow-white" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/></marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- background -->
  <rect width="800" height="600" fill="#0d1117"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <!-- title -->
  <text x="400" y="38" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">Finding Adjudication States</text>
  <line x1="60" y1="52" x2="740" y2="52" stroke="#e11d2a" stroke-width="2"/>

  <!-- ===== BODY ===== -->
  <!-- HYPOTHESIS -->
  <rect x="300" y="110" width="200" height="80" rx="10" fill="#0f1b2d" stroke="#eab308" stroke-width="1.8"/>
  <text x="400" y="145" text-anchor="middle" fill="#eab308" font-size="15" font-weight="700">HYPOTHESIS</text>
  <text x="400" y="167" text-anchor="middle" fill="#8ea3b8" font-size="11">unconfirmed finding</text>

  <!-- evidence node (noul) -->
  <rect x="300" y="300" width="200" height="80" rx="10" fill="#0f1b2d" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="400" y="330" text-anchor="middle" fill="#8b5cf6" font-size="14" font-weight="600">Evidence demonstrates</text>
  <text x="400" y="349" text-anchor="middle" fill="#8b5cf6" font-size="14" font-weight="600">impact?</text>
  <text x="400" y="368" text-anchor="middle" fill="#8ea3b8" font-size="11">noul (yes / no / unsure)</text>

  <!-- CONFIRMED -->
  <rect x="580" y="110" width="180" height="80" rx="10" fill="#0f1b2d" stroke="#22c55e" stroke-width="1.8"/>
  <text x="670" y="145" text-anchor="middle" fill="#22c55e" font-size="15" font-weight="700">CONFIRMED</text>
  <text x="670" y="167" text-anchor="middle" fill="#8ea3b8" font-size="11">true positive</text>

  <!-- FALSE POSITIVE -->
  <rect x="40" y="110" width="180" height="80" rx="10" fill="#0f1b2d" stroke="#e11d2a" stroke-width="1.8"/>
  <text x="130" y="145" text-anchor="middle" fill="#e11d2a" font-size="15" font-weight="700">FALSE POSITIVE</text>
  <text x="130" y="167" text-anchor="middle" fill="#8ea3b8" font-size="11">evidence refutes</text>

  <!-- ABSTAIN / stays -->
  <rect x="580" y="420" width="180" height="80" rx="10" fill="#0f1b2d" stroke="#f97316" stroke-width="1.6"/>
  <text x="670" y="452" text-anchor="middle" fill="#f97316" font-size="14" font-weight="700">ABSTAIN</text>
  <text x="670" y="472" text-anchor="middle" fill="#8ea3b8" font-size="11">insufficient evidence</text>
  <text x="670" y="489" text-anchor="middle" fill="#8ea3b8" font-size="10">stays hypothesis</text>

  <!-- HYPOTHESIS <-> CONFIRMED -->
  <line x1="500" y1="140" x2="578" y2="140" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="540" y="128" text-anchor="middle" fill="#22c55e" font-size="10">impact demonstrated</text>
  <line x1="578" y1="165" x2="500" y2="165" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow-white)"/>
  <text x="540" y="185" text-anchor="middle" fill="#8ea3b8" font-size="10">re-open</text>

  <!-- HYPOTHESIS -> FALSE POSITIVE -->
  <line x1="300" y1="150" x2="222" y2="150" stroke="#e11d2a" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="260" y="138" text-anchor="middle" fill="#e11d2a" font-size="10">evidence refutes</text>

  <!-- HYPOTHESIS <-> evidence node -->
  <line x1="400" y1="190" x2="400" y2="298" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
  <text x="480" y="248" text-anchor="middle" fill="#8ea3b8" font-size="10">weigh evidence</text>

  <!-- evidence node feeds CONFIRMED -->
  <line x1="500" y1="330" x2="640" y2="192" stroke="#22c55e" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <!-- evidence node feeds FALSE POSITIVE -->
  <line x1="300" y1="330" x2="150" y2="192" stroke="#e11d2a" stroke-width="1.6" marker-end="url(#arrow-red)"/>
  <!-- evidence node -> ABSTAIN -->
  <line x1="500" y1="355" x2="578" y2="440" stroke="#f97316" stroke-width="1.6" marker-end="url(#arrow-orange)"/>
  <text x="560" y="395" text-anchor="middle" fill="#f97316" font-size="10">insufficient</text>

  <!-- ABSTAIN loops back to hypothesis -->
  <path d="M 660 420 L 660 210 L 500 130" fill="none" stroke="#f97316" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow-orange)"/>
  <!-- ===== END BODY ===== -->

  <!-- footer -->
  <text x="400" y="585" text-anchor="middle" fill="#3d4c5e" font-size="11">System One Security — JEV &amp; Laya · Red Team Leaders</text>
</svg>
