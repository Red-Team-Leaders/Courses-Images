<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2d3d" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#00d4ff"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#22c55e"/></marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#f97316"/></marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#8b5cf6"/></marker>
    <marker id="arrow-gold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#eab308"/></marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#e11d2a"/></marker>
    <marker id="arrow-white" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/></marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- background -->
  <rect width="800" height="600" fill="#0d1117"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <!-- title -->
  <text x="400" y="38" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">Calibration &amp; ECE</text>
  <line x1="60" y1="52" x2="740" y2="52" stroke="#e11d2a" stroke-width="2"/>

  <!-- ===== BODY: reliability diagram ===== -->
  <!-- plot area x:200..600  y:120(top,=1.0)..480(bottom,=0) -->
  <!-- axes -->
  <line x1="200" y1="480" x2="600" y2="480" stroke="#8ea3b8" stroke-width="1.6"/>
  <line x1="200" y1="480" x2="200" y2="120" stroke="#8ea3b8" stroke-width="1.6"/>
  <!-- axis ticks / labels -->
  <text x="200" y="498" text-anchor="middle" fill="#8ea3b8" font-size="11">0</text>
  <text x="600" y="498" text-anchor="middle" fill="#8ea3b8" font-size="11">1.0</text>
  <text x="188" y="484" text-anchor="end" fill="#8ea3b8" font-size="11">0</text>
  <text x="188" y="124" text-anchor="end" fill="#8ea3b8" font-size="11">1.0</text>
  <text x="400" y="520" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">predicted confidence</text>
  <text x="150" y="300" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600" transform="rotate(-90 150 300)">observed accuracy</text>

  <!-- perfect calibration diagonal (dashed) -->
  <line x1="200" y1="480" x2="600" y2="120" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="470" y="175" fill="#94a3b8" font-size="12" transform="rotate(-42 470 175)">perfect calibration</text>

  <!-- gap shading (predicted &gt; accuracy = overconfident) -->
  <rect x="273" y="408" width="14" height="18" fill="#f97316" fill-opacity="0.22"/>
  <rect x="353" y="336" width="14" height="43" fill="#f97316" fill-opacity="0.22"/>
  <rect x="433" y="264" width="14" height="65" fill="#f97316" fill-opacity="0.22"/>
  <rect x="513" y="192" width="14" height="90" fill="#f97316" fill-opacity="0.22"/>
  <rect x="573" y="138" width="14" height="108" fill="#f97316" fill-opacity="0.22"/>

  <!-- overconfident curve through binned points -->
  <polyline points="280,426 360,379 440,329 520,282 580,246" fill="none" stroke="#f97316" stroke-width="2.4"/>
  <circle cx="280" cy="426" r="5" fill="#f97316"/>
  <circle cx="360" cy="379" r="5" fill="#f97316"/>
  <circle cx="440" cy="329" r="5" fill="#f97316"/>
  <circle cx="520" cy="282" r="5" fill="#f97316"/>
  <circle cx="580" cy="246" r="5" fill="#f97316"/>

  <!-- ECE label + arrow to largest gap -->
  <text x="612" y="300" fill="#eab308" font-size="14" font-weight="700">ECE = mean gap</text>
  <text x="612" y="318" fill="#8ea3b8" font-size="11">avg | conf − accuracy |</text>
  <line x1="610" y1="290" x2="533" y2="240" stroke="#eab308" stroke-width="1.6" marker-end="url(#arrow-gold)"/>

  <!-- legend -->
  <rect x="222" y="138" width="150" height="52" rx="8" fill="#0f1b2d" stroke="#1e2d3d" stroke-width="1"/>
  <line x1="234" y1="154" x2="258" y2="154" stroke="#f97316" stroke-width="2.4"/>
  <text x="264" y="158" fill="#8ea3b8" font-size="11">binned accuracy</text>
  <line x1="234" y1="176" x2="258" y2="176" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="264" y="180" fill="#8ea3b8" font-size="11">ideal (y = x)</text>

  <!-- note -->
  <text x="400" y="552" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="600">Temperature scaling shrinks the gap toward the diagonal.</text>
  <!-- ===== END BODY ===== -->

  <!-- footer -->
  <text x="400" y="585" text-anchor="middle" fill="#3d4c5e" font-size="11">System One Security — JEV &amp; Laya · Red Team Leaders</text>
</svg>
