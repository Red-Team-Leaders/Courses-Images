<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2d3d" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#00d4ff"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#22c55e"/></marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#f97316"/></marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#8b5cf6"/></marker>
    <marker id="arrow-gold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#eab308"/></marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#e11d2a"/></marker>
    <marker id="arrow-white" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/></marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- background -->
  <rect width="800" height="600" fill="#0d1117"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <!-- title -->
  <text x="400" y="38" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">Build Your Own System One Model</text>
  <line x1="60" y1="52" x2="740" y2="52" stroke="#e11d2a" stroke-width="2"/>

  <!-- ===== BODY: training loop ===== -->
  <!-- node 1: Label data -->
  <rect x="60" y="108" width="200" height="70" rx="10" fill="#0f1b2d" stroke="#00d4ff" stroke-width="1.6"/>
  <text x="160" y="136" text-anchor="middle" fill="#00d4ff" font-size="14" font-weight="600">1 · Label data</text>
  <text x="160" y="156" text-anchor="middle" fill="#8ea3b8" font-size="11">jsonl { state, questions, labels }</text>

  <!-- node 2: Train -->
  <rect x="300" y="108" width="200" height="70" rx="10" fill="#0f1b2d" stroke="#8b5cf6" stroke-width="1.6"/>
  <text x="400" y="132" text-anchor="middle" fill="#8b5cf6" font-size="14" font-weight="600">2 · Train (Laya)</text>
  <text x="400" y="150" text-anchor="middle" fill="#8ea3b8" font-size="11">proper scoring rules</text>
  <text x="400" y="166" text-anchor="middle" fill="#8ea3b8" font-size="11">head_checkpointing</text>

  <!-- node 3: Temperature-fit -->
  <rect x="540" y="108" width="200" height="70" rx="10" fill="#0f1b2d" stroke="#eab308" stroke-width="1.6"/>
  <text x="640" y="136" text-anchor="middle" fill="#eab308" font-size="14" font-weight="600">3 · Temperature-fit</text>
  <text x="640" y="156" text-anchor="middle" fill="#8ea3b8" font-size="11">calibration</text>

  <!-- node 4: Evaluate -->
  <rect x="540" y="338" width="200" height="70" rx="10" fill="#0f1b2d" stroke="#22c55e" stroke-width="1.6"/>
  <text x="640" y="366" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="600">4 · Evaluate</text>
  <text x="640" y="386" text-anchor="middle" fill="#8ea3b8" font-size="11">laya-evals: accuracy + ECE</text>

  <!-- node 5: Ship checkpoint -->
  <rect x="300" y="338" width="200" height="70" rx="10" fill="#0f1b2d" stroke="#f97316" stroke-width="1.6"/>
  <text x="400" y="366" text-anchor="middle" fill="#f97316" font-size="14" font-weight="600">5 · Ship checkpoint</text>
  <text x="400" y="386" text-anchor="middle" fill="#8ea3b8" font-size="11">laya-typed-decisions</text>

  <!-- node 6: Wire behind contract -->
  <rect x="60" y="338" width="200" height="70" rx="10" fill="#0f1b2d" stroke="#00d4ff" stroke-width="1.6"/>
  <text x="160" y="366" text-anchor="middle" fill="#00d4ff" font-size="14" font-weight="600">6 · Wire in</text>
  <text x="160" y="386" text-anchor="middle" fill="#8ea3b8" font-size="11">behind the SAME contract</text>

  <!-- arrows: 1->2->3 (top), 3->4 (down), 4->5->6 (bottom, leftward), 6->1 (up, loop) -->
  <line x1="260" y1="143" x2="296" y2="143" stroke="#00d4ff" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <line x1="500" y1="143" x2="536" y2="143" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
  <line x1="640" y1="178" x2="640" y2="334" stroke="#eab308" stroke-width="1.8" marker-end="url(#arrow-gold)"/>
  <line x1="540" y1="373" x2="504" y2="373" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <line x1="300" y1="373" x2="264" y2="373" stroke="#f97316" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <line x1="160" y1="338" x2="160" y2="182" stroke="#00d4ff" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-cyan)"/>
  <text x="176" y="262" fill="#8ea3b8" font-size="11">iterate</text>

  <!-- center callout: accuracy uplift -->
  <rect x="288" y="212" width="224" height="96" rx="12" fill="#0f1b2d" stroke="#eab308" stroke-width="1.8" filter="url(#glow)"/>
  <text x="400" y="238" text-anchor="middle" fill="#eab308" font-size="13" font-weight="700">Accuracy uplift</text>
  <text x="400" y="276" text-anchor="middle" fill="#22c55e" font-size="26" font-weight="700">0.36 → 0.766</text>
  <text x="400" y="298" text-anchor="middle" fill="#8ea3b8" font-size="11">base → fine-tuned</text>

  <!-- note -->
  <text x="400" y="470" text-anchor="middle" fill="#8ea3b8" font-size="12">Same typed contract in and out — the harness never changes as the model improves.</text>
  <!-- ===== END BODY ===== -->

  <!-- footer -->
  <text x="400" y="585" text-anchor="middle" fill="#3d4c5e" font-size="11">System One Security — JEV &amp; Laya · Red Team Leaders</text>
</svg>
