<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2d3d" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#00d4ff"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#22c55e"/></marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#f97316"/></marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#8b5cf6"/></marker>
    <marker id="arrow-gold" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#eab308"/></marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#e11d2a"/></marker>
    <marker id="arrow-white" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/></marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- background -->
  <rect width="800" height="600" fill="#0d1117"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <!-- title -->
  <text x="400" y="38" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">Capstone: Auditable Decision Layer</text>
  <line x1="60" y1="52" x2="740" y2="52" stroke="#e11d2a" stroke-width="2"/>

  <!-- ===== BODY: end-to-end architecture ===== -->
  <!-- 1 Engagement scope -->
  <rect x="40" y="82" width="185" height="56" rx="10" fill="#0f1b2d" stroke="#00d4ff" stroke-width="1.6"/>
  <text x="132" y="106" text-anchor="middle" fill="#00d4ff" font-size="13" font-weight="600">Engagement scope</text>
  <text x="132" y="125" text-anchor="middle" fill="#8ea3b8" font-size="11">config: targets · methods</text>

  <!-- 2 Evidence / state -->
  <rect x="40" y="154" width="185" height="56" rx="10" fill="#0f1b2d" stroke="#00d4ff" stroke-width="1.6"/>
  <text x="132" y="178" text-anchor="middle" fill="#00d4ff" font-size="13" font-weight="600">Evidence / state</text>
  <text x="132" y="197" text-anchor="middle" fill="#8ea3b8" font-size="11">scans · findings · context</text>

  <!-- 3 Decision layer -->
  <rect x="275" y="96" width="185" height="86" rx="10" fill="#0f1b2d" stroke="#8b5cf6" stroke-width="1.6"/>
  <text x="367" y="124" text-anchor="middle" fill="#8b5cf6" font-size="13" font-weight="600">Decision layer</text>
  <text x="367" y="143" text-anchor="middle" fill="#8ea3b8" font-size="11">JEV / Laya adapters</text>
  <text x="367" y="160" text-anchor="middle" fill="#8ea3b8" font-size="11">typed contract</text>

  <!-- 4 Verdict + gate -->
  <rect x="510" y="96" width="245" height="86" rx="10" fill="#0f1b2d" stroke="#eab308" stroke-width="1.6"/>
  <text x="632" y="124" text-anchor="middle" fill="#eab308" font-size="13" font-weight="600">Verdict (evidence-linked)</text>
  <text x="632" y="143" text-anchor="middle" fill="#8ea3b8" font-size="11">recommendation + confidence</text>
  <text x="632" y="162" text-anchor="middle" fill="#8ea3b8" font-size="11">confidence gate</text>

  <!-- 5 Policy engine -->
  <rect x="510" y="228" width="245" height="86" rx="10" fill="#0f1b2d" stroke="#22c55e" stroke-width="1.6"/>
  <text x="632" y="256" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="600">Policy engine</text>
  <text x="632" y="275" text-anchor="middle" fill="#8ea3b8" font-size="11">scope + rules</text>
  <text x="632" y="292" text-anchor="middle" fill="#8ea3b8" font-size="11">human approval</text>

  <!-- 6 Capability token -->
  <rect x="275" y="240" width="185" height="64" rx="10" fill="#0f1b2d" stroke="#f97316" stroke-width="1.6"/>
  <text x="367" y="268" text-anchor="middle" fill="#f97316" font-size="13" font-weight="600">Capability token</text>
  <text x="367" y="287" text-anchor="middle" fill="#8ea3b8" font-size="11">signed HMAC · ttl</text>

  <!-- 7 Harness action -->
  <rect x="250" y="368" width="300" height="62" rx="10" fill="#0f1b2d" stroke="#e11d2a" stroke-width="1.6"/>
  <text x="400" y="395" text-anchor="middle" fill="#e11d2a" font-size="14" font-weight="600">Authorized pentest harness action</text>
  <text x="400" y="414" text-anchor="middle" fill="#8ea3b8" font-size="11">verifies token before executing</text>

  <!-- 8 Audit trail -->
  <rect x="40" y="470" width="250" height="74" rx="10" fill="#0f1b2d" stroke="#8b5cf6" stroke-width="1.6"/>
  <text x="165" y="498" text-anchor="middle" fill="#8b5cf6" font-size="13" font-weight="600">Tamper-evident audit trail</text>
  <text x="165" y="517" text-anchor="middle" fill="#8ea3b8" font-size="11">hash chain of every</text>
  <text x="165" y="533" text-anchor="middle" fill="#8ea3b8" font-size="11">decision + action</text>

  <!-- 9 Evaluation results -->
  <rect x="470" y="470" width="285" height="74" rx="10" fill="#0f1b2d" stroke="#22c55e" stroke-width="1.6"/>
  <text x="612" y="498" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="600">Evaluation results</text>
  <text x="612" y="517" text-anchor="middle" fill="#8ea3b8" font-size="11">accuracy + ECE from</text>
  <text x="612" y="533" text-anchor="middle" fill="#8ea3b8" font-size="11">logged decisions</text>

  <!-- arrows -->
  <line x1="225" y1="110" x2="271" y2="126" stroke="#00d4ff" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <line x1="225" y1="182" x2="271" y2="158" stroke="#00d4ff" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <line x1="460" y1="139" x2="506" y2="139" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
  <text x="483" y="130" text-anchor="middle" fill="#8ea3b8" font-size="10">verdict</text>

  <line x1="632" y1="182" x2="632" y2="224" stroke="#eab308" stroke-width="1.8" marker-end="url(#arrow-gold)"/>
  <text x="648" y="208" fill="#8ea3b8" font-size="10">gate</text>

  <line x1="510" y1="272" x2="464" y2="272" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="487" y="263" text-anchor="middle" fill="#22c55e" font-size="10">ALLOW</text>

  <line x1="367" y1="304" x2="390" y2="364" stroke="#f97316" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <text x="345" y="340" fill="#8ea3b8" font-size="10">mint</text>

  <line x1="330" y1="430" x2="215" y2="466" stroke="#e11d2a" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="238" y="452" fill="#8ea3b8" font-size="10">log</text>

  <line x1="290" y1="507" x2="466" y2="507" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="378" y="498" text-anchor="middle" fill="#8ea3b8" font-size="10">compute metrics</text>

  <!-- feedback dashed: eval -> decision layer -->
  <path d="M 612 470 L 612 340 L 770 340 L 770 60 L 367 60 L 367 92" fill="none" stroke="#eab308" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-gold)"/>
  <text x="600" y="54" text-anchor="middle" fill="#eab308" font-size="10">recalibrate / retrain</text>
  <!-- ===== END BODY ===== -->

  <!-- footer -->
  <text x="400" y="585" text-anchor="middle" fill="#3d4c5e" font-size="11">System One Security — JEV &amp; Laya · Red Team Leaders</text>
</svg>
