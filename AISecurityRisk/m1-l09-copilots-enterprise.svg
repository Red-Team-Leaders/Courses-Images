  <rect x="316" y="82" width="168" height="46" rx="6" fill="#0a2015" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="316" y="82" width="168" height="12" rx="4" fill="#22c55e" opacity="0.3"/>
  <text x="400" y="93" fill="#22c55e" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" font-weight="bold">KNOWLEDGE BASE</text>
