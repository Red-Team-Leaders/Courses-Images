  <text x="670" y="401" fill="#eab308" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" font-weight="bold">HR SYSTEMS</text>
  <text x="670" y="415" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="7.5" text-anchor="middle">Workday · ADP</text>
  <text x="670" y="426" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="7.5" text-anchor="middle">People Data</text>
  <text x="670" y="436" fill="#8b96a8" font-family="'Courier New', monospace" font-size="7" text-anchor="middle">HRIS / Payroll</text>

  <!-- ServiceNow (green variant) - bottom center -->
  <rect x="316" y="440" width="168" height="46" rx="6" fill="#0a1a0a" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="316" y="440" width="168" height="12" rx="4" fill="#22c55e" opacity="0.3"/>
  <text x="400" y="451" fill="#22c55e" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" font-weight="bold">ITSM / ServiceNow AI</text>
  <text x="400" y="465" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="7.5" text-anchor="middle">Ticketing · CMDB · Workflows</text>
