  <text x="130" y="401" fill="#06b6d4" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" font-weight="bold">BI / ANALYTICS</text>
  <text x="130" y="415" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="7.5" text-anchor="middle">Power BI · Tableau</text>
  <text x="130" y="426" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="7.5" text-anchor="middle">Data Warehouse</text>
  <text x="130" y="436" fill="#8b96a8" font-family="'Courier New', monospace" font-size="7" text-anchor="middle">Reporting Layer</text>

  <!-- HR Systems (gold) - bottom-right -->
  <rect x="620" y="390" width="100" height="50" rx="6" fill="#1a1600" stroke="#eab308" stroke-width="1.5"/>
