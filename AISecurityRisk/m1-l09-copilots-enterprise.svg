<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2332" stroke-width="0.5"/>
    </pattern>
    <!-- Glow filter for AI core -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Soft glow for rings -->
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Arrow marker cyan -->
    <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00d4ff" opacity="0.8"/>
    </marker>
    <!-- Arrow marker green -->
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e" opacity="0.8"/>
    </marker>
    <!-- Arrow marker blue -->
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a9eff" opacity="0.8"/>
    </marker>
    <!-- Gradient for AI core -->
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <!-- Gradient for middleware ring -->
    <radialGradient id="midRingGrad" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="transparent"/>
      <stop offset="90%" stop-color="#4a9eff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <!-- Gradient for security ring -->
    <radialGradient id="secRingGrad" cx="50%" cy="50%" r="50%">
      <stop offset="90%" stop-color="transparent"/>
      <stop offset="95%" stop-color="#ef4444" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Dark background -->
  <rect width="800" height="600" fill="#0d1117"/>
  <!-- Grid overlay -->
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Title -->
  <text x="400" y="32" fill="#ffffff" font-family="'Courier New', monospace" font-size="17" font-weight="bold" text-anchor="middle">Enterprise AI Copilot Integration Architecture</text>
  <text x="400" y="52" fill="#8b96a8" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">AI Security Risk | Module 1 · Lesson 9</text>

  <!-- === OUTER SECURITY & COMPLIANCE RING === -->
  <circle cx="400" cy="295" r="248" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <text x="400" y="60" fill="#ef4444" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" opacity="0.8">SECURITY &amp; COMPLIANCE LAYER</text>
  <!-- Security ring labels -->
  <text x="174" y="185" fill="#ef4444" font-family="'Courier New', monospace" font-size="8" text-anchor="middle" opacity="0.7">DLP</text>
  <text x="626" y="185" fill="#ef4444" font-family="'Courier New', monospace" font-size="8" text-anchor="middle" opacity="0.7">AUDIT</text>
  <text x="154" y="390" fill="#ef4444" font-family="'Courier New', monospace" font-size="8" text-anchor="middle" opacity="0.7">SIEM</text>
  <text x="644" y="390" fill="#ef4444" font-family="'Courier New', monospace" font-size="8" text-anchor="middle" opacity="0.7">IAM</text>

