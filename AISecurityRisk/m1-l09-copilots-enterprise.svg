  <text x="676" y="159" fill="#f97316" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" font-weight="bold">ERP</text>
  <text x="676" y="172" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="7.5" text-anchor="middle">SAP / Oracle</text>
  <text x="676" y="183" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="7.5" text-anchor="middle">Finance &amp; Ops</text>
