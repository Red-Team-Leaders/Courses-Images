  <!-- AI Core glow halo -->
  <circle cx="400" cy="295" r="100" fill="url(#coreGrad)"/>

  <!-- === AI/LLM CORE === -->
  <circle cx="400" cy="295" r="62" fill="#0d1117" stroke="#00d4ff" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="400" cy="295" r="54" fill="#0f1f2e" stroke="#00d4ff" stroke-width="0.5" opacity="0.6"/>
  <!-- Core inner pattern -->
  <line x1="370" y1="295" x2="430" y2="295" stroke="#00d4ff" stroke-width="0.5" opacity="0.4"/>
  <line x1="400" y1="265" x2="400" y2="325" stroke="#00d4ff" stroke-width="0.5" opacity="0.4"/>
  <circle cx="400" cy="295" r="20" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.6"/>
  <!-- Brain-like nodes in core -->
  <circle cx="388" cy="283" r="4" fill="#00d4ff" opacity="0.7"/>
  <circle cx="412" cy="283" r="4" fill="#8b5cf6" opacity="0.7"/>
  <circle cx="400" cy="307" r="4" fill="#00d4ff" opacity="0.7"/>
  <line x1="388" y1="283" x2="412" y2="283" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  <line x1="388" y1="283" x2="400" y2="307" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
  <line x1="412" y1="283" x2="400" y2="307" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  <text x="400" y="276" fill="#00d4ff" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" font-weight="bold">AI / LLM</text>
  <text x="400" y="323" fill="#8b5cf6" font-family="'Courier New', monospace" font-size="8" text-anchor="middle">CORE</text>

  <!-- === ENTERPRISE SYSTEM NODES === -->
  <!-- CRM (blue) - top-left -->
  <rect x="80" y="148" width="88" height="50" rx="6" fill="#0d2244" stroke="#4a9eff" stroke-width="1.5"/>
  <rect x="80" y="148" width="88" height="12" rx="4" fill="#4a9eff" opacity="0.3"/>
  <text x="124" y="159" fill="#4a9eff" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" font-weight="bold">CRM</text>
  <text x="124" y="172" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="7.5" text-anchor="middle">Salesforce</text>
  <text x="124" y="183" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="7.5" text-anchor="middle">Einstein AI</text>
  <text x="124" y="193" fill="#8b96a8" font-family="'Courier New', monospace" font-size="7" text-anchor="middle">Customer Data</text>

  <!-- ERP (orange) - top-right -->
  <rect x="632" y="148" width="88" height="50" rx="6" fill="#271a06" stroke="#f97316" stroke-width="1.5"/>
