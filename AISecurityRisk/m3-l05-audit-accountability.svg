<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2d3d" stroke-width="0.5"/>
    </pattern>

    <linearGradient id="topbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a9eff"/>
      <stop offset="33%" stop-color="#8b5cf6"/>
      <stop offset="66%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4a9eff"/>
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b27"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="blueBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2040"/>
    </linearGradient>

    <linearGradient id="purpleBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d1b4e"/>
      <stop offset="100%" stop-color="#1a0f30"/>
    </linearGradient>

    <linearGradient id="greenBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#0a2e1a"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="115%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="800" height="600" fill="#0d1117"/>
  <rect width="800" height="600" fill="url(#grid)" opacity="0.5"/>

  <!-- Top gradient bar -->
  <rect x="0" y="0" width="800" height="4" fill="url(#topbar)"/>

  <!-- Header area -->
  <rect x="0" y="4" width="800" height="56" fill="url(#headerGrad)" opacity="0.9"/>

  <!-- Title -->
  <text x="400" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Audit, Evidence Trails &amp; Accountability in AI</text>
  <text x="400" y="44" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8b9ab0" text-anchor="middle">Lesson 3.5 · AI Security Risk · Module 3: Governance &amp; Compliance</text>

  <!-- ===== LEFT COLUMN: Evidence Chain ===== -->
  <text x="30" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#4a9eff" text-anchor="start" letter-spacing="1">EVIDENCE CHAIN</text>

  <!-- Chain connector line (vertical) -->
  <line x1="67" y1="92" x2="67" y2="548" stroke="#334155" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Helper macro: each chain link row
       Blue links at: 92, 148, 204, 316, 372, 428, 484
       Purple links at: 260, 540
       Actually let's alternate: B,P,B,P,B,P,B,P,B -->

  <!-- Link 1 - Blue: Training Data Provenance -->
  <rect x="20" y="92" width="420" height="44" rx="6" fill="url(#blueBox)" stroke="#4a9eff" stroke-width="1.2" filter="url(#shadow)"/>
  <!-- Chain icon left -->
  <circle cx="50" cy="107" r="7" fill="none" stroke="#4a9eff" stroke-width="2"/>
  <circle cx="50" cy="121" r="7" fill="none" stroke="#4a9eff" stroke-width="2"/>
  <!-- Lock icon right -->
  <rect x="406" y="104" width="14" height="11" rx="2" fill="none" stroke="#4a9eff" stroke-width="1.5"/>
  <path d="M409 104 Q409 99 413 99 Q417 99 417 104" fill="none" stroke="#4a9eff" stroke-width="1.5"/>
  <circle cx="413" cy="110" r="1.5" fill="#4a9eff"/>
  <!-- Label -->
  <text x="70" y="109" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">1. Training Data Provenance</text>
  <text x="70" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#8b9ab0">Source lineage · Data cards · Version hashes · License records</text>

  <!-- Connector -->
  <line x1="67" y1="136" x2="67" y2="148" stroke="#4a9eff" stroke-width="1.5"/>
  <polygon points="63,146 67,152 71,146" fill="#4a9eff"/>

  <!-- Link 2 - Purple: Model Development Logs -->
  <rect x="20" y="152" width="420" height="44" rx="6" fill="url(#purpleBox)" stroke="#8b5cf6" stroke-width="1.2" filter="url(#shadow)"/>
  <circle cx="50" cy="167" r="7" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="50" cy="181" r="7" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="406" y="164" width="14" height="11" rx="2" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <path d="M409 164 Q409 159 413 159 Q417 159 417 164" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="413" cy="170" r="1.5" fill="#8b5cf6"/>
  <text x="70" y="169" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">2. Model Development Logs</text>
  <text x="70" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#8b9ab0">Experiment tracking · Hyperparameters · Training runs · Artifacts</text>

  <line x1="67" y1="196" x2="67" y2="208" stroke="#8b5cf6" stroke-width="1.5"/>
  <polygon points="63,206 67,212 71,206" fill="#8b5cf6"/>

  <!-- Link 3 - Blue: Testing Evidence -->
  <rect x="20" y="212" width="420" height="44" rx="6" fill="url(#blueBox)" stroke="#4a9eff" stroke-width="1.2" filter="url(#shadow)"/>
  <circle cx="50" cy="227" r="7" fill="none" stroke="#4a9eff" stroke-width="2"/>
  <circle cx="50" cy="241" r="7" fill="none" stroke="#4a9eff" stroke-width="2"/>
  <rect x="406" y="224" width="14" height="11" rx="2" fill="none" stroke="#4a9eff" stroke-width="1.5"/>
  <path d="M409 224 Q409 219 413 219 Q417 219 417 224" fill="none" stroke="#4a9eff" stroke-width="1.5"/>
  <circle cx="413" cy="230" r="1.5" fill="#4a9eff"/>
  <text x="70" y="229" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">3. Testing Evidence</text>
  <text x="70" y="245" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#8b9ab0">Bias tests · Red team reports · Benchmarks · Validation results</text>

  <line x1="67" y1="256" x2="67" y2="268" stroke="#4a9eff" stroke-width="1.5"/>
  <polygon points="63,266 67,272 71,266" fill="#4a9eff"/>

  <!-- Link 4 - Purple: Approval Records -->
  <rect x="20" y="272" width="420" height="44" rx="6" fill="url(#purpleBox)" stroke="#8b5cf6" stroke-width="1.2" filter="url(#shadow)"/>
  <circle cx="50" cy="287" r="7" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="50" cy="301" r="7" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="406" y="284" width="14" height="11" rx="2" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <path d="M409 284 Q409 279 413 279 Q417 279 417 284" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="413" cy="290" r="1.5" fill="#8b5cf6"/>
  <text x="70" y="289" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">4. Approval Records</text>
  <text x="70" y="305" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#8b9ab0">Review sign-offs · AIIA decisions · Risk acceptance · Ethics sign-off</text>

  <line x1="67" y1="316" x2="67" y2="328" stroke="#8b5cf6" stroke-width="1.5"/>
  <polygon points="63,326 67,332 71,326" fill="#8b5cf6"/>

  <!-- Link 5 - Blue: Deployment Records -->
  <rect x="20" y="332" width="420" height="44" rx="6" fill="url(#blueBox)" stroke="#4a9eff" stroke-width="1.2" filter="url(#shadow)"/>
  <circle cx="50" cy="347" r="7" fill="none" stroke="#4a9eff" stroke-width="2"/>
  <circle cx="50" cy="361" r="7" fill="none" stroke="#4a9eff" stroke-width="2"/>
  <rect x="406" y="344" width="14" height="11" rx="2" fill="none" stroke="#4a9eff" stroke-width="1.5"/>
  <path d="M409 344 Q409 339 413 339 Q417 339 417 344" fill="none" stroke="#4a9eff" stroke-width="1.5"/>
  <circle cx="413" cy="350" r="1.5" fill="#4a9eff"/>
  <text x="70" y="349" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">5. Deployment Records</text>
  <text x="70" y="365" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#8b9ab0">Config snapshots · Environment details · Release notes · Rollback plan</text>

  <line x1="67" y1="376" x2="67" y2="388" stroke="#4a9eff" stroke-width="1.5"/>
  <polygon points="63,386 67,392 71,386" fill="#4a9eff"/>

  <!-- Link 6 - Purple: Inference Logs -->
  <rect x="20" y="392" width="420" height="44" rx="6" fill="url(#purpleBox)" stroke="#8b5cf6" stroke-width="1.2" filter="url(#shadow)"/>
  <circle cx="50" cy="407" r="7" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="50" cy="421" r="7" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="406" y="404" width="14" height="11" rx="2" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <path d="M409 404 Q409 399 413 399 Q417 399 417 404" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="413" cy="410" r="1.5" fill="#8b5cf6"/>
  <text x="70" y="409" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">6. Inference Logs</text>
  <text x="70" y="425" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#8b9ab0">Input/output records · Decision timestamps · User IDs · Confidence scores</text>

  <line x1="67" y1="436" x2="67" y2="448" stroke="#8b5cf6" stroke-width="1.5"/>
  <polygon points="63,446 67,452 71,446" fill="#8b5cf6"/>

  <!-- Link 7 - Blue: Monitoring Reports -->
  <rect x="20" y="452" width="420" height="44" rx="6" fill="url(#blueBox)" stroke="#4a9eff" stroke-width="1.2" filter="url(#shadow)"/>
  <circle cx="50" cy="467" r="7" fill="none" stroke="#4a9eff" stroke-width="2"/>
  <circle cx="50" cy="481" r="7" fill="none" stroke="#4a9eff" stroke-width="2"/>
  <rect x="406" y="464" width="14" height="11" rx="2" fill="none" stroke="#4a9eff" stroke-width="1.5"/>
  <path d="M409 464 Q409 459 413 459 Q417 459 417 464" fill="none" stroke="#4a9eff" stroke-width="1.5"/>
  <circle cx="413" cy="470" r="1.5" fill="#4a9eff"/>
  <text x="70" y="469" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">7. Monitoring Reports</text>
  <text x="70" y="485" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#8b9ab0">Drift alerts · KPI dashboards · Bias metrics · Performance degradation</text>

  <line x1="67" y1="496" x2="67" y2="508" stroke="#4a9eff" stroke-width="1.5"/>
  <polygon points="63,506 67,512 71,506" fill="#4a9eff"/>

  <!-- Link 8 - Purple: Incident Records -->
  <rect x="20" y="512" width="420" height="36" rx="6" fill="url(#purpleBox)" stroke="#8b5cf6" stroke-width="1.2" filter="url(#shadow)"/>
  <circle cx="50" cy="524" r="6" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="50" cy="537" r="6" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="406" y="520" width="12" height="10" rx="2" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <path d="M408.5 520 Q408.5 516 412 516 Q415.5 516 415.5 520" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="412" cy="526" r="1.5" fill="#8b5cf6"/>
  <text x="70" y="527" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">8. Incident &amp; Audit Reports</text>
  <text x="70" y="541" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#8b9ab0">Findings · Root cause · Remediation · Lessons learned</text>

  <!-- ===== RIGHT COLUMN: Audit Types ===== -->
  <text x="470" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#22c55e" text-anchor="start" letter-spacing="1">AUDIT TYPES</text>

  <!-- Internal Audit -->
  <rect x="460" y="92" width="320" height="60" rx="6" fill="url(#greenBox)" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Magnifier icon -->
  <circle cx="488" cy="115" r="9" fill="none" stroke="#22c55e" stroke-width="2"/>
  <line x1="494" y1="121" x2="501" y2="128" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <text x="510" y="113" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#22c55e">Internal Audit</text>
  <text x="510" y="127" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#86efac">First-party · AI governance team · Ongoing · Quarterly or annual</text>
  <text x="510" y="141" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#86efac">Covers controls, policies, model cards, risk registers</text>

  <!-- External Audit -->
  <rect x="460" y="168" width="320" height="60" rx="6" fill="url(#greenBox)" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="488" cy="191" r="9" fill="none" stroke="#22c55e" stroke-width="2"/>
  <line x1="494" y1="197" x2="501" y2="204" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <text x="510" y="189" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#22c55e">External Audit</text>
  <text x="510" y="203" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#86efac">Independent firm · Certification · ISO 42001 · SOC-AI</text>
  <text x="510" y="217" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#86efac">Objective assurance · Board and regulator acceptance</text>

  <!-- Regulatory Audit -->
  <rect x="460" y="244" width="320" height="60" rx="6" fill="url(#greenBox)" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="488" cy="267" r="9" fill="none" stroke="#22c55e" stroke-width="2"/>
  <line x1="494" y1="273" x2="501" y2="280" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <text x="510" y="265" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#22c55e">Regulatory Audit</text>
  <text x="510" y="279" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#86efac">EU AI Act · GDPR · DORA · FCA · OCR enforcement</text>
  <text x="510" y="293" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#86efac">Compulsory production of logs · Sanctions for failures</text>

  <!-- Third-party Audit -->
  <rect x="460" y="320" width="320" height="60" rx="6" fill="url(#greenBox)" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="488" cy="343" r="9" fill="none" stroke="#22c55e" stroke-width="2"/>
  <line x1="494" y1="349" x2="501" y2="356" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <text x="510" y="341" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#22c55e">Third-Party Audit</text>
  <text x="510" y="355" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#86efac">Vendor AI systems · Supplier due diligence · TPRM</text>
  <text x="510" y="369" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#86efac">Contractual audit rights · API and model access review</text>

  <!-- Immutability box -->
  <rect x="460" y="400" width="320" height="76" rx="6" fill="#1a1f2e" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#shadow)"/>
  <text x="620" y="420" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#f59e0b" text-anchor="middle">Immutability Requirements</text>
  <text x="476" y="437" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#fbbf24">&#x25CF; Cryptographic hashing of log entries</text>
  <text x="476" y="451" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#fbbf24">&#x25CF; Write-once / WORM storage systems</text>
  <text x="476" y="465" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#fbbf24">&#x25CF; Timestamped chain of custody records</text>

  <!-- Retention box -->
  <rect x="460" y="492" width="320" height="60" rx="6" fill="#1a1f2e" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#shadow)"/>
  <text x="620" y="512" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#fb7185" text-anchor="middle">Retention &amp; Accountability</text>
  <text x="476" y="529" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#fca5a5">&#x25CF; EU AI Act: 10 years post-market for high-risk AI</text>
  <text x="476" y="543" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#fca5a5">&#x25CF; GDPR: proportionate; DPA guidance applies</text>

  <!-- Footer bar -->
  <rect x="0" y="572" width="800" height="28" fill="#0d1117" opacity="0.95"/>
  <rect x="0" y="572" width="800" height="1" fill="#1e2d3d"/>
  <text x="400" y="589" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#4a5568" text-anchor="middle">AI Security Risk Course · Module 3: AI Governance &amp; Compliance · Lesson 3.5</text>
</svg>
