  <text x="456" y="541" fill="#eab308" font-family="'Courier New', monospace" font-size="9" font-weight="bold">€7.5M or 1%</text>
  <text x="537" y="541" fill="#ffffff" font-family="Arial, sans-serif" font-size="8"> · SME reductions apply</text>

  <!-- Bottom decorative line -->
  <rect x="0" y="597" width="800" height="3" fill="#00d4ff" opacity="0.4"/>

  <!-- Version / source tag bottom right -->
  <text x="790" y="592" text-anchor="end" fill="#4a9eff" font-family="'Courier New', monospace" font-size="7" opacity="0.7">EU AI Act · Reg. 2024/1689</text>
