<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2a38" stroke-width="0.5"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c0392b;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#ef4444;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c2620a;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#f97316;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c2620a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1d4ed8;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#4a9eff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#15803d;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#22c55e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Top border accent line -->
  <rect x="0" y="0" width="800" height="3" fill="#00d4ff" opacity="0.8"/>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="19" font-weight="bold" letter-spacing="1">EU AI ACT — RISK CLASSIFICATION FRAMEWORK</text>
  <text x="400" y="52" text-anchor="middle" fill="#00d4ff" font-family="'Courier New', monospace" font-size="11" letter-spacing="2">Regulation (EU) 2024/1689  ·  Risk-Based Approach</text>

  <!-- Decorative line under title -->
  <line x1="160" y1="60" x2="640" y2="60" stroke="#00d4ff" stroke-width="0.7" opacity="0.5"/>
  <circle cx="160" cy="60" r="2" fill="#00d4ff" opacity="0.7"/>
  <circle cx="640" cy="60" r="2" fill="#00d4ff" opacity="0.7"/>

  <!-- ===== PYRAMID TIERS ===== -->

  <!-- TIER 4 (BOTTOM) — MINIMAL RISK (Green) -->
  <polygon points="105,495 695,495 658,420 142,420" fill="url(#greenGrad)" filter="url(#shadow)" opacity="0.92"/>
  <polygon points="105,495 695,495 658,420 142,420" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>

  <!-- TIER 3 — LIMITED RISK (Blue) -->
  <polygon points="142,417 658,417 618,342 182,342" fill="url(#blueGrad)" filter="url(#shadow)" opacity="0.92"/>
  <polygon points="142,417 658,417 618,342 182,342" fill="none" stroke="#4a9eff" stroke-width="1.5" opacity="0.6"/>

  <!-- TIER 2 — HIGH RISK (Orange) -->
  <polygon points="182,339 618,339 572,264 228,264" fill="url(#orangeGrad)" filter="url(#shadow)" opacity="0.92"/>
  <polygon points="182,339 618,339 572,264 228,264" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.6"/>

  <!-- TIER 1 (TOP) — UNACCEPTABLE RISK (Red) -->
  <polygon points="228,261 572,261 506,176 294,176" fill="url(#redGrad)" filter="url(#shadow)" opacity="0.95"/>
  <polygon points="228,261 572,261 506,176 294,176" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.7"/>

  <!-- Pyramid outer border accent -->
  <polyline points="400,148 294,176 228,261 182,339 142,417 105,495 695,495 658,417 618,339 572,261 506,176 400,148"
            fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.12"/>

  <!-- ===== TIER LABELS ===== -->

  <!-- TIER 1 — UNACCEPTABLE RISK -->
  <text x="400" y="205" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="12" font-weight="bold" filter="url(#glow)">UNACCEPTABLE RISK</text>
  <text x="400" y="221" text-anchor="middle" fill="#fca5a5" font-family="'Courier New', monospace" font-size="9.5" letter-spacing="1">PROHIBITED BY LAW</text>
  <text x="400" y="236" text-anchor="middle" fill="#fee2e2" font-family="Arial, sans-serif" font-size="8">Social scoring · Real-time biometric surveillance in public</text>
  <text x="400" y="249" text-anchor="middle" fill="#fee2e2" font-family="Arial, sans-serif" font-size="8">Subliminal manipulation · Exploitation of vulnerabilities</text>

  <!-- TIER 2 — HIGH RISK -->
  <text x="400" y="285" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="12" font-weight="bold">HIGH RISK  (Annex III)</text>
  <text x="400" y="301" text-anchor="middle" fill="#fed7aa" font-family="'Courier New', monospace" font-size="9" letter-spacing="1">CONFORMITY ASSESSMENT REQUIRED</text>
  <text x="400" y="316" text-anchor="middle" fill="#ffedd5" font-family="Arial, sans-serif" font-size="8">Critical infrastructure · Employment · Law enforcement · Education</text>
  <text x="400" y="329" text-anchor="middle" fill="#ffedd5" font-family="Arial, sans-serif" font-size="8">Biometrics · Border control · Credit scoring · Administration of justice</text>

  <!-- TIER 3 — LIMITED RISK -->
  <text x="400" y="360" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="12" font-weight="bold">LIMITED RISK</text>
  <text x="400" y="376" text-anchor="middle" fill="#bfdbfe" font-family="'Courier New', monospace" font-size="9" letter-spacing="1">TRANSPARENCY OBLIGATIONS</text>
  <text x="400" y="391" text-anchor="middle" fill="#dbeafe" font-family="Arial, sans-serif" font-size="8.5">Chatbot disclosure · Deepfake labeling · Emotion recognition notice</text>
  <text x="400" y="404" text-anchor="middle" fill="#dbeafe" font-family="Arial, sans-serif" font-size="8.5">AI-generated content watermarking (GPAI)</text>

  <!-- TIER 4 — MINIMAL RISK -->
  <text x="400" y="436" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="12" font-weight="bold">MINIMAL RISK</text>
  <text x="400" y="452" text-anchor="middle" fill="#bbf7d0" font-family="'Courier New', monospace" font-size="9" letter-spacing="1">NO MANDATORY OBLIGATIONS</text>
  <text x="400" y="467" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="8.5">Spam filters · AI video games · Recommendation systems</text>
  <text x="400" y="481" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="8.5">Inventory management · Non-sensitive customer service bots</text>

  <!-- ===== RIGHT SIDE PANEL — COMPLIANCE ===== -->
  <rect x="708" y="72" width="80" height="438" rx="5" fill="#0c1220" stroke="#1e3a5f" stroke-width="1"/>
  <text x="748" y="88" text-anchor="middle" fill="#00d4ff" font-family="'Courier New', monospace" font-size="8" font-weight="bold">COMPLIANCE</text>
  <text x="748" y="99" text-anchor="middle" fill="#00d4ff" font-family="'Courier New', monospace" font-size="8" font-weight="bold">REQUIREMENTS</text>
  <line x1="712" y1="105" x2="784" y2="105" stroke="#00d4ff" stroke-width="0.5" opacity="0.5"/>

  <!-- Prohibited block -->
  <rect x="714" y="111" width="68" height="70" rx="3" fill="#ef4444" opacity="0.18"/>
  <rect x="714" y="111" width="68" height="70" rx="3" fill="none" stroke="#ef4444" stroke-width="1"/>
  <text x="748" y="126" text-anchor="middle" fill="#fca5a5" font-family="'Courier New', monospace" font-size="7" font-weight="bold">PROHIBITED</text>
  <text x="748" y="137" text-anchor="middle" fill="#fee2e2" font-family="Arial, sans-serif" font-size="6">Market ban</text>
  <text x="748" y="147" text-anchor="middle" fill="#fee2e2" font-family="Arial, sans-serif" font-size="6">Criminal</text>
  <text x="748" y="157" text-anchor="middle" fill="#fee2e2" font-family="Arial, sans-serif" font-size="6">penalties</text>
  <text x="748" y="167" text-anchor="middle" fill="#fee2e2" font-family="Arial, sans-serif" font-size="6">up to 7%</text>
  <text x="748" y="176" text-anchor="middle" fill="#fee2e2" font-family="Arial, sans-serif" font-size="6">revenue</text>

  <!-- High risk requirements block -->
  <rect x="714" y="188" width="68" height="110" rx="3" fill="#f97316" opacity="0.15"/>
  <rect x="714" y="188" width="68" height="110" rx="3" fill="none" stroke="#f97316" stroke-width="1"/>
  <text x="748" y="203" text-anchor="middle" fill="#fed7aa" font-family="'Courier New', monospace" font-size="7" font-weight="bold">HIGH RISK</text>
  <text x="748" y="214" text-anchor="middle" fill="#ffedd5" font-family="Arial, sans-serif" font-size="5.8">Conformity assess.</text>
  <text x="748" y="224" text-anchor="middle" fill="#ffedd5" font-family="Arial, sans-serif" font-size="5.8">Tech documentation</text>
  <text x="748" y="234" text-anchor="middle" fill="#ffedd5" font-family="Arial, sans-serif" font-size="5.8">Human oversight</text>
  <text x="748" y="244" text-anchor="middle" fill="#ffedd5" font-family="Arial, sans-serif" font-size="5.8">Logging/audit trail</text>
  <text x="748" y="254" text-anchor="middle" fill="#ffedd5" font-family="Arial, sans-serif" font-size="5.8">EU DB registration</text>
  <text x="748" y="264" text-anchor="middle" fill="#ffedd5" font-family="Arial, sans-serif" font-size="5.8">CE marking</text>
  <text x="748" y="274" text-anchor="middle" fill="#ffedd5" font-family="Arial, sans-serif" font-size="5.8">Data governance</text>
  <text x="748" y="284" text-anchor="middle" fill="#ffedd5" font-family="Arial, sans-serif" font-size="5.8">Accuracy/robustness</text>
  <text x="748" y="293" text-anchor="middle" fill="#ffedd5" font-family="Arial, sans-serif" font-size="5.8">Notified body review</text>

  <!-- Limited risk block -->
  <rect x="714" y="305" width="68" height="80" rx="3" fill="#4a9eff" opacity="0.15"/>
  <rect x="714" y="305" width="68" height="80" rx="3" fill="none" stroke="#4a9eff" stroke-width="1"/>
  <text x="748" y="320" text-anchor="middle" fill="#bfdbfe" font-family="'Courier New', monospace" font-size="7" font-weight="bold">LIMITED</text>
  <text x="748" y="331" text-anchor="middle" fill="#dbeafe" font-family="Arial, sans-serif" font-size="5.8">Disclose AI use</text>
  <text x="748" y="341" text-anchor="middle" fill="#dbeafe" font-family="Arial, sans-serif" font-size="5.8">Label deepfakes</text>
  <text x="748" y="351" text-anchor="middle" fill="#dbeafe" font-family="Arial, sans-serif" font-size="5.8">Watermark GPAI</text>
  <text x="748" y="361" text-anchor="middle" fill="#dbeafe" font-family="Arial, sans-serif" font-size="5.8">content output</text>
  <text x="748" y="371" text-anchor="middle" fill="#dbeafe" font-family="Arial, sans-serif" font-size="5.8">Emotion disclosure</text>
  <text x="748" y="381" text-anchor="middle" fill="#dbeafe" font-family="Arial, sans-serif" font-size="5.8">Bias transparency</text>

  <!-- Minimal risk block -->
  <rect x="714" y="392" width="68" height="60" rx="3" fill="#22c55e" opacity="0.15"/>
  <rect x="714" y="392" width="68" height="60" rx="3" fill="none" stroke="#22c55e" stroke-width="1"/>
  <text x="748" y="407" text-anchor="middle" fill="#bbf7d0" font-family="'Courier New', monospace" font-size="7" font-weight="bold">MINIMAL</text>
  <text x="748" y="418" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="5.8">Voluntary codes</text>
  <text x="748" y="428" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="5.8">of conduct</text>
  <text x="748" y="438" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="5.8">Best practice</text>
  <text x="748" y="448" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="5.8">guidelines</text>

  <!-- ===== LEFT SIDE PANEL — TIMELINE ===== -->
  <rect x="12" y="72" width="80" height="438" rx="5" fill="#0c1220" stroke="#1e3a5f" stroke-width="1"/>
  <text x="52" y="88" text-anchor="middle" fill="#00d4ff" font-family="'Courier New', monospace" font-size="8" font-weight="bold">ENFORCEMENT</text>
  <text x="52" y="99" text-anchor="middle" fill="#00d4ff" font-family="'Courier New', monospace" font-size="8" font-weight="bold">TIMELINE</text>
  <line x1="16" y1="105" x2="88" y2="105" stroke="#00d4ff" stroke-width="0.5" opacity="0.5"/>

  <!-- 2024 -->
  <circle cx="28" cy="124" r="4" fill="#eab308"/>
  <line x1="28" y1="128" x2="28" y2="174" stroke="#eab308" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="36" y="121" fill="#fef08a" font-family="'Courier New', monospace" font-size="7" font-weight="bold">2024</text>
  <text x="36" y="131" fill="#fef9c3" font-family="Arial, sans-serif" font-size="5.8">Act adopted</text>
  <text x="36" y="140" fill="#fef9c3" font-family="Arial, sans-serif" font-size="5.8">Aug 1 entry</text>
  <text x="36" y="149" fill="#fef9c3" font-family="Arial, sans-serif" font-size="5.8">into force</text>
  <text x="36" y="158" fill="#fef9c3" font-family="Arial, sans-serif" font-size="5.8">EU Official</text>
  <text x="36" y="167" fill="#fef9c3" font-family="Arial, sans-serif" font-size="5.8">Journal pub.</text>

  <!-- 2025 Feb -->
  <circle cx="28" cy="183" r="4" fill="#ef4444"/>
  <line x1="28" y1="187" x2="28" y2="247" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="36" y="180" fill="#fca5a5" font-family="'Courier New', monospace" font-size="7" font-weight="bold">Feb 2025</text>
  <text x="36" y="190" fill="#fee2e2" font-family="Arial, sans-serif" font-size="5.8">AI literacy</text>
  <text x="36" y="199" fill="#fee2e2" font-family="Arial, sans-serif" font-size="5.8">obligations</text>
  <text x="36" y="208" fill="#fee2e2" font-family="Arial, sans-serif" font-size="5.8">Prohibited</text>
  <text x="36" y="217" fill="#fee2e2" font-family="Arial, sans-serif" font-size="5.8">AI banned</text>
  <text x="36" y="226" fill="#fee2e2" font-family="Arial, sans-serif" font-size="5.8">AI governance</text>
  <text x="36" y="235" fill="#fee2e2" font-family="Arial, sans-serif" font-size="5.8">bodies active</text>

  <!-- 2025 Aug -->
  <circle cx="28" cy="252" r="4" fill="#8b5cf6"/>
  <line x1="28" y1="256" x2="28" y2="305" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="36" y="249" fill="#c4b5fd" font-family="'Courier New', monospace" font-size="7" font-weight="bold">Aug 2025</text>
  <text x="36" y="259" fill="#ede9fe" font-family="Arial, sans-serif" font-size="5.8">GPAI model</text>
  <text x="36" y="268" fill="#ede9fe" font-family="Arial, sans-serif" font-size="5.8">rules apply</text>
  <text x="36" y="277" fill="#ede9fe" font-family="Arial, sans-serif" font-size="5.8">Codes of</text>
  <text x="36" y="286" fill="#ede9fe" font-family="Arial, sans-serif" font-size="5.8">practice pub.</text>
  <text x="36" y="295" fill="#ede9fe" font-family="Arial, sans-serif" font-size="5.8">Notified</text>
  <text x="36" y="304" fill="#ede9fe" font-family="Arial, sans-serif" font-size="5.8">bodies ready</text>

  <!-- 2026 -->
  <circle cx="28" cy="318" r="4" fill="#f97316"/>
  <line x1="28" y1="322" x2="28" y2="372" stroke="#f97316" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="36" y="315" fill="#fed7aa" font-family="'Courier New', monospace" font-size="7" font-weight="bold">Aug 2026</text>
  <text x="36" y="325" fill="#ffedd5" font-family="Arial, sans-serif" font-size="5.8">High-risk AI</text>
  <text x="36" y="334" fill="#ffedd5" font-family="Arial, sans-serif" font-size="5.8">Annex I (EU</text>
  <text x="36" y="343" fill="#ffedd5" font-family="Arial, sans-serif" font-size="5.8">product law)</text>
  <text x="36" y="352" fill="#ffedd5" font-family="Arial, sans-serif" font-size="5.8">obligations</text>
  <text x="36" y="361" fill="#ffedd5" font-family="Arial, sans-serif" font-size="5.8">apply now</text>

  <!-- 2027 -->
  <circle cx="28" cy="381" r="4" fill="#22c55e"/>
  <text x="36" y="378" fill="#bbf7d0" font-family="'Courier New', monospace" font-size="7" font-weight="bold">Aug 2027</text>
  <text x="36" y="388" fill="#dcfce7" font-family="Arial, sans-serif" font-size="5.8">Full enforce-</text>
  <text x="36" y="397" fill="#dcfce7" font-family="Arial, sans-serif" font-size="5.8">ment: all</text>
  <text x="36" y="406" fill="#dcfce7" font-family="Arial, sans-serif" font-size="5.8">Annex III</text>
  <text x="36" y="415" fill="#dcfce7" font-family="Arial, sans-serif" font-size="5.8">high-risk AI</text>
  <text x="36" y="424" fill="#dcfce7" font-family="Arial, sans-serif" font-size="5.8">categories</text>

  <!-- ===== BOTTOM FOOTER — PENALTIES ===== -->
  <rect x="105" y="503" width="590" height="48" rx="5" fill="#1a0808" stroke="#ef4444" stroke-width="1.2"/>
