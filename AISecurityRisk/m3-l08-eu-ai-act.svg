  <text x="200" y="523" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">Prohibited AI: up to</text>
  <text x="310" y="523" fill="#ef4444" font-family="'Courier New', monospace" font-size="10" font-weight="bold">€35,000,000</text>
  <text x="415" y="523" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">or</text>
  <text x="432" y="523" fill="#ef4444" font-family="'Courier New', monospace" font-size="10" font-weight="bold">7%</text>
  <text x="454" y="523" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">global annual turnover</text>
  <text x="130" y="541" fill="#fca5a5" font-family="'Courier New', monospace" font-size="8">High-risk / GPAI violations:</text>
  <text x="282" y="541" fill="#f97316" font-family="'Courier New', monospace" font-size="9" font-weight="bold">€15M or 3%</text>
