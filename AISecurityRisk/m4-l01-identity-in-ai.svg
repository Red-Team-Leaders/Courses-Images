  <text x="40" y="297" font-family="'Courier New', monospace" font-size="8" fill="#8b9cb6">Power Users</text>
  <circle cx="34" cy="307" r="2" fill="#4a9eff"/>
  <text x="40" y="310" font-family="'Courier New', monospace" font-size="8" fill="#8b9cb6">Admins</text>

  <!-- External Users -->
  <rect x="137" y="248" width="116" height="70" rx="5" fill="#0f1e35" stroke="#4a9eff" stroke-width="1"/>
  <text x="195" y="265" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#93c5fd" text-anchor="middle">External Users</text>
  <line x1="145" y1="270" x2="245" y2="270" stroke="#1e3a5f" stroke-width="0.5"/>
  <circle cx="149" cy="281" r="2" fill="#4a9eff"/>
  <text x="155" y="284" font-family="'Courier New', monospace" font-size="8" fill="#8b9cb6">Customers</text>
