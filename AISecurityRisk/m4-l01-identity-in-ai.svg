  <text x="605" y="177" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#f97316" text-anchor="middle">Non-Human Identities</text>
  <text x="605" y="194" font-family="'Courier New', monospace" font-size="9" fill="#fdba74" text-anchor="middle">Systems, agents &amp; services</text>

