<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2d3d" stroke-width="0.5"/>
    </pattern>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a9eff"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f97316"/>
    </marker>
    <marker id="arrowCyan" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00d4ff"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d2137;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="humanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1d3060;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="nonHumanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c2d12;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5a1f0a;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Title -->
  <text x="400" y="32" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#00d4ff" text-anchor="middle" filter="url(#glow)">Identity in AI Systems</text>
  <text x="400" y="52" font-family="'Courier New', monospace" font-size="11" fill="#8b9cb6" text-anchor="middle">Human &amp; Non-Human Identity Taxonomy</text>
  <line x1="160" y1="60" x2="640" y2="60" stroke="#1e3a5f" stroke-width="1"/>

  <!-- ROOT NODE -->
  <rect x="285" y="72" width="230" height="46" rx="8" fill="url(#rootGrad)" stroke="#00d4ff" stroke-width="1.5" filter="url(#glow)"/>
  <text x="400" y="91" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#00d4ff" text-anchor="middle">Identity in AI Systems</text>
  <text x="400" y="108" font-family="'Courier New', monospace" font-size="9" fill="#8b9cb6" text-anchor="middle">Authentication · Authorization · Accountability</text>

  <!-- Lines from root to main branches -->
  <line x1="340" y1="118" x2="195" y2="158" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="460" y1="118" x2="605" y2="158" stroke="#f97316" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

  <!-- HUMAN IDENTITIES BRANCH -->
  <rect x="95" y="158" width="200" height="44" rx="7" fill="url(#humanGrad)" stroke="#4a9eff" stroke-width="2"/>
  <text x="195" y="177" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#4a9eff" text-anchor="middle">Human Identities</text>
  <text x="195" y="194" font-family="'Courier New', monospace" font-size="9" fill="#93c5fd" text-anchor="middle">People interacting with AI</text>

  <!-- NON-HUMAN IDENTITIES BRANCH -->
