<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2a3a" stroke-width="0.5"/>
    </pattern>
    <!-- Arrow markers -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00d4ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f97316"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a9eff"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8b5cf6"/>
    </marker>
    <!-- Glow filters -->
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="gradOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#4a9eff;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eab308;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#eab308;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0d1117"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="18" font-weight="bold">AI Incident Response Lifecycle</text>
  <text x="400" y="48" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="11">Detection → Triage → Containment → Investigation → Eradication → Recovery → Post-Incident</text>
  <line x1="60" y1="55" x2="740" y2="55" stroke="#1e2a3a" stroke-width="1"/>

  <!-- ===== LIFECYCLE FLOW - TOP ROW ===== -->
  <!-- Phase 1: Detection -->
  <rect x="20" y="70" width="100" height="52" rx="6" fill="url(#gradRed)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="70" y="89" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="10" font-weight="bold">DETECTION</text>
  <text x="70" y="102" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="8">Anomaly Alert</text>
  <text x="70" y="113" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="8">User Report</text>

  <!-- Arrow 1→2 -->
  <line x1="120" y1="96" x2="142" y2="96" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- Phase 2: Triage -->
  <rect x="143" y="70" width="100" height="52" rx="6" fill="url(#gradOrange)" stroke="#f97316" stroke-width="1.5"/>
  <text x="193" y="89" text-anchor="middle" fill="#f97316" font-family="monospace" font-size="10" font-weight="bold">TRIAGE</text>
  <text x="193" y="102" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="8">Severity P1–P4</text>
  <text x="193" y="113" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="8">AI vs Traditional</text>

  <!-- Arrow 2→3 -->
  <line x1="243" y1="96" x2="265" y2="96" stroke="#f97316" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

  <!-- Phase 3: Containment -->
  <rect x="266" y="70" width="100" height="52" rx="6" fill="url(#gradCyan)" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="316" y="89" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="10" font-weight="bold">CONTAINMENT</text>
  <text x="316" y="102" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="8">Isolate Model</text>
  <text x="316" y="113" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="8">Kill Switch</text>

  <!-- Arrow 3→4 -->
  <line x1="366" y1="96" x2="388" y2="96" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

  <!-- Phase 4: Investigation -->
  <rect x="389" y="70" width="100" height="52" rx="6" fill="url(#gradBlue)" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="439" y="89" text-anchor="middle" fill="#4a9eff" font-family="monospace" font-size="10" font-weight="bold">INVESTIGATION</text>
  <text x="439" y="102" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="8">Log Analysis</text>
  <text x="439" y="113" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="8">Replay Attack</text>

  <!-- Arrow 4→5 -->
  <line x1="489" y1="96" x2="511" y2="96" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Phase 5: Eradication -->
  <rect x="512" y="70" width="100" height="52" rx="6" fill="url(#gradPurple)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="562" y="89" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="10" font-weight="bold">ERADICATION</text>
  <text x="562" y="102" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="8">Root Cause Fix</text>
  <text x="562" y="113" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="8">Model Rollback</text>

  <!-- Arrow 5→6 -->
  <line x1="612" y1="96" x2="634" y2="96" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <!-- Phase 6: Recovery -->
  <rect x="635" y="70" width="75" height="52" rx="6" fill="url(#gradGreen)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="672" y="89" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="10" font-weight="bold">RECOVERY</text>
  <text x="672" y="102" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="8">Restore Svc</text>
  <text x="672" y="113" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="8">Monitor Uplift</text>

  <!-- Arrow 6→7 (down) -->
  <line x1="710" y1="96" x2="755" y2="96" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Phase 7: Post-Incident -->
  <rect x="712" y="70" width="75" height="52" rx="6" fill="url(#gradGold)" stroke="#eab308" stroke-width="1.5"/>
  <text x="749" y="86" text-anchor="middle" fill="#eab308" font-family="monospace" font-size="9" font-weight="bold">POST-</text>
  <text x="749" y="97" text-anchor="middle" fill="#eab308" font-family="monospace" font-size="9" font-weight="bold">INCIDENT</text>
  <text x="749" y="110" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="8">Report+Learn</text>

  <!-- Feedback loop arrow from Post-Incident back to Detection -->
  <path d="M 749 122 L 749 140 L 70 140 L 70 122" fill="none" stroke="#eab308" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowCyan)"/>
  <text x="400" y="152" text-anchor="middle" fill="#eab308" font-family="monospace" font-size="8">Continuous Improvement Loop → Update Controls → Prevent Recurrence</text>

  <!-- ===== DIVIDER ===== -->
  <line x1="20" y1="162" x2="780" y2="162" stroke="#1e2a3a" stroke-width="1"/>
  <text x="400" y="176" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10" font-weight="bold">AI-SPECIFIC INCIDENT PLAYBOOKS</text>

  <!-- ===== PLAYBOOK PANELS - 2 per row ===== -->

  <!-- Playbook 1: Prompt Injection Incident -->
  <rect x="20" y="183" width="370" height="120" rx="8" fill="#0d1117" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="20" y="183" width="370" height="24" rx="8" fill="#ef444420"/>
  <rect x="20" y="199" width="370" height="8" rx="0" fill="#ef444420"/>
  <!-- Title bar -->
  <circle cx="38" cy="195" r="6" fill="#ef4444" opacity="0.8"/>
  <text x="50" y="199" fill="#ef4444" font-family="monospace" font-size="11" font-weight="bold">PLAYBOOK: Prompt Injection Incident</text>

  <!-- Steps -->
  <text x="32" y="221" fill="#e2e8f0" font-family="monospace" font-size="9">1. DETECT  Alert: adversarial output / unusual token patterns in logs</text>
  <text x="32" y="235" fill="#e2e8f0" font-family="monospace" font-size="9">2. CONTAIN  Disable affected endpoint / activate rate limiter</text>
  <text x="32" y="249" fill="#e2e8f0" font-family="monospace" font-size="9">3. INVESTIGATE  Replay prompt chain · identify injection vector</text>
  <text x="32" y="263" fill="#e2e8f0" font-family="monospace" font-size="9">4. ERADICATE  Patch input sanitizer · add guardrail rule</text>
  <text x="32" y="277" fill="#e2e8f0" font-family="monospace" font-size="9">5. RECOVER  Re-enable with enhanced prompt validation layer</text>
  <text x="32" y="291" fill="#e2e8f0" font-family="monospace" font-size="9">6. REPORT  CISO notify · near-miss register entry if no exfiltration</text>

  <!-- Severity badge -->
  <rect x="310" y="187" width="72" height="16" rx="3" fill="#ef4444" opacity="0.8"/>
  <text x="346" y="198" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold">P1 / CRITICAL</text>

  <!-- Playbook 2: Data Leakage via AI -->
  <rect x="410" y="183" width="370" height="120" rx="8" fill="#0d1117" stroke="#f97316" stroke-width="1.5"/>
  <rect x="410" y="183" width="370" height="24" rx="8" fill="#f9731620"/>
  <rect x="410" y="199" width="370" height="8" rx="0" fill="#f9731620"/>
  <circle cx="428" cy="195" r="6" fill="#f97316" opacity="0.8"/>
  <text x="440" y="199" fill="#f97316" font-family="monospace" font-size="11" font-weight="bold">PLAYBOOK: Data Leakage via AI</text>

  <text x="422" y="221" fill="#e2e8f0" font-family="monospace" font-size="9">1. DETECT  PII/secret strings in model output · DLP alert triggers</text>
  <text x="422" y="235" fill="#e2e8f0" font-family="monospace" font-size="9">2. CONTAIN  Revoke API keys · suspend user sessions · isolate model</text>
  <text x="422" y="249" fill="#e2e8f0" font-family="monospace" font-size="9">3. INVESTIGATE  Identify training data source / RAG corpus leak</text>
  <text x="422" y="263" fill="#e2e8f0" font-family="monospace" font-size="9">4. ERADICATE  Unlearn / retrain without leaked data · patch RAG</text>
  <text x="422" y="277" fill="#e2e8f0" font-family="monospace" font-size="9">5. RECOVER  Output filter redaction · audit all past sessions</text>
  <text x="422" y="291" fill="#e2e8f0" font-family="monospace" font-size="9">6. REPORT  DPA/regulator notify (72h GDPR) · affected party notice</text>

  <rect x="700" y="187" width="72" height="16" rx="3" fill="#f97316" opacity="0.8"/>
  <text x="736" y="198" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold">P1 / CRITICAL</text>

  <!-- Playbook 3: Model Poisoning -->
  <rect x="20" y="313" width="370" height="120" rx="8" fill="#0d1117" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="20" y="313" width="370" height="24" rx="8" fill="#8b5cf620"/>
  <rect x="20" y="329" width="370" height="8" rx="0" fill="#8b5cf620"/>
  <circle cx="38" cy="325" r="6" fill="#8b5cf6" opacity="0.8"/>
  <text x="50" y="329" fill="#8b5cf6" font-family="monospace" font-size="11" font-weight="bold">PLAYBOOK: Model Poisoning / Backdoor</text>

  <text x="32" y="351" fill="#e2e8f0" font-family="monospace" font-size="9">1. DETECT  Anomalous output on trigger tokens · eval regression</text>
  <text x="32" y="365" fill="#e2e8f0" font-family="monospace" font-size="9">2. CONTAIN  Immediate model rollback to last known-good version</text>
  <text x="32" y="379" fill="#e2e8f0" font-family="monospace" font-size="9">3. INVESTIGATE  Audit training pipeline · trace poisoned data batch</text>
  <text x="32" y="393" fill="#e2e8f0" font-family="monospace" font-size="9">4. ERADICATE  Remove poisoned samples · retrain from clean data</text>
  <text x="32" y="407" fill="#e2e8f0" font-family="monospace" font-size="9">5. RECOVER  Validate on red team suite · staged re-deployment</text>
  <text x="32" y="421" fill="#e2e8f0" font-family="monospace" font-size="9">6. REPORT  Supply chain incident · vendor breach if third-party data</text>

  <rect x="310" y="317" width="72" height="16" rx="3" fill="#8b5cf6" opacity="0.8"/>
  <text x="346" y="328" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold">P1 / CRITICAL</text>

  <!-- Playbook 4: Hallucination in Production -->
  <rect x="410" y="313" width="370" height="120" rx="8" fill="#0d1117" stroke="#eab308" stroke-width="1.5"/>
  <rect x="410" y="313" width="370" height="24" rx="8" fill="#eab30820"/>
  <rect x="410" y="329" width="370" height="8" rx="0" fill="#eab30820"/>
  <circle cx="428" cy="325" r="6" fill="#eab308" opacity="0.8"/>
  <text x="440" y="329" fill="#eab308" font-family="monospace" font-size="11" font-weight="bold">PLAYBOOK: Hallucination in Production</text>

  <text x="422" y="351" fill="#e2e8f0" font-family="monospace" font-size="9">1. DETECT  User report / factual drift detector · downstream error</text>
  <text x="422" y="365" fill="#e2e8f0" font-family="monospace" font-size="9">2. CONTAIN  Feature flag: disable AI response · fallback to human</text>
  <text x="422" y="379" fill="#e2e8f0" font-family="monospace" font-size="9">3. INVESTIGATE  Identify context window / RAG retrieval failure</text>
  <text x="422" y="393" fill="#e2e8f0" font-family="monospace" font-size="9">4. ERADICATE  Strengthen grounding · add citation enforcement</text>
  <text x="422" y="407" fill="#e2e8f0" font-family="monospace" font-size="9">5. RECOVER  Human review gate for high-stakes domain outputs</text>
  <text x="422" y="421" fill="#e2e8f0" font-family="monospace" font-size="9">6. REPORT  Incident register · legal/compliance if harm occurred</text>

  <rect x="700" y="317" width="72" height="16" rx="3" fill="#eab308" opacity="0.8"/>
  <text x="736" y="328" text-anchor="middle" fill="#0d1117" font-family="monospace" font-size="9" font-weight="bold">P2 / HIGH</text>

  <!-- ===== BOTTOM SECTION: Audit + Severity ===== -->
  <line x1="20" y1="445" x2="780" y2="445" stroke="#1e2a3a" stroke-width="1"/>

  <!-- Audit Trail Requirements -->
  <rect x="20" y="452" width="355" height="130" rx="8" fill="#0d1117" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="197" y="469" text-anchor="middle" fill="#4a9eff" font-family="monospace" font-size="11" font-weight="bold">AUDIT TRAIL REQUIREMENTS</text>

  <!-- Log items -->
  <rect x="30" y="477" width="8" height="8" rx="2" fill="#4a9eff"/>
  <text x="44" y="485" fill="#e2e8f0" font-family="monospace" font-size="9">Prompt + response pairs (immutable, tamper-evident)</text>
  <rect x="30" y="491" width="8" height="8" rx="2" fill="#4a9eff"/>
  <text x="44" y="499" fill="#e2e8f0" font-family="monospace" font-size="9">User identity · session ID · timestamp · IP geolocation</text>
  <rect x="30" y="505" width="8" height="8" rx="2" fill="#4a9eff"/>
  <text x="44" y="513" fill="#e2e8f0" font-family="monospace" font-size="9">Model version · temperature · token counts · system prompt</text>
  <rect x="30" y="519" width="8" height="8" rx="2" fill="#4a9eff"/>
  <text x="44" y="527" fill="#e2e8f0" font-family="monospace" font-size="9">Tool calls / function invocations (agentic AI)</text>
  <rect x="30" y="533" width="8" height="8" rx="2" fill="#4a9eff"/>
  <text x="44" y="541" fill="#e2e8f0" font-family="monospace" font-size="9">Guardrail decisions (triggered / bypassed / overridden)</text>
  <rect x="30" y="547" width="8" height="8" rx="2" fill="#4a9eff"/>
  <text x="44" y="555" fill="#e2e8f0" font-family="monospace" font-size="9">Retention: 90 days hot · 1 year warm · 3 years cold (SIEM)</text>
  <rect x="30" y="561" width="8" height="8" rx="2" fill="#4a9eff"/>
  <text x="44" y="569" fill="#e2e8f0" font-family="monospace" font-size="9">Chain-of-custody hash (SHA-256) for forensic admissibility</text>

  <!-- Severity Classification -->
  <rect x="390" y="452" width="390" height="130" rx="8" fill="#0d1117" stroke="#22c55e" stroke-width="1.5"/>
  <text x="585" y="469" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="11" font-weight="bold">AI INCIDENT SEVERITY TIERS</text>

  <!-- Severity rows -->
  <rect x="400" y="477" width="28" height="14" rx="3" fill="#ef4444"/>
  <text x="414" y="488" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold">P1</text>
  <text x="433" y="488" fill="#e2e8f0" font-family="monospace" font-size="9">Data exfiltration · model poisoning · RCE via agent</text>

  <rect x="400" y="497" width="28" height="14" rx="3" fill="#f97316"/>
  <text x="414" y="508" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold">P2</text>
  <text x="433" y="508" fill="#e2e8f0" font-family="monospace" font-size="9">Hallucination harm · PII in output · privilege escalation</text>

  <rect x="400" y="517" width="28" height="14" rx="3" fill="#eab308"/>
  <text x="414" y="528" text-anchor="middle" fill="#0d1117" font-family="monospace" font-size="9" font-weight="bold">P3</text>
  <text x="433" y="528" fill="#e2e8f0" font-family="monospace" font-size="9">Biased output · policy violation · availability degradation</text>

  <rect x="400" y="537" width="28" height="14" rx="3" fill="#22c55e"/>
  <text x="414" y="548" text-anchor="middle" fill="#0d1117" font-family="monospace" font-size="9" font-weight="bold">P4</text>
  <text x="433" y="548" fill="#e2e8f0" font-family="monospace" font-size="9">Near-miss · red team finding · minor quality drift</text>

  <!-- Response SLA -->
  <line x1="400" y1="557" x2="770" y2="557" stroke="#1e2a3a" stroke-width="0.5"/>
  <text x="585" y="570" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">SLA: P1 &lt;15min · P2 &lt;2h · P3 &lt;24h · P4 &lt;1 week response time</text>

  <!-- Footer label -->
  <text x="400" y="593" text-anchor="middle" fill="#30363d" font-family="monospace" font-size="9">AI Security Risk · Module 4 · Lesson 10 · Audit Trails &amp; Incident Response</text>
</svg>
