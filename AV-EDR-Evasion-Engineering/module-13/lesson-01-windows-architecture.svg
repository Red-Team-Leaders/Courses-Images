<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="a1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#58a6ff"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Windows Architecture — Kernel vs Userland Privilege Split</text>

  <!-- Ring 0 - Kernel -->
  <rect x="30" y="55" width="940" height="200" rx="10" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="60" y="80" fill="#f85149" font-size="14" font-weight="bold">Ring 0 — Kernel Mode</text>
  <text x="60" y="100" fill="#8b949e" font-size="11">Full hardware access, IRQL-aware scheduling, direct physical memory</text>

  <rect x="50" y="115" width="180" height="60" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="140" y="140" text-anchor="middle" fill="#ff7b72" font-size="12" font-weight="bold">ntoskrnl.exe</text>
  <text x="140" y="158" text-anchor="middle" fill="#8b949e" font-size="10">Executive + Kernel</text>

  <rect x="250" y="115" width="180" height="60" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="340" y="140" text-anchor="middle" fill="#ff7b72" font-size="12" font-weight="bold">win32kfull.sys</text>
  <text x="340" y="158" text-anchor="middle" fill="#8b949e" font-size="10">Window Manager + GDI</text>

  <rect x="450" y="115" width="160" height="60" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="530" y="140" text-anchor="middle" fill="#ff7b72" font-size="12" font-weight="bold">SSDT</text>
  <text x="530" y="158" text-anchor="middle" fill="#8b949e" font-size="10">System Service Table</text>

  <rect x="630" y="115" width="160" height="60" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="710" y="140" text-anchor="middle" fill="#ff7b72" font-size="12" font-weight="bold">Object Manager</text>
  <text x="710" y="158" text-anchor="middle" fill="#8b949e" font-size="10">\Device, \KnownDlls</text>

  <rect x="810" y="115" width="145" height="60" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="882" y="140" text-anchor="middle" fill="#ff7b72" font-size="12" font-weight="bold">HAL</text>
  <text x="882" y="158" text-anchor="middle" fill="#8b949e" font-size="10">Hardware Layer</text>

  <!-- EDR Drivers in kernel -->
  <rect x="50" y="190" width="200" height="50" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="150" y="212" text-anchor="middle" fill="#d2a8ff" font-size="11">EDR Kernel Callbacks</text>
  <text x="150" y="228" text-anchor="middle" fill="#8b949e" font-size="9">PsSetCreateProcessNotify</text>

  <rect x="270" y="190" width="200" height="50" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="370" y="212" text-anchor="middle" fill="#d2a8ff" font-size="11">Minifilter Drivers</text>
  <text x="370" y="228" text-anchor="middle" fill="#8b949e" font-size="9">I/O interception</text>

  <!-- Divider -->
  <line x1="30" y1="270" x2="970" y2="270" stroke="#f0883e" stroke-width="3" stroke-dasharray="12,6"/>
  <rect x="410" y="258" width="180" height="24" rx="4" fill="#0d1117" stroke="#f0883e" stroke-width="1.5"/>
  <text x="500" y="275" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">syscall / sysenter</text>

  <!-- Ring 3 - Userland -->
  <rect x="30" y="290" width="940" height="200" rx="10" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="60" y="315" fill="#3fb950" font-size="14" font-weight="bold">Ring 3 — User Mode</text>
  <text x="60" y="335" fill="#8b949e" font-size="11">Virtual address space per process, no direct hardware, API-mediated kernel access</text>

  <rect x="50" y="350" width="130" height="55" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="115" y="373" text-anchor="middle" fill="#7ee787" font-size="11" font-weight="bold">ntdll.dll</text>
  <text x="115" y="391" text-anchor="middle" fill="#8b949e" font-size="9">Syscall Stubs</text>

  <rect x="200" y="350" width="130" height="55" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="265" y="373" text-anchor="middle" fill="#7ee787" font-size="11" font-weight="bold">kernelbase.dll</text>
  <text x="265" y="391" text-anchor="middle" fill="#8b949e" font-size="9">Core Win32</text>

  <rect x="350" y="350" width="130" height="55" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="415" y="373" text-anchor="middle" fill="#7ee787" font-size="11" font-weight="bold">kernel32.dll</text>
  <text x="415" y="391" text-anchor="middle" fill="#8b949e" font-size="9">Compat Shim</text>

  <rect x="500" y="350" width="130" height="55" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="565" y="373" text-anchor="middle" fill="#7ee787" font-size="11" font-weight="bold">user32.dll</text>
  <text x="565" y="391" text-anchor="middle" fill="#8b949e" font-size="9">Window APIs</text>

  <!-- Session Isolation -->
  <rect x="660" y="345" width="295" height="130" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="807" y="368" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Session Isolation</text>
  <rect x="675" y="380" width="120" height="35" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="735" y="402" text-anchor="middle" fill="#c9d1d9" font-size="10">Session 0 (Services)</text>
  <rect x="820" y="380" width="120" height="35" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="880" y="402" text-anchor="middle" fill="#c9d1d9" font-size="10">Session 1 (User)</text>
  <text x="807" y="445" text-anchor="middle" fill="#8b949e" font-size="10">Separate desktops, window stations</text>
  <text x="807" y="462" text-anchor="middle" fill="#8b949e" font-size="10">No cross-session message passing</text>

  <!-- EDR hooks in userland -->
  <rect x="50" y="420" width="260" height="50" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="180" y="442" text-anchor="middle" fill="#d2a8ff" font-size="11">EDR Userland Hooks (ntdll inline patches)</text>
  <text x="180" y="458" text-anchor="middle" fill="#8b949e" font-size="9">Intercept NtAllocateVirtualMemory, NtWriteVirtualMemory, ...</text>

  <!-- Legend -->
  <rect x="30" y="505" width="940" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <rect x="50" y="528" width="12" height="12" fill="#f85149"/><text x="70" y="539" fill="#8b949e" font-size="10">Kernel Components</text>
  <rect x="210" y="528" width="12" height="12" fill="#3fb950"/><text x="230" y="539" fill="#8b949e" font-size="10">User Mode DLLs</text>
  <rect x="370" y="528" width="12" height="12" fill="#58a6ff"/><text x="390" y="539" fill="#8b949e" font-size="10">Isolation Boundaries</text>
  <rect x="540" y="528" width="12" height="12" fill="#d2a8ff"/><text x="560" y="539" fill="#8b949e" font-size="10">EDR Telemetry Points</text>
  <rect x="720" y="528" width="12" height="12" fill="#f0883e"/><text x="740" y="539" fill="#8b949e" font-size="10">Ring Transition (syscall)</text>
</svg>
