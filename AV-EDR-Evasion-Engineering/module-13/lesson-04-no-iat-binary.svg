<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">No-IAT Binaries — Zero Static Imports</text>

  <!-- Normal PE -->
  <rect x="30" y="55" width="440" height="280" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="250" y="80" text-anchor="middle" fill="#f85149" font-size="14" font-weight="bold">Normal PE — Detectable</text>

  <rect x="50" y="95" width="160" height="35" rx="4" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="130" y="118" text-anchor="middle" fill="#c9d1d9" font-size="10">DOS Header</text>

  <rect x="50" y="138" width="160" height="35" rx="4" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="130" y="161" text-anchor="middle" fill="#c9d1d9" font-size="10">PE Header</text>

  <rect x="50" y="181" width="160" height="55" rx="4" fill="#161b22" stroke="#ff7b72" stroke-width="2"/>
  <text x="130" y="203" text-anchor="middle" fill="#ff7b72" font-size="11" font-weight="bold">Import Table (IAT)</text>
  <text x="130" y="222" text-anchor="middle" fill="#f85149" font-size="9">kernel32.dll, user32.dll</text>

  <rect x="50" y="244" width="160" height="35" rx="4" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="130" y="267" text-anchor="middle" fill="#c9d1d9" font-size="10">.text Section</text>

  <rect x="50" y="287" width="160" height="35" rx="4" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="130" y="310" text-anchor="middle" fill="#c9d1d9" font-size="10">.rdata (strings)</text>

  <!-- IAT content -->
  <rect x="240" y="95" width="210" height="222" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="345" y="118" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">IAT Entries Visible</text>
  <text x="260" y="140" fill="#ff7b72" font-size="10">VirtualAlloc</text>
  <text x="260" y="158" fill="#ff7b72" font-size="10">VirtualProtect</text>
  <text x="260" y="176" fill="#ff7b72" font-size="10">CreateThread</text>
  <text x="260" y="194" fill="#ff7b72" font-size="10">WriteProcessMemory</text>
  <text x="260" y="212" fill="#ff7b72" font-size="10">CreateRemoteThread</text>
  <text x="260" y="236" fill="#f85149" font-size="9">AV/EDR static scan: SUSPICIOUS</text>
  <text x="260" y="254" fill="#f85149" font-size="9">Import combination = injection signature</text>
  <text x="260" y="280" fill="#f85149" font-size="10" font-weight="bold">DETECTED</text>
  <rect x="254" y="268" width="80" height="18" rx="3" fill="none" stroke="#f85149" stroke-width="1.5"/>

  <!-- No-IAT PE -->
  <rect x="530" y="55" width="440" height="280" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="750" y="80" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">No-IAT PE — Clean</text>

  <rect x="550" y="95" width="160" height="35" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="630" y="118" text-anchor="middle" fill="#c9d1d9" font-size="10">DOS Header</text>

  <rect x="550" y="138" width="160" height="35" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="630" y="161" text-anchor="middle" fill="#c9d1d9" font-size="10">PE Header</text>

  <rect x="550" y="181" width="160" height="55" rx="4" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
  <text x="630" y="203" text-anchor="middle" fill="#7ee787" font-size="11" font-weight="bold">Import Table (IAT)</text>
  <text x="630" y="222" text-anchor="middle" fill="#3fb950" font-size="9">(EMPTY — zero entries)</text>

  <rect x="550" y="244" width="160" height="35" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="630" y="267" text-anchor="middle" fill="#c9d1d9" font-size="10">.text (PEB walk code)</text>

  <rect x="550" y="287" width="160" height="35" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="630" y="310" text-anchor="middle" fill="#c9d1d9" font-size="10">.rdata (hash values)</text>

  <!-- Resolution at runtime -->
  <rect x="740" y="95" width="210" height="222" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="845" y="118" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">Runtime Resolution</text>
  <text x="760" y="140" fill="#7ee787" font-size="10">1. __readgsqword(0x60)</text>
  <text x="760" y="158" fill="#7ee787" font-size="10">2. PEB.Ldr walk</text>
  <text x="760" y="176" fill="#7ee787" font-size="10">3. Parse export table</text>
  <text x="760" y="194" fill="#7ee787" font-size="10">4. Hash each export name</text>
  <text x="760" y="212" fill="#7ee787" font-size="10">5. Match hash = found API</text>
  <text x="760" y="236" fill="#3fb950" font-size="9">No strings, no imports</text>
  <text x="760" y="254" fill="#3fb950" font-size="9">Static analysis sees nothing</text>
  <text x="760" y="280" fill="#3fb950" font-size="10" font-weight="bold">CLEAN</text>
  <rect x="754" y="268" width="55" height="18" rx="3" fill="none" stroke="#3fb950" stroke-width="1.5"/>

  <!-- Linker flags -->
  <rect x="30" y="350" width="940" height="85" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="375" fill="#f0883e" font-size="12" font-weight="bold">MSVC Linker Flags for Zero-Import Binary</text>
  <text x="50" y="400" fill="#d2a8ff" font-size="10">/NODEFAULTLIB /ENTRY:main /SUBSYSTEM:WINDOWS /MERGE:.rdata=.text</text>
  <text x="50" y="420" fill="#8b949e" font-size="10">Disables CRT, removes default imports, sets custom entry point, merges sections</text>

  <!-- Key insight -->
  <rect x="30" y="450" width="940" height="115" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="50" y="475" fill="#58a6ff" font-size="13" font-weight="bold">Build Pipeline</text>
  <text x="50" y="500" fill="#c9d1d9" font-size="11">1. Write all API calls through function pointers resolved via PEB walk + hash matching</text>
  <text x="50" y="520" fill="#c9d1d9" font-size="11">2. Use compiler intrinsics instead of CRT: __readgsqword, _mm_crc32_u8, memcpy intrinsic</text>
  <text x="50" y="540" fill="#c9d1d9" font-size="11">3. Result: PE with 0 imports, 0 API strings, 0 library references in static analysis</text>
</svg>
