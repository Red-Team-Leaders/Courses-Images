<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Junk Code Insertion &amp; Control Flow Obfuscation</text>

  <!-- Before: Clean CFG -->
  <rect x="30" y="50" width="440" height="300" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="250" y="75" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">Before — Clean Control Flow Graph</text>

  <rect x="170" y="90" width="100" height="35" rx="5" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="220" y="113" text-anchor="middle" fill="#c9d1d9" font-size="10">Entry</text>

  <line x1="220" y1="125" x2="220" y2="145" stroke="#f85149" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="150" y="150" width="140" height="35" rx="5" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="220" y="173" text-anchor="middle" fill="#ff7b72" font-size="10">Decrypt Payload</text>

  <line x1="220" y1="185" x2="220" y2="205" stroke="#f85149" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="150" y="210" width="140" height="35" rx="5" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="220" y="233" text-anchor="middle" fill="#ff7b72" font-size="10">Alloc Memory</text>

  <line x1="220" y1="245" x2="220" y2="265" stroke="#f85149" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="150" y="270" width="140" height="35" rx="5" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="220" y="293" text-anchor="middle" fill="#ff7b72" font-size="10">Execute</text>

  <text x="380" y="200" fill="#f85149" font-size="10">Linear flow</text>
  <text x="380" y="218" fill="#f85149" font-size="10">Easy to analyze</text>
  <text x="380" y="236" fill="#f85149" font-size="10">Pattern-matched</text>

  <!-- After: Obfuscated CFG -->
  <rect x="530" y="50" width="440" height="300" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="750" y="75" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">After — Obfuscated Control Flow</text>

  <rect x="690" y="90" width="100" height="30" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="740" y="111" text-anchor="middle" fill="#c9d1d9" font-size="9">Entry</text>

  <!-- Branching -->
  <line x1="740" y1="120" x2="640" y2="145" stroke="#3fb950" stroke-width="1" marker-end="url(#ag)"/>
  <line x1="740" y1="120" x2="840" y2="145" stroke="#8b949e" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Junk block -->
  <rect x="790" y="148" width="100" height="25" rx="4" fill="#161b22" stroke="#8b949e" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="840" y="165" text-anchor="middle" fill="#6e7681" font-size="8">Junk (dead code)</text>

  <!-- Opaque predicate -->
  <rect x="580" y="148" width="120" height="25" rx="4" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="640" y="165" text-anchor="middle" fill="#d2a8ff" font-size="8">Opaque Predicate</text>

  <line x1="640" y1="173" x2="640" y2="193" stroke="#3fb950" stroke-width="1" marker-end="url(#ag)"/>
  <line x1="700" y1="165" x2="780" y2="190" stroke="#8b949e" stroke-width="1" stroke-dasharray="3,2"/>

  <rect x="575" y="196" width="130" height="25" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="640" y="213" text-anchor="middle" fill="#7ee787" font-size="8">Decrypt Payload</text>

  <!-- More junk + real blocks -->
  <line x1="640" y1="221" x2="580" y2="245" stroke="#3fb950" stroke-width="1" marker-end="url(#ag)"/>
  <line x1="640" y1="221" x2="720" y2="245" stroke="#8b949e" stroke-width="1" stroke-dasharray="3,2"/>

  <rect x="530" y="248" width="100" height="25" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="580" y="265" text-anchor="middle" fill="#7ee787" font-size="8">Alloc Memory</text>

  <rect x="690" y="248" width="100" height="25" rx="4" fill="#161b22" stroke="#8b949e" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="740" y="265" text-anchor="middle" fill="#6e7681" font-size="8">Junk Math</text>

  <line x1="580" y1="273" x2="640" y2="295" stroke="#3fb950" stroke-width="1" marker-end="url(#ag)"/>

  <rect x="590" y="298" width="100" height="25" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="640" y="315" text-anchor="middle" fill="#7ee787" font-size="8">Execute</text>

  <!-- Techniques -->
  <rect x="30" y="365" width="300" height="200" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="180" y="390" text-anchor="middle" fill="#d2a8ff" font-size="13" font-weight="bold">Opaque Predicates</text>
  <text x="50" y="415" fill="#c9d1d9" font-size="10">Conditions always true/false</text>
  <text x="50" y="435" fill="#c9d1d9" font-size="10">but hard to prove statically:</text>
  <text x="50" y="460" fill="#7ee787" font-size="10">if ((x*x + x) % 2 == 0) {</text>
  <text x="50" y="478" fill="#7ee787" font-size="10">    real_code(); // always taken</text>
  <text x="50" y="496" fill="#7ee787" font-size="10">} else {</text>
  <text x="50" y="514" fill="#7ee787" font-size="10">    junk_code(); // never taken</text>
  <text x="50" y="532" fill="#7ee787" font-size="10">}</text>
  <text x="50" y="555" fill="#8b949e" font-size="9">x*x+x is always even (math property)</text>

  <rect x="350" y="365" width="310" height="200" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="505" y="390" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="bold">Dead Code Insertion</text>
  <text x="370" y="415" fill="#c9d1d9" font-size="10">Insert valid instructions that</text>
  <text x="370" y="435" fill="#c9d1d9" font-size="10">execute but have no effect:</text>
  <text x="370" y="460" fill="#7ee787" font-size="10">xor r15, r15      ; zero reg</text>
  <text x="370" y="478" fill="#7ee787" font-size="10">add r15, 0x41414141</text>
  <text x="370" y="496" fill="#7ee787" font-size="10">sub r15, 0x41414141</text>
  <text x="370" y="514" fill="#7ee787" font-size="10">nop dword [rax]   ; long nop</text>
  <text x="370" y="540" fill="#8b949e" font-size="9">Changes entropy, breaks byte signatures</text>
  <text x="370" y="555" fill="#8b949e" font-size="9">Uses non-volatile regs to avoid side effects</text>

  <rect x="680" y="365" width="290" height="200" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="825" y="390" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">CFG Flattening</text>
  <text x="700" y="415" fill="#c9d1d9" font-size="10">Replace structured control</text>
  <text x="700" y="435" fill="#c9d1d9" font-size="10">flow with switch dispatcher:</text>
  <text x="700" y="460" fill="#7ee787" font-size="10">while (1) {</text>
  <text x="700" y="478" fill="#7ee787" font-size="10">  switch(state) {</text>
  <text x="700" y="496" fill="#7ee787" font-size="10">    case 0: decrypt(); state=3;</text>
  <text x="700" y="514" fill="#7ee787" font-size="10">    case 3: alloc();   state=7;</text>
  <text x="700" y="532" fill="#7ee787" font-size="10">    case 7: exec();    return;</text>
  <text x="700" y="550" fill="#7ee787" font-size="10">}}</text>
</svg>
