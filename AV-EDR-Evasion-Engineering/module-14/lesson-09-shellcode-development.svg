<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="a1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Position-Independent Shellcode Architecture</text>

  <!-- Shellcode structure -->
  <rect x="30" y="52" width="600" height="290" rx="8" fill="#0d1117" stroke="#d2a8ff" stroke-width="2"/>
  <text x="330" y="75" text-anchor="middle" fill="#d2a8ff" font-size="14" font-weight="bold">x64 Shellcode Execution Flow</text>

  <!-- Stage 1 -->
  <rect x="50" y="92" width="180" height="70" rx="6" fill="#0d1117" stroke="#f0883e" stroke-width="1.5"/>
  <text x="140" y="112" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">Stage 1: PEB Walk</text>
  <text x="60" y="132" fill="#7ee787" font-size="9">mov rax, gs:[0x60]</text>
  <text x="60" y="148" fill="#7ee787" font-size="9">; PEB → LDR → modules</text>
  <line x1="235" y1="127" x2="260" y2="127" stroke="#f0883e" stroke-width="2" marker-end="url(#a1)"/>

  <!-- Stage 2 -->
  <rect x="265" y="92" width="180" height="70" rx="6" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="355" y="112" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">Stage 2: Find Module</text>
  <text x="275" y="132" fill="#7ee787" font-size="9">Hash DLL name (ROR13)</text>
  <text x="275" y="148" fill="#7ee787" font-size="9">Compare until match</text>
  <line x1="450" y1="127" x2="475" y2="127" stroke="#f0883e" stroke-width="2" marker-end="url(#a1)"/>

  <!-- Stage 3 -->
  <rect x="480" y="92" width="130" height="70" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="545" y="112" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">Stage 3: EAT</text>
  <text x="490" y="132" fill="#7ee787" font-size="9">Parse exports</text>
  <text x="490" y="148" fill="#7ee787" font-size="9">Hash + match</text>

  <!-- Stage 4 -->
  <rect x="50" y="185" width="180" height="70" rx="6" fill="#0d1117" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="140" y="205" text-anchor="middle" fill="#d2a8ff" font-size="11" font-weight="bold">Stage 4: Resolve API</text>
  <text x="60" y="225" fill="#7ee787" font-size="9">GetProcAddress equiv</text>
  <text x="60" y="241" fill="#7ee787" font-size="9">via EAT + ordinals</text>
  <line x1="235" y1="220" x2="260" y2="220" stroke="#f0883e" stroke-width="2" marker-end="url(#a1)"/>

  <!-- Stage 5 -->
  <rect x="265" y="185" width="180" height="70" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="1.5"/>
  <text x="355" y="205" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">Stage 5: Execute</text>
  <text x="275" y="225" fill="#7ee787" font-size="9">call resolved_func</text>
  <text x="275" y="241" fill="#7ee787" font-size="9">; payload action</text>

  <!-- Key rules -->
  <text x="50" y="285" fill="#f0883e" font-size="11" font-weight="bold">Position-Independent Rules:</text>
  <text x="50" y="305" fill="#c9d1d9" font-size="10">• No absolute addresses — use RIP-relative or delta calculation</text>
  <text x="50" y="323" fill="#c9d1d9" font-size="10">• No null bytes (0x00) — terminates string copy operations</text>

  <!-- API hashing -->
  <rect x="660" y="52" width="310" height="290" rx="8" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
  <text x="815" y="75" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="bold">API Hashing (ROR13)</text>
  <text x="680" y="100" fill="#7ee787" font-size="9">hash_api:</text>
  <text x="690" y="116" fill="#7ee787" font-size="9">xor  edx, edx</text>
  <text x="690" y="132" fill="#7ee787" font-size="9">xor  eax, eax</text>
  <text x="680" y="148" fill="#7ee787" font-size="9">.loop:</text>
  <text x="690" y="164" fill="#7ee787" font-size="9">lodsb</text>
  <text x="690" y="180" fill="#7ee787" font-size="9">test al, al</text>
  <text x="690" y="196" fill="#7ee787" font-size="9">jz   .done</text>
  <text x="690" y="212" fill="#7ee787" font-size="9">ror  edx, 13</text>
  <text x="690" y="228" fill="#7ee787" font-size="9">add  edx, eax</text>
  <text x="690" y="244" fill="#7ee787" font-size="9">jmp  .loop</text>
  <text x="680" y="260" fill="#7ee787" font-size="9">.done:</text>
  <text x="690" y="276" fill="#7ee787" font-size="9">; edx = hash</text>
  <text x="680" y="300" fill="#8b949e" font-size="9">Example hashes:</text>
  <text x="680" y="316" fill="#c9d1d9" font-size="9">LoadLibraryA = 0x726774C</text>
  <text x="680" y="332" fill="#c9d1d9" font-size="9">VirtualAlloc = 0x91AFCA54</text>

  <!-- Memory layout -->
  <rect x="30" y="358" width="940" height="100" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="500" y="381" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">Shellcode Memory Layout (Position-Independent)</text>
  <rect x="60" y="400" width="120" height="40" rx="4" fill="#1a1a2e" stroke="#d2a8ff"/>
  <text x="120" y="425" text-anchor="middle" fill="#d2a8ff" font-size="9">PEB Walker</text>
  <rect x="190" y="400" width="120" height="40" rx="4" fill="#1a1a2e" stroke="#f0883e"/>
  <text x="250" y="425" text-anchor="middle" fill="#f0883e" font-size="9">Hash Resolver</text>
  <rect x="320" y="400" width="120" height="40" rx="4" fill="#1a1a2e" stroke="#58a6ff"/>
  <text x="380" y="425" text-anchor="middle" fill="#58a6ff" font-size="9">API Caller</text>
  <rect x="450" y="400" width="120" height="40" rx="4" fill="#1a1a2e" stroke="#3fb950"/>
  <text x="510" y="425" text-anchor="middle" fill="#3fb950" font-size="9">Payload Logic</text>
  <rect x="580" y="400" width="120" height="40" rx="4" fill="#1a1a2e" stroke="#f85149"/>
  <text x="640" y="425" text-anchor="middle" fill="#f85149" font-size="9">String Data</text>
  <rect x="710" y="400" width="120" height="40" rx="4" fill="#1a1a2e" stroke="#8b949e"/>
  <text x="770" y="425" text-anchor="middle" fill="#8b949e" font-size="9">Hash Table</text>
  <text x="60" y="452" fill="#8b949e" font-size="9">← Code sections (executable) →     ← Data (read via call+pop delta) →</text>

  <!-- Bottom -->
  <rect x="30" y="470" width="940" height="95" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="495" fill="#58a6ff" font-size="13" font-weight="bold">Shellcode Development Workflow</text>
  <text x="50" y="515" fill="#c9d1d9" font-size="11">1. Write in NASM/MASM  →  2. Assemble to raw bytes  →  3. Extract .text section  →  4. Test in loader</text>
  <text x="50" y="540" fill="#c9d1d9" font-size="11">Tools: NASM (nasm -f win64), objdump, xxd for byte extraction, x64dbg for debugging</text>
  <text x="50" y="557" fill="#f0883e" font-size="10">Every instruction must be null-free, position-independent, and stack-aligned to 16 bytes per x64 ABI</text>
</svg>