<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Userland Hooking Mechanisms — Inline vs IAT vs EAT</text>

  <!-- Inline Hook -->
  <rect x="20" y="55" width="310" height="240" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="175" y="78" text-anchor="middle" fill="#f85149" font-size="14" font-weight="bold">Inline Hook (Detour)</text>
  <text x="40" y="102" fill="#8b949e" font-size="11">Original:</text>
  <text x="45" y="120" fill="#7ee787" font-size="10">4C 8B D1    mov r10, rcx</text>
  <text x="45" y="138" fill="#7ee787" font-size="10">B8 18 00    mov eax, 0x18</text>
  <text x="40" y="165" fill="#8b949e" font-size="11">Hooked:</text>
  <text x="45" y="183" fill="#ff7b72" font-size="10">E9 XX XX XX XX  jmp EDR_Detour</text>
  <text x="45" y="201" fill="#6e7681" font-size="10">00 00 00        (overwritten)</text>
  <text x="40" y="230" fill="#c9d1d9" font-size="10">Overwrites first 5+ bytes</text>
  <text x="40" y="248" fill="#c9d1d9" font-size="10">of function prologue</text>
  <text x="40" y="272" fill="#f85149" font-size="10">Detection: Compare .text with disk</text>
  <text x="40" y="288" fill="#f85149" font-size="9">Most common EDR hook type</text>

  <!-- IAT Hook -->
  <rect x="345" y="55" width="310" height="240" rx="8" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
  <text x="500" y="78" text-anchor="middle" fill="#f0883e" font-size="14" font-weight="bold">IAT Hook</text>
  <text x="365" y="102" fill="#8b949e" font-size="11">Import Address Table:</text>
  <text x="370" y="125" fill="#c9d1d9" font-size="10">┌─────────────────────────┐</text>
  <text x="370" y="143" fill="#7ee787" font-size="10">│ CreateFileW → kernel32  │</text>
  <text x="370" y="161" fill="#ff7b72" font-size="10">│ VirtualAlloc → EDR.dll  │ ← patched</text>
  <text x="370" y="179" fill="#7ee787" font-size="10">│ WriteFile   → kernel32  │</text>
  <text x="370" y="197" fill="#c9d1d9" font-size="10">└─────────────────────────┘</text>
  <text x="365" y="225" fill="#c9d1d9" font-size="10">Replaces function pointer</text>
  <text x="365" y="243" fill="#c9d1d9" font-size="10">in PE import table</text>
  <text x="365" y="272" fill="#f0883e" font-size="10">Detection: Validate IAT entries</text>
  <text x="365" y="288" fill="#f0883e" font-size="9">per-module scope, not global</text>

  <!-- EAT Hook -->
  <rect x="670" y="55" width="310" height="240" rx="8" fill="#0d1117" stroke="#d2a8ff" stroke-width="2"/>
  <text x="825" y="78" text-anchor="middle" fill="#d2a8ff" font-size="14" font-weight="bold">EAT Hook</text>
  <text x="690" y="102" fill="#8b949e" font-size="11">Export Address Table:</text>
  <text x="695" y="125" fill="#c9d1d9" font-size="10">┌──────────────────────────┐</text>
  <text x="695" y="143" fill="#7ee787" font-size="10">│ NtAllocVM  → RVA 0x1234 │</text>
  <text x="695" y="161" fill="#ff7b72" font-size="10">│ NtWriteVM  → RVA 0xDEAD │ ← patched</text>
  <text x="695" y="179" fill="#7ee787" font-size="10">│ NtCreateTh → RVA 0x5678 │</text>
  <text x="695" y="197" fill="#c9d1d9" font-size="10">└──────────────────────────┘</text>
  <text x="690" y="225" fill="#c9d1d9" font-size="10">Modifies export RVA in</text>
  <text x="690" y="243" fill="#c9d1d9" font-size="10">source DLL's export table</text>
  <text x="690" y="272" fill="#d2a8ff" font-size="10">Detection: Validate EAT RVAs</text>
  <text x="690" y="288" fill="#d2a8ff" font-size="9">Affects all future resolutions</text>

  <!-- Comparison Table -->
  <rect x="20" y="315" width="960" height="245" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="500" y="340" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">Hook Type Comparison</text>
  <!-- Headers -->
  <text x="40" y="370" fill="#58a6ff" font-size="11" font-weight="bold">Property</text>
  <text x="280" y="370" fill="#f85149" font-size="11" font-weight="bold">Inline</text>
  <text x="530" y="370" fill="#f0883e" font-size="11" font-weight="bold">IAT</text>
  <text x="770" y="370" fill="#d2a8ff" font-size="11" font-weight="bold">EAT</text>
  <line x1="40" y1="378" x2="960" y2="378" stroke="#30363d" stroke-width="1"/>
  <!-- Rows -->
  <text x="40" y="398" fill="#8b949e" font-size="10">Scope</text>
  <text x="280" y="398" fill="#c9d1d9" font-size="10">Global (all callers)</text>
  <text x="530" y="398" fill="#c9d1d9" font-size="10">Per-module IAT</text>
  <text x="770" y="398" fill="#c9d1d9" font-size="10">All future GetProcAddress</text>
  <text x="40" y="420" fill="#8b949e" font-size="10">Modifies</text>
  <text x="280" y="420" fill="#c9d1d9" font-size="10">.text section bytes</text>
  <text x="530" y="420" fill="#c9d1d9" font-size="10">.idata / .rdata pointers</text>
  <text x="770" y="420" fill="#c9d1d9" font-size="10">Export directory RVAs</text>
  <text x="40" y="442" fill="#8b949e" font-size="10">Bypass</text>
  <text x="280" y="442" fill="#c9d1d9" font-size="10">Unhook / direct syscall</text>
  <text x="530" y="442" fill="#c9d1d9" font-size="10">Manual GetProcAddress</text>
  <text x="770" y="442" fill="#c9d1d9" font-size="10">Manual export parsing</text>
  <text x="40" y="464" fill="#8b949e" font-size="10">Detect</text>
  <text x="280" y="464" fill="#c9d1d9" font-size="10">Byte comparison vs disk</text>
  <text x="530" y="464" fill="#c9d1d9" font-size="10">Validate ptr range</text>
  <text x="770" y="464" fill="#c9d1d9" font-size="10">Validate RVA in module</text>
  <text x="40" y="486" fill="#8b949e" font-size="10">EDR Use</text>
  <text x="280" y="486" fill="#c9d1d9" font-size="10">Very common (ntdll)</text>
  <text x="530" y="486" fill="#c9d1d9" font-size="10">Less common</text>
  <text x="770" y="486" fill="#c9d1d9" font-size="10">Rare</text>

  <!-- Legend -->
  <rect x="40" y="530" width="12" height="12" fill="#f85149"/><text x="60" y="541" fill="#8b949e" font-size="10">Inline</text>
  <rect x="140" y="530" width="12" height="12" fill="#f0883e"/><text x="160" y="541" fill="#8b949e" font-size="10">IAT</text>
  <rect x="220" y="530" width="12" height="12" fill="#d2a8ff"/><text x="240" y="541" fill="#8b949e" font-size="10">EAT</text>
  <text x="350" y="541" fill="#3fb950" font-size="10">Direct syscalls bypass ALL three hook types</text>
</svg>