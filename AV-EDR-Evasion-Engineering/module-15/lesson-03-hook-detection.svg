<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
    <marker id="ared" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f85149"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Hook Detection &amp; Classification Flowchart</text>

  <!-- Start -->
  <rect x="380" y="50" width="240" height="40" rx="20" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="500" y="75" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Start: Read function prologue</text>

  <!-- Check first byte -->
  <line x1="500" y1="90" x2="500" y2="115" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="350" y="118" width="300" height="40" rx="6" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
  <text x="500" y="143" text-anchor="middle" fill="#f0883e" font-size="11">First byte == 0xE9 (JMP rel32)?</text>

  <!-- Yes: JMP hook -->
  <line x1="650" y1="138" x2="730" y2="138" stroke="#f85149" stroke-width="2" marker-end="url(#ared)"/>
  <text x="690" y="130" fill="#3fb950" font-size="10">YES</text>
  <rect x="735" y="118" width="240" height="40" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="855" y="143" text-anchor="middle" fill="#f85149" font-size="11">5-byte JMP inline hook detected</text>

  <!-- No: check for short JMP -->
  <line x1="500" y1="158" x2="500" y2="183" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="515" y="175" fill="#8b949e" font-size="10">NO</text>
  <rect x="350" y="186" width="300" height="40" rx="6" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
  <text x="500" y="211" text-anchor="middle" fill="#f0883e" font-size="11">First byte == 0xEB (JMP rel8)?</text>

  <!-- Yes: short JMP -->
  <line x1="650" y1="206" x2="730" y2="206" stroke="#f85149" stroke-width="2" marker-end="url(#ared)"/>
  <text x="690" y="198" fill="#3fb950" font-size="10">YES</text>
  <rect x="735" y="186" width="240" height="40" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="855" y="211" text-anchor="middle" fill="#f85149" font-size="11">2-byte short JMP hook</text>

  <!-- No: check for MOV RAX -->
  <line x1="500" y1="226" x2="500" y2="251" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="515" y="243" fill="#8b949e" font-size="10">NO</text>
  <rect x="330" y="254" width="340" height="40" rx="6" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
  <text x="500" y="279" text-anchor="middle" fill="#f0883e" font-size="11">Bytes == 48 B8 (MOV RAX, imm64) + FF E0?</text>

  <!-- Yes: hotpatch -->
  <line x1="670" y1="274" x2="730" y2="274" stroke="#f85149" stroke-width="2" marker-end="url(#ared)"/>
  <text x="700" y="266" fill="#3fb950" font-size="10">YES</text>
  <rect x="735" y="254" width="240" height="40" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="855" y="279" text-anchor="middle" fill="#f85149" font-size="11">12-byte hotpatch trampoline</text>

  <!-- No: check 4C 8B D1 B8 -->
  <line x1="500" y1="294" x2="500" y2="319" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="515" y="311" fill="#8b949e" font-size="10">NO</text>
  <rect x="330" y="322" width="340" height="40" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="500" y="347" text-anchor="middle" fill="#3fb950" font-size="11">Bytes == 4C 8B D1 B8 (clean stub)?</text>

  <!-- Yes: clean -->
  <line x1="670" y1="342" x2="730" y2="342" stroke="#3fb950" stroke-width="2" marker-end="url(#ag)"/>
  <text x="700" y="334" fill="#3fb950" font-size="10">YES</text>
  <rect x="735" y="322" width="240" height="40" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="855" y="347" text-anchor="middle" fill="#3fb950" font-size="11">CLEAN — no hook present</text>

  <!-- No: unknown -->
  <line x1="500" y1="362" x2="500" y2="387" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="515" y="379" fill="#8b949e" font-size="10">NO</text>
  <rect x="370" y="390" width="260" height="40" rx="6" fill="#0d1117" stroke="#d2a8ff" stroke-width="2"/>
  <text x="500" y="415" text-anchor="middle" fill="#d2a8ff" font-size="11">Unknown hook or obfuscation</text>

  <!-- Extract info box -->
  <rect x="30" y="460" width="940" height="105" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="485" fill="#58a6ff" font-size="13" font-weight="bold">Post-Detection: Extract Hook Info</text>
  <text x="50" y="508" fill="#c9d1d9" font-size="10">1. Calculate JMP target address: hook_addr + 5 + *(int32*)(hook_addr + 1)</text>
  <text x="50" y="526" fill="#c9d1d9" font-size="10">2. Identify target module: compare address range against loaded DLL base addresses</text>
  <text x="50" y="544" fill="#c9d1d9" font-size="10">3. Extract SSN from trampoline: saved original bytes contain mov eax, SSN</text>
  <rect x="700" y="495" width="250" height="55" rx="6" fill="#0d1117" stroke="#f85149"/>
  <text x="825" y="517" text-anchor="middle" fill="#ff7b72" font-size="10">E9 XX XX XX XX → target</text>
  <text x="825" y="537" text-anchor="middle" fill="#8b949e" font-size="9">signed 32-bit relative offset</text>
</svg>