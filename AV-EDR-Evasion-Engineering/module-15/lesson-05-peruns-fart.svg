<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Perun's Fart — Full DLL Unhooking via Suspended Process</text>

  <!-- Step 1 -->
  <rect x="30" y="55" width="280" height="120" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="170" y="78" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">1. Create Suspended Process</text>
  <text x="50" y="100" fill="#c9d1d9" font-size="10">CreateProcessW(</text>
  <text x="55" y="115" fill="#7ee787" font-size="10">"svchost.exe",</text>
  <text x="55" y="130" fill="#7ee787" font-size="10">CREATE_SUSPENDED)</text>
  <text x="50" y="155" fill="#8b949e" font-size="9">Fresh ntdll mapped — EDR hooks not yet installed</text>

  <line x1="315" y1="115" x2="350" y2="115" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Step 2 -->
  <rect x="355" y="55" width="280" height="120" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="495" y="78" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">2. Read Clean ntdll</text>
  <text x="375" y="100" fill="#c9d1d9" font-size="10">NtReadVirtualMemory(</text>
  <text x="380" y="115" fill="#7ee787" font-size="10">hSuspended,</text>
  <text x="380" y="130" fill="#7ee787" font-size="10">ntdll_base, ...)</text>
  <text x="375" y="155" fill="#8b949e" font-size="9">Extract .text section from suspended process</text>

  <line x1="640" y1="115" x2="675" y2="115" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Step 3 -->
  <rect x="680" y="55" width="295" height="120" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="827" y="78" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">3. Replace Hooked Section</text>
  <text x="700" y="100" fill="#c9d1d9" font-size="10">NtProtectVirtualMemory(RW)</text>
  <text x="700" y="118" fill="#c9d1d9" font-size="10">memcpy(local_ntdll.text,</text>
  <text x="700" y="133" fill="#c9d1d9" font-size="10">  clean_ntdll.text)</text>
  <text x="700" y="148" fill="#c9d1d9" font-size="10">NtProtectVirtualMemory(RX)</text>
  <text x="700" y="165" fill="#3fb950" font-size="9">✓ All hooks overwritten</text>

  <!-- Timeline diagram -->
  <rect x="30" y="200" width="940" height="190" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="225" fill="#58a6ff" font-size="13" font-weight="bold">Why Suspended Process Has Clean ntdll</text>

  <!-- Our process timeline -->
  <text x="50" y="255" fill="#f85149" font-size="11">Our Process:</text>
  <rect x="200" y="243" width="100" height="20" rx="4" fill="#3fb950"/>
  <text x="250" y="257" text-anchor="middle" fill="#0d1117" font-size="9" font-weight="bold">ntdll loads</text>
  <rect x="305" y="243" width="120" height="20" rx="4" fill="#f0883e"/>
  <text x="365" y="257" text-anchor="middle" fill="#0d1117" font-size="9" font-weight="bold">EDR DLL injects</text>
  <rect x="430" y="243" width="100" height="20" rx="4" fill="#f85149"/>
  <text x="480" y="257" text-anchor="middle" fill="#0d1117" font-size="9" font-weight="bold">Hooks placed</text>
  <rect x="535" y="243" width="80" height="20" rx="4" fill="#6e7681"/>
  <text x="575" y="257" text-anchor="middle" fill="#c9d1d9" font-size="9">main()</text>

  <!-- Suspended process timeline -->
  <text x="50" y="300" fill="#3fb950" font-size="11">Suspended:</text>
  <rect x="200" y="288" width="100" height="20" rx="4" fill="#3fb950"/>
  <text x="250" y="302" text-anchor="middle" fill="#0d1117" font-size="9" font-weight="bold">ntdll loads</text>
  <rect x="305" y="288" width="200" height="20" rx="4" fill="#0d1117" stroke="#3fb950" stroke-dasharray="4"/>
  <text x="405" y="302" text-anchor="middle" fill="#3fb950" font-size="9">SUSPENDED — EDR never hooks</text>

  <text x="50" y="340" fill="#c9d1d9" font-size="10">Key insight: Windows maps ntdll.dll into every process BEFORE the process starts executing.</text>
  <text x="50" y="358" fill="#c9d1d9" font-size="10">If we create a process in suspended state, its ntdll is clean — EDR hooks are installed later,</text>
  <text x="50" y="376" fill="#c9d1d9" font-size="10">typically when the EDR's DLL loads via AppInit_DLLs or an APC callback.</text>

  <!-- OPSEC box -->
  <rect x="30" y="410" width="940" height="155" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="50" y="435" fill="#58a6ff" font-size="13" font-weight="bold">OPSEC Trade-offs</text>
  <text x="50" y="460" fill="#3fb950" font-size="10">✓ No file system access — avoids minifilter detection</text>
  <text x="50" y="478" fill="#3fb950" font-size="10">✓ Clean ntdll guaranteed if process is truly suspended before EDR DLL load</text>
  <text x="50" y="496" fill="#3fb950" font-size="10">✓ Works even when KnownDlls access is monitored</text>
  <text x="50" y="520" fill="#f85149" font-size="10">⚠ Process creation is monitored (PsSetCreateProcessNotifyRoutine)</text>
  <text x="50" y="538" fill="#f85149" font-size="10">⚠ Cross-process read (NtReadVirtualMemory) is high-signal for some EDRs</text>
  <text x="50" y="556" fill="#f85149" font-size="10">⚠ Some EDRs hook ntdll BEFORE returning from NtCreateProcess (kernel callback)</text>
</svg>