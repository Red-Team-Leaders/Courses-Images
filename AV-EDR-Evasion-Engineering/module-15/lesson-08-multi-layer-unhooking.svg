<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Multi-Source Unhooking Strategies Compared</text>

  <!-- Source 1: Disk -->
  <rect x="20" y="55" width="230" height="210" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="135" y="78" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">From Disk</text>
  <text x="40" y="100" fill="#c9d1d9" font-size="10">CreateFileW + ReadFile</text>
  <text x="40" y="118" fill="#c9d1d9" font-size="10">Parse PE, extract .text</text>
  <text x="40" y="142" fill="#3fb950" font-size="10">✓ Simple to implement</text>
  <text x="40" y="160" fill="#3fb950" font-size="10">✓ Always available</text>
  <text x="40" y="184" fill="#f85149" font-size="10">✗ Minifilter visibility</text>
  <text x="40" y="202" fill="#f85149" font-size="10">✗ File I/O telemetry</text>
  <text x="40" y="220" fill="#f85149" font-size="10">✗ CrowdStrike detection</text>
  <text x="40" y="248" fill="#f0883e" font-size="10">OPSEC: LOW</text>

  <!-- Source 2: KnownDlls -->
  <rect x="270" y="55" width="230" height="210" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="385" y="78" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">From KnownDlls</text>
  <text x="290" y="100" fill="#c9d1d9" font-size="10">NtOpenSection + MapView</text>
  <text x="290" y="118" fill="#c9d1d9" font-size="10">\KnownDlls\ntdll.dll</text>
  <text x="290" y="142" fill="#3fb950" font-size="10">✓ No filesystem access</text>
  <text x="290" y="160" fill="#3fb950" font-size="10">✓ No minifilter visibility</text>
  <text x="290" y="184" fill="#f85149" font-size="10">✗ Section open monitored</text>
  <text x="290" y="202" fill="#f85149" font-size="10">✗ MapView may be logged</text>
  <text x="290" y="220" fill="#3fb950" font-size="10">✓ Fast, kernel-cached</text>
  <text x="290" y="248" fill="#3fb950" font-size="10">OPSEC: MEDIUM-HIGH</text>

  <!-- Source 3: Suspended Process -->
  <rect x="520" y="55" width="230" height="210" rx="8" fill="#0d1117" stroke="#d2a8ff" stroke-width="2"/>
  <text x="635" y="78" text-anchor="middle" fill="#d2a8ff" font-size="13" font-weight="bold">Suspended Process</text>
  <text x="540" y="100" fill="#c9d1d9" font-size="10">CreateProcess SUSPENDED</text>
  <text x="540" y="118" fill="#c9d1d9" font-size="10">ReadProcessMemory</text>
  <text x="540" y="142" fill="#3fb950" font-size="10">✓ No filesystem access</text>
  <text x="540" y="160" fill="#3fb950" font-size="10">✓ Pre-hook clean copy</text>
  <text x="540" y="184" fill="#f85149" font-size="10">✗ Process creation event</text>
  <text x="540" y="202" fill="#f85149" font-size="10">✗ Cross-process read</text>
  <text x="540" y="220" fill="#f85149" font-size="10">✗ Must terminate after</text>
  <text x="540" y="248" fill="#d2a8ff" font-size="10">OPSEC: MEDIUM</text>

  <!-- Source 4: Section remap -->
  <rect x="770" y="55" width="210" height="210" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="875" y="78" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Section Remap</text>
  <text x="790" y="100" fill="#c9d1d9" font-size="10">NtCreateSection +</text>
  <text x="790" y="118" fill="#c9d1d9" font-size="10">NtMapViewOfSection</text>
  <text x="790" y="142" fill="#3fb950" font-size="10">✓ Custom mapping</text>
  <text x="790" y="160" fill="#3fb950" font-size="10">✓ Flexible source</text>
  <text x="790" y="184" fill="#3fb950" font-size="10">✓ Can map anywhere</text>
  <text x="790" y="202" fill="#f85149" font-size="10">✗ Complex setup</text>
  <text x="790" y="220" fill="#f85149" font-size="10">✗ Requires file handle</text>
  <text x="790" y="248" fill="#58a6ff" font-size="10">OPSEC: MEDIUM</text>

  <!-- Decision matrix -->
  <rect x="20" y="290" width="960" height="275" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="315" fill="#58a6ff" font-size="13" font-weight="bold">Operational Decision Matrix</text>

  <text x="50" y="345" fill="#58a6ff" font-size="11" font-weight="bold">Scenario</text>
  <text x="400" y="345" fill="#58a6ff" font-size="11" font-weight="bold">Recommended Source</text>
  <text x="700" y="345" fill="#58a6ff" font-size="11" font-weight="bold">Reason</text>
  <line x1="50" y1="353" x2="960" y2="353" stroke="#30363d"/>

  <text x="50" y="375" fill="#c9d1d9" font-size="10">Standard engagement</text>
  <text x="400" y="375" fill="#3fb950" font-size="10">KnownDlls</text>
  <text x="700" y="375" fill="#8b949e" font-size="10">Best OPSEC, no file I/O</text>

  <text x="50" y="400" fill="#c9d1d9" font-size="10">EDR monitors KnownDlls</text>
  <text x="400" y="400" fill="#d2a8ff" font-size="10">Suspended Process</text>
  <text x="700" y="400" fill="#8b949e" font-size="10">Alternative clean source</text>

  <text x="50" y="425" fill="#c9d1d9" font-size="10">Maximum stealth</text>
  <text x="400" y="425" fill="#f0883e" font-size="10">Direct/Indirect Syscalls</text>
  <text x="700" y="425" fill="#8b949e" font-size="10">Skip unhooking entirely</text>

  <text x="50" y="450" fill="#c9d1d9" font-size="10">Quick and dirty</text>
  <text x="400" y="450" fill="#f85149" font-size="10">Disk Read</text>
  <text x="700" y="450" fill="#8b949e" font-size="10">Simple but noisy</text>

  <text x="50" y="475" fill="#c9d1d9" font-size="10">Multiple DLLs needed</text>
  <text x="400" y="475" fill="#3fb950" font-size="10">KnownDlls + Selective</text>
  <text x="700" y="475" fill="#8b949e" font-size="10">Only unhook needed funcs</text>

  <!-- Key insight -->
  <text x="50" y="510" fill="#f0883e" font-size="12" font-weight="bold">Key Insight:</text>
  <text x="50" y="530" fill="#c9d1d9" font-size="10">Full unhooking is the noisiest option. Prefer selective per-function unhooking or direct syscalls.</text>
  <text x="50" y="548" fill="#c9d1d9" font-size="10">Only unhook what you need, when you need it. The best unhooking is no unhooking at all.</text>
</svg>