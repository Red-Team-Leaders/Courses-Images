<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">user32.dll Unhooking — Non-Syscall DLL Challenges</text>

  <!-- user32 vs ntdll -->
  <rect x="20" y="55" width="470" height="160" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="255" y="78" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">user32.dll — Different from ntdll</text>
  <text x="40" y="100" fill="#c9d1d9" font-size="10">user32.dll is NOT a syscall DLL — it wraps win32k.sys calls</text>
  <text x="40" y="120" fill="#c9d1d9" font-size="10">No syscall stubs to analyze for hook detection</text>
  <text x="40" y="140" fill="#c9d1d9" font-size="10">Hooks target exported Win32 functions directly</text>
  <text x="40" y="165" fill="#f85149" font-size="10">Cannot use Gate techniques or SSN resolution</text>
  <text x="40" y="185" fill="#f85149" font-size="10">Must rely on .text section comparison for hook detection</text>
  <text x="40" y="205" fill="#8b949e" font-size="9">user32 has complex internal dependencies (kernel callbacks, win32k)</text>

  <!-- Commonly hooked functions -->
  <rect x="510" y="55" width="470" height="160" rx="8" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
  <text x="745" y="78" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="bold">Commonly Hooked user32 Functions</text>
  <text x="530" y="100" fill="#ff7b72" font-size="10">SetWindowsHookExW — keylogger detection</text>
  <text x="530" y="118" fill="#ff7b72" font-size="10">SendMessageW — message injection detection</text>
  <text x="530" y="136" fill="#ff7b72" font-size="10">PostMessageW — async message injection</text>
  <text x="530" y="154" fill="#ff7b72" font-size="10">FindWindowW — window enumeration recon</text>
  <text x="530" y="172" fill="#ff7b72" font-size="10">GetAsyncKeyState — keylogging detection</text>
  <text x="530" y="190" fill="#ff7b72" font-size="10">SetClipboardData — clipboard hijacking</text>
  <text x="530" y="208" fill="#8b949e" font-size="9">EDRs hook these for behavioral monitoring, not syscall interception</text>

  <!-- Unhooking approach -->
  <rect x="20" y="240" width="960" height="170" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="265" fill="#58a6ff" font-size="13" font-weight="bold">user32.dll Unhooking Flow</text>

  <rect x="40" y="280" width="170" height="45" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="125" y="300" text-anchor="middle" fill="#3fb950" font-size="9">Get user32 base</text>
  <text x="125" y="315" text-anchor="middle" fill="#8b949e" font-size="8">GetModuleHandleW</text>
  <line x1="215" y1="302" x2="235" y2="302" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="240" y="280" width="160" height="45" rx="6" fill="#0d1117" stroke="#f0883e" stroke-width="1.5"/>
  <text x="320" y="300" text-anchor="middle" fill="#f0883e" font-size="9">Read clean user32</text>
  <text x="320" y="315" text-anchor="middle" fill="#8b949e" font-size="8">from disk or KnownDlls</text>
  <line x1="405" y1="302" x2="425" y2="302" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="430" y="280" width="160" height="45" rx="6" fill="#0d1117" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="510" y="300" text-anchor="middle" fill="#d2a8ff" font-size="9">Parse PE sections</text>
  <text x="510" y="315" text-anchor="middle" fill="#8b949e" font-size="8">find .text offset + size</text>
  <line x1="595" y1="302" x2="615" y2="302" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="620" y="280" width="160" height="45" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="1.5"/>
  <text x="700" y="300" text-anchor="middle" fill="#f85149" font-size="9">VirtualProtect RW</text>
  <text x="700" y="315" text-anchor="middle" fill="#8b949e" font-size="8">memcpy .text section</text>
  <line x1="785" y1="302" x2="805" y2="302" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="810" y="280" width="150" height="45" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="885" y="300" text-anchor="middle" fill="#3fb950" font-size="9">Restore RX</text>
  <text x="885" y="315" text-anchor="middle" fill="#3fb950" font-size="8">✓ Hooks removed</text>

  <text x="50" y="355" fill="#f85149" font-size="10">⚠ Risk: user32.dll has complex internal state. Full .text replacement may break callbacks.</text>
  <text x="50" y="375" fill="#3fb950" font-size="10">✓ Safer: selective per-function unhooking — only restore the specific functions you need</text>
  <text x="50" y="395" fill="#8b949e" font-size="10">user32 is NOT in KnownDlls on all Windows versions — verify before using that source</text>

  <!-- user32 call chain -->
  <rect x="20" y="430" width="960" height="135" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="50" y="455" fill="#58a6ff" font-size="13" font-weight="bold">user32.dll Internal Call Chain</text>
  <text x="50" y="480" fill="#c9d1d9" font-size="10">user32.dll exports → call into win32u.dll stubs → syscall into win32k.sys (kernel)</text>
  <text x="50" y="500" fill="#c9d1d9" font-size="10">Unlike ntdll: user32 functions do significant processing BEFORE the kernel transition</text>
  <text x="50" y="525" fill="#d2a8ff" font-size="10">Window creation, message dispatch, input processing — all happen in user32 code</text>
  <text x="50" y="545" fill="#f0883e" font-size="10">Unhooking user32 alone is insufficient if EDR also hooks win32u.dll stubs</text>
</svg>