<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="a1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Section-Based Injection — NtCreateSection + NtMapViewOfSection</text>

  <!-- Step 1: Create Section -->
  <rect x="30" y="60" width="200" height="110" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="130" y="82" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">1. Create Section</text>
  <text x="50" y="105" fill="#7ee787" font-size="10">NtCreateSection(</text>
  <text x="60" y="120" fill="#c9d1d9" font-size="9">&amp;hSection,</text>
  <text x="60" y="135" fill="#c9d1d9" font-size="9">SECTION_ALL_ACCESS,</text>
  <text x="60" y="150" fill="#c9d1d9" font-size="9">shellcodeSize)</text>
  <text x="50" y="165" fill="#7ee787" font-size="10">)</text>

  <!-- Arrow 1→2 -->
  <line x1="230" y1="115" x2="280" y2="115" stroke="#3fb950" stroke-width="2" marker-end="url(#a1)"/>

  <!-- Step 2: Map Local -->
  <rect x="290" y="60" width="200" height="110" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="390" y="82" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">2. Map in Local</text>
  <text x="310" y="105" fill="#7ee787" font-size="10">NtMapViewOfSection(</text>
  <text x="320" y="120" fill="#c9d1d9" font-size="9">hSection,</text>
  <text x="320" y="135" fill="#c9d1d9" font-size="9">GetCurrentProcess(),</text>
  <text x="320" y="150" fill="#c9d1d9" font-size="9">&amp;localBase, PAGE_RW)</text>

  <!-- Arrow 2→3 -->
  <line x1="490" y1="115" x2="540" y2="115" stroke="#3fb950" stroke-width="2" marker-end="url(#a1)"/>

  <!-- Step 3: Write Shellcode -->
  <rect x="550" y="60" width="200" height="110" rx="8" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
  <text x="650" y="82" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">3. Write Payload</text>
  <text x="570" y="105" fill="#7ee787" font-size="10">memcpy(</text>
  <text x="580" y="120" fill="#c9d1d9" font-size="9">localBase,</text>
  <text x="580" y="135" fill="#c9d1d9" font-size="9">shellcode,</text>
  <text x="580" y="150" fill="#c9d1d9" font-size="9">shellcodeSize)</text>
  <text x="570" y="165" fill="#8b949e" font-size="9">No WriteProcessMemory!</text>

  <!-- Arrow 3→4 -->
  <line x1="750" y1="115" x2="800" y2="115" stroke="#3fb950" stroke-width="2" marker-end="url(#a1)"/>

  <!-- Step 4: Map Remote -->
  <rect x="810" y="60" width="170" height="110" rx="8" fill="#0d1117" stroke="#d2a8ff" stroke-width="2"/>
  <text x="895" y="82" text-anchor="middle" fill="#d2a8ff" font-size="12" font-weight="bold">4. Map in Target</text>
  <text x="830" y="105" fill="#7ee787" font-size="10">NtMapViewOfSection(</text>
  <text x="840" y="120" fill="#c9d1d9" font-size="9">hSection,</text>
  <text x="840" y="135" fill="#c9d1d9" font-size="9">hTarget,</text>
  <text x="840" y="150" fill="#c9d1d9" font-size="9">PAGE_RX)</text>

  <!-- Shared Memory Diagram -->
  <rect x="100" y="210" width="800" height="160" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="500" y="235" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Shared Section Object (Kernel-Managed)</text>

  <!-- Local Process -->
  <rect x="140" y="255" width="280" height="90" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="280" y="278" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">Local Process (Attacker)</text>
  <text x="160" y="300" fill="#c9d1d9" font-size="10">localBase → [shellcode bytes]</text>
  <text x="160" y="318" fill="#8b949e" font-size="9">PAGE_READWRITE (write access)</text>
  <text x="160" y="336" fill="#3fb950" font-size="9">memcpy writes here locally</text>

  <!-- Shared section arrows -->
  <line x1="420" y1="300" x2="580" y2="300" stroke="#f0883e" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="500" y="293" text-anchor="middle" fill="#f0883e" font-size="10">Same physical pages</text>

  <!-- Target Process -->
  <rect x="580" y="255" width="280" height="90" rx="6" fill="#0d1117" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="720" y="278" text-anchor="middle" fill="#d2a8ff" font-size="11" font-weight="bold">Target Process (Victim)</text>
  <text x="600" y="300" fill="#c9d1d9" font-size="10">remoteBase → [shellcode bytes]</text>
  <text x="600" y="318" fill="#8b949e" font-size="9">PAGE_EXECUTE_READ (exec access)</text>
  <text x="600" y="336" fill="#d2a8ff" font-size="9">Executes via APC / thread hijack</text>

  <!-- Key advantages -->
  <rect x="30" y="390" width="940" height="175" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="418" fill="#3fb950" font-size="14" font-weight="bold">Why Section Injection Evades EDRs</text>

  <text x="50" y="445" fill="#c9d1d9" font-size="11">1. No WriteProcessMemory — payload delivered via shared memory mapping, invisible to API hooks</text>
  <text x="50" y="468" fill="#c9d1d9" font-size="11">2. No VirtualAllocEx — memory in target allocated by kernel section mapping, not explicit alloc</text>
  <text x="50" y="491" fill="#c9d1d9" font-size="11">3. Local write → Remote execute — permissions split across processes (RW local, RX remote)</text>
  <text x="50" y="514" fill="#c9d1d9" font-size="11">4. Clean call stack — no cross-process write APIs in thread call history</text>

  <text x="50" y="545" fill="#f85149" font-size="11" font-weight="bold">Detection vector: NtMapViewOfSection to remote process + subsequent thread/APC in that process</text>
</svg>