<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="a1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Thread Hijacking — Execution Without Thread Creation</text>

  <!-- Timeline -->
  <line x1="80" y1="70" x2="80" y2="480" stroke="#30363d" stroke-width="2"/>
  <text x="40" y="65" fill="#8b949e" font-size="11">Flow</text>

  <!-- Step 1 -->
  <circle cx="80" cy="95" r="6" fill="#58a6ff"/>
  <rect x="110" y="75" width="380" height="50" rx="6" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="130" y="97" fill="#58a6ff" font-size="12" font-weight="bold">1. Open Target Thread</text>
  <text x="130" y="115" fill="#7ee787" font-size="10">OpenThread(THREAD_ALL_ACCESS, FALSE, threadId)</text>

  <!-- Step 2 -->
  <circle cx="80" cy="155" r="6" fill="#f0883e"/>
  <rect x="110" y="135" width="380" height="50" rx="6" fill="#0d1117" stroke="#f0883e" stroke-width="1.5"/>
  <text x="130" y="157" fill="#f0883e" font-size="12" font-weight="bold">2. Suspend Thread</text>
  <text x="130" y="175" fill="#7ee787" font-size="10">SuspendThread(hThread)  // Thread paused</text>

  <!-- Step 3 -->
  <circle cx="80" cy="220" r="6" fill="#3fb950"/>
  <rect x="110" y="200" width="380" height="50" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="130" y="222" fill="#3fb950" font-size="12" font-weight="bold">3. Get Thread Context</text>
  <text x="130" y="240" fill="#7ee787" font-size="10">GetThreadContext(hThread, &amp;ctx)  // Save RIP</text>

  <!-- Step 4 -->
  <circle cx="80" cy="285" r="6" fill="#d2a8ff"/>
  <rect x="110" y="265" width="380" height="50" rx="6" fill="#0d1117" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="130" y="287" fill="#d2a8ff" font-size="12" font-weight="bold">4. Modify RIP → Shellcode</text>
  <text x="130" y="305" fill="#7ee787" font-size="10">ctx.Rip = shellcodeAddr  // Redirect execution</text>

  <!-- Step 5 -->
  <circle cx="80" cy="350" r="6" fill="#f85149"/>
  <rect x="110" y="330" width="380" height="50" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="1.5"/>
  <text x="130" y="352" fill="#f85149" font-size="12" font-weight="bold">5. Set Thread Context</text>
  <text x="130" y="370" fill="#7ee787" font-size="10">SetThreadContext(hThread, &amp;ctx)  // Apply new RIP</text>

  <!-- Step 6 -->
  <circle cx="80" cy="415" r="6" fill="#3fb950"/>
  <rect x="110" y="395" width="380" height="50" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="130" y="417" fill="#3fb950" font-size="12" font-weight="bold">6. Resume Thread</text>
  <text x="130" y="435" fill="#7ee787" font-size="10">ResumeThread(hThread)  // Shellcode runs!</text>

  <!-- Right side: CONTEXT structure -->
  <rect x="550" y="70" width="420" height="230" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="760" y="95" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">CONTEXT Structure (x64)</text>
  <text x="570" y="120" fill="#8b949e" font-size="10">Register</text>
  <text x="700" y="120" fill="#8b949e" font-size="10">Before Hijack</text>
  <text x="870" y="120" fill="#8b949e" font-size="10">After Hijack</text>
  <line x1="570" y1="128" x2="950" y2="128" stroke="#30363d"/>

  <text x="570" y="150" fill="#c9d1d9" font-size="11">RIP</text>
  <text x="700" y="150" fill="#3fb950" font-size="11">0x7FF8A1B2C3D4</text>
  <text x="870" y="150" fill="#f85149" font-size="11">0x1A000 (shellcode)</text>

  <text x="570" y="175" fill="#c9d1d9" font-size="11">RSP</text>
  <text x="700" y="175" fill="#c9d1d9" font-size="11">0x00BFFA80</text>
  <text x="870" y="175" fill="#c9d1d9" font-size="11">0x00BFFA80 (same)</text>

  <text x="570" y="200" fill="#c9d1d9" font-size="11">RCX</text>
  <text x="700" y="200" fill="#c9d1d9" font-size="11">0x00000042</text>
  <text x="870" y="200" fill="#c9d1d9" font-size="11">0x00000042 (same)</text>

  <text x="570" y="230" fill="#f0883e" font-size="11" font-weight="bold">Only RIP changes — minimal footprint</text>
  <text x="570" y="255" fill="#8b949e" font-size="10">Advanced: push original RIP to stack first</text>
  <text x="570" y="275" fill="#8b949e" font-size="10">so shellcode can RET back to original code</text>

  <!-- Advantages -->
  <rect x="550" y="315" width="420" height="135" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="570" y="340" fill="#3fb950" font-size="12" font-weight="bold">Advantages</text>
  <text x="570" y="363" fill="#c9d1d9" font-size="11">• No CreateRemoteThread — no thread creation event</text>
  <text x="570" y="383" fill="#c9d1d9" font-size="11">• Runs in existing thread context — blends in</text>
  <text x="570" y="403" fill="#c9d1d9" font-size="11">• No APC queue — different detection surface</text>
  <text x="570" y="423" fill="#c9d1d9" font-size="11">• Can restore original RIP after execution</text>
  <text x="570" y="443" fill="#f85149" font-size="10">Detection: SuspendThread→SetContext→Resume sequence</text>

  <!-- Bottom legend -->
  <rect x="30" y="470" width="460" height="95" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="495" fill="#f0883e" font-size="12" font-weight="bold">OPSEC Considerations</text>
  <text x="50" y="518" fill="#c9d1d9" font-size="10">• Use NtSuspendThread / NtSetContextThread (indirect syscalls)</text>
  <text x="50" y="536" fill="#c9d1d9" font-size="10">• Target a thread that is already waiting (WaitForSingleObject)</text>
  <text x="50" y="554" fill="#c9d1d9" font-size="10">• Push original RIP to stack before modifying context</text>
</svg>