<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="a1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">In-Memory Payload Execution — Zero Disk Footprint</text>

  <!-- Pipeline -->
  <rect x="30" y="60" width="170" height="80" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="115" y="85" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Allocate</text>
  <text x="115" y="105" text-anchor="middle" fill="#7ee787" font-size="9">VirtualAlloc(PAGE_RW)</text>
  <text x="115" y="120" text-anchor="middle" fill="#8b949e" font-size="9">No RWX — RW only</text>

  <line x1="200" y1="100" x2="230" y2="100" stroke="#3fb950" stroke-width="2" marker-end="url(#a1)"/>

  <rect x="240" y="60" width="170" height="80" rx="8" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
  <text x="325" y="85" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">Decrypt</text>
  <text x="325" y="105" text-anchor="middle" fill="#7ee787" font-size="9">AES/RC4/XOR decode</text>
  <text x="325" y="120" text-anchor="middle" fill="#8b949e" font-size="9">In-place decryption</text>

  <line x1="410" y1="100" x2="440" y2="100" stroke="#3fb950" stroke-width="2" marker-end="url(#a1)"/>

  <rect x="450" y="60" width="170" height="80" rx="8" fill="#0d1117" stroke="#d2a8ff" stroke-width="2"/>
  <text x="535" y="85" text-anchor="middle" fill="#d2a8ff" font-size="12" font-weight="bold">Protect</text>
  <text x="535" y="105" text-anchor="middle" fill="#7ee787" font-size="9">VirtualProtect(PAGE_RX)</text>
  <text x="535" y="120" text-anchor="middle" fill="#8b949e" font-size="9">RW → RX transition</text>

  <line x1="620" y1="100" x2="650" y2="100" stroke="#3fb950" stroke-width="2" marker-end="url(#a1)"/>

  <rect x="660" y="60" width="140" height="80" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="730" y="85" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Execute</text>
  <text x="730" y="105" text-anchor="middle" fill="#7ee787" font-size="9">((void(*)())ptr)()</text>
  <text x="730" y="120" text-anchor="middle" fill="#8b949e" font-size="9">Function pointer</text>

  <line x1="800" y1="100" x2="830" y2="100" stroke="#3fb950" stroke-width="2" marker-end="url(#a1)"/>

  <rect x="840" y="60" width="140" height="80" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="910" y="85" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">Cleanup</text>
  <text x="910" y="105" text-anchor="middle" fill="#7ee787" font-size="9">VirtualFree()</text>
  <text x="910" y="120" text-anchor="middle" fill="#8b949e" font-size="9">Zero + release</text>

  <!-- Memory state diagram -->
  <rect x="30" y="170" width="940" height="180" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="500" y="195" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Memory State Transitions</text>

  <!-- State 1 -->
  <rect x="60" y="215" width="160" height="110" rx="6" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="140" y="237" text-anchor="middle" fill="#58a6ff" font-size="10">After Alloc</text>
  <text x="80" y="258" fill="#c9d1d9" font-size="9">Prot: PAGE_READWRITE</text>
  <text x="80" y="275" fill="#c9d1d9" font-size="9">Content: zeros</text>
  <rect x="80" y="285" width="120" height="25" rx="3" fill="#3fb950" opacity="0.2"/>
  <text x="140" y="302" text-anchor="middle" fill="#3fb950" font-size="9">Clean — no flags</text>

  <!-- State 2 -->
  <rect x="260" y="215" width="160" height="110" rx="6" fill="#0d1117" stroke="#f0883e" stroke-width="1"/>
  <text x="340" y="237" text-anchor="middle" fill="#f0883e" font-size="10">After Decrypt</text>
  <text x="280" y="258" fill="#c9d1d9" font-size="9">Prot: PAGE_READWRITE</text>
  <text x="280" y="275" fill="#c9d1d9" font-size="9">Content: shellcode</text>
  <rect x="280" y="285" width="120" height="25" rx="3" fill="#f0883e" opacity="0.2"/>
  <text x="340" y="302" text-anchor="middle" fill="#f0883e" font-size="9">Payload exposed</text>

  <!-- State 3 -->
  <rect x="460" y="215" width="160" height="110" rx="6" fill="#0d1117" stroke="#d2a8ff" stroke-width="1"/>
  <text x="540" y="237" text-anchor="middle" fill="#d2a8ff" font-size="10">After Protect</text>
  <text x="480" y="258" fill="#c9d1d9" font-size="9">Prot: PAGE_EXECUTE_READ</text>
  <text x="480" y="275" fill="#c9d1d9" font-size="9">Content: shellcode</text>
  <rect x="480" y="285" width="120" height="25" rx="3" fill="#d2a8ff" opacity="0.2"/>
  <text x="540" y="302" text-anchor="middle" fill="#d2a8ff" font-size="9">Ready to execute</text>

  <!-- State 4 -->
  <rect x="660" y="215" width="160" height="110" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="740" y="237" text-anchor="middle" fill="#3fb950" font-size="10">Executing</text>
  <text x="680" y="258" fill="#c9d1d9" font-size="9">Prot: PAGE_EXECUTE_READ</text>
  <text x="680" y="275" fill="#c9d1d9" font-size="9">EIP/RIP inside region</text>
  <rect x="680" y="285" width="120" height="25" rx="3" fill="#3fb950" opacity="0.2"/>
  <text x="740" y="302" text-anchor="middle" fill="#3fb950" font-size="9">Running</text>

  <!-- State 5 -->
  <rect x="860" y="215" width="90" height="110" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="1"/>
  <text x="905" y="237" text-anchor="middle" fill="#f85149" font-size="10">Freed</text>
  <text x="875" y="258" fill="#c9d1d9" font-size="9">Mem: freed</text>
  <text x="875" y="275" fill="#c9d1d9" font-size="9">No trace</text>
  <rect x="875" y="285" width="60" height="25" rx="3" fill="#f85149" opacity="0.2"/>
  <text x="905" y="302" text-anchor="middle" fill="#f85149" font-size="9">Gone</text>

  <!-- Detection vectors -->
  <rect x="30" y="370" width="940" height="195" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="398" fill="#f85149" font-size="13" font-weight="bold">Detection Vectors &amp; Mitigations</text>

  <text x="50" y="425" fill="#f85149" font-size="10">●</text><text x="68" y="425" fill="#c9d1d9" font-size="11">VirtualProtect RW→RX on private memory — behavioral signal for memory scanners</text>
  <text x="50" y="448" fill="#f85149" font-size="10">●</text><text x="68" y="448" fill="#c9d1d9" font-size="11">Unbacked executable memory (no file mapping) — flagged by VAD analysis</text>
  <text x="50" y="471" fill="#f85149" font-size="10">●</text><text x="68" y="471" fill="#c9d1d9" font-size="11">RIP pointing into non-image region — call stack anomaly detection</text>

  <text x="50" y="500" fill="#3fb950" font-size="12" font-weight="bold">Mitigations</text>
  <text x="50" y="523" fill="#3fb950" font-size="10">●</text><text x="68" y="523" fill="#c9d1d9" font-size="11">Use NtAllocateVirtualMemory + NtProtectVirtualMemory via direct syscalls</text>
  <text x="50" y="546" fill="#3fb950" font-size="10">●</text><text x="68" y="546" fill="#c9d1d9" font-size="11">Module stomping: overwrite legitimate DLL section instead of private alloc</text>
</svg>