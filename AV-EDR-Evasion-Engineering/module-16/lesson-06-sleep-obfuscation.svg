<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="a1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#d2a8ff"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Sleep Obfuscation — Encrypt Beacon on Sleep, Decrypt on Wake</text>

  <!-- Cycle diagram -->
  <!-- Active phase -->
  <rect x="30" y="60" width="280" height="200" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="170" y="85" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">ACTIVE Phase</text>
  <text x="50" y="112" fill="#c9d1d9" font-size="11">• Beacon payload decrypted in memory</text>
  <text x="50" y="135" fill="#c9d1d9" font-size="11">• Memory protection: PAGE_RX</text>
  <text x="50" y="158" fill="#c9d1d9" font-size="11">• Executing C2 tasks</text>
  <text x="50" y="181" fill="#c9d1d9" font-size="11">• Shellcode visible to memory scan</text>
  <rect x="50" y="200" width="240" height="25" rx="4" fill="#f85149" opacity="0.2"/>
  <text x="170" y="217" text-anchor="middle" fill="#f85149" font-size="10">VULNERABLE to memory scan</text>
  <text x="50" y="250" fill="#8b949e" font-size="9">Duration: milliseconds (task execution)</text>

  <!-- Arrow Active → Sleep -->
  <line x1="310" y1="120" x2="395" y2="120" stroke="#d2a8ff" stroke-width="2" marker-end="url(#a1)"/>
  <text x="352" y="110" text-anchor="middle" fill="#d2a8ff" font-size="9">Timer fires</text>
  <text x="352" y="142" text-anchor="middle" fill="#d2a8ff" font-size="9">Encrypt + sleep</text>

  <!-- Sleep phase -->
  <rect x="405" y="60" width="280" height="200" rx="8" fill="#0d1117" stroke="#d2a8ff" stroke-width="2"/>
  <text x="545" y="85" text-anchor="middle" fill="#d2a8ff" font-size="14" font-weight="bold">SLEEP Phase</text>
  <text x="425" y="112" fill="#c9d1d9" font-size="11">• Beacon encrypted (AES/XOR)</text>
  <text x="425" y="135" fill="#c9d1d9" font-size="11">• Memory protection: PAGE_RW</text>
  <text x="425" y="158" fill="#c9d1d9" font-size="11">• No executable code in region</text>
  <text x="425" y="181" fill="#c9d1d9" font-size="11">• Appears as random data</text>
  <rect x="425" y="200" width="240" height="25" rx="4" fill="#3fb950" opacity="0.2"/>
  <text x="545" y="217" text-anchor="middle" fill="#3fb950" font-size="10">PROTECTED from memory scan</text>
  <text x="425" y="250" fill="#8b949e" font-size="9">Duration: seconds-minutes (sleep interval)</text>

  <!-- Arrow Sleep → Active -->
  <path d="M545 260 L545 290 L170 290 L170 260" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <text x="357" y="285" text-anchor="middle" fill="#3fb950" font-size="9">Timer callback → Decrypt + Resume</text>

  <!-- Implementation detail -->
  <rect x="710" y="60" width="270" height="200" rx="8" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
  <text x="845" y="85" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="bold">Implementation</text>
  <text x="730" y="112" fill="#7ee787" font-size="10">// Timer-based approach</text>
  <text x="730" y="130" fill="#c9d1d9" font-size="10">1. CreateTimerQueue()</text>
  <text x="730" y="148" fill="#c9d1d9" font-size="10">2. CreateTimerQueueTimer(</text>
  <text x="745" y="163" fill="#c9d1d9" font-size="9">callback=DecryptAndExec,</text>
  <text x="745" y="178" fill="#c9d1d9" font-size="9">dueTime=sleepMs)</text>
  <text x="730" y="198" fill="#c9d1d9" font-size="10">3. Encrypt(beacon, key)</text>
  <text x="730" y="216" fill="#c9d1d9" font-size="10">4. VirtualProtect(RW)</text>
  <text x="730" y="234" fill="#c9d1d9" font-size="10">5. WaitForSingleObject()</text>

  <!-- Techniques comparison -->
  <rect x="30" y="320" width="940" height="245" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="348" fill="#58a6ff" font-size="14" font-weight="bold">Sleep Obfuscation Techniques</text>

  <rect x="50" y="365" width="280" height="90" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="190" y="387" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Ekko (ROP-based)</text>
  <text x="70" y="408" fill="#c9d1d9" font-size="10">• ROP chain with NtContinue</text>
  <text x="70" y="425" fill="#c9d1d9" font-size="10">• VirtualProtect in ROP gadgets</text>
  <text x="70" y="442" fill="#c9d1d9" font-size="10">• Self-encrypting sleep cycle</text>

  <rect x="360" y="365" width="280" height="90" rx="6" fill="#0d1117" stroke="#d2a8ff" stroke-width="1"/>
  <text x="500" y="387" text-anchor="middle" fill="#d2a8ff" font-size="12" font-weight="bold">Foliage (APC-based)</text>
  <text x="380" y="408" fill="#c9d1d9" font-size="10">• Uses NtQueueApcThread</text>
  <text x="380" y="425" fill="#c9d1d9" font-size="10">• Timer APCs for wake-up</text>
  <text x="380" y="442" fill="#c9d1d9" font-size="10">• Cleaner call stack</text>

  <rect x="670" y="365" width="280" height="90" rx="6" fill="#0d1117" stroke="#f0883e" stroke-width="1"/>
  <text x="810" y="387" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">DeathSleep (Custom)</text>
  <text x="690" y="408" fill="#c9d1d9" font-size="10">• Thread suspension + encryption</text>
  <text x="690" y="425" fill="#c9d1d9" font-size="10">• New thread for wake-up</text>
  <text x="690" y="442" fill="#c9d1d9" font-size="10">• Stack spoofing during sleep</text>

  <text x="50" y="488" fill="#f85149" font-size="12" font-weight="bold">Detection Vectors</text>
  <text x="50" y="510" fill="#c9d1d9" font-size="11">• Memory permission changes (RX→RW→RX) during periodic intervals</text>
  <text x="50" y="530" fill="#c9d1d9" font-size="11">• Timer queue patterns — CreateTimerQueueTimer + suspicious callback targets</text>
  <text x="50" y="550" fill="#c9d1d9" font-size="11">• Unbacked memory regions that alternate between RW and RX protections</text>
</svg>