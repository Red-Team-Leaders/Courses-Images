<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="a1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">C2 Communication — Stealth Channels Comparison</text>

  <!-- Implant -->
  <rect x="420" y="55" width="160" height="60" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="500" y="82" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">Implant</text>
  <text x="500" y="102" text-anchor="middle" fill="#8b949e" font-size="9">Beacon / Agent</text>

  <!-- Channel 1: HTTPS -->
  <rect x="30" y="160" width="220" height="170" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="140" y="185" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">HTTPS</text>
  <text x="50" y="210" fill="#c9d1d9" font-size="10">• Port 443 (standard)</text>
  <text x="50" y="228" fill="#c9d1d9" font-size="10">• Encrypted TLS traffic</text>
  <text x="50" y="246" fill="#c9d1d9" font-size="10">• Blends with web browsing</text>
  <text x="50" y="264" fill="#c9d1d9" font-size="10">• Malleable C2 profiles</text>
  <text x="50" y="282" fill="#c9d1d9" font-size="10">• Domain fronting capable</text>
  <rect x="50" y="295" width="180" height="20" rx="3" fill="#3fb950" opacity="0.2"/>
  <text x="140" y="309" text-anchor="middle" fill="#3fb950" font-size="9">BEST for internet egress</text>

  <line x1="420" y1="90" x2="240" y2="160" stroke="#3fb950" stroke-width="1.5"/>

  <!-- Channel 2: DNS -->
  <rect x="270" y="160" width="220" height="170" rx="8" fill="#0d1117" stroke="#d2a8ff" stroke-width="2"/>
  <text x="380" y="185" text-anchor="middle" fill="#d2a8ff" font-size="13" font-weight="bold">DNS</text>
  <text x="290" y="210" fill="#c9d1d9" font-size="10">• Port 53 (rarely blocked)</text>
  <text x="290" y="228" fill="#c9d1d9" font-size="10">• TXT / CNAME / A records</text>
  <text x="290" y="246" fill="#c9d1d9" font-size="10">• Low bandwidth (~60KB/s)</text>
  <text x="290" y="264" fill="#c9d1d9" font-size="10">• DoH for encrypted DNS</text>
  <text x="290" y="282" fill="#c9d1d9" font-size="10">• Hard to block completely</text>
  <rect x="290" y="295" width="180" height="20" rx="3" fill="#d2a8ff" opacity="0.2"/>
  <text x="380" y="309" text-anchor="middle" fill="#d2a8ff" font-size="9">BEST for restricted networks</text>

  <line x1="460" y1="115" x2="420" y2="160" stroke="#d2a8ff" stroke-width="1.5"/>

  <!-- Channel 3: SMB -->
  <rect x="510" y="160" width="220" height="170" rx="8" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
  <text x="620" y="185" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="bold">SMB</text>
  <text x="530" y="210" fill="#c9d1d9" font-size="10">• Port 445 (internal)</text>
  <text x="530" y="228" fill="#c9d1d9" font-size="10">• Named pipes (\\.\pipe\)</text>
  <text x="530" y="246" fill="#c9d1d9" font-size="10">• Peer-to-peer chaining</text>
  <text x="530" y="264" fill="#c9d1d9" font-size="10">• No internet required</text>
  <text x="530" y="282" fill="#c9d1d9" font-size="10">• Blends with AD traffic</text>
  <rect x="530" y="295" width="180" height="20" rx="3" fill="#f0883e" opacity="0.2"/>
  <text x="620" y="309" text-anchor="middle" fill="#f0883e" font-size="9">BEST for lateral movement</text>

  <line x1="540" y1="115" x2="580" y2="160" stroke="#f0883e" stroke-width="1.5"/>

  <!-- Channel 4: Custom -->
  <rect x="750" y="160" width="220" height="170" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="860" y="185" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Custom Channels</text>
  <text x="770" y="210" fill="#c9d1d9" font-size="10">• WebSockets / gRPC</text>
  <text x="770" y="228" fill="#c9d1d9" font-size="10">• ICMP tunneling</text>
  <text x="770" y="246" fill="#c9d1d9" font-size="10">• Cloud API abuse</text>
  <text x="770" y="264" fill="#c9d1d9" font-size="10">• Slack/Teams/Discord bots</text>
  <text x="770" y="282" fill="#c9d1d9" font-size="10">• Steganography in images</text>
  <rect x="770" y="295" width="180" height="20" rx="3" fill="#58a6ff" opacity="0.2"/>
  <text x="860" y="309" text-anchor="middle" fill="#58a6ff" font-size="9">BEST for evasion novelty</text>

  <line x1="580" y1="90" x2="790" y2="160" stroke="#58a6ff" stroke-width="1.5"/>

  <!-- Detection matrix -->
  <rect x="30" y="355" width="940" height="210" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="383" fill="#f85149" font-size="13" font-weight="bold">Detection &amp; OPSEC Matrix</text>

  <text x="50" y="408" fill="#8b949e" font-size="10">Channel</text>
  <text x="200" y="408" fill="#8b949e" font-size="10">Network Detection</text>
  <text x="450" y="408" fill="#8b949e" font-size="10">Jitter Pattern</text>
  <text x="650" y="408" fill="#8b949e" font-size="10">Key OPSEC Move</text>
  <line x1="50" y1="415" x2="950" y2="415" stroke="#30363d"/>

  <text x="50" y="438" fill="#3fb950" font-size="11">HTTPS</text>
  <text x="200" y="438" fill="#c9d1d9" font-size="10">JA3 fingerprint, cert pinning</text>
  <text x="450" y="438" fill="#c9d1d9" font-size="10">30-90s with 40% jitter</text>
  <text x="650" y="438" fill="#c9d1d9" font-size="10">Domain fronting + valid cert</text>

  <text x="50" y="463" fill="#d2a8ff" font-size="11">DNS</text>
  <text x="200" y="463" fill="#c9d1d9" font-size="10">Query volume, entropy, NXDOMAIN</text>
  <text x="450" y="463" fill="#c9d1d9" font-size="10">60-300s (low freq)</text>
  <text x="650" y="463" fill="#c9d1d9" font-size="10">DoH + legitimate resolver</text>

  <text x="50" y="488" fill="#f0883e" font-size="11">SMB</text>
  <text x="200" y="488" fill="#c9d1d9" font-size="10">Named pipe creation events</text>
  <text x="450" y="488" fill="#c9d1d9" font-size="10">On-demand (event-driven)</text>
  <text x="650" y="488" fill="#c9d1d9" font-size="10">Use existing pipe names</text>

  <text x="50" y="513" fill="#58a6ff" font-size="11">Custom</text>
  <text x="200" y="513" fill="#c9d1d9" font-size="10">Protocol anomaly, unusual ports</text>
  <text x="450" y="513" fill="#c9d1d9" font-size="10">Varies by implementation</text>
  <text x="650" y="513" fill="#c9d1d9" font-size="10">Mimic legitimate service</text>

  <text x="50" y="548" fill="#f0883e" font-size="11" font-weight="bold">Golden rule: match your C2 traffic to what the target network already generates</text>
</svg>