<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">PEB Parameter Poisoning — Process Masquerading</text>

  <!-- Before -->
  <rect x="30" y="55" width="450" height="240" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="255" y="80" text-anchor="middle" fill="#f85149" font-size="14" font-weight="bold">Before: Real PEB Parameters</text>

  <text x="50" y="108" fill="#8b949e" font-size="10">RTL_USER_PROCESS_PARAMETERS:</text>
  <text x="60" y="128" fill="#c9d1d9" font-size="11">ImagePathName:</text>
  <text x="200" y="128" fill="#f85149" font-size="11">C:\Users\hacker\malware.exe</text>
  <text x="60" y="150" fill="#c9d1d9" font-size="11">CommandLine:</text>
  <text x="200" y="150" fill="#f85149" font-size="11">malware.exe --inject</text>
  <text x="60" y="172" fill="#c9d1d9" font-size="11">CurrentDirectory:</text>
  <text x="200" y="172" fill="#f85149" font-size="11">C:\Users\hacker\Desktop</text>
  <text x="60" y="194" fill="#c9d1d9" font-size="11">WindowTitle:</text>
  <text x="200" y="194" fill="#f85149" font-size="11">malware.exe</text>

  <rect x="50" y="215" width="410" height="30" rx="4" fill="#f85149" opacity="0.15"/>
  <text x="255" y="235" text-anchor="middle" fill="#f85149" font-size="10">Trivially detected by Process Explorer / EDR queries</text>

  <text x="50" y="270" fill="#8b949e" font-size="9">Any tool reading PEB.ProcessParameters sees the truth</text>
  <text x="50" y="285" fill="#8b949e" font-size="9">EDRs correlate ImagePath vs on-disk binary</text>

  <!-- After -->
  <rect x="520" y="55" width="450" height="240" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="745" y="80" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">After: Spoofed PEB Parameters</text>

  <text x="540" y="108" fill="#8b949e" font-size="10">RTL_USER_PROCESS_PARAMETERS:</text>
  <text x="550" y="128" fill="#c9d1d9" font-size="11">ImagePathName:</text>
  <text x="690" y="128" fill="#3fb950" font-size="11">C:\Windows\System32\svchost.exe</text>
  <text x="550" y="150" fill="#c9d1d9" font-size="11">CommandLine:</text>
  <text x="690" y="150" fill="#3fb950" font-size="11">svchost.exe -k netsvcs</text>
  <text x="550" y="172" fill="#c9d1d9" font-size="11">CurrentDirectory:</text>
  <text x="690" y="172" fill="#3fb950" font-size="11">C:\Windows\System32</text>
  <text x="550" y="194" fill="#c9d1d9" font-size="11">WindowTitle:</text>
  <text x="690" y="194" fill="#3fb950" font-size="11">Host Process for Windows Services</text>

  <rect x="540" y="215" width="410" height="30" rx="4" fill="#3fb950" opacity="0.15"/>
  <text x="745" y="235" text-anchor="middle" fill="#3fb950" font-size="10">Appears as legitimate svchost.exe in process listings</text>

  <text x="540" y="270" fill="#8b949e" font-size="9">Process Explorer shows spoofed info</text>
  <text x="540" y="285" fill="#8b949e" font-size="9">Some EDRs rely on PEB for process identification</text>

  <!-- Implementation -->
  <rect x="30" y="315" width="940" height="120" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="340" fill="#f0883e" font-size="13" font-weight="bold">Implementation via PEB Modification</text>
  <text x="50" y="365" fill="#7ee787" font-size="10">PPEB pPeb = (PPEB)__readgsqword(0x60);</text>
  <text x="50" y="383" fill="#7ee787" font-size="10">PRTL_USER_PROCESS_PARAMETERS params = pPeb->ProcessParameters;</text>
  <text x="50" y="401" fill="#7ee787" font-size="10">RtlInitUnicodeString(&amp;params->ImagePathName, L"C:\\Windows\\System32\\svchost.exe");</text>
  <text x="50" y="419" fill="#7ee787" font-size="10">RtlInitUnicodeString(&amp;params->CommandLine, L"svchost.exe -k netsvcs");</text>

  <!-- Detection and limits -->
  <rect x="30" y="450" width="450" height="115" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="50" y="475" fill="#f85149" font-size="12" font-weight="bold">Limitations</text>
  <text x="50" y="498" fill="#c9d1d9" font-size="10">• Does NOT change the actual binary on disk</text>
  <text x="50" y="516" fill="#c9d1d9" font-size="10">• Kernel still knows real ImageFileName</text>
  <text x="50" y="534" fill="#c9d1d9" font-size="10">• ETW process creation event has real path</text>
  <text x="50" y="552" fill="#c9d1d9" font-size="10">• Memory-mapped sections reveal truth</text>

  <rect x="520" y="450" width="450" height="115" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="540" y="475" fill="#3fb950" font-size="12" font-weight="bold">Effective Against</text>
  <text x="540" y="498" fill="#c9d1d9" font-size="10">• Tools that read PEB.ProcessParameters</text>
  <text x="540" y="516" fill="#c9d1d9" font-size="10">• Some EDR userland telemetry collectors</text>
  <text x="540" y="534" fill="#c9d1d9" font-size="10">• Task Manager / Process Explorer display</text>
  <text x="540" y="552" fill="#c9d1d9" font-size="10">• WMI Win32_Process CommandLine queries</text>
</svg>