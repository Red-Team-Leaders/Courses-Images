<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="a1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">XOR &amp; Custom Cipher Encryption for Shellcode Loaders</text>

  <!-- Single-Byte XOR -->
  <rect x="30" y="55" width="290" height="170" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="175" y="78" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">Single-Byte XOR</text>
  <text x="45" y="102" fill="#c9d1d9" font-size="10">Key:       0x41</text>
  <text x="45" y="122" fill="#ff7b72" font-size="10">Plain:     FC 48 83 E4</text>
  <text x="45" y="142" fill="#7ee787" font-size="10">Cipher:    BD 09 C2 A5</text>
  <text x="45" y="165" fill="#7ee787" font-size="9">for(i=0;i&lt;len;i++)</text>
  <text x="45" y="178" fill="#7ee787" font-size="9">  buf[i] ^= key;</text>
  <text x="45" y="200" fill="#8b949e" font-size="9">Weakness: frequency analysis breaks it</text>
  <text x="45" y="215" fill="#f85149" font-size="9">Trivial to detect — 256 brute force</text>

  <!-- Multi-Byte XOR -->
  <rect x="350" y="55" width="300" height="170" rx="8" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
  <text x="500" y="78" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">Multi-Byte XOR</text>
  <text x="365" y="102" fill="#c9d1d9" font-size="10">Key:       DE AD BE EF</text>
  <text x="365" y="122" fill="#ff7b72" font-size="10">Plain:     FC 48 83 E4 F0 E8</text>
  <text x="365" y="142" fill="#7ee787" font-size="10">Cipher:    22 E5 3D 0B 2E 45</text>
  <text x="365" y="165" fill="#7ee787" font-size="9">for(i=0;i&lt;len;i++)</text>
  <text x="365" y="178" fill="#7ee787" font-size="9">  buf[i] ^= key[i % keyLen];</text>
  <text x="365" y="200" fill="#8b949e" font-size="9">Better: key space = 256^N</text>
  <text x="365" y="215" fill="#f0883e" font-size="9">Still vulnerable if key &lt; payload</text>

  <!-- Rolling XOR -->
  <rect x="680" y="55" width="300" height="170" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="830" y="78" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Rolling XOR (Cascaded)</text>
  <text x="695" y="102" fill="#c9d1d9" font-size="10">Key:       0x41 (initial seed)</text>
  <text x="695" y="122" fill="#ff7b72" font-size="10">Plain:     FC 48 83 E4</text>
  <text x="695" y="142" fill="#7ee787" font-size="10">Cipher:    BD F5 76 92</text>
  <text x="695" y="165" fill="#7ee787" font-size="9">key = seed;</text>
  <text x="695" y="178" fill="#7ee787" font-size="9">for(i=0;i&lt;len;i++){</text>
  <text x="695" y="191" fill="#7ee787" font-size="9">  buf[i]^=key; key=buf[i];}</text>
  <text x="695" y="215" fill="#3fb950" font-size="9">Each byte depends on previous</text>

  <!-- XOR Visual -->
  <rect x="30" y="250" width="940" height="90" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="500" y="273" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">XOR Operation — Symmetric &amp; Self-Inverse</text>
  <text x="80" y="298" fill="#c9d1d9" font-size="11">Plaintext:  1111 1100</text>
  <text x="330" y="298" fill="#f0883e" font-size="11">XOR Key:    0100 0001</text>
  <text x="580" y="298" fill="#3fb950" font-size="11">Cipher:     1011 1101</text>
  <text x="780" y="298" fill="#d2a8ff" font-size="11">XOR Key again = Plaintext</text>
  <text x="80" y="325" fill="#8b949e" font-size="9">FC (0xFC)</text>
  <text x="330" y="325" fill="#8b949e" font-size="9">0x41</text>
  <text x="580" y="325" fill="#8b949e" font-size="9">BD (0xBD)</text>
  <text x="780" y="325" fill="#8b949e" font-size="9">Same function encrypts and decrypts</text>

  <!-- Custom Cipher -->
  <rect x="30" y="365" width="450" height="100" rx="8" fill="#0d1117" stroke="#d2a8ff" stroke-width="2"/>
  <text x="255" y="388" text-anchor="middle" fill="#d2a8ff" font-size="12" font-weight="bold">Custom Substitution Cipher</text>
  <text x="45" y="410" fill="#7ee787" font-size="10">byte sbox[256] = { /* generated at build */ };</text>
  <text x="45" y="428" fill="#7ee787" font-size="10">for(i=0;i&lt;len;i++) buf[i] = sbox[buf[i]];</text>
  <text x="45" y="448" fill="#8b949e" font-size="9">Unique per-build substitution table — no known signature</text>

  <!-- Counter mode -->
  <rect x="510" y="365" width="460" height="100" rx="8" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
  <text x="740" y="388" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">XOR with Counter (CTR-like)</text>
  <text x="525" y="410" fill="#7ee787" font-size="10">for(i=0;i&lt;len;i++)</text>
  <text x="525" y="428" fill="#7ee787" font-size="10">  buf[i]^=(key+(i*prime))&amp;0xFF;</text>
  <text x="525" y="448" fill="#8b949e" font-size="9">Counter ensures no repeating pattern even with short key</text>

  <!-- Legend -->
  <rect x="30" y="480" width="940" height="85" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="503" fill="#58a6ff" font-size="13" font-weight="bold">Detection &amp; Evasion</text>
  <text x="50" y="523" fill="#c9d1d9" font-size="11">1. Single-byte XOR: trivially broken — YARA rule `xor` modifier catches this</text>
  <text x="50" y="543" fill="#c9d1d9" font-size="11">2. Multi-byte &amp; rolling: require known-plaintext or entropy analysis to break</text>
  <text x="50" y="558" fill="#f0883e" font-size="11">3. Custom ciphers: unique per build, no standard signatures, but high entropy still flagged</text>
</svg>