<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="a1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">RC4 Stream Cipher — KSA &amp; PRGA for Payload Encryption</text>

  <!-- KSA -->
  <rect x="30" y="55" width="460" height="220" rx="8" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
  <text x="260" y="78" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="bold">KSA — Key Scheduling Algorithm</text>

  <text x="50" y="105" fill="#8b949e" font-size="10">Initialize S-box (256 bytes):</text>
  <text x="50" y="125" fill="#7ee787" font-size="10">for (i = 0; i &lt; 256; i++)</text>
  <text x="50" y="142" fill="#7ee787" font-size="10">    S[i] = i;              // Identity permutation</text>
  <text x="50" y="165" fill="#8b949e" font-size="10">Scramble with key:</text>
  <text x="50" y="185" fill="#7ee787" font-size="10">j = 0;</text>
  <text x="50" y="202" fill="#7ee787" font-size="10">for (i = 0; i &lt; 256; i++) {</text>
  <text x="50" y="219" fill="#7ee787" font-size="10">    j = (j + S[i] + key[i % keyLen]) % 256;</text>
  <text x="50" y="236" fill="#7ee787" font-size="10">    swap(S[i], S[j]);</text>
  <text x="50" y="253" fill="#7ee787" font-size="10">}</text>
  <text x="50" y="268" fill="#8b949e" font-size="9">Key length: 1-256 bytes. Produces unique permutation.</text>

  <!-- PRGA -->
  <rect x="520" y="55" width="460" height="220" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="750" y="78" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">PRGA — Pseudo-Random Generation</text>

  <text x="540" y="105" fill="#8b949e" font-size="10">Generate keystream byte-by-byte:</text>
  <text x="540" y="125" fill="#7ee787" font-size="10">i = j = 0;</text>
  <text x="540" y="145" fill="#7ee787" font-size="10">for (k = 0; k &lt; dataLen; k++) {</text>
  <text x="540" y="162" fill="#7ee787" font-size="10">    i = (i + 1) % 256;</text>
  <text x="540" y="179" fill="#7ee787" font-size="10">    j = (j + S[i]) % 256;</text>
  <text x="540" y="196" fill="#7ee787" font-size="10">    swap(S[i], S[j]);</text>
  <text x="540" y="213" fill="#d2a8ff" font-size="10">    K = S[(S[i]+S[j]) % 256];</text>
  <text x="540" y="230" fill="#f0883e" font-size="10">    output[k] = data[k] ^ K;</text>
  <text x="540" y="247" fill="#7ee787" font-size="10">}</text>
  <text x="540" y="268" fill="#8b949e" font-size="9">XOR keystream with plaintext = ciphertext</text>

  <!-- Flow Diagram -->
  <text x="500" y="305" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">RC4 Encryption/Decryption Flow</text>

  <rect x="30" y="320" width="150" height="60" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="105" y="348" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">Encryption Key</text>
  <text x="105" y="368" text-anchor="middle" fill="#8b949e" font-size="9">16-32 bytes</text>

  <line x1="185" y1="350" x2="235" y2="350" stroke="#f0883e" stroke-width="2" marker-end="url(#a1)"/>

  <rect x="240" y="320" width="140" height="60" rx="8" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
  <text x="310" y="348" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">KSA</text>
  <text x="310" y="368" text-anchor="middle" fill="#8b949e" font-size="9">Init S-box</text>

  <line x1="385" y1="350" x2="435" y2="350" stroke="#f0883e" stroke-width="2" marker-end="url(#a1)"/>

  <rect x="440" y="320" width="140" height="60" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="510" y="348" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">PRGA</text>
  <text x="510" y="368" text-anchor="middle" fill="#8b949e" font-size="9">Keystream gen</text>

  <line x1="585" y1="350" x2="635" y2="350" stroke="#3fb950" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="640" y="310" width="30" height="80" rx="4" fill="#0d1117" stroke="#d2a8ff" stroke-width="2"/>
  <text x="655" y="355" text-anchor="middle" fill="#d2a8ff" font-size="16" font-weight="bold">^</text>

  <rect x="440" y="400" width="140" height="50" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="510" y="430" text-anchor="middle" fill="#58a6ff" font-size="11">Shellcode (plain)</text>
  <line x1="510" y1="400" x2="655" y2="385" stroke="#58a6ff" stroke-width="1.5"/>

  <line x1="675" y1="350" x2="735" y2="350" stroke="#f0883e" stroke-width="2" marker-end="url(#a1)"/>

  <rect x="740" y="320" width="230" height="60" rx="8" fill="#0d1117" stroke="#d2a8ff" stroke-width="2"/>
  <text x="855" y="348" text-anchor="middle" fill="#d2a8ff" font-size="11" font-weight="bold">Encrypted Payload</text>
  <text x="855" y="368" text-anchor="middle" fill="#8b949e" font-size="9">Stored in .data / resource</text>

  <!-- Advantages -->
  <rect x="30" y="470" width="940" height="95" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="493" fill="#58a6ff" font-size="13" font-weight="bold">Why RC4 for Loaders</text>
  <text x="50" y="513" fill="#c9d1d9" font-size="11">1. Small footprint: ~30 lines of C, no external libraries needed</text>
  <text x="50" y="533" fill="#c9d1d9" font-size="11">2. Stream cipher: decrypt in-place, byte-by-byte — no block padding or IV needed</text>
  <text x="50" y="553" fill="#c9d1d9" font-size="11">3. Same function encrypts and decrypts — symmetric XOR operation</text>
  <text x="600" y="553" fill="#f0883e" font-size="11">4. Weak to known-plaintext — use with key derivation</text>
</svg>