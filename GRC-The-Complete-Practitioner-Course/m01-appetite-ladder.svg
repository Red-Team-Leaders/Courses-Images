<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Capacity, appetite, tolerance, limit">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B97A8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E11D2A"/></marker></defs>
  <rect width="960" height="470" fill="#0E1117"/>
  <rect x="28.0" y="140" width="904" height="62" rx="8" fill="#141923" stroke="#5B667688" stroke-width="1"/>
  <text x="48.0" y="165" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="800" fill="#5B6676" text-anchor="start" letter-spacing="1.2">CAPACITY</text>
  <text x="48.0" y="185" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">The maximum risk the organisation could absorb before it fails or breaches a hard external constraint.</text>
  <text x="912.0" y="165" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="600" fill="#5B6676" text-anchor="end">A fact about the organisation</text>
  <rect x="100.0" y="216" width="760" height="62" rx="8" fill="#141923" stroke="#E11D2A88" stroke-width="1"/>
  <text x="120.0" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="800" fill="#E11D2A" text-anchor="start" letter-spacing="1.2">APPETITE</text>
  <text x="120.0" y="261" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">The amount and type of risk the organisation is willing to retain in pursuit of its objectives.</text>
  <text x="840.0" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="600" fill="#5B6676" text-anchor="end">Set by the board</text>
  <rect x="172.0" y="292" width="616" height="62" rx="8" fill="#141923" stroke="#F5B94D88" stroke-width="1"/>
  <text x="192.0" y="317" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="800" fill="#F5B94D" text-anchor="start" letter-spacing="1.2">TOLERANCE</text>
  <text x="192.0" y="337" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">The acceptable variation around appetite — the band beyond which action is required.</text>
  <text x="768.0" y="317" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="600" fill="#5B6676" text-anchor="end">Expressed measurably</text>
  <rect x="244.0" y="368" width="472" height="62" rx="8" fill="#141923" stroke="#36D39988" stroke-width="1"/>
  <text x="264.0" y="393" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="800" fill="#36D399" text-anchor="start" letter-spacing="1.2">LIMIT</text>
  <text x="264.0" y="413" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">A hard operational boundary, set inside tolerance, that triggers defined action when reached.</text>
  <text x="696.0" y="393" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="600" fill="#5B6676" text-anchor="end">Triggers action now</text>
  <line x1="480" y1="202" x2="480" y2="214" stroke="#5B6676" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <line x1="480" y1="278" x2="480" y2="290" stroke="#5B6676" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <line x1="480" y1="354" x2="480" y2="366" stroke="#5B6676" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <rect x="28" y="412" width="904" height="40" rx="8" fill="#1A2130" stroke="#2B3444" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="480" y="437" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#F5B94D" text-anchor="middle">A tolerance that is never breached is set too loosely to warn you of anything.</text>
  <text x="28" y="40" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="800" fill="#E11D2A" text-anchor="start" letter-spacing="1.8">RED TEAM LEADERS</text>
  <text x="28" y="74" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="800" fill="#E6EDF3" text-anchor="start">Capacity, appetite, tolerance, limit</text>
  <text x="28" y="97.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">Capacity bounds appetite; appetite generates tolerance; tolerance generates limits; limits trigger action. Break a link</text>
  <text x="28" y="114.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">anywhere and you have preferences rather than constraints.</text>
</svg>
