<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="Document architecture">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B97A8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E11D2A"/></marker></defs>
  <rect width="960" height="500" fill="#0E1117"/>
  <text x="46" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#5B6676" text-anchor="start" letter-spacing="1">LEVEL</text>
  <text x="560" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#5B6676" text-anchor="start" letter-spacing="1">APPROVED BY</text>
  <text x="748" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#5B6676" text-anchor="start" letter-spacing="1">CHANGES</text>
  <text x="866" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#5B6676" text-anchor="start" letter-spacing="1">LENGTH</text>
  <rect x="28" y="148" width="904" height="66" rx="8" fill="#141923" stroke="#2B3444" stroke-width="1"/>
  <path d="M29 157 a8,8 0 0 1 8,-8 h3 v64 h-3 a8,8 0 0 1 -8,-8 z" fill="#E11D2A"/>
  <text x="46" y="178.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#E6EDF3" text-anchor="start">POLICY</text>
  <text x="46" y="195.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="400" fill="#8B97A8" text-anchor="start">What the organisation requires, and why</text>
  <text x="560" y="187" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">Board / exec committee</text>
  <text x="748" y="187" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">1–3 years</text>
  <text x="866" y="187" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">3–8 pages</text>
  <rect x="28" y="232" width="904" height="66" rx="8" fill="#141923" stroke="#2B3444" stroke-width="1"/>
  <path d="M29 241 a8,8 0 0 1 8,-8 h3 v64 h-3 a8,8 0 0 1 -8,-8 z" fill="#F5B94D"/>
  <text x="46" y="262.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#E6EDF3" text-anchor="start">STANDARD</text>
  <text x="46" y="279.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="400" fill="#8B97A8" text-anchor="start">What good looks like, quantified</text>
  <text x="560" y="271" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">CISO / domain owner</text>
  <text x="748" y="271" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">Annually</text>
  <text x="866" y="271" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">2–10 pages</text>
  <rect x="28" y="316" width="904" height="66" rx="8" fill="#141923" stroke="#2B3444" stroke-width="1"/>
  <path d="M29 325 a8,8 0 0 1 8,-8 h3 v64 h-3 a8,8 0 0 1 -8,-8 z" fill="#4D9DF5"/>
  <text x="46" y="346.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#E6EDF3" text-anchor="start">PROCEDURE</text>
  <text x="46" y="363.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="400" fill="#8B97A8" text-anchor="start">How a task is performed, by whom, in which system</text>
  <text x="560" y="355" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">Process owner</text>
  <text x="748" y="355" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">On change</text>
  <text x="866" y="355" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">As needed</text>
  <rect x="28" y="400" width="904" height="66" rx="8" fill="#141923" stroke="#2B3444" stroke-width="1"/>
  <path d="M29 409 a8,8 0 0 1 8,-8 h3 v64 h-3 a8,8 0 0 1 -8,-8 z" fill="#36D399"/>
  <text x="46" y="430.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#E6EDF3" text-anchor="start">GUIDELINE / RECORD</text>
  <text x="46" y="447.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="400" fill="#8B97A8" text-anchor="start">Recommendations, templates, and the evidence produced</text>
  <text x="560" y="439" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">Author</text>
  <text x="748" y="439" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">Freely</text>
  <text x="866" y="439" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">Variable</text>
  <path d="M14 150 L14 460" fill="none" stroke="#E11D2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text transform="rotate(-90 4 305)" x="4" y="305" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#E11D2A" text-anchor="middle" letter-spacing="1.6">CHANGE RATE</text>
  <text x="28" y="40" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="800" fill="#E11D2A" text-anchor="start" letter-spacing="1.8">RED TEAM LEADERS</text>
  <text x="28" y="74" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="800" fill="#E6EDF3" text-anchor="start">Document architecture</text>
  <text x="28" y="97.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">Place a statement by its change rate. Anything that will change more than once a year does not belong in a document whose</text>
  <text x="28" y="114.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">approval cadence is measured in years.</text>
</svg>
