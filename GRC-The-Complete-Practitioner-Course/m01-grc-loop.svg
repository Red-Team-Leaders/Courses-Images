  <text x="28" y="97.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">Governance sets the boundary; risk and compliance populate it with facts; governance decides; the organisation acts;</text>
