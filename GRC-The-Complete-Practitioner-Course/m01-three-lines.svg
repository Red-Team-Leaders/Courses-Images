<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" role="img" aria-label="The Three Lines Model">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B97A8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E11D2A"/></marker></defs>
  <rect width="980" height="500" fill="#0E1117"/>
  <rect x="28" y="138" width="924" height="62" rx="8" fill="#141923" stroke="#2B3444" stroke-width="1"/>
  <path d="M29 147 a8,8 0 0 1 8,-8 h3 v60 h-3 a8,8 0 0 1 -8,-8 z" fill="#E11D2A"/>
  <text x="46" y="162" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#E6EDF3" text-anchor="start">GOVERNING BODY</text>
  <text x="46" y="182" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">Board and its committees — accountable to stakeholders for oversight.</text>
  <path d="M170 262 L170 216" fill="none" stroke="#8B97A8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
  <text x="178" y="244" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="500" fill="#8B97A8" text-anchor="start">reports</text>
  <path d="M490 262 L490 216" fill="none" stroke="#8B97A8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
  <text x="498" y="244" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="500" fill="#8B97A8" text-anchor="start">reports</text>
  <path d="M810 262 L810 238 Q810 226 796 226 L196 226 L196 216" fill="none" stroke="#F5B94D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
  <text x="500" y="219" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="600" fill="#F5B94D" text-anchor="middle">direct line — not through management</text>
  <rect x="28" y="262" width="292" height="118" rx="8" fill="#141923" stroke="#2B3444" stroke-width="1"/>
  <path d="M29 271 a8,8 0 0 1 8,-8 h3 v116 h-3 a8,8 0 0 1 -8,-8 z" fill="#36D399"/>
  <text x="46" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#36D399" text-anchor="start" letter-spacing="1.1">OWNS THE RISK</text>
  <text x="46" y="306" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#E6EDF3" text-anchor="start">FIRST LINE</text>
  <text x="46" y="326" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">Business and technology. Owns risks and</text>
  <text x="46" y="342" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">controls in its processes, operates</text>
  <text x="46" y="358" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">them, produces evidence.</text>
  <rect x="348" y="262" width="292" height="118" rx="8" fill="#141923" stroke="#2B3444" stroke-width="1"/>
  <path d="M349 271 a8,8 0 0 1 8,-8 h3 v116 h-3 a8,8 0 0 1 -8,-8 z" fill="#4D9DF5"/>
  <text x="366" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#4D9DF5" text-anchor="start" letter-spacing="1.1">SETS METHOD</text>
  <text x="366" y="306" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#E6EDF3" text-anchor="start">SECOND LINE</text>
  <text x="366" y="326" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">GRC, compliance, privacy. Sets</text>
  <text x="366" y="342" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">frameworks and methods, challenges the</text>
  <text x="366" y="358" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">first line, aggregates and reports.</text>
  <rect x="668" y="262" width="284" height="118" rx="8" fill="#141923" stroke="#2B3444" stroke-width="1"/>
  <path d="M669 271 a8,8 0 0 1 8,-8 h3 v116 h-3 a8,8 0 0 1 -8,-8 z" fill="#F5B94D"/>
  <text x="686" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#F5B94D" text-anchor="start" letter-spacing="1.1">ASSURES BOTH</text>
  <text x="686" y="306" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#E6EDF3" text-anchor="start">THIRD LINE</text>
  <text x="686" y="326" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">Internal audit. Independent, objective</text>
  <text x="686" y="342" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">assurance on the effectiveness of the</text>
  <text x="686" y="358" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">first and second lines.</text>
  <line x1="320" y1="321" x2="348" y2="321" stroke="#2B3444" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <line x1="640" y1="321" x2="668" y2="321" stroke="#2B3444" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <rect x="28" y="404" width="924" height="66" rx="8" fill="#1A2130" stroke="#2B3444" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="46" y="428" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#5B6676" text-anchor="start" letter-spacing="1.1">EXTERNAL ASSURANCE</text>
  <text x="46" y="452" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="400" fill="#8B97A8" text-anchor="start">Certification bodies, external audit, regulators — independent of the organisation entirely.</text>
  <text x="28" y="40" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="800" fill="#E11D2A" text-anchor="start" letter-spacing="1.8">RED TEAM LEADERS</text>
  <text x="28" y="74" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="800" fill="#E6EDF3" text-anchor="start">The Three Lines Model</text>
  <text x="28" y="97.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">The first line owns the risk. The second sets method and challenges. The third assures both — and reports to the governing</text>
  <text x="28" y="114.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">body on a line that does not pass through management.</text>
</svg>
