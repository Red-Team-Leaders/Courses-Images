<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" role="img" aria-label="The FAIR decomposition">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B97A8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E11D2A"/></marker></defs>
  <rect width="980" height="540" fill="#0E1117"/>
  <rect x="360" y="146" width="260" height="52" rx="8" fill="#141923" stroke="#E11D2A77" stroke-width="1"/>
  <text x="374" y="168" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="700" fill="#E6EDF3" text-anchor="start">RISK</text>
  <text x="374" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="400" fill="#5B6676" text-anchor="start">annualised loss</text>
  <rect x="120" y="232" width="250" height="52" rx="8" fill="#141923" stroke="#4D9DF577" stroke-width="1"/>
  <text x="134" y="254" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="700" fill="#E6EDF3" text-anchor="start">LOSS EVENT FREQUENCY</text>
  <text x="134" y="271" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="400" fill="#5B6676" text-anchor="start">events per year</text>
  <rect x="610" y="232" width="250" height="52" rx="8" fill="#141923" stroke="#F5B94D77" stroke-width="1"/>
  <text x="624" y="254" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="700" fill="#E6EDF3" text-anchor="start">LOSS MAGNITUDE</text>
  <text x="624" y="271" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="400" fill="#5B6676" text-anchor="start">cost per event</text>
  <rect x="28" y="326" width="200" height="52" rx="8" fill="#141923" stroke="#4D9DF577" stroke-width="1"/>
  <text x="42" y="348" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="700" fill="#E6EDF3" text-anchor="start">Threat event frequency</text>
  <text x="42" y="365" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="400" fill="#5B6676" text-anchor="start">attempts per year</text>
  <rect x="248" y="326" width="200" height="52" rx="8" fill="#141923" stroke="#4D9DF577" stroke-width="1"/>
  <text x="262" y="348" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="700" fill="#E6EDF3" text-anchor="start">Vulnerability</text>
  <text x="262" y="365" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="400" fill="#5B6676" text-anchor="start">proportion succeeding</text>
  <rect x="610" y="326" width="200" height="52" rx="8" fill="#141923" stroke="#F5B94D77" stroke-width="1"/>
  <text x="624" y="348" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="700" fill="#E6EDF3" text-anchor="start">Primary loss</text>
  <text x="624" y="365" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="400" fill="#5B6676" text-anchor="start">falls on you directly</text>
  <rect x="610" y="400" width="340" height="52" rx="8" fill="#141923" stroke="#F5B94D77" stroke-width="1"/>
  <text x="624" y="422" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="700" fill="#E6EDF3" text-anchor="start">Secondary loss</text>
  <text x="624" y="439" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="400" fill="#5B6676" text-anchor="start">from the reactions of others — the systematic omission</text>
  <path d="M490 198 L490 215 L245 215 L245 232" fill="none" stroke="#2B3444" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
  <path d="M490 198 L490 215 L735 215 L735 232" fill="none" stroke="#2B3444" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
  <path d="M245 284 L245 305 L128 305 L128 326" fill="none" stroke="#2B3444" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
  <path d="M245 284 L245 305 L348 305 L348 326" fill="none" stroke="#2B3444" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
  <path d="M735 284 L735 305 L710 305 L710 326" fill="none" stroke="#2B3444" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
  <path d="M735 284 L735 342 L780 342 L780 400" fill="none" stroke="#2B3444" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/>
  <rect x="28" y="466" width="924" height="56" rx="8" fill="#1A2130" stroke="#2B3444" stroke-width="1"/>
  <text x="46" y="490" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#8B97A8" text-anchor="start" letter-spacing="1.1">WHY DECOMPOSE</text>
  <text x="46" y="511" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="400" fill="#8B97A8" text-anchor="start">A challenger must name which factor they disagree with — which is a conversation about evidence, not about your credibility.</text>
  <text x="28" y="40" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="800" fill="#E11D2A" text-anchor="start" letter-spacing="1.8">RED TEAM LEADERS</text>
  <text x="28" y="74" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="800" fill="#E6EDF3" text-anchor="start">The FAIR decomposition</text>
  <text x="28" y="97.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">Nobody can estimate annualised loss directly with confidence. The questions at the leaves are answerable — and the value of</text>
  <text x="28" y="114.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">decomposing is arguability, not accuracy.</text>
</svg>
