  <text x="480" y="490" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#F5B94D" text-anchor="middle">“Our controls moved eleven risks down a band and left four untouched — those four are the ask.”</text>
