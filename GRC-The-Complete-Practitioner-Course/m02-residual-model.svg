<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" role="img" aria-label="The residual risk model">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B97A8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E11D2A"/></marker></defs>
  <rect width="980" height="500" fill="#0E1117"/>
  <rect x="28" y="148" width="268" height="120" rx="8" fill="#141923" stroke="#2B3444" stroke-width="1"/>
  <path d="M29 157 a8,8 0 0 1 8,-8 h3 v118 h-3 a8,8 0 0 1 -8,-8 z" fill="#4D9DF5"/>
  <text x="46" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#4D9DF5" text-anchor="start" letter-spacing="1.1">STEP 1</text>
  <text x="46" y="192" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#E6EDF3" text-anchor="start">INHERENT</text>
  <text x="46" y="212" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">Exposure before credit for control</text>
  <text x="46" y="228" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">effectiveness, assessed on a stated</text>
  <text x="46" y="244" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">convention.</text>
  <text x="46" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="600" fill="#E6EDF3" text-anchor="start">likelihood 4  ×  impact 5  =  20</text>
  <rect x="356" y="148" width="268" height="120" rx="8" fill="#141923" stroke="#2B3444" stroke-width="1"/>
  <path d="M357 157 a8,8 0 0 1 8,-8 h3 v118 h-3 a8,8 0 0 1 -8,-8 z" fill="#F5B94D"/>
  <text x="374" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#F5B94D" text-anchor="start" letter-spacing="1.1">STEP 2</text>
  <text x="374" y="192" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#E6EDF3" text-anchor="start">EFFECTIVENESS</text>
  <text x="374" y="212" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">Derived from evidence of operation,</text>
  <text x="374" y="228" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">never from the control existing or</text>
  <text x="374" y="244" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">being well designed.</text>
  <text x="374" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="600" fill="#E6EDF3" text-anchor="start">measured 20%</text>
  <rect x="684" y="148" width="268" height="120" rx="8" fill="#141923" stroke="#2B3444" stroke-width="1"/>
  <path d="M685 157 a8,8 0 0 1 8,-8 h3 v118 h-3 a8,8 0 0 1 -8,-8 z" fill="#36D399"/>
  <text x="702" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#36D399" text-anchor="start" letter-spacing="1.1">STEP 3</text>
  <text x="702" y="192" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#E6EDF3" text-anchor="start">RESIDUAL</text>
  <text x="702" y="212" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">Derived mechanically. Anyone with</text>
  <text x="702" y="228" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">the same inputs reaches the same</text>
  <text x="702" y="244" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#8B97A8" text-anchor="start">number.</text>
  <text x="702" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="600" fill="#E6EDF3" text-anchor="start">4 × 0.8 = 3.2  →  16</text>
  <line x1="296" y1="208" x2="356" y2="208" stroke="#2B3444" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <line x1="624" y1="208" x2="684" y2="208" stroke="#2B3444" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <rect x="28" y="296" width="924" height="76" rx="8" fill="#1A2130" stroke="#2B3444" stroke-width="1"/>
  <text x="46" y="322" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#8B97A8" text-anchor="start" letter-spacing="1.1">THE FORMULA</text>
  <text x="46" y="348" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="500" fill="#E6EDF3" text-anchor="start">residual_likelihood = max(1, inherent_likelihood × (1 − effectiveness))</text>
  <text x="46" y="366" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="500" fill="#E6EDF3" text-anchor="start">residual_score      = max(1, round(residual_likelihood × impact))</text>
  <rect x="28" y="392" width="452" height="78" rx="8" fill="#141923" stroke="#36D39955" stroke-width="1"/>
  <text x="46" y="416" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#36D399" text-anchor="start" letter-spacing="1.1">LEGITIMATE</text>
  <text x="46" y="438.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="400" fill="#8B97A8" text-anchor="start">Reducing likelihood only. Impact may be reduced solely where a</text>
  <text x="46" y="453.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="400" fill="#8B97A8" text-anchor="start">control limits the consequence — segmentation, tokenisation — with</text>
  <text x="46" y="469.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="400" fill="#8B97A8" text-anchor="start">documented approval.</text>
  <rect x="500" y="392" width="452" height="78" rx="8" fill="#141923" stroke="#E11D2A55" stroke-width="1"/>
  <text x="518" y="416" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#E11D2A" text-anchor="start" letter-spacing="1.1">THE COMMON INFLATION</text>
  <text x="518" y="438.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="400" fill="#8B97A8" text-anchor="start">Reducing both axes for one preventive control. Reports a 76%</text>
  <text x="518" y="453.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="400" fill="#8B97A8" text-anchor="start">reduction where the defensible figure is 60%. An auditor tests this</text>
  <text x="518" y="469.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="400" fill="#8B97A8" text-anchor="start">first.</text>
  <text x="28" y="40" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="800" fill="#E11D2A" text-anchor="start" letter-spacing="1.8">RED TEAM LEADERS</text>
  <text x="28" y="74" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="800" fill="#E6EDF3" text-anchor="start">The residual risk model</text>
  <text x="28" y="97.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">Control effectiveness reduces likelihood, never impact. A preventive control makes an event rarer; it does not make the</text>
  <text x="28" y="114.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">consequence smaller when the event happens anyway.</text>
</svg>
