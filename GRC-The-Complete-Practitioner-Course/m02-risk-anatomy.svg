<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-label="Anatomy of a risk statement">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B97A8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E11D2A"/></marker></defs>
  <rect width="980" height="470" fill="#0E1117"/>
  <rect x="28" y="150" width="164" height="108" rx="8" fill="#141923" stroke="#E11D2A77" stroke-width="1"/>
  <text x="42" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#E11D2A" text-anchor="start" letter-spacing="0.9">THREAT SOURCE</text>
  <text x="42" y="198" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#E6EDF3" text-anchor="start">Who or what acts</text>
  <text x="42" y="236" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#5B6676" text-anchor="start">Determines likelihood</text>
  <line x1="192" y1="204" x2="218" y2="204" stroke="#2B3444" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <rect x="218" y="150" width="164" height="108" rx="8" fill="#141923" stroke="#F5B94D77" stroke-width="1"/>
  <text x="232" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#F5B94D" text-anchor="start" letter-spacing="0.9">VULNERABILITY</text>
  <text x="232" y="198" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#E6EDF3" text-anchor="start">The weakness</text>
  <text x="232" y="215" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#E6EDF3" text-anchor="start">exploited</text>
  <text x="232" y="236" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#5B6676" text-anchor="start">Determines</text>
  <text x="232" y="251" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#5B6676" text-anchor="start">exploitability</text>
  <line x1="382" y1="204" x2="408" y2="204" stroke="#2B3444" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <rect x="408" y="150" width="164" height="108" rx="8" fill="#141923" stroke="#4D9DF577" stroke-width="1"/>
  <text x="422" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#4D9DF5" text-anchor="start" letter-spacing="0.9">ASSET</text>
  <text x="422" y="198" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#E6EDF3" text-anchor="start">What is affected</text>
  <text x="422" y="236" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#5B6676" text-anchor="start">Determines impact</text>
  <line x1="572" y1="204" x2="598" y2="204" stroke="#2B3444" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <rect x="598" y="150" width="164" height="108" rx="8" fill="#141923" stroke="#36D39977" stroke-width="1"/>
  <text x="612" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#36D399" text-anchor="start" letter-spacing="0.9">CONSEQUENCE</text>
  <text x="612" y="198" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#E6EDF3" text-anchor="start">What happens</text>
  <text x="612" y="215" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#E6EDF3" text-anchor="start">directly</text>
  <text x="612" y="236" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#5B6676" text-anchor="start">The causal bridge</text>
  <line x1="762" y1="204" x2="788" y2="204" stroke="#2B3444" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <rect x="788" y="150" width="164" height="108" rx="8" fill="#141923" stroke="#FF3B4877" stroke-width="1"/>
  <text x="802" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#FF3B48" text-anchor="start" letter-spacing="0.9">IMPACT</text>
  <text x="802" y="198" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#E6EDF3" text-anchor="start">What it costs the</text>
  <text x="802" y="215" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#E6EDF3" text-anchor="start">business</text>
  <text x="802" y="236" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#5B6676" text-anchor="start">Connects to objectives</text>
  <rect x="28" y="288" width="924" height="82" rx="8" fill="#1A2130" stroke="#2B3444" stroke-width="1"/>
  <text x="46" y="314" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#8B97A8" text-anchor="start" letter-spacing="1.1">THE MANDATORY FORM</text>
  <text x="46" y="342" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="500" fill="#E6EDF3" text-anchor="start">[Threat source] exploits [weakness] in [asset], resulting in [consequence], with [business impact].</text>
  <rect x="28" y="390" width="924" height="62" rx="8" fill="#141923" stroke="#E11D2A55" stroke-width="1"/>
  <text x="46" y="414" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#E11D2A" text-anchor="start" letter-spacing="1.1">NOT A RISK</text>
  <text x="46" y="437" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="400" fill="#8B97A8" text-anchor="start">“Unpatched servers” — a condition. No actor, no consequence, no objective. It cannot be scored, compared or prioritised.</text>
  <text x="28" y="40" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="800" fill="#E11D2A" text-anchor="start" letter-spacing="1.8">RED TEAM LEADERS</text>
  <text x="28" y="74" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="800" fill="#E6EDF3" text-anchor="start">Anatomy of a risk statement</text>
  <text x="28" y="97.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">A risk is a scenario, not a condition. When a statement will not score, one of these five components is missing — and</text>
  <text x="28" y="114.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">identifying which one tells you the next question to ask.</text>
</svg>
