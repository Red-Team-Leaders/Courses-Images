<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" role="img" aria-label="AI inventory and risk tiering">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B97A8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E11D2A"/></marker></defs>
  <rect width="980" height="540" fill="#0E1117"/>
  <rect x="28" y="150" width="224" height="74" rx="8" fill="#141923" stroke="#4D9DF566" stroke-width="1"/>
  <text x="42" y="176.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Models you built</text>
  <text x="42" y="200" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#5B6676" text-anchor="start">Known to data science</text>
  <line x1="140" y1="224" x2="140" y2="254" stroke="#2B3444" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <rect x="260" y="150" width="224" height="74" rx="8" fill="#141923" stroke="#4D9DF566" stroke-width="1"/>
  <text x="274" y="176.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Model APIs you call</text>
  <text x="274" y="200" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#5B6676" text-anchor="start">Visible in cloud billing</text>
  <line x1="372" y1="224" x2="372" y2="254" stroke="#2B3444" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <rect x="492" y="150" width="224" height="74" rx="8" fill="#141923" stroke="#E11D2A" stroke-width="1"/>
  <text x="506" y="176.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="start">AI in licensed SaaS</text>
  <text x="506" y="200" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#5B6676" text-anchor="start">Arrived by product update</text>
  <line x1="604" y1="224" x2="604" y2="254" stroke="#2B3444" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <rect x="724" y="150" width="224" height="74" rx="8" fill="#141923" stroke="#4D9DF566" stroke-width="1"/>
  <text x="738" y="176.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Shadow AI</text>
  <text x="738" y="200" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#5B6676" text-anchor="start">Personal accounts, extensions</text>
  <line x1="836" y1="224" x2="836" y2="254" stroke="#2B3444" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <text x="604" y="141" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#E11D2A" text-anchor="start">usually the largest</text>
  <rect x="28" y="254" width="920" height="40" rx="8" fill="#1A2130" stroke="#2B3444" stroke-width="1"/>
  <text x="488" y="279" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="middle">AI SYSTEM INVENTORY  —  purpose · sponsor · data · tool access · evaluation · tier</text>
  <line x1="140" y1="294" x2="140" y2="322" stroke="#2B3444" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <rect x="28" y="322" width="224" height="108" rx="8" fill="#141923" stroke="#E11D2A77" stroke-width="1"/>
  <text x="42" y="346" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="800" fill="#E11D2A" text-anchor="start" letter-spacing="0.8">PROHIBITED</text>
  <text x="42" y="370" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#8B97A8" text-anchor="start">Barred outright. No exception</text>
  <text x="42" y="385" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#8B97A8" text-anchor="start">process.</text>
  <line x1="372" y1="294" x2="372" y2="322" stroke="#2B3444" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <rect x="260" y="322" width="224" height="108" rx="8" fill="#141923" stroke="#FF3B4877" stroke-width="1"/>
  <text x="274" y="346" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="800" fill="#FF3B48" text-anchor="start" letter-spacing="0.8">TIER 1 — HIGH</text>
  <text x="274" y="370" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#8B97A8" text-anchor="start">Affects access, creditworthiness,</text>
  <text x="274" y="385" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#8B97A8" text-anchor="start">employment; or an agent with</text>
  <text x="274" y="400" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#8B97A8" text-anchor="start">production write access.</text>
  <line x1="604" y1="294" x2="604" y2="322" stroke="#2B3444" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <rect x="492" y="322" width="224" height="108" rx="8" fill="#141923" stroke="#F5B94D77" stroke-width="1"/>
  <text x="506" y="346" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="800" fill="#F5B94D" text-anchor="start" letter-spacing="0.8">TIER 2 — LIMITED</text>
  <text x="506" y="370" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#8B97A8" text-anchor="start">Informs a human decision</text>
  <text x="506" y="385" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#8B97A8" text-anchor="start">affecting individuals, or handles</text>
  <text x="506" y="400" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#8B97A8" text-anchor="start">confidential data.</text>
  <line x1="836" y1="294" x2="836" y2="322" stroke="#2B3444" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <rect x="724" y="322" width="224" height="108" rx="8" fill="#141923" stroke="#36D39977" stroke-width="1"/>
  <text x="738" y="346" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="800" fill="#36D399" text-anchor="start" letter-spacing="0.8">TIER 3 — MINIMAL</text>
  <text x="738" y="370" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#8B97A8" text-anchor="start">No personal data, no effect on</text>
  <text x="738" y="385" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#8B97A8" text-anchor="start">individuals, human reviews all</text>
  <text x="738" y="400" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#8B97A8" text-anchor="start">output.</text>
  <rect x="28" y="456" width="920" height="62" rx="8" fill="#141923" stroke="#F5B94D55" stroke-width="1"/>
  <text x="46" y="480" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#F5B94D" text-anchor="start" letter-spacing="1.1">THE GATE THAT CLOSES THE LARGEST SOURCE</text>
  <text x="46" y="503" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="400" fill="#8B97A8" text-anchor="start">No software with AI features acquired or renewed without an inventory record. AI arrives with software, not with an AI project.</text>
  <text x="28" y="40" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="800" fill="#E11D2A" text-anchor="start" letter-spacing="1.8">RED TEAM LEADERS</text>
  <text x="28" y="74" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="800" fill="#E6EDF3" text-anchor="start">AI inventory and risk tiering</text>
  <text x="28" y="97.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">Inventory first, then tiering, then obligations — and policy last. The largest category is AI features inside software you</text>
  <text x="28" y="114.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">already licence.</text>
</svg>
