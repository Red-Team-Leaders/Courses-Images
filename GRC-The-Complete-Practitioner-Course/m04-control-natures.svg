<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-label="The four control natures">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B97A8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E11D2A"/></marker></defs>
  <rect width="980" height="470" fill="#0E1117"/>
  <line x1="28" y1="250" x2="952" y2="250" stroke="#2B3444" stroke-width="2" stroke-linecap="round"/>
  <circle cx="490" cy="250" r="9" fill="#E11D2A" stroke="none" stroke-width="1"/>
  <text x="490" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="800" fill="#E11D2A" text-anchor="middle" letter-spacing="1">THE EVENT</text>
  <text x="120" y="274" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="500" fill="#5B6676" text-anchor="middle">before</text>
  <text x="760" y="274" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="500" fill="#5B6676" text-anchor="middle">after</text>
  <rect x="28" y="150" width="198" height="84" rx="8" fill="#141923" stroke="#36D39977" stroke-width="1"/>
  <text x="42" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="800" fill="#36D399" text-anchor="start" letter-spacing="0.8">PREVENTIVE</text>
  <text x="42" y="194" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#E6EDF3" text-anchor="start">Stops it occurring</text>
  <text x="42" y="214.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#5B6676" text-anchor="start">Bypass paths enumerated</text>
  <line x1="127" y1="234" x2="127" y2="244" stroke="#36D399" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 3"/>
  <rect x="28" y="246" width="198" height="48" rx="8" fill="#1A2130" stroke="#2B3444" stroke-width="1"/>
  <text x="42" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8.5" font-weight="700" fill="#5B6676" text-anchor="start" letter-spacing="0.9">EVIDENCE</text>
  <text x="42" y="278.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#8B97A8" text-anchor="start">Config state + blocked attempts</text>
  <rect x="262" y="150" width="198" height="84" rx="8" fill="#141923" stroke="#4D9DF577" stroke-width="1"/>
  <text x="276" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="800" fill="#4D9DF5" text-anchor="start" letter-spacing="0.8">DETECTIVE</text>
  <text x="276" y="194" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#E6EDF3" text-anchor="start">Identifies it occurring</text>
  <text x="276" y="214.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#5B6676" text-anchor="start">A response attached</text>
  <line x1="361" y1="234" x2="361" y2="244" stroke="#4D9DF5" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 3"/>
  <rect x="262" y="246" width="198" height="48" rx="8" fill="#1A2130" stroke="#2B3444" stroke-width="1"/>
  <text x="276" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8.5" font-weight="700" fill="#5B6676" text-anchor="start" letter-spacing="0.9">EVIDENCE</text>
  <text x="276" y="278.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#8B97A8" text-anchor="start">Detections + triage records</text>
  <rect x="520" y="296" width="198" height="84" rx="8" fill="#141923" stroke="#F5B94D77" stroke-width="1"/>
  <text x="534" y="320" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="800" fill="#F5B94D" text-anchor="start" letter-spacing="0.8">CORRECTIVE</text>
  <text x="534" y="340" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#E6EDF3" text-anchor="start">Restores afterwards</text>
  <text x="534" y="360.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#5B6676" text-anchor="start">Tested before it is needed</text>
  <line x1="619" y1="296" x2="619" y2="256" stroke="#F5B94D" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 3"/>
  <rect x="520" y="236" width="198" height="48" rx="8" fill="#1A2130" stroke="#2B3444" stroke-width="1"/>
  <text x="534" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8.5" font-weight="700" fill="#5B6676" text-anchor="start" letter-spacing="0.9">EVIDENCE</text>
  <text x="534" y="268.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#8B97A8" text-anchor="start">Test records with timings</text>
  <rect x="754" y="296" width="198" height="84" rx="8" fill="#141923" stroke="#FF3B4877" stroke-width="1"/>
  <text x="768" y="320" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="800" fill="#FF3B48" text-anchor="start" letter-spacing="0.8">COMPENSATING</text>
  <text x="768" y="340" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#E6EDF3" text-anchor="start">Addresses it by other means</text>
  <text x="768" y="360.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#5B6676" text-anchor="start">Same risk, time-bounded</text>
  <line x1="853" y1="296" x2="853" y2="256" stroke="#FF3B48" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 3"/>
  <rect x="754" y="236" width="198" height="48" rx="8" fill="#1A2130" stroke="#2B3444" stroke-width="1"/>
  <text x="768" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8.5" font-weight="700" fill="#5B6676" text-anchor="start" letter-spacing="0.9">EVIDENCE</text>
  <text x="768" y="268.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#8B97A8" text-anchor="start">Its nature&#x27;s evidence +</text>
  <text x="768" y="282.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#8B97A8" text-anchor="start">approval</text>
  <rect x="28" y="396" width="924" height="56" rx="8" fill="#141923" stroke="#E11D2A55" stroke-width="1"/>
  <text x="46" y="420" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#E11D2A" text-anchor="start" letter-spacing="1.1">THE FAILURE THAT PRODUCES PERFECT EVIDENCE</text>
  <text x="46" y="442" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="400" fill="#8B97A8" text-anchor="start">A control performed without judgement — the review signed in bulk. Only an outcome measure detects it: revocations, not reviews completed.</text>
  <text x="28" y="40" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="800" fill="#E11D2A" text-anchor="start" letter-spacing="1.8">RED TEAM LEADERS</text>
  <text x="28" y="74" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="800" fill="#E6EDF3" text-anchor="start">The four control natures</text>
  <text x="28" y="97.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">Each acts at a different point relative to the event, and each therefore needs a different design property and a different</text>
  <text x="28" y="114.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">kind of evidence.</text>
</svg>
