<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" role="img" aria-label="The evidence hierarchy">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B97A8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E11D2A"/></marker></defs>
  <rect width="980" height="500" fill="#0E1117"/>
  <rect x="28" y="148" width="924" height="50" rx="8" fill="#141923" stroke="#36D39977" stroke-width="1"/>
  <text x="46" y="170" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Continuous automated monitoring</text>
  <text x="46" y="188" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#5B6676" text-anchor="start">with alerting on failure, and the monitoring itself verified</text>
  <rect x="878" y="158" width="60" height="30" rx="5" fill="#36D39922" stroke="#36D39966" stroke-width="1"/>
  <text x="908" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="800" fill="#36D399" text-anchor="middle">100%</text>
  <rect x="28" y="208" width="776" height="50" rx="8" fill="#141923" stroke="#4D9DF577" stroke-width="1"/>
  <text x="46" y="230" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Sampled testing with results</text>
  <text x="46" y="248" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#5B6676" text-anchor="start">documented, over the period, with a defensible sample</text>
  <rect x="730" y="218" width="60" height="30" rx="5" fill="#4D9DF522" stroke="#4D9DF566" stroke-width="1"/>
  <text x="760" y="238" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="800" fill="#4D9DF5" text-anchor="middle">80%</text>
  <rect x="28" y="268" width="596" height="50" rx="8" fill="#141923" stroke="#F5B94D77" stroke-width="1"/>
  <text x="46" y="290" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Documented process with spot evidence</text>
  <text x="46" y="308" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#5B6676" text-anchor="start">the procedure exists and some records exist</text>
  <rect x="550" y="278" width="60" height="30" rx="5" fill="#F5B94D22" stroke="#F5B94D66" stroke-width="1"/>
  <text x="580" y="298" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="800" fill="#F5B94D" text-anchor="middle">50%</text>
  <rect x="28" y="328" width="416" height="50" rx="8" fill="#141923" stroke="#FF3B4877" stroke-width="1"/>
  <text x="46" y="350" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Documented process only</text>
  <text x="46" y="368" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#5B6676" text-anchor="start">the procedure exists, no records</text>
  <rect x="370" y="338" width="60" height="30" rx="5" fill="#FF3B4822" stroke="#FF3B4866" stroke-width="1"/>
  <text x="400" y="358" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="800" fill="#FF3B48" text-anchor="middle">25%</text>
  <rect x="28" y="388" width="236" height="50" rx="8" fill="#141923" stroke="#E11D2A77" stroke-width="1"/>
  <text x="46" y="410" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Asserted</text>
  <text x="46" y="428" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#5B6676" text-anchor="start">the control owner says it happens</text>
  <rect x="190" y="398" width="60" height="30" rx="5" fill="#E11D2A22" stroke="#E11D2A66" stroke-width="1"/>
  <text x="220" y="418" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="800" fill="#E11D2A" text-anchor="middle">0%</text>
  <text x="966" y="173" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="600" fill="#5B6676" text-anchor="end">max effectiveness</text>
  <rect x="28" y="452" width="924" height="40" rx="8" fill="#1A2130" stroke="#2B3444" stroke-width="1"/>
  <text x="480" y="477" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="500" fill="#F5B94D" text-anchor="middle">Applied honestly the first time, effectiveness figures typically halve and residual scores rise — measurement improving, not exposure worsening.</text>
  <text x="28" y="40" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="800" fill="#E11D2A" text-anchor="start" letter-spacing="1.8">RED TEAM LEADERS</text>
  <text x="28" y="74" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="800" fill="#E6EDF3" text-anchor="start">The evidence hierarchy</text>
  <text x="28" y="97.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">Control effectiveness is capped by what you can demonstrate. A control with no record of operation contributes nothing to</text>
  <text x="28" y="114.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">residual risk, however well it is designed.</text>
</svg>
