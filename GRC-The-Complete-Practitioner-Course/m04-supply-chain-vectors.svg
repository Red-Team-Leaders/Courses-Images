<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" role="img" aria-label="Four supply chain attack vectors">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B97A8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E11D2A"/></marker></defs>
  <rect width="980" height="500" fill="#0E1117"/>
  <circle cx="60" cy="240" r="34" fill="#141923" stroke="#4D9DF5" stroke-width="1.6"/>
  <text x="60" y="245" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700" fill="#E6EDF3" text-anchor="middle">S</text>
  <text x="60" y="294" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="600" fill="#8B97A8" text-anchor="middle" letter-spacing="0.6">SOURCE</text>
  <line x1="96" y1="240" x2="224" y2="240" stroke="#2B3444" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <circle cx="260" cy="240" r="34" fill="#141923" stroke="#2B3444" stroke-width="1.6"/>
  <text x="260" y="245" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700" fill="#E6EDF3" text-anchor="middle">D</text>
  <text x="260" y="294" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="600" fill="#8B97A8" text-anchor="middle" letter-spacing="0.6">DEPENDENCIES</text>
  <line x1="296" y1="240" x2="424" y2="240" stroke="#2B3444" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <circle cx="460" cy="240" r="34" fill="#141923" stroke="#2B3444" stroke-width="1.6"/>
  <text x="460" y="245" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700" fill="#E6EDF3" text-anchor="middle">B</text>
  <text x="460" y="294" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="600" fill="#8B97A8" text-anchor="middle" letter-spacing="0.6">BUILD</text>
  <line x1="496" y1="240" x2="624" y2="240" stroke="#2B3444" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <circle cx="660" cy="240" r="34" fill="#141923" stroke="#2B3444" stroke-width="1.6"/>
  <text x="660" y="245" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700" fill="#E6EDF3" text-anchor="middle">A</text>
  <text x="660" y="294" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="600" fill="#8B97A8" text-anchor="middle" letter-spacing="0.6">ARTIFACT</text>
  <line x1="696" y1="240" x2="824" y2="240" stroke="#2B3444" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <circle cx="860" cy="240" r="34" fill="#141923" stroke="#4D9DF5" stroke-width="1.6"/>
  <text x="860" y="245" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700" fill="#E6EDF3" text-anchor="middle">P</text>
  <text x="860" y="294" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="600" fill="#8B97A8" text-anchor="middle" letter-spacing="0.6">PRODUCTION</text>
  <rect x="150" y="150" width="220" height="74" rx="8" fill="#141923" stroke="#E11D2A66" stroke-width="1"/>
  <text x="164" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="800" fill="#E11D2A" text-anchor="start" letter-spacing="0.8">1 · DEPENDENCY</text>
  <text x="164" y="192.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#8B97A8" text-anchor="start">A package is modified maliciously</text>
  <text x="164" y="206.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#8B97A8" text-anchor="start">— typosquat, confusion, a</text>
  <text x="164" y="221.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#8B97A8" text-anchor="start">maintainer turning hostile.</text>
  <line x1="260" y1="224" x2="260" y2="206" stroke="#E11D2A" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <rect x="350" y="150" width="220" height="74" rx="8" fill="#141923" stroke="#E11D2A66" stroke-width="1"/>
  <text x="364" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="800" fill="#E11D2A" text-anchor="start" letter-spacing="0.8">2 · BUILD</text>
  <text x="364" y="192.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#8B97A8" text-anchor="start">The pipeline is compromised and</text>
  <text x="364" y="206.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#8B97A8" text-anchor="start">the artifact is changed between</text>
  <text x="364" y="221.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#8B97A8" text-anchor="start">source and deploy.</text>
  <line x1="460" y1="224" x2="460" y2="206" stroke="#E11D2A" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <rect x="550" y="330" width="220" height="84" rx="8" fill="#141923" stroke="#E11D2A66" stroke-width="1"/>
  <text x="564" y="352" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="800" fill="#E11D2A" text-anchor="start" letter-spacing="0.8">3 · DISTRIBUTION</text>
  <text x="564" y="372.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#8B97A8" text-anchor="start">The artifact is altered between</text>
  <text x="564" y="386.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#8B97A8" text-anchor="start">build and consumer.</text>
  <line x1="660" y1="330" x2="660" y2="274" stroke="#E11D2A" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <rect x="732" y="330" width="220" height="84" rx="8" fill="#141923" stroke="#E11D2A66" stroke-width="1"/>
  <text x="746" y="352" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="800" fill="#E11D2A" text-anchor="start" letter-spacing="0.8">4 · SUPPLIER</text>
  <text x="746" y="372.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#8B97A8" text-anchor="start">Your software vendor is breached</text>
  <text x="746" y="386.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#8B97A8" text-anchor="start">and their product is the vector.</text>
  <line x1="860" y1="330" x2="860" y2="274" stroke="#E11D2A" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <rect x="28" y="424" width="924" height="62" rx="8" fill="#141923" stroke="#36D39955" stroke-width="1"/>
  <text x="46" y="448" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#36D399" text-anchor="start" letter-spacing="1.1">THE HIGHEST-VALUE CONTROL, AND IT COSTS A DAY</text>
  <text x="46" y="471" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="400" fill="#8B97A8" text-anchor="start">Pin dependencies, CI actions and base images by commit digest. A mutable tag is a promise the maintainer can revoke silently.</text>
  <text x="28" y="40" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="800" fill="#E11D2A" text-anchor="start" letter-spacing="1.8">RED TEAM LEADERS</text>
  <text x="28" y="74" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="800" fill="#E6EDF3" text-anchor="start">Four supply chain attack vectors</text>
  <text x="28" y="97.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">Three of the four are invisible to code review, penetration testing and vulnerability scanning — the code is clean, and the</text>
  <text x="28" y="114.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">compromise is in what happened to it.</text>
</svg>
