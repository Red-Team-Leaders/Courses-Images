<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480" role="img" aria-label="The three flows of a GRC programme">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B97A8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E11D2A"/></marker></defs>
  <rect width="980" height="480" fill="#0E1117"/>
  <rect x="28" y="148" width="924" height="84" rx="8" fill="#141923" stroke="#4D9DF566" stroke-width="1"/>
  <text x="46" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="800" fill="#4D9DF5" text-anchor="start" letter-spacing="1">EXPOSURE IN</text>
  <text x="46" y="196.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="400" fill="#8B97A8" text-anchor="start">Architecture review · product launch · vendor onboarding · change approval · incidents · audit findings · intelligence</text>
  <text x="934" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="500" fill="#5B6676" text-anchor="end">Broken → the register describes the past</text>
  <line x1="926" y1="216" x2="936" y2="216" stroke="#4D9DF5" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <rect x="28" y="250" width="924" height="84" rx="8" fill="#141923" stroke="#F5B94D66" stroke-width="1"/>
  <text x="46" y="276" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="800" fill="#F5B94D" text-anchor="start" letter-spacing="1">ASSURANCE UP</text>
  <text x="46" y="298.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="400" fill="#8B97A8" text-anchor="start">Controls operate · evidence accumulates · testing · effectiveness measured · residual derived · status derived</text>
  <text x="934" y="276" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="500" fill="#5B6676" text-anchor="end">Broken → every number is an assertion</text>
  <line x1="926" y1="318" x2="936" y2="318" stroke="#F5B94D" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <rect x="28" y="352" width="924" height="84" rx="8" fill="#141923" stroke="#36D39966" stroke-width="1"/>
  <text x="46" y="378" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="800" fill="#36D399" text-anchor="start" letter-spacing="1">DECISIONS OUT</text>
  <text x="46" y="400.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="400" fill="#8B97A8" text-anchor="start">Treatment approved · risk accepted · budget moved · launch conditioned · vendor rejected · architecture revised</text>
  <text x="934" y="378" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="500" fill="#5B6676" text-anchor="end">Broken → nothing changes</text>
  <line x1="926" y1="420" x2="936" y2="420" stroke="#36D399" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/>
  <rect x="28" y="452" width="924" height="0" rx="8" fill="#1A2130" stroke="#2B3444" stroke-width="1"/>
  <text x="480" y="462" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#FF3B48" text-anchor="middle">A programme where exposure flows in and decisions do not flow out is a recording system.</text>
  <text x="28" y="40" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="800" fill="#E11D2A" text-anchor="start" letter-spacing="1.8">RED TEAM LEADERS</text>
  <text x="28" y="74" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="800" fill="#E6EDF3" text-anchor="start">The three flows of a GRC programme</text>
  <text x="28" y="97.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">Diagnose by flow, not by artifact. Each break has a different remedy — and improving the artifacts of a working flow while the</text>
  <text x="28" y="114.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">broken one stays broken is the usual mistake.</text>
</svg>
