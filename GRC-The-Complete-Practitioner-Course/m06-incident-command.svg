<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" role="img" aria-label="Incident command and the four decision domains">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B97A8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E11D2A"/></marker></defs>
  <rect width="980" height="540" fill="#0E1117"/>
  <rect x="390" y="148" width="200" height="62" rx="8" fill="#141923" stroke="#E11D2A" stroke-width="1.6"/>
  <text x="490" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="800" fill="#E11D2A" text-anchor="middle" letter-spacing="0.6">INCIDENT COMMANDER</text>
  <text x="490" y="194" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="500" fill="#8B97A8" text-anchor="middle">owns the response, not the work</text>
  <line x1="490" y1="210" x2="140" y2="250" stroke="#2B3444" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="28" y="250" width="224" height="104" rx="8" fill="#141923" stroke="#36D39977" stroke-width="1"/>
  <text x="42" y="274" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="800" fill="#36D399" text-anchor="start" letter-spacing="0.8">TECHNICAL</text>
  <text x="42" y="296" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Technical Lead</text>
  <text x="42" y="318" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#8B97A8" text-anchor="start">Contain, preserve, rebuild</text>
  <line x1="490" y1="210" x2="372" y2="250" stroke="#2B3444" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="260" y="250" width="224" height="104" rx="8" fill="#141923" stroke="#F5B94D77" stroke-width="1"/>
  <text x="274" y="274" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="800" fill="#F5B94D" text-anchor="start" letter-spacing="0.8">BUSINESS</text>
  <text x="274" y="296" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Business Lead</text>
  <text x="274" y="318" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#8B97A8" text-anchor="start">Revenue trade-offs, MBCO,</text>
  <text x="274" y="333" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#8B97A8" text-anchor="start">customers</text>
  <line x1="490" y1="210" x2="604" y2="250" stroke="#2B3444" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="492" y="250" width="224" height="104" rx="8" fill="#141923" stroke="#4D9DF577" stroke-width="1"/>
  <text x="506" y="274" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="800" fill="#4D9DF5" text-anchor="start" letter-spacing="0.8">LEGAL</text>
  <text x="506" y="296" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Legal / Privacy Lead</text>
  <text x="506" y="318" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#8B97A8" text-anchor="start">Obligations, privilege,</text>
  <text x="506" y="333" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#8B97A8" text-anchor="start">preservation</text>
  <line x1="490" y1="210" x2="836" y2="250" stroke="#2B3444" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="724" y="250" width="224" height="104" rx="8" fill="#141923" stroke="#FF3B4877" stroke-width="1"/>
  <text x="738" y="274" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="800" fill="#FF3B48" text-anchor="start" letter-spacing="0.8">COMMUNICATIONS</text>
  <text x="738" y="296" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Communications Lead</text>
  <text x="738" y="318" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#8B97A8" text-anchor="start">Every external and internal</text>
  <text x="738" y="333" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#8B97A8" text-anchor="start">statement</text>
  <rect x="28" y="374" width="452" height="76" rx="8" fill="#1A2130" stroke="#2B3444" stroke-width="1"/>
  <text x="46" y="398" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#8B97A8" text-anchor="start" letter-spacing="1">SCRIBE — contemporaneous record</text>
  <text x="46" y="421" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#E6EDF3" text-anchor="start">What did you know, when, and what did you decide —</text>
  <text x="46" y="440" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#E6EDF3" text-anchor="start">including the decisions not to notify.</text>
  <rect x="500" y="374" width="448" height="76" rx="8" fill="#1A2130" stroke="#2B3444" stroke-width="1"/>
  <text x="518" y="398" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#8B97A8" text-anchor="start" letter-spacing="1">EXECUTIVE SPONSOR — removes obstacles</text>
  <text x="518" y="421" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#E6EDF3" text-anchor="start">Authorises spend above IC limits. Interfaces with</text>
  <text x="518" y="440" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#E6EDF3" text-anchor="start">the board. Does not run the response.</text>
  <rect x="28" y="466" width="920" height="58" rx="8" fill="#141923" stroke="#36D39955" stroke-width="1"/>
  <text x="46" y="490" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#36D399" text-anchor="start" letter-spacing="1">THE STANDING RULE THAT RESOLVES THE TECHNICAL / LEGAL CONFLICT</text>
  <text x="46" y="513" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="400" fill="#8B97A8" text-anchor="start">Preserve first where preservation is cheap. Memory capture and disk image before rebuild — minutes of work protecting months of optionality.</text>
  <text x="28" y="40" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="800" fill="#E11D2A" text-anchor="start" letter-spacing="1.8">RED TEAM LEADERS</text>
  <text x="28" y="74" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="800" fill="#E6EDF3" text-anchor="start">Incident command and the four decision domains</text>
  <text x="28" y="97.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">The Incident Commander is a role, not a rank — and each decision domain has an accountable owner. Most catastrophic incident</text>
  <text x="28" y="114.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">decisions are made by someone from the wrong domain.</text>
</svg>
