<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-label="One event, many clocks">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B97A8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E11D2A"/></marker></defs>
  <rect width="980" height="620" fill="#0E1117"/>
  <text x="46" y="168" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#E11D2A" text-anchor="start" letter-spacing="1.1">AWARENESS</text>
  <line x1="560" y1="150" x2="560" y2="528" stroke="#E11D2A" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4"/>
  <text x="560" y="168" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#E11D2A" text-anchor="middle">0 h</text>
  <line x1="690" y1="150" x2="690" y2="528" stroke="#2B3444" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <text x="690" y="168" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="600" fill="#5B6676" text-anchor="middle">24 h</text>
  <line x1="840" y1="150" x2="840" y2="528" stroke="#2B3444" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <text x="840" y="168" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="600" fill="#5B6676" text-anchor="middle">72 h</text>
  <line x1="940" y1="150" x2="940" y2="528" stroke="#2B3444" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <text x="940" y="168" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="600" fill="#5B6676" text-anchor="middle">96 h</text>
  <rect x="28" y="182" width="920" height="38" rx="8" fill="#141923" stroke="none" stroke-width="1"/>
  <text x="46" y="199" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="start">DORA</text>
  <text x="46" y="214" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#5B6676" text-anchor="start">4 h from classification, and no later than 24 h from awareness</text>
  <line x1="560" y1="201" x2="600" y2="201" stroke="#E11D2A" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="600" cy="201" r="5" fill="#E11D2A" stroke="none" stroke-width="1"/>
  <rect x="28" y="225" width="920" height="38" rx="8" fill="#1A2130" stroke="none" stroke-width="1"/>
  <text x="46" y="242" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="start">NIS2</text>
  <text x="46" y="257" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#5B6676" text-anchor="start">24 h early warning, 72 h notification, 1 month final report</text>
  <line x1="560" y1="244" x2="690" y2="244" stroke="#FF3B48" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="690" cy="244" r="5" fill="#FF3B48" stroke="none" stroke-width="1"/>
  <rect x="28" y="268" width="920" height="38" rx="8" fill="#141923" stroke="none" stroke-width="1"/>
  <text x="46" y="285" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Card brands</text>
  <text x="46" y="300" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#5B6676" text-anchor="start">often 24 h on a suspected account data compromise</text>
  <line x1="560" y1="287" x2="690" y2="287" stroke="#F5B94D" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="690" cy="287" r="5" fill="#F5B94D" stroke="none" stroke-width="1"/>
  <rect x="28" y="311" width="920" height="38" rx="8" fill="#1A2130" stroke="none" stroke-width="1"/>
  <text x="46" y="328" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Customer contracts</text>
  <text x="46" y="343" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#5B6676" text-anchor="start">frequently 24 h — shorter than any regulation</text>
  <line x1="560" y1="330" x2="690" y2="330" stroke="#F5B94D" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="690" cy="330" r="5" fill="#F5B94D" stroke="none" stroke-width="1"/>
  <rect x="28" y="354" width="920" height="38" rx="8" fill="#141923" stroke="none" stroke-width="1"/>
  <text x="46" y="371" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="start">GDPR art. 33</text>
  <text x="46" y="386" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#5B6676" text-anchor="start">72 h to the supervisory authority; phased notification permitted</text>
  <line x1="560" y1="373" x2="840" y2="373" stroke="#4D9DF5" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="840" cy="373" r="5" fill="#4D9DF5" stroke="none" stroke-width="1"/>
  <rect x="28" y="397" width="920" height="38" rx="8" fill="#1A2130" stroke="none" stroke-width="1"/>
  <text x="46" y="414" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Cyber insurer</text>
  <text x="46" y="429" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#5B6676" text-anchor="start">commonly 72 h from discovery; panel conditions apply</text>
  <line x1="560" y1="416" x2="840" y2="416" stroke="#4D9DF5" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="840" cy="416" r="5" fill="#4D9DF5" stroke="none" stroke-width="1"/>
  <rect x="28" y="440" width="920" height="38" rx="8" fill="#141923" stroke="none" stroke-width="1"/>
  <text x="46" y="457" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="start">LGPD art. 48</text>
  <text x="46" y="472" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#5B6676" text-anchor="start">3 business days — ANPD Resolucao CD/ANPD 15/2024</text>
  <line x1="560" y1="459" x2="840" y2="459" stroke="#36D399" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="840" cy="459" r="5" fill="#36D399" stroke="none" stroke-width="1"/>
  <rect x="28" y="483" width="920" height="38" rx="8" fill="#1A2130" stroke="none" stroke-width="1"/>
  <text x="46" y="500" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="start">SEC Item 1.05</text>
  <text x="46" y="515" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#5B6676" text-anchor="start">4 business days from the materiality determination</text>
  <line x1="560" y1="502" x2="940" y2="502" stroke="#36D399" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="940" cy="502" r="5" fill="#36D399" stroke="none" stroke-width="1"/>
  <rect x="28" y="538" width="920" height="66" rx="8" fill="#141923" stroke="#F5B94D55" stroke-width="1"/>
  <text x="46" y="562" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="700" fill="#F5B94D" text-anchor="start" letter-spacing="1.1">THE TWO MOST COMMONLY MISSED</text>
  <text x="46" y="585.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="400" fill="#8B97A8" text-anchor="start">The insurer — whose panel conditions must be resolved before any forensic firm is engaged — and the customer contracts, which are</text>
  <text x="46" y="601.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="400" fill="#8B97A8" text-anchor="start">usually shorter than the law.</text>
  <text x="28" y="40" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="800" fill="#E11D2A" text-anchor="start" letter-spacing="1.8">RED TEAM LEADERS</text>
  <text x="28" y="74" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="800" fill="#E6EDF3" text-anchor="start">One event, many clocks</text>
  <text x="28" y="97.0" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">Every clock starts at awareness, not at understanding — and the thresholds differ from your internal severity and from each</text>
  <text x="28" y="114.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#8B97A8" text-anchor="start">other.</text>
</svg>
