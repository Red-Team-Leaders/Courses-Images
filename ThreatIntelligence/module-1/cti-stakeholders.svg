<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <!-- Arrow markers for bidirectional flow -->
    <marker id="arrowOut" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b949e"/>
    </marker>
    <marker id="arrowIn" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="10 0, 0 3.5, 10 7" fill="#8b949e"/>
    </marker>

    <!-- Glow filter for central hub -->
    <filter id="hubGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle shadow for cards -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Background grid pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161b22" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="#0d1117" rx="0"/>
  <rect width="900" height="650" fill="url(#grid)"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#e6edf3" letter-spacing="1">CTI Stakeholder Ecosystem</text>
  <line x1="300" y1="54" x2="600" y2="54" stroke="#30363d" stroke-width="1"/>

  <!-- ================================================================== -->
  <!-- CONNECTING LINES (drawn first so they sit behind the nodes)        -->
  <!-- Each line is a pair: outbound arrow + inbound arrow, slightly offset -->
  <!-- ================================================================== -->

  <!-- SOC Team (top-left) -->
  <line x1="395" y1="305" x2="210" y2="175" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowOut)"/>
  <line x1="405" y1="310" x2="220" y2="180" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowIn)"/>

  <!-- Blue Team (top-right) -->
  <line x1="505" y1="305" x2="690" y2="175" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowOut)"/>
  <line x1="495" y1="310" x2="680" y2="180" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowOut)"/>

  <!-- Red Team (right) -->
  <line x1="530" y1="330" x2="720" y2="330" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowOut)"/>
  <line x1="530" y1="340" x2="720" y2="340" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowIn)"/>

  <!-- GRC (bottom-right) -->
  <line x1="505" y1="365" x2="690" y2="495" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowOut)"/>
  <line x1="495" y1="360" x2="680" y2="490" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowIn)"/>

  <!-- Executive Leadership (bottom-left) -->
  <line x1="395" y1="365" x2="210" y2="495" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowOut)"/>
  <line x1="405" y1="360" x2="220" y2="490" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowIn)"/>

  <!-- IT Operations (left) -->
  <line x1="370" y1="330" x2="180" y2="330" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowOut)"/>
  <line x1="370" y1="340" x2="180" y2="340" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowIn)"/>


  <!-- ================================================================== -->
  <!-- CENTRAL HUB                                                        -->
  <!-- ================================================================== -->
  <g filter="url(#hubGlow)">
    <circle cx="450" cy="335" r="75" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5"/>
    <circle cx="450" cy="335" r="75" fill="none" stroke="#58a6ff" stroke-width="0.8" stroke-dasharray="4,4" r="85">
      <animateTransform attributeName="transform" type="rotate" from="0 450 335" to="360 450 335" dur="60s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="335" r="65" fill="#0d1117" stroke="#58a6ff" stroke-width="0.5"/>
    <!-- Hub icon: shield -->
    <path d="M450 290 l22 10 v18 c0 16-9 31-22 38 c-13-7-22-22-22-38 v-18 z" fill="none" stroke="#58a6ff" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="450" y="348" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3">CTI Program</text>
    <text x="450" y="366" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#8b949e">Central Intelligence Hub</text>
  </g>

  <!-- Rotating dashed orbit ring -->
  <circle cx="450" cy="335" r="88" fill="none" stroke="#58a6ff" stroke-width="0.6" stroke-dasharray="3,6" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="0 450 335" to="360 450 335" dur="90s" repeatCount="indefinite"/>
  </circle>


  <!-- ================================================================== -->
  <!-- STAKEHOLDER CARDS                                                  -->
  <!-- ================================================================== -->

  <!-- 1. SOC Team (top-left) -->
  <g filter="url(#cardShadow)">
    <rect x="80" y="108" width="200" height="90" rx="8" fill="#161b22" stroke="#e94560" stroke-width="1.8"/>
    <rect x="80" y="108" width="200" height="4" rx="8" fill="#e94560"/>
    <!-- Icon: eye -->
    <circle cx="110" cy="140" r="14" fill="none" stroke="#e94560" stroke-width="1.2"/>
    <circle cx="110" cy="140" r="5" fill="#e94560" opacity="0.6"/>
    <text x="132" y="138" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">SOC Team</text>
    <text x="132" y="155" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#8b949e">Tier 1-3 Analysts</text>
    <line x1="95" y1="168" x2="265" y2="168" stroke="#30363d" stroke-width="0.5"/>
    <text x="180" y="185" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#e94560" font-style="italic">IOCs, alerts, context</text>
  </g>

  <!-- 2. Blue Team (top-right) -->
  <g filter="url(#cardShadow)">
    <rect x="620" y="108" width="200" height="90" rx="8" fill="#161b22" stroke="#0f3460" stroke-width="1.8"/>
    <rect x="620" y="108" width="200" height="4" rx="8" fill="#0f3460"/>
    <!-- Icon: shield -->
    <path d="M650 128 l10 5 v10 c0 8-4 16-10 20 c-6-4-10-12-10-20 v-10 z" fill="none" stroke="#4a8ad4" stroke-width="1.2"/>
    <text x="672" y="138" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Blue Team</text>
    <text x="672" y="155" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#8b949e">Defensive Security</text>
    <line x1="635" y1="168" x2="805" y2="168" stroke="#30363d" stroke-width="0.5"/>
    <text x="720" y="185" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#4a8ad4" font-style="italic">Detection rules, TTPs</text>
  </g>

  <!-- 3. Red Team (right) -->
  <g filter="url(#cardShadow)">
    <rect x="620" y="290" width="200" height="90" rx="8" fill="#161b22" stroke="#533483" stroke-width="1.8"/>
    <rect x="620" y="290" width="200" height="4" rx="8" fill="#533483"/>
    <!-- Icon: crosshair -->
    <circle cx="650" cy="322" r="10" fill="none" stroke="#9b6ddb" stroke-width="1.2"/>
    <line x1="650" y1="308" x2="650" y2="316" stroke="#9b6ddb" stroke-width="1.2"/>
    <line x1="650" y1="328" x2="650" y2="336" stroke="#9b6ddb" stroke-width="1.2"/>
    <line x1="636" y1="322" x2="644" y2="322" stroke="#9b6ddb" stroke-width="1.2"/>
    <line x1="656" y1="322" x2="664" y2="322" stroke="#9b6ddb" stroke-width="1.2"/>
    <text x="672" y="320" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Red Team</text>
    <text x="672" y="337" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#8b949e">Offensive Security</text>
    <line x1="635" y1="350" x2="805" y2="350" stroke="#30363d" stroke-width="0.5"/>
    <text x="720" y="367" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#9b6ddb" font-style="italic">Adversary emulation intel</text>
  </g>

  <!-- 4. GRC (bottom-right) -->
  <g filter="url(#cardShadow)">
    <rect x="620" y="462" width="200" height="90" rx="8" fill="#161b22" stroke="#e6a817" stroke-width="1.8"/>
    <rect x="620" y="462" width="200" height="4" rx="8" fill="#e6a817"/>
    <!-- Icon: clipboard/checklist -->
    <rect x="640" y="480" width="16" height="20" rx="2" fill="none" stroke="#e6a817" stroke-width="1.2"/>
    <rect x="645" y="477" width="6" height="4" rx="1" fill="#e6a817" opacity="0.6"/>
    <line x1="644" y1="489" x2="652" y2="489" stroke="#e6a817" stroke-width="0.8"/>
    <line x1="644" y1="493" x2="652" y2="493" stroke="#e6a817" stroke-width="0.8"/>
    <text x="665" y="494" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">GRC</text>
    <text x="665" y="511" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#8b949e">Governance, Risk, Compliance</text>
    <line x1="635" y1="522" x2="805" y2="522" stroke="#30363d" stroke-width="0.5"/>
    <text x="720" y="540" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#e6a817" font-style="italic">Risk assessments, compliance</text>
  </g>

  <!-- 5. Executive Leadership (bottom-left) -->
  <g filter="url(#cardShadow)">
    <rect x="80" y="462" width="200" height="90" rx="8" fill="#161b22" stroke="#1a6b3c" stroke-width="1.8"/>
    <rect x="80" y="462" width="200" height="4" rx="8" fill="#1a6b3c"/>
    <!-- Icon: bar chart -->
    <rect x="100" y="494" width="4" height="10" rx="1" fill="#2ea85a" opacity="0.5"/>
    <rect x="107" y="489" width="4" height="15" rx="1" fill="#2ea85a" opacity="0.7"/>
    <rect x="114" y="484" width="4" height="20" rx="1" fill="#2ea85a"/>
    <text x="128" y="494" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#e6edf3">Executive</text>
    <text x="128" y="508" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#e6edf3">Leadership</text>
    <line x1="95" y1="522" x2="265" y2="522" stroke="#30363d" stroke-width="0.5"/>
    <text x="180" y="540" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#2ea85a" font-style="italic">Strategic briefings</text>
  </g>

  <!-- 6. IT Operations (left) -->
  <g filter="url(#cardShadow)">
    <rect x="0" y="290" width="200" height="90" rx="8" fill="#161b22" stroke="#2d5016" stroke-width="1.8"/>
    <rect x="0" y="290" width="200" height="4" rx="8" fill="#2d5016"/>
    <!-- Icon: server/gear -->
    <rect x="22" y="312" width="16" height="4" rx="1" fill="#4a8a2a" opacity="0.5"/>
    <rect x="22" y="319" width="16" height="4" rx="1" fill="#4a8a2a" opacity="0.7"/>
    <rect x="22" y="326" width="16" height="4" rx="1" fill="#4a8a2a"/>
    <circle cx="34" cy="314" r="1" fill="#e6edf3"/>
    <circle cx="34" cy="321" r="1" fill="#e6edf3"/>
    <circle cx="34" cy="328" r="1" fill="#e6edf3"/>
    <text x="46" y="320" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">IT Operations</text>
    <text x="46" y="337" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#8b949e">Infrastructure &amp; Ops</text>
    <line x1="15" y1="350" x2="185" y2="350" stroke="#30363d" stroke-width="0.5"/>
    <text x="100" y="367" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#4a8a2a" font-style="italic">Patch priorities, exposure data</text>
  </g>


  <!-- ================================================================== -->
  <!-- BIDIRECTIONAL ARROW LABELS along the connection lines              -->
  <!-- ================================================================== -->

  <!-- SOC path label -->
  <rect x="260" y="225" width="24" height="14" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
  <text x="272" y="235" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#8b949e">&#x21C4;</text>

  <!-- Blue Team path label -->
  <rect x="616" y="225" width="24" height="14" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
  <text x="628" y="235" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#8b949e">&#x21C4;</text>

  <!-- Red Team path label -->
  <rect x="583" y="327" width="24" height="14" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
  <text x="595" y="337" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#8b949e">&#x21C4;</text>

  <!-- GRC path label -->
  <rect x="616" y="425" width="24" height="14" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
  <text x="628" y="435" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#8b949e">&#x21C4;</text>

  <!-- Executive path label -->
  <rect x="260" y="425" width="24" height="14" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
  <text x="272" y="435" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#8b949e">&#x21C4;</text>

  <!-- IT Ops path label -->
  <rect x="283" y="327" width="24" height="14" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
  <text x="295" y="337" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#8b949e">&#x21C4;</text>


  <!-- ================================================================== -->
  <!-- LEGEND                                                             -->
  <!-- ================================================================== -->
  <g transform="translate(295, 600)">
    <line x1="0" y1="10" x2="30" y2="10" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowOut)"/>
    <text x="38" y="14" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#8b949e">Intel flow (bidirectional)</text>
    <circle cx="220" cy="10" r="6" fill="none" stroke="#58a6ff" stroke-width="1.2"/>
    <text x="232" y="14" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#8b949e">Central hub</text>
  </g>

  <!-- Subtle watermark -->
  <text x="880" y="640" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#30363d">Cyber Threat Intelligence</text>
</svg>