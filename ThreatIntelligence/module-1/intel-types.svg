<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <!-- Subtle grid pattern for background -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1a2332" stroke-width="0.5"/>
    </pattern>
    <!-- Glow filter for arrow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Drop shadow for bands -->
    <filter id="bandShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <!-- Subtle inner glow for bands -->
    <linearGradient id="bandSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
    <!-- Arrow gradient -->
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="33%" stop-color="#e6a817"/>
      <stop offset="66%" stop-color="#533483"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#0d1117"/>
  <rect width="900" height="600" fill="url(#grid)"/>

  <!-- Title -->
  <text x="450" y="48" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#e6edf3" letter-spacing="1">Types of Threat Intelligence</text>
  <line x1="280" y1="60" x2="620" y2="60" stroke="#30363d" stroke-width="1"/>

  <!-- ================================================================ -->
  <!-- LEFT ARROW — Long-term to Immediate -->
  <!-- ================================================================ -->
  <g transform="translate(52, 90)">
    <!-- Arrow shaft -->
    <rect x="-3" y="20" width="6" height="420" rx="3" fill="url(#arrowGrad)" filter="url(#glow)"/>
    <!-- Top arrowhead (pointing up) -->
    <polygon points="0,8 -10,24 10,24" fill="#e94560" filter="url(#glow)"/>
    <!-- Bottom arrowhead (pointing down) -->
    <polygon points="0,452 -10,436 10,436" fill="#0f3460" filter="url(#glow)"/>

    <!-- Labels -->
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="1">LONG-TERM</text>
    <text x="0" y="472" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="1">IMMEDIATE</text>
  </g>

  <!-- ================================================================ -->
  <!-- BAND 1 — Strategic Intelligence -->
  <!-- ================================================================ -->
  <g transform="translate(100, 85)">
    <rect width="760" height="105" rx="8" fill="#e94560" opacity="0.12" filter="url(#bandShadow)"/>
    <rect width="760" height="105" rx="8" fill="url(#bandSheen)"/>
    <rect x="0" y="0" width="5" height="105" rx="2" fill="#e94560"/>

    <!-- Icon: Globe / World -->
    <g transform="translate(35, 52)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#e94560" stroke-width="1.8" opacity="0.9"/>
      <ellipse cx="0" cy="0" rx="10" ry="22" fill="none" stroke="#e94560" stroke-width="1.2" opacity="0.7"/>
      <line x1="-22" y1="0" x2="22" y2="0" stroke="#e94560" stroke-width="1" opacity="0.6"/>
      <line x1="-20" y1="-10" x2="20" y2="-10" stroke="#e94560" stroke-width="0.8" opacity="0.4"/>
      <line x1="-20" y1="10" x2="20" y2="10" stroke="#e94560" stroke-width="0.8" opacity="0.4"/>
      <!-- Small crown/star on top for executive level -->
      <polygon points="0,-28 -3,-24 3,-24" fill="#e94560" opacity="0.8"/>
      <polygon points="-7,-28 -5,-24 -9,-24" fill="#e94560" opacity="0.6"/>
      <polygon points="7,-28 5,-24 9,-24" fill="#e94560" opacity="0.6"/>
    </g>

    <!-- Text content -->
    <text x="80" y="35" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#e94560">Strategic Intelligence</text>
    <rect x="80" y="43" width="190" height="1" fill="#e94560" opacity="0.3"/>
    <text x="80" y="62" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#c9d1d9">Audience:</text>
    <text x="148" y="62" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" fill="#8b949e">Board &amp; Executives</text>
    <text x="80" y="84" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#c9d1d9">Focus:</text>
    <text x="126" y="84" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" fill="#8b949e">Risk landscape, geopolitical trends, business impact</text>

    <!-- Tags -->
    <g transform="translate(530, 30)">
      <rect width="80" height="24" rx="12" fill="#e94560" opacity="0.2" stroke="#e94560" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="40" y="16" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#e94560">HIGH LEVEL</text>
    </g>
    <g transform="translate(620, 30)">
      <rect width="100" height="24" rx="12" fill="#e94560" opacity="0.2" stroke="#e94560" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="50" y="16" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#e94560">NON-TECH</text>
    </g>
  </g>

  <!-- ================================================================ -->
  <!-- BAND 2 — Operational Intelligence -->
  <!-- ================================================================ -->
  <g transform="translate(100, 200)">
    <rect width="760" height="105" rx="8" fill="#e6a817" opacity="0.12" filter="url(#bandShadow)"/>
    <rect width="760" height="105" rx="8" fill="url(#bandSheen)"/>
    <rect x="0" y="0" width="5" height="105" rx="2" fill="#e6a817"/>

    <!-- Icon: Binoculars / Campaign tracking -->
    <g transform="translate(35, 52)">
      <!-- Binocular shape -->
      <rect x="-20" y="-14" width="14" height="28" rx="7" fill="none" stroke="#e6a817" stroke-width="1.8" opacity="0.9"/>
      <rect x="6" y="-14" width="14" height="28" rx="7" fill="none" stroke="#e6a817" stroke-width="1.8" opacity="0.9"/>
      <rect x="-6" y="-5" width="12" height="10" rx="3" fill="none" stroke="#e6a817" stroke-width="1.2" opacity="0.6"/>
      <!-- Lens glint -->
      <circle cx="-13" cy="10" r="4" fill="none" stroke="#e6a817" stroke-width="1" opacity="0.5"/>
      <circle cx="13" cy="10" r="4" fill="none" stroke="#e6a817" stroke-width="1" opacity="0.5"/>
      <!-- Person silhouette below -->
      <circle cx="0" cy="-22" r="4" fill="none" stroke="#e6a817" stroke-width="1" opacity="0.5"/>
    </g>

    <!-- Text content -->
    <text x="80" y="35" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#e6a817">Operational Intelligence</text>
    <rect x="80" y="43" width="210" height="1" fill="#e6a817" opacity="0.3"/>
    <text x="80" y="62" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#c9d1d9">Audience:</text>
    <text x="148" y="62" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" fill="#8b949e">Security Managers</text>
    <text x="80" y="84" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#c9d1d9">Focus:</text>
    <text x="126" y="84" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" fill="#8b949e">Campaign details, actor profiles, operational context</text>

    <!-- Tags -->
    <g transform="translate(530, 30)">
      <rect width="100" height="24" rx="12" fill="#e6a817" opacity="0.2" stroke="#e6a817" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="50" y="16" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#e6a817">CAMPAIGNS</text>
    </g>
    <g transform="translate(640, 30)">
      <rect width="80" height="24" rx="12" fill="#e6a817" opacity="0.2" stroke="#e6a817" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="40" y="16" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#e6a817">ACTORS</text>
    </g>
  </g>

  <!-- ================================================================ -->
  <!-- BAND 3 — Tactical Intelligence -->
  <!-- ================================================================ -->
  <g transform="translate(100, 315)">
    <rect width="760" height="105" rx="8" fill="#533483" opacity="0.15" filter="url(#bandShadow)"/>
    <rect width="760" height="105" rx="8" fill="url(#bandSheen)"/>
    <rect x="0" y="0" width="5" height="105" rx="2" fill="#533483"/>

    <!-- Icon: Chess Knight / Tactics -->
    <g transform="translate(35, 52)">
      <!-- Shield shape -->
      <path d="M0,-24 L18,-14 L18,6 L0,22 L-18,6 L-18,-14 Z" fill="none" stroke="#533483" stroke-width="1.8" opacity="0.9"/>
      <!-- Crosshair inside -->
      <circle cx="0" cy="-1" r="10" fill="none" stroke="#533483" stroke-width="1.2" opacity="0.6"/>
      <line x1="0" y1="-14" x2="0" y2="12" stroke="#533483" stroke-width="1" opacity="0.5"/>
      <line x1="-13" y1="-1" x2="13" y2="-1" stroke="#533483" stroke-width="1" opacity="0.5"/>
      <circle cx="0" cy="-1" r="3" fill="#533483" opacity="0.4"/>
    </g>

    <!-- Text content -->
    <text x="80" y="35" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#9b6dd7">Tactical Intelligence</text>
    <rect x="80" y="43" width="180" height="1" fill="#533483" opacity="0.3"/>
    <text x="80" y="62" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#c9d1d9">Audience:</text>
    <text x="148" y="62" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" fill="#8b949e">SOC &amp; IR Teams</text>
    <text x="80" y="84" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#c9d1d9">Focus:</text>
    <text x="126" y="84" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" fill="#8b949e">TTPs, attack patterns, procedures, methodologies</text>

    <!-- Tags -->
    <g transform="translate(530, 30)">
      <rect width="60" height="24" rx="12" fill="#533483" opacity="0.25" stroke="#9b6dd7" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="30" y="16" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#9b6dd7">TTPs</text>
    </g>
    <g transform="translate(600, 30)">
      <rect width="110" height="24" rx="12" fill="#533483" opacity="0.25" stroke="#9b6dd7" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="55" y="16" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#9b6dd7">MITRE ATT&amp;CK</text>
    </g>
  </g>

  <!-- ================================================================ -->
  <!-- BAND 4 — Technical Intelligence -->
  <!-- ================================================================ -->
  <g transform="translate(100, 430)">
    <rect width="760" height="105" rx="8" fill="#0f3460" opacity="0.2" filter="url(#bandShadow)"/>
    <rect width="760" height="105" rx="8" fill="url(#bandSheen)"/>
    <rect x="0" y="0" width="5" height="105" rx="2" fill="#1a6ed8"/>

    <!-- Icon: Terminal / Code -->
    <g transform="translate(35, 52)">
      <!-- Terminal window -->
      <rect x="-22" y="-18" width="44" height="36" rx="4" fill="none" stroke="#1a6ed8" stroke-width="1.8" opacity="0.9"/>
      <line x1="-22" y1="-10" x2="22" y2="-10" stroke="#1a6ed8" stroke-width="1" opacity="0.5"/>
      <!-- Prompt symbol > -->
      <text x="-14" y="4" font-family="monospace" font-size="14" font-weight="700" fill="#1a6ed8" opacity="0.8">&gt;_</text>
      <!-- Dots on title bar -->
      <circle cx="-16" cy="-14" r="1.5" fill="#e94560" opacity="0.7"/>
      <circle cx="-11" cy="-14" r="1.5" fill="#e6a817" opacity="0.7"/>
      <circle cx="-6" cy="-14" r="1.5" fill="#3fb950" opacity="0.7"/>
      <!-- Binary digits -->
      <text x="2" y="12" font-family="monospace" font-size="8" fill="#1a6ed8" opacity="0.5">0x4f</text>
    </g>

    <!-- Text content -->
    <text x="80" y="35" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1a6ed8">Technical Intelligence</text>
    <rect x="80" y="43" width="195" height="1" fill="#0f3460" opacity="0.3"/>
    <text x="80" y="62" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#c9d1d9">Audience:</text>
    <text x="148" y="62" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" fill="#8b949e">Detection Engineers</text>
    <text x="80" y="84" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#c9d1d9">Focus:</text>
    <text x="126" y="84" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" fill="#8b949e">IOCs, signatures, hashes, IPs, domains, artifacts</text>

    <!-- Tags -->
    <g transform="translate(530, 30)">
      <rect width="60" height="24" rx="12" fill="#0f3460" opacity="0.3" stroke="#1a6ed8" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="30" y="16" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#1a6ed8">IOCs</text>
    </g>
    <g transform="translate(600, 30)">
      <rect width="70" height="24" rx="12" fill="#0f3460" opacity="0.3" stroke="#1a6ed8" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="35" y="16" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#1a6ed8">SIGMA</text>
    </g>
    <g transform="translate(680, 30)">
      <rect width="70" height="24" rx="12" fill="#0f3460" opacity="0.3" stroke="#1a6ed8" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="35" y="16" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#1a6ed8">YARA</text>
    </g>
  </g>

  <!-- ================================================================ -->
  <!-- Abstraction label on right side -->
  <!-- ================================================================ -->
  <g transform="translate(878, 300)">
    <text transform="rotate(-90)" x="0" y="0" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#484f58" letter-spacing="2">ABSTRACTION LEVEL</text>
  </g>

  <!-- Decorative bottom line -->
  <line x1="100" y1="555" x2="860" y2="555" stroke="#30363d" stroke-width="0.5"/>

  <!-- Footer -->
  <text x="450" y="578" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" fill="#484f58">Each layer feeds and enriches the others in a continuous intelligence cycle</text>
</svg>