<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <!-- Glow filter for boxes -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <!-- Arrow marker -->
    <marker id="arrow-e94560" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" fill="#e94560">
      <path d="M 0 1 L 10 5 L 0 9 Z"/>
    </marker>
    <marker id="arrow-0f3460" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" fill="#4a8abf">
      <path d="M 0 1 L 10 5 L 0 9 Z"/>
    </marker>
    <marker id="arrow-533483" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" fill="#8b5fbf">
      <path d="M 0 1 L 10 5 L 0 9 Z"/>
    </marker>
    <marker id="arrow-e6a817" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" fill="#e6a817">
      <path d="M 0 1 L 10 5 L 0 9 Z"/>
    </marker>
    <marker id="arrow-1a6b3c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" fill="#2aad5a">
      <path d="M 0 1 L 10 5 L 0 9 Z"/>
    </marker>
    <marker id="arrow-2d5016" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" fill="#4a8a2a">
      <path d="M 0 1 L 10 5 L 0 9 Z"/>
    </marker>
    <!-- Radial gradient for center -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2332" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </radialGradient>
    <!-- Subtle background pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#151b23" stroke-width="0.5"/>
    </pattern>
    <!-- Gradient overlays for boxes -->
    <linearGradient id="grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#c23152"/>
    </linearGradient>
    <linearGradient id="grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3460"/>
      <stop offset="100%" stop-color="#1a4a80"/>
    </linearGradient>
    <linearGradient id="grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#533483"/>
      <stop offset="100%" stop-color="#6b44a8"/>
    </linearGradient>
    <linearGradient id="grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6a817"/>
      <stop offset="100%" stop-color="#c89012"/>
    </linearGradient>
    <linearGradient id="grad-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a6b3c"/>
      <stop offset="100%" stop-color="#228b4a"/>
    </linearGradient>
    <linearGradient id="grad-6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d5016"/>
      <stop offset="100%" stop-color="#3d6b1e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="#0d1117"/>
  <rect width="900" height="700" fill="url(#grid)" opacity="0.6"/>

  <!-- Outer decorative ring -->
  <circle cx="450" cy="350" r="228" fill="none" stroke="#151b23" stroke-width="40" opacity="0.5"/>
  <circle cx="450" cy="350" r="228" fill="none" stroke="#1a2332" stroke-width="1" stroke-dasharray="4,8" opacity="0.8"/>

  <!-- Curved arrows connecting stages (clockwise) -->
  <!-- Positions (center of each box):
       1: (450, 120)  - top center
       2: (693, 225)  - top right
       3: (693, 475)  - bottom right
       4: (450, 580)  - bottom center
       5: (207, 475)  - bottom left
       6: (207, 225)  - top left
  -->

  <!-- Arrow 1->2: Direction & Planning to Collection -->
  <path d="M 530 140 Q 620 130, 640 195" fill="none" stroke="#e94560" stroke-width="2.5" stroke-opacity="0.8" marker-end="url(#arrow-e94560)"/>

  <!-- Arrow 2->3: Collection to Processing -->
  <path d="M 720 275 Q 740 370, 720 430" fill="none" stroke="#4a8abf" stroke-width="2.5" stroke-opacity="0.8" marker-end="url(#arrow-0f3460)"/>

  <!-- Arrow 3->4: Processing to Analysis -->
  <path d="M 640 510 Q 580 560, 530 565" fill="none" stroke="#8b5fbf" stroke-width="2.5" stroke-opacity="0.8" marker-end="url(#arrow-533483)"/>

  <!-- Arrow 4->5: Analysis to Dissemination -->
  <path d="M 370 580 Q 290 575, 260 510" fill="none" stroke="#e6a817" stroke-width="2.5" stroke-opacity="0.8" marker-end="url(#arrow-e6a817)"/>

  <!-- Arrow 5->6: Dissemination to Feedback -->
  <path d="M 185 430 Q 165 370, 180 275" fill="none" stroke="#2aad5a" stroke-width="2.5" stroke-opacity="0.8" marker-end="url(#arrow-1a6b3c)"/>

  <!-- Arrow 6->1: Feedback to Direction & Planning -->
  <path d="M 260 195 Q 320 140, 370 135" fill="none" stroke="#4a8a2a" stroke-width="2.5" stroke-opacity="0.8" marker-end="url(#arrow-2d5016)"/>

  <!-- Center circle and text -->
  <circle cx="450" cy="350" r="95" fill="url(#centerGlow)" stroke="#1e2a3a" stroke-width="2"/>
  <circle cx="450" cy="350" r="95" fill="none" stroke="#2a3a4a" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/>
  <text x="450" y="338" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1">Intelligence</text>
  <text x="450" y="365" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1">Cycle</text>
  <!-- Small decorative icon in center -->
  <circle cx="450" cy="390" r="3" fill="#4a5568"/>
  <circle cx="440" cy="390" r="3" fill="#4a5568"/>
  <circle cx="460" cy="390" r="3" fill="#4a5568"/>

  <!-- Stage 1: Direction & Planning (top center) -->
  <g filter="url(#shadow)">
    <rect x="365" y="75" width="170" height="55" rx="10" ry="10" fill="url(#grad-1)" stroke="#ff6b81" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="365" y="75" width="170" height="55" rx="10" ry="10" fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.1"/>
    <!-- Number badge -->
    <circle cx="380" cy="90" r="10" fill="#c23152" stroke="#ff6b81" stroke-width="0.5"/>
    <text x="380" y="94" text-anchor="middle" fill="white" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700">1</text>
    <text x="450" y="100" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600">Direction &amp; Planning</text>
    <text x="450" y="118" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" opacity="0.75">Define goals &amp; scope</text>
  </g>

  <!-- Stage 2: Collection (top right) -->
  <g filter="url(#shadow)">
    <rect x="610" y="190" width="170" height="55" rx="10" ry="10" fill="url(#grad-2)" stroke="#2a6aaa" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="610" y="190" width="170" height="55" rx="10" ry="10" fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.1"/>
    <circle cx="625" cy="205" r="10" fill="#0a2540" stroke="#2a6aaa" stroke-width="0.5"/>
    <text x="625" y="209" text-anchor="middle" fill="white" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700">2</text>
    <text x="695" y="215" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600">Collection</text>
    <text x="695" y="233" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" opacity="0.75">Gather raw data</text>
  </g>

  <!-- Stage 3: Processing (bottom right) -->
  <g filter="url(#shadow)">
    <rect x="610" y="450" width="170" height="55" rx="10" ry="10" fill="url(#grad-3)" stroke="#7a5aaf" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="610" y="450" width="170" height="55" rx="10" ry="10" fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.1"/>
    <circle cx="625" cy="465" r="10" fill="#3a2260" stroke="#7a5aaf" stroke-width="0.5"/>
    <text x="625" y="469" text-anchor="middle" fill="white" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700">3</text>
    <text x="695" y="475" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600">Processing</text>
    <text x="695" y="493" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" opacity="0.75">Organize &amp; normalize</text>
  </g>

  <!-- Stage 4: Analysis (bottom center) -->
  <g filter="url(#shadow)">
    <rect x="365" y="555" width="170" height="55" rx="10" ry="10" fill="url(#grad-4)" stroke="#f0c040" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="365" y="555" width="170" height="55" rx="10" ry="10" fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.1"/>
    <circle cx="380" cy="570" r="10" fill="#a07810" stroke="#f0c040" stroke-width="0.5"/>
    <text x="380" y="574" text-anchor="middle" fill="white" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700">4</text>
    <text x="450" y="580" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600">Analysis</text>
    <text x="450" y="598" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" opacity="0.75">Evaluate &amp; interpret</text>
  </g>

  <!-- Stage 5: Dissemination (bottom left) -->
  <g filter="url(#shadow)">
    <rect x="120" y="450" width="170" height="55" rx="10" ry="10" fill="url(#grad-5)" stroke="#30a060" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="120" y="450" width="170" height="55" rx="10" ry="10" fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.1"/>
    <circle cx="135" cy="465" r="10" fill="#104828" stroke="#30a060" stroke-width="0.5"/>
    <text x="135" y="469" text-anchor="middle" fill="white" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700">5</text>
    <text x="205" y="475" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600">Dissemination</text>
    <text x="205" y="493" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" opacity="0.75">Distribute to stakeholders</text>
  </g>

  <!-- Stage 6: Feedback (top left) -->
  <g filter="url(#shadow)">
    <rect x="120" y="190" width="170" height="55" rx="10" ry="10" fill="url(#grad-6)" stroke="#5a9030" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="120" y="190" width="170" height="55" rx="10" ry="10" fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.1"/>
    <circle cx="135" cy="205" r="10" fill="#1e3a0c" stroke="#5a9030" stroke-width="0.5"/>
    <text x="135" y="209" text-anchor="middle" fill="white" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700">6</text>
    <text x="205" y="215" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600">Feedback</text>
    <text x="205" y="233" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" opacity="0.75">Refine &amp; improve</text>
  </g>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2">THE INTELLIGENCE CYCLE</text>
  <line x1="300" y1="48" x2="600" y2="48" stroke="#2a3a4a" stroke-width="1"/>
  <text x="450" y="665" text-anchor="middle" fill="#4a5568" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400">Threat Intelligence Framework - Continuous Process</text>
</svg>