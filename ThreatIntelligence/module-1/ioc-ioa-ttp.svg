<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <filter id="dropShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="50%" stop-color="#e6a817"/>
      <stop offset="100%" stop-color="#533483"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="iocHeaderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#c23152"/>
    </linearGradient>
    <linearGradient id="ioaHeaderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e6a817"/>
      <stop offset="100%" stop-color="#c48f10"/>
    </linearGradient>
    <linearGradient id="ttpHeaderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#533483"/>
      <stop offset="100%" stop-color="#42296a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bgGrad)" rx="0"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1c2333" stroke-width="0.5"/>
  </pattern>
  <rect width="900" height="600" fill="url(#grid)" opacity="0.4"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#e6edf3" letter-spacing="1">IOC vs IOA vs TTP</text>
  <line x1="320" y1="52" x2="580" y2="52" stroke="url(#arrowGrad)" stroke-width="2" opacity="0.6"/>

  <!-- ==================== COLUMN 1: IOC ==================== -->
  <g transform="translate(40, 72)">
    <!-- Card background -->
    <rect width="260" height="410" rx="10" fill="#151b25" stroke="#e94560" stroke-width="1.5" stroke-opacity="0.35" filter="url(#dropShadow)"/>

    <!-- Header bar -->
    <rect width="260" height="56" rx="10" fill="url(#iocHeaderGrad)"/>
    <rect y="46" width="260" height="10" fill="url(#iocHeaderGrad)"/>

    <!-- Icon: magnifying glass -->
    <circle cx="34" cy="28" r="10" fill="none" stroke="#fff" stroke-width="2"/>
    <line x1="41" y1="35" x2="48" y2="42" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Header text -->
    <text x="60" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">IOC</text>
    <text x="60" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#ffffff" opacity="0.9">Indicator of Compromise</text>

    <!-- Divider -->
    <line x1="20" y1="72" x2="240" y2="72" stroke="#e94560" stroke-width="0.5" opacity="0.3"/>

    <!-- Examples heading -->
    <text x="130" y="95" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#e94560" font-weight="600" letter-spacing="1.5" text-transform="uppercase">EXAMPLES</text>

    <!-- Example items -->
    <g transform="translate(20, 112)">
      <!-- IP Address -->
      <rect width="220" height="36" rx="6" fill="#1c2333" stroke="#e94560" stroke-width="0.5" stroke-opacity="0.25"/>
      <circle cx="18" cy="18" r="5" fill="#e94560" opacity="0.2"/>
      <circle cx="18" cy="18" r="2.5" fill="#e94560"/>
      <text x="32" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">IP Address</text>
      <text x="208" y="22" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#e94560" opacity="0.6">192.168.x.x</text>
    </g>

    <g transform="translate(20, 156)">
      <!-- File Hash -->
      <rect width="220" height="36" rx="6" fill="#1c2333" stroke="#e94560" stroke-width="0.5" stroke-opacity="0.25"/>
      <circle cx="18" cy="18" r="5" fill="#e94560" opacity="0.2"/>
      <circle cx="18" cy="18" r="2.5" fill="#e94560"/>
      <text x="32" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">File Hash</text>
      <text x="208" y="22" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#e94560" opacity="0.6">SHA256/MD5</text>
    </g>

    <g transform="translate(20, 200)">
      <!-- Domain -->
      <rect width="220" height="36" rx="6" fill="#1c2333" stroke="#e94560" stroke-width="0.5" stroke-opacity="0.25"/>
      <circle cx="18" cy="18" r="5" fill="#e94560" opacity="0.2"/>
      <circle cx="18" cy="18" r="2.5" fill="#e94560"/>
      <text x="32" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">Domain</text>
      <text x="208" y="22" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#e94560" opacity="0.6">evil.com</text>
    </g>

    <g transform="translate(20, 244)">
      <!-- URL -->
      <rect width="220" height="36" rx="6" fill="#1c2333" stroke="#e94560" stroke-width="0.5" stroke-opacity="0.25"/>
      <circle cx="18" cy="18" r="5" fill="#e94560" opacity="0.2"/>
      <circle cx="18" cy="18" r="2.5" fill="#e94560"/>
      <text x="32" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">URL</text>
      <text x="208" y="22" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#e94560" opacity="0.6">http://mal...</text>
    </g>

    <!-- Divider -->
    <line x1="20" y1="300" x2="240" y2="300" stroke="#e94560" stroke-width="0.5" opacity="0.3"/>

    <!-- Description label -->
    <rect x="15" y="315" width="230" height="44" rx="6" fill="#e94560" fill-opacity="0.07" stroke="#e94560" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="130" y="334" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#e94560" font-weight="600">Evidence of intrusion</text>
    <text x="130" y="350" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#8b949e">(what happened)</text>

    <!-- Reactive badge -->
    <rect x="85" y="374" width="90" height="22" rx="11" fill="#e94560" fill-opacity="0.12" stroke="#e94560" stroke-width="0.8"/>
    <text x="130" y="389" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#e94560" font-weight="600">REACTIVE</text>
  </g>

  <!-- ==================== COLUMN 2: IOA ==================== -->
  <g transform="translate(320, 72)">
    <!-- Card background -->
    <rect width="260" height="410" rx="10" fill="#151b25" stroke="#e6a817" stroke-width="1.5" stroke-opacity="0.35" filter="url(#dropShadow)"/>

    <!-- Header bar -->
    <rect width="260" height="56" rx="10" fill="url(#ioaHeaderGrad)"/>
    <rect y="46" width="260" height="10" fill="url(#ioaHeaderGrad)"/>

    <!-- Icon: radar/activity -->
    <circle cx="34" cy="28" r="12" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
    <circle cx="34" cy="28" r="7" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
    <circle cx="34" cy="28" r="2.5" fill="#fff"/>
    <line x1="34" y1="28" x2="44" y2="18" stroke="#fff" stroke-width="1.5"/>

    <!-- Header text -->
    <text x="60" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">IOA</text>
    <text x="60" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#ffffff" opacity="0.9">Indicator of Attack</text>

    <!-- Divider -->
    <line x1="20" y1="72" x2="240" y2="72" stroke="#e6a817" stroke-width="0.5" opacity="0.3"/>

    <!-- Examples heading -->
    <text x="130" y="95" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#e6a817" font-weight="600" letter-spacing="1.5">EXAMPLES</text>

    <!-- Example items -->
    <g transform="translate(20, 112)">
      <rect width="220" height="36" rx="6" fill="#1c2333" stroke="#e6a817" stroke-width="0.5" stroke-opacity="0.25"/>
      <circle cx="18" cy="18" r="5" fill="#e6a817" opacity="0.2"/>
      <circle cx="18" cy="18" r="2.5" fill="#e6a817"/>
      <text x="32" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">Unusual Process</text>
    </g>

    <g transform="translate(20, 156)">
      <rect width="220" height="36" rx="6" fill="#1c2333" stroke="#e6a817" stroke-width="0.5" stroke-opacity="0.25"/>
      <circle cx="18" cy="18" r="5" fill="#e6a817" opacity="0.2"/>
      <circle cx="18" cy="18" r="2.5" fill="#e6a817"/>
      <text x="32" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">Behavior Anomaly</text>
    </g>

    <g transform="translate(20, 200)">
      <rect width="220" height="36" rx="6" fill="#1c2333" stroke="#e6a817" stroke-width="0.5" stroke-opacity="0.25"/>
      <circle cx="18" cy="18" r="5" fill="#e6a817" opacity="0.2"/>
      <circle cx="18" cy="18" r="2.5" fill="#e6a817"/>
      <text x="32" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">Lateral Movement</text>
    </g>

    <g transform="translate(20, 244)">
      <rect width="220" height="36" rx="6" fill="#1c2333" stroke="#e6a817" stroke-width="0.5" stroke-opacity="0.25"/>
      <circle cx="18" cy="18" r="5" fill="#e6a817" opacity="0.2"/>
      <circle cx="18" cy="18" r="2.5" fill="#e6a817"/>
      <text x="32" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">Privilege Escalation</text>
    </g>

    <!-- Divider -->
    <line x1="20" y1="300" x2="240" y2="300" stroke="#e6a817" stroke-width="0.5" opacity="0.3"/>

    <!-- Description label -->
    <rect x="15" y="315" width="230" height="44" rx="6" fill="#e6a817" fill-opacity="0.07" stroke="#e6a817" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="130" y="334" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#e6a817" font-weight="600">Attack in progress</text>
    <text x="130" y="350" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#8b949e">(what is happening)</text>

    <!-- Real-time badge -->
    <rect x="80" y="374" width="100" height="22" rx="11" fill="#e6a817" fill-opacity="0.12" stroke="#e6a817" stroke-width="0.8"/>
    <text x="130" y="389" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#e6a817" font-weight="600">REAL-TIME</text>
  </g>

  <!-- ==================== COLUMN 3: TTP ==================== -->
  <g transform="translate(600, 72)">
    <!-- Card background -->
    <rect width="260" height="410" rx="10" fill="#151b25" stroke="#533483" stroke-width="1.5" stroke-opacity="0.35" filter="url(#dropShadow)"/>

    <!-- Header bar -->
    <rect width="260" height="56" rx="10" fill="url(#ttpHeaderGrad)"/>
    <rect y="46" width="260" height="10" fill="url(#ttpHeaderGrad)"/>

    <!-- Icon: strategy/layers -->
    <rect x="22" y="18" width="24" height="4" rx="2" fill="#fff" opacity="0.5"/>
    <rect x="22" y="25" width="24" height="4" rx="2" fill="#fff" opacity="0.7"/>
    <rect x="22" y="32" width="24" height="4" rx="2" fill="#fff"/>

    <!-- Header text -->
    <text x="60" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">TTP</text>
    <text x="60" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#ffffff" opacity="0.9">Tactics, Techniques, Procedures</text>

    <!-- Divider -->
    <line x1="20" y1="72" x2="240" y2="72" stroke="#533483" stroke-width="0.5" opacity="0.3"/>

    <!-- Examples heading -->
    <text x="130" y="95" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#9b72cf" font-weight="600" letter-spacing="1.5">EXAMPLES</text>

    <!-- Example items -->
    <g transform="translate(20, 112)">
      <rect width="220" height="36" rx="6" fill="#1c2333" stroke="#533483" stroke-width="0.5" stroke-opacity="0.25"/>
      <circle cx="18" cy="18" r="5" fill="#533483" opacity="0.3"/>
      <circle cx="18" cy="18" r="2.5" fill="#9b72cf"/>
      <text x="32" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">Spearphishing</text>
    </g>

    <g transform="translate(20, 156)">
      <rect width="220" height="36" rx="6" fill="#1c2333" stroke="#533483" stroke-width="0.5" stroke-opacity="0.25"/>
      <circle cx="18" cy="18" r="5" fill="#533483" opacity="0.3"/>
      <circle cx="18" cy="18" r="2.5" fill="#9b72cf"/>
      <text x="32" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">DLL Sideloading</text>
    </g>

    <g transform="translate(20, 200)">
      <rect width="220" height="36" rx="6" fill="#1c2333" stroke="#533483" stroke-width="0.5" stroke-opacity="0.25"/>
      <circle cx="18" cy="18" r="5" fill="#533483" opacity="0.3"/>
      <circle cx="18" cy="18" r="2.5" fill="#9b72cf"/>
      <text x="32" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">Pass-the-Hash</text>
    </g>

    <g transform="translate(20, 244)">
      <rect width="220" height="36" rx="6" fill="#1c2333" stroke="#533483" stroke-width="0.5" stroke-opacity="0.25"/>
      <circle cx="18" cy="18" r="5" fill="#533483" opacity="0.3"/>
      <circle cx="18" cy="18" r="2.5" fill="#9b72cf"/>
      <text x="32" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">Living off the Land</text>
    </g>

    <!-- Divider -->
    <line x1="20" y1="300" x2="240" y2="300" stroke="#533483" stroke-width="0.5" opacity="0.3"/>

    <!-- Description label -->
    <rect x="15" y="315" width="230" height="44" rx="6" fill="#533483" fill-opacity="0.1" stroke="#533483" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="130" y="334" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#9b72cf" font-weight="600">Adversary methodology</text>
    <text x="130" y="350" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#8b949e">(how they operate)</text>

    <!-- Proactive badge -->
    <rect x="80" y="374" width="100" height="22" rx="11" fill="#533483" fill-opacity="0.15" stroke="#9b72cf" stroke-width="0.8"/>
    <text x="130" y="389" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#9b72cf" font-weight="600">PROACTIVE</text>
  </g>

  <!-- ==================== BOTTOM ARROW ==================== -->
  <g transform="translate(0, 510)">
    <!-- Arrow background bar -->
    <rect x="60" y="18" width="780" height="6" rx="3" fill="url(#arrowGrad)" opacity="0.25"/>

    <!-- Gradient arrow line -->
    <line x1="80" y1="21" x2="820" y2="21" stroke="url(#arrowGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Arrow start dot -->
    <circle cx="80" cy="21" r="5" fill="#e94560"/>

    <!-- Arrowhead -->
    <polygon points="820,21 806,14 806,28" fill="#533483"/>

    <!-- Label -->
    <text x="450" y="12" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8b949e" font-weight="600" letter-spacing="2">INCREASING DEFENSIVE VALUE</text>

    <!-- Directional sublabels -->
    <text x="80" y="48" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#e94560" opacity="0.7">Short-lived</text>
    <text x="450" y="48" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#e6a817" opacity="0.7">Behavioral</text>
    <text x="820" y="48" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#9b72cf" opacity="0.7">Strategic</text>
  </g>

  <!-- Connecting arrows between columns -->
  <g opacity="0.3">
    <!-- IOC to IOA -->
    <line x1="305" y1="280" x2="315" y2="280" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="3,3"/>
    <polygon points="318,280 312,276 312,284" fill="#8b949e"/>

    <!-- IOA to TTP -->
    <line x1="585" y1="280" x2="595" y2="280" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="3,3"/>
    <polygon points="598,280 592,276 592,284" fill="#8b949e"/>
  </g>

  <!-- Footer watermark -->
  <text x="450" y="588" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#30363d">Threat Intelligence Fundamentals</text>
</svg>