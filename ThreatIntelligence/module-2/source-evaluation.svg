<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="titleBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1f6feb"/>
      <stop offset="100%" style="stop-color:#238636"/>
    </linearGradient>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#21262d" stroke-width="0.5"/>
  </pattern>
  <rect width="900" height="600" fill="url(#gridPattern)" opacity="0.3"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="56" fill="url(#titleBar)" opacity="0.9"/>
  <text x="450" y="36" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="1">Source Evaluation Matrix (Admiralty System)</text>

  <!-- Table configuration -->
  <!-- Row labels column: x=30, width=200 -->
  <!-- Data columns: 6 columns, each width=105, starting at x=230 -->
  <!-- Header row: y=80, height=55 -->
  <!-- Data rows: 6 rows, each height=62, starting at y=135 -->

  <!-- Column Headers Background -->
  <rect x="230" y="80" width="105" height="55" rx="0" fill="#1a2332" stroke="#30363d" stroke-width="1"/>
