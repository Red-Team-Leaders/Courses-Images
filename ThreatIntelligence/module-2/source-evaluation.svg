  <rect x="650" y="80" width="105" height="55" rx="0" fill="#1a2332" stroke="#30363d" stroke-width="1"/>
  <rect x="755" y="80" width="105" height="55" rx="0" fill="#1a2332" stroke="#30363d" stroke-width="1"/>

