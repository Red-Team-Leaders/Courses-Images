<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="spectrumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d5016"/>
      <stop offset="50%" stop-color="#e6a817"/>
      <stop offset="100%" stop-color="#e94560"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="barGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
    <clipPath id="barClip">
      <rect x="100" y="230" width="700" height="36" rx="18"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="100" x2="900" y2="100" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="200" x2="900" y2="200" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="300" x2="900" y2="300" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="400" x2="900" y2="400" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="500" x2="900" y2="500" stroke="#ffffff" stroke-width="1"/>
    <line x1="150" y1="0" x2="150" y2="600" stroke="#ffffff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="600" stroke="#ffffff" stroke-width="1"/>
    <line x1="450" y1="0" x2="450" y2="600" stroke="#ffffff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="600" stroke="#ffffff" stroke-width="1"/>
    <line x1="750" y1="0" x2="750" y2="600" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Top decorative line -->
  <rect x="50" y="30" width="800" height="1" fill="url(#spectrumGrad)" opacity="0.4"/>

  <!-- Title -->
  <text x="450" y="72" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#e6edf3" letter-spacing="1">Attribution Confidence Levels</text>

  <!-- Subtitle -->
  <text x="450" y="100" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8b949e" letter-spacing="2">THREAT INTELLIGENCE ASSESSMENT FRAMEWORK</text>

  <!-- Decorative line under subtitle -->
  <rect x="300" y="115" width="300" height="1" fill="#30363d"/>

  <!-- Scale Labels above bar -->
  <text x="200" y="210" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#4ade80" filter="url(#glow)">LOW CONFIDENCE</text>
  <text x="450" y="210" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#e6a817" filter="url(#glow)">MEDIUM CONFIDENCE</text>
  <text x="700" y="210" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#e94560" filter="url(#glow)">HIGH CONFIDENCE</text>

  <!-- Gradient Bar Background Shadow -->
  <rect x="100" y="232" width="700" height="36" rx="18" fill="rgba(0,0,0,0.4)"/>

  <!-- Main Gradient Bar -->
  <rect x="100" y="230" width="700" height="36" rx="18" fill="url(#spectrumGrad)" filter="url(#dropShadow)"/>

  <!-- Bar highlight overlay -->
  <rect x="100" y="230" width="700" height="18" rx="18" fill="url(#barGlow)" clip-path="url(#barClip)"/>

  <!-- Bar border -->
  <rect x="100" y="230" width="700" height="36" rx="18" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Tick marks on bar -->
  <line x1="333" y1="226" x2="333" y2="270" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="567" y1="226" x2="567" y2="270" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Arrow pointer indicators -->
  <polygon points="200,224 206,216 194,216" fill="#4ade80" opacity="0.7"/>
  <polygon points="450,224 456,216 444,216" fill="#e6a817" opacity="0.7"/>
  <polygon points="700,224 706,216 694,216" fill="#e94560" opacity="0.7"/>

  <!-- LOW CONFIDENCE Section -->
  <g>
    <!-- Card background -->
    <rect x="80" y="290" width="240" height="170" rx="12" fill="#0d1117" stroke="#2d5016" stroke-width="1.5" opacity="0.9"/>
    <rect x="80" y="290" width="240" height="4" rx="2" fill="#2d5016"/>

    <!-- Icon: question mark circle -->
    <circle cx="120" cy="325" r="14" fill="none" stroke="#4ade80" stroke-width="1.5" opacity="0.6"/>
    <text x="120" y="331" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#4ade80" opacity="0.6">?</text>

    <text x="142" y="330" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#4ade80">Indicators</text>

    <!-- Bullet items -->
    <circle cx="105" cy="365" r="3" fill="#2d5016"/>
    <text x="118" y="370" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">Shared infrastructure</text>

    <circle cx="105" cy="395" r="3" fill="#2d5016"/>
    <text x="118" y="400" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">Common malware</text>

    <circle cx="105" cy="425" r="3" fill="#2d5016"/>
    <text x="118" y="430" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">Similar TTPs</text>
  </g>

  <!-- MEDIUM CONFIDENCE Section -->
  <g>
    <!-- Card background -->
    <rect x="335" y="290" width="240" height="170" rx="12" fill="#0d1117" stroke="#e6a817" stroke-width="1.5" opacity="0.9"/>
    <rect x="335" y="290" width="240" height="4" rx="2" fill="#e6a817"/>

    <!-- Icon: magnifying glass -->
    <circle cx="373" cy="322" r="10" fill="none" stroke="#e6a817" stroke-width="1.5" opacity="0.6"/>
    <line x1="381" y1="330" x2="388" y2="337" stroke="#e6a817" stroke-width="1.5" opacity="0.6"/>

    <text x="395" y="330" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#e6a817">Indicators</text>

    <!-- Bullet items -->
    <circle cx="360" cy="365" r="3" fill="#e6a817"/>
    <text x="373" y="370" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">Unique tooling</text>

    <circle cx="360" cy="395" r="3" fill="#e6a817"/>
    <text x="373" y="400" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">Consistent targeting</text>

    <circle cx="360" cy="425" r="3" fill="#e6a817"/>
    <text x="373" y="430" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">Code overlap</text>
  </g>

  <!-- HIGH CONFIDENCE Section -->
  <g>
    <!-- Card background -->
    <rect x="590" y="290" width="240" height="170" rx="12" fill="#0d1117" stroke="#e94560" stroke-width="1.5" opacity="0.9"/>
    <rect x="590" y="290" width="240" height="4" rx="2" fill="#e94560"/>

    <!-- Icon: target/crosshair -->
    <circle cx="628" cy="325" r="12" fill="none" stroke="#e94560" stroke-width="1.5" opacity="0.6"/>
    <circle cx="628" cy="325" r="5" fill="none" stroke="#e94560" stroke-width="1.5" opacity="0.6"/>
    <circle cx="628" cy="325" r="1.5" fill="#e94560" opacity="0.6"/>

    <text x="648" y="330" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#e94560">Indicators</text>

    <!-- Bullet items -->
    <circle cx="615" cy="365" r="3" fill="#e94560"/>
    <text x="628" y="370" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">SIGINT correlation</text>

    <circle cx="615" cy="395" r="3" fill="#e94560"/>
    <text x="628" y="400" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">Human intelligence</text>

    <circle cx="615" cy="425" r="3" fill="#e94560"/>
    <text x="628" y="430" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">Operational overlap</text>
  </g>

  <!-- Connecting lines from bar to cards -->
  <line x1="200" y1="266" x2="200" y2="290" stroke="#2d5016" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="450" y1="266" x2="455" y2="290" stroke="#e6a817" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="700" y1="266" x2="710" y2="290" stroke="#e94560" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Warning Note Box -->
  <rect x="200" y="495" width="500" height="50" rx="10" fill="#161b22" stroke="#e6a817" stroke-width="1" stroke-dasharray="6,3" opacity="0.9"/>

  <!-- Warning icon (triangle) -->
  <polygon points="232,510 222,530 242,530" fill="none" stroke="#e6a817" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="232" y="527" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#e6a817">!</text>

  <text x="260" y="525" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#e6a817">Attribution is probabilistic, not deterministic</text>

  <!-- Bottom decorative line -->
  <rect x="50" y="565" width="800" height="1" fill="url(#spectrumGrad)" opacity="0.3"/>

  <!-- Footer -->
  <text x="450" y="585" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#484f58" letter-spacing="1">THREAT INTELLIGENCE -- MODULE 3 -- ATTRIBUTION ANALYSIS</text>
</svg>