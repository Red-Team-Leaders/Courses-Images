<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="sigmaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:0.03"/>
    </linearGradient>
    <linearGradient id="yaraGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#e94560;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#c678dd"/>
      <stop offset="80%" style="stop-color:#0f3460;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="ruleBoxShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.04"/>
  </pattern>
  <rect width="900" height="600" fill="url(#grid)"/>

  <!-- Title bar background -->
  <rect x="0" y="0" width="900" height="70" fill="#0d1117" opacity="0.6"/>
  <line x1="0" y1="70" x2="900" y2="70" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" letter-spacing="1">Sigma &amp; YARA: Detection Languages</text>
  <text x="450" y="55" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8b949e" letter-spacing="2">THREAT DETECTION ENGINEERING</text>

  <!-- ==================== LEFT PANEL: SIGMA ==================== -->
  <!-- Panel background -->
  <rect x="25" y="85" width="400" height="495" rx="10" fill="url(#sigmaGrad)" stroke="#e94560" stroke-width="1" stroke-opacity="0.3" filter="url(#softShadow)"/>

  <!-- Sigma header -->
  <text x="225" y="118" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="bold" fill="#e94560" filter="url(#glow)">Sigma Rules</text>
  <text x="225" y="140" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8b949e">Log-based detection</text>

  <!-- Sigma feature badges -->
  <rect x="65" y="155" width="130" height="28" rx="14" fill="#e94560" fill-opacity="0.12" stroke="#e94560" stroke-width="1" stroke-opacity="0.4"/>
  <text x="130" y="174" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#e94560">SIEM-agnostic</text>

  <rect x="210" y="155" width="130" height="28" rx="14" fill="#e94560" fill-opacity="0.12" stroke="#e94560" stroke-width="1" stroke-opacity="0.4"/>
  <text x="275" y="174" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#e94560">YAML format</text>

  <!-- Sigma rule box -->
  <rect x="50" y="198" width="350" height="365" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" filter="url(#ruleBoxShadow)"/>

  <!-- Rule box title bar -->
  <rect x="50" y="198" width="350" height="30" rx="6" fill="#1c2128"/>
  <rect x="50" y="218" width="350" height="10" fill="#1c2128"/>
  <!-- Window dots -->
  <circle cx="68" cy="213" r="5" fill="#e94560" opacity="0.8"/>
  <circle cx="84" cy="213" r="5" fill="#f0a500" opacity="0.8"/>
  <circle cx="100" cy="213" r="5" fill="#4ec9b0" opacity="0.8"/>
  <text x="225" y="218" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">sigma_rule.yml</text>

  <!-- Sigma rule content -->
  <!-- title field -->
  <text x="65" y="252" font-family="'Courier New', monospace" font-size="12" fill="#c678dd">title</text>
  <text x="95" y="252" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">:</text>
  <text x="105" y="252" font-family="'Courier New', monospace" font-size="12" fill="#98c379">Suspicious PowerShell Exec</text>

  <!-- status -->
  <text x="65" y="274" font-family="'Courier New', monospace" font-size="12" fill="#c678dd">status</text>
  <text x="107" y="274" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">:</text>
  <text x="117" y="274" font-family="'Courier New', monospace" font-size="12" fill="#98c379">experimental</text>

  <!-- level -->
  <text x="65" y="296" font-family="'Courier New', monospace" font-size="12" fill="#c678dd">level</text>
  <text x="102" y="296" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">:</text>
  <text x="112" y="296" font-family="'Courier New', monospace" font-size="12" fill="#f0a500">high</text>

  <!-- Separator line -->
  <line x1="65" y1="308" x2="385" y2="308" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- logsource section -->
  <text x="65" y="328" font-family="'Courier New', monospace" font-size="12" fill="#c678dd">logsource</text>
  <text x="137" y="328" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">:</text>
  <text x="80" y="348" font-family="'Courier New', monospace" font-size="12" fill="#61afef">category</text>
  <text x="144" y="348" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">:</text>
  <text x="154" y="348" font-family="'Courier New', monospace" font-size="12" fill="#98c379">process_creation</text>
  <text x="80" y="368" font-family="'Courier New', monospace" font-size="12" fill="#61afef">product</text>
  <text x="137" y="368" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">:</text>
  <text x="147" y="368" font-family="'Courier New', monospace" font-size="12" fill="#98c379">windows</text>

  <!-- Separator line -->
  <line x1="65" y1="380" x2="385" y2="380" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- detection section -->
  <text x="65" y="400" font-family="'Courier New', monospace" font-size="12" fill="#c678dd">detection</text>
  <text x="137" y="400" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">:</text>
  <text x="80" y="420" font-family="'Courier New', monospace" font-size="12" fill="#61afef">selection</text>
  <text x="152" y="420" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">:</text>
  <text x="95" y="440" font-family="'Courier New', monospace" font-size="12" fill="#56b6c2">Image|endswith</text>
  <text x="200" y="440" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">:</text>
  <text x="210" y="440" font-family="'Courier New', monospace" font-size="12" fill="#98c379">'\powershell.exe'</text>
  <text x="95" y="460" font-family="'Courier New', monospace" font-size="12" fill="#56b6c2">CommandLine|contains</text>
  <text x="250" y="460" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">:</text>
  <text x="110" y="480" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">-</text>
  <text x="125" y="480" font-family="'Courier New', monospace" font-size="12" fill="#98c379">'-enc'</text>
  <text x="110" y="500" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">-</text>
  <text x="125" y="500" font-family="'Courier New', monospace" font-size="12" fill="#98c379">'-nop'</text>

  <!-- Separator line -->
  <line x1="65" y1="512" x2="385" y2="512" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- condition -->
  <text x="80" y="532" font-family="'Courier New', monospace" font-size="12" fill="#c678dd">condition</text>
  <text x="152" y="532" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">:</text>
  <text x="162" y="532" font-family="'Courier New', monospace" font-size="12" fill="#e06c75">selection</text>

  <!-- Field labels on the left side -->
  <rect x="55" y="240" width="4" height="52" rx="2" fill="#e94560" opacity="0.5"/>
  <rect x="55" y="316" width="4" height="58" rx="2" fill="#61afef" opacity="0.5"/>
  <rect x="55" y="388" width="4" height="120" rx="2" fill="#c678dd" opacity="0.5"/>
  <rect x="55" y="520" width="4" height="20" rx="2" fill="#e06c75" opacity="0.5"/>

  <!-- ==================== CENTER DIVIDER ==================== -->
  <line x1="450" y1="100" x2="450" y2="560" stroke="url(#dividerGrad)" stroke-width="2"/>

  <!-- Complementary Detection label -->
  <rect x="412" y="290" width="76" height="80" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="450" y="315" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="bold" fill="#c678dd" letter-spacing="1">COMPLE-</text>
  <text x="450" y="328" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="bold" fill="#c678dd" letter-spacing="1">MENTARY</text>
  <text x="450" y="348" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="bold" fill="#c678dd" letter-spacing="1">DETECTION</text>

  <!-- Arrows pointing inward -->
  <path d="M430 310 L420 320 L430 330" fill="none" stroke="#e94560" stroke-width="1.5" opacity="0.6"/>
  <path d="M470 310 L480 320 L470 330" fill="none" stroke="#0f3460" stroke-width="1.5" opacity="0.6"/>

  <!-- ==================== RIGHT PANEL: YARA ==================== -->
  <!-- Panel background -->
  <rect x="475" y="85" width="400" height="495" rx="10" fill="url(#yaraGrad)" stroke="#0f3460" stroke-width="1" stroke-opacity="0.5" filter="url(#softShadow)"/>

  <!-- YARA header -->
  <text x="675" y="118" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="bold" fill="#4fa3e0" filter="url(#glow)">YARA Rules</text>
  <text x="675" y="140" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8b949e">File / artifact scanning</text>

  <!-- YARA feature badges -->
  <rect x="515" y="155" width="140" height="28" rx="14" fill="#0f3460" fill-opacity="0.3" stroke="#4fa3e0" stroke-width="1" stroke-opacity="0.4"/>
  <text x="585" y="174" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#4fa3e0">Pattern matching</text>

  <rect x="670" y="155" width="140" height="28" rx="14" fill="#0f3460" fill-opacity="0.3" stroke="#4fa3e0" stroke-width="1" stroke-opacity="0.4"/>
  <text x="740" y="174" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#4fa3e0">Binary analysis</text>

  <!-- YARA rule box -->
  <rect x="500" y="198" width="350" height="365" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" filter="url(#ruleBoxShadow)"/>

  <!-- Rule box title bar -->
  <rect x="500" y="198" width="350" height="30" rx="6" fill="#1c2128"/>
  <rect x="500" y="218" width="350" height="10" fill="#1c2128"/>
  <!-- Window dots -->
  <circle cx="518" cy="213" r="5" fill="#e94560" opacity="0.8"/>
  <circle cx="534" cy="213" r="5" fill="#f0a500" opacity="0.8"/>
  <circle cx="550" cy="213" r="5" fill="#4ec9b0" opacity="0.8"/>
  <text x="675" y="218" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">detect_malware.yar</text>

  <!-- YARA rule content -->
  <!-- rule declaration -->
  <text x="515" y="252" font-family="'Courier New', monospace" font-size="12" fill="#c678dd">rule</text>
  <text x="548" y="252" font-family="'Courier New', monospace" font-size="12" fill="#e06c75">Detect_Cobalt_Strike</text>
  <text x="700" y="252" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">{</text>

  <!-- meta section -->
  <text x="530" y="278" font-family="'Courier New', monospace" font-size="12" fill="#c678dd">meta</text>
  <text x="558" y="278" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">:</text>
  <text x="545" y="298" font-family="'Courier New', monospace" font-size="12" fill="#61afef">author</text>
  <text x="593" y="298" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">=</text>
  <text x="605" y="298" font-family="'Courier New', monospace" font-size="12" fill="#98c379">"ThreatIntel Team"</text>
  <text x="545" y="318" font-family="'Courier New', monospace" font-size="12" fill="#61afef">severity</text>
  <text x="609" y="318" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">=</text>
  <text x="621" y="318" font-family="'Courier New', monospace" font-size="12" fill="#98c379">"critical"</text>

  <!-- Separator line -->
  <line x1="515" y1="330" x2="835" y2="330" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- strings section -->
  <text x="530" y="350" font-family="'Courier New', monospace" font-size="12" fill="#c678dd">strings</text>
  <text x="572" y="350" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">:</text>
  <text x="545" y="374" font-family="'Courier New', monospace" font-size="12" fill="#56b6c2">$beacon</text>
  <text x="601" y="374" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">=</text>
  <text x="613" y="374" font-family="'Courier New', monospace" font-size="12" fill="#98c379">"ReflectiveLoader"</text>
  <text x="545" y="398" font-family="'Courier New', monospace" font-size="12" fill="#56b6c2">$config</text>
  <text x="601" y="398" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">=</text>
  <text x="613" y="398" font-family="'Courier New', monospace" font-size="12" fill="#f0a500">{</text>
  <text x="625" y="398" font-family="'Courier New', monospace" font-size="12" fill="#e06c75">4D 5A 90 00</text>
  <text x="723" y="398" font-family="'Courier New', monospace" font-size="12" fill="#f0a500">}</text>
  <text x="545" y="422" font-family="'Courier New', monospace" font-size="12" fill="#56b6c2">$pipe</text>
  <text x="581" y="422" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">=</text>
  <text x="593" y="422" font-family="'Courier New', monospace" font-size="12" fill="#98c379">"\\.\pipe\msagent"</text>
  <text x="545" y="446" font-family="'Courier New', monospace" font-size="12" fill="#56b6c2">$sleep</text>
  <text x="588" y="446" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">=</text>
  <text x="600" y="446" font-family="'Courier New', monospace" font-size="12" fill="#98c379">"SleepEx"</text>
  <text x="665" y="446" font-family="'Courier New', monospace" font-size="12" fill="#c678dd">wide ascii</text>

  <!-- Separator line -->
  <line x1="515" y1="458" x2="835" y2="458" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- condition section -->
  <text x="530" y="480" font-family="'Courier New', monospace" font-size="12" fill="#c678dd">condition</text>
  <text x="600" y="480" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">:</text>
  <text x="545" y="502" font-family="'Courier New', monospace" font-size="12" fill="#56b6c2">uint16</text>
  <text x="588" y="502" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">(</text>
  <text x="596" y="502" font-family="'Courier New', monospace" font-size="12" fill="#d19a66">0</text>
  <text x="604" y="502" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">)</text>
  <text x="614" y="502" font-family="'Courier New', monospace" font-size="12" fill="#c678dd">==</text>
  <text x="632" y="502" font-family="'Courier New', monospace" font-size="12" fill="#d19a66">0x5A4D</text>
  <text x="680" y="502" font-family="'Courier New', monospace" font-size="12" fill="#c678dd">and</text>
  <text x="545" y="522" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">(</text>
  <text x="553" y="522" font-family="'Courier New', monospace" font-size="12" fill="#56b6c2">$beacon</text>
  <text x="609" y="522" font-family="'Courier New', monospace" font-size="12" fill="#c678dd">or</text>
  <text x="628" y="522" font-family="'Courier New', monospace" font-size="12" fill="#56b6c2">$config</text>
  <text x="684" y="522" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">)</text>
  <text x="694" y="522" font-family="'Courier New', monospace" font-size="12" fill="#c678dd">and</text>
  <text x="545" y="542" font-family="'Courier New', monospace" font-size="12" fill="#d19a66">2</text>
  <text x="555" y="542" font-family="'Courier New', monospace" font-size="12" fill="#c678dd">of</text>
  <text x="574" y="542" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">(</text>
  <text x="582" y="542" font-family="'Courier New', monospace" font-size="12" fill="#56b6c2">$pipe</text>
  <text x="618" y="542" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">,</text>
  <text x="628" y="542" font-family="'Courier New', monospace" font-size="12" fill="#56b6c2">$sleep</text>
  <text x="671" y="542" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">)</text>

  <!-- Closing brace -->
  <text x="515" y="558" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">}</text>

  <!-- Field indicator bars for YARA -->
  <rect x="505" y="240" width="4" height="82" rx="2" fill="#e06c75" opacity="0.5"/>
  <rect x="505" y="338" width="4" height="124" rx="2" fill="#56b6c2" opacity="0.5"/>
  <rect x="505" y="468" width="4" height="80" rx="2" fill="#c678dd" opacity="0.5"/>

  <!-- Bottom accent line -->
  <rect x="0" y="594" width="900" height="6" fill="url(#dividerGrad)" opacity="0.4"/>
</svg>