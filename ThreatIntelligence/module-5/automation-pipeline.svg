<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151b23"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="pipeGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#e6a817" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2d5016" stop-opacity="0.15"/>
    </linearGradient>
    <!-- Stage gradients -->
    <linearGradient id="grad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#c23152"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f3460"/>
      <stop offset="100%" stop-color="#0a264a"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#533483"/>
      <stop offset="100%" stop-color="#3f266a"/>
    </linearGradient>
    <linearGradient id="grad4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6a817"/>
      <stop offset="100%" stop-color="#c48f12"/>
    </linearGradient>
    <linearGradient id="grad5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a6b3c"/>
      <stop offset="100%" stop-color="#14542f"/>
    </linearGradient>
    <linearGradient id="grad6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d5016"/>
      <stop offset="100%" stop-color="#223d10"/>
    </linearGradient>
    <!-- Arrow marker -->
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff" opacity="0.9"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="100" x2="900" y2="100" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="900" y2="200" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="900" y2="300" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="900" y2="400" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="900" y2="500" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="150" y1="0" x2="150" y2="600" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="600" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="450" y1="0" x2="450" y2="600" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="600" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="750" y1="0" x2="750" y2="600" stroke="#58a6ff" stroke-width="0.5"/>
  </g>

  <!-- Title -->
  <text x="450" y="52" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" filter="url(#glow)">CTI Automation Pipeline</text>
  <text x="450" y="78" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8b949e" letter-spacing="3">END-TO-END THREAT INTELLIGENCE WORKFLOW</text>

  <!-- Horizontal flow line behind segments -->
  <rect x="40" y="248" width="820" height="104" rx="52" fill="url(#pipeGlow)" stroke="#21262d" stroke-width="1"/>

  <!-- Connection arrows between segments -->
  <!-- Arrow 1-2 -->
  <line x1="155" y1="300" x2="175" y2="300" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowHead)" opacity="0.7"/>
  <!-- Arrow 2-3 -->
  <line x1="295" y1="300" x2="315" y2="300" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowHead)" opacity="0.7"/>
  <!-- Arrow 3-4 -->
  <line x1="435" y1="300" x2="455" y2="300" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowHead)" opacity="0.7"/>
  <!-- Arrow 4-5 -->
  <line x1="575" y1="300" x2="595" y2="300" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowHead)" opacity="0.7"/>
  <!-- Arrow 5-6 -->
  <line x1="715" y1="300" x2="735" y2="300" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowHead)" opacity="0.7"/>

  <!-- Data flow particles (animated dots on the arrows) -->
  <circle r="3" fill="#58a6ff" opacity="0.8">
    <animateMotion dur="6s" repeatCount="indefinite" path="M60,300 L860,300"/>
  </circle>
  <circle r="2.5" fill="#58a6ff" opacity="0.5">
    <animateMotion dur="6s" repeatCount="indefinite" path="M60,300 L860,300" begin="2s"/>
  </circle>
  <circle r="2" fill="#58a6ff" opacity="0.4">
    <animateMotion dur="6s" repeatCount="indefinite" path="M60,300 L860,300" begin="4s"/>
  </circle>

  <!-- Stage 1: Ingest -->
  <g filter="url(#softShadow)">
    <rect x="48" y="245" width="110" height="110" rx="12" fill="url(#grad1)" stroke="#e94560" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Icon: download arrow -->
    <g transform="translate(103,272)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0,-8 L0,8"/>
      <path d="M-6,2 L0,8 L6,2"/>
      <line x1="-8" y1="12" x2="8" y2="12"/>
    </g>
    <text x="103" y="310" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Ingest</text>
    <text x="103" y="328" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#ffffff" opacity="0.8">Feeds, APIs,</text>
    <text x="103" y="340" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#ffffff" opacity="0.8">Reports</text>
  </g>

  <!-- Stage 2: Normalize -->
  <g filter="url(#softShadow)">
    <rect x="188" y="245" width="110" height="110" rx="12" fill="url(#grad2)" stroke="#0f3460" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Icon: parallel lines (formatting) -->
    <g transform="translate(243,272)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
      <line x1="-8" y1="-6" x2="8" y2="-6"/>
      <line x1="-8" y1="0" x2="8" y2="0"/>
      <line x1="-8" y1="6" x2="4" y2="6"/>
    </g>
    <text x="243" y="310" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Normalize</text>
    <text x="243" y="328" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#ffffff" opacity="0.8">STIX formatting,</text>
    <text x="243" y="340" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#ffffff" opacity="0.8">dedup</text>
  </g>

  <!-- Stage 3: Enrich -->
  <g filter="url(#softShadow)">
    <rect x="328" y="245" width="110" height="110" rx="12" fill="url(#grad3)" stroke="#533483" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Icon: magnifier with plus -->
    <g transform="translate(383,272)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
      <circle cx="-2" cy="-2" r="7"/>
      <line x1="3" y1="3" x2="8" y2="8"/>
      <line x1="-5" y1="-2" x2="1" y2="-2"/>
      <line x1="-2" y1="-5" x2="-2" y2="1"/>
    </g>
    <text x="383" y="310" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Enrich</text>
    <text x="383" y="328" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#ffffff" opacity="0.8">VT, Shodan,</text>
    <text x="383" y="340" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#ffffff" opacity="0.8">WHOIS</text>
  </g>

  <!-- Stage 4: Analyze -->
  <g filter="url(#softShadow)">
    <rect x="468" y="245" width="110" height="110" rx="12" fill="url(#grad4)" stroke="#e6a817" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Icon: bar chart -->
    <g transform="translate(523,272)" fill="#ffffff" opacity="0.95">
      <rect x="-9" y="2" width="4" height="10" rx="1"/>
      <rect x="-3" y="-4" width="4" height="16" rx="1"/>
      <rect x="3" y="-8" width="4" height="20" rx="1"/>
    </g>
    <text x="523" y="310" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Analyze</text>
    <text x="523" y="328" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#ffffff" opacity="0.8">Scoring,</text>
    <text x="523" y="340" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#ffffff" opacity="0.8">correlation</text>
  </g>

  <!-- Stage 5: Disseminate -->
  <g filter="url(#softShadow)">
    <rect x="608" y="245" width="110" height="110" rx="12" fill="url(#grad5)" stroke="#1a6b3c" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Icon: broadcast / share -->
    <g transform="translate(663,270)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
      <path d="M-7,-10 A14,14 0 0,1 -7,10" opacity="0.5"/>
      <path d="M-4,-6 A9,9 0 0,1 -4,6" opacity="0.75"/>
      <line x1="2" y1="-2" x2="8" y2="-8"/>
      <line x1="2" y1="2" x2="8" y2="8"/>
      <line x1="3" y1="0" x2="10" y2="0"/>
    </g>
    <text x="663" y="310" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Disseminate</text>
    <text x="663" y="328" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#ffffff" opacity="0.8">SIEM, TIP,</text>
    <text x="663" y="340" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#ffffff" opacity="0.8">Alerts</text>
  </g>

  <!-- Stage 6: Measure -->
  <g filter="url(#softShadow)">
    <rect x="748" y="245" width="110" height="110" rx="12" fill="url(#grad6)" stroke="#2d5016" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Icon: gauge / speedometer -->
    <g transform="translate(803,270)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
      <path d="M-10,4 A12,12 0 1,1 10,4"/>
      <line x1="0" y1="2" x2="4" y2="-6" stroke-width="2.5"/>
      <circle cx="0" cy="2" r="2" fill="#ffffff"/>
    </g>
    <text x="803" y="310" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Measure</text>
    <text x="803" y="328" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#ffffff" opacity="0.8">Metrics,</text>
    <text x="803" y="340" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#ffffff" opacity="0.8">feedback</text>
  </g>

  <!-- Step numbers -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d1117">
    <circle cx="60" cy="240" r="10" fill="#e94560" opacity="0.9"/>
    <text x="60" y="244" text-anchor="middle" fill="#ffffff" font-size="10">1</text>
    <circle cx="200" cy="240" r="10" fill="#0f3460" opacity="0.9"/>
    <text x="200" y="244" text-anchor="middle" fill="#ffffff" font-size="10">2</text>
    <circle cx="340" cy="240" r="10" fill="#533483" opacity="0.9"/>
    <text x="340" y="244" text-anchor="middle" fill="#ffffff" font-size="10">3</text>
    <circle cx="480" cy="240" r="10" fill="#e6a817" opacity="0.9"/>
    <text x="480" y="244" text-anchor="middle" fill="#ffffff" font-size="10">4</text>
    <circle cx="620" cy="240" r="10" fill="#1a6b3c" opacity="0.9"/>
    <text x="620" y="244" text-anchor="middle" fill="#ffffff" font-size="10">5</text>
    <circle cx="760" cy="240" r="10" fill="#2d5016" opacity="0.9"/>
    <text x="760" y="244" text-anchor="middle" fill="#ffffff" font-size="10">6</text>
  </g>

  <!-- Feedback loop arrow (Measure back to Ingest) -->
  <g opacity="0.5">
    <path d="M803,362 L803,420 Q803,440 783,440 L120,440 Q100,440 100,420 L100,362" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowHead)"/>
    <text x="450" y="458" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#58a6ff" opacity="0.8">Continuous Feedback Loop</text>
  </g>

  <!-- Orchestration label -->
  <rect x="300" y="490" width="300" height="44" rx="22" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <g transform="translate(340,516)" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <rect x="-6" y="-6" width="12" height="12" rx="2"/>
    <line x1="-2" y1="0" x2="4" y2="0"/>
    <line x1="1" y1="-3" x2="1" y2="3"/>
  </g>
  <text x="460" y="517" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#c9d1d9" font-weight="600" letter-spacing="1">Python / n8n / SOAR</text>

  <!-- Bottom decorative line -->
  <line x1="100" y1="565" x2="800" y2="565" stroke="#21262d" stroke-width="1"/>
  <text x="450" y="585" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#484f58" letter-spacing="2">AUTOMATED THREAT INTELLIGENCE LIFECYCLE</text>
</svg>