    <text x="280.0" y="442" text-anchor="middle" fill="#9da7b3" font-size="21">derive • verify • preserve</text>
    <text x="280.0" y="482" text-anchor="middle" fill="#e11d2a" font-size="19">TARGET-MATCHED EVIDENCE</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="600" y="305" width="400" height="220" rx="22" fill="url(#panel)" stroke="#e11d2a" stroke-width="3"/>
    <text x="800.0" y="393" text-anchor="middle" fill="#f0f6fc" font-size="30" font-weight="700">CONTEXT RECORD</text>
    <text x="800.0" y="442" text-anchor="middle" fill="#9da7b3" font-size="21">derive • verify • preserve</text>
    <text x="800.0" y="482" text-anchor="middle" fill="#e11d2a" font-size="19">TARGET-MATCHED EVIDENCE</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1120" y="305" width="400" height="220" rx="22" fill="url(#panel)" stroke="#e11d2a" stroke-width="3"/>
    <text x="1320.0" y="393" text-anchor="middle" fill="#f0f6fc" font-size="30" font-weight="700">HANDLER DECISION</text>
    <text x="1320.0" y="442" text-anchor="middle" fill="#9da7b3" font-size="21">derive • verify • preserve</text>
    <text x="1320.0" y="482" text-anchor="middle" fill="#e11d2a" font-size="19">TARGET-MATCHED EVIDENCE</text>
