<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" font-family="'Courier New', Consolas, monospace">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#12161d"/>
    </linearGradient>
    <marker id="ar2" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#e11d2a"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <rect x="0" y="0" width="1600" height="64" fill="#161b22"/>
  <rect x="0" y="64" width="1600" height="3" fill="#e11d2a"/>
  <text x="40" y="42" font-size="30" fill="#e6edf3" font-weight="bold">Hardware x64 PTE — Bitfield Layout (nt!_MMPTE_HARDWARE)</text>
  <text x="1300" y="42" font-size="18" fill="#8b949e">m05 · RTL</text>

  <text x="40" y="112" font-size="18" fill="#8b949e">64-bit valid PTE. Bit 0 (Valid/Present) = 1 → CPU walks it. Valid=0 → software PTE owned by the Memory Manager.</text>

  <!-- Bit ruler -->
  <g font-size="12" fill="#8b949e">
    <text x="60" y="150" text-anchor="middle">63</text>
    <text x="360" y="150" text-anchor="middle">52</text>
    <text x="470" y="150" text-anchor="middle">51</text>
    <text x="1120" y="150" text-anchor="middle">12</text>
    <text x="1170" y="150" text-anchor="middle">11</text>
    <text x="1540" y="150" text-anchor="middle">0</text>
  </g>

  <!-- Field blocks (single-bit low flags + PFN + high) -->
  <!-- NX bit 63 -->
  <rect x="40" y="160" width="70" height="70" fill="#2d1116" stroke="#e11d2a" stroke-width="1.5"/>
  <text x="75" y="200" font-size="18" fill="#f0a3ab" text-anchor="middle" font-weight="bold">NX</text>
  <text x="75" y="220" font-size="11" fill="#8b949e" text-anchor="middle">63</text>

  <!-- reserved 62:52 -->
  <rect x="110" y="160" width="300" height="70" fill="#161b22" stroke="#30363d"/>
  <text x="260" y="195" font-size="14" fill="#6e7681" text-anchor="middle">Reserved / SW use</text>
  <text x="260" y="216" font-size="11" fill="#6e7681" text-anchor="middle">62:52</text>

  <!-- PFN 51:12 -->
  <rect x="410" y="160" width="700" height="70" fill="#122019" stroke="#3fb950" stroke-width="2"/>
  <text x="760" y="197" font-size="20" fill="#3fb950" text-anchor="middle" font-weight="bold">PFN (Page Frame Number) — physical page</text>
  <text x="760" y="219" font-size="12" fill="#7ee2a8" text-anchor="middle">bits 51:12   →   PA = (PFN &lt;&lt; 12) | offset</text>

  <!-- low 11:0 flags -->
  <g>
    <!-- G bit 8 (approx placement) -->
    <rect x="1110" y="160" width="60" height="70" fill="#1b2330" stroke="#58a6ff"/>
    <text x="1140" y="197" font-size="16" fill="#58a6ff" text-anchor="middle" font-weight="bold">G</text>
    <text x="1140" y="218" font-size="11" fill="#8b949e" text-anchor="middle">8</text>

    <rect x="1170" y="160" width="60" height="70" fill="#1b2330" stroke="#58a6ff"/>
    <text x="1200" y="197" font-size="15" fill="#58a6ff" text-anchor="middle" font-weight="bold">L</text>
    <text x="1200" y="218" font-size="11" fill="#8b949e" text-anchor="middle">7 PS</text>

    <rect x="1230" y="160" width="60" height="70" fill="#241a10" stroke="#d29922"/>
    <text x="1260" y="197" font-size="16" fill="#e3b341" text-anchor="middle" font-weight="bold">D</text>
    <text x="1260" y="218" font-size="11" fill="#8b949e" text-anchor="middle">6</text>

    <rect x="1290" y="160" width="60" height="70" fill="#241a10" stroke="#d29922"/>
    <text x="1320" y="197" font-size="16" fill="#e3b341" text-anchor="middle" font-weight="bold">A</text>
    <text x="1320" y="218" font-size="11" fill="#8b949e" text-anchor="middle">5</text>

    <rect x="1350" y="160" width="60" height="70" fill="#1b2330" stroke="#58a6ff"/>
    <text x="1380" y="197" font-size="14" fill="#58a6ff" text-anchor="middle" font-weight="bold">PCD</text>
    <text x="1380" y="218" font-size="11" fill="#8b949e" text-anchor="middle">4</text>

    <rect x="1410" y="160" width="60" height="70" fill="#1b2330" stroke="#58a6ff"/>
    <text x="1440" y="197" font-size="14" fill="#58a6ff" text-anchor="middle" font-weight="bold">PWT</text>
    <text x="1440" y="218" font-size="11" fill="#8b949e" text-anchor="middle">3</text>

    <rect x="1470" y="160" width="34" height="70" fill="#2d1116" stroke="#e11d2a"/>
    <text x="1487" y="197" font-size="14" fill="#f0a3ab" text-anchor="middle" font-weight="bold">U</text>
    <text x="1487" y="218" font-size="10" fill="#8b949e" text-anchor="middle">2</text>

    <rect x="1504" y="160" width="34" height="70" fill="#2d1116" stroke="#e11d2a"/>
    <text x="1521" y="197" font-size="14" fill="#f0a3ab" text-anchor="middle" font-weight="bold">W</text>
    <text x="1521" y="218" font-size="10" fill="#8b949e" text-anchor="middle">1</text>

    <rect x="1538" y="160" width="34" height="70" fill="#2d1116" stroke="#e11d2a" stroke-width="2"/>
    <text x="1555" y="197" font-size="14" fill="#f0a3ab" text-anchor="middle" font-weight="bold">V</text>
    <text x="1555" y="218" font-size="10" fill="#8b949e" text-anchor="middle">0</text>
  </g>

  <!-- Legend table -->
  <text x="40" y="290" font-size="22" fill="#e6edf3" font-weight="bold">Flag meanings</text>
  <g font-size="15">
    <rect x="40" y="308" width="740" height="34" fill="#161b22" stroke="#30363d"/>
    <text x="52" y="331" fill="#f0a3ab" font-weight="bold">V  (0) Valid/Present</text><text x="330" y="331" fill="#8b949e">page is resident; CPU may translate</text>
    <rect x="40" y="342" width="740" height="34" fill="#12161d" stroke="#30363d"/>
    <text x="52" y="365" fill="#f0a3ab" font-weight="bold">W  (1) Write / R-W</text><text x="330" y="365" fill="#8b949e">0 = read-only, 1 = writable</text>
    <rect x="40" y="376" width="740" height="34" fill="#161b22" stroke="#30363d"/>
    <text x="52" y="399" fill="#f0a3ab" font-weight="bold">U  (2) Owner (U/S)</text><text x="330" y="399" fill="#8b949e">1 = user-accessible, 0 = supervisor only</text>
    <rect x="40" y="410" width="740" height="34" fill="#12161d" stroke="#30363d"/>
    <text x="52" y="433" fill="#58a6ff" font-weight="bold">PWT (3) Write-Through</text><text x="330" y="433" fill="#8b949e">cache write-through policy for this page</text>
    <rect x="40" y="444" width="740" height="34" fill="#161b22" stroke="#30363d"/>
    <text x="52" y="467" fill="#58a6ff" font-weight="bold">PCD (4) Cache-Disable</text><text x="330" y="467" fill="#8b949e">1 = uncached (MMIO / device memory)</text>
    <rect x="40" y="478" width="740" height="34" fill="#12161d" stroke="#30363d"/>
    <text x="52" y="501" fill="#e3b341" font-weight="bold">A  (5) Accessed</text><text x="330" y="501" fill="#8b949e">CPU set on first reference</text>
    <rect x="40" y="512" width="740" height="34" fill="#161b22" stroke="#30363d"/>
    <text x="52" y="535" fill="#e3b341" font-weight="bold">D  (6) Dirty</text><text x="330" y="535" fill="#8b949e">CPU set on first write → must write back</text>
    <rect x="40" y="546" width="740" height="34" fill="#12161d" stroke="#30363d"/>
    <text x="52" y="569" fill="#58a6ff" font-weight="bold">L/PS (7) Large page</text><text x="330" y="569" fill="#8b949e">at PDE/PDPTE: 2MB / 1GB mapping</text>
    <rect x="40" y="580" width="740" height="34" fill="#161b22" stroke="#30363d"/>
    <text x="52" y="603" fill="#58a6ff" font-weight="bold">G  (8) Global</text><text x="330" y="603" fill="#8b949e">TLB entry survives CR3 reload</text>
    <rect x="40" y="614" width="740" height="34" fill="#12161d" stroke="#30363d"/>
    <text x="52" y="637" fill="#f0a3ab" font-weight="bold">NX (63) No-Execute</text><text x="330" y="637" fill="#8b949e">1 = data-only; fetch → #PF (DEP)</text>
  </g>

  <!-- Software PTE / states panel -->
  <rect x="810" y="300" width="750" height="348" rx="8" fill="#12161d" stroke="#30363d"/>
  <text x="830" y="332" font-size="20" fill="#e6edf3" font-weight="bold">When Valid = 0 → Software PTE (MM-owned)</text>
  <text x="830" y="366" font-size="15" fill="#8b949e">The hardware ignores it; bit fields are reinterpreted by nt.</text>

  <rect x="830" y="384" width="710" height="52" fill="#1b2330" stroke="#58a6ff"/>
  <text x="844" y="406" font-size="15" fill="#58a6ff" font-weight="bold">Transition</text>
  <text x="1010" y="406" font-size="14" fill="#8b949e">page still in RAM on standby/modified list — soft fault re-attaches</text>
  <text x="1010" y="424" font-size="13" fill="#6e7681">Prototype=0, Transition=1</text>

  <rect x="830" y="440" width="710" height="52" fill="#241a10" stroke="#d29922"/>
  <text x="844" y="462" font-size="15" fill="#e3b341" font-weight="bold">Prototype</text>
  <text x="1010" y="462" font-size="14" fill="#8b949e">points into the _SUBSECTION prototype-PTE array (shared / mapped)</text>
  <text x="1010" y="480" font-size="13" fill="#6e7681">Prototype=1</text>

  <rect x="830" y="496" width="710" height="52" fill="#122019" stroke="#3fb950"/>
  <text x="844" y="518" font-size="15" fill="#7ee2a8" font-weight="bold">Demand-Zero</text>
  <text x="1010" y="518" font-size="14" fill="#8b949e">PTE is 0 (committed, never touched) → fault gives a zeroed page</text>

  <rect x="830" y="552" width="710" height="52" fill="#2d1116" stroke="#e11d2a"/>
  <text x="844" y="574" font-size="15" fill="#f0a3ab" font-weight="bold">Pagefile</text>
  <text x="1010" y="574" font-size="14" fill="#8b949e">PageFileHigh + index encode where the page was written out</text>

  <text x="830" y="632" font-size="14" fill="#58a6ff">Decode any PTE: dt nt!_MMPTE &lt;pte-addr&gt; · dt nt!_MMPTE_HARDWARE · !pte &lt;va&gt;</text>

  <!-- example decode row -->
  <rect x="40" y="690" width="1520" height="170" rx="8" fill="#12161d" stroke="#30363d"/>
  <text x="60" y="722" font-size="18" fill="#e6edf3" font-weight="bold">Reading the !pte suffix — e.g.  contains 0x0000000045678867  pfn 45678  ---DA--UWEV</text>
  <text x="60" y="754" font-size="15" fill="#8b949e">Right-to-left the letter cluster maps to the low flags/state:</text>
  <g font-size="15">
    <text x="60"  y="786" fill="#f0a3ab">V=Valid</text>
    <text x="200" y="786" fill="#f0a3ab">E=Execute (NX clear)</text>
    <text x="470" y="786" fill="#f0a3ab">W=Writable</text>
    <text x="670" y="786" fill="#f0a3ab">U=User</text>
    <text x="810" y="786" fill="#e3b341">A=Accessed</text>
    <text x="1010" y="786" fill="#e3b341">D=Dirty</text>
    <text x="1160" y="786" fill="#6e7681">C=Copy-on-write  G=Global  L=Large</text>
  </g>
  <text x="60" y="820" font-size="15" fill="#7ee2a8">Your PFN and flag letters WILL differ — always decode the live value; do not memorize a literal.</text>
  <text x="60" y="846" font-size="14" fill="#8b949e">A dash ( - ) in the cluster means that flag is 0. Order of letters is fixed by the extension, not by bit number.</text>
</svg>
