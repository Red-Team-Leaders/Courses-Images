<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">Observe, normalize, and verify bypass pattern</title>
  <desc id="desc">Five-stage technical diagram for module 8: Find check to Capture inputs to Force contract to Reach branch to Check side effects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#21262d"/><stop offset="1" stop-color="#161b22"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e11d2a"/></marker>
    <style>
      .title { fill:#f0f6fc; font:700 42px ui-monospace,SFMono-Regular,Consolas,monospace; }
      .subtitle { fill:#8b949e; font:22px ui-monospace,SFMono-Regular,Consolas,monospace; }
      .label { fill:#f0f6fc; font:700 20px ui-monospace,SFMono-Regular,Consolas,monospace; }
      .small { fill:#8b949e; font:16px ui-monospace,SFMono-Regular,Consolas,monospace; }
      .arrow { stroke:#e11d2a; stroke-width:5; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 120 H1600 M0 740 H1600" stroke="#30363d" stroke-width="2"/>
  <rect x="60" y="60" width="18" height="80" rx="5" fill="#e11d2a"/>
  <text x="110" y="105" class="title">Observe, normalize, and verify bypass pattern</text>
  <text x="110" y="142" class="subtitle">RTL · Windows Kernel Debugging with WinDbg · Module 08</text>
  <line x1="310" y1="440" x2="370" y2="440" class="arrow"/><line x1="610" y1="440" x2="670" y2="440" class="arrow"/><line x1="910" y1="440" x2="970" y2="440" class="arrow"/><line x1="1210" y1="440" x2="1270" y2="440" class="arrow"/>
  <g><rect x="90" y="365" width="220" height="150" rx="18" fill="url(#panel)" stroke="#e11d2a" stroke-width="4"/><text x="200" y="425" text-anchor="middle" class="label">Find check</text><text x="200" y="465" text-anchor="middle" class="small">stage 1</text></g><g><rect x="390" y="365" width="220" height="150" rx="18" fill="url(#panel)" stroke="#30363d" stroke-width="4"/><text x="500" y="425" text-anchor="middle" class="label">Capture inputs</text><text x="500" y="465" text-anchor="middle" class="small">stage 2</text></g><g><rect x="690" y="365" width="220" height="150" rx="18" fill="url(#panel)" stroke="#30363d" stroke-width="4"/><text x="800" y="425" text-anchor="middle" class="label">Force contract</text><text x="800" y="465" text-anchor="middle" class="small">stage 3</text></g><g><rect x="990" y="365" width="220" height="150" rx="18" fill="url(#panel)" stroke="#30363d" stroke-width="4"/><text x="1100" y="425" text-anchor="middle" class="label">Reach branch</text><text x="1100" y="465" text-anchor="middle" class="small">stage 4</text></g><g><rect x="1290" y="365" width="220" height="150" rx="18" fill="url(#panel)" stroke="#e11d2a" stroke-width="4"/><text x="1400" y="425" text-anchor="middle" class="label">Check side effects</text><text x="1400" y="465" text-anchor="middle" class="small">stage 5</text></g>
  <text x="800" y="665" text-anchor="middle" class="subtitle">Resolve target-specific addresses and offsets from symbols at runtime.</text>
  <rect x="90" y="780" width="1420" height="4" fill="#e11d2a" opacity=".8"/>
