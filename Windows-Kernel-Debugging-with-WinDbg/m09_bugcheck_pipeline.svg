<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" font-family="'Courier New',Consolas,monospace">
  <defs>
    <linearGradient id="bg9p" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="stg9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#12171f"/>
    </linearGradient>
    <linearGradient id="red9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1220"/><stop offset="1" stop-color="#2a0d18"/>
    </linearGradient>
    <linearGradient id="grn9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2a17"/><stop offset="1" stop-color="#0b2011"/>
    </linearGradient>
    <marker id="ap9" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 Z" fill="#e11d2a"/>
    </marker>
    <marker id="ap9g" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg9p)"/>
  <rect x="0" y="0" width="1600" height="6" fill="#e11d2a"/>
  <text x="40" y="52" fill="#f0f6fc" font-size="30" font-weight="bold">Module 09 &#8212; Bugcheck-to-Root-Cause Pipeline</text>
  <text x="40" y="82" fill="#8b949e" font-size="17">From KeBugCheckEx to a source fix: the data-flow every kernel crash follows. Your addresses and bucket IDs WILL differ.</text>

  <!-- Stage rail -->
  <line x1="60" y1="300" x2="1540" y2="300" stroke="#21262d" stroke-width="2"/>

  <!-- STAGE 1: Bugcheck -->
  <rect x="60" y="150" width="270" height="150" rx="12" fill="url(#red9)" stroke="#e11d2a" stroke-width="2"/>
  <text x="195" y="188" fill="#ff7b72" font-size="20" font-weight="bold" text-anchor="middle">1. Bugcheck</text>
  <text x="195" y="214" fill="#e6edf3" font-size="15" text-anchor="middle">KeBugCheckEx()</text>
  <line x1="80" y1="228" x2="310" y2="228" stroke="#30363d"/>
  <text x="195" y="252" fill="#8b949e" font-size="13" text-anchor="middle">Code + 4 args captured</text>
  <text x="195" y="272" fill="#8b949e" font-size="13" text-anchor="middle">IRQL raised to HIGH</text>
  <text x="195" y="292" fill="#8b949e" font-size="13" text-anchor="middle">0x7F BSOD screen</text>

  <!-- STAGE 2: Dump written -->
  <rect x="376" y="150" width="270" height="150" rx="12" fill="url(#stg9)" stroke="#d29922" stroke-width="2"/>
  <text x="511" y="188" fill="#e3b341" font-size="20" font-weight="bold" text-anchor="middle">2. Crash dump</text>
  <text x="511" y="212" fill="#e6edf3" font-size="14" text-anchor="middle">written on next boot</text>
  <line x1="396" y1="226" x2="626" y2="226" stroke="#30363d"/>
  <text x="511" y="250" fill="#8b949e" font-size="13" text-anchor="middle">Minidump  C:\Windows\Minidump</text>
  <text x="511" y="270" fill="#8b949e" font-size="13" text-anchor="middle">Kernel  MEMORY.DMP</text>
  <text x="511" y="290" fill="#8b949e" font-size="13" text-anchor="middle">Complete (full physical)</text>

  <!-- STAGE 3: analyze -->
  <rect x="692" y="150" width="270" height="150" rx="12" fill="url(#stg9)" stroke="#58a6ff" stroke-width="2"/>
  <text x="827" y="188" fill="#79c0ff" font-size="20" font-weight="bold" text-anchor="middle">3. Triage</text>
  <text x="827" y="212" fill="#e6edf3" font-size="15" text-anchor="middle">!analyze -v</text>
  <line x1="712" y1="226" x2="942" y2="226" stroke="#30363d"/>
  <text x="827" y="250" fill="#8b949e" font-size="13" text-anchor="middle">BUGCHECK_CODE</text>
  <text x="827" y="270" fill="#8b949e" font-size="13" text-anchor="middle">STACK_TEXT</text>
  <text x="827" y="290" fill="#8b949e" font-size="13" text-anchor="middle">FAILURE_BUCKET_ID</text>

  <!-- STAGE 4: driver identified -->
  <rect x="1008" y="150" width="270" height="150" rx="12" fill="url(#stg9)" stroke="#a371f7" stroke-width="2"/>
  <text x="1143" y="188" fill="#bc8cff" font-size="20" font-weight="bold" text-anchor="middle">4. Culprit</text>
  <text x="1143" y="212" fill="#e6edf3" font-size="14" text-anchor="middle">offending driver</text>
  <line x1="1028" y1="226" x2="1258" y2="226" stroke="#30363d"/>
  <text x="1143" y="250" fill="#8b949e" font-size="13" text-anchor="middle">MODULE_NAME</text>
  <text x="1143" y="270" fill="#8b949e" font-size="13" text-anchor="middle">IMAGE_NAME</text>
  <text x="1143" y="290" fill="#8b949e" font-size="13" text-anchor="middle">FOLLOWUP_NAME</text>

  <!-- STAGE 5: root cause -->
  <rect x="1324" y="150" width="216" height="150" rx="12" fill="url(#grn9)" stroke="#3fb950" stroke-width="2"/>
  <text x="1432" y="188" fill="#7ee787" font-size="20" font-weight="bold" text-anchor="middle">5. Root cause</text>
  <text x="1432" y="212" fill="#e6edf3" font-size="14" text-anchor="middle">&amp; source fix</text>
  <line x1="1344" y1="226" x2="1520" y2="226" stroke="#30363d"/>
  <text x="1432" y="250" fill="#8b949e" font-size="13" text-anchor="middle">ln / .frame / dv</text>
  <text x="1432" y="270" fill="#8b949e" font-size="13" text-anchor="middle">PDB line + srcfix</text>
  <text x="1432" y="290" fill="#8b949e" font-size="13" text-anchor="middle">verify w/ Verifier</text>

  <!-- arrows -->
  <path d="M330,225 L370,225" stroke="#e11d2a" stroke-width="3" fill="none" marker-end="url(#ap9)"/>
  <path d="M646,225 L686,225" stroke="#e11d2a" stroke-width="3" fill="none" marker-end="url(#ap9)"/>
  <path d="M962,225 L1002,225" stroke="#e11d2a" stroke-width="3" fill="none" marker-end="url(#ap9)"/>
  <path d="M1278,225 L1318,225" stroke="#e11d2a" stroke-width="3" fill="none" marker-end="url(#ap9)"/>

  <!-- artifact detail panel -->
  <rect x="60" y="380" width="1480" height="330" rx="12" fill="#0f141b" stroke="#30363d" stroke-width="1.5"/>
  <text x="90" y="418" fill="#f0f6fc" font-size="20" font-weight="bold">What each stage produces &#8212; the artifacts you actually read</text>

  <!-- transcript-style boxes -->
  <rect x="90" y="440" width="450" height="240" rx="8" fill="#0b0f14" stroke="#30363d"/>
  <text x="108" y="468" fill="#79c0ff" font-size="15" font-weight="bold">kd&gt; .bugcheck</text>
  <text x="108" y="494" fill="#c9d1d9" font-size="14">Bugcheck code 000000D1</text>
  <text x="108" y="516" fill="#8b949e" font-size="13">Arg1: kernel address referenced</text>
  <text x="108" y="536" fill="#8b949e" font-size="13">Arg2: IRQL at fault</text>
  <text x="108" y="556" fill="#8b949e" font-size="13">Arg3: 0=read 1=write 8=exec</text>
  <text x="108" y="576" fill="#8b949e" font-size="13">Arg4: faulting instruction addr</text>
  <text x="108" y="606" fill="#79c0ff" font-size="15" font-weight="bold">kd&gt; !analyze -v</text>
  <text x="108" y="630" fill="#8b949e" font-size="13">auto-runs triage engine, sets</text>
  <text x="108" y="650" fill="#8b949e" font-size="13">$curprocess, .trap, dump-globals</text>

  <rect x="570" y="440" width="450" height="240" rx="8" fill="#0b0f14" stroke="#30363d"/>
  <text x="588" y="468" fill="#e3b341" font-size="15" font-weight="bold">Triage fields (memorize the shape)</text>
  <text x="588" y="496" fill="#c9d1d9" font-size="14">BUGCHECK_CODE:  d1</text>
  <text x="588" y="518" fill="#c9d1d9" font-size="14">BUGCHECK_P1..P4: the 4 args</text>
  <text x="588" y="540" fill="#c9d1d9" font-size="14">PROCESS_NAME:   System</text>
  <text x="588" y="562" fill="#c9d1d9" font-size="14">STACK_TEXT:     the call stack</text>
  <text x="588" y="584" fill="#c9d1d9" font-size="14">MODULE_NAME:    myfault</text>
  <text x="588" y="606" fill="#c9d1d9" font-size="14">IMAGE_NAME:     myfault.sys</text>
  <text x="588" y="628" fill="#c9d1d9" font-size="14">FAILURE_BUCKET_ID: AV_myfault!...</text>
  <text x="588" y="656" fill="#8b949e" font-size="13">Bucket = fingerprint for dedupe.</text>

  <rect x="1050" y="440" width="460" height="240" rx="8" fill="#0b0f14" stroke="#30363d"/>
  <text x="1068" y="468" fill="#bc8cff" font-size="15" font-weight="bold">Pin the driver &#8594; find the line</text>
  <text x="1068" y="496" fill="#c9d1d9" font-size="14">kd&gt; lm vm myfault</text>
  <text x="1068" y="518" fill="#8b949e" font-size="13">image base, timestamp, PDB match</text>
  <text x="1068" y="542" fill="#c9d1d9" font-size="14">kd&gt; .trap @@(...)  ; restore ctx</text>
  <text x="1068" y="564" fill="#c9d1d9" font-size="14">kd&gt; ln myfault!TriggerFault+0x2c</text>
  <text x="1068" y="586" fill="#c9d1d9" font-size="14">kd&gt; .frame /r 3 ; kd&gt; dv /t</text>
  <text x="1068" y="610" fill="#7ee787" font-size="14">&#8594; source file:line + bad pointer</text>
  <text x="1068" y="636" fill="#8b949e" font-size="13">Fix, rebuild, re-arm Driver Verifier,</text>
  <text x="1068" y="656" fill="#8b949e" font-size="13">repro to confirm bucket is gone.</text>

  <!-- flow arrows to detail -->
  <path d="M195,302 L200,436" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 4" fill="none" marker-end="url(#ap9g)"/>
  <path d="M827,302 L760,436" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 4" fill="none" marker-end="url(#ap9g)"/>
  <path d="M1143,302 L1230,436" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 4" fill="none" marker-end="url(#ap9g)"/>

  <text x="60" y="760" fill="#e6edf3" font-size="16" font-weight="bold">Mental model:</text>
  <text x="150" y="760" fill="#c9d1d9" font-size="16">a bugcheck is a structured exception the kernel refuses to survive &#8212; the dump freezes that instant so you can replay the triage offline.</text>
  <text x="60" y="792" fill="#8b949e" font-size="15">Configure dump type BEFORE the crash (System &#8594; Startup &amp; Recovery, or `wmic recoveros`). No dump written = nothing to analyze.</text>
  <text x="60" y="870" fill="#6e7681" font-size="14">MCP tip: with svnscha/mcp-windbg, prompt "open_kd_session on MEMORY.DMP then run_kd_command !analyze -v and summarize BUGCHECK_CODE + FAILURE_BUCKET_ID".</text>
</svg>
