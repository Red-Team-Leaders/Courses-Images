<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f0f23"/><stop offset="100%" stop-color="#1a1a3e"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00d4aa"/><stop offset="100%" stop-color="#00b894"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff6b6b"/><stop offset="100%" stop-color="#ee5a24"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#74b9ff"/><stop offset="100%" stop-color="#0984e3"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a29bfe"/><stop offset="100%" stop-color="#6c5ce7"/></linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffeaa7"/><stop offset="100%" stop-color="#fdcb6e"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="900" height="520" fill="url(#bg1)" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" fill="#00d4aa" font-size="18" font-weight="700">x64dbg — Loader Debugging Flow</text>

  <!-- Step boxes -->
  <!-- Step 1: Load -->
  <rect x="30" y="60" width="160" height="70" rx="8" fill="none" stroke="url(#blue)" stroke-width="1.5" opacity="0.9"/>
  <text x="110" y="82" text-anchor="middle" fill="#74b9ff" font-size="11" font-weight="700">STEP 1</text>
  <text x="110" y="98" text-anchor="middle" fill="#dfe6e9" font-size="10">Load Binary</text>
  <text x="110" y="114" text-anchor="middle" fill="#636e72" font-size="9">bp main / F9</text>

  <!-- Arrow -->
  <line x1="190" y1="95" x2="220" y2="95" stroke="#74b9ff" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <defs><marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#74b9ff"/></marker></defs>

  <!-- Step 2: Anti-Debug -->
  <rect x="220" y="60" width="160" height="70" rx="8" fill="none" stroke="url(#red)" stroke-width="1.5" opacity="0.9"/>
  <text x="300" y="82" text-anchor="middle" fill="#ff6b6b" font-size="11" font-weight="700">STEP 2</text>
  <text x="300" y="98" text-anchor="middle" fill="#dfe6e9" font-size="10">Anti-Debug Check</text>
  <text x="300" y="114" text-anchor="middle" fill="#636e72" font-size="9">ScyllaHide bypass</text>

  <line x1="380" y1="95" x2="410" y2="95" stroke="#ff6b6b" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <defs><marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ff6b6b"/></marker></defs>

  <!-- Step 3: API Resolve -->
  <rect x="410" y="60" width="160" height="70" rx="8" fill="none" stroke="url(#purple)" stroke-width="1.5" opacity="0.9"/>
  <text x="490" y="82" text-anchor="middle" fill="#a29bfe" font-size="11" font-weight="700">STEP 3</text>
  <text x="490" y="98" text-anchor="middle" fill="#dfe6e9" font-size="10">API Resolution</text>
  <text x="490" y="114" text-anchor="middle" fill="#636e72" font-size="9">bp GetProcAddress</text>

  <line x1="570" y1="95" x2="600" y2="95" stroke="#a29bfe" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <defs><marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#a29bfe"/></marker></defs>

  <!-- Step 4: VirtualAlloc -->
  <rect x="600" y="60" width="160" height="70" rx="8" fill="none" stroke="url(#green)" stroke-width="1.5" opacity="0.9"/>
  <text x="680" y="82" text-anchor="middle" fill="#00d4aa" font-size="11" font-weight="700">STEP 4</text>
  <text x="680" y="98" text-anchor="middle" fill="#dfe6e9" font-size="10">VirtualAlloc (RW)</text>
  <text x="680" y="114" text-anchor="middle" fill="#636e72" font-size="9">Check RDX, R9=0x04</text>

  <!-- Arrow down from Step 4 -->
  <line x1="680" y1="130" x2="680" y2="170" stroke="#00d4aa" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <defs><marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#00d4aa"/></marker></defs>

  <!-- Step 5: Decrypt -->
  <rect x="600" y="170" width="160" height="70" rx="8" fill="none" stroke="url(#yellow)" stroke-width="1.5" opacity="0.9"/>
  <text x="680" y="192" text-anchor="middle" fill="#ffeaa7" font-size="11" font-weight="700">STEP 5</text>
  <text x="680" y="208" text-anchor="middle" fill="#dfe6e9" font-size="10">XOR Decryption</text>
  <text x="680" y="224" text-anchor="middle" fill="#636e72" font-size="9">HW write breakpoint</text>

  <!-- Arrow left from Step 5 -->
  <line x1="600" y1="205" x2="570" y2="205" stroke="#ffeaa7" stroke-width="1.5" marker-end="url(#arrowYellow)"/>
  <defs><marker id="arrowYellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#ffeaa7"/></marker></defs>

  <!-- Step 6: VirtualProtect -->
  <rect x="410" y="170" width="160" height="70" rx="8" fill="none" stroke="url(#blue)" stroke-width="1.5" opacity="0.9"/>
  <text x="490" y="192" text-anchor="middle" fill="#74b9ff" font-size="11" font-weight="700">STEP 6</text>
  <text x="490" y="208" text-anchor="middle" fill="#dfe6e9" font-size="10">VirtualProtect (RX)</text>
  <text x="490" y="224" text-anchor="middle" fill="#636e72" font-size="9">R8=0x20 (EXEC_READ)</text>

  <line x1="410" y1="205" x2="380" y2="205" stroke="#74b9ff" stroke-width="1.5" marker-end="url(#arrowBlue2)"/>
  <defs><marker id="arrowBlue2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#74b9ff"/></marker></defs>

  <!-- Step 7: Execute -->
  <rect x="220" y="170" width="160" height="70" rx="8" fill="none" stroke="url(#green)" stroke-width="1.5" opacity="0.9"/>
  <rect x="220" y="170" width="160" height="70" rx="8" fill="#00d4aa" opacity="0.1"/>
  <text x="300" y="192" text-anchor="middle" fill="#00d4aa" font-size="11" font-weight="700">STEP 7</text>
  <text x="300" y="208" text-anchor="middle" fill="#dfe6e9" font-size="10">CreateThread</text>
  <text x="300" y="224" text-anchor="middle" fill="#636e72" font-size="9">R8 = shellcode addr</text>

  <!-- x64dbg Panels at bottom -->
  <text x="450" y="280" text-anchor="middle" fill="#00d4aa" font-size="14" font-weight="700">x64dbg Inspection Points</text>

  <!-- CPU Panel -->
  <rect x="30" y="300" width="200" height="190" rx="8" fill="#1e1e3a" stroke="#74b9ff" stroke-width="1"/>
  <rect x="30" y="300" width="200" height="28" rx="8" fill="#74b9ff" opacity="0.15"/>
  <text x="130" y="319" text-anchor="middle" fill="#74b9ff" font-size="11" font-weight="700">CPU / Disassembly</text>
  <text x="42" y="345" fill="#636e72" font-size="9" font-family="Consolas, monospace">call VirtualAlloc</text>
  <text x="42" y="360" fill="#636e72" font-size="9" font-family="Consolas, monospace">mov [rbp-8], rax</text>
  <text x="42" y="375" fill="#ffeaa7" font-size="9" font-family="Consolas, monospace">call decrypt_routine</text>
  <text x="42" y="390" fill="#636e72" font-size="9" font-family="Consolas, monospace">call VirtualProtect</text>
  <text x="42" y="405" fill="#ff6b6b" font-size="9" font-family="Consolas, monospace">call rax  ; EXECUTE!</text>
  <text x="42" y="430" fill="#a29bfe" font-size="9">Watch instruction flow</text>
  <text x="42" y="445" fill="#a29bfe" font-size="9">F7=step in, F8=step over</text>

  <!-- Memory Map -->
  <rect x="250" y="300" width="200" height="190" rx="8" fill="#1e1e3a" stroke="#00d4aa" stroke-width="1"/>
  <rect x="250" y="300" width="200" height="28" rx="8" fill="#00d4aa" opacity="0.15"/>
  <text x="350" y="319" text-anchor="middle" fill="#00d4aa" font-size="11" font-weight="700">Memory Map</text>
  <text x="262" y="345" fill="#636e72" font-size="9" font-family="Consolas, monospace">0x1A0000  RW  Private</text>
  <text x="262" y="360" fill="#636e72" font-size="9" font-family="Consolas, monospace">          ↓ after VP</text>
  <text x="262" y="375" fill="#00d4aa" font-size="9" font-family="Consolas, monospace">0x1A0000  RX  Private</text>
  <text x="262" y="400" fill="#a29bfe" font-size="9">Track protection changes</text>
  <text x="262" y="415" fill="#a29bfe" font-size="9">RW(04) → RX(20)</text>
  <text x="262" y="440" fill="#ff6b6b" font-size="9">Flag: ERW(40) = RWX alloc</text>

  <!-- Hex Dump -->
  <rect x="470" y="300" width="200" height="190" rx="8" fill="#1e1e3a" stroke="#ffeaa7" stroke-width="1"/>
  <rect x="470" y="300" width="200" height="28" rx="8" fill="#ffeaa7" opacity="0.15"/>
  <text x="570" y="319" text-anchor="middle" fill="#ffeaa7" font-size="11" font-weight="700">Hex Dump</text>
  <text x="482" y="345" fill="#ff6b6b" font-size="9" font-family="Consolas, monospace">Before: A3 7F 91 C2 ...</text>
  <text x="482" y="360" fill="#636e72" font-size="9">     (encrypted/random)</text>
  <text x="482" y="385" fill="#00d4aa" font-size="9" font-family="Consolas, monospace">After:  FC 48 83 E4 ...</text>
  <text x="482" y="400" fill="#636e72" font-size="9">     (valid shellcode)</text>
  <text x="482" y="425" fill="#a29bfe" font-size="9">Verify first bytes match</text>
  <text x="482" y="440" fill="#a29bfe" font-size="9">expected payload header</text>

  <!-- Registers -->
  <rect x="690" y="300" width="180" height="190" rx="8" fill="#1e1e3a" stroke="#a29bfe" stroke-width="1"/>
  <rect x="690" y="300" width="180" height="28" rx="8" fill="#a29bfe" opacity="0.15"/>
  <text x="780" y="319" text-anchor="middle" fill="#a29bfe" font-size="11" font-weight="700">Registers</text>
  <text x="702" y="345" fill="#636e72" font-size="9" font-family="Consolas, monospace">RCX: 0 (any addr)</text>
  <text x="702" y="360" fill="#ffeaa7" font-size="9" font-family="Consolas, monospace">RDX: 0x114 (size)</text>
  <text x="702" y="375" fill="#636e72" font-size="9" font-family="Consolas, monospace">R8:  0x3000 (commit)</text>
  <text x="702" y="390" fill="#00d4aa" font-size="9" font-family="Consolas, monospace">R9:  0x04 (RW)</text>
  <text x="702" y="410" fill="#636e72" font-size="9">After return:</text>
  <text x="702" y="425" fill="#ff6b6b" font-size="9" font-family="Consolas, monospace">RAX: 0x1A0000 (buf)</text>
  <text x="702" y="445" fill="#a29bfe" font-size="9">Follow RAX in dump</text>
</svg>
