<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="aw" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#c9d1d9"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="ag2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
  </defs>
  <rect width="900" height="520" fill="url(#bg)"/>
  <text x="450" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">ObRegisterCallbacks — Kernel Handle Access Control</text>
  <!-- Your Process -->
  <rect x="300" y="50" width="300" height="45" rx="8" fill="#1a1a2e" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="450" y="72" text-anchor="middle" fill="#c9d1d9" font-size="11">NtOpenProcess(target, PROCESS_ALL_ACCESS)</text>
  <text x="450" y="87" text-anchor="middle" fill="#8b949e" font-size="9">(via standard API OR direct syscall)</text>
  <!-- Arrow down -->
  <line x1="450" y1="95" x2="450" y2="125" stroke="#c9d1d9" stroke-width="1.5" marker-end="url(#aw)"/>
  <text x="465" y="115" fill="#f0883e" font-size="10">syscall</text>
  <!-- Kernel boundary -->
  <line x1="50" y1="130" x2="850" y2="130" stroke="#f85149" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="60" y="145" fill="#f85149" font-size="10" font-weight="bold">KERNEL MODE (Ring 0)</text>
  <!-- Object Manager -->
  <rect x="300" y="155" width="300" height="40" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1"/>
  <text x="450" y="180" text-anchor="middle" fill="#c9d1d9" font-size="12">Kernel Object Manager</text>
  <!-- Arrow to callback -->
  <line x1="450" y1="195" x2="450" y2="220" stroke="#c9d1d9" stroke-width="1.5" marker-end="url(#aw)"/>
  <text x="465" y="213" fill="#8b949e" font-size="9">invokes callbacks</text>
  <!-- EDR Callback -->
  <rect x="200" y="225" width="500" height="110" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="450" y="250" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">EDR Kernel Driver — POB_PRE_OPERATION_CALLBACK</text>
  <text x="220" y="275" fill="#c9d1d9" font-size="11">1. Check source process (who is opening the handle?)</text>
  <text x="220" y="295" fill="#c9d1d9" font-size="11">2. Check target process (what is being accessed?)</text>
  <text x="220" y="315" fill="#c9d1d9" font-size="11">3. Check access rights (PROCESS_VM_WRITE? CREATE_THREAD?)</text>
  <!-- Decision arrows -->
  <line x1="350" y1="335" x2="250" y2="380" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ag2)"/>
  <line x1="550" y1="335" x2="650" y2="380" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ao)"/>
  <!-- Allowed -->
  <rect x="120" y="383" width="260" height="50" rx="8" fill="#0a2e0a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="250" y="405" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">ALLOWED</text>
  <text x="250" y="423" text-anchor="middle" fill="#7ee787" font-size="10">Access granted as requested</text>
  <!-- Stripped -->
  <rect x="520" y="383" width="260" height="50" rx="8" fill="#2d1a00" stroke="#f0883e" stroke-width="1.5"/>
  <text x="650" y="405" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">ACCESS STRIPPED</text>
  <text x="650" y="423" text-anchor="middle" fill="#ffa657" font-size="10">VM_WRITE + CREATE_THREAD removed</text>
  <!-- Note -->
  <rect x="150" y="455" width="600" height="50" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="450" y="477" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">Direct syscalls still trigger this callback</text>
  <text x="450" y="495" text-anchor="middle" fill="#ff7b72" font-size="10">Both standard API and syscall paths reach the same kernel function</text>
</svg>