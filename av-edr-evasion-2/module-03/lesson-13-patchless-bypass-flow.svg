<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 550" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="aw" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#c9d1d9"/></marker>
  </defs>
  <rect width="950" height="550" fill="url(#bg)"/>
  <text x="475" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Patchless Bypass — Hardware Breakpoints (DR0-DR3)</text>
  <!-- Setup Phase -->
  <text x="50" y="65" fill="#d2a8ff" font-size="13" font-weight="bold">Setup Phase</text>
  <rect x="40" y="75" width="250" height="35" rx="6" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="1"/>
  <text x="165" y="97" text-anchor="middle" fill="#c9d1d9" font-size="10">DR0 = EtwEventWrite addr</text>
  <rect x="40" y="115" width="250" height="35" rx="6" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="1"/>
  <text x="165" y="137" text-anchor="middle" fill="#c9d1d9" font-size="10">DR1 = AmsiScanBuffer addr</text>
  <rect x="40" y="155" width="250" height="35" rx="6" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="1"/>
  <text x="165" y="177" text-anchor="middle" fill="#c9d1d9" font-size="10">Register VEH handler</text>
  <!-- Execution Flow -->
  <text x="360" y="65" fill="#58a6ff" font-size="13" font-weight="bold">Execution Flow (when EtwEventWrite is called)</text>
  <rect x="350" y="75" width="260" height="35" rx="6" fill="#1a1a2e" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="480" y="97" text-anchor="middle" fill="#c9d1d9" font-size="10">1. CPU hits DR0 address</text>
  <line x1="480" y1="110" x2="480" y2="120" stroke="#c9d1d9" stroke-width="1" marker-end="url(#aw)"/>
  <rect x="350" y="123" width="260" height="35" rx="6" fill="#1a1a2e" stroke="#f0883e" stroke-width="1.5"/>
  <text x="480" y="145" text-anchor="middle" fill="#f0883e" font-size="10">2. #DB exception generated</text>
  <line x1="480" y1="158" x2="480" y2="168" stroke="#c9d1d9" stroke-width="1" marker-end="url(#aw)"/>
  <rect x="350" y="171" width="260" height="35" rx="6" fill="#1a1a2e" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="480" y="193" text-anchor="middle" fill="#d2a8ff" font-size="10">3. VEH catches exception</text>
  <line x1="480" y1="206" x2="480" y2="216" stroke="#c9d1d9" stroke-width="1" marker-end="url(#aw)"/>
  <rect x="330" y="219" width="300" height="50" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="480" y="241" text-anchor="middle" fill="#3fb950" font-size="11">4. VEH sets RAX = 0 (SUCCESS)</text>
  <text x="480" y="258" text-anchor="middle" fill="#3fb950" font-size="11">   RIP = return address</text>
  <line x1="480" y1="269" x2="480" y2="279" stroke="#c9d1d9" stroke-width="1" marker-end="url(#aw)"/>
  <rect x="350" y="282" width="260" height="35" rx="6" fill="#0a2e0a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="480" y="304" text-anchor="middle" fill="#7ee787" font-size="11">5. Function NEVER executed</text>
  <!-- Zero bytes badge -->
  <rect x="680" y="75" width="240" height="250" rx="10" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="800" y="105" text-anchor="middle" fill="#3fb950" font-size="20" font-weight="bold">0</text>
  <text x="800" y="125" text-anchor="middle" fill="#3fb950" font-size="12">bytes modified</text>
  <line x1="710" y1="140" x2="890" y2="140" stroke="#30363d" stroke-width="1"/>
  <text x="800" y="165" text-anchor="middle" fill="#c9d1d9" font-size="11">Integrity scans:</text>
  <text x="800" y="185" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">CLEAN</text>
  <line x1="710" y1="200" x2="890" y2="200" stroke="#30363d" stroke-width="1"/>
  <text x="800" y="220" text-anchor="middle" fill="#c9d1d9" font-size="11">Byte pattern scans:</text>
  <text x="800" y="240" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">NO MATCH</text>
  <line x1="710" y1="255" x2="890" y2="255" stroke="#30363d" stroke-width="1"/>
  <text x="800" y="275" text-anchor="middle" fill="#c9d1d9" font-size="11">VirtualProtect calls:</text>
  <text x="800" y="295" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">NONE</text>
  <!-- Comparison -->
  <text x="50" y="360" fill="#f0883e" font-size="13" font-weight="bold">Comparison</text>
  <!-- Patching -->
  <rect x="40" y="375" width="420" height="80" rx="8" fill="#2d1a00" stroke="#f0883e" stroke-width="1.5"/>
  <text x="250" y="398" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">Byte Patching (Traditional)</text>
  <text x="60" y="418" fill="#ffa657" font-size="10">Modified bytes: 3-6 (xor eax,eax; ret)</text>
  <text x="60" y="435" fill="#ffa657" font-size="10">Detectable: integrity scan, byte pattern scan</text>
  <text x="60" y="452" fill="#ffa657" font-size="10">VirtualProtect required: YES (telemetry generated)</text>
  <!-- HW Breakpoint -->
  <rect x="490" y="375" width="420" height="80" rx="8" fill="#0a2e0a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="700" y="398" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Hardware Breakpoints (Patchless)</text>
  <text x="510" y="418" fill="#7ee787" font-size="10">Modified bytes: 0 (nothing changed)</text>
  <text x="510" y="435" fill="#7ee787" font-size="10">Detectable: debug register monitoring only</text>
  <text x="510" y="452" fill="#7ee787" font-size="10">VirtualProtect required: NO</text>
  <!-- Limits note -->
  <rect x="40" y="475" width="870" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="475" y="498" text-anchor="middle" fill="#8b949e" font-size="11">Limitations: 4 breakpoints max (DR0-DR3) | Per-thread setup required | EDRs can monitor debug registers</text>
  <text x="475" y="520" text-anchor="middle" fill="#58a6ff" font-size="11">Best for: EtwEventWrite + EtwEventWriteFull + AmsiScanBuffer + AmsiOpenSession (exactly 4)</text>
</svg>