<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
  </defs>
  <rect width="1000" height="480" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Injection Technique Comparison — Detection Footprint</text>
  <!-- Table header -->
  <rect x="30" y="50" width="940" height="35" rx="0" fill="#21262d"/>
  <text x="135" y="73" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">Technique</text>
  <text x="315" y="73" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">APIs Used</text>
  <text x="500" y="73" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">Artifacts</text>
  <text x="665" y="73" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">Detection</text>
  <text x="860" y="73" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">Stealth</text>
  <!-- Row 1: Classic -->
  <rect x="30" y="88" width="940" height="65" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
  <text x="135" y="115" text-anchor="middle" fill="#ff7b72" font-size="11" font-weight="bold">Classic Remote</text>
  <text x="135" y="132" text-anchor="middle" fill="#ff7b72" font-size="10">Thread Injection</text>
  <text x="315" y="110" text-anchor="middle" fill="#c9d1d9" font-size="9">OpenProcess</text>
  <text x="315" y="125" text-anchor="middle" fill="#c9d1d9" font-size="9">VirtualAllocEx + WriteProcessMemory</text>
  <text x="315" y="140" text-anchor="middle" fill="#c9d1d9" font-size="9">CreateRemoteThread</text>
  <text x="500" y="115" text-anchor="middle" fill="#c9d1d9" font-size="9">RWX memory, cross-process handle</text>
  <text x="500" y="130" text-anchor="middle" fill="#c9d1d9" font-size="9">remote thread, API telemetry</text>
  <text x="665" y="120" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">HIGH</text>
  <rect x="810" y="105" width="100" height="20" rx="4" fill="#3d1010" stroke="#f85149" stroke-width="1"/>
  <text x="860" y="120" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">LOW</text>
  <!-- Row 2: APC -->
  <rect x="30" y="156" width="940" height="65" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
  <text x="135" y="183" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">APC Injection</text>
  <text x="315" y="178" text-anchor="middle" fill="#c9d1d9" font-size="9">OpenProcess + VirtualAllocEx</text>
  <text x="315" y="193" text-anchor="middle" fill="#c9d1d9" font-size="9">WriteProcessMemory</text>
  <text x="315" y="208" text-anchor="middle" fill="#c9d1d9" font-size="9">QueueUserAPC</text>
  <text x="500" y="183" text-anchor="middle" fill="#c9d1d9" font-size="9">RWX memory, APC queue</text>
  <text x="500" y="198" text-anchor="middle" fill="#c9d1d9" font-size="9">No new thread (uses alertable)</text>
  <text x="665" y="188" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">MEDIUM-HIGH</text>
  <rect x="810" y="178" width="100" height="20" rx="4" fill="#2d1a00" stroke="#f0883e" stroke-width="1"/>
  <text x="860" y="193" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">MEDIUM</text>
  <!-- Row 3: Named Pipe -->
  <rect x="30" y="224" width="940" height="65" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
  <text x="135" y="251" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">Named Pipe IPC</text>
  <text x="315" y="246" text-anchor="middle" fill="#c9d1d9" font-size="9">CreateNamedPipe + ConnectNamedPipe</text>
  <text x="315" y="261" text-anchor="middle" fill="#c9d1d9" font-size="9">WriteFile / ReadFile</text>
  <text x="315" y="276" text-anchor="middle" fill="#c9d1d9" font-size="9">(no cross-process memory APIs)</text>
  <text x="500" y="251" text-anchor="middle" fill="#c9d1d9" font-size="9">Named pipe object, no RWX alloc</text>
  <text x="500" y="266" text-anchor="middle" fill="#c9d1d9" font-size="9">Legitimate IPC mechanism</text>
  <text x="665" y="256" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">LOW</text>
  <rect x="810" y="246" width="100" height="20" rx="4" fill="#0a2e0a" stroke="#3fb950" stroke-width="1"/>
  <text x="860" y="261" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">HIGH</text>
  <!-- Row 4: Console Pipe -->
  <rect x="30" y="292" width="940" height="65" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
  <text x="135" y="319" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">Console Pipe</text>
  <text x="135" y="336" text-anchor="middle" fill="#7ee787" font-size="10">(conhost)</text>
  <text x="315" y="314" text-anchor="middle" fill="#c9d1d9" font-size="9">AllocConsole + GetStdHandle</text>
  <text x="315" y="329" text-anchor="middle" fill="#c9d1d9" font-size="9">WriteFile (stdout/stdin redirect)</text>
  <text x="315" y="344" text-anchor="middle" fill="#c9d1d9" font-size="9">\\Device\\ConDrv namespace</text>
  <text x="500" y="319" text-anchor="middle" fill="#c9d1d9" font-size="9">Console subsystem, conhost.exe</text>
  <text x="500" y="334" text-anchor="middle" fill="#c9d1d9" font-size="9">Bypasses \\.\pipe\ monitoring</text>
  <text x="665" y="324" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">VERY LOW</text>
  <rect x="810" y="314" width="100" height="20" rx="4" fill="#0a2e0a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="860" y="329" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">VERY HIGH</text>
  <!-- Row 5: PEB Poisoning -->
  <rect x="30" y="360" width="940" height="65" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
  <text x="135" y="387" text-anchor="middle" fill="#d2a8ff" font-size="11" font-weight="bold">PEB Poisoning</text>
  <text x="135" y="404" text-anchor="middle" fill="#b392d6" font-size="10">(masquerade)</text>
  <text x="315" y="382" text-anchor="middle" fill="#c9d1d9" font-size="9">CreateProcess(SUSPENDED)</text>
  <text x="315" y="397" text-anchor="middle" fill="#c9d1d9" font-size="9">NtQueryInformationProcess</text>
  <text x="315" y="412" text-anchor="middle" fill="#c9d1d9" font-size="9">WriteProcessMemory (PEB strings)</text>
  <text x="500" y="387" text-anchor="middle" fill="#c9d1d9" font-size="9">PEB mismatch (userland vs kernel)</text>
  <text x="500" y="402" text-anchor="middle" fill="#c9d1d9" font-size="9">Suspended process, modified params</text>
  <text x="665" y="392" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">LOW</text>
  <rect x="810" y="382" width="100" height="20" rx="4" fill="#0a2e0a" stroke="#3fb950" stroke-width="1"/>
  <text x="860" y="397" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">HIGH</text>
  <!-- Bottom note -->
  <rect x="30" y="440" width="940" height="30" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="500" y="460" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">Lower API footprint = harder to detect | Named pipe + PEB poisoning combinations are most evasive</text>
</svg>