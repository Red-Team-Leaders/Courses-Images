<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 530" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="aw" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#58a6ff"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
  </defs>
  <rect width="950" height="530" fill="url(#bg)"/>
  <text x="475" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Named Pipe IPC Architecture — Process Injection via Pipes</text>
  <!-- Server Process -->
  <rect x="40" y="60" width="260" height="140" rx="10" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="170" y="85" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">Pipe Server</text>
  <text x="60" y="110" fill="#c9d1d9" font-size="10">CreateNamedPipe(</text>
  <text x="70" y="126" fill="#7ee787" font-size="10">"\\\\.\\pipe\\EvilPipe",</text>
  <text x="70" y="142" fill="#7ee787" font-size="10">PIPE_ACCESS_DUPLEX)</text>
  <text x="60" y="162" fill="#c9d1d9" font-size="10">ConnectNamedPipe(hPipe)</text>
  <text x="60" y="178" fill="#c9d1d9" font-size="10">WriteFile(hPipe, shellcode)</text>
  <!-- Client Process -->
  <rect x="650" y="60" width="260" height="140" rx="10" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
  <text x="780" y="85" text-anchor="middle" fill="#f0883e" font-size="14" font-weight="bold">Pipe Client</text>
  <text x="670" y="110" fill="#c9d1d9" font-size="10">CreateFile(</text>
  <text x="680" y="126" fill="#ffa657" font-size="10">"\\\\.\\pipe\\EvilPipe")</text>
  <text x="670" y="146" fill="#c9d1d9" font-size="10">ReadFile(hPipe, buffer)</text>
  <text x="670" y="166" fill="#c9d1d9" font-size="10">VirtualAlloc(RWX)</text>
  <text x="670" y="186" fill="#c9d1d9" font-size="10">Execute shellcode</text>
  <!-- Pipe connection -->
  <line x1="300" y1="130" x2="645" y2="130" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#aw)"/>
  <rect x="390" y="112" width="170" height="35" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="475" y="134" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">\\.\pipe\EvilPipe</text>
  <!-- Console Pipe variant -->
  <text x="475" y="240" text-anchor="middle" fill="#d2a8ff" font-size="14" font-weight="bold">Console Named Pipe Variant (conhost.exe)</text>
  <rect x="40" y="260" width="200" height="80" rx="8" fill="#0d1117" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="140" y="285" text-anchor="middle" fill="#d2a8ff" font-size="12">Malicious Process</text>
  <text x="60" y="310" fill="#b392d6" font-size="10">AllocConsole()</text>
  <text x="60" y="326" fill="#b392d6" font-size="10">GetStdHandle()</text>
  <rect x="300" y="260" width="200" height="80" rx="8" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
  <text x="400" y="285" text-anchor="middle" fill="#c9d1d9" font-size="12">conhost.exe</text>
  <text x="320" y="310" fill="#8b949e" font-size="10">Console host process</text>
  <text x="320" y="326" fill="#8b949e" font-size="10">\\Device\\ConDrv\\</text>
  <rect x="560" y="260" width="200" height="80" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="1.5"/>
  <text x="660" y="285" text-anchor="middle" fill="#f85149" font-size="12">Target Process</text>
  <text x="580" y="310" fill="#ff7b72" font-size="10">Reads console pipe</text>
  <text x="580" y="326" fill="#ff7b72" font-size="10">Shellcode delivered</text>
  <!-- Arrows -->
  <line x1="240" y1="300" x2="295" y2="300" stroke="#d2a8ff" stroke-width="1.5" marker-end="url(#aw)"/>
  <line x1="500" y1="300" x2="555" y2="300" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ao)"/>
  <!-- Detection section -->
  <text x="475" y="380" text-anchor="middle" fill="#f85149" font-size="14" font-weight="bold">Detection Points</text>
  <rect x="40" y="395" width="260" height="55" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="170" y="418" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">Sysmon Event 17</text>
  <text x="170" y="438" text-anchor="middle" fill="#7ee787" font-size="10">PipeCreated (server-side)</text>
  <rect x="345" y="395" width="260" height="55" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="475" y="418" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">Sysmon Event 18</text>
  <text x="475" y="438" text-anchor="middle" fill="#7ee787" font-size="10">PipeConnected (client-side)</text>
  <rect x="650" y="395" width="260" height="55" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1"/>
  <text x="780" y="418" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">ETW Provider</text>
  <text x="780" y="438" text-anchor="middle" fill="#ffa657" font-size="10">Microsoft-Windows-Kernel-File</text>
  <!-- Bottom note -->
  <rect x="40" y="470" width="870" height="45" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="475" y="490" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">Console pipes bypass standard \\.\pipe\ namespace monitoring</text>
  <text x="475" y="507" text-anchor="middle" fill="#8b949e" font-size="10">Ref: thenextgentechinsider.com — EDR Evasion via Console Named Pipes</text>
</svg>