<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f0f23"/><stop offset="100%" stop-color="#1a1a3e"/></linearGradient>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#00d4aa"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ff6b6b"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#74b9ff"/></marker>
    <marker id="aY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ffeaa7"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#a29bfe"/></marker>
  </defs>

  <rect width="900" height="540" fill="url(#bg)" rx="12"/>

  <text x="450" y="32" text-anchor="middle" fill="#00d4aa" font-size="18" font-weight="700">Fiber-Based Shellcode Execution</text>
  <text x="450" y="50" text-anchor="middle" fill="#636e72" font-size="11">No thread creation — No kernel callback — Pure user-mode switching</text>

  <!-- Left side: Thread execution (DETECTED) -->
  <rect x="30" y="70" width="380" height="200" rx="10" fill="#1e1e3a" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="220" y="92" text-anchor="middle" fill="#ff6b6b" font-size="13" font-weight="700">Traditional: CreateThread</text>
  <rect x="50" y="105" width="140" height="35" rx="6" fill="#ff6b6b" opacity="0.15" stroke="#ff6b6b" stroke-width="1"/>
  <text x="120" y="127" text-anchor="middle" fill="#ff6b6b" font-size="10">CreateThread(sc)</text>
  <line x1="190" y1="122" x2="230" y2="122" stroke="#ff6b6b" stroke-width="1.5" marker-end="url(#aR)"/>
  <rect x="230" y="105" width="160" height="35" rx="6" fill="#ff6b6b" opacity="0.1" stroke="#ff6b6b" stroke-width="1"/>
  <text x="310" y="121" text-anchor="middle" fill="#ff6b6b" font-size="9">NtCreateThreadEx</text>
  <text x="310" y="133" text-anchor="middle" fill="#636e72" font-size="8">SYSCALL to kernel</text>

  <line x1="310" y1="140" x2="310" y2="165" stroke="#ff6b6b" stroke-width="1.5" marker-end="url(#aR)"/>

  <rect x="200" y="165" width="180" height="35" rx="6" fill="#ff6b6b" opacity="0.1" stroke="#ff6b6b" stroke-width="1"/>
  <text x="290" y="181" text-anchor="middle" fill="#ff6b6b" font-size="9">PsSetCreateThreadNotifyRoutine</text>
  <text x="290" y="193" text-anchor="middle" fill="#636e72" font-size="8">KERNEL CALLBACK FIRES</text>

  <line x1="290" y1="200" x2="290" y2="225" stroke="#ff6b6b" stroke-width="1.5" marker-end="url(#aR)"/>

  <rect x="210" y="225" width="160" height="30" rx="6" fill="#ff6b6b" opacity="0.2" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="290" y="244" text-anchor="middle" fill="#ff6b6b" font-size="11" font-weight="700">EDR: DETECTED</text>

  <!-- Right side: Fiber execution (EVASIVE) -->
  <rect x="440" y="70" width="430" height="200" rx="10" fill="#1e1e3a" stroke="#00d4aa" stroke-width="1.5"/>
  <text x="655" y="92" text-anchor="middle" fill="#00d4aa" font-size="13" font-weight="700">Fiber: SwitchToFiber</text>

  <rect x="460" y="105" width="170" height="35" rx="6" fill="#00d4aa" opacity="0.15" stroke="#00d4aa" stroke-width="1"/>
  <text x="545" y="121" text-anchor="middle" fill="#00d4aa" font-size="10">ConvertThreadToFiber</text>
  <text x="545" y="133" text-anchor="middle" fill="#636e72" font-size="8">Sets TEB fiber fields</text>

  <line x1="630" y1="122" x2="660" y2="122" stroke="#00d4aa" stroke-width="1.5" marker-end="url(#aG)"/>

  <rect x="660" y="105" width="140" height="35" rx="6" fill="#00d4aa" opacity="0.15" stroke="#00d4aa" stroke-width="1"/>
  <text x="730" y="121" text-anchor="middle" fill="#00d4aa" font-size="10">CreateFiber(sc)</text>
  <text x="730" y="133" text-anchor="middle" fill="#636e72" font-size="8">HeapAlloc only</text>

  <line x1="730" y1="140" x2="730" y2="165" stroke="#00d4aa" stroke-width="1.5" marker-end="url(#aG)"/>

  <rect x="620" y="165" width="220" height="35" rx="6" fill="#00d4aa" opacity="0.15" stroke="#00d4aa" stroke-width="1"/>
  <text x="730" y="181" text-anchor="middle" fill="#00d4aa" font-size="10">SwitchToFiber(shellcode)</text>
  <text x="730" y="193" text-anchor="middle" fill="#636e72" font-size="8">User-mode register swap ONLY</text>

  <line x1="730" y1="200" x2="730" y2="225" stroke="#00d4aa" stroke-width="1.5" marker-end="url(#aG)"/>

  <rect x="640" y="225" width="180" height="30" rx="6" fill="#00d4aa" opacity="0.2" stroke="#00d4aa" stroke-width="1.5"/>
  <text x="730" y="244" text-anchor="middle" fill="#00d4aa" font-size="11" font-weight="700">No kernel callback!</text>

  <!-- Middle comparison badges -->
  <rect x="395" y="130" width="60" height="22" rx="11" fill="#ff6b6b" opacity="0.3"/>
  <text x="425" y="145" text-anchor="middle" fill="#ff6b6b" font-size="9" font-weight="700">Ring 0</text>

  <rect x="395" y="160" width="60" height="22" rx="11" fill="#00d4aa" opacity="0.3"/>
  <text x="425" y="175" text-anchor="middle" fill="#00d4aa" font-size="9" font-weight="700">Ring 3</text>

  <!-- Bottom: Sleep Obfuscation with Fibers -->
  <text x="450" y="305" text-anchor="middle" fill="#a29bfe" font-size="14" font-weight="700">Fiber Sleep Obfuscation Pattern</text>

  <!-- Main Fiber Lane -->
  <rect x="50" y="325" width="120" height="25" rx="5" fill="#74b9ff" opacity="0.2" stroke="#74b9ff" stroke-width="1"/>
  <text x="110" y="342" text-anchor="middle" fill="#74b9ff" font-size="10" font-weight="600">Main Fiber</text>

  <!-- Shellcode Fiber Lane -->
  <rect x="50" y="420" width="120" height="25" rx="5" fill="#ffeaa7" opacity="0.2" stroke="#ffeaa7" stroke-width="1"/>
  <text x="110" y="437" text-anchor="middle" fill="#ffeaa7" font-size="10" font-weight="600">SC Fiber</text>

  <!-- Timeline -->
  <!-- Phase 1: Switch to SC -->
  <line x1="200" y1="337" x2="200" y2="432" stroke="#00d4aa" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#aG)"/>
  <text x="205" y="385" fill="#00d4aa" font-size="8">Switch</text>

  <!-- SC executes -->
  <rect x="210" y="425" width="100" height="20" rx="4" fill="#ffeaa7" opacity="0.3"/>
  <text x="260" y="439" text-anchor="middle" fill="#ffeaa7" font-size="8">Execute</text>

  <!-- Phase 2: Yield back -->
  <line x1="320" y1="432" x2="320" y2="337" stroke="#ffeaa7" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#aY)"/>
  <text x="325" y="385" fill="#ffeaa7" font-size="8">Yield</text>

  <!-- Main encrypts + sleeps -->
  <rect x="330" y="325" width="80" height="20" rx="4" fill="#ff6b6b" opacity="0.3"/>
  <text x="370" y="339" text-anchor="middle" fill="#ff6b6b" font-size="8">Encrypt</text>

  <rect x="415" y="325" width="70" height="20" rx="4" fill="#636e72" opacity="0.3"/>
  <text x="450" y="339" text-anchor="middle" fill="#636e72" font-size="8">Sleep</text>

  <rect x="490" y="325" width="80" height="20" rx="4" fill="#00d4aa" opacity="0.3"/>
  <text x="530" y="339" text-anchor="middle" fill="#00d4aa" font-size="8">Decrypt</text>

  <!-- Phase 3: Switch back -->
  <line x1="580" y1="337" x2="580" y2="432" stroke="#00d4aa" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#aG)"/>
  <text x="585" y="385" fill="#00d4aa" font-size="8">Switch</text>

  <!-- SC continues -->
  <rect x="590" y="425" width="100" height="20" rx="4" fill="#ffeaa7" opacity="0.3"/>
  <text x="640" y="439" text-anchor="middle" fill="#ffeaa7" font-size="8">Continue</text>

  <!-- Yield again -->
  <line x1="700" y1="432" x2="700" y2="337" stroke="#ffeaa7" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#aY)"/>
  <text x="705" y="385" fill="#ffeaa7" font-size="8">Yield</text>

  <!-- Repeat -->
  <rect x="710" y="325" width="80" height="20" rx="4" fill="#ff6b6b" opacity="0.3"/>
  <text x="750" y="339" text-anchor="middle" fill="#ff6b6b" font-size="8">Encrypt</text>

  <rect x="795" y="325" width="70" height="20" rx="4" fill="#636e72" opacity="0.3"/>
  <text x="830" y="339" text-anchor="middle" fill="#636e72" font-size="8">Sleep...</text>

  <!-- Labels at bottom -->
  <rect x="200" y="470" width="12" height="12" rx="3" fill="#ff6b6b" opacity="0.5"/>
  <text x="218" y="481" fill="#b2bec3" font-size="9">Shellcode encrypted in memory</text>

  <rect x="420" y="470" width="12" height="12" rx="3" fill="#ffeaa7" opacity="0.5"/>
  <text x="438" y="481" fill="#b2bec3" font-size="9">Shellcode executing (cleartext)</text>

  <rect x="640" y="470" width="12" height="12" rx="3" fill="#636e72" opacity="0.5"/>
  <text x="658" y="481" fill="#b2bec3" font-size="9">Process sleeping (safe from scan)</text>

  <!-- Key insight box -->
  <rect x="180" y="495" width="540" height="30" rx="8" fill="#00d4aa" opacity="0.08" stroke="#00d4aa" stroke-width="1"/>
  <text x="450" y="514" text-anchor="middle" fill="#00d4aa" font-size="10">SwitchToFiber = mov rsp/rbx/rbp + ret — No syscall, no kernel transition, no EDR notification</text>
</svg>
