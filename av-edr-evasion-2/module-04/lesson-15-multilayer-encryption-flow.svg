<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bgE" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f0f23"/><stop offset="100%" stop-color="#1a1a3e"/></linearGradient>
    <marker id="aGe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#00d4aa"/></marker>
    <marker id="aRe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ff6b6b"/></marker>
    <marker id="aBe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#74b9ff"/></marker>
    <marker id="aYe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ffeaa7"/></marker>
    <marker id="aPe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#a29bfe"/></marker>
  </defs>

  <rect width="900" height="580" fill="url(#bgE)" rx="12"/>

  <text x="450" y="32" text-anchor="middle" fill="#00d4aa" font-size="18" font-weight="700">Multi-Layer Encryption &amp; Staged Decryption</text>

  <!-- BUILD TIME (Left) -->
  <rect x="30" y="55" width="400" height="260" rx="10" fill="#1e1e3a" stroke="#a29bfe" stroke-width="1.5"/>
  <text x="230" y="78" text-anchor="middle" fill="#a29bfe" font-size="13" font-weight="700">BUILD TIME (Encryption)</text>

  <!-- Plaintext -->
  <rect x="55" y="92" width="350" height="32" rx="6" fill="#00d4aa" opacity="0.15" stroke="#00d4aa" stroke-width="1"/>
  <text x="230" y="108" text-anchor="middle" fill="#00d4aa" font-size="10" font-family="Consolas, monospace">FC 48 83 E4 F0 ... (plaintext shellcode)</text>
  <text x="230" y="122" text-anchor="middle" fill="#636e72" font-size="8">Entropy: 5.8 bits/byte</text>

  <line x1="230" y1="130" x2="230" y2="148" stroke="#74b9ff" stroke-width="1.5" marker-end="url(#aBe)"/>
  <text x="290" y="142" fill="#74b9ff" font-size="9">Layer 1: XOR + position</text>

  <!-- After XOR -->
  <rect x="55" y="150" width="350" height="26" rx="6" fill="#74b9ff" opacity="0.1" stroke="#74b9ff" stroke-width="1"/>
  <text x="230" y="168" text-anchor="middle" fill="#74b9ff" font-size="10" font-family="Consolas, monospace">8B EC 48 83 ... (XOR encrypted)</text>

  <line x1="230" y1="180" x2="230" y2="198" stroke="#ffeaa7" stroke-width="1.5" marker-end="url(#aYe)"/>
  <text x="290" y="192" fill="#ffeaa7" font-size="9">Layer 2: AES-256-CBC</text>

  <!-- After AES -->
  <rect x="55" y="200" width="350" height="26" rx="6" fill="#ffeaa7" opacity="0.1" stroke="#ffeaa7" stroke-width="1"/>
  <text x="230" y="218" text-anchor="middle" fill="#ffeaa7" font-size="10" font-family="Consolas, monospace">7A C3 19 D8 ... (AES encrypted)</text>

  <line x1="230" y1="230" x2="230" y2="248" stroke="#ff6b6b" stroke-width="1.5" marker-end="url(#aRe)"/>
  <text x="290" y="242" fill="#ff6b6b" font-size="9">Layer 3: RC4</text>

  <!-- After RC4 -->
  <rect x="55" y="250" width="350" height="32" rx="6" fill="#ff6b6b" opacity="0.15" stroke="#ff6b6b" stroke-width="1"/>
  <text x="230" y="266" text-anchor="middle" fill="#ff6b6b" font-size="10" font-family="Consolas, monospace">B6 02 C9 AE ... (3-layer encrypted)</text>
  <text x="230" y="280" text-anchor="middle" fill="#636e72" font-size="8">Entropy: 7.9 bits/byte (stored in binary)</text>

  <!-- RUNTIME (Right) -->
  <rect x="460" y="55" width="410" height="260" rx="10" fill="#1e1e3a" stroke="#00d4aa" stroke-width="1.5"/>
  <text x="665" y="78" text-anchor="middle" fill="#00d4aa" font-size="13" font-weight="700">RUNTIME (Decryption)</text>

  <!-- Encrypted -->
  <rect x="485" y="92" width="360" height="26" rx="6" fill="#ff6b6b" opacity="0.15" stroke="#ff6b6b" stroke-width="1"/>
  <text x="665" y="109" text-anchor="middle" fill="#ff6b6b" font-size="10" font-family="Consolas, monospace">B6 02 C9 AE ... (from .data)</text>

  <line x1="665" y1="122" x2="665" y2="140" stroke="#ff6b6b" stroke-width="1.5" marker-end="url(#aRe)"/>
  <text x="740" y="134" fill="#ff6b6b" font-size="9">RC4 decrypt (static key)</text>

  <rect x="485" y="142" width="360" height="26" rx="6" fill="#ffeaa7" opacity="0.1" stroke="#ffeaa7" stroke-width="1"/>
  <text x="665" y="159" text-anchor="middle" fill="#ffeaa7" font-size="10" font-family="Consolas, monospace">7A C3 19 D8 ... (RC4 removed)</text>

  <line x1="665" y1="172" x2="665" y2="190" stroke="#ffeaa7" stroke-width="1.5" marker-end="url(#aYe)"/>
  <text x="740" y="184" fill="#ffeaa7" font-size="9">AES decrypt (env key!)</text>

  <!-- Environment key derivation box -->
  <rect x="485" y="192" width="165" height="60" rx="6" fill="#a29bfe" opacity="0.1" stroke="#a29bfe" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="567" y="210" text-anchor="middle" fill="#a29bfe" font-size="9" font-weight="600">Environment Key:</text>
  <text x="567" y="224" text-anchor="middle" fill="#636e72" font-size="8">SHA256(hostname +</text>
  <text x="567" y="236" text-anchor="middle" fill="#636e72" font-size="8">domain + vol_serial)</text>
  <text x="567" y="248" text-anchor="middle" fill="#ff6b6b" font-size="8">Wrong env = garbage!</text>

  <rect x="665" y="192" width="180" height="26" rx="6" fill="#74b9ff" opacity="0.1" stroke="#74b9ff" stroke-width="1"/>
  <text x="755" y="209" text-anchor="middle" fill="#74b9ff" font-size="10" font-family="Consolas, monospace">8B EC 48 83 ...</text>

  <line x1="755" y1="222" x2="755" y2="240" stroke="#74b9ff" stroke-width="1.5" marker-end="url(#aBe)"/>
  <text x="810" y="234" fill="#74b9ff" font-size="9">XOR decrypt</text>

  <rect x="665" y="242" width="180" height="32" rx="6" fill="#00d4aa" opacity="0.2" stroke="#00d4aa" stroke-width="1.5"/>
  <text x="755" y="258" text-anchor="middle" fill="#00d4aa" font-size="10" font-family="Consolas, monospace">FC 48 83 E4 F0</text>
  <text x="755" y="272" text-anchor="middle" fill="#00d4aa" font-size="8" font-weight="600">PLAINTEXT — Execute!</text>

  <!-- Staged Decryption (Bottom) -->
  <text x="450" y="340" text-anchor="middle" fill="#a29bfe" font-size="14" font-weight="700">Staged Decryption with Self-Erase</text>

  <!-- Stage 0 -->
  <rect x="30" y="360" width="170" height="90" rx="8" fill="#1e1e3a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="115" y="382" text-anchor="middle" fill="#ff6b6b" font-size="11" font-weight="700">Stage 0</text>
  <text x="115" y="398" text-anchor="middle" fill="#dfe6e9" font-size="9">Binary on disk</text>
  <rect x="45" y="408" width="65" height="18" rx="4" fill="#ffeaa7" opacity="0.2"/><text x="77" y="420" text-anchor="middle" fill="#ffeaa7" font-size="8">RC4 Stub</text>
  <rect x="115" y="408" width="70" height="18" rx="4" fill="#ff6b6b" opacity="0.2"/><text x="150" y="420" text-anchor="middle" fill="#ff6b6b" font-size="8">AES Payload</text>
  <text x="115" y="442" text-anchor="middle" fill="#636e72" font-size="8">Everything encrypted</text>

  <line x1="200" y1="405" x2="240" y2="405" stroke="#00d4aa" stroke-width="1.5" marker-end="url(#aGe)"/>

  <!-- Stage 1 -->
  <rect x="240" y="360" width="190" height="90" rx="8" fill="#1e1e3a" stroke="#ffeaa7" stroke-width="1"/>
  <text x="335" y="382" text-anchor="middle" fill="#ffeaa7" font-size="11" font-weight="700">Stage 1</text>
  <text x="335" y="398" text-anchor="middle" fill="#dfe6e9" font-size="9">RC4 decrypt stub</text>
  <text x="335" y="415" text-anchor="middle" fill="#a29bfe" font-size="9">Derive env key</text>
  <text x="335" y="430" text-anchor="middle" fill="#ffeaa7" font-size="9">AES decrypt payload</text>
  <text x="335" y="445" text-anchor="middle" fill="#636e72" font-size="8">Then: self-erase!</text>

  <line x1="430" y1="405" x2="470" y2="405" stroke="#00d4aa" stroke-width="1.5" marker-end="url(#aGe)"/>

  <!-- Self-erase indicator -->
  <rect x="275" y="455" width="120" height="22" rx="6" fill="#ff6b6b" opacity="0.2" stroke="#ff6b6b" stroke-width="1"/>
  <text x="335" y="470" text-anchor="middle" fill="#ff6b6b" font-size="9">SecureZeroMemory</text>

  <!-- Stage 2 -->
  <rect x="470" y="360" width="190" height="90" rx="8" fill="#1e1e3a" stroke="#00d4aa" stroke-width="1.5"/>
  <rect x="470" y="360" width="190" height="90" rx="8" fill="#00d4aa" opacity="0.05"/>
  <text x="565" y="382" text-anchor="middle" fill="#00d4aa" font-size="11" font-weight="700">Stage 2</text>
  <text x="565" y="398" text-anchor="middle" fill="#dfe6e9" font-size="9">Decrypted shellcode</text>
  <text x="565" y="415" text-anchor="middle" fill="#00d4aa" font-size="9">VirtualProtect(RX)</text>
  <text x="565" y="432" text-anchor="middle" fill="#00d4aa" font-size="10" font-weight="600">EXECUTE</text>
  <text x="565" y="445" text-anchor="middle" fill="#636e72" font-size="8">Stage 1 is gone from memory</text>

  <!-- Memory state at Stage 2 -->
  <rect x="690" y="360" width="180" height="90" rx="8" fill="#1e1e3a" stroke="#636e72" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="780" y="382" text-anchor="middle" fill="#636e72" font-size="11" font-weight="600">Memory State</text>
  <text x="710" y="402" fill="#ff6b6b" font-size="9" font-family="Consolas, monospace">Stub:  00 00 00 00</text>
  <text x="710" y="417" fill="#636e72" font-size="8">           (zeroed)</text>
  <text x="710" y="437" fill="#00d4aa" font-size="9" font-family="Consolas, monospace">SC:    FC 48 83 E4</text>
  <text x="710" y="452" fill="#636e72" font-size="8">           (running)</text>

  <!-- Bottom: Why multi-layer -->
  <rect x="60" y="495" width="200" height="65" rx="8" fill="#ff6b6b" opacity="0.08" stroke="#ff6b6b" stroke-width="1"/>
  <text x="160" y="515" text-anchor="middle" fill="#ff6b6b" font-size="10" font-weight="600">Single XOR</text>
  <text x="160" y="532" text-anchor="middle" fill="#636e72" font-size="9">256 keys brute-forced</text>
  <text x="160" y="548" text-anchor="middle" fill="#636e72" font-size="9">in milliseconds</text>

  <rect x="290" y="495" width="200" height="65" rx="8" fill="#ffeaa7" opacity="0.08" stroke="#ffeaa7" stroke-width="1"/>
  <text x="390" y="515" text-anchor="middle" fill="#ffeaa7" font-size="10" font-weight="600">Static AES Key</text>
  <text x="390" y="532" text-anchor="middle" fill="#636e72" font-size="9">Key extracted from</text>
  <text x="390" y="548" text-anchor="middle" fill="#636e72" font-size="9">binary by analyst</text>

  <rect x="520" y="495" width="200" height="65" rx="8" fill="#00d4aa" opacity="0.08" stroke="#00d4aa" stroke-width="1.5"/>
  <text x="620" y="515" text-anchor="middle" fill="#00d4aa" font-size="10" font-weight="600">Multi-Layer + Env Key</text>
  <text x="620" y="532" text-anchor="middle" fill="#00d4aa" font-size="9">Key not in binary</text>
  <text x="620" y="548" text-anchor="middle" fill="#00d4aa" font-size="9">Sandbox can't decrypt</text>

  <!-- Checkmarks -->
  <text x="750" y="515" fill="#ff6b6b" font-size="16">✗</text>
  <text x="750" y="540" fill="#ff6b6b" font-size="9">Broken</text>
  <text x="780" y="515" fill="#ffeaa7" font-size="16">△</text>
  <text x="780" y="540" fill="#ffeaa7" font-size="9">Weak</text>
  <text x="815" y="515" fill="#00d4aa" font-size="16">✓</text>
  <text x="815" y="540" fill="#00d4aa" font-size="9">Strong</text>
</svg>
