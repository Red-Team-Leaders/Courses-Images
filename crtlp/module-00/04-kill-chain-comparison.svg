<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="'Segoe UI', sans-serif">
  <defs>
    <marker id="arr00b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00d4ff"/>
    </marker>
    <linearGradient id="bg00b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg00b)" rx="12"/>
  <text x="400" y="35" text-anchor="middle" fill="#00d4ff" font-size="18" font-weight="bold">Kill Chain: Lockheed Martin vs Unified</text>
  <text x="400" y="52" text-anchor="middle" fill="#8b949e" font-size="11">Comparação de modelos — resolução e cobertura</text>

  <!-- Lockheed Martin Kill Chain -->
  <text x="400" y="82" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="bold">Lockheed Martin Cyber Kill Chain (7 Fases)</text>

  <!-- 7 phases horizontal -->
  <rect x="20" y="95" width="100" height="50" rx="6" fill="#1c2333" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="70" y="117" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="bold">Recon</text>
  <text x="70" y="132" text-anchor="middle" fill="#8b949e" font-size="8">TA0043</text>
  <line x1="120" y1="120" x2="130" y2="120" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arr00b)"/>

  <rect x="130" y="95" width="100" height="50" rx="6" fill="#1c2333" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="180" y="117" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="bold">Weaponization</text>
  <text x="180" y="132" text-anchor="middle" fill="#8b949e" font-size="8">TA0042</text>
  <line x1="230" y1="120" x2="240" y2="120" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arr00b)"/>

  <rect x="240" y="95" width="100" height="50" rx="6" fill="#1c2333" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="290" y="117" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="bold">Delivery</text>
  <text x="290" y="132" text-anchor="middle" fill="#8b949e" font-size="8">T1566/T1190</text>
  <line x1="340" y1="120" x2="350" y2="120" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arr00b)"/>

  <rect x="350" y="95" width="100" height="50" rx="6" fill="#1c2333" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="400" y="117" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="bold">Exploitation</text>
  <text x="400" y="132" text-anchor="middle" fill="#8b949e" font-size="8">T1203</text>
  <line x1="450" y1="120" x2="460" y2="120" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arr00b)"/>

  <rect x="460" y="95" width="100" height="50" rx="6" fill="#1c2333" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="510" y="117" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="bold">Installation</text>
  <text x="510" y="132" text-anchor="middle" fill="#8b949e" font-size="8">T1059</text>
  <line x1="560" y1="120" x2="570" y2="120" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arr00b)"/>

  <rect x="570" y="95" width="100" height="50" rx="6" fill="#1c2333" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="620" y="117" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="bold">C2</text>
  <text x="620" y="132" text-anchor="middle" fill="#8b949e" font-size="8">TA0011</text>
  <line x1="670" y1="120" x2="680" y2="120" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arr00b)"/>

  <rect x="680" y="95" width="100" height="50" rx="6" fill="#1c2333" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="730" y="112" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="bold">Actions on</text>
  <text x="730" y="125" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="bold">Objectives</text>
  <text x="730" y="140" text-anchor="middle" fill="#8b949e" font-size="8">TA0009/10/40</text>

  <!-- Gap indicator -->
  <rect x="460" y="150" width="320" height="22" rx="4" fill="none" stroke="#f39c12" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="620" y="165" text-anchor="middle" fill="#f39c12" font-size="9">80% da complexidade do Red Team vive aqui — sub-descrito por Lockheed</text>

  <!-- Unified Kill Chain -->
  <text x="400" y="205" text-anchor="middle" fill="#4ecdc4" font-size="14" font-weight="bold">Unified Kill Chain (18 Fases, 3 Ciclos)</text>

  <!-- Cycle 1: Initial Foothold -->
  <rect x="20" y="220" width="240" height="175" rx="8" fill="#161b22" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="140" y="240" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="bold">Ciclo 1: Initial Foothold</text>

  <rect x="35" y="252" width="100" height="28" rx="4" fill="#1c2333" stroke="#ff6b6b" stroke-width="1"/>
  <text x="85" y="270" text-anchor="middle" fill="#e6edf3" font-size="9">Reconnaissance</text>
  <rect x="145" y="252" width="100" height="28" rx="4" fill="#1c2333" stroke="#ff6b6b" stroke-width="1"/>
  <text x="195" y="270" text-anchor="middle" fill="#e6edf3" font-size="9">Weaponization</text>

  <rect x="35" y="286" width="100" height="28" rx="4" fill="#1c2333" stroke="#ff6b6b" stroke-width="1"/>
  <text x="85" y="304" text-anchor="middle" fill="#e6edf3" font-size="9">Social Engineering</text>
  <rect x="145" y="286" width="100" height="28" rx="4" fill="#1c2333" stroke="#ff6b6b" stroke-width="1"/>
  <text x="195" y="304" text-anchor="middle" fill="#e6edf3" font-size="9">Exploitation</text>

  <rect x="35" y="320" width="100" height="28" rx="4" fill="#1c2333" stroke="#ff6b6b" stroke-width="1"/>
  <text x="85" y="338" text-anchor="middle" fill="#e6edf3" font-size="9">Persistence</text>
  <rect x="145" y="320" width="100" height="28" rx="4" fill="#1c2333" stroke="#ff6b6b" stroke-width="1"/>
  <text x="195" y="338" text-anchor="middle" fill="#e6edf3" font-size="9">Defense Evasion</text>

  <rect x="35" y="354" width="210" height="28" rx="4" fill="#1c2333" stroke="#ff6b6b" stroke-width="1"/>
  <text x="140" y="372" text-anchor="middle" fill="#e6edf3" font-size="9">Command and Control</text>

  <!-- Arrow 1->2 -->
  <line x1="260" y1="310" x2="280" y2="310" stroke="#00d4ff" stroke-width="2" marker-end="url(#arr00b)"/>

  <!-- Cycle 2: Network Propagation -->
  <rect x="280" y="220" width="240" height="175" rx="8" fill="#161b22" stroke="#a855f7" stroke-width="1.5"/>
  <text x="400" y="240" text-anchor="middle" fill="#a855f7" font-size="12" font-weight="bold">Ciclo 2: Network Propagation</text>

  <rect x="295" y="252" width="100" height="28" rx="4" fill="#1c2333" stroke="#a855f7" stroke-width="1"/>
  <text x="345" y="270" text-anchor="middle" fill="#e6edf3" font-size="9">Pivoting</text>
  <rect x="405" y="252" width="100" height="28" rx="4" fill="#1c2333" stroke="#a855f7" stroke-width="1"/>
  <text x="455" y="270" text-anchor="middle" fill="#e6edf3" font-size="9">Discovery</text>

  <rect x="295" y="286" width="100" height="28" rx="4" fill="#1c2333" stroke="#a855f7" stroke-width="1"/>
  <text x="345" y="304" text-anchor="middle" fill="#e6edf3" font-size="9">Priv Escalation</text>
  <rect x="405" y="286" width="100" height="28" rx="4" fill="#1c2333" stroke="#a855f7" stroke-width="1"/>
  <text x="455" y="304" text-anchor="middle" fill="#e6edf3" font-size="9">Execution</text>

  <rect x="295" y="320" width="100" height="28" rx="4" fill="#1c2333" stroke="#a855f7" stroke-width="1"/>
  <text x="345" y="338" text-anchor="middle" fill="#e6edf3" font-size="9">Credential Access</text>
  <rect x="405" y="320" width="100" height="28" rx="4" fill="#1c2333" stroke="#a855f7" stroke-width="1"/>
  <text x="455" y="338" text-anchor="middle" fill="#e6edf3" font-size="9">Lateral Movement</text>

  <!-- Arrow 2->3 -->
  <line x1="520" y1="310" x2="540" y2="310" stroke="#00d4ff" stroke-width="2" marker-end="url(#arr00b)"/>

  <!-- Cycle 3: Action on Objectives -->
  <rect x="540" y="220" width="240" height="175" rx="8" fill="#161b22" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="660" y="240" text-anchor="middle" fill="#4ecdc4" font-size="12" font-weight="bold">Ciclo 3: Actions on Objectives</text>

  <rect x="555" y="252" width="100" height="28" rx="4" fill="#1c2333" stroke="#4ecdc4" stroke-width="1"/>
  <text x="605" y="270" text-anchor="middle" fill="#e6edf3" font-size="9">Collection</text>
  <rect x="665" y="252" width="100" height="28" rx="4" fill="#1c2333" stroke="#4ecdc4" stroke-width="1"/>
  <text x="715" y="270" text-anchor="middle" fill="#e6edf3" font-size="9">Exfiltration</text>

  <rect x="555" y="286" width="100" height="28" rx="4" fill="#1c2333" stroke="#4ecdc4" stroke-width="1"/>
  <text x="605" y="304" text-anchor="middle" fill="#e6edf3" font-size="9">Impact</text>
  <rect x="665" y="286" width="100" height="28" rx="4" fill="#1c2333" stroke="#4ecdc4" stroke-width="1"/>
  <text x="715" y="304" text-anchor="middle" fill="#e6edf3" font-size="9">Objectives</text>

  <!-- Feedback loop from Cycle 3 back to Cycle 2 -->
  <path d="M660,395 L660,420 L400,420 L400,395" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arr00b)"/>
  <text x="530" y="435" text-anchor="middle" fill="#a855f7" font-size="9">Ciclos iterativos — pivoting repetido</text>

  <!-- CRTLP Lab mapping -->
  <text x="400" y="475" text-anchor="middle" fill="#00d4ff" font-size="13" font-weight="bold">Mapeamento CRTLP Lab</text>

  <rect x="30" y="490" width="230" height="40" rx="5" fill="#161b22" stroke="#ff6b6b" stroke-width="1"/>
  <text x="145" y="507" text-anchor="middle" fill="#ff6b6b" font-size="10" font-weight="bold">Initial Foothold</text>
  <text x="145" y="522" text-anchor="middle" fill="#8b949e" font-size="9">KALI &gt; LNX-WEB (cmd injection)</text>

  <rect x="280" y="490" width="240" height="40" rx="5" fill="#161b22" stroke="#a855f7" stroke-width="1"/>
  <text x="400" y="507" text-anchor="middle" fill="#a855f7" font-size="10" font-weight="bold">Network Propagation</text>
  <text x="400" y="522" text-anchor="middle" fill="#8b949e" font-size="9">Pivot EDGE &gt; CORP, Kerberoast, PrivEsc</text>

  <rect x="540" y="490" width="240" height="40" rx="5" fill="#161b22" stroke="#4ecdc4" stroke-width="1"/>
  <text x="660" y="507" text-anchor="middle" fill="#4ecdc4" font-size="10" font-weight="bold">Actions on Objectives</text>
  <text x="660" y="522" text-anchor="middle" fill="#8b949e" font-size="9">DA, exfil Finance$, persistence</text>

  <!-- Footer -->
  <text x="400" y="565" text-anchor="middle" fill="#484f58" font-size="9">Unified Kill Chain descreve o que Lockheed deixa como "Actions on Objectives"</text>
  <text x="400" y="582" text-anchor="middle" fill="#484f58" font-size="9">CRTLP — Module 00, Lesson 04</text>
</svg>