<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550" font-family="'Segoe UI', sans-serif">
  <defs>
    <marker id="arr01a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00d4ff"/>
    </marker>
    <marker id="arr01r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff6b6b"/>
    </marker>
    <marker id="arr01g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4ecdc4"/>
    </marker>
    <linearGradient id="bg01a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="550" fill="url(#bg01a)" rx="12"/>
  <text x="400" y="32" text-anchor="middle" fill="#00d4ff" font-size="18" font-weight="bold">Arquitetura C2 — 4 Primitivos</text>
  <text x="400" y="50" text-anchor="middle" fill="#8b949e" font-size="11">Implant, Listener, Stager, Beacon — Decomposição de um canal C2</text>

  <!-- Operator side -->
  <rect x="30" y="80" width="180" height="120" rx="10" fill="#161b22" stroke="#4ecdc4" stroke-width="2"/>
  <text x="120" y="105" text-anchor="middle" fill="#4ecdc4" font-size="13" font-weight="bold">Operator Console</text>
  <text x="120" y="125" text-anchor="middle" fill="#8b949e" font-size="10">GUI / CLI</text>
  <text x="120" y="145" text-anchor="middle" fill="#8b949e" font-size="9">Task queue, sessões,</text>
  <text x="120" y="160" text-anchor="middle" fill="#8b949e" font-size="9">RBAC, logs</text>
  <rect x="55" y="170" width="130" height="20" rx="4" fill="#1c2333" stroke="#4ecdc4" stroke-width="1"/>
  <text x="120" y="184" text-anchor="middle" fill="#4ecdc4" font-size="9">Sliver / Havoc GUI</text>

  <!-- Team Server -->
  <rect x="280" y="80" width="220" height="120" rx="10" fill="#161b22" stroke="#a855f7" stroke-width="2"/>
  <text x="390" y="102" text-anchor="middle" fill="#a855f7" font-size="13" font-weight="bold">Team Server</text>
  <text x="390" y="122" text-anchor="middle" fill="#8b949e" font-size="10">Coordenação central</text>

  <rect x="295" y="132" width="90" height="24" rx="4" fill="#1c2333" stroke="#a855f7" stroke-width="1"/>
  <text x="340" y="148" text-anchor="middle" fill="#e6edf3" font-size="9">LISTENER</text>
  <rect x="395" y="132" width="90" height="24" rx="4" fill="#1c2333" stroke="#a855f7" stroke-width="1"/>
  <text x="440" y="148" text-anchor="middle" fill="#e6edf3" font-size="9">Task Queue</text>

  <rect x="295" y="162" width="190" height="24" rx="4" fill="#1c2333" stroke="#a855f7" stroke-width="1"/>
  <text x="390" y="178" text-anchor="middle" fill="#e6edf3" font-size="9">Sessions DB + Crypto Keys</text>

  <!-- Arrow operator -> team server -->
  <line x1="210" y1="140" x2="278" y2="140" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arr01g)"/>
  <text x="245" y="133" text-anchor="middle" fill="#4ecdc4" font-size="8">gRPC/API</text>

  <!-- Redirector -->
  <rect x="570" y="80" width="200" height="120" rx="10" fill="#161b22" stroke="#f39c12" stroke-width="2"/>
  <text x="670" y="102" text-anchor="middle" fill="#f39c12" font-size="13" font-weight="bold">Redirector</text>
  <text x="670" y="122" text-anchor="middle" fill="#8b949e" font-size="10">Proxy filtrante (nginx)</text>

  <rect x="585" y="135" width="80" height="22" rx="4" fill="#1c2333" stroke="#4ecdc4" stroke-width="1"/>
  <text x="625" y="150" text-anchor="middle" fill="#4ecdc4" font-size="8">C2 Traffic</text>
  <rect x="675" y="135" width="80" height="22" rx="4" fill="#1c2333" stroke="#ff6b6b" stroke-width="1"/>
  <text x="715" y="150" text-anchor="middle" fill="#ff6b6b" font-size="8">Decoy Site</text>

  <rect x="585" y="165" width="170" height="22" rx="4" fill="#1c2333" stroke="#f39c12" stroke-width="1"/>
  <text x="670" y="180" text-anchor="middle" fill="#e6edf3" font-size="8">URI + User-Agent filter</text>

  <!-- Arrow team server -> redirector -->
  <line x1="500" y1="140" x2="568" y2="140" stroke="#a855f7" stroke-width="2" marker-end="url(#arr01a)"/>
  <text x="535" y="133" text-anchor="middle" fill="#8b949e" font-size="8">proxy_pass</text>

  <!-- Target Environment -->
  <rect x="150" y="280" width="500" height="240" rx="10" fill="#0d1117" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="400" y="300" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="bold">Ambiente Alvo (Target Network)</text>

  <!-- Implant box -->
  <rect x="180" y="320" width="190" height="90" rx="8" fill="#1c2333" stroke="#ff6b6b" stroke-width="2"/>
  <text x="275" y="342" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="bold">IMPLANT (Agent)</text>
  <text x="275" y="360" text-anchor="middle" fill="#8b949e" font-size="9">Código no alvo</text>
  <rect x="195" y="368" width="75" height="18" rx="3" fill="#161b22" stroke="#ff6b6b" stroke-width="1"/>
  <text x="233" y="381" text-anchor="middle" fill="#8b949e" font-size="7">Native PE</text>
  <rect x="278" y="368" width="75" height="18" rx="3" fill="#161b22" stroke="#ff6b6b" stroke-width="1"/>
  <text x="316" y="381" text-anchor="middle" fill="#8b949e" font-size="7">Shellcode</text>
  <text x="275" y="402" text-anchor="middle" fill="#484f58" font-size="8">Sleep, Jitter, Kill date</text>

  <!-- Stager box -->
  <rect x="420" y="320" width="190" height="90" rx="8" fill="#1c2333" stroke="#f39c12" stroke-width="2"/>
  <text x="515" y="342" text-anchor="middle" fill="#f39c12" font-size="12" font-weight="bold">STAGER</text>
  <text x="515" y="360" text-anchor="middle" fill="#8b949e" font-size="9">1st stage (~5 KB)</text>
  <text x="515" y="378" text-anchor="middle" fill="#8b949e" font-size="9">Baixa implant completo</text>
  <text x="515" y="398" text-anchor="middle" fill="#484f58" font-size="8">Staged vs Stageless trade-off</text>

  <!-- Arrow stager -> implant -->
  <line x1="420" y1="365" x2="372" y2="365" stroke="#f39c12" stroke-width="1.5" marker-end="url(#arr01a)"/>
  <text x="396" y="358" text-anchor="middle" fill="#f39c12" font-size="7">Download</text>

  <!-- Beacon behavior -->
  <rect x="240" y="435" width="320" height="55" rx="8" fill="#1c2333" stroke="#00d4ff" stroke-width="2"/>
  <text x="400" y="455" text-anchor="middle" fill="#00d4ff" font-size="12" font-weight="bold">BEACON (Comportamento)</text>
  <text x="400" y="472" text-anchor="middle" fill="#8b949e" font-size="9">Pull model: implant inicia conexão periodicamente</text>
  <text x="400" y="486" text-anchor="middle" fill="#8b949e" font-size="9">Sleep 60s + Jitter 25% = 45-75s entre check-ins</text>

  <!-- Arrow implant -> redirector (C2 channel) -->
  <path d="M275,320 L275,260 L670,260 L670,200" stroke="#00d4ff" stroke-width="2" stroke-dasharray="8,4" fill="none" marker-end="url(#arr01a)"/>
  <text x="470" y="253" text-anchor="middle" fill="#00d4ff" font-size="9" font-weight="bold">HTTPS Beacon (T1071.001)</text>

  <!-- Protocol comparison at bottom -->
  <text x="400" y="530" text-anchor="middle" fill="#484f58" font-size="9">Implant conhece apenas domínio do Redirector — NUNCA o IP do Team Server</text>
  <text x="400" y="545" text-anchor="middle" fill="#484f58" font-size="9">CRTLP — Module 01, Lesson 01</text>
</svg>