<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow04b" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d4ff"/>
    </marker>
    <marker id="arrow04b-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f39c12"/>
    </marker>
    <marker id="arrow04b-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6b6b"/>
    </marker>
    <linearGradient id="bg04b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="800" height="700" fill="url(#bg04b)" rx="12"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#00d4ff" font-size="20" font-weight="bold">ETW Telemetry Pipeline — Como EDRs Enxergam</text>
  <text x="400" y="62" text-anchor="middle" fill="#8b949e" font-size="12">Event Tracing for Windows · Provider → Session → Consumer</text>

  <!-- Kernel boundary line -->
  <line x1="30" y1="380" x2="770" y2="380" stroke="#f39c12" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="400" y="375" text-anchor="middle" fill="#f39c12" font-size="11" font-weight="bold">─── Kernel Mode ──────────────────── User Mode ───</text>

  <!-- USER MODE PROVIDERS -->
  <text x="80" y="100" fill="#a855f7" font-size="13" font-weight="bold">PROVIDERS (Emissores de Eventos)</text>

  <!-- PowerShell Provider -->
  <rect x="40" y="115" width="160" height="65" rx="8" fill="#1a1a2e" stroke="#a855f7" stroke-width="2"/>
  <text x="120" y="138" text-anchor="middle" fill="#a855f7" font-size="12" font-weight="bold">PowerShell</text>
  <text x="120" y="155" text-anchor="middle" fill="#8b949e" font-size="9">EID 4104: ScriptBlock</text>
  <text x="120" y="168" text-anchor="middle" fill="#8b949e" font-size="9">EID 4103: Module Log</text>

  <!-- .NET CLR Provider -->
  <rect x="220" y="115" width="160" height="65" rx="8" fill="#1a1a2e" stroke="#a855f7" stroke-width="2"/>
  <text x="300" y="138" text-anchor="middle" fill="#a855f7" font-size="12" font-weight="bold">.NET CLR</text>
  <text x="300" y="155" text-anchor="middle" fill="#8b949e" font-size="9">Assembly Load Events</text>
  <text x="300" y="168" text-anchor="middle" fill="#8b949e" font-size="9">JIT Compilation</text>

  <!-- Security Auditing -->
  <rect x="400" y="115" width="160" height="65" rx="8" fill="#1a1a2e" stroke="#a855f7" stroke-width="2"/>
  <text x="480" y="138" text-anchor="middle" fill="#a855f7" font-size="12" font-weight="bold">Security Audit</text>
  <text x="480" y="155" text-anchor="middle" fill="#8b949e" font-size="9">EID 4624: Logon</text>
  <text x="480" y="168" text-anchor="middle" fill="#8b949e" font-size="9">EID 4688: Process Create</text>

  <!-- Kernel Provider -->
  <rect x="580" y="115" width="180" height="65" rx="8" fill="#1a1a2e" stroke="#f39c12" stroke-width="2"/>
  <text x="670" y="138" text-anchor="middle" fill="#f39c12" font-size="12" font-weight="bold">Threat-Intelligence</text>
  <text x="670" y="155" text-anchor="middle" fill="#8b949e" font-size="9">PPL-Protected Provider</text>
  <text x="670" y="168" text-anchor="middle" fill="#ff6b6b" font-size="9">Cannot be patched!</text>

  <!-- Arrows down to sessions -->
  <line x1="120" y1="180" x2="120" y2="225" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrow04b)"/>
  <line x1="300" y1="180" x2="300" y2="225" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrow04b)"/>
  <line x1="480" y1="180" x2="480" y2="225" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrow04b)"/>
  <line x1="670" y1="180" x2="670" y2="225" stroke="#f39c12" stroke-width="1.5" marker-end="url(#arrow04b-orange)"/>

  <!-- SESSION (Kernel Buffer) -->
  <rect x="60" y="230" width="680" height="70" rx="10" fill="#1a1a2e" stroke="#00d4ff" stroke-width="2"/>
  <text x="400" y="258" text-anchor="middle" fill="#00d4ff" font-size="15" font-weight="bold">ETW Session (Kernel Buffer)</text>
  <text x="400" y="278" text-anchor="middle" fill="#8b949e" font-size="11">Buffered em kernel memory · Real-time ou .ETL log file</text>

  <!-- CONTROLLER -->
  <rect x="580" y="320" width="180" height="45" rx="8" fill="#1a1a2e" stroke="#4ecdc4" stroke-width="2"/>
  <text x="670" y="340" text-anchor="middle" fill="#4ecdc4" font-size="12" font-weight="bold">Controller</text>
  <text x="670" y="355" text-anchor="middle" fill="#8b949e" font-size="10">Start/Config Sessions</text>
  <line x1="670" y1="320" x2="670" y2="300" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arrow04b)"/>

  <!-- Arrows down to consumers -->
  <line x1="250" y1="300" x2="250" y2="420" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow04b)"/>
  <line x1="550" y1="300" x2="550" y2="420" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow04b)"/>

  <!-- CONSUMERS -->
  <text x="80" y="415" fill="#ff6b6b" font-size="13" font-weight="bold">CONSUMERS (Leitores de Eventos)</text>

  <!-- EDR Agent -->
  <rect x="60" y="430" width="200" height="80" rx="10" fill="#1a1a2e" stroke="#ff6b6b" stroke-width="2"/>
  <text x="160" y="458" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="bold">EDR Agent</text>
  <text x="160" y="478" text-anchor="middle" fill="#e6edf3" font-size="11">Defender / CrowdStrike</text>
  <text x="160" y="495" text-anchor="middle" fill="#8b949e" font-size="10">Análise + Correlação + Block</text>

  <!-- SIEM Forwarder -->
  <rect x="300" y="430" width="200" height="80" rx="10" fill="#1a1a2e" stroke="#f39c12" stroke-width="2"/>
  <text x="400" y="458" text-anchor="middle" fill="#f39c12" font-size="14" font-weight="bold">SIEM Forwarder</text>
  <text x="400" y="478" text-anchor="middle" fill="#e6edf3" font-size="11">Elastic / Splunk Agent</text>
  <text x="400" y="495" text-anchor="middle" fill="#8b949e" font-size="10">Event Collection + Forward</text>

  <!-- Event Log -->
  <rect x="540" y="430" width="200" height="80" rx="10" fill="#1a1a2e" stroke="#8b949e" stroke-width="2"/>
  <text x="640" y="458" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="bold">Windows Event Log</text>
  <text x="640" y="478" text-anchor="middle" fill="#8b949e" font-size="11">.evtx files</text>
  <text x="640" y="495" text-anchor="middle" fill="#8b949e" font-size="10">Forense post-incident</text>

  <!-- Red Team implications -->
  <rect x="40" y="545" width="720" height="130" rx="10" fill="#1a1a2e" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="400" y="572" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="bold">Implicações para Red Team — O que Cada Provider Revela</text>

  <text x="60" y="598" fill="#a855f7" font-size="11">PowerShell Provider</text>
  <text x="220" y="598" fill="#8b949e" font-size="11">→ Texto completo desobfuscado (EID 4104) mesmo sem bloqueio AMSI</text>

  <text x="60" y="620" fill="#a855f7" font-size="11">.NET CLR Provider</text>
  <text x="220" y="620" fill="#8b949e" font-size="11">→ Assembly loads anunciados ao ETW — execute-assembly não é invisível</text>

  <text x="60" y="642" fill="#f39c12" font-size="11">Threat-Intelligence</text>
  <text x="220" y="642" fill="#8b949e" font-size="11">→ PPL-protected, não pode ser patchado user-mode — syscall blind spots only</text>

  <text x="60" y="664" fill="#4ecdc4" font-size="11">Lesson 05 (ETW Patching)</text>
  <text x="220" y="664" fill="#8b949e" font-size="11">→ Patch NtTraceEvent em ntdll para cegar providers user-mode</text>
</svg>