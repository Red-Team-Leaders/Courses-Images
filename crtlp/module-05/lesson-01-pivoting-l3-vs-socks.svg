<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow05a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d4ff"/>
    </marker>
    <marker id="arrow05a-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4ecdc4"/>
    </marker>
    <marker id="arrow05a-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f39c12"/>
    </marker>
    <linearGradient id="bg05a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="800" height="650" fill="url(#bg05a)" rx="12"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#00d4ff" font-size="20" font-weight="bold">Pivoting: L3 Tunnel vs SOCKS Proxy</text>
  <text x="400" y="58" text-anchor="middle" fill="#8b949e" font-size="12">Arquitetura de Rede do Lab CRTLP · Kali → LNX-WEB → CORP</text>

  <!-- ====== NETWORK TOPOLOGY (top half) ====== -->
  <!-- Kali box -->
  <rect x="40" y="85" width="160" height="70" rx="10" fill="#1a1a2e" stroke="#ff6b6b" stroke-width="2"/>
  <text x="120" y="112" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="bold">Kali (Attacker)</text>
  <text x="120" y="130" text-anchor="middle" fill="#8b949e" font-size="11">10.0.10.5</text>
  <text x="120" y="145" text-anchor="middle" fill="#8b949e" font-size="9">EDGE-DMZ</text>

  <!-- Firewall 1 -->
  <rect x="230" y="95" width="50" height="50" rx="5" fill="#2d1f1f" stroke="#f39c12" stroke-width="2"/>
  <text x="255" y="118" text-anchor="middle" fill="#f39c12" font-size="10" font-weight="bold">FW</text>
  <text x="255" y="133" text-anchor="middle" fill="#f39c12" font-size="8">SG</text>

  <!-- Arrow Kali to FW -->
  <line x1="200" y1="120" x2="228" y2="120" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow05a)"/>

  <!-- LNX-WEB (dual-homed) -->
  <rect x="310" y="80" width="180" height="85" rx="10" fill="#1a1a2e" stroke="#4ecdc4" stroke-width="2.5"/>
  <text x="400" y="105" text-anchor="middle" fill="#4ecdc4" font-size="14" font-weight="bold">LNX-WEB (Pivot)</text>
  <text x="400" y="125" text-anchor="middle" fill="#f39c12" font-size="11">eth0: 10.0.10.20 (DMZ)</text>
  <text x="400" y="143" text-anchor="middle" fill="#a855f7" font-size="11">eth1: 10.0.20.21 (CORP)</text>
  <text x="400" y="158" text-anchor="middle" fill="#8b949e" font-size="9">Dual-Homed Host</text>

  <!-- Arrow FW to LNX-WEB -->
  <line x1="280" y1="120" x2="308" y2="120" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow05a)"/>

  <!-- Firewall 2 -->
  <rect x="520" y="95" width="50" height="50" rx="5" fill="#2d1f1f" stroke="#f39c12" stroke-width="2"/>
  <text x="545" y="118" text-anchor="middle" fill="#f39c12" font-size="10" font-weight="bold">FW</text>
  <text x="545" y="133" text-anchor="middle" fill="#f39c12" font-size="8">SG</text>

  <!-- Arrow LNX-WEB to FW2 -->
  <line x1="490" y1="120" x2="518" y2="120" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow05a)"/>

  <!-- CORP targets -->
  <rect x="600" y="78" width="170" height="90" rx="10" fill="#1a1a2e" stroke="#a855f7" stroke-width="2"/>
  <text x="685" y="100" text-anchor="middle" fill="#a855f7" font-size="13" font-weight="bold">CORP 10.0.20.0/24</text>
  <text x="685" y="118" text-anchor="middle" fill="#8b949e" font-size="10">DC01   10.0.20.10</text>
  <text x="685" y="133" text-anchor="middle" fill="#8b949e" font-size="10">SRV01  10.0.20.11</text>
  <text x="685" y="148" text-anchor="middle" fill="#8b949e" font-size="10">SRV02  10.0.20.12</text>
  <text x="685" y="163" text-anchor="middle" fill="#8b949e" font-size="10">WS01   10.0.20.4</text>

  <!-- Arrow FW2 to CORP -->
  <line x1="570" y1="120" x2="598" y2="120" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow05a)"/>

  <!-- Divider -->
  <line x1="30" y1="195" x2="770" y2="195" stroke="#30363d" stroke-width="1"/>

  <!-- ====== L3 TUNNEL (left column) ====== -->
  <text x="200" y="225" text-anchor="middle" fill="#4ecdc4" font-size="16" font-weight="bold">L3 Tunnel (TUN Device)</text>
  <text x="200" y="242" text-anchor="middle" fill="#8b949e" font-size="10">Ligolo-ng, sshuttle, WireGuard</text>

  <!-- L3 diagram -->
  <rect x="40" y="258" width="140" height="45" rx="8" fill="#1a1a2e" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="110" y="278" text-anchor="middle" fill="#4ecdc4" font-size="11" font-weight="bold">Kali Kernel</text>
  <text x="110" y="293" text-anchor="middle" fill="#8b949e" font-size="9">route add 10.0.20.0/24 tun0</text>

  <line x1="180" y1="280" x2="220" y2="280" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrow05a-green)"/>

  <rect x="225" y="258" width="140" height="45" rx="8" fill="#1a1a2e" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="295" y="278" text-anchor="middle" fill="#4ecdc4" font-size="11" font-weight="bold">TUN Interface</text>
  <text x="295" y="293" text-anchor="middle" fill="#8b949e" font-size="9">Virtual L3 adapter</text>

  <line x1="110" y1="303" x2="110" y2="330" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arrow05a-green)"/>

  <rect x="40" y="335" width="325" height="55" rx="8" fill="#1a2e2a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="202" y="358" text-anchor="middle" fill="#4ecdc4" font-size="12" font-weight="bold">Raw IP packets tunneled</text>
  <text x="202" y="378" text-anchor="middle" fill="#e6edf3" font-size="11">Todas as ferramentas funcionam transparente</text>

  <!-- Pros/Cons L3 -->
  <text x="60" y="415" fill="#4ecdc4" font-size="11">+ nmap, SMB, RDP, Responder, Nessus</text>
  <text x="60" y="433" fill="#4ecdc4" font-size="11">+ Broadcast/multicast funciona</text>
  <text x="60" y="451" fill="#4ecdc4" font-size="11">+ Zero config per-tool</text>
  <text x="60" y="475" fill="#ff6b6b" font-size="11">- Precisa root/admin</text>
  <text x="60" y="493" fill="#ff6b6b" font-size="11">- Maior footprint no host</text>

  <!-- ====== SOCKS PROXY (right column) ====== -->
  <text x="600" y="225" text-anchor="middle" fill="#f39c12" font-size="16" font-weight="bold">SOCKS Proxy (App Layer)</text>
  <text x="600" y="242" text-anchor="middle" fill="#8b949e" font-size="10">Chisel, SSH -D, Metasploit</text>

  <!-- SOCKS diagram -->
  <rect x="440" y="258" width="140" height="45" rx="8" fill="#1a1a2e" stroke="#f39c12" stroke-width="1.5"/>
  <text x="510" y="278" text-anchor="middle" fill="#f39c12" font-size="11" font-weight="bold">proxychains</text>
  <text x="510" y="293" text-anchor="middle" fill="#8b949e" font-size="9">socks5 127.0.0.1:1080</text>

  <line x1="580" y1="280" x2="620" y2="280" stroke="#f39c12" stroke-width="2" marker-end="url(#arrow05a-orange)"/>

  <rect x="625" y="258" width="140" height="45" rx="8" fill="#1a1a2e" stroke="#f39c12" stroke-width="1.5"/>
  <text x="695" y="278" text-anchor="middle" fill="#f39c12" font-size="11" font-weight="bold">SOCKS Server</text>
  <text x="695" y="293" text-anchor="middle" fill="#8b949e" font-size="9">On LNX-WEB</text>

  <line x1="510" y1="303" x2="510" y2="330" stroke="#f39c12" stroke-width="1.5" marker-end="url(#arrow05a-orange)"/>

  <rect x="440" y="335" width="325" height="55" rx="8" fill="#2d2a1a" stroke="#f39c12" stroke-width="1.5"/>
  <text x="602" y="358" text-anchor="middle" fill="#f39c12" font-size="12" font-weight="bold">TCP connections proxied</text>
  <text x="602" y="378" text-anchor="middle" fill="#e6edf3" font-size="11">Cada tool precisa suportar proxy</text>

  <!-- Pros/Cons SOCKS -->
  <text x="460" y="415" fill="#4ecdc4" font-size="11">+ Sem root necessário</text>
  <text x="460" y="433" fill="#4ecdc4" font-size="11">+ Menor footprint</text>
  <text x="460" y="451" fill="#4ecdc4" font-size="11">+ Funciona em mais cenários</text>
  <text x="460" y="475" fill="#ff6b6b" font-size="11">- Só TCP (sem UDP/ICMP nativo)</text>
  <text x="460" y="493" fill="#ff6b6b" font-size="11">- nmap precisa -sT, sem SYN scan</text>
  <text x="460" y="511" fill="#ff6b6b" font-size="11">- Responder/broadcast impossível</text>

  <!-- Decision box -->
  <rect x="40" y="545" width="720" height="85" rx="10" fill="#1a1a2e" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="400" y="572" text-anchor="middle" fill="#00d4ff" font-size="14" font-weight="bold">Quando Usar Cada Abordagem</text>
  <text x="400" y="595" text-anchor="middle" fill="#4ecdc4" font-size="12">L3 (Ligolo-ng): Quando precisa nmap full, Responder, RDP, ou qualquer protocolo</text>
  <text x="400" y="615" text-anchor="middle" fill="#f39c12" font-size="12">SOCKS (Chisel): Quando quer stealth, sem root, ou como fallback rápido</text>
</svg>