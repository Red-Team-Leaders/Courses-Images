<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="800" height="680" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow06a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d4ff"/>
    </marker>
    <marker id="arrow06a-back" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#4ecdc4"/>
    </marker>
    <marker id="arrow06a-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6b6b"/>
    </marker>
    <linearGradient id="bg06a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="800" height="680" fill="url(#bg06a)" rx="12"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#00d4ff" font-size="20" font-weight="bold">Kerberos Authentication Flow</text>
  <text x="400" y="58" text-anchor="middle" fill="#8b949e" font-size="12">corp.lab · DC01 como KDC · AS-REQ/TGS-REQ/AP-REQ</text>

  <!-- Three main actors -->
  <!-- Client -->
  <rect x="40" y="85" width="160" height="65" rx="10" fill="#1a1a2e" stroke="#a855f7" stroke-width="2"/>
  <text x="120" y="112" text-anchor="middle" fill="#a855f7" font-size="14" font-weight="bold">Client (User)</text>
  <text x="120" y="132" text-anchor="middle" fill="#8b949e" font-size="10">j.silva@corp.lab</text>
  <text x="120" y="145" text-anchor="middle" fill="#8b949e" font-size="9">WS01</text>

  <!-- KDC (DC01) -->
  <rect x="320" y="85" width="160" height="65" rx="10" fill="#1a1a2e" stroke="#00d4ff" stroke-width="2"/>
  <text x="400" y="108" text-anchor="middle" fill="#00d4ff" font-size="14" font-weight="bold">KDC (DC01)</text>
  <text x="400" y="125" text-anchor="middle" fill="#8b949e" font-size="10">AS + TGS Services</text>
  <text x="400" y="142" text-anchor="middle" fill="#8b949e" font-size="9">krbtgt key = crown jewel</text>

  <!-- Service -->
  <rect x="600" y="85" width="160" height="65" rx="10" fill="#1a1a2e" stroke="#4ecdc4" stroke-width="2"/>
  <text x="680" y="112" text-anchor="middle" fill="#4ecdc4" font-size="14" font-weight="bold">Service</text>
  <text x="680" y="132" text-anchor="middle" fill="#8b949e" font-size="10">SRV01 (MSSQL)</text>
  <text x="680" y="145" text-anchor="middle" fill="#8b949e" font-size="9">SPN: MSSQLSvc/srv01</text>

  <!-- ====== STEP 1: AS-REQ ====== -->
  <rect x="30" y="175" width="55" height="25" rx="5" fill="#ff6b6b"/>
  <text x="57" y="192" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Passo 1</text>

  <text x="95" y="192" fill="#e6edf3" font-size="12" font-weight="bold">AS-REQ</text>
  <text x="170" y="192" fill="#8b949e" font-size="10">(Authentication Service Request)</text>

  <line x1="120" y1="205" x2="380" y2="205" stroke="#f39c12" stroke-width="2" marker-end="url(#arrow06a)"/>
  <rect x="150" y="210" width="200" height="40" rx="6" fill="#1a1a2e" stroke="#f39c12" stroke-width="1"/>
  <text x="250" y="228" text-anchor="middle" fill="#f39c12" font-size="10">Timestamp cifrado com</text>
  <text x="250" y="242" text-anchor="middle" fill="#f39c12" font-size="10">NT hash do user (pre-auth)</text>

  <!-- ====== STEP 2: AS-REP ====== -->
  <rect x="30" y="265" width="55" height="25" rx="5" fill="#4ecdc4"/>
  <text x="57" y="282" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="bold">Passo 2</text>

  <text x="95" y="282" fill="#e6edf3" font-size="12" font-weight="bold">AS-REP</text>
  <text x="165" y="282" fill="#8b949e" font-size="10">(KDC responde com TGT)</text>

  <line x1="380" y1="295" x2="120" y2="295" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrow06a-back)"/>
  <rect x="150" y="300" width="200" height="50" rx="6" fill="#1a1a2e" stroke="#4ecdc4" stroke-width="1"/>
  <text x="250" y="318" text-anchor="middle" fill="#4ecdc4" font-size="10">TGT (cifrado com krbtgt key)</text>
  <text x="250" y="333" text-anchor="middle" fill="#4ecdc4" font-size="10">+ Session Key (cifrado user key)</text>
  <text x="250" y="346" text-anchor="middle" fill="#8b949e" font-size="8">TGT = 10h default validity</text>

  <!-- ====== STEP 3: TGS-REQ ====== -->
  <rect x="30" y="365" width="55" height="25" rx="5" fill="#f39c12"/>
  <text x="57" y="382" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="bold">Passo 3</text>

  <text x="95" y="382" fill="#e6edf3" font-size="12" font-weight="bold">TGS-REQ</text>
  <text x="175" y="382" fill="#8b949e" font-size="10">(Pedido de Service Ticket)</text>

  <line x1="120" y1="395" x2="380" y2="395" stroke="#f39c12" stroke-width="2" marker-end="url(#arrow06a)"/>
  <rect x="150" y="400" width="200" height="40" rx="6" fill="#1a1a2e" stroke="#f39c12" stroke-width="1"/>
  <text x="250" y="418" text-anchor="middle" fill="#f39c12" font-size="10">TGT + SPN do serviço alvo</text>
  <text x="250" y="432" text-anchor="middle" fill="#f39c12" font-size="10">"MSSQLSvc/srv01.corp.lab"</text>

  <!-- ====== STEP 4: TGS-REP ====== -->
  <rect x="30" y="455" width="55" height="25" rx="5" fill="#a855f7"/>
  <text x="57" y="472" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Passo 4</text>

  <text x="95" y="472" fill="#e6edf3" font-size="12" font-weight="bold">TGS-REP</text>
  <text x="175" y="472" fill="#8b949e" font-size="10">(Service Ticket / ST)</text>

  <line x1="380" y1="485" x2="120" y2="485" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow06a-back)"/>
  <rect x="150" y="490" width="250" height="40" rx="6" fill="#1a1a2e" stroke="#a855f7" stroke-width="1"/>
  <text x="275" y="508" text-anchor="middle" fill="#a855f7" font-size="10">ST cifrado com password hash do SPN owner</text>
  <text x="275" y="522" text-anchor="middle" fill="#ff6b6b" font-size="9" font-weight="bold">Kerberoasting: crack ST offline!</text>

  <!-- ====== STEP 5: AP-REQ ====== -->
  <rect x="30" y="545" width="55" height="25" rx="5" fill="#00d4ff"/>
  <text x="57" y="562" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="bold">Passo 5</text>

  <text x="95" y="562" fill="#e6edf3" font-size="12" font-weight="bold">AP-REQ</text>
  <text x="175" y="562" fill="#8b949e" font-size="10">(Application Request ao Service)</text>

  <line x1="120" y1="575" x2="660" y2="575" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow06a)"/>
  <rect x="350" y="580" width="200" height="30" rx="6" fill="#1a1a2e" stroke="#00d4ff" stroke-width="1"/>
  <text x="450" y="600" text-anchor="middle" fill="#00d4ff" font-size="10">ST + Authenticator apresentados ao service</text>

  <!-- Attack annotations -->
  <rect x="40" y="625" width="720" height="40" rx="8" fill="#2d1f1f" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="400" y="645" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="bold">Ataques por Passo: 1→AS-REP Roasting (sem pre-auth) | 4→Kerberoasting (crack ST) | Golden Ticket (forge TGT com krbtgt)</text>
  <text x="400" y="658" text-anchor="middle" fill="#8b949e" font-size="10">Silver Ticket (forge ST com service hash) | Pass-the-Ticket (reuse TGT/ST roubado)</text>
</svg>