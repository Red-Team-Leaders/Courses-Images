<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="30" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Reflective DLL Injection — Detection Layers</text>

  <!-- Layer 1: Static -->
  <rect x="30" y="50" width="940" height="100" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="70" y="75" fill="#f85149" font-size="13" font-weight="bold">Layer 1: Static Analysis</text>
  <rect x="50" y="90" width="200" height="45" rx="4" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="150" y="108" text-anchor="middle" fill="#c9d1d9" font-size="9">PE Header in Memory</text>
  <text x="150" y="125" text-anchor="middle" fill="#f85149" font-size="8">MZ/PE magic bytes scan</text>
  <rect x="270" y="90" width="200" height="45" rx="4" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="370" y="108" text-anchor="middle" fill="#c9d1d9" font-size="9">YARA Signatures</text>
  <text x="370" y="125" text-anchor="middle" fill="#f85149" font-size="8">Known loader stub patterns</text>
  <rect x="490" y="90" width="200" height="45" rx="4" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="590" y="108" text-anchor="middle" fill="#c9d1d9" font-size="9">Import Table Analysis</text>
  <text x="590" y="125" text-anchor="middle" fill="#f85149" font-size="8">VirtualAlloc + LoadLibrary combo</text>
  <rect x="710" y="90" width="250" height="45" rx="4" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="835" y="108" text-anchor="middle" fill="#c9d1d9" font-size="9">String Analysis</text>
  <text x="835" y="125" text-anchor="middle" fill="#f85149" font-size="8">ReflectiveLoader export name</text>

  <!-- Layer 2: Memory -->
  <rect x="30" y="165" width="940" height="100" rx="8" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
  <text x="70" y="190" fill="#f0883e" font-size="13" font-weight="bold">Layer 2: Memory Forensics</text>
  <rect x="50" y="205" width="220" height="45" rx="4" fill="#161b22" stroke="#f0883e" stroke-width="1"/>
  <text x="160" y="223" text-anchor="middle" fill="#c9d1d9" font-size="9">Unbacked RWX Regions</text>
  <text x="160" y="240" text-anchor="middle" fill="#f0883e" font-size="8">VirtualAlloc with PAGE_EXECUTE_READWRITE</text>
  <rect x="290" y="205" width="220" height="45" rx="4" fill="#161b22" stroke="#f0883e" stroke-width="1"/>
  <text x="400" y="223" text-anchor="middle" fill="#c9d1d9" font-size="9">PE Structure in Private Mem</text>
  <text x="400" y="240" text-anchor="middle" fill="#f0883e" font-size="8">DOS header + sections not in VAD</text>
  <rect x="530" y="205" width="210" height="45" rx="4" fill="#161b22" stroke="#f0883e" stroke-width="1"/>
  <text x="635" y="223" text-anchor="middle" fill="#c9d1d9" font-size="9">Thread Start Address</text>
  <text x="635" y="240" text-anchor="middle" fill="#f0883e" font-size="8">Thread in unbacked private memory</text>
  <rect x="760" y="205" width="200" height="45" rx="4" fill="#161b22" stroke="#f0883e" stroke-width="1"/>
  <text x="860" y="223" text-anchor="middle" fill="#c9d1d9" font-size="9">Hollowed Modules</text>
  <text x="860" y="240" text-anchor="middle" fill="#f0883e" font-size="8">Mapped image vs disk mismatch</text>

  <!-- Layer 3: Behavioral -->
  <rect x="30" y="280" width="940" height="100" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="70" y="305" fill="#58a6ff" font-size="13" font-weight="bold">Layer 3: Behavioral / ETW</text>
  <rect x="50" y="320" width="220" height="45" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="160" y="338" text-anchor="middle" fill="#c9d1d9" font-size="9">NtProtectVirtualMemory</text>
  <text x="160" y="355" text-anchor="middle" fill="#58a6ff" font-size="8">RW to RX transition on private mem</text>
  <rect x="290" y="320" width="220" height="45" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="400" y="338" text-anchor="middle" fill="#c9d1d9" font-size="9">NtCreateThreadEx</text>
  <text x="400" y="355" text-anchor="middle" fill="#58a6ff" font-size="8">Remote thread in target process</text>
  <rect x="530" y="320" width="210" height="45" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="635" y="338" text-anchor="middle" fill="#c9d1d9" font-size="9">Module Load Events</text>
  <text x="635" y="355" text-anchor="middle" fill="#58a6ff" font-size="8">Missing for reflective-loaded DLL</text>
  <rect x="760" y="320" width="200" height="45" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="860" y="338" text-anchor="middle" fill="#c9d1d9" font-size="9">Syscall Telemetry</text>
  <text x="860" y="355" text-anchor="middle" fill="#58a6ff" font-size="8">Direct syscall pattern detection</text>

  <!-- Layer 4: EDR Specific -->
  <rect x="30" y="395" width="940" height="100" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="70" y="420" fill="#3fb950" font-size="13" font-weight="bold">Layer 4: EDR-Specific Hooks</text>
  <rect x="50" y="435" width="220" height="45" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="160" y="453" text-anchor="middle" fill="#c9d1d9" font-size="9">Userland API Hooks</text>
  <text x="160" y="470" text-anchor="middle" fill="#3fb950" font-size="8">ntdll.dll inline hooks (JMP)</text>
  <rect x="290" y="435" width="220" height="45" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="400" y="453" text-anchor="middle" fill="#c9d1d9" font-size="9">Kernel Callbacks</text>
  <text x="400" y="470" text-anchor="middle" fill="#3fb950" font-size="8">PsSetCreateThreadNotifyRoutine</text>
  <rect x="530" y="435" width="210" height="45" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="635" y="453" text-anchor="middle" fill="#c9d1d9" font-size="9">ETW TI Provider</text>
  <text x="635" y="470" text-anchor="middle" fill="#3fb950" font-size="8">Threat Intelligence kernel events</text>
  <rect x="760" y="435" width="200" height="45" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="860" y="453" text-anchor="middle" fill="#c9d1d9" font-size="9">Stack Trace Analysis</text>
  <text x="860" y="470" text-anchor="middle" fill="#3fb950" font-size="8">Unbacked return addresses</text>

  <!-- Footer -->
  <text x="500" y="525" text-anchor="middle" fill="#c9d1d9" font-size="11">Defense-in-depth: each layer catches different evasion levels</text>
  <text x="500" y="545" text-anchor="middle" fill="#8b949e" font-size="9">UDRL bypasses Layer 1 (static) but must still contend with Layers 2-4</text>
  <text x="500" y="570" text-anchor="middle" fill="#58a6ff" font-size="10">CRTLP Module 09 — Reflective DLL Detection Engineering</text>
</svg>
