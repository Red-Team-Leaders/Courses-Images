<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Detection Vectors for Reflective Loading</text>

  <!-- Central target -->
  <rect x="370" y="55" width="260" height="60" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="500" y="80" text-anchor="middle" fill="#f85149" font-size="14" font-weight="bold">Reflective DLL Injection</text>
  <text x="500" y="98" text-anchor="middle" fill="#ff7b72" font-size="10">In-memory PE loading target</text>

  <!-- Detection Vector 1: Unbacked RWX Memory -->
  <rect x="20" y="150" width="280" height="115" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <circle cx="40" cy="170" r="10" fill="#f85149" opacity="0.3"/>
  <text x="40" y="174" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">1</text>
  <text x="170" y="173" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">Unbacked RWX Memory</text>
  <line x1="30" y1="183" x2="290" y2="183" stroke="#f85149" stroke-width="0.5"/>
  <text x="35" y="200" fill="#c9d1d9" font-size="10">Private memory with RWX permissions</text>
  <text x="35" y="215" fill="#c9d1d9" font-size="10">not backed by any file on disk</text>
  <text x="35" y="238" fill="#58a6ff" font-size="10" font-weight="bold">Telemetry:</text>
  <text x="110" y="238" fill="#8b949e" font-size="10">NtQueryVirtualMemory</text>
  <text x="35" y="253" fill="#3fb950" font-size="10" font-weight="bold">EDR API:</text>
  <text x="100" y="253" fill="#8b949e" font-size="10">VirtualQueryEx / VAD walk</text>
  <line x1="300" y1="200" x2="370" y2="105" stroke="#f85149" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Detection Vector 2: MZ/PE in Heap -->
  <rect x="20" y="290" width="280" height="115" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <circle cx="40" cy="310" r="10" fill="#f0883e" opacity="0.3"/>
  <text x="40" y="314" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">2</text>
  <text x="170" y="313" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">MZ/PE Headers in Heap</text>
  <line x1="30" y1="323" x2="290" y2="323" stroke="#f0883e" stroke-width="0.5"/>
  <text x="35" y="340" fill="#c9d1d9" font-size="10">PE signature (4D 5A) found in</text>
  <text x="35" y="355" fill="#c9d1d9" font-size="10">process heap or private memory</text>
  <text x="35" y="378" fill="#58a6ff" font-size="10" font-weight="bold">Telemetry:</text>
  <text x="110" y="378" fill="#8b949e" font-size="10">Memory scanning / YARA</text>
  <text x="35" y="393" fill="#3fb950" font-size="10" font-weight="bold">EDR API:</text>
  <text x="100" y="393" fill="#8b949e" font-size="10">ReadProcessMemory sweep</text>
  <line x1="300" y1="340" x2="400" y2="115" stroke="#f0883e" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Detection Vector 3: Missing PEB Entry -->
  <rect x="360" y="155" width="280" height="115" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <circle cx="380" cy="175" r="10" fill="#58a6ff" opacity="0.3"/>
  <text x="380" y="179" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">3</text>
  <text x="510" y="178" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Missing PEB/LDR Entry</text>
  <line x1="370" y1="188" x2="630" y2="188" stroke="#58a6ff" stroke-width="0.5"/>
  <text x="375" y="205" fill="#c9d1d9" font-size="10">Loaded module not registered in</text>
  <text x="375" y="220" fill="#c9d1d9" font-size="10">PEB_LDR_DATA linked lists</text>
  <text x="375" y="243" fill="#58a6ff" font-size="10" font-weight="bold">Telemetry:</text>
  <text x="450" y="243" fill="#8b949e" font-size="10">PEB->Ldr enumeration</text>
  <text x="375" y="258" fill="#3fb950" font-size="10" font-weight="bold">EDR API:</text>
  <text x="440" y="258" fill="#8b949e" font-size="10">NtQueryInformationProcess</text>
  <line x1="500" y1="155" x2="500" y2="115" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Detection Vector 4: Anomalous Thread Start -->
  <rect x="700" y="150" width="280" height="115" rx="6" fill="#161b22" stroke="#ff7b72" stroke-width="1.5"/>
  <circle cx="720" cy="170" r="10" fill="#ff7b72" opacity="0.3"/>
  <text x="720" y="174" text-anchor="middle" fill="#ff7b72" font-size="11" font-weight="bold">4</text>
  <text x="850" y="173" text-anchor="middle" fill="#ff7b72" font-size="12" font-weight="bold">Anomalous Thread Start</text>
  <line x1="710" y1="183" x2="970" y2="183" stroke="#ff7b72" stroke-width="0.5"/>
  <text x="715" y="200" fill="#c9d1d9" font-size="10">Thread start address points to</text>
  <text x="715" y="215" fill="#c9d1d9" font-size="10">unbacked private memory region</text>
  <text x="715" y="238" fill="#58a6ff" font-size="10" font-weight="bold">Telemetry:</text>
  <text x="790" y="238" fill="#8b949e" font-size="10">NtQueryInformationThread</text>
  <text x="715" y="253" fill="#3fb950" font-size="10" font-weight="bold">EDR API:</text>
  <text x="780" y="253" fill="#8b949e" font-size="10">Thread creation callbacks</text>
  <line x1="700" y1="195" x2="630" y2="105" stroke="#ff7b72" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Detection Vector 5: ETW Write Events -->
  <rect x="700" y="290" width="280" height="115" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <circle cx="720" cy="310" r="10" fill="#3fb950" opacity="0.3"/>
  <text x="720" y="314" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">5</text>
  <text x="850" y="313" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">ETW Write Events</text>
  <line x1="710" y1="323" x2="970" y2="323" stroke="#3fb950" stroke-width="0.5"/>
  <text x="715" y="340" fill="#c9d1d9" font-size="10">EtwTi provider logs memory</text>
  <text x="715" y="355" fill="#c9d1d9" font-size="10">alloc/protect/map operations</text>
  <text x="715" y="378" fill="#58a6ff" font-size="10" font-weight="bold">Telemetry:</text>
  <text x="790" y="378" fill="#8b949e" font-size="10">Microsoft-Windows-Threat-Intel</text>
  <text x="715" y="393" fill="#3fb950" font-size="10" font-weight="bold">EDR API:</text>
  <text x="780" y="393" fill="#8b949e" font-size="10">EtwTi kernel provider</text>
  <line x1="700" y1="340" x2="600" y2="115" stroke="#3fb950" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Detection Confidence Bar -->
  <rect x="360" y="310" width="280" height="120" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
  <text x="500" y="333" text-anchor="middle" fill="#c9d1d9" font-size="11" font-weight="bold">Detection Confidence</text>
  <rect x="380" y="345" width="240" height="12" rx="3" fill="#161b22" stroke="#8b949e" stroke-width="0.5"/>
  <rect x="380" y="345" width="220" height="12" rx="3" fill="#f85149"/>
  <text x="380" y="372" fill="#f85149" font-size="9">RWX Memory</text>
  <text x="600" y="372" fill="#c9d1d9" font-size="9">HIGH</text>

  <rect x="380" y="380" width="240" height="12" rx="3" fill="#161b22" stroke="#8b949e" stroke-width="0.5"/>
  <rect x="380" y="380" width="190" height="12" rx="3" fill="#f0883e"/>
  <text x="380" y="407" fill="#f0883e" font-size="9">MZ/PE Scan</text>
  <text x="575" y="407" fill="#c9d1d9" font-size="9">MEDIUM-HIGH</text>

  <rect x="380" y="415" width="240" height="12" rx="3" fill="#161b22" stroke="#8b949e" stroke-width="0.5"/>
  <rect x="380" y="415" width="160" height="12" rx="3" fill="#3fb950"/>
  <text x="380" y="442" fill="#3fb950" font-size="9">PEB Check</text>
  <text x="548" y="442" fill="#c9d1d9" font-size="9">MEDIUM</text>

  <!-- Bottom summary -->
  <rect x="50" y="465" width="900" height="90" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="0.5"/>
  <text x="500" y="488" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="bold">EDR Detection Pipeline Summary</text>
  <text x="155" y="510" text-anchor="middle" fill="#f85149" font-size="10">Kernel Callbacks</text>
  <text x="155" y="525" text-anchor="middle" fill="#8b949e" font-size="9">PsSetCreateThread</text>
  <text x="60" y="510" fill="#f85149" font-size="14">&#x25C6;</text>
  <line x1="250" y1="510" x2="290" y2="510" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="390" y="510" text-anchor="middle" fill="#f0883e" font-size="10">ETW Providers</text>
  <text x="390" y="525" text-anchor="middle" fill="#8b949e" font-size="9">Threat Intelligence</text>
  <text x="300" y="510" fill="#f0883e" font-size="14">&#x25C6;</text>
  <line x1="480" y1="510" x2="530" y2="510" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="630" y="510" text-anchor="middle" fill="#58a6ff" font-size="10">User-mode Hooks</text>
  <text x="630" y="525" text-anchor="middle" fill="#8b949e" font-size="9">ntdll inline hooks</text>
  <text x="540" y="510" fill="#58a6ff" font-size="14">&#x25C6;</text>
  <line x1="720" y1="510" x2="760" y2="510" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="860" y="510" text-anchor="middle" fill="#3fb950" font-size="10">Memory Scanning</text>
  <text x="860" y="525" text-anchor="middle" fill="#8b949e" font-size="9">Periodic VAD/YARA</text>
  <text x="770" y="510" fill="#3fb950" font-size="14">&#x25C6;</text>

  <text x="500" y="565" text-anchor="middle" fill="#8b949e" font-size="10">Multiple overlapping detection layers make reflective loading increasingly risky without OPSEC hardening</text>
</svg>