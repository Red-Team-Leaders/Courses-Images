<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">PE Section Mapping: File on Disk to Memory</text>

  <!-- Left: PE File on Disk -->
  <rect x="40" y="55" width="280" height="500" rx="6" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
  <text x="180" y="78" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="bold">PE File on Disk</text>
  <text x="180" y="95" text-anchor="middle" fill="#8b949e" font-size="9">Contiguous, raw file offsets</text>

  <rect x="60" y="110" width="240" height="40" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="180" y="135" text-anchor="middle" fill="#58a6ff" font-size="11">DOS Header (MZ)</text>
  <text x="290" y="125" text-anchor="end" fill="#8b949e" font-size="8">+0x00</text>

  <rect x="60" y="158" width="240" height="45" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="180" y="178" text-anchor="middle" fill="#58a6ff" font-size="11">NT Headers (PE\0\0)</text>
  <text x="180" y="193" text-anchor="middle" fill="#8b949e" font-size="8">FileHeader + OptionalHeader</text>
  <text x="290" y="173" text-anchor="end" fill="#8b949e" font-size="8">+0x80</text>

  <rect x="60" y="211" width="240" height="35" rx="4" fill="#161b22" stroke="#8b949e" stroke-width="1"/>
  <text x="180" y="233" text-anchor="middle" fill="#c9d1d9" font-size="10">Section Table (headers)</text>

  <rect x="60" y="256" width="240" height="65" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="180" y="280" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">.text (code)</text>
  <text x="180" y="296" text-anchor="middle" fill="#8b949e" font-size="9">RawOffset: 0x400 | RawSize: 0x2000</text>
  <text x="290" y="272" text-anchor="end" fill="#8b949e" font-size="8">+0x400</text>

  <rect x="60" y="329" width="240" height="55" rx="4" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="180" y="350" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">.rdata (read-only data)</text>
  <text x="180" y="366" text-anchor="middle" fill="#8b949e" font-size="9">RawOffset: 0x2400 | RawSize: 0x800</text>

  <rect x="60" y="392" width="240" height="50" rx="4" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="180" y="413" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">.data (globals)</text>
  <text x="180" y="428" text-anchor="middle" fill="#8b949e" font-size="9">RawOffset: 0x2C00 | RawSize: 0x200</text>

  <rect x="60" y="450" width="240" height="50" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="180" y="471" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">.reloc (relocations)</text>
  <text x="180" y="487" text-anchor="middle" fill="#8b949e" font-size="9">RawOffset: 0x2E00 | RawSize: 0x400</text>

  <!-- Arrows: Disk -> Memory -->
  <line x1="320" y1="135" x2="450" y2="100" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#ar)"/>
  <line x1="320" y1="290" x2="450" y2="220" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#ar)"/>
  <line x1="320" y1="355" x2="450" y2="310" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#ar)"/>
  <line x1="320" y1="415" x2="450" y2="395" stroke="#f85149" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#ar)"/>
  <line x1="320" y1="475" x2="450" y2="475" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#ar)"/>

  <text x="385" y="168" text-anchor="middle" fill="#c9d1d9" font-size="9" transform="rotate(-15,385,168)">Map to VA</text>

  <!-- Right: Mapped in Memory -->
  <rect x="460" y="55" width="290" height="500" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="605" y="78" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">Mapped in Memory</text>
  <text x="605" y="95" text-anchor="middle" fill="#8b949e" font-size="9">Virtual addresses, page-aligned</text>

  <rect x="478" y="105" width="255" height="35" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="605" y="127" text-anchor="middle" fill="#58a6ff" font-size="10">Headers (may be wiped)</text>
  <text x="725" y="120" text-anchor="end" fill="#8b949e" font-size="8">0x00000000</text>

  <rect x="478" y="148" width="255" height="30" rx="4" fill="#161b22" stroke="#8b949e" stroke-width="0.5" stroke-dasharray="2"/>
  <text x="605" y="168" text-anchor="middle" fill="#8b949e" font-size="9">Padding (alignment)</text>

  <rect x="478" y="188" width="255" height="90" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="605" y="215" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">.text</text>
  <text x="605" y="235" text-anchor="middle" fill="#7ee787" font-size="10">PAGE_EXECUTE_READ (RX)</text>
  <text x="605" y="255" text-anchor="middle" fill="#8b949e" font-size="9">VirtualAddress: 0x1000 | VirtualSize: 0x2000</text>
  <text x="725" y="205" text-anchor="end" fill="#8b949e" font-size="8">0x00001000</text>

  <rect x="478" y="286" width="255" height="70" rx="4" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="605" y="310" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">.rdata</text>
  <text x="605" y="328" text-anchor="middle" fill="#c9d1d9" font-size="10">PAGE_READONLY (R)</text>
  <text x="725" y="300" text-anchor="end" fill="#8b949e" font-size="8">0x00003000</text>

  <rect x="478" y="364" width="255" height="65" rx="4" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="605" y="388" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">.data</text>
  <text x="605" y="406" text-anchor="middle" fill="#c9d1d9" font-size="10">PAGE_READWRITE (RW)</text>
  <text x="725" y="378" text-anchor="end" fill="#8b949e" font-size="8">0x00004000</text>

  <rect x="478" y="437" width="255" height="55" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="605" y="460" text-anchor="middle" fill="#58a6ff" font-size="11">.reloc (processed, can discard)</text>
  <text x="725" y="450" text-anchor="end" fill="#8b949e" font-size="8">0x00005000</text>

  <rect x="478" y="500" width="255" height="40" rx="4" fill="#161b22" stroke="#8b949e" stroke-width="0.5" stroke-dasharray="2"/>
  <text x="605" y="525" text-anchor="middle" fill="#8b949e" font-size="9">Remaining allocation (SizeOfImage)</text>

  <!-- Post-processing steps -->
  <rect x="775" y="100" width="200" height="200" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="875" y="125" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Post-Map Steps</text>
  <line x1="785" y1="135" x2="965" y2="135" stroke="#8b949e" stroke-width="0.5"/>
  <text x="790" y="158" fill="#3fb950" font-size="10">1. Apply relocations</text>
  <text x="805" y="176" fill="#8b949e" font-size="9">(delta = actual - preferred)</text>
  <text x="790" y="198" fill="#f0883e" font-size="10">2. Resolve imports</text>
  <text x="805" y="216" fill="#8b949e" font-size="9">(walk IAT, LoadLibrary+GPA)</text>
  <text x="790" y="238" fill="#58a6ff" font-size="10">3. Set section permissions</text>
  <text x="805" y="256" fill="#8b949e" font-size="9">(VirtualProtect per-section)</text>
  <text x="790" y="278" fill="#f85149" font-size="10">4. Call DllMain(ATTACH)</text>

  <!-- OPSEC note -->
  <rect x="775" y="330" width="200" height="100" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="875" y="355" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">OPSEC: Wipe Headers</text>
  <text x="790" y="378" fill="#c9d1d9" font-size="9">Zero out DOS + NT headers</text>
  <text x="790" y="394" fill="#c9d1d9" font-size="9">after DllMain returns.</text>
  <text x="790" y="410" fill="#c9d1d9" font-size="9">Prevents MZ/PE scanning.</text>
</svg>
