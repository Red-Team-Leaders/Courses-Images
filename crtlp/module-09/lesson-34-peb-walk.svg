<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">PEB Walk: Finding kernel32.dll at Runtime</text>

  <!-- TEB -->
  <rect x="30" y="60" width="160" height="130" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="110" y="82" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="bold">TEB</text>
  <text x="110" y="100" text-anchor="middle" fill="#8b949e" font-size="9">Thread Environment Block</text>
  <line x1="40" y1="112" x2="180" y2="112" stroke="#8b949e" stroke-width="0.5"/>
  <text x="50" y="130" fill="#8b949e" font-size="9">+0x00 NtTib</text>
  <text x="50" y="146" fill="#8b949e" font-size="9">+0x30 Self</text>
  <text x="50" y="162" fill="#58a6ff" font-size="10" font-weight="bold">+0x60 ProcessEnvironmentBlock</text>
  <text x="50" y="178" fill="#8b949e" font-size="9">+0x68 LastErrorValue</text>

  <text x="110" y="210" text-anchor="middle" fill="#f0883e" font-size="9">GS:[0x60] (x64)</text>
  <text x="110" y="224" text-anchor="middle" fill="#f0883e" font-size="9">FS:[0x30] (x86)</text>

  <!-- Arrow TEB -> PEB -->
  <line x1="190" y1="125" x2="250" y2="125" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- PEB -->
  <rect x="260" y="60" width="170" height="160" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="345" y="82" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">PEB</text>
  <text x="345" y="100" text-anchor="middle" fill="#8b949e" font-size="9">Process Environment Block</text>
  <line x1="270" y1="112" x2="420" y2="112" stroke="#8b949e" stroke-width="0.5"/>
  <text x="275" y="130" fill="#8b949e" font-size="9">+0x02 BeingDebugged</text>
  <text x="275" y="146" fill="#8b949e" font-size="9">+0x10 ImageBaseAddress</text>
  <text x="275" y="162" fill="#58a6ff" font-size="10" font-weight="bold">+0x18 Ldr (PEB_LDR_DATA*)</text>
  <text x="275" y="178" fill="#8b949e" font-size="9">+0x20 ProcessParameters</text>
  <text x="275" y="194" fill="#8b949e" font-size="9">+0x68 NtGlobalFlag</text>

  <!-- Arrow PEB -> LDR -->
  <line x1="430" y1="125" x2="490" y2="125" stroke="#58a6ff" stroke-width="2" marker-end="url(#ar)"/>

  <!-- PEB_LDR_DATA -->
  <rect x="500" y="60" width="210" height="140" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="605" y="82" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">PEB_LDR_DATA</text>
  <line x1="510" y1="94" x2="700" y2="94" stroke="#8b949e" stroke-width="0.5"/>
  <text x="515" y="112" fill="#8b949e" font-size="9">+0x0C InLoadOrderModuleList</text>
  <text x="515" y="130" fill="#3fb950" font-size="10" font-weight="bold">+0x14 InMemoryOrderModuleList</text>
  <text x="515" y="148" fill="#8b949e" font-size="9">+0x1C InInitializationOrderList</text>
  <text x="515" y="168" fill="#8b949e" font-size="9">+0x20 EntryInProgress</text>

  <!-- Arrow LDR -> Module List -->
  <line x1="605" y1="200" x2="605" y2="250" stroke="#3fb950" stroke-width="2" marker-end="url(#ar)"/>
  <text x="605" y="245" text-anchor="middle" fill="#3fb950" font-size="9">Walk Flink pointers</text>

  <!-- Module List (linked list) -->
  <rect x="50" y="270" width="900" height="290" rx="8" fill="#0d1117" stroke="#8b949e" stroke-width="1" stroke-dasharray="4"/>
  <text x="500" y="295" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="bold">InMemoryOrderModuleList — Doubly-Linked List of LDR_DATA_TABLE_ENTRY</text>

  <!-- Module 1: EXE -->
  <rect x="70" y="315" width="200" height="120" rx="5" fill="#161b22" stroke="#8b949e" stroke-width="1"/>
  <text x="170" y="338" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="bold">Entry 1: program.exe</text>
  <line x1="80" y1="348" x2="260" y2="348" stroke="#8b949e" stroke-width="0.5"/>
  <text x="85" y="366" fill="#8b949e" font-size="9">DllBase: 0x00400000</text>
  <text x="85" y="382" fill="#8b949e" font-size="9">BaseDllName: "program.exe"</text>
  <text x="85" y="398" fill="#8b949e" font-size="9">Hash: 0xA1B2C3D4</text>
  <text x="85" y="414" fill="#8b949e" font-size="9">Flink ----&gt;</text>

  <!-- Arrow 1->2 -->
  <line x1="270" y1="375" x2="310" y2="375" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Module 2: ntdll.dll -->
  <rect x="320" y="315" width="200" height="120" rx="5" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="420" y="338" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">Entry 2: ntdll.dll</text>
  <line x1="330" y1="348" x2="510" y2="348" stroke="#8b949e" stroke-width="0.5"/>
  <text x="335" y="366" fill="#8b949e" font-size="9">DllBase: 0x7FF80000</text>
  <text x="335" y="382" fill="#8b949e" font-size="9">BaseDllName: "ntdll.dll"</text>
  <text x="335" y="398" fill="#8b949e" font-size="9">Hash: 0xE7F93BC1</text>
  <text x="335" y="414" fill="#8b949e" font-size="9">Flink ----&gt;</text>

  <!-- Arrow 2->3 -->
  <line x1="520" y1="375" x2="560" y2="375" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Module 3: kernel32.dll (TARGET) -->
  <rect x="570" y="315" width="200" height="120" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="2.5"/>
  <text x="670" y="338" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">Entry 3: kernel32.dll</text>
  <line x1="580" y1="348" x2="760" y2="348" stroke="#3fb950" stroke-width="0.5"/>
  <text x="585" y="366" fill="#3fb950" font-size="9">DllBase: 0x7FF81000</text>
  <text x="585" y="382" fill="#3fb950" font-size="9" font-weight="bold">BaseDllName: "KERNEL32.DLL"</text>
  <text x="585" y="398" fill="#3fb950" font-size="9">DJB2 Hash: 0x6DDB9555</text>
  <text x="585" y="414" fill="#3fb950" font-size="9">Flink ----&gt;</text>

  <!-- FOUND badge -->
  <rect x="775" y="320" width="70" height="22" rx="4" fill="#3fb950" opacity="0.3"/>
  <text x="810" y="336" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">FOUND!</text>

  <!-- Arrow 3-> more -->
  <line x1="770" y1="375" x2="810" y2="375" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- More modules -->
  <rect x="820" y="350" width="110" height="50" rx="5" fill="#161b22" stroke="#8b949e" stroke-width="1" stroke-dasharray="3"/>
  <text x="875" y="380" text-anchor="middle" fill="#8b949e" font-size="10">... more DLLs</text>

  <!-- Hash comparison logic -->
  <rect x="750" y="455" width="190" height="90" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="845" y="478" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">Hash Comparison</text>
  <text x="760" y="498" fill="#c9d1d9" font-size="9">for each wchar in name:</text>
  <text x="760" y="514" fill="#c9d1d9" font-size="9">  hash = (hash &lt;&lt; 5) + hash + c</text>
  <text x="760" y="530" fill="#c9d1d9" font-size="9">if hash == 0x6DDB9555: found!</text>
</svg>
