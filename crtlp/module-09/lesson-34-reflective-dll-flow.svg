<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="ar-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f85149"/></marker>
    <marker id="ar-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Reflective DLL Injection vs LoadLibrary</text>

  <!-- Left: Standard DLL Injection (Detectable) -->
  <rect x="30" y="50" width="440" height="500" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="250" y="75" text-anchor="middle" fill="#f85149" font-size="14" font-weight="bold">Standard DLL Injection</text>
  <text x="250" y="92" text-anchor="middle" fill="#8b949e" font-size="10">DETECTABLE — Generates extensive telemetry</text>

  <rect x="120" y="108" width="260" height="34" rx="5" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="250" y="130" text-anchor="middle" fill="#c9d1d9" font-size="11">1. CreateRemoteThread()</text>
  <line x1="250" y1="142" x2="250" y2="162" stroke="#f85149" stroke-width="1.5" marker-end="url(#ar-red)"/>

  <rect x="120" y="165" width="260" height="34" rx="5" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="250" y="187" text-anchor="middle" fill="#c9d1d9" font-size="11">2. LoadLibraryA("evil.dll")</text>
  <line x1="250" y1="199" x2="250" y2="219" stroke="#f85149" stroke-width="1.5" marker-end="url(#ar-red)"/>

  <rect x="120" y="222" width="260" height="34" rx="5" fill="#161b22" stroke="#ff7b72" stroke-width="2"/>
  <text x="250" y="244" text-anchor="middle" fill="#ff7b72" font-size="11" font-weight="bold">3. Disk I/O (file read)</text>
  <rect x="390" y="225" width="70" height="26" rx="4" fill="#f85149" opacity="0.2"/>
  <text x="425" y="243" text-anchor="middle" fill="#f85149" font-size="9" font-weight="bold">DETECTED</text>
  <line x1="250" y1="256" x2="250" y2="276" stroke="#f85149" stroke-width="1.5" marker-end="url(#ar-red)"/>

  <rect x="120" y="279" width="260" height="34" rx="5" fill="#161b22" stroke="#ff7b72" stroke-width="2"/>
  <text x="250" y="301" text-anchor="middle" fill="#ff7b72" font-size="11" font-weight="bold">4. Minifilter callback</text>
  <rect x="390" y="282" width="70" height="26" rx="4" fill="#f85149" opacity="0.2"/>
  <text x="425" y="300" text-anchor="middle" fill="#f85149" font-size="9" font-weight="bold">DETECTED</text>
  <line x1="250" y1="313" x2="250" y2="333" stroke="#f85149" stroke-width="1.5" marker-end="url(#ar-red)"/>

  <rect x="120" y="336" width="260" height="34" rx="5" fill="#161b22" stroke="#ff7b72" stroke-width="2"/>
  <text x="250" y="358" text-anchor="middle" fill="#ff7b72" font-size="10" font-weight="bold">5. PsSetLoadImageNotifyRoutine</text>
  <rect x="390" y="339" width="70" height="26" rx="4" fill="#f85149" opacity="0.2"/>
  <text x="425" y="357" text-anchor="middle" fill="#f85149" font-size="9" font-weight="bold">DETECTED</text>
  <line x1="250" y1="370" x2="250" y2="390" stroke="#f85149" stroke-width="1.5" marker-end="url(#ar-red)"/>

  <rect x="120" y="393" width="260" height="34" rx="5" fill="#161b22" stroke="#ff7b72" stroke-width="2"/>
  <text x="250" y="415" text-anchor="middle" fill="#ff7b72" font-size="11" font-weight="bold">6. PEB Module List entry</text>
  <rect x="390" y="396" width="70" height="26" rx="4" fill="#f85149" opacity="0.2"/>
  <text x="425" y="414" text-anchor="middle" fill="#f85149" font-size="9" font-weight="bold">DETECTED</text>
  <line x1="250" y1="427" x2="250" y2="447" stroke="#f85149" stroke-width="1.5" marker-end="url(#ar-red)"/>

  <rect x="120" y="450" width="260" height="34" rx="5" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="250" y="472" text-anchor="middle" fill="#c9d1d9" font-size="11">7. DllMain() executes</text>

  <text x="250" y="510" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">6 detection points</text>
  <text x="250" y="528" text-anchor="middle" fill="#8b949e" font-size="10">Every EDR sees everything</text>

  <!-- Right: Reflective DLL Injection (Evasive) -->
  <rect x="530" y="50" width="440" height="500" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="750" y="75" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">Reflective DLL Injection</text>
  <text x="750" y="92" text-anchor="middle" fill="#8b949e" font-size="10">EVASIVE — Bypasses most telemetry sources</text>

  <rect x="620" y="108" width="260" height="34" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="750" y="130" text-anchor="middle" fill="#c9d1d9" font-size="11">1. WriteProcessMemory()</text>
  <line x1="750" y1="142" x2="750" y2="162" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ar-green)"/>

  <rect x="620" y="165" width="260" height="34" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="750" y="187" text-anchor="middle" fill="#c9d1d9" font-size="11">2. CreateRemoteThread()</text>
  <line x1="750" y1="199" x2="750" y2="219" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ar-green)"/>

  <rect x="620" y="222" width="260" height="34" rx="5" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
  <text x="750" y="244" text-anchor="middle" fill="#7ee787" font-size="11" font-weight="bold">3. ReflectiveLoader()</text>
  <rect x="540" y="225" width="70" height="26" rx="4" fill="#3fb950" opacity="0.2"/>
  <text x="575" y="243" text-anchor="middle" fill="#3fb950" font-size="9" font-weight="bold">IN-MEM</text>
  <line x1="750" y1="256" x2="750" y2="276" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ar-green)"/>

  <rect x="620" y="279" width="260" height="34" rx="5" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
  <text x="750" y="301" text-anchor="middle" fill="#7ee787" font-size="11">No disk I/O</text>
  <rect x="540" y="282" width="70" height="26" rx="4" fill="#3fb950" opacity="0.2"/>
  <text x="575" y="300" text-anchor="middle" fill="#3fb950" font-size="9" font-weight="bold">BYPASS</text>
  <line x1="750" y1="313" x2="750" y2="333" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ar-green)"/>

  <rect x="620" y="336" width="260" height="34" rx="5" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
  <text x="750" y="358" text-anchor="middle" fill="#7ee787" font-size="11">No kernel callback fired</text>
  <rect x="540" y="339" width="70" height="26" rx="4" fill="#3fb950" opacity="0.2"/>
  <text x="575" y="357" text-anchor="middle" fill="#3fb950" font-size="9" font-weight="bold">BYPASS</text>
  <line x1="750" y1="370" x2="750" y2="390" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ar-green)"/>

  <rect x="620" y="393" width="260" height="34" rx="5" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
  <text x="750" y="415" text-anchor="middle" fill="#7ee787" font-size="11">No PEB module entry</text>
  <rect x="540" y="396" width="70" height="26" rx="4" fill="#3fb950" opacity="0.2"/>
  <text x="575" y="414" text-anchor="middle" fill="#3fb950" font-size="9" font-weight="bold">BYPASS</text>
  <line x1="750" y1="427" x2="750" y2="447" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ar-green)"/>

  <rect x="620" y="450" width="260" height="34" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="750" y="472" text-anchor="middle" fill="#c9d1d9" font-size="11">6. DllMain() executes</text>

  <text x="750" y="510" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">4 detections bypassed</text>
  <text x="750" y="528" text-anchor="middle" fill="#8b949e" font-size="10">Only unbacked memory remains visible</text>

  <!-- VS divider -->
  <circle cx="500" y="300" r="20" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="500" y="305" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">VS</text>
</svg>
