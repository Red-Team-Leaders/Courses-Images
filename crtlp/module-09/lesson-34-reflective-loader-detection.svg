<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="30" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Reflective Loader Detection Surface</text>

  <!-- Detection 1: IAT Anomalies -->
  <rect x="30" y="50" width="450" height="120" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <rect x="30" y="50" width="450" height="28" rx="8" fill="#f85149" fill-opacity="0.15"/>
  <text x="255" y="70" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">1. IAT Anomalies</text>
  <text x="50" y="98" fill="#c9d1d9" font-size="11">Reflective DLL has no IAT entries in PEB module list</text>
  <text x="50" y="118" fill="#f0883e" font-size="11">Detection: LdrpHashTable walk shows module not in</text>
  <text x="50" y="138" fill="#f0883e" font-size="11">InLoadOrderModuleList despite executable pages</text>
  <text x="50" y="158" fill="#3fb950" font-size="10">Evasion: Link into PEB manually (AddDllToModuleList)</text>

  <!-- Detection 2: Unbacked Memory -->
  <rect x="520" y="50" width="450" height="120" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <rect x="520" y="50" width="450" height="28" rx="8" fill="#f85149" fill-opacity="0.15"/>
  <text x="745" y="70" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">2. Unbacked Private Memory (RX)</text>
  <text x="540" y="98" fill="#c9d1d9" font-size="11">VirtualAlloc'd pages = MEM_PRIVATE, not MEM_IMAGE</text>
  <text x="540" y="118" fill="#f0883e" font-size="11">Detection: NtQueryVirtualMemory shows executable</text>
  <text x="540" y="138" fill="#f0883e" font-size="11">pages with Type=MEM_PRIVATE (no backing file on disk)</text>
  <text x="540" y="158" fill="#3fb950" font-size="10">Evasion: Module stomping (overwrite legit DLL .text)</text>

  <!-- Detection 3: PE Header Artifacts -->
  <rect x="30" y="190" width="450" height="120" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <rect x="30" y="190" width="450" height="28" rx="8" fill="#f85149" fill-opacity="0.15"/>
  <text x="255" y="210" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">3. PE Header Artifacts</text>
  <text x="50" y="238" fill="#c9d1d9" font-size="11">MZ/PE signature at allocation base address</text>
  <text x="50" y="258" fill="#f0883e" font-size="11">Detection: Scan MEM_PRIVATE for 0x4D5A (MZ) at</text>
  <text x="50" y="278" fill="#f0883e" font-size="11">page-aligned addresses + 0x3C offset = PE\0\0</text>
  <text x="50" y="298" fill="#3fb950" font-size="10">Evasion: stomppe=true, overwrite headers post-load</text>

  <!-- Detection 4: YARA Memory Scanners -->
  <rect x="520" y="190" width="450" height="120" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <rect x="520" y="190" width="450" height="28" rx="8" fill="#f85149" fill-opacity="0.15"/>
  <text x="745" y="210" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">4. YARA / Memory Scanners</text>
  <text x="540" y="238" fill="#c9d1d9" font-size="11">Scan process memory for known beacon patterns</text>
  <text x="540" y="258" fill="#f0883e" font-size="11">Rule: pe.exports("ReflectiveLoader") or</text>
  <text x="540" y="278" fill="#f0883e" font-size="11">$beacon_config = {00 01 00 01 00 02} at PE overlay</text>
  <text x="540" y="298" fill="#3fb950" font-size="10">Evasion: strrep + sleep mask encrypt in memory</text>

  <!-- Detection 5: ETW Events -->
  <rect x="30" y="330" width="450" height="120" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <rect x="30" y="330" width="450" height="28" rx="8" fill="#f85149" fill-opacity="0.15"/>
  <text x="255" y="350" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">5. ETW Thread Creation Events</text>
  <text x="50" y="378" fill="#c9d1d9" font-size="11">ETW logs thread start address in foreign module</text>
  <text x="50" y="398" fill="#f0883e" font-size="11">Microsoft-Windows-Threat-Intelligence provider</text>
  <text x="50" y="418" fill="#f0883e" font-size="11">EtwTi_ThreadCreate with unbacked start address</text>
  <text x="50" y="438" fill="#3fb950" font-size="10">Evasion: Thread start at ntdll ROP gadget</text>

  <!-- Detection 6: Call Stack Analysis -->
  <rect x="520" y="330" width="450" height="120" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <rect x="520" y="330" width="450" height="28" rx="8" fill="#f85149" fill-opacity="0.15"/>
  <text x="745" y="350" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">6. Call Stack Anomalies</text>
  <text x="540" y="378" fill="#c9d1d9" font-size="11">Stack frames from unbacked memory regions</text>
  <text x="540" y="398" fill="#f0883e" font-size="11">Detection: RtlVirtualUnwind on each frame,</text>
  <text x="540" y="418" fill="#f0883e" font-size="11">check return address against loaded module list</text>
  <text x="540" y="438" fill="#3fb950" font-size="10">Evasion: Stack spoofing (synthetic frames)</text>

  <!-- Summary -->
  <rect x="30" y="470" width="940" height="95" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="50" y="495" fill="#58a6ff" font-size="13" font-weight="bold">Detection Priority (EDR vendor focus)</text>
  <text x="50" y="520" fill="#f85149" font-size="12">HIGH: Unbacked RX memory + PE headers = CrowdStrike, SentinelOne primary detection</text>
  <text x="50" y="540" fill="#f0883e" font-size="12">MEDIUM: ETW thread events + call stack analysis = Elastic, Microsoft Defender</text>
  <text x="50" y="555" fill="#3fb950" font-size="12">LOW: YARA memory scans = periodic, not real-time (BeaconEye, pe-sieve, Moneta)</text>
</svg>