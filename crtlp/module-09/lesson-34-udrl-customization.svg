<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="ar-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">UDRL Kit Customization Pipeline</text>

  <!-- Source Components -->
  <rect x="30" y="65" width="180" height="80" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="120" y="90" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">beacon.dll</text>
  <text x="120" y="110" text-anchor="middle" fill="#8b949e" font-size="10">Default Cobalt Strike</text>
  <text x="120" y="125" text-anchor="middle" fill="#8b949e" font-size="10">Beacon Payload</text>

  <rect x="250" y="65" width="180" height="80" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="340" y="90" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">udrl_api.h</text>
  <text x="340" y="110" text-anchor="middle" fill="#8b949e" font-size="10">UDRL API Header</text>
  <text x="340" y="125" text-anchor="middle" fill="#8b949e" font-size="10">Hook Definitions</text>

  <!-- Arrows from sources to custom loader -->
  <line x1="210" y1="105" x2="250" y2="105" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="430" y1="105" x2="480" y2="105" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Custom ReflectiveLoader -->
  <rect x="480" y="55" width="240" height="100" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="600" y="82" text-anchor="middle" fill="#f0883e" font-size="14" font-weight="bold">Custom ReflectiveLoader()</text>
  <text x="600" y="102" text-anchor="middle" fill="#c9d1d9" font-size="11">Operator-defined loader</text>
  <text x="600" y="118" text-anchor="middle" fill="#c9d1d9" font-size="11">replaces default RDI stub</text>
  <text x="600" y="138" text-anchor="middle" fill="#8b949e" font-size="10">Position-independent code</text>

  <!-- Operator label -->
  <rect x="770" y="65" width="200" height="80" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="870" y="88" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Operator Override</text>
  <text x="870" y="108" text-anchor="middle" fill="#7ee787" font-size="10">Replaces default loader</text>
  <text x="870" y="123" text-anchor="middle" fill="#7ee787" font-size="10">with custom implementation</text>
  <line x1="770" y1="105" x2="720" y2="105" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Arrow down to hooks -->
  <line x1="600" y1="155" x2="600" y2="195" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="615" y="180" fill="#8b949e" font-size="10">triggers</text>

  <!-- Hook Pipeline -->
  <text x="500" y="215" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="bold">UDRL Hook Pipeline</text>

  <!-- Hook 1: BEFORE_RESOLVE -->
  <rect x="50" y="235" width="270" height="120" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="185" y="258" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">UDRL_BEFORE_RESOLVE</text>
  <line x1="60" y1="268" x2="310" y2="268" stroke="#f85149" stroke-width="0.5"/>
  <text x="185" y="288" text-anchor="middle" fill="#c9d1d9" font-size="10">Called before API resolution</text>
  <text x="185" y="305" text-anchor="middle" fill="#8b949e" font-size="10">- Custom GetProcAddress</text>
  <text x="185" y="320" text-anchor="middle" fill="#8b949e" font-size="10">- API hashing override</text>
  <text x="185" y="335" text-anchor="middle" fill="#8b949e" font-size="10">- Syscall stub injection</text>
  <circle cx="70" cy="252" r="8" fill="#f85149" opacity="0.3"/>
  <text x="70" y="256" text-anchor="middle" fill="#f85149" font-size="10" font-weight="bold">1</text>

  <!-- Hook 2: AFTER_MAP -->
  <rect x="365" y="235" width="270" height="120" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="500" y="258" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">UDRL_AFTER_MAP</text>
  <line x1="375" y1="268" x2="625" y2="268" stroke="#f0883e" stroke-width="0.5"/>
  <text x="500" y="288" text-anchor="middle" fill="#c9d1d9" font-size="10">Called after section mapping</text>
  <text x="500" y="305" text-anchor="middle" fill="#8b949e" font-size="10">- Memory permission tweaks</text>
  <text x="500" y="320" text-anchor="middle" fill="#8b949e" font-size="10">- Section encryption</text>
  <text x="500" y="335" text-anchor="middle" fill="#8b949e" font-size="10">- Anti-scan stomping</text>
  <circle cx="385" cy="252" r="8" fill="#f0883e" opacity="0.3"/>
  <text x="385" y="256" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="bold">2</text>

  <!-- Hook 3: BEFORE_EXEC -->
  <rect x="680" y="235" width="270" height="120" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="815" y="258" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">UDRL_BEFORE_EXEC</text>
  <line x1="690" y1="268" x2="940" y2="268" stroke="#3fb950" stroke-width="0.5"/>
  <text x="815" y="288" text-anchor="middle" fill="#c9d1d9" font-size="10">Called before entry point</text>
  <text x="815" y="305" text-anchor="middle" fill="#8b949e" font-size="10">- Environment setup</text>
  <text x="815" y="320" text-anchor="middle" fill="#8b949e" font-size="10">- Thread context spoof</text>
  <text x="815" y="335" text-anchor="middle" fill="#8b949e" font-size="10">- Stack frame forgery</text>
  <circle cx="700" cy="252" r="8" fill="#3fb950" opacity="0.3"/>
  <text x="700" y="256" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">3</text>

  <!-- Arrows between hooks -->
  <line x1="320" y1="295" x2="365" y2="295" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="635" y1="295" x2="680" y2="295" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Arrow down to final payload -->
  <line x1="815" y1="355" x2="815" y2="395" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Final Payload -->
  <rect x="250" y="400" width="500" height="130" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="500" y="428" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">Final Customized Payload</text>
  <line x1="270" y1="440" x2="730" y2="440" stroke="#3fb950" stroke-width="0.5"/>

  <rect x="280" y="455" width="200" height="55" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="380" y="475" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="bold">Beacon Core</text>
  <text x="380" y="492" text-anchor="middle" fill="#8b949e" font-size="9">Original functionality</text>

  <text x="500" y="485" text-anchor="middle" fill="#f0883e" font-size="16">+</text>

  <rect x="520" y="455" width="200" height="55" rx="4" fill="#0d1117" stroke="#f0883e" stroke-width="1"/>
  <text x="620" y="475" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="bold">Custom Loader</text>
  <text x="620" y="492" text-anchor="middle" fill="#8b949e" font-size="9">Operator modifications</text>

  <!-- Legend -->
  <rect x="30" y="420" width="180" height="100" rx="4" fill="#0d1117" stroke="#8b949e" stroke-width="0.5"/>
  <text x="40" y="440" fill="#c9d1d9" font-size="10" font-weight="bold">Pipeline Legend</text>
  <rect x="40" y="450" width="10" height="10" fill="#f85149"/>
  <text x="58" y="460" fill="#8b949e" font-size="9">Pre-resolution hook</text>
  <rect x="40" y="468" width="10" height="10" fill="#f0883e"/>
  <text x="58" y="478" fill="#8b949e" font-size="9">Post-mapping hook</text>
  <rect x="40" y="486" width="10" height="10" fill="#3fb950"/>
  <text x="58" y="496" fill="#8b949e" font-size="9">Pre-execution hook</text>
  <rect x="40" y="504" width="10" height="10" fill="#58a6ff"/>
  <text x="58" y="514" fill="#8b949e" font-size="9">Source components</text>

  <text x="500" y="565" text-anchor="middle" fill="#8b949e" font-size="10">Cobalt Strike UDRL enables operator customization at each loading phase</text>
</svg>