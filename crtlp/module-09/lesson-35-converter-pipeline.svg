<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="arDown" markerWidth="7" markerHeight="10" refX="3.5" refY="9" orient="auto"><polygon points="0 0,3.5 10,7 0" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" fill="#58a6ff" font-size="20" font-weight="bold">Python sRDI Converter Pipeline</text>
  <text x="500" y="55" text-anchor="middle" fill="#8b949e" font-size="12">ConvertToShellcode.py -- DLL to Position-Independent Shellcode</text>

  <!-- Input parameters (top) -->
  <text x="500" y="85" text-anchor="middle" fill="#f0883e" font-size="14" font-weight="bold">Input Parameters</text>

  <rect x="60" y="97" width="200" height="55" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="160" y="117" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">DLL Path</text>
  <text x="160" y="137" text-anchor="middle" fill="#c9d1d9" font-size="10">payload.dll (any PE DLL)</text>
  <text x="160" y="148" text-anchor="middle" fill="#8b949e" font-size="8">Required</text>

  <rect x="290" y="97" width="200" height="55" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="390" y="117" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">Function Name</text>
  <text x="390" y="137" text-anchor="middle" fill="#c9d1d9" font-size="10">Optional exported function</text>
  <text x="390" y="148" text-anchor="middle" fill="#8b949e" font-size="8">Optional (hashed at convert time)</text>

  <rect x="520" y="97" width="200" height="55" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="620" y="117" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">User Data</text>
  <text x="620" y="137" text-anchor="middle" fill="#c9d1d9" font-size="10">Custom args to function</text>
  <text x="620" y="148" text-anchor="middle" fill="#8b949e" font-size="8">Optional (appended to config)</text>

  <rect x="750" y="97" width="200" height="55" rx="6" fill="#161b22" stroke="#c9d1d9" stroke-width="1.5"/>
  <text x="850" y="117" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="bold">Flags</text>
  <text x="850" y="137" text-anchor="middle" fill="#c9d1d9" font-size="10">CLEAR_HEADER, etc.</text>
  <text x="850" y="148" text-anchor="middle" fill="#8b949e" font-size="8">Optional (default: 0)</text>

  <!-- Arrows down to pipeline -->
  <line x1="160" y1="152" x2="160" y2="178" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arDown)"/>
  <line x1="390" y1="152" x2="390" y2="178" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arDown)"/>
  <line x1="620" y1="152" x2="620" y2="178" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arDown)"/>
  <line x1="850" y1="152" x2="850" y2="178" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arDown)"/>

  <!-- Pipeline stages (horizontal flow) -->
  <!-- Stage 1: Read DLL -->
  <rect x="40" y="183" width="160" height="90" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="62" cy="203" r="12" fill="#58a6ff" opacity="0.2"/>
  <text x="62" y="208" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">1</text>
  <text x="120" y="208" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Read DLL</text>
  <line x1="55" y1="218" x2="185" y2="218" stroke="#30363d" stroke-width="1"/>
  <text x="55" y="236" fill="#c9d1d9" font-size="9">open(dll_path, 'rb')</text>
  <text x="55" y="250" fill="#c9d1d9" font-size="9">dll_bytes = f.read()</text>
  <text x="55" y="264" fill="#8b949e" font-size="8">Raw PE bytes loaded</text>

  <!-- Arrow -->
  <line x1="200" y1="228" x2="222" y2="228" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Stage 2: Hash Function -->
  <rect x="227" y="183" width="160" height="90" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <circle cx="249" cy="203" r="12" fill="#f0883e" opacity="0.2"/>
  <text x="249" y="208" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">2</text>
  <text x="315" y="208" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">Hash Function</text>
  <line x1="242" y1="218" x2="372" y2="218" stroke="#30363d" stroke-width="1"/>
  <text x="242" y="236" fill="#c9d1d9" font-size="9">if function_name:</text>
  <text x="250" y="250" fill="#c9d1d9" font-size="9">hash = HashFunctionName()</text>
  <text x="242" y="264" fill="#8b949e" font-size="8">ROR13 hash of export name</text>

  <!-- Arrow -->
  <line x1="387" y1="228" x2="409" y2="228" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Stage 3: Generate Bootstrap -->
  <rect x="414" y="183" width="170" height="90" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <circle cx="436" cy="203" r="12" fill="#f0883e" opacity="0.2"/>
  <text x="436" y="208" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">3</text>
  <text x="507" y="208" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">Gen Bootstrap</text>
  <line x1="429" y1="218" x2="569" y2="218" stroke="#30363d" stroke-width="1"/>
  <text x="429" y="236" fill="#c9d1d9" font-size="9">Position-independent stub</text>
  <text x="429" y="250" fill="#c9d1d9" font-size="9">call $+0; pop reg</text>
  <text x="429" y="264" fill="#8b949e" font-size="8">~50 bytes x86/x64 asm</text>

  <!-- Arrow -->
  <line x1="584" y1="228" x2="606" y2="228" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Stage 4: Prepend Loader -->
  <rect x="611" y="183" width="170" height="90" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="633" cy="203" r="12" fill="#58a6ff" opacity="0.2"/>
  <text x="633" y="208" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">4</text>
  <text x="704" y="208" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Prepend Loader</text>
  <line x1="626" y1="218" x2="766" y2="218" stroke="#30363d" stroke-width="1"/>
  <text x="626" y="236" fill="#c9d1d9" font-size="9">Compiled reflective loader</text>
  <text x="626" y="250" fill="#c9d1d9" font-size="9">rdi_shellcode_[32|64]</text>
  <text x="626" y="264" fill="#8b949e" font-size="8">~4KB position-indep. loader</text>

  <!-- Arrow -->
  <line x1="781" y1="228" x2="803" y2="228" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Stage 5: Pack & Output -->
  <rect x="808" y="183" width="170" height="90" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <circle cx="830" cy="203" r="12" fill="#3fb950" opacity="0.2"/>
  <text x="830" y="208" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">5</text>
  <text x="901" y="208" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Pack Output</text>
  <line x1="823" y1="218" x2="963" y2="218" stroke="#30363d" stroke-width="1"/>
  <text x="823" y="236" fill="#c9d1d9" font-size="9">Append DLL + config data</text>
  <text x="823" y="250" fill="#c9d1d9" font-size="9">Write to .bin file</text>
  <text x="823" y="264" fill="#8b949e" font-size="8">Complete shellcode blob</text>

  <!-- Output structure breakdown -->
  <text x="500" y="310" text-anchor="middle" fill="#f0883e" font-size="14" font-weight="bold">Output Structure (byte layout)</text>

  <!-- Memory bar -->
  <rect x="40" y="325" width="100" height="50" rx="4" fill="#f0883e" opacity="0.2" stroke="#f0883e" stroke-width="1.5"/>
  <text x="90" y="345" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="bold">Bootstrap</text>
  <text x="90" y="360" text-anchor="middle" fill="#f0883e" font-size="8">~50 B</text>

  <rect x="140" y="325" width="250" height="50" rx="4" fill="#58a6ff" opacity="0.15" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="265" y="345" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="bold">Reflective Loader (PIC)</text>
  <text x="265" y="360" text-anchor="middle" fill="#58a6ff" font-size="8">~4 KB compiled C</text>

  <rect x="390" y="325" width="400" height="50" rx="4" fill="#c9d1d9" opacity="0.1" stroke="#c9d1d9" stroke-width="1.5"/>
  <text x="590" y="345" text-anchor="middle" fill="#c9d1d9" font-size="10" font-weight="bold">Original DLL Bytes (Complete PE)</text>
  <text x="590" y="360" text-anchor="middle" fill="#c9d1d9" font-size="8">Variable size (full DLL)</text>

  <rect x="790" y="325" width="170" height="50" rx="4" fill="#3fb950" opacity="0.15" stroke="#3fb950" stroke-width="1.5"/>
  <text x="875" y="345" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">Config Data</text>
  <text x="875" y="360" text-anchor="middle" fill="#3fb950" font-size="8">Hash + UserData + Flags</text>

  <!-- Offset markers -->
  <text x="40" y="395" fill="#8b949e" font-size="9">0x00</text>
  <text x="140" y="395" fill="#8b949e" font-size="9">~0x32</text>
  <text x="390" y="395" fill="#8b949e" font-size="9">~0x1032</text>
  <text x="790" y="395" fill="#8b949e" font-size="9">DLL_end</text>

  <!-- Python code snippet -->
  <rect x="40" y="415" width="920" height="120" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="60" y="438" fill="#8b949e" font-size="11" font-weight="bold"># ConvertToShellcode.py (simplified)</text>
  <text x="60" y="458" fill="#58a6ff" font-size="11">from</text><text x="96" y="458" fill="#c9d1d9" font-size="11"> ShellcodeRDI </text><text x="210" y="458" fill="#58a6ff" font-size="11">import</text><text x="260" y="458" fill="#c9d1d9" font-size="11"> ShellcodeRDI, HashFunctionName</text>
  <text x="60" y="478" fill="#c9d1d9" font-size="11">dll_bytes = </text><text x="165" y="478" fill="#3fb950" font-size="11">open</text><text x="200" y="478" fill="#c9d1d9" font-size="11">(dll_path, </text><text x="275" y="478" fill="#f0883e" font-size="11">'rb'</text><text x="300" y="478" fill="#c9d1d9" font-size="11">).read()</text>
  <text x="60" y="498" fill="#c9d1d9" font-size="11">shellcode = ShellcodeRDI(dll_bytes, function_hash, user_data, flags)</text>
  <text x="60" y="518" fill="#3fb950" font-size="11">open</text><text x="95" y="518" fill="#c9d1d9" font-size="11">(output_path, </text><text x="195" y="518" fill="#f0883e" font-size="11">'wb'</text><text x="220" y="518" fill="#c9d1d9" font-size="11">).write(</text><text x="282" y="518" fill="#3fb950" font-size="11">bytes</text><text x="315" y="518" fill="#c9d1d9" font-size="11">(shellcode))</text>

  <!-- Usage example -->
  <rect x="560" y="415" width="390" height="30" rx="4" fill="#0d1117" stroke="#f0883e" stroke-width="1"/>
  <text x="575" y="435" fill="#f0883e" font-size="10">$ python ConvertToShellcode.py payload.dll -f RunPayload</text>

  <!-- CRTLP Badge -->
  <rect x="890" y="550" width="95" height="22" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="937" y="565" text-anchor="middle" fill="#58a6ff" font-size="9">CRTLP Module 09</text>
</svg>