<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="30" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">sRDI Python Converter Pipeline</text>

  <!-- Input -->
  <rect x="30" y="60" width="150" height="70" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="105" y="85" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">payload.dll</text>
  <text x="105" y="105" text-anchor="middle" fill="#8b949e" font-size="8">Standard PE DLL</text>
  <text x="105" y="118" text-anchor="middle" fill="#8b949e" font-size="8">No special exports</text>

  <line x1="180" y1="95" x2="210" y2="95" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Stage 1: Parse -->
  <rect x="215" y="50" width="170" height="90" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="300" y="75" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="bold">1. Parse PE</text>
  <text x="300" y="93" text-anchor="middle" fill="#c9d1d9" font-size="8" font-family="Consolas">pefile.PE(dll_path)</text>
  <text x="300" y="108" text-anchor="middle" fill="#8b949e" font-size="8">Extract architecture,</text>
  <text x="300" y="120" text-anchor="middle" fill="#8b949e" font-size="8">exports, sections</text>

  <line x1="385" y1="95" x2="415" y2="95" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Stage 2: Generate Hash -->
  <rect x="420" y="50" width="170" height="90" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="505" y="75" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="bold">2. Hash Export</text>
  <text x="505" y="93" text-anchor="middle" fill="#c9d1d9" font-size="8" font-family="Consolas">HashFunctionName()</text>
  <text x="505" y="108" text-anchor="middle" fill="#8b949e" font-size="8">ROR13 hash of target</text>
  <text x="505" y="120" text-anchor="middle" fill="#8b949e" font-size="8">export function name</text>

  <line x1="590" y1="95" x2="620" y2="95" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Stage 3: Build Stub -->
  <rect x="625" y="50" width="170" height="90" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="710" y="75" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">3. Build Stub</text>
  <text x="710" y="93" text-anchor="middle" fill="#c9d1d9" font-size="8">Select x86/x64 bootstrap</text>
  <text x="710" y="108" text-anchor="middle" fill="#8b949e" font-size="8">Embed: function hash,</text>
  <text x="710" y="120" text-anchor="middle" fill="#8b949e" font-size="8">user data offset, flags</text>

  <line x1="795" y1="95" x2="825" y2="95" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Stage 4: XOR -->
  <rect x="830" y="50" width="150" height="90" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="905" y="75" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">4. Encrypt</text>
  <text x="905" y="93" text-anchor="middle" fill="#c9d1d9" font-size="8">XOR with random key</text>
  <text x="905" y="108" text-anchor="middle" fill="#8b949e" font-size="8">Key embedded in</text>
  <text x="905" y="120" text-anchor="middle" fill="#8b949e" font-size="8">bootstrap header</text>

  <!-- Arrow down -->
  <line x1="905" y1="140" x2="905" y2="170" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Assembly Layout -->
  <rect x="30" y="170" width="940" height="180" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="500" y="195" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">5. Assemble Final Shellcode</text>

  <rect x="50" y="210" width="180" height="55" rx="4" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950" stroke-width="1.5"/>
  <text x="140" y="230" text-anchor="middle" fill="#3fb950" font-size="9" font-weight="bold">Bootstrap Stub</text>
  <text x="140" y="248" text-anchor="middle" fill="#8b949e" font-size="8">~64 bytes, finds base,</text>
  <text x="140" y="260" text-anchor="middle" fill="#8b949e" font-size="8">calls reflective loader</text>

  <rect x="240" y="210" width="280" height="55" rx="4" fill="#f0883e" fill-opacity="0.15" stroke="#f0883e" stroke-width="1.5"/>
  <text x="380" y="230" text-anchor="middle" fill="#f0883e" font-size="9" font-weight="bold">Reflective Loader (~1.2 KB)</text>
  <text x="380" y="248" text-anchor="middle" fill="#8b949e" font-size="8">PEB walk, VirtualAlloc, map sections,</text>
  <text x="380" y="260" text-anchor="middle" fill="#8b949e" font-size="8">fix relocations, resolve IAT</text>

  <rect x="530" y="210" width="260" height="55" rx="4" fill="#58a6ff" fill-opacity="0.15" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="660" y="230" text-anchor="middle" fill="#58a6ff" font-size="9" font-weight="bold">Encrypted DLL Bytes</text>
  <text x="660" y="248" text-anchor="middle" fill="#8b949e" font-size="8">Full PE, XOR encrypted</text>
  <text x="660" y="260" text-anchor="middle" fill="#8b949e" font-size="8">Decrypted at runtime</text>

  <rect x="800" y="210" width="160" height="55" rx="4" fill="#8b949e" fill-opacity="0.15" stroke="#8b949e" stroke-width="1.5"/>
  <text x="880" y="230" text-anchor="middle" fill="#c9d1d9" font-size="9" font-weight="bold">User Data</text>
  <text x="880" y="248" text-anchor="middle" fill="#8b949e" font-size="8">Args passed to</text>
  <text x="880" y="260" text-anchor="middle" fill="#8b949e" font-size="8">target export</text>

  <text x="500" y="290" text-anchor="middle" fill="#c9d1d9" font-size="9">Offset 0x00                                                              Offset N (variable size)</text>
  <text x="500" y="310" text-anchor="middle" fill="#8b949e" font-size="9">Total size = stub + loader + sizeof(DLL) + sizeof(user_data)</text>
  <text x="500" y="330" text-anchor="middle" fill="#7ee787" font-size="9">Execute from offset 0 — bootstrap handles everything</text>

  <!-- Python usage -->
  <rect x="30" y="370" width="940" height="170" rx="8" fill="#0d1117" stroke="#f0883e" stroke-width="1"/>
  <text x="500" y="395" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">Python Usage</text>
  <text x="50" y="420" fill="#c9d1d9" font-size="10" font-family="Consolas">from ShellcodeRDI import *</text>
  <text x="50" y="440" fill="#c9d1d9" font-size="10" font-family="Consolas">dll = open("payload.dll", "rb").read()</text>
  <text x="50" y="465" fill="#3fb950" font-size="10" font-family="Consolas">shellcode = ConvertToShellcode(dll,</text>
  <text x="50" y="485" fill="#3fb950" font-size="10" font-family="Consolas">    HashFunctionName("RunPayload"),  # target export</text>
  <text x="50" y="505" fill="#3fb950" font-size="10" font-family="Consolas">    userData=b"arg1",               # passed to export</text>
  <text x="50" y="525" fill="#3fb950" font-size="10" font-family="Consolas">    flags=0x1)                       # clear headers flag</text>

  <text x="500" y="560" text-anchor="middle" fill="#58a6ff" font-size="10">CRTLP Module 09 — sRDI Converter Pipeline</text>
</svg>
