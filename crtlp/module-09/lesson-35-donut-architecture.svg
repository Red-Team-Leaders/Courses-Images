<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="arBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#58a6ff"/></marker>
    <marker id="arGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" fill="#58a6ff" font-size="20" font-weight="bold">Donut Framework Architecture</text>
  <text x="500" y="55" text-anchor="middle" fill="#8b949e" font-size="12">Position-independent shellcode generation for .NET, PE, VBS, JS payloads</text>

  <!-- Input Types (Left) -->
  <text x="90" y="85" text-anchor="middle" fill="#f0883e" font-size="14" font-weight="bold">Inputs</text>

  <rect x="20" y="95" width="140" height="38" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="90" y="119" text-anchor="middle" fill="#58a6ff" font-size="12">.NET EXE/DLL</text>

  <rect x="20" y="140" width="140" height="38" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="90" y="164" text-anchor="middle" fill="#3fb950" font-size="12">Native PE (EXE/DLL)</text>

  <rect x="20" y="185" width="140" height="38" rx="5" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="90" y="209" text-anchor="middle" fill="#f0883e" font-size="12">VBScript (.vbs)</text>

  <rect x="20" y="230" width="140" height="38" rx="5" fill="#161b22" stroke="#c9d1d9" stroke-width="1.5"/>
  <text x="90" y="254" text-anchor="middle" fill="#c9d1d9" font-size="12">JScript (.js)</text>

  <rect x="20" y="275" width="140" height="38" rx="5" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="90" y="299" text-anchor="middle" fill="#f85149" font-size="12">Raw Shellcode</text>

  <!-- Arrows from inputs to engine -->
  <line x1="160" y1="114" x2="250" y2="195" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arBlue)"/>
  <line x1="160" y1="159" x2="250" y2="195" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arGreen)"/>
  <line x1="160" y1="204" x2="250" y2="204" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="160" y1="249" x2="250" y2="213" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="160" y1="294" x2="250" y2="220" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Donut Engine (Center) -->
  <rect x="255" y="85" width="280" height="250" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="2.5"/>
  <text x="395" y="112" text-anchor="middle" fill="#f0883e" font-size="16" font-weight="bold">Donut Engine</text>
  <line x1="275" y1="122" x2="515" y2="122" stroke="#30363d" stroke-width="1"/>

  <!-- Engine components -->
  <rect x="275" y="132" width="240" height="32" rx="4" fill="#0d1117" stroke="#f85149" stroke-width="1.2"/>
  <text x="395" y="153" text-anchor="middle" fill="#f85149" font-size="11">AMSI / WLDP / ETW Bypass</text>

  <rect x="275" y="172" width="240" height="32" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="395" y="193" text-anchor="middle" fill="#58a6ff" font-size="11">CLR Hosting Engine (.NET)</text>

  <rect x="275" y="212" width="240" height="32" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="1.2"/>
  <text x="395" y="233" text-anchor="middle" fill="#3fb950" font-size="11">PE Loader (Native)</text>

  <rect x="275" y="252" width="115" height="32" rx="4" fill="#0d1117" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="332" y="273" text-anchor="middle" fill="#c9d1d9" font-size="11">Compression</text>

  <rect x="400" y="252" width="115" height="32" rx="4" fill="#0d1117" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="457" y="273" text-anchor="middle" fill="#c9d1d9" font-size="11">Encryption</text>

  <rect x="275" y="292" width="240" height="32" rx="4" fill="#0d1117" stroke="#f0883e" stroke-width="1.2"/>
  <text x="395" y="313" text-anchor="middle" fill="#f0883e" font-size="11">Instance Configuration</text>

  <!-- Arrow Engine -> Output -->
  <line x1="535" y1="210" x2="605" y2="210" stroke="#f0883e" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="570" y="200" text-anchor="middle" fill="#f0883e" font-size="10">Generate</text>

  <!-- Output -->
  <rect x="610" y="145" width="170" height="130" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="695" y="170" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">Shellcode</text>
  <line x1="630" y1="180" x2="760" y2="180" stroke="#30363d" stroke-width="1"/>
  <text x="630" y="200" fill="#c9d1d9" font-size="10">&#8226; Position-independent</text>
  <text x="630" y="218" fill="#c9d1d9" font-size="10">&#8226; Encrypted payload</text>
  <text x="630" y="236" fill="#c9d1d9" font-size="10">&#8226; Self-decrypting</text>
  <text x="630" y="254" fill="#c9d1d9" font-size="10">&#8226; Evasion built-in</text>

  <!-- Detailed Component Breakdown (Bottom) -->
  <text x="500" y="365" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="bold">Key Components</text>

  <!-- AMSI/WLDP Card -->
  <rect x="20" y="382" width="230" height="105" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="135" y="402" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">AMSI / WLDP Bypass</text>
  <line x1="35" y1="410" x2="235" y2="410" stroke="#30363d" stroke-width="1"/>
  <text x="35" y="428" fill="#c9d1d9" font-size="10">&#8226; Patches AmsiScanBuffer</text>
  <text x="35" y="444" fill="#c9d1d9" font-size="10">&#8226; Patches WldpQueryPolicy</text>
  <text x="35" y="460" fill="#c9d1d9" font-size="10">&#8226; Patches EtwEventWrite</text>
  <text x="35" y="476" fill="#8b949e" font-size="9">Disables runtime scanning before load</text>

  <!-- CLR Hosting Card -->
  <rect x="265" y="382" width="230" height="105" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="380" y="402" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">CLR Hosting</text>
  <line x1="280" y1="410" x2="480" y2="410" stroke="#30363d" stroke-width="1"/>
  <text x="280" y="428" fill="#c9d1d9" font-size="10">&#8226; ICLRMetaHost init</text>
  <text x="280" y="444" fill="#c9d1d9" font-size="10">&#8226; Load target runtime ver</text>
  <text x="280" y="460" fill="#c9d1d9" font-size="10">&#8226; Create AppDomain</text>
  <text x="280" y="476" fill="#8b949e" font-size="9">Assembly.Load() from memory</text>

  <!-- Encryption Card -->
  <rect x="510" y="382" width="230" height="105" rx="6" fill="#161b22" stroke="#c9d1d9" stroke-width="1.5"/>
  <text x="625" y="402" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="bold">Encryption</text>
  <line x1="525" y1="410" x2="725" y2="410" stroke="#30363d" stroke-width="1"/>
  <text x="525" y="428" fill="#c9d1d9" font-size="10">&#8226; Chaskey block cipher</text>
  <text x="525" y="444" fill="#c9d1d9" font-size="10">&#8226; Random IV per instance</text>
  <text x="525" y="460" fill="#c9d1d9" font-size="10">&#8226; Random master key</text>
  <text x="525" y="476" fill="#8b949e" font-size="9">Decrypted at runtime in memory</text>

  <!-- Compression Card -->
  <rect x="755" y="382" width="225" height="105" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="867" y="402" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Compression / Loading</text>
  <line x1="770" y1="410" x2="965" y2="410" stroke="#30363d" stroke-width="1"/>
  <text x="770" y="428" fill="#c9d1d9" font-size="10">&#8226; aPLib / LZNT1 / Xpress</text>
  <text x="770" y="444" fill="#c9d1d9" font-size="10">&#8226; PE section mapping</text>
  <text x="770" y="460" fill="#c9d1d9" font-size="10">&#8226; Import resolution</text>
  <text x="770" y="476" fill="#8b949e" font-size="9">Reduces shellcode size ~40-60%</text>

  <!-- Output format options -->
  <rect x="810" y="145" width="170" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="895" y="168" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="bold">Output Formats</text>
  <line x1="825" y1="176" x2="965" y2="176" stroke="#30363d" stroke-width="1"/>
  <text x="825" y="194" fill="#c9d1d9" font-size="10">&#8226; Raw binary (.bin)</text>
  <text x="825" y="212" fill="#c9d1d9" font-size="10">&#8226; Base64 encoded</text>
  <text x="825" y="230" fill="#c9d1d9" font-size="10">&#8226; C array / Python</text>

  <!-- Attribution -->
  <text x="500" y="520" text-anchor="middle" fill="#8b949e" font-size="10">TheWover &amp; Odzhan | github.com/TheWover/donut</text>

  <!-- CRTLP Badge -->
  <rect x="890" y="545" width="95" height="22" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="937" y="560" text-anchor="middle" fill="#58a6ff" font-size="9">CRTLP Module 09</text>
</svg>