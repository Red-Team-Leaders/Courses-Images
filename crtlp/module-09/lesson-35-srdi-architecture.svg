<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="arBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#58a6ff"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" fill="#58a6ff" font-size="20" font-weight="bold">sRDI Architecture - Shellcode Reflective DLL Injection</text>
  <text x="500" y="55" text-anchor="middle" fill="#8b949e" font-size="12">Converting arbitrary DLLs to position-independent shellcode</text>

  <!-- Input Section -->
  <rect x="40" y="80" width="200" height="120" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="140" y="105" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="bold">Input DLL</text>
  <line x1="60" y1="115" x2="220" y2="115" stroke="#30363d" stroke-width="1"/>
  <text x="60" y="135" fill="#c9d1d9" font-size="11">&#8226; Standard PE DLL (.dll)</text>
  <text x="60" y="153" fill="#c9d1d9" font-size="11">&#8226; No export requirements</text>
  <text x="60" y="171" fill="#c9d1d9" font-size="11">&#8226; x86 or x64</text>
  <text x="60" y="189" fill="#8b949e" font-size="9">Any compiled DLL payload</text>

  <!-- Arrow Input -> Converter -->
  <line x1="240" y1="140" x2="310" y2="140" stroke="#f0883e" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="275" y="132" text-anchor="middle" fill="#f0883e" font-size="9">Feed</text>

  <!-- Converter Box -->
  <rect x="315" y="75" width="220" height="130" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="425" y="100" text-anchor="middle" fill="#f0883e" font-size="15" font-weight="bold">sRDI Converter</text>
  <line x1="335" y1="110" x2="515" y2="110" stroke="#30363d" stroke-width="1"/>
  <text x="335" y="130" fill="#c9d1d9" font-size="10">1. Read DLL bytes</text>
  <text x="335" y="148" fill="#c9d1d9" font-size="10">2. Generate bootstrap stub</text>
  <text x="335" y="166" fill="#c9d1d9" font-size="10">3. Prepend reflective loader</text>
  <text x="335" y="184" fill="#c9d1d9" font-size="10">4. Pack config + user data</text>
  <text x="425" y="200" text-anchor="middle" fill="#8b949e" font-size="9">Python / C# / PowerShell</text>

  <!-- Arrow Converter -> Output -->
  <line x1="535" y1="140" x2="605" y2="140" stroke="#f0883e" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="570" y="132" text-anchor="middle" fill="#f0883e" font-size="9">Emit</text>

  <!-- Output Section -->
  <rect x="610" y="80" width="355" height="120" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="787" y="105" text-anchor="middle" fill="#3fb950" font-size="15" font-weight="bold">Position-Independent Shellcode</text>
  <line x1="630" y1="115" x2="945" y2="115" stroke="#30363d" stroke-width="1"/>
  <text x="630" y="135" fill="#c9d1d9" font-size="11">&#8226; Fully self-contained blob</text>
  <text x="630" y="153" fill="#c9d1d9" font-size="11">&#8226; Executable from any memory address</text>
  <text x="630" y="171" fill="#c9d1d9" font-size="11">&#8226; No external dependencies</text>
  <text x="630" y="189" fill="#8b949e" font-size="9">Ready for injection into any process</text>

  <!-- Shellcode Structure Section -->
  <text x="500" y="250" text-anchor="middle" fill="#f0883e" font-size="17" font-weight="bold">Output Shellcode Structure (Memory Layout)</text>

  <!-- Structure diagram - horizontal blocks -->
  <!-- Bootstrap -->
  <rect x="40" y="275" width="180" height="140" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <rect x="40" y="275" width="180" height="30" rx="6" fill="#f0883e" opacity="0.15"/>
  <text x="130" y="295" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="bold">Bootstrap Stub</text>
  <line x1="55" y1="308" x2="205" y2="308" stroke="#30363d" stroke-width="1"/>
  <text x="55" y="325" fill="#c9d1d9" font-size="10">&#8226; Entry point (RIP)</text>
  <text x="55" y="343" fill="#c9d1d9" font-size="10">&#8226; Calculates offsets</text>
  <text x="55" y="361" fill="#c9d1d9" font-size="10">&#8226; Finds loader address</text>
  <text x="55" y="379" fill="#c9d1d9" font-size="10">&#8226; Sets up arguments</text>
  <text x="55" y="397" fill="#c9d1d9" font-size="10">&#8226; Jumps to loader</text>
  <text x="130" y="413" text-anchor="middle" fill="#8b949e" font-size="9">~50 bytes</text>

  <!-- Arrow -->
  <line x1="220" y1="345" x2="250" y2="345" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Reflective Loader -->
  <rect x="255" y="275" width="210" height="140" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <rect x="255" y="275" width="210" height="30" rx="6" fill="#58a6ff" opacity="0.15"/>
  <text x="360" y="295" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Reflective Loader</text>
  <line x1="270" y1="308" x2="450" y2="308" stroke="#30363d" stroke-width="1"/>
  <text x="270" y="325" fill="#c9d1d9" font-size="10">&#8226; Allocate new memory</text>
  <text x="270" y="343" fill="#c9d1d9" font-size="10">&#8226; Copy PE sections</text>
  <text x="270" y="361" fill="#c9d1d9" font-size="10">&#8226; Fix relocations</text>
  <text x="270" y="379" fill="#c9d1d9" font-size="10">&#8226; Resolve imports (hash)</text>
  <text x="270" y="397" fill="#c9d1d9" font-size="10">&#8226; Call DllMain</text>
  <text x="360" y="413" text-anchor="middle" fill="#8b949e" font-size="9">~4KB compiled</text>

  <!-- Arrow -->
  <line x1="465" y1="345" x2="495" y2="345" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Original DLL -->
  <rect x="500" y="275" width="220" height="140" rx="6" fill="#161b22" stroke="#c9d1d9" stroke-width="2"/>
  <rect x="500" y="275" width="220" height="30" rx="6" fill="#c9d1d9" opacity="0.1"/>
  <text x="610" y="295" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="bold">Original DLL Bytes</text>
  <line x1="515" y1="308" x2="705" y2="308" stroke="#30363d" stroke-width="1"/>
  <text x="515" y="325" fill="#c9d1d9" font-size="10">&#8226; Complete PE file</text>
  <text x="515" y="343" fill="#c9d1d9" font-size="10">&#8226; All sections intact</text>
  <text x="515" y="361" fill="#c9d1d9" font-size="10">&#8226; Headers preserved</text>
  <text x="515" y="379" fill="#c9d1d9" font-size="10">&#8226; Import/Export tables</text>
  <text x="515" y="397" fill="#c9d1d9" font-size="10">&#8226; Relocation data</text>
  <text x="610" y="413" text-anchor="middle" fill="#8b949e" font-size="9">Variable (DLL size)</text>

  <!-- Arrow -->
  <line x1="720" y1="345" x2="750" y2="345" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Config Data -->
  <rect x="755" y="275" width="210" height="140" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <rect x="755" y="275" width="210" height="30" rx="6" fill="#3fb950" opacity="0.15"/>
  <text x="860" y="295" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">Config Data</text>
  <line x1="770" y1="308" x2="950" y2="308" stroke="#30363d" stroke-width="1"/>
  <text x="770" y="325" fill="#c9d1d9" font-size="10">&#8226; Function hash to call</text>
  <text x="770" y="343" fill="#c9d1d9" font-size="10">&#8226; User data blob</text>
  <text x="770" y="361" fill="#c9d1d9" font-size="10">&#8226; User data length</text>
  <text x="770" y="379" fill="#c9d1d9" font-size="10">&#8226; Flags (clear header)</text>
  <text x="770" y="397" fill="#c9d1d9" font-size="10">&#8226; Reserved padding</text>
  <text x="860" y="413" text-anchor="middle" fill="#8b949e" font-size="9">~64 bytes + user data</text>

  <!-- Offset labels -->
  <text x="40" y="435" fill="#f0883e" font-size="10">Offset 0x00</text>
  <text x="500" y="435" fill="#c9d1d9" font-size="10">Loader Size + Bootstrap</text>
  <text x="755" y="435" fill="#3fb950" font-size="10">DLL End</text>

  <!-- Bottom key advantage -->
  <rect x="100" y="455" width="800" height="55" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1"/>
  <text x="500" y="475" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="bold">Key Advantage: No ReflectiveLoader export needed in source DLL</text>
  <text x="500" y="495" text-anchor="middle" fill="#c9d1d9" font-size="11">Loader is prepended externally -- convert ANY DLL to shellcode without recompilation</text>

  <!-- Attribution -->
  <text x="500" y="530" text-anchor="middle" fill="#8b949e" font-size="10">Nick Landers (@monoxgas) | github.com/monoxgas/sRDI</text>

  <!-- CRTLP Badge -->
  <rect x="890" y="545" width="95" height="22" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="937" y="560" text-anchor="middle" fill="#58a6ff" font-size="9">CRTLP Module 09</text>
</svg>