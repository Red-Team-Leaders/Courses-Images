<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="arDown" markerWidth="7" markerHeight="10" refX="3.5" refY="9" orient="auto"><polygon points="0 0,3.5 10,7 0" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>

  <!-- Title -->
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="20" font-weight="bold">sRDI Execution Flow</text>
  <text x="500" y="50" text-anchor="middle" fill="#8b949e" font-size="12">Step-by-step shellcode execution with memory layout</text>

  <!-- Left side: Flow steps (vertical) -->
  <!-- Step 1 -->
  <rect x="40" y="65" width="350" height="48" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <circle cx="62" cy="89" r="12" fill="#f0883e" opacity="0.2"/><text x="62" y="94" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">1</text>
  <text x="82" y="84" fill="#f0883e" font-size="12" font-weight="bold">Bootstrap Executes</text>
  <text x="82" y="100" fill="#c9d1d9" font-size="10">RIP lands on bootstrap, calculates loader offset</text>

  <line x1="215" y1="113" x2="215" y2="129" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arDown)"/>

  <!-- Step 2 -->
  <rect x="40" y="132" width="350" height="48" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <circle cx="62" cy="156" r="12" fill="#f0883e" opacity="0.2"/><text x="62" y="161" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">2</text>
  <text x="82" y="151" fill="#f0883e" font-size="12" font-weight="bold">Find Reflective Loader</text>
  <text x="82" y="167" fill="#c9d1d9" font-size="10">Bootstrap passes DLL ptr, config ptr to loader</text>

  <line x1="215" y1="180" x2="215" y2="196" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arDown)"/>

  <!-- Step 3 -->
  <rect x="40" y="199" width="350" height="48" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="62" cy="223" r="12" fill="#58a6ff" opacity="0.2"/><text x="62" y="228" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">3</text>
  <text x="82" y="218" fill="#58a6ff" font-size="12" font-weight="bold">Allocate New Memory</text>
  <text x="82" y="234" fill="#c9d1d9" font-size="10">VirtualAlloc SizeOfImage from PE optional header</text>

  <line x1="215" y1="247" x2="215" y2="263" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arDown)"/>

  <!-- Step 4 -->
  <rect x="40" y="266" width="350" height="48" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="62" cy="290" r="12" fill="#58a6ff" opacity="0.2"/><text x="62" y="295" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">4</text>
  <text x="82" y="285" fill="#58a6ff" font-size="12" font-weight="bold">Copy PE Sections</text>
  <text x="82" y="301" fill="#c9d1d9" font-size="10">Map each section to correct RVA in new allocation</text>

  <line x1="215" y1="314" x2="215" y2="330" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arDown)"/>

  <!-- Step 5 -->
  <rect x="40" y="333" width="350" height="48" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="62" cy="357" r="12" fill="#58a6ff" opacity="0.2"/><text x="62" y="362" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">5</text>
  <text x="82" y="352" fill="#58a6ff" font-size="12" font-weight="bold">Process Relocations</text>
  <text x="82" y="368" fill="#c9d1d9" font-size="10">Fix base relocation delta for new base address</text>

  <line x1="215" y1="381" x2="215" y2="397" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arDown)"/>

  <!-- Step 6 -->
  <rect x="40" y="400" width="350" height="48" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="62" cy="424" r="12" fill="#58a6ff" opacity="0.2"/><text x="62" y="429" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">6</text>
  <text x="82" y="419" fill="#58a6ff" font-size="12" font-weight="bold">Resolve Imports via Hash</text>
  <text x="82" y="435" fill="#c9d1d9" font-size="10">Walk PEB, hash module+function names, match IAT</text>

  <line x1="215" y1="448" x2="215" y2="464" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arDown)"/>

  <!-- Step 7 -->
  <rect x="40" y="467" width="350" height="48" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <circle cx="62" cy="491" r="12" fill="#3fb950" opacity="0.2"/><text x="62" y="496" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">7</text>
  <text x="82" y="486" fill="#3fb950" font-size="12" font-weight="bold">Call DllMain / Export</text>
  <text x="82" y="502" fill="#c9d1d9" font-size="10">DLL_PROCESS_ATTACH, then optional function by hash</text>

  <line x1="215" y1="515" x2="215" y2="531" stroke="#f0883e" stroke-width="1.5" marker-end="url(#arDown)"/>

  <!-- Step 8: Return -->
  <rect x="100" y="534" width="230" height="30" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="215" y="554" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Return to Caller</text>

  <!-- Right side: Memory Layout -->
  <text x="700" y="80" text-anchor="middle" fill="#f0883e" font-size="15" font-weight="bold">Memory Layout</text>

  <!-- Initial shellcode blob -->
  <text x="555" y="110" fill="#8b949e" font-size="10">Shellcode Blob (Initial)</text>
  <rect x="555" y="118" width="30" height="150" rx="2" fill="#f0883e" opacity="0.3" stroke="#f0883e" stroke-width="1"/>
  <text x="570" y="195" text-anchor="middle" fill="#f0883e" font-size="8" transform="rotate(-90 570 195)">Bootstrap+Loader+DLL+Cfg</text>

  <!-- Arrow to allocated memory -->
  <line x1="588" y1="193" x2="635" y2="193" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="612" y="185" text-anchor="middle" fill="#8b949e" font-size="8">copy</text>

  <!-- New allocation (properly mapped) -->
  <text x="780" y="110" fill="#8b949e" font-size="10">New Allocation (Mapped PE)</text>

  <!-- PE Header section -->
  <rect x="640" y="118" width="280" height="35" rx="0" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="780" y="140" text-anchor="middle" fill="#58a6ff" font-size="11">PE Headers (DOS + NT + Section Table)</text>

  <!-- .text section -->
  <rect x="640" y="153" width="280" height="40" rx="0" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="780" y="168" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">.text (Code)</text>
  <text x="780" y="183" text-anchor="middle" fill="#8b949e" font-size="9">PAGE_EXECUTE_READ</text>

  <!-- .rdata section -->
  <rect x="640" y="193" width="280" height="35" rx="0" fill="#161b22" stroke="#c9d1d9" stroke-width="1"/>
  <text x="780" y="215" text-anchor="middle" fill="#c9d1d9" font-size="11">.rdata (Read-Only Data)</text>

  <!-- .data section -->
  <rect x="640" y="228" width="280" height="35" rx="0" fill="#161b22" stroke="#c9d1d9" stroke-width="1"/>
  <text x="780" y="250" text-anchor="middle" fill="#c9d1d9" font-size="11">.data (Initialized Data)</text>

  <!-- .reloc section -->
  <rect x="640" y="263" width="280" height="35" rx="0" fill="#161b22" stroke="#f0883e" stroke-width="1"/>
  <text x="780" y="285" text-anchor="middle" fill="#f0883e" font-size="11">.reloc (Relocations)</text>

  <!-- IAT -->
  <rect x="640" y="298" width="280" height="35" rx="0" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="780" y="320" text-anchor="middle" fill="#f85149" font-size="11">IAT (Resolved Function Pointers)</text>

  <!-- Address labels -->
  <text x="632" y="135" text-anchor="end" fill="#8b949e" font-size="8">0x00000</text>
  <text x="632" y="170" text-anchor="end" fill="#8b949e" font-size="8">0x01000</text>
  <text x="632" y="210" text-anchor="end" fill="#8b949e" font-size="8">0x02000</text>
  <text x="632" y="247" text-anchor="end" fill="#8b949e" font-size="8">0x03000</text>
  <text x="632" y="282" text-anchor="end" fill="#8b949e" font-size="8">0x04000</text>
  <text x="632" y="317" text-anchor="end" fill="#8b949e" font-size="8">0x05000</text>

  <!-- Steps mapped to memory operations -->
  <rect x="555" y="350" width="400" height="90" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="755" y="370" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">Hash-Based Import Resolution</text>
  <text x="570" y="390" fill="#c9d1d9" font-size="10">for each import:</text>
  <text x="580" y="408" fill="#8b949e" font-size="10">hash = ROR13(module) + ROR13(function)</text>
  <text x="580" y="426" fill="#8b949e" font-size="10">if hash == target: IAT[i] = GetProcAddress(mod, func)</text>

  <!-- Config info -->
  <rect x="555" y="455" width="400" height="75" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="755" y="475" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Post-Load Actions</text>
  <text x="570" y="495" fill="#c9d1d9" font-size="10">&#8226; Call DllMain(hModule, DLL_PROCESS_ATTACH, NULL)</text>
  <text x="570" y="513" fill="#c9d1d9" font-size="10">&#8226; If function_hash: call exported function(user_data)</text>
  <text x="570" y="529" fill="#8b949e" font-size="9">Optional: wipe PE headers if SRDI_CLEARHEADER flag set</text>

  <!-- CRTLP Badge -->
  <rect x="890" y="550" width="95" height="22" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="937" y="565" text-anchor="middle" fill="#58a6ff" font-size="9">CRTLP Module 09</text>
</svg>