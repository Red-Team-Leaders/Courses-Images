<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="30" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">sRDI Bootstrap Execution Flow</text>

  <!-- Step 1 -->
  <rect x="30" y="55" width="180" height="90" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <circle cx="55" cy="75" r="14" fill="#3fb950"/>
  <text x="55" y="80" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="bold">1</text>
  <text x="120" y="78" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">Entry</text>
  <text x="120" y="98" text-anchor="middle" fill="#c9d1d9" font-size="8" font-family="Consolas">call $+5</text>
  <text x="120" y="112" text-anchor="middle" fill="#c9d1d9" font-size="8" font-family="Consolas">pop rbx ; base addr</text>
  <text x="120" y="130" text-anchor="middle" fill="#8b949e" font-size="7">Position-independent</text>

  <line x1="210" y1="100" x2="240" y2="100" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 2 -->
  <rect x="245" y="55" width="180" height="90" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <circle cx="270" cy="75" r="14" fill="#f0883e"/>
  <text x="270" y="80" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="bold">2</text>
  <text x="335" y="78" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="bold">Decrypt DLL</text>
  <text x="335" y="98" text-anchor="middle" fill="#c9d1d9" font-size="8" font-family="Consolas">xor_loop:</text>
  <text x="335" y="112" text-anchor="middle" fill="#c9d1d9" font-size="8" font-family="Consolas">  xor [rsi+rcx],al</text>
  <text x="335" y="130" text-anchor="middle" fill="#8b949e" font-size="7">In-place XOR decode</text>

  <line x1="425" y1="100" x2="455" y2="100" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 3 -->
  <rect x="460" y="55" width="180" height="90" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="485" cy="75" r="14" fill="#58a6ff"/>
  <text x="485" y="80" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="bold">3</text>
  <text x="550" y="78" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="bold">PEB Walk</text>
  <text x="550" y="98" text-anchor="middle" fill="#c9d1d9" font-size="8" font-family="Consolas">gs:[0x60] PEB</text>
  <text x="550" y="112" text-anchor="middle" fill="#c9d1d9" font-size="8" font-family="Consolas">Ldr InMemoryOrder</text>
  <text x="550" y="130" text-anchor="middle" fill="#8b949e" font-size="7">Find kernel32 + ntdll</text>

  <line x1="640" y1="100" x2="670" y2="100" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 4 -->
  <rect x="675" y="55" width="295" height="90" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <circle cx="700" cy="75" r="14" fill="#f0883e"/>
  <text x="700" y="80" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="bold">4</text>
  <text x="822" y="78" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="bold">Resolve APIs via Hash</text>
  <text x="822" y="98" text-anchor="middle" fill="#c9d1d9" font-size="8" font-family="Consolas">hash_compare(export, 0xDEADBEEF)</text>
  <text x="822" y="112" text-anchor="middle" fill="#8b949e" font-size="8">VirtualAlloc, NtFlushInstructionCache,</text>
  <text x="822" y="126" text-anchor="middle" fill="#8b949e" font-size="8">LoadLibraryA, GetProcAddress, RtlAddFunctionTable</text>

  <!-- Arrow down -->
  <line x1="822" y1="145" x2="822" y2="175" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 5 -->
  <rect x="675" y="180" width="295" height="80" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <circle cx="700" cy="200" r="14" fill="#3fb950"/>
  <text x="700" y="205" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="bold">5</text>
  <text x="822" y="200" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">Allocate Memory</text>
  <text x="822" y="218" text-anchor="middle" fill="#c9d1d9" font-size="8" font-family="Consolas">VirtualAlloc(SizeOfImage, RW)</text>
  <text x="822" y="236" text-anchor="middle" fill="#8b949e" font-size="8">Separate allocation for mapped PE</text>
  <text x="822" y="250" text-anchor="middle" fill="#8b949e" font-size="8">No RWX — staged protection</text>

  <line x1="675" y1="220" x2="645" y2="220" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 6 -->
  <rect x="245" y="180" width="395" height="80" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="270" cy="200" r="14" fill="#58a6ff"/>
  <text x="270" y="205" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="bold">6</text>
  <text x="442" y="200" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="bold">Map PE Sections</text>
  <text x="442" y="218" text-anchor="middle" fill="#c9d1d9" font-size="8">Copy headers, iterate sections, memcpy each to VirtualAddress offset</text>
  <text x="442" y="236" text-anchor="middle" fill="#8b949e" font-size="8">.text at base+0x1000, .rdata at base+0x2000, .data at base+0x3000...</text>
  <text x="442" y="250" text-anchor="middle" fill="#8b949e" font-size="8">Apply relocations: base delta to all fixup entries</text>

  <line x1="442" y1="260" x2="442" y2="290" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 7 -->
  <rect x="245" y="295" width="395" height="70" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <circle cx="270" cy="315" r="14" fill="#f0883e"/>
  <text x="270" y="320" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="bold">7</text>
  <text x="442" y="315" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="bold">Resolve Import Address Table</text>
  <text x="442" y="333" text-anchor="middle" fill="#c9d1d9" font-size="8">Walk IAT: LoadLibrary each DLL, GetProcAddress each function</text>
  <text x="442" y="350" text-anchor="middle" fill="#8b949e" font-size="8">Patch function pointers into IAT slots</text>

  <line x1="442" y1="365" x2="442" y2="395" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 8 -->
  <rect x="245" y="400" width="395" height="60" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <circle cx="270" cy="420" r="14" fill="#3fb950"/>
  <text x="270" y="425" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="bold">8</text>
  <text x="442" y="420" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">Set Memory Protections</text>
  <text x="442" y="438" text-anchor="middle" fill="#c9d1d9" font-size="8">VirtualProtect: .text to RX, .rdata to R, .data stays RW</text>
  <text x="442" y="452" text-anchor="middle" fill="#8b949e" font-size="8">NtFlushInstructionCache to ensure coherency</text>

  <line x1="442" y1="460" x2="442" y2="490" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 9 -->
  <rect x="245" y="495" width="395" height="50" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <circle cx="270" cy="515" r="14" fill="#3fb950"/>
  <text x="270" y="520" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="bold">9</text>
  <text x="442" y="515" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">Call Target Export</text>
  <text x="442" y="533" text-anchor="middle" fill="#c9d1d9" font-size="8">Hash-lookup export table, call matching function with user_data arg</text>

  <rect x="680" y="495" width="280" height="50" rx="6" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950" stroke-width="2"/>
  <text x="820" y="520" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">Payload Executing</text>
  <line x1="640" y1="520" x2="675" y2="520" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="500" y="570" text-anchor="middle" fill="#58a6ff" font-size="10">CRTLP Module 09 — sRDI Bootstrap Execution Sequence</text>
</svg>
