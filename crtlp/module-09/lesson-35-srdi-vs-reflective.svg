<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="30" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">sRDI vs Traditional Reflective DLL Injection</text>

  <!-- Headers -->
  <text x="280" y="60" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">Traditional Reflective DLL</text>
  <text x="720" y="60" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">sRDI (Shellcode RDI)</text>

  <!-- Comparison rows -->
  <rect x="30" y="75" width="940" height="40" rx="4" fill="#161b22" stroke="#8b949e" stroke-width="0.5"/>
  <text x="500" y="100" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">Loader Location</text>
  <rect x="35" y="120" width="460" height="35" rx="4" fill="#0d1117" stroke="#f85149" stroke-width="1"/>
  <text x="265" y="142" text-anchor="middle" fill="#f85149" font-size="10">Embedded INSIDE DLL as exported function</text>
  <rect x="505" y="120" width="460" height="35" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="735" y="142" text-anchor="middle" fill="#3fb950" font-size="10">External — prepended as shellcode stub</text>

  <rect x="30" y="165" width="940" height="40" rx="4" fill="#161b22" stroke="#8b949e" stroke-width="0.5"/>
  <text x="500" y="190" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">DLL Modification Required</text>
  <rect x="35" y="210" width="460" height="35" rx="4" fill="#0d1117" stroke="#f85149" stroke-width="1"/>
  <text x="265" y="232" text-anchor="middle" fill="#f85149" font-size="10">YES — must compile with ReflectiveLoader export</text>
  <rect x="505" y="210" width="460" height="35" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="735" y="232" text-anchor="middle" fill="#3fb950" font-size="10">NO — any standard DLL works unmodified</text>

  <rect x="30" y="255" width="940" height="40" rx="4" fill="#161b22" stroke="#8b949e" stroke-width="0.5"/>
  <text x="500" y="280" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">Output Format</text>
  <rect x="35" y="300" width="460" height="35" rx="4" fill="#0d1117" stroke="#f85149" stroke-width="1"/>
  <text x="265" y="322" text-anchor="middle" fill="#f85149" font-size="10">DLL file with special export — still a PE</text>
  <rect x="505" y="300" width="460" height="35" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="735" y="322" text-anchor="middle" fill="#3fb950" font-size="10">Raw shellcode blob — fully position-independent</text>

  <rect x="30" y="345" width="940" height="40" rx="4" fill="#161b22" stroke="#8b949e" stroke-width="0.5"/>
  <text x="500" y="370" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">Injection Flexibility</text>
  <rect x="35" y="390" width="460" height="35" rx="4" fill="#0d1117" stroke="#f85149" stroke-width="1"/>
  <text x="265" y="412" text-anchor="middle" fill="#f85149" font-size="10">Must find loader offset, call ReflectiveLoader()</text>
  <rect x="505" y="390" width="460" height="35" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="735" y="412" text-anchor="middle" fill="#3fb950" font-size="10">Execute from byte 0 — works with any injection technique</text>

  <rect x="30" y="435" width="940" height="40" rx="4" fill="#161b22" stroke="#8b949e" stroke-width="0.5"/>
  <text x="500" y="460" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">Detection Surface</text>
  <rect x="35" y="480" width="460" height="35" rx="4" fill="#0d1117" stroke="#f85149" stroke-width="1"/>
  <text x="265" y="502" text-anchor="middle" fill="#f85149" font-size="10">ReflectiveLoader export signatured, PE headers visible</text>
  <rect x="505" y="480" width="460" height="35" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="735" y="502" text-anchor="middle" fill="#3fb950" font-size="10">No export name, XOR encrypted, no PE magic visible</text>

  <!-- Summary -->
  <rect x="130" y="530" width="740" height="35" rx="6" fill="#3fb950" fill-opacity="0.1" stroke="#3fb950" stroke-width="1.5"/>
  <text x="500" y="553" text-anchor="middle" fill="#3fb950" font-size="11">sRDI decouples loading from payload — convert ANY DLL to injectable shellcode post-compilation</text>
</svg>
