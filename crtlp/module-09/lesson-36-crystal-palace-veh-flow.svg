<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="arGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
    <marker id="arBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#58a6ff"/></marker>
    <marker id="arRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f85149"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" fill="#58a6ff" font-size="20" font-weight="bold">Crystal Palace: VEH + Hardware Breakpoint Flow</text>
  <text x="500" y="55" text-anchor="middle" fill="#8b949e" font-size="12">Vectored Exception Handler with Debug Registers for Sleep Obfuscation</text>

  <!-- Step 1: VEH Registration -->
  <rect x="30" y="80" width="160" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="110" y="100" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">1. VEH Registration</text>
  <text x="110" y="118" text-anchor="middle" fill="#c9d1d9" font-size="9">AddVectoredException</text>
  <text x="110" y="130" text-anchor="middle" fill="#c9d1d9" font-size="9">Handler(1, handler)</text>

  <!-- Step 2: HW Breakpoint -->
  <rect x="220" y="80" width="160" height="60" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="300" y="100" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">2. Set HW BP</text>
  <text x="300" y="118" text-anchor="middle" fill="#c9d1d9" font-size="9">DR0 = &amp;Sleep</text>
  <text x="300" y="130" text-anchor="middle" fill="#c9d1d9" font-size="9">DR7 = 0x1 (enable)</text>

  <!-- Arrow 1->2 -->
  <line x1="190" y1="110" x2="218" y2="110" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arBlue)"/>

  <!-- Step 3: Beacon calls Sleep -->
  <rect x="410" y="80" width="160" height="60" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="490" y="100" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">3. Beacon Sleeps</text>
  <text x="490" y="118" text-anchor="middle" fill="#c9d1d9" font-size="9">Beacon calls</text>
  <text x="490" y="130" text-anchor="middle" fill="#c9d1d9" font-size="9">Sleep(dwMilliseconds)</text>

  <!-- Arrow 2->3 -->
  <line x1="380" y1="110" x2="408" y2="110" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 4: Exception -->
  <rect x="600" y="80" width="160" height="60" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="680" y="100" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">4. #DB Exception</text>
  <text x="680" y="118" text-anchor="middle" fill="#c9d1d9" font-size="9">STATUS_SINGLE_STEP</text>
  <text x="680" y="130" text-anchor="middle" fill="#c9d1d9" font-size="9">0x80000004</text>

  <!-- Arrow 3->4 -->
  <line x1="570" y1="110" x2="598" y2="110" stroke="#f85149" stroke-width="1.5" marker-end="url(#arRed)"/>

  <!-- Step 5: VEH Encrypts -->
  <rect x="790" y="80" width="180" height="60" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="880" y="100" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">5. VEH Encrypts</text>
  <text x="880" y="118" text-anchor="middle" fill="#c9d1d9" font-size="9">XOR/AES beacon memory</text>
  <text x="880" y="130" text-anchor="middle" fill="#c9d1d9" font-size="9">VirtualProtect(RW)</text>

  <!-- Arrow 4->5 -->
  <line x1="760" y1="110" x2="788" y2="110" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arGreen)"/>

  <!-- Step 6: Modify CONTEXT (centered below) -->
  <rect x="600" y="175" width="370" height="70" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="785" y="195" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">6. Modify CONTEXT Structure</text>
  <text x="785" y="213" text-anchor="middle" fill="#c9d1d9" font-size="9">ctx-&gt;Rip = &amp;NtWaitForSingleObject  (actual sleep)</text>
  <text x="785" y="227" text-anchor="middle" fill="#c9d1d9" font-size="9">ctx-&gt;Dr0 = 0; ctx-&gt;Dr7 = 0  (clear breakpoints)</text>
  <text x="785" y="241" text-anchor="middle" fill="#8b949e" font-size="9">return EXCEPTION_CONTINUE_EXECUTION</text>

  <!-- Arrow 5->6 -->
  <path d="M880,140 L880,165 L880,173" fill="none" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arBlue)"/>

  <!-- Step 7: Sleep runs -->
  <rect x="350" y="175" width="220" height="55" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="460" y="195" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">7. Actual Sleep Executes</text>
  <text x="460" y="213" text-anchor="middle" fill="#c9d1d9" font-size="9">Thread sleeps with encrypted payload</text>
  <text x="460" y="226" text-anchor="middle" fill="#8b949e" font-size="9">Memory scanners see garbage</text>

  <!-- Arrow 6->7 -->
  <line x1="598" y1="210" x2="572" y2="210" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 8: Callback decrypts -->
  <rect x="30" y="175" width="290" height="55" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="175" y="195" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">8. Wake: Re-register BP + Decrypt</text>
  <text x="175" y="213" text-anchor="middle" fill="#c9d1d9" font-size="9">DR0 = &amp;Sleep again, DR7 = 0x1, decrypt beacon</text>
  <text x="175" y="226" text-anchor="middle" fill="#c9d1d9" font-size="9">VirtualProtect(RX) -- Resume execution</text>

  <!-- Arrow 7->8 -->
  <line x1="348" y1="200" x2="322" y2="200" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arGreen)"/>

  <!-- DR Register Detail Box -->
  <rect x="30" y="270" width="440" height="170" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="250" y="295" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Debug Registers (DR0-DR7) Configuration</text>
  <line x1="50" y1="305" x2="450" y2="305" stroke="#30363d"/>

  <!-- DR table -->
  <text x="70" y="325" fill="#f0883e" font-size="11" font-weight="bold">Register</text>
  <text x="180" y="325" fill="#f0883e" font-size="11" font-weight="bold">Purpose</text>
  <text x="370" y="325" fill="#f0883e" font-size="11" font-weight="bold">Value</text>

  <text x="70" y="348" fill="#c9d1d9" font-size="10">DR0</text>
  <text x="180" y="348" fill="#c9d1d9" font-size="10">BP Address #1</text>
  <text x="370" y="348" fill="#3fb950" font-size="10">&amp;Sleep</text>

  <text x="70" y="368" fill="#c9d1d9" font-size="10">DR1</text>
  <text x="180" y="368" fill="#c9d1d9" font-size="10">BP Address #2</text>
  <text x="370" y="368" fill="#8b949e" font-size="10">(unused)</text>

  <text x="70" y="388" fill="#c9d1d9" font-size="10">DR2</text>
  <text x="180" y="388" fill="#c9d1d9" font-size="10">BP Address #3</text>
  <text x="370" y="388" fill="#8b949e" font-size="10">(unused)</text>

  <text x="70" y="408" fill="#c9d1d9" font-size="10">DR3</text>
  <text x="180" y="408" fill="#c9d1d9" font-size="10">BP Address #4</text>
  <text x="370" y="408" fill="#8b949e" font-size="10">(unused)</text>

  <text x="70" y="428" fill="#c9d1d9" font-size="10">DR7</text>
  <text x="180" y="428" fill="#c9d1d9" font-size="10">Control Register</text>
  <text x="370" y="428" fill="#3fb950" font-size="10">0x00000001</text>

  <!-- DR7 Bit Detail -->
  <rect x="500" y="270" width="470" height="170" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="735" y="295" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="bold">DR7 Control Bits</text>
  <line x1="520" y1="305" x2="950" y2="305" stroke="#30363d"/>

  <text x="520" y="325" fill="#c9d1d9" font-size="10">Bit 0 (L0=1): Local enable DR0 breakpoint</text>
  <text x="520" y="345" fill="#c9d1d9" font-size="10">Bit 1 (G0=0): Global not needed (local scope)</text>
  <text x="520" y="365" fill="#c9d1d9" font-size="10">Bits 16-17 (R/W0=00): Execute breakpoint</text>
  <text x="520" y="385" fill="#c9d1d9" font-size="10">Bits 18-19 (LEN0=00): 1-byte length</text>
  <line x1="520" y1="395" x2="950" y2="395" stroke="#30363d" stroke-dasharray="3,3"/>
  <text x="520" y="415" fill="#3fb950" font-size="10" font-weight="bold">Key advantage:</text>
  <text x="520" y="432" fill="#c9d1d9" font-size="10">HW BPs don't modify code bytes (unlike INT3)</text>

  <!-- Cycle arrow hint -->
  <path d="M175,230 Q175,255 110,255 Q30,255 30,200 Q30,175 30,175" fill="none" stroke="#3fb950" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arGreen)"/>
  <text x="95" y="260" fill="#3fb950" font-size="8">cycle repeats</text>

  <!-- Footer -->
  <text x="500" y="565" text-anchor="middle" fill="#30363d" font-size="10">CRTLP Module 09 - Lesson 36: Crystal Palace VEH Sleep Obfuscation</text>
</svg>