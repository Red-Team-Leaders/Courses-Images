<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="arG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="28" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Crystal Palace — VEH + Hardware Breakpoint State Machine</text>

  <!-- State 0: Setup -->
  <rect x="30" y="50" width="200" height="100" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="130" y="72" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="bold">State 0: Setup</text>
  <text x="40" y="92" fill="#c9d1d9" font-size="8">AddVectoredExceptionHandler()</text>
  <text x="40" y="107" fill="#c9d1d9" font-size="8">Set DR0 = NtProtectVirtualMemory</text>
  <text x="40" y="122" fill="#c9d1d9" font-size="8">Set DR1 = SystemFunction032</text>
  <text x="40" y="137" fill="#c9d1d9" font-size="8">Set DR7 = enable DR0+DR1</text>

  <line x1="230" y1="100" x2="265" y2="100" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- State 1: Call NtProtect (RW) -->
  <rect x="270" y="50" width="200" height="100" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="370" y="72" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="bold">State 1: NtProtect</text>
  <text x="280" y="92" fill="#c9d1d9" font-size="8">Call NtProtectVirtualMemory</text>
  <text x="280" y="107" fill="#c9d1d9" font-size="8">Change beacon RX to RW</text>
  <text x="280" y="122" fill="#f0883e" font-size="8">DR0 breakpoint triggers!</text>
  <text x="280" y="137" fill="#8b949e" font-size="8">VEH handler intercepts</text>

  <line x1="370" y1="150" x2="370" y2="180" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="375" y="170" fill="#8b949e" font-size="7">EXCEPTION_SINGLE_STEP</text>

  <!-- VEH Handler (center) -->
  <rect x="170" y="185" width="400" height="70" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="370" y="210" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">VEH Exception Handler (State Machine)</text>
  <text x="370" y="232" text-anchor="middle" fill="#c9d1d9" font-size="9">Check state counter, modify context registers, set next breakpoint, CONTINUE_EXECUTION</text>
  <text x="370" y="247" text-anchor="middle" fill="#8b949e" font-size="8">No ROP, no APC, no suspicious API pattern — just legitimate exception handling</text>

  <!-- State 2 -->
  <line x1="370" y1="255" x2="370" y2="285" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="270" y="290" width="200" height="85" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="370" y="312" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="bold">State 2: Encrypt</text>
  <text x="280" y="332" fill="#c9d1d9" font-size="8">Call SystemFunction032 (RC4)</text>
  <text x="280" y="347" fill="#c9d1d9" font-size="8">Encrypt beacon memory</text>
  <text x="280" y="362" fill="#f0883e" font-size="8">DR1 breakpoint triggers!</text>

  <!-- State 3 -->
  <line x1="470" y1="332" x2="520" y2="332" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="525" y="290" width="200" height="85" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="625" y="312" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="bold">State 3: Sleep</text>
  <text x="535" y="332" fill="#c9d1d9" font-size="8">NtProtect: beacon to NO_ACCESS</text>
  <text x="535" y="347" fill="#c9d1d9" font-size="8">WaitForSingleObject(timeout)</text>
  <text x="535" y="362" fill="#58a6ff" font-size="8">Beacon encrypted + inaccessible</text>

  <!-- State 4 -->
  <line x1="725" y1="332" x2="760" y2="332" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="765" y="290" width="210" height="85" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="870" y="312" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="bold">State 4: Wake</text>
  <text x="775" y="332" fill="#c9d1d9" font-size="8">NtProtect: restore RW</text>
  <text x="775" y="347" fill="#f0883e" font-size="8">DR0 triggers again</text>
  <text x="775" y="362" fill="#8b949e" font-size="8">VEH advances state</text>

  <!-- State 5 -->
  <line x1="870" y1="375" x2="870" y2="410" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="660" y="415" width="315" height="70" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="817" y="437" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">State 5: Decrypt + Restore</text>
  <text x="670" y="457" fill="#c9d1d9" font-size="8">SystemFunction032 (decrypt), NtProtect back to RX</text>
  <text x="670" y="472" fill="#3fb950" font-size="8">Beacon decrypted, executable, ready for next task</text>

  <!-- Loop arrow -->
  <line x1="660" y1="450" x2="170" y2="450" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="170" y1="450" x2="170" y2="100" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="170" y1="100" x2="265" y2="100" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arG)"/>
  <text x="100" y="280" fill="#3fb950" font-size="8" transform="rotate(-90 100 280)">Next sleep cycle</text>

  <!-- Key insight box -->
  <rect x="30" y="500" width="940" height="60" rx="6" fill="#3fb950" fill-opacity="0.08" stroke="#3fb950" stroke-width="1"/>
  <text x="500" y="522" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">Key Insight: No ROP gadgets. No suspicious timer/APC queues. Only VEH + hardware breakpoints.</text>
  <text x="500" y="542" text-anchor="middle" fill="#8b949e" font-size="9">Hardware breakpoints (DR0-DR3) are a legitimate debugging mechanism — EDR has limited visibility into per-thread debug registers</text>

  <text x="500" y="575" text-anchor="middle" fill="#58a6ff" font-size="10">CRTLP Module 09 — Crystal Palace VEH State Machine</text>
</svg>
