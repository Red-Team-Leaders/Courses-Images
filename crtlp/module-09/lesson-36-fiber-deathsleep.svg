<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">DeathSleep: Fiber-Based Sleep Obfuscation</text>

  <!-- Main Fiber -->
  <rect x="30" y="60" width="440" height="230" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="250" y="84" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">Main Fiber (Payload Thread)</text>

  <rect x="50" y="100" width="180" height="40" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="140" y="125" text-anchor="middle" fill="#c9d1d9" font-size="10">Payload Code (.text)</text>

  <rect x="50" y="150" width="180" height="40" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="140" y="175" text-anchor="middle" fill="#c9d1d9" font-size="10">Thread Stack</text>

  <rect x="50" y="200" width="180" height="40" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="140" y="225" text-anchor="middle" fill="#c9d1d9" font-size="10">Heap Data</text>

  <rect x="250" y="100" width="200" height="140" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="350" y="120" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="bold">Fiber Context</text>
  <text x="260" y="140" fill="#c9d1d9" font-size="9">RSP: 0x7FF...A000</text>
  <text x="260" y="158" fill="#c9d1d9" font-size="9">RIP: payload+0x1234</text>
  <text x="260" y="176" fill="#c9d1d9" font-size="9">RBP: stack frame base</text>
  <text x="260" y="194" fill="#c9d1d9" font-size="9">FiberData: config ptr</text>
  <text x="260" y="212" fill="#c9d1d9" font-size="9">StackBase: 0x7FF...B000</text>
  <text x="260" y="230" fill="#8b949e" font-size="8">All registers saved on switch</text>

  <!-- Worker Fiber -->
  <rect x="530" y="60" width="440" height="230" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="750" y="84" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="bold">Worker Fiber (Sleep Manager)</text>

  <rect x="550" y="100" width="400" height="170" rx="4" fill="#0d1117" stroke="#f0883e" stroke-width="1"/>
  <text x="750" y="122" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="bold">Worker Logic</text>
  <text x="565" y="144" fill="#c9d1d9" font-size="9">1. Receive main fiber handle</text>
  <text x="565" y="162" fill="#c9d1d9" font-size="9">2. VirtualProtect(main.stack, RW)</text>
  <text x="565" y="180" fill="#c9d1d9" font-size="9">3. SystemFunction032(main.payload) → encrypt</text>
  <text x="565" y="198" fill="#c9d1d9" font-size="9">4. SystemFunction032(main.stack) → encrypt</text>
  <text x="565" y="216" fill="#f0883e" font-size="9" font-weight="bold">5. WaitForSingleObject(hEvent, sleepMs)</text>
  <text x="565" y="234" fill="#c9d1d9" font-size="9">6. Decrypt stack → Decrypt payload → VP(RX)</text>
  <text x="565" y="252" fill="#3fb950" font-size="9" font-weight="bold">7. SwitchToFiber(mainFiber)</text>

  <!-- Execution Flow -->
  <text x="500" y="315" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Execution Flow</text>

  <!-- Step boxes -->
  <rect x="20" y="335" width="115" height="50" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="77" y="352" text-anchor="middle" fill="#3fb950" font-size="9" font-weight="bold">Step 1</text>
  <text x="77" y="372" text-anchor="middle" fill="#c9d1d9" font-size="8">ConvertThread</text>
  <text x="77" y="382" text-anchor="middle" fill="#c9d1d9" font-size="8">ToFiber()</text>

  <line x1="135" y1="360" x2="148" y2="360" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="155" y="335" width="105" height="50" rx="4" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="207" y="352" text-anchor="middle" fill="#f0883e" font-size="9" font-weight="bold">Step 2</text>
  <text x="207" y="372" text-anchor="middle" fill="#c9d1d9" font-size="8">CreateFiber</text>
  <text x="207" y="382" text-anchor="middle" fill="#c9d1d9" font-size="8">(worker)</text>

  <line x1="260" y1="360" x2="273" y2="360" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="280" y="335" width="105" height="50" rx="4" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="332" y="352" text-anchor="middle" fill="#f0883e" font-size="9" font-weight="bold">Step 3</text>
  <text x="332" y="372" text-anchor="middle" fill="#c9d1d9" font-size="8">SwitchToFiber</text>
  <text x="332" y="382" text-anchor="middle" fill="#c9d1d9" font-size="8">(worker)</text>

  <line x1="385" y1="360" x2="398" y2="360" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="405" y="335" width="105" height="50" rx="4" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="457" y="352" text-anchor="middle" fill="#f85149" font-size="9" font-weight="bold">Step 4</text>
  <text x="457" y="372" text-anchor="middle" fill="#c9d1d9" font-size="8">Encrypt payload</text>
  <text x="457" y="382" text-anchor="middle" fill="#c9d1d9" font-size="8">+ stack</text>

  <line x1="510" y1="360" x2="523" y2="360" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="530" y="335" width="95" height="50" rx="4" fill="#161b22" stroke="#7ee787" stroke-width="1.5"/>
  <text x="577" y="352" text-anchor="middle" fill="#7ee787" font-size="9" font-weight="bold">Step 5</text>
  <text x="577" y="372" text-anchor="middle" fill="#c9d1d9" font-size="8">SLEEP</text>
  <text x="577" y="382" text-anchor="middle" fill="#8b949e" font-size="8">(encrypted)</text>

  <line x1="625" y1="360" x2="638" y2="360" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="645" y="335" width="105" height="50" rx="4" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="697" y="352" text-anchor="middle" fill="#f0883e" font-size="9" font-weight="bold">Step 6</text>
  <text x="697" y="372" text-anchor="middle" fill="#c9d1d9" font-size="8">Decrypt payload</text>
  <text x="697" y="382" text-anchor="middle" fill="#c9d1d9" font-size="8">+ stack</text>

  <line x1="750" y1="360" x2="763" y2="360" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="770" y="335" width="105" height="50" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="822" y="352" text-anchor="middle" fill="#3fb950" font-size="9" font-weight="bold">Step 7</text>
  <text x="822" y="372" text-anchor="middle" fill="#c9d1d9" font-size="8">SwitchToFiber</text>
  <text x="822" y="382" text-anchor="middle" fill="#c9d1d9" font-size="8">(main)</text>

  <line x1="875" y1="360" x2="888" y2="360" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="895" y="335" width="80" height="50" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="935" y="352" text-anchor="middle" fill="#3fb950" font-size="9" font-weight="bold">Step 8</text>
  <text x="935" y="372" text-anchor="middle" fill="#3fb950" font-size="8">Main</text>
  <text x="935" y="382" text-anchor="middle" fill="#3fb950" font-size="8">Resumes</text>

  <!-- Advantages -->
  <rect x="30" y="410" width="460" height="80" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="260" y="432" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">Advantages</text>
  <text x="45" y="452" fill="#7ee787" font-size="9">● No timer queue artifacts (unlike Ekko)</text>
  <text x="45" y="468" fill="#7ee787" font-size="9">● No APC queue artifacts (unlike Foliage)</text>
  <text x="45" y="484" fill="#7ee787" font-size="9">● Both stack AND payload encrypted during sleep</text>

  <!-- Detection -->
  <rect x="510" y="410" width="460" height="80" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="740" y="432" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">Detection Vectors</text>
  <text x="525" y="452" fill="#ff7b72" font-size="9">● Fiber API usage patterns (ConvertThreadToFiber)</text>
  <text x="525" y="468" fill="#ff7b72" font-size="9">● Memory protection transitions around sleep</text>
  <text x="525" y="484" fill="#ff7b72" font-size="9">● Entropy changes in fiber stack regions</text>

  <!-- Loop arrow -->
  <text x="500" y="520" text-anchor="middle" fill="#8b949e" font-size="10">↻ Cycle repeats: Steps 3–7 execute every beacon interval</text>

  <text x="500" y="565" text-anchor="middle" fill="#8b949e" font-size="9">Fiber-based approach: worker fiber manages entire encrypt-sleep-decrypt lifecycle for the main fiber</text>
</svg>
