<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="ar-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
    <marker id="ar-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f85149"/></marker>
    <marker id="ar-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#58a6ff"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Memory State Transitions During Sleep</text>
  <text x="500" y="52" text-anchor="middle" fill="#8b949e" font-size="11">Beacon Memory Protection and Content Changes Across Sleep Cycle</text>

  <!-- STATE 1: ACTIVE -->
  <rect x="30" y="80" width="290" height="280" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2.5"/>
  <rect x="30" y="80" width="290" height="38" rx="10" fill="#3fb950" opacity="0.2"/>
  <text x="175" y="105" text-anchor="middle" fill="#3fb950" font-size="16" font-weight="bold">ACTIVE</text>

  <text x="50" y="140" fill="#c9d1d9" font-size="11" font-weight="bold">Memory Protection</text>
  <rect x="50" y="150" width="250" height="28" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="175" y="169" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold" font-family="Consolas">PAGE_EXECUTE_READ (RX)</text>

  <text x="50" y="200" fill="#c9d1d9" font-size="11" font-weight="bold">Content State</text>
  <rect x="50" y="210" width="250" height="28" rx="4" fill="#0d1117" stroke="#7ee787" stroke-width="1"/>
  <text x="175" y="229" text-anchor="middle" fill="#7ee787" font-size="11" font-family="Consolas">PLAINTEXT (Decrypted)</text>

  <text x="50" y="260" fill="#c9d1d9" font-size="10">Beacon Characteristics:</text>
  <text x="55" y="278" fill="#7ee787" font-size="9">&#x2022; Code is executable and running</text>
  <text x="55" y="293" fill="#7ee787" font-size="9">&#x2022; C2 config readable in memory</text>
  <text x="55" y="308" fill="#7ee787" font-size="9">&#x2022; PE headers visible (MZ, PE)</text>
  <text x="55" y="323" fill="#7ee787" font-size="9">&#x2022; Import table resolved</text>
  <text x="55" y="338" fill="#7ee787" font-size="9">&#x2022; Thread executing beacon logic</text>
  <text x="55" y="353" fill="#ff7b72" font-size="9">! SCANNABLE by EDR / YARA</text>

  <!-- STATE 2: SLEEPING -->
  <rect x="355" y="80" width="290" height="280" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2.5"/>
  <rect x="355" y="80" width="290" height="38" rx="10" fill="#f85149" opacity="0.2"/>
  <text x="500" y="105" text-anchor="middle" fill="#f85149" font-size="16" font-weight="bold">SLEEPING</text>

  <text x="375" y="140" fill="#c9d1d9" font-size="11" font-weight="bold">Memory Protection</text>
  <rect x="375" y="150" width="250" height="28" rx="4" fill="#0d1117" stroke="#f85149" stroke-width="1.5"/>
  <text x="500" y="169" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold" font-family="Consolas">PAGE_NOACCESS (---)</text>

  <text x="375" y="200" fill="#c9d1d9" font-size="11" font-weight="bold">Content State</text>
  <rect x="375" y="210" width="250" height="28" rx="4" fill="#0d1117" stroke="#f85149" stroke-width="1"/>
  <text x="500" y="229" text-anchor="middle" fill="#f85149" font-size="11" font-family="Consolas">ENCRYPTED (XOR/AES)</text>

  <text x="375" y="260" fill="#c9d1d9" font-size="10">Beacon Characteristics:</text>
  <text x="380" y="278" fill="#7ee787" font-size="9">&#x2022; Memory inaccessible to scans</text>
  <text x="380" y="293" fill="#7ee787" font-size="9">&#x2022; Content is encrypted ciphertext</text>
  <text x="380" y="308" fill="#7ee787" font-size="9">&#x2022; No PE signatures visible</text>
  <text x="380" y="323" fill="#7ee787" font-size="9">&#x2022; No readable strings / config</text>
  <text x="380" y="338" fill="#7ee787" font-size="9">&#x2022; Timer pending for wake-up</text>
  <text x="380" y="353" fill="#3fb950" font-size="9">&#x2713; INVISIBLE to memory scanning</text>

  <!-- STATE 3: WAKING -->
  <rect x="680" y="80" width="290" height="280" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2.5"/>
  <rect x="680" y="80" width="290" height="38" rx="10" fill="#58a6ff" opacity="0.2"/>
  <text x="825" y="105" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="bold">WAKING</text>

  <text x="700" y="140" fill="#c9d1d9" font-size="11" font-weight="bold">Memory Protection</text>
  <rect x="700" y="150" width="250" height="28" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="825" y="169" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold" font-family="Consolas">PAGE_READWRITE (RW)</text>

  <text x="700" y="200" fill="#c9d1d9" font-size="11" font-weight="bold">Content State</text>
  <rect x="700" y="210" width="250" height="28" rx="4" fill="#0d1117" stroke="#f0883e" stroke-width="1"/>
  <text x="825" y="229" text-anchor="middle" fill="#f0883e" font-size="11" font-family="Consolas">DECRYPTING (Transient)</text>

  <text x="700" y="260" fill="#c9d1d9" font-size="10">Beacon Characteristics:</text>
  <text x="705" y="278" fill="#7ee787" font-size="9">&#x2022; VEH handler triggered by timer</text>
  <text x="705" y="293" fill="#7ee787" font-size="9">&#x2022; Memory set to RW for decrypt</text>
  <text x="705" y="308" fill="#7ee787" font-size="9">&#x2022; Decryption in progress</text>
  <text x="705" y="323" fill="#7ee787" font-size="9">&#x2022; Will transition to RX when done</text>
  <text x="705" y="338" fill="#7ee787" font-size="9">&#x2022; Brief vulnerable window</text>
  <text x="705" y="353" fill="#f0883e" font-size="9">~ TRANSIENT state (microseconds)</text>

  <!-- Transition Arrows -->
  <!-- ACTIVE -> SLEEPING -->
  <path d="M320,180 L355,180" fill="none" stroke="#f85149" stroke-width="2.5" marker-end="url(#ar-red)"/>
  <rect x="280" y="370" width="200" height="55" rx="4" fill="#0d1117" stroke="#f85149" stroke-width="1"/>
  <text x="380" y="388" text-anchor="middle" fill="#f85149" font-size="10" font-weight="bold">ACTIVE -&gt; SLEEPING</text>
  <text x="380" y="403" text-anchor="middle" fill="#8b949e" font-size="8">VirtualProtect(RX -&gt; RW)</text>
  <text x="380" y="415" text-anchor="middle" fill="#8b949e" font-size="8">Encrypt + VirtualProtect(RW -&gt; NA)</text>

  <!-- SLEEPING -> WAKING -->
  <path d="M645,180 L680,180" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#ar-blue)"/>
  <rect x="535" y="370" width="200" height="55" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="635" y="388" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="bold">SLEEPING -&gt; WAKING</text>
  <text x="635" y="403" text-anchor="middle" fill="#8b949e" font-size="8">Timer fires / VEH triggers</text>
  <text x="635" y="415" text-anchor="middle" fill="#8b949e" font-size="8">VirtualProtect(NA -&gt; RW)</text>

  <!-- WAKING -> ACTIVE (circular arrow back) -->
  <rect x="780" y="370" width="200" height="55" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="880" y="388" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">WAKING -&gt; ACTIVE</text>
  <text x="880" y="403" text-anchor="middle" fill="#8b949e" font-size="8">Decrypt complete</text>
  <text x="880" y="415" text-anchor="middle" fill="#8b949e" font-size="8">VirtualProtect(RW -&gt; RX)</text>

  <!-- Circular flow arrow at bottom -->
  <path d="M880,425 L880,445 L175,445 L175,360" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ar-green)"/>
  <text x="500" y="458" text-anchor="middle" fill="#3fb950" font-size="9">Cycle repeats on next sleep</text>

  <!-- Detection Window Analysis -->
  <rect x="30" y="475" width="940" height="80" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
  <text x="500" y="498" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="bold">Detection Window Analysis</text>

  <!-- Timeline bar -->
  <rect x="60" y="510" width="200" height="18" rx="3" fill="#3fb950" opacity="0.4"/>
  <text x="160" y="523" text-anchor="middle" fill="#3fb950" font-size="9" font-weight="bold">ACTIVE (scannable)</text>

  <rect x="260" y="510" width="420" height="18" rx="3" fill="#f85149" opacity="0.4"/>
  <text x="470" y="523" text-anchor="middle" fill="#f85149" font-size="9" font-weight="bold">SLEEPING (invisible) - majority of time</text>

  <rect x="680" y="510" width="40" height="18" rx="3" fill="#58a6ff" opacity="0.4"/>
  <text x="700" y="523" text-anchor="middle" fill="#58a6ff" font-size="7" font-weight="bold">WAKE</text>

  <rect x="720" y="510" width="200" height="18" rx="3" fill="#3fb950" opacity="0.4"/>
  <text x="820" y="523" text-anchor="middle" fill="#3fb950" font-size="9" font-weight="bold">ACTIVE (scannable)</text>

  <text x="60" y="545" fill="#8b949e" font-size="9">Typical ratio: ~100ms active / ~60s sleeping = beacon visible &lt;0.2% of time</text>
  <text x="600" y="545" fill="#f0883e" font-size="9">Waking state lasts microseconds - nearly impossible to catch</text>

  <text x="500" y="572" text-anchor="middle" fill="#8b949e" font-size="10">Sleep obfuscation minimizes the detection window by encrypting beacon memory during idle periods</text>
</svg>