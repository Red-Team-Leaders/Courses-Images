<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="28" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Sleep Obfuscation — Memory Protection Transitions</text>

  <!-- Timeline -->
  <text x="500" y="55" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="bold">Beacon Lifecycle During One Sleep Cycle</text>

  <!-- Phase labels -->
  <text x="130" y="85" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">ACTIVE</text>
  <text x="370" y="85" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="bold">TRANSITIONING</text>
  <text x="640" y="85" text-anchor="middle" fill="#f85149" font-size="10" font-weight="bold">SLEEPING</text>
  <text x="870" y="85" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="bold">WAKING</text>

  <!-- Memory state bars -->
  <text x="25" y="120" fill="#8b949e" font-size="9">Protection:</text>
  <rect x="50" y="100" width="160" height="30" rx="4" fill="#3fb950" fill-opacity="0.3" stroke="#3fb950" stroke-width="1.5"/>
  <text x="130" y="120" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">RX</text>
  <line x1="210" y1="115" x2="240" y2="115" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="245" y="100" width="130" height="30" rx="4" fill="#f0883e" fill-opacity="0.3" stroke="#f0883e" stroke-width="1.5"/>
  <text x="310" y="120" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="bold">RW</text>
  <line x1="375" y1="115" x2="405" y2="115" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="410" y="100" width="100" height="30" rx="4" fill="#f0883e" fill-opacity="0.3" stroke="#f0883e" stroke-width="1.5"/>
  <text x="460" y="120" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="bold">RW (enc)</text>
  <line x1="510" y1="115" x2="540" y2="115" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="545" y="100" width="200" height="30" rx="4" fill="#f85149" fill-opacity="0.3" stroke="#f85149" stroke-width="1.5"/>
  <text x="645" y="120" text-anchor="middle" fill="#f85149" font-size="10" font-weight="bold">NO_ACCESS</text>
  <line x1="745" y1="115" x2="775" y2="115" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="780" y="100" width="80" height="30" rx="4" fill="#f0883e" fill-opacity="0.3" stroke="#f0883e" stroke-width="1.5"/>
  <text x="820" y="120" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="bold">RW</text>
  <line x1="860" y1="115" x2="890" y2="115" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="895" y="100" width="80" height="30" rx="4" fill="#3fb950" fill-opacity="0.3" stroke="#3fb950" stroke-width="1.5"/>
  <text x="935" y="120" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">RX</text>

  <!-- Content state bars -->
  <text x="25" y="170" fill="#8b949e" font-size="9">Content:</text>
  <rect x="50" y="150" width="160" height="30" rx="4" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950" stroke-width="1"/>
  <text x="130" y="170" text-anchor="middle" fill="#3fb950" font-size="9">Plaintext code</text>
  <rect x="245" y="150" width="130" height="30" rx="4" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950" stroke-width="1"/>
  <text x="310" y="170" text-anchor="middle" fill="#3fb950" font-size="9">Plaintext</text>
  <rect x="410" y="150" width="335" height="30" rx="4" fill="#f85149" fill-opacity="0.15" stroke="#f85149" stroke-width="1"/>
  <text x="577" y="170" text-anchor="middle" fill="#f85149" font-size="9">RC4 / XOR encrypted ciphertext</text>
  <rect x="780" y="150" width="80" height="30" rx="4" fill="#f0883e" fill-opacity="0.15" stroke="#f0883e" stroke-width="1"/>
  <text x="820" y="170" text-anchor="middle" fill="#f0883e" font-size="9">Decrypting</text>
  <rect x="895" y="150" width="80" height="30" rx="4" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950" stroke-width="1"/>
  <text x="935" y="170" text-anchor="middle" fill="#3fb950" font-size="9">Plaintext</text>

  <!-- Scanner visibility -->
  <text x="25" y="220" fill="#8b949e" font-size="9">Scanner:</text>
  <rect x="50" y="200" width="160" height="30" rx="4" fill="#f85149" fill-opacity="0.15" stroke="#f85149" stroke-width="1"/>
  <text x="130" y="220" text-anchor="middle" fill="#f85149" font-size="9">DETECTABLE</text>
  <rect x="245" y="200" width="130" height="30" rx="4" fill="#f85149" fill-opacity="0.15" stroke="#f85149" stroke-width="1"/>
  <text x="310" y="220" text-anchor="middle" fill="#f85149" font-size="9">DETECTABLE</text>
  <rect x="410" y="200" width="335" height="30" rx="4" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950" stroke-width="1"/>
  <text x="577" y="220" text-anchor="middle" fill="#3fb950" font-size="9">INVISIBLE (encrypted + inaccessible)</text>
  <rect x="780" y="200" width="80" height="30" rx="4" fill="#f0883e" fill-opacity="0.15" stroke="#f0883e" stroke-width="1"/>
  <text x="820" y="220" text-anchor="middle" fill="#f0883e" font-size="9">BRIEF</text>
  <rect x="895" y="200" width="80" height="30" rx="4" fill="#f85149" fill-opacity="0.15" stroke="#f85149" stroke-width="1"/>
  <text x="935" y="220" text-anchor="middle" fill="#f85149" font-size="9">DETECT</text>

  <!-- Detailed steps -->
  <rect x="30" y="250" width="940" height="290" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="500" y="275" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Step-by-Step API Calls</text>

  <rect x="50" y="290" width="420" height="30" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="60" y="310" fill="#3fb950" font-size="9" font-family="Consolas">1. NtProtectVirtualMemory(beacon, RW)         // writable for encryption</text>
  <rect x="50" y="325" width="420" height="30" rx="4" fill="#161b22" stroke="#f0883e" stroke-width="1"/>
  <text x="60" y="345" fill="#f0883e" font-size="9" font-family="Consolas">2. SystemFunction032(beacon, key)               // RC4 encrypt in-place</text>
  <rect x="50" y="360" width="420" height="30" rx="4" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="60" y="380" fill="#f85149" font-size="9" font-family="Consolas">3. NtProtectVirtualMemory(beacon, NO_ACCESS)   // lock down completely</text>
  <rect x="50" y="395" width="420" height="30" rx="4" fill="#161b22" stroke="#8b949e" stroke-width="1"/>
  <text x="60" y="415" fill="#8b949e" font-size="9" font-family="Consolas">4. WaitForSingleObject(event, sleep_ms)        // sleep period</text>
  <rect x="50" y="430" width="420" height="30" rx="4" fill="#161b22" stroke="#f0883e" stroke-width="1"/>
  <text x="60" y="450" fill="#f0883e" font-size="9" font-family="Consolas">5. NtProtectVirtualMemory(beacon, RW)          // writable for decryption</text>
  <rect x="50" y="465" width="420" height="30" rx="4" fill="#161b22" stroke="#f0883e" stroke-width="1"/>
  <text x="60" y="485" fill="#f0883e" font-size="9" font-family="Consolas">6. SystemFunction032(beacon, key)               // RC4 decrypt (symmetric)</text>
  <rect x="50" y="500" width="420" height="30" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="60" y="520" fill="#3fb950" font-size="9" font-family="Consolas">7. NtProtectVirtualMemory(beacon, RX)          // restore executable</text>

  <!-- Timing diagram on right -->
  <text x="700" y="300" text-anchor="middle" fill="#c9d1d9" font-size="10" font-weight="bold">Timing Analysis</text>
  <text x="520" y="325" fill="#8b949e" font-size="9">Steps 1-3: ~0.5ms (transition)</text>
  <text x="520" y="350" fill="#8b949e" font-size="9">Step 4:    ~60,000ms (sleep)</text>
  <text x="520" y="375" fill="#8b949e" font-size="9">Steps 5-7: ~0.5ms (transition)</text>

  <rect x="520" y="400" width="430" height="50" rx="4" fill="#3fb950" fill-opacity="0.1" stroke="#3fb950" stroke-width="1"/>
  <text x="735" y="420" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">99.998% of time: encrypted + NO_ACCESS</text>
  <text x="735" y="438" text-anchor="middle" fill="#8b949e" font-size="8">Scanner must catch the ~1ms window to detect beacon</text>

  <rect x="520" y="465" width="430" height="55" rx="4" fill="#161b22" stroke="#f0883e" stroke-width="1"/>
  <text x="735" y="485" text-anchor="middle" fill="#f0883e" font-size="9" font-weight="bold">EDR Detection Strategy:</text>
  <text x="530" y="503" fill="#8b949e" font-size="8">Monitor NtProtectVirtualMemory transitions (RX to RW to NO_ACCESS pattern)</text>
  <text x="530" y="516" fill="#8b949e" font-size="8">Correlate with SystemFunction032 calls from same thread</text>

  <text x="500" y="560" text-anchor="middle" fill="#58a6ff" font-size="10">CRTLP Module 09 — Memory Protection Transitions During Sleep Obfuscation</text>
</svg>
