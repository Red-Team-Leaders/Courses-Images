<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="28" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Evolution of Sleep Obfuscation Techniques</text>

  <!-- Timeline line -->
  <line x1="60" y1="60" x2="60" y2="540" stroke="#8b949e" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Gen 0 -->
  <circle cx="60" cy="80" r="8" fill="#f85149"/>
  <rect x="85" y="55" width="880" height="55" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="100" y="75" fill="#f85149" font-size="11" font-weight="bold">Gen 0: Sleep(ms)</text>
  <text x="100" y="95" fill="#8b949e" font-size="9">Plain WinAPI sleep. Beacon image readable in memory during entire sleep. Trivially detected by memory scanners.</text>
  <text x="880" y="80" text-anchor="end" fill="#f85149" font-size="9">Detection: Trivial</text>

  <!-- Gen 1 -->
  <circle cx="60" cy="145" r="8" fill="#f85149"/>
  <rect x="85" y="120" width="880" height="55" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="100" y="140" fill="#f0883e" font-size="11" font-weight="bold">Gen 1: Obfuscate &amp; Sleep (Gargoyle, 2018)</text>
  <text x="100" y="160" fill="#8b949e" font-size="9">Timer-based ROP: mark region NO_ACCESS, queue APC to restore. First concept of hiding beacon during sleep.</text>
  <text x="880" y="145" text-anchor="end" fill="#f0883e" font-size="9">Detection: ROP gadgets</text>

  <!-- Gen 2 -->
  <circle cx="60" cy="210" r="8" fill="#f0883e"/>
  <rect x="85" y="185" width="880" height="55" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="100" y="205" fill="#f0883e" font-size="11" font-weight="bold">Gen 2: Ekko / Nighthawk (2022)</text>
  <text x="100" y="225" fill="#8b949e" font-size="9">ROP chain with NtContinue: XOR-encrypt beacon, change permissions RW, queue timer to decrypt + restore RX.</text>
  <text x="880" y="210" text-anchor="end" fill="#f0883e" font-size="9">Detection: Timer queue</text>

  <!-- Gen 3 -->
  <circle cx="60" cy="275" r="8" fill="#58a6ff"/>
  <rect x="85" y="250" width="880" height="55" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="100" y="270" fill="#58a6ff" font-size="11" font-weight="bold">Gen 3: Zilean / Foliage (2023)</text>
  <text x="100" y="290" fill="#8b949e" font-size="9">APC-based: queue chain of NtProtectVirtualMemory + SystemFunction032 (RC4 encrypt/decrypt) + sleep via APC.</text>
  <text x="880" y="275" text-anchor="end" fill="#58a6ff" font-size="9">Detection: APC queue</text>

  <!-- Gen 4 -->
  <circle cx="60" cy="340" r="8" fill="#3fb950"/>
  <rect x="85" y="315" width="880" height="60" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="100" y="335" fill="#3fb950" font-size="11" font-weight="bold">Gen 4: Crystal Palace (2024)</text>
  <text x="100" y="355" fill="#8b949e" font-size="9">VEH + hardware breakpoints: set DR0-DR3 on NtProtect/SystemFunction032, VEH handler drives state machine.</text>
  <text x="100" y="370" fill="#8b949e" font-size="9">No ROP gadgets, no suspicious timer/APC usage. Legitimate exception handling mechanism.</text>
  <text x="880" y="342" text-anchor="end" fill="#3fb950" font-size="9">Detection: DR register</text>

  <!-- Gen 5 -->
  <circle cx="60" cy="415" r="8" fill="#3fb950"/>
  <rect x="85" y="390" width="880" height="60" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="100" y="410" fill="#3fb950" font-size="11" font-weight="bold">Gen 5: DeathSleep / Advanced Variants (2024+)</text>
  <text x="100" y="430" fill="#8b949e" font-size="9">Suspend all threads + encrypt all executable memory. Thread stack spoofing + call stack encryption.</text>
  <text x="100" y="445" fill="#8b949e" font-size="9">Combined with heap encryption, fiber-based execution, CFG-compatible implementations.</text>
  <text x="880" y="415" text-anchor="end" fill="#3fb950" font-size="9">Detection: Heuristic only</text>

  <!-- Detection Evolution arrow -->
  <rect x="85" y="470" width="880" height="80" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="525" y="493" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">Defender Response Evolution</text>
  <text x="130" y="515" fill="#f85149" font-size="9">Memory scan</text>
  <line x1="210" y1="512" x2="250" y2="512" stroke="#f0883e" stroke-width="1" marker-end="url(#ar)"/>
  <text x="260" y="515" fill="#f0883e" font-size="9">ROP detection</text>
  <line x1="350" y1="512" x2="390" y2="512" stroke="#f0883e" stroke-width="1" marker-end="url(#ar)"/>
  <text x="400" y="515" fill="#f0883e" font-size="9">Timer/APC monitor</text>
  <line x1="515" y1="512" x2="555" y2="512" stroke="#f0883e" stroke-width="1" marker-end="url(#ar)"/>
  <text x="565" y="515" fill="#58a6ff" font-size="9">CFG validation</text>
  <line x1="650" y1="512" x2="690" y2="512" stroke="#f0883e" stroke-width="1" marker-end="url(#ar)"/>
  <text x="700" y="515" fill="#3fb950" font-size="9">Entropy + thread analysis</text>
  <text x="525" y="540" text-anchor="middle" fill="#8b949e" font-size="8">Each generation forces defenders to develop new detection primitives</text>

  <text x="500" y="570" text-anchor="middle" fill="#58a6ff" font-size="10">CRTLP Module 09 — Crystal Palace &amp; Advanced Sleep Obfuscation</text>
</svg>
