<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Beacon Internal API</text>

  <!-- Central: Function Pointer Table -->
  <rect x="350" y="55" width="300" height="60" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="500" y="78" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Beacon Function Pointer Table</text>
  <text x="500" y="96" text-anchor="middle" fill="#8b949e" font-size="10">Resolved at BOF load — patched into relocation entries</text>

  <!-- Arrows from center to 4 categories -->
  <line x1="400" y1="115" x2="180" y2="148" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="460" y1="115" x2="460" y2="148" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="540" y1="115" x2="540" y2="148" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="600" y1="115" x2="820" y2="148" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Category 1: Output API -->
  <rect x="40" y="150" width="280" height="190" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="180" y="172" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">Output API</text>
  <line x1="50" y1="180" x2="310" y2="180" stroke="#8b949e" stroke-width="0.5"/>
  <rect x="55" y="188" width="250" height="26" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="0.8"/>
  <text x="65" y="206" fill="#c9d1d9" font-size="11">BeaconPrintf(type, fmt, ...)</text>
  <rect x="55" y="220" width="250" height="26" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="0.8"/>
  <text x="65" y="238" fill="#c9d1d9" font-size="11">BeaconOutput(type, data, len)</text>
  <text x="60" y="268" fill="#8b949e" font-size="10">type: CALLBACK_OUTPUT (0x0)</text>
  <text x="60" y="282" fill="#8b949e" font-size="10">type: CALLBACK_OUTPUT_OEM (0x1E)</text>
  <text x="60" y="296" fill="#8b949e" font-size="10">type: CALLBACK_ERROR (0x0D)</text>
  <text x="60" y="316" fill="#3fb950" font-size="10">Routes output to operator console</text>
  <text x="60" y="330" fill="#8b949e" font-size="10">Buffered → sent on next C2 callback</text>

  <!-- Category 2: Data Parsing API -->
  <rect x="340" y="150" width="160" height="250" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="420" y="172" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="bold">Data Parsing</text>
  <line x1="350" y1="180" x2="490" y2="180" stroke="#8b949e" stroke-width="0.5"/>
  <rect x="350" y="188" width="140" height="22" rx="3" fill="#0d1117" stroke="#f0883e" stroke-width="0.8"/>
  <text x="358" y="204" fill="#c9d1d9" font-size="10">BeaconDataParse</text>
  <rect x="350" y="216" width="140" height="22" rx="3" fill="#0d1117" stroke="#f0883e" stroke-width="0.8"/>
  <text x="358" y="232" fill="#c9d1d9" font-size="10">BeaconDataInt</text>
  <rect x="350" y="244" width="140" height="22" rx="3" fill="#0d1117" stroke="#f0883e" stroke-width="0.8"/>
  <text x="358" y="260" fill="#c9d1d9" font-size="10">BeaconDataShort</text>
  <rect x="350" y="272" width="140" height="22" rx="3" fill="#0d1117" stroke="#f0883e" stroke-width="0.8"/>
  <text x="358" y="288" fill="#c9d1d9" font-size="10">BeaconDataLength</text>
  <rect x="350" y="300" width="140" height="22" rx="3" fill="#0d1117" stroke="#f0883e" stroke-width="0.8"/>
  <text x="358" y="316" fill="#c9d1d9" font-size="10">BeaconDataExtract</text>
  <text x="355" y="345" fill="#8b949e" font-size="9">Parses packed args from</text>
  <text x="355" y="358" fill="#8b949e" font-size="9">Aggressor bof_pack()</text>
  <text x="355" y="375" fill="#f0883e" font-size="9">datap struct: ptr + size</text>
  <text x="355" y="390" fill="#8b949e" font-size="9">Reads: z(str) b(bin) i(int) s(short)</text>

  <!-- Category 3: Format API -->
  <rect x="520" y="150" width="160" height="250" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="600" y="172" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Format API</text>
  <line x1="530" y1="180" x2="670" y2="180" stroke="#8b949e" stroke-width="0.5"/>
  <rect x="530" y="188" width="140" height="22" rx="3" fill="#0d1117" stroke="#58a6ff" stroke-width="0.8"/>
  <text x="538" y="204" fill="#c9d1d9" font-size="10">BeaconFormatAlloc</text>
  <rect x="530" y="216" width="140" height="22" rx="3" fill="#0d1117" stroke="#58a6ff" stroke-width="0.8"/>
  <text x="538" y="232" fill="#c9d1d9" font-size="10">BeaconFormatFree</text>
  <rect x="530" y="244" width="140" height="22" rx="3" fill="#0d1117" stroke="#58a6ff" stroke-width="0.8"/>
  <text x="538" y="260" fill="#c9d1d9" font-size="10">BeaconFormatAppend</text>
  <rect x="530" y="272" width="140" height="22" rx="3" fill="#0d1117" stroke="#58a6ff" stroke-width="0.8"/>
  <text x="538" y="288" fill="#c9d1d9" font-size="10">BeaconFormatPrintf</text>
  <rect x="530" y="300" width="140" height="22" rx="3" fill="#0d1117" stroke="#58a6ff" stroke-width="0.8"/>
  <text x="538" y="316" fill="#c9d1d9" font-size="10">BeaconFormatInt</text>
  <rect x="530" y="328" width="140" height="22" rx="3" fill="#0d1117" stroke="#58a6ff" stroke-width="0.8"/>
  <text x="538" y="344" fill="#c9d1d9" font-size="10">BeaconFormatToString</text>
  <text x="535" y="372" fill="#8b949e" font-size="9">Build structured output</text>
  <text x="535" y="385" fill="#58a6ff" font-size="9">formatp struct: buf + len</text>
  <text x="535" y="398" fill="#8b949e" font-size="9">Sent via BeaconOutput()</text>

  <!-- Category 4: Token API -->
  <rect x="700" y="150" width="260" height="190" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="830" y="172" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">Token / Utility API</text>
  <line x1="710" y1="180" x2="950" y2="180" stroke="#8b949e" stroke-width="0.5"/>
  <rect x="710" y="188" width="235" height="22" rx="3" fill="#0d1117" stroke="#f85149" stroke-width="0.8"/>
  <text x="718" y="204" fill="#c9d1d9" font-size="10">BeaconUseToken(HANDLE token)</text>
  <rect x="710" y="216" width="235" height="22" rx="3" fill="#0d1117" stroke="#f85149" stroke-width="0.8"/>
  <text x="718" y="232" fill="#c9d1d9" font-size="10">BeaconRevertToken()</text>
  <rect x="710" y="244" width="235" height="22" rx="3" fill="#0d1117" stroke="#f85149" stroke-width="0.8"/>
  <text x="718" y="260" fill="#c9d1d9" font-size="10">BeaconIsAdmin()</text>
  <rect x="710" y="272" width="235" height="22" rx="3" fill="#0d1117" stroke="#f85149" stroke-width="0.8"/>
  <text x="718" y="288" fill="#c9d1d9" font-size="10">BeaconGetSpawnTo(x86, buf, len)</text>
  <text x="715" y="316" fill="#8b949e" font-size="10">Impersonation management</text>
  <text x="715" y="330" fill="#f85149" font-size="10">Token applied to Beacon thread</text>

  <!-- Usage Example -->
  <rect x="40" y="420" width="920" height="120" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="1"/>
  <text x="60" y="442" fill="#58a6ff" font-size="12" font-weight="bold">Example: BOF using Beacon API</text>
  <line x1="50" y1="450" x2="950" y2="450" stroke="#8b949e" stroke-width="0.5"/>
  <text x="60" y="470" fill="#c9d1d9" font-size="11">void go(char* args, int alen) {</text>
  <text x="80" y="488" fill="#f0883e" font-size="11">datap parser;                                  <tspan fill="#8b949e">// Data parsing struct</tspan></text>
  <text x="80" y="504" fill="#3fb950" font-size="11">BeaconDataParse(&amp;parser, args, alen);          <tspan fill="#8b949e">// Init parser with packed args</tspan></text>
  <text x="80" y="520" fill="#58a6ff" font-size="11">int pid = BeaconDataInt(&amp;parser);               <tspan fill="#8b949e">// Extract first int arg</tspan></text>
  <text x="80" y="536" fill="#3fb950" font-size="11">BeaconPrintf(CALLBACK_OUTPUT, "PID: %d", pid); <tspan fill="#8b949e">// Send output to operator</tspan></text>

  <!-- Footer -->
  <text x="500" y="570" text-anchor="middle" fill="#8b949e" font-size="10">CRTLP Module 09 — Lesson 37: Beacon API Categories for BOF Development</text>
</svg>