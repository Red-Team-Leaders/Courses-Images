<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="arBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#58a6ff"/></marker>
    <marker id="arGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" fill="#58a6ff" font-size="20" font-weight="bold">Beacon Object File (BOF) Architecture</text>
  <text x="500" y="55" text-anchor="middle" fill="#8b949e" font-size="12">In-process execution: No child process, no disk artifact</text>

  <!-- Stage 1: Operator -->
  <rect x="30" y="120" width="170" height="220" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="115" y="145" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Operator</text>
  <line x1="45" y1="155" x2="185" y2="155" stroke="#30363d"/>

  <!-- Code icon -->
  <rect x="55" y="170" width="120" height="80" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="115" y="190" text-anchor="middle" fill="#3fb950" font-size="10">// bof_code.c</text>
  <text x="115" y="205" text-anchor="middle" fill="#c9d1d9" font-size="9">void go(char* args,</text>
  <text x="115" y="218" text-anchor="middle" fill="#c9d1d9" font-size="9">  int len) {</text>
  <text x="115" y="231" text-anchor="middle" fill="#c9d1d9" font-size="9">  // BOF logic</text>
  <text x="115" y="244" text-anchor="middle" fill="#c9d1d9" font-size="9">}</text>

  <text x="115" y="275" text-anchor="middle" fill="#8b949e" font-size="9">Writes BOF in C</text>
  <text x="115" y="290" text-anchor="middle" fill="#8b949e" font-size="9">Uses Beacon API</text>

  <!-- Arrow to compile -->
  <text x="115" y="320" text-anchor="middle" fill="#f0883e" font-size="9">x86_64-w64-mingw32-gcc</text>
  <text x="115" y="332" text-anchor="middle" fill="#f0883e" font-size="9">-c -o bof.o</text>

  <!-- Stage 2: COFF .o file -->
  <rect x="240" y="140" width="140" height="180" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="310" y="165" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="bold">COFF Object</text>
  <line x1="255" y1="175" x2="365" y2="175" stroke="#30363d"/>

  <!-- File icon -->
  <rect x="270" y="188" width="80" height="50" rx="3" fill="#0d1117" stroke="#f0883e" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="310" y="210" text-anchor="middle" fill="#f0883e" font-size="11">bof.o</text>
  <text x="310" y="225" text-anchor="middle" fill="#8b949e" font-size="9">COFF format</text>

  <text x="310" y="258" text-anchor="middle" fill="#c9d1d9" font-size="9">.text (code)</text>
  <text x="310" y="273" text-anchor="middle" fill="#c9d1d9" font-size="9">.data (globals)</text>
  <text x="310" y="288" text-anchor="middle" fill="#c9d1d9" font-size="9">.reloc (fixups)</text>
  <text x="310" y="303" text-anchor="middle" fill="#c9d1d9" font-size="9">symbols table</text>

  <!-- Arrow 1->2 -->
  <line x1="200" y1="230" x2="238" y2="230" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="220" y="220" text-anchor="middle" fill="#f0883e" font-size="8">compile</text>

  <!-- Stage 3: C2 Channel -->
  <rect x="420" y="120" width="140" height="220" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="490" y="145" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">C2 Channel</text>
  <line x1="435" y1="155" x2="545" y2="155" stroke="#30363d"/>

  <text x="490" y="178" text-anchor="middle" fill="#c9d1d9" font-size="10">Aggressor sends</text>
  <text x="490" y="195" text-anchor="middle" fill="#c9d1d9" font-size="10">BOF + arguments</text>
  <text x="490" y="215" text-anchor="middle" fill="#c9d1d9" font-size="10">via task queue</text>

  <!-- Encrypted indicator -->
  <rect x="445" y="235" width="90" height="30" rx="4" fill="#0d1117" stroke="#f85149" stroke-width="1"/>
  <text x="490" y="255" text-anchor="middle" fill="#f85149" font-size="9">Encrypted</text>

  <text x="490" y="290" text-anchor="middle" fill="#8b949e" font-size="9">HTTP/HTTPS/DNS</text>
  <text x="490" y="305" text-anchor="middle" fill="#8b949e" font-size="9">SMB named pipe</text>
  <text x="490" y="320" text-anchor="middle" fill="#8b949e" font-size="9">TCP channel</text>

  <!-- Arrow 2->3 -->
  <line x1="380" y1="230" x2="418" y2="230" stroke="#f85149" stroke-width="2" marker-end="url(#arBlue)"/>
  <text x="400" y="218" text-anchor="middle" fill="#8b949e" font-size="8">send</text>

  <!-- Stage 4: Beacon (in target) -->
  <rect x="600" y="90" width="370" height="300" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="785" y="115" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">Target: Beacon Process (In-Memory)</text>
  <line x1="615" y1="125" x2="955" y2="125" stroke="#30363d"/>

  <!-- COFF Loader sub-box -->
  <rect x="620" y="138" width="160" height="110" rx="6" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="700" y="158" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">COFF Loader</text>
  <line x1="635" y1="165" x2="765" y2="165" stroke="#30363d"/>
  <text x="700" y="182" text-anchor="middle" fill="#c9d1d9" font-size="9">1. Parse COFF header</text>
  <text x="700" y="197" text-anchor="middle" fill="#c9d1d9" font-size="9">2. Allocate memory</text>
  <text x="700" y="212" text-anchor="middle" fill="#c9d1d9" font-size="9">3. Apply relocations</text>
  <text x="700" y="227" text-anchor="middle" fill="#c9d1d9" font-size="9">4. Resolve imports</text>
  <text x="700" y="242" text-anchor="middle" fill="#c9d1d9" font-size="9">5. Execute go()</text>

  <!-- Execution box -->
  <rect x="800" y="138" width="155" height="110" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="878" y="158" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">BOF Execution</text>
  <line x1="815" y1="165" x2="940" y2="165" stroke="#30363d"/>
  <text x="878" y="182" text-anchor="middle" fill="#c9d1d9" font-size="9">Runs in beacon</text>
  <text x="878" y="197" text-anchor="middle" fill="#c9d1d9" font-size="9">thread context</text>
  <text x="878" y="218" text-anchor="middle" fill="#8b949e" font-size="9">No new process</text>
  <text x="878" y="233" text-anchor="middle" fill="#8b949e" font-size="9">No disk write</text>
  <text x="878" y="248" text-anchor="middle" fill="#8b949e" font-size="9">Same PID</text>

  <!-- Arrow loader -> execution -->
  <line x1="780" y1="190" x2="798" y2="190" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arGreen)"/>

  <!-- Output box -->
  <rect x="620" y="265" width="340" height="55" rx="6" fill="#0d1117" stroke="#f0883e" stroke-width="1"/>
  <text x="790" y="285" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">Output Capture</text>
  <text x="790" y="302" text-anchor="middle" fill="#c9d1d9" font-size="9">BeaconPrintf/BeaconOutput -> buffered -> sent via C2 callback</text>

  <!-- Cleanup -->
  <rect x="620" y="330" width="340" height="45" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
  <text x="790" y="350" text-anchor="middle" fill="#8b949e" font-size="11">Cleanup: Free memory, zero buffers</text>
  <text x="790" y="365" text-anchor="middle" fill="#8b949e" font-size="9">No residual artifacts in process</text>

  <!-- Arrow 3->4 -->
  <line x1="560" y1="230" x2="598" y2="190" stroke="#3fb950" stroke-width="2" marker-end="url(#arGreen)"/>
  <text x="575" y="198" fill="#8b949e" font-size="8">deliver</text>

  <!-- Key benefits box -->
  <rect x="30" y="400" width="940" height="80" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="500" y="425" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">Key OPSEC Benefits</text>
  <line x1="50" y1="435" x2="950" y2="435" stroke="#30363d"/>

  <text x="150" y="458" text-anchor="middle" fill="#3fb950" font-size="10">No Child Process</text>
  <text x="150" y="473" text-anchor="middle" fill="#c9d1d9" font-size="9">No process creation</text>

  <line x1="275" y1="440" x2="275" y2="475" stroke="#30363d"/>
  <text x="380" y="458" text-anchor="middle" fill="#3fb950" font-size="10">No Disk Artifacts</text>
  <text x="380" y="473" text-anchor="middle" fill="#c9d1d9" font-size="9">Entirely in memory</text>

  <line x1="500" y1="440" x2="500" y2="475" stroke="#30363d"/>
  <text x="610" y="458" text-anchor="middle" fill="#3fb950" font-size="10">Minimal Footprint</text>
  <text x="610" y="473" text-anchor="middle" fill="#c9d1d9" font-size="9">Small COFF object</text>

  <line x1="730" y1="440" x2="730" y2="475" stroke="#30363d"/>
  <text x="850" y="458" text-anchor="middle" fill="#3fb950" font-size="10">Fast Execution</text>
  <text x="850" y="473" text-anchor="middle" fill="#c9d1d9" font-size="9">No loader overhead</text>

  <!-- Footer -->
  <text x="500" y="565" text-anchor="middle" fill="#30363d" font-size="10">CRTLP Module 09 - Lesson 37: BOF Architecture Overview</text>
</svg>