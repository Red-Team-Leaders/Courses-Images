<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">COFF Object File Format</text>

  <!-- COFF Header -->
  <rect x="50" y="60" width="200" height="140" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="150" y="82" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">COFF Header</text>
  <line x1="60" y1="90" x2="240" y2="90" stroke="#8b949e" stroke-width="0.5"/>
  <text x="65" y="108" fill="#c9d1d9" font-size="11">Machine: 0x8664 (x64)</text>
  <text x="65" y="124" fill="#c9d1d9" font-size="11">NumberOfSections: 3</text>
  <text x="65" y="140" fill="#c9d1d9" font-size="11">TimeDateStamp</text>
  <text x="65" y="156" fill="#c9d1d9" font-size="11">PtrToSymbolTable</text>
  <text x="65" y="172" fill="#c9d1d9" font-size="11">NumberOfSymbols</text>
  <text x="65" y="188" fill="#8b949e" font-size="10">SizeOfOptionalHdr: 0</text>

  <!-- Section Table -->
  <rect x="290" y="60" width="200" height="180" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="390" y="82" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">Section Table</text>
  <line x1="300" y1="90" x2="480" y2="90" stroke="#8b949e" stroke-width="0.5"/>
  <!-- .text -->
  <rect x="305" y="98" width="170" height="30" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="315" y="117" fill="#58a6ff" font-size="11">.text</text>
  <text x="400" y="117" fill="#8b949e" font-size="10">CODE | EXECUTE</text>
  <!-- .data -->
  <rect x="305" y="134" width="170" height="30" rx="4" fill="#0d1117" stroke="#f0883e" stroke-width="1"/>
  <text x="315" y="153" fill="#f0883e" font-size="11">.data</text>
  <text x="400" y="153" fill="#8b949e" font-size="10">READ | WRITE</text>
  <!-- .rdata -->
  <rect x="305" y="170" width="170" height="30" rx="4" fill="#0d1117" stroke="#c9d1d9" stroke-width="1"/>
  <text x="315" y="189" fill="#c9d1d9" font-size="11">.rdata</text>
  <text x="400" y="189" fill="#8b949e" font-size="10">READ ONLY</text>

  <text x="390" y="226" text-anchor="middle" fill="#8b949e" font-size="10">Each: Name + VirtSize + RawPtr + Relocs</text>

  <!-- Arrow from header to section table -->
  <line x1="250" y1="130" x2="288" y2="130" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Symbol Table -->
  <rect x="530" y="60" width="200" height="150" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="630" y="82" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="bold">Symbol Table</text>
  <line x1="540" y1="90" x2="720" y2="90" stroke="#8b949e" stroke-width="0.5"/>
  <text x="545" y="108" fill="#c9d1d9" font-size="11">_go          | .text | 0x00</text>
  <text x="545" y="126" fill="#c9d1d9" font-size="11">_globalVar   | .data | 0x10</text>
  <text x="545" y="144" fill="#3fb950" font-size="11">KERNEL32$Fn  | UNDEF</text>
  <text x="545" y="162" fill="#3fb950" font-size="11">BeaconPrintf | UNDEF</text>
  <text x="545" y="182" fill="#8b949e" font-size="10">UNDEF = external (needs resolve)</text>
  <text x="545" y="196" fill="#8b949e" font-size="10">StorageClass: EXTERNAL / STATIC</text>

  <!-- Arrow from section table to symbol table -->
  <line x1="490" y1="130" x2="528" y2="130" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- String Table -->
  <rect x="770" y="60" width="200" height="120" rx="6" fill="#161b22" stroke="#c9d1d9" stroke-width="1.5"/>
  <text x="870" y="82" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="bold">String Table</text>
  <line x1="780" y1="90" x2="960" y2="90" stroke="#8b949e" stroke-width="0.5"/>
  <text x="785" y="108" fill="#8b949e" font-size="10">Size (4 bytes)</text>
  <text x="785" y="126" fill="#c9d1d9" font-size="11">KERNEL32$CreateProc...</text>
  <text x="785" y="144" fill="#c9d1d9" font-size="11">BeaconDataParse\0</text>
  <text x="785" y="162" fill="#8b949e" font-size="10">Names &gt; 8 bytes stored here</text>

  <!-- Arrow from symbol to string table -->
  <line x1="730" y1="110" x2="768" y2="110" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Relocation Entries -->
  <rect x="50" y="280" width="420" height="160" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="260" y="302" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">Relocation Entries (.text section)</text>
  <line x1="60" y1="310" x2="460" y2="310" stroke="#8b949e" stroke-width="0.5"/>
  <!-- Table header -->
  <text x="70" y="328" fill="#58a6ff" font-size="11" font-weight="bold">Offset</text>
  <text x="170" y="328" fill="#58a6ff" font-size="11" font-weight="bold">Symbol</text>
  <text x="340" y="328" fill="#58a6ff" font-size="11" font-weight="bold">Type</text>
  <line x1="60" y1="334" x2="460" y2="334" stroke="#8b949e" stroke-width="0.5"/>
  <!-- Rows -->
  <text x="70" y="352" fill="#c9d1d9" font-size="11">0x0012</text>
  <text x="170" y="352" fill="#c9d1d9" font-size="11">KERNEL32$CreateProcessW</text>
  <text x="340" y="352" fill="#f0883e" font-size="11">REL32</text>
  <text x="70" y="370" fill="#c9d1d9" font-size="11">0x0034</text>
  <text x="170" y="370" fill="#c9d1d9" font-size="11">_globalVar</text>
  <text x="340" y="370" fill="#f0883e" font-size="11">ADDR64</text>
  <text x="70" y="388" fill="#c9d1d9" font-size="11">0x005A</text>
  <text x="170" y="388" fill="#c9d1d9" font-size="11">BeaconPrintf</text>
  <text x="340" y="388" fill="#f0883e" font-size="11">REL32</text>
  <text x="70" y="416" fill="#8b949e" font-size="10">Beacon patches each offset with resolved address at load time</text>

  <!-- Beacon Resolution -->
  <rect x="530" y="280" width="440" height="160" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="750" y="302" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">Beacon Relocation Resolution</text>
  <line x1="540" y1="310" x2="960" y2="310" stroke="#8b949e" stroke-width="0.5"/>
  <text x="545" y="332" fill="#c9d1d9" font-size="11">1. Parse COFF header &amp; section table</text>
  <text x="545" y="352" fill="#c9d1d9" font-size="11">2. Allocate memory for each section</text>
  <text x="545" y="372" fill="#c9d1d9" font-size="11">3. Walk relocation entries</text>
  <text x="545" y="392" fill="#f0883e" font-size="11">4. Split "KERNEL32$Fn" on '$'</text>
  <text x="545" y="412" fill="#3fb950" font-size="11">5. LoadLibrary → GetProcAddress → patch</text>
  <text x="545" y="430" fill="#8b949e" font-size="10">Internal symbols resolved via Beacon API table</text>

  <!-- Arrow linking relocation to beacon resolution -->
  <line x1="470" y1="360" x2="528" y2="360" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- File layout bar at bottom -->
  <text x="500" y="478" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">COFF File Layout (Linear)</text>
  <rect x="80" y="490" width="120" height="35" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="140" y="512" text-anchor="middle" fill="#58a6ff" font-size="10">COFF Header</text>
  <rect x="200" y="490" width="160" height="35" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="280" y="512" text-anchor="middle" fill="#3fb950" font-size="10">Section Headers</text>
  <rect x="360" y="490" width="200" height="35" rx="4" fill="#0d1117" stroke="#f0883e" stroke-width="1.5"/>
  <text x="460" y="512" text-anchor="middle" fill="#f0883e" font-size="10">Raw Section Data + Relocs</text>
  <rect x="560" y="490" width="160" height="35" rx="4" fill="#0d1117" stroke="#c9d1d9" stroke-width="1.5"/>
  <text x="640" y="512" text-anchor="middle" fill="#c9d1d9" font-size="10">Symbol Table</text>
  <rect x="720" y="490" width="160" height="35" rx="4" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
  <text x="800" y="512" text-anchor="middle" fill="#8b949e" font-size="10">String Table</text>

  <!-- Footer -->
  <text x="500" y="560" text-anchor="middle" fill="#8b949e" font-size="10">CRTLP Module 09 — Lesson 37: Understanding COFF for Beacon Object Files</text>
</svg>