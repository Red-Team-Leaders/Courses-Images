<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="arBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#58a6ff"/></marker>
    <marker id="arGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
    <marker id="arRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f85149"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" fill="#58a6ff" font-size="20" font-weight="bold">BOF Output Flow</text>
  <text x="500" y="55" text-anchor="middle" fill="#8b949e" font-size="12">From BeaconPrintf/Output to operator console display</text>

  <!-- Phase 1: BOF Calls Output -->
  <rect x="30" y="85" width="220" height="250" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="140" y="110" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">BOF Code</text>
  <line x1="45" y1="120" x2="235" y2="120" stroke="#30363d"/>

  <rect x="45" y="130" width="190" height="190" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="55" y="150" fill="#8b949e" font-size="9">// Normal output</text>
  <text x="55" y="168" fill="#3fb950" font-size="9">BeaconPrintf(</text>
  <text x="55" y="183" fill="#58a6ff" font-size="9">  CALLBACK_OUTPUT,</text>
  <text x="55" y="198" fill="#c9d1d9" font-size="9">  "User: %s", name);</text>
  <text x="55" y="222" fill="#8b949e" font-size="9">// Error output</text>
  <text x="55" y="240" fill="#3fb950" font-size="9">BeaconPrintf(</text>
  <text x="55" y="255" fill="#f85149" font-size="9">  CALLBACK_ERROR,</text>
  <text x="55" y="270" fill="#c9d1d9" font-size="9">  "Failed: %d", err);</text>
  <text x="55" y="294" fill="#8b949e" font-size="9">// Raw binary output</text>
  <text x="55" y="312" fill="#3fb950" font-size="9">BeaconOutput(</text>
  <text x="55" y="327" fill="#f0883e" font-size="9">  CALLBACK_OUTPUT_OEM,</text>
  <text x="55" y="342" fill="#c9d1d9" font-size="9">  rawbuf, rawlen);</text>

  <!-- Arrow to buffer -->
  <line x1="250" y1="210" x2="288" y2="210" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Phase 2: Internal Buffer -->
  <rect x="290" y="85" width="200" height="250" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="390" y="110" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="bold">Output Buffer</text>
  <line x1="305" y1="120" x2="475" y2="120" stroke="#30363d"/>

  <text x="390" y="145" text-anchor="middle" fill="#c9d1d9" font-size="10">Beacon internal buffer</text>
  <text x="390" y="162" text-anchor="middle" fill="#8b949e" font-size="9">accumulates output</text>

  <!-- Buffer visualization -->
  <rect x="310" y="175" width="160" height="130" rx="4" fill="#0d1117" stroke="#30363d"/>

  <rect x="315" y="180" width="150" height="22" rx="2" fill="#3fb950" opacity="0.15" stroke="#3fb950" stroke-width="0.5"/>
  <text x="390" y="196" text-anchor="middle" fill="#3fb950" font-size="9">callback_type: 0x00</text>

  <rect x="315" y="205" width="150" height="22" rx="2" fill="#58a6ff" opacity="0.15" stroke="#58a6ff" stroke-width="0.5"/>
  <text x="390" y="221" text-anchor="middle" fill="#58a6ff" font-size="9">length: N bytes</text>

  <rect x="315" y="230" width="150" height="45" rx="2" fill="#f0883e" opacity="0.1" stroke="#f0883e" stroke-width="0.5"/>
  <text x="390" y="248" text-anchor="middle" fill="#f0883e" font-size="9">data: "User: admin"</text>
  <text x="390" y="265" text-anchor="middle" fill="#8b949e" font-size="8">formatted string output</text>

  <rect x="315" y="278" width="150" height="22" rx="2" fill="#8b949e" opacity="0.1" stroke="#8b949e" stroke-width="0.5"/>
  <text x="390" y="294" text-anchor="middle" fill="#8b949e" font-size="8">[more entries...]</text>

  <text x="390" y="325" text-anchor="middle" fill="#8b949e" font-size="9">Flushed when BOF returns</text>

  <!-- Arrow to C2 -->
  <line x1="490" y1="210" x2="528" y2="210" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Phase 3: C2 Transport -->
  <rect x="530" y="85" width="170" height="250" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="615" y="110" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">C2 Channel</text>
  <line x1="545" y1="120" x2="685" y2="120" stroke="#30363d"/>

  <text x="615" y="145" text-anchor="middle" fill="#c9d1d9" font-size="10">Encrypted callback</text>
  <text x="615" y="162" text-anchor="middle" fill="#c9d1d9" font-size="10">to team server</text>

  <rect x="550" y="175" width="130" height="45" rx="4" fill="#0d1117" stroke="#f85149" stroke-width="1"/>
  <text x="615" y="195" text-anchor="middle" fill="#f85149" font-size="10">HTTP POST</text>
  <text x="615" y="210" text-anchor="middle" fill="#8b949e" font-size="8">/submit.php?id=...</text>

  <text x="615" y="245" text-anchor="middle" fill="#8b949e" font-size="9">Callback types</text>
  <text x="615" y="260" text-anchor="middle" fill="#8b949e" font-size="9">embedded in frame</text>

  <rect x="550" y="270" width="130" height="50" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="615" y="290" text-anchor="middle" fill="#c9d1d9" font-size="9">AES encrypted</text>
  <text x="615" y="305" text-anchor="middle" fill="#c9d1d9" font-size="9">session key</text>

  <!-- Arrow to console -->
  <line x1="700" y1="210" x2="738" y2="210" stroke="#3fb950" stroke-width="2" marker-end="url(#arGreen)"/>

  <!-- Phase 4: Operator Console -->
  <rect x="740" y="85" width="230" height="250" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="855" y="110" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Operator Console</text>
  <line x1="755" y1="120" x2="955" y2="120" stroke="#30363d"/>

  <!-- Console output mock -->
  <rect x="755" y="130" width="200" height="190" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="765" y="150" fill="#8b949e" font-size="9">beacon&gt; inline-execute whoami.o</text>
  <text x="765" y="168" fill="#3fb950" font-size="9">[*] Tasked beacon to run BOF</text>
  <text x="765" y="188" fill="#c9d1d9" font-size="9">[+] received output:</text>
  <text x="765" y="206" fill="#c9d1d9" font-size="10">User: CORP\admin</text>
  <text x="765" y="230" fill="#f85149" font-size="9">[!] received error:</text>
  <text x="765" y="248" fill="#f85149" font-size="10">Failed: 5 (ACCESS_DENIED)</text>
  <text x="765" y="275" fill="#8b949e" font-size="9">[*] OEM output (raw):</text>
  <text x="765" y="293" fill="#f0883e" font-size="9">4f 00 4b 00 (hex dump)</text>
  <text x="765" y="315" fill="#8b949e" font-size="8">beacon&gt; _</text>

  <!-- Callback Types Reference -->
  <rect x="30" y="365" width="940" height="110" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="500" y="390" text-anchor="middle" fill="#f0883e" font-size="14" font-weight="bold">Callback Type Constants</text>
  <line x1="50" y1="400" x2="950" y2="400" stroke="#30363d"/>

  <!-- CALLBACK_OUTPUT -->
  <rect x="50" y="410" width="270" height="50" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="185" y="430" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">CALLBACK_OUTPUT (0x00)</text>
  <text x="185" y="448" text-anchor="middle" fill="#c9d1d9" font-size="9">Normal text output, displayed as [+]</text>

  <!-- CALLBACK_ERROR -->
  <rect x="350" y="410" width="270" height="50" rx="4" fill="#0d1117" stroke="#f85149" stroke-width="1"/>
  <text x="485" y="430" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">CALLBACK_ERROR (0x0D)</text>
  <text x="485" y="448" text-anchor="middle" fill="#c9d1d9" font-size="9">Error output, displayed as [!] in red</text>

  <!-- CALLBACK_OUTPUT_OEM -->
  <rect x="650" y="410" width="290" height="50" rx="4" fill="#0d1117" stroke="#f0883e" stroke-width="1"/>
  <text x="795" y="430" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">CALLBACK_OUTPUT_OEM (0x1E)</text>
  <text x="795" y="448" text-anchor="middle" fill="#c9d1d9" font-size="9">Raw/binary output, no charset conversion</text>

  <!-- Key notes -->
  <rect x="30" y="490" width="940" height="45" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="250" y="517" text-anchor="middle" fill="#58a6ff" font-size="10">Output is buffered, not streamed</text>
  <line x1="480" y1="498" x2="480" y2="530" stroke="#30363d"/>
  <text x="620" y="517" text-anchor="middle" fill="#58a6ff" font-size="10">Sent as single callback on BOF return</text>
  <line x1="780" y1="498" x2="780" y2="530" stroke="#30363d"/>
  <text x="880" y="517" text-anchor="middle" fill="#58a6ff" font-size="10">Max ~1MB default</text>

  <!-- Footer -->
  <text x="500" y="565" text-anchor="middle" fill="#30363d" font-size="10">CRTLP Module 09 - Lesson 38: BOF Output and Callback Flow</text>
</svg>