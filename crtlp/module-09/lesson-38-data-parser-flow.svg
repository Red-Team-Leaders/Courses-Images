<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="30" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Beacon Data Parser — Argument Unpacking Flow</text>

  <!-- Operator side -->
  <rect x="20" y="55" width="300" height="130" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="170" y="80" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Operator (Aggressor)</text>
  <rect x="35" y="95" width="270" height="35" rx="3" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="170" y="117" text-anchor="middle" fill="#58a6ff" font-size="9" font-family="Consolas">bof_pack($bid, "sib", "target", 443, $data)</text>
  <text x="170" y="145" text-anchor="middle" fill="#8b949e" font-size="8">s=string(Z), i=int(32), b=binary blob</text>
  <text x="170" y="160" text-anchor="middle" fill="#8b949e" font-size="8">Packs into binary format with length prefixes</text>

  <line x1="320" y1="120" x2="355" y2="120" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Binary buffer -->
  <rect x="360" y="55" width="300" height="130" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="510" y="80" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">Packed Binary Buffer</text>
  <rect x="375" y="95" width="270" height="75" rx="3" fill="#0d1117" stroke="#f0883e" stroke-width="1"/>
  <text x="380" y="115" fill="#f0883e" font-size="8" font-family="Consolas">[07 00 00 00]  // string len=7</text>
  <text x="380" y="130" fill="#f0883e" font-size="8" font-family="Consolas">[74 61 72 67 65 74 00]  // "target\0"</text>
  <text x="380" y="145" fill="#f0883e" font-size="8" font-family="Consolas">[BB 01 00 00]  // int 443</text>
  <text x="380" y="160" fill="#f0883e" font-size="8" font-family="Consolas">[XX XX ...] // binary data + len</text>

  <line x1="660" y1="120" x2="695" y2="120" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="677" y="110" fill="#8b949e" font-size="7">C2 channel</text>

  <!-- BOF side -->
  <rect x="700" y="55" width="280" height="130" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="840" y="80" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">BOF go() Receives</text>
  <rect x="715" y="95" width="250" height="40" rx="3" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="840" y="115" text-anchor="middle" fill="#3fb950" font-size="9" font-family="Consolas">void go(char* args, int len)</text>
  <text x="840" y="148" text-anchor="middle" fill="#8b949e" font-size="8">args = pointer to packed buffer</text>
  <text x="840" y="163" text-anchor="middle" fill="#8b949e" font-size="8">len = total buffer size in bytes</text>

  <!-- Parsing steps -->
  <rect x="20" y="210" width="960" height="330" rx="8" fill="#0d1117" stroke="#f0883e" stroke-width="1.5"/>
  <text x="500" y="238" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="bold">Parsing Steps Inside BOF</text>

  <!-- Step 1 -->
  <rect x="40" y="255" width="430" height="50" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <circle cx="60" cy="280" r="12" fill="#58a6ff"/>
  <text x="60" y="285" text-anchor="middle" fill="#0d1117" font-size="9" font-weight="bold">1</text>
  <text x="255" y="275" text-anchor="middle" fill="#58a6ff" font-size="10" font-family="Consolas">datap parser;</text>
  <text x="255" y="295" text-anchor="middle" fill="#58a6ff" font-size="10" font-family="Consolas">BeaconDataParse(&amp;parser, args, len);</text>

  <rect x="500" y="255" width="460" height="50" rx="4" fill="#161b22" stroke="#8b949e" stroke-width="1"/>
  <text x="730" y="275" text-anchor="middle" fill="#8b949e" font-size="9">Initializes parser struct:</text>
  <text x="730" y="293" text-anchor="middle" fill="#8b949e" font-size="9">parser.original = args, parser.buffer = args, parser.length = len, parser.size = len</text>

  <!-- Step 2 -->
  <rect x="40" y="315" width="430" height="50" rx="4" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <circle cx="60" cy="340" r="12" fill="#f0883e"/>
  <text x="60" y="345" text-anchor="middle" fill="#0d1117" font-size="9" font-weight="bold">2</text>
  <text x="255" y="335" text-anchor="middle" fill="#f0883e" font-size="10" font-family="Consolas">char* target = BeaconDataExtract(&amp;parser, NULL);</text>
  <text x="255" y="355" text-anchor="middle" fill="#8b949e" font-size="9">// target = "target"</text>

  <rect x="500" y="315" width="460" height="50" rx="4" fill="#161b22" stroke="#8b949e" stroke-width="1"/>
  <text x="730" y="335" text-anchor="middle" fill="#8b949e" font-size="9">Reads 4-byte length prefix (7), returns pointer to string,</text>
  <text x="730" y="353" text-anchor="middle" fill="#8b949e" font-size="9">advances internal cursor past string + null</text>

  <!-- Step 3 -->
  <rect x="40" y="375" width="430" height="50" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <circle cx="60" cy="400" r="12" fill="#3fb950"/>
  <text x="60" y="405" text-anchor="middle" fill="#0d1117" font-size="9" font-weight="bold">3</text>
  <text x="255" y="395" text-anchor="middle" fill="#3fb950" font-size="10" font-family="Consolas">int port = BeaconDataInt(&amp;parser);</text>
  <text x="255" y="415" text-anchor="middle" fill="#8b949e" font-size="9">// port = 443</text>

  <rect x="500" y="375" width="460" height="50" rx="4" fill="#161b22" stroke="#8b949e" stroke-width="1"/>
  <text x="730" y="395" text-anchor="middle" fill="#8b949e" font-size="9">Reads 4 bytes as big-endian int32,</text>
  <text x="730" y="413" text-anchor="middle" fill="#8b949e" font-size="9">advances cursor by 4</text>

  <!-- Step 4 -->
  <rect x="40" y="435" width="430" height="50" rx="4" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <circle cx="60" cy="460" r="12" fill="#f0883e"/>
  <text x="60" y="465" text-anchor="middle" fill="#0d1117" font-size="9" font-weight="bold">4</text>
  <text x="255" y="453" text-anchor="middle" fill="#f0883e" font-size="10" font-family="Consolas">int blob_len;</text>
  <text x="255" y="473" text-anchor="middle" fill="#f0883e" font-size="10" font-family="Consolas">char* blob = BeaconDataExtract(&amp;parser, &amp;blob_len);</text>

  <rect x="500" y="435" width="460" height="50" rx="4" fill="#161b22" stroke="#8b949e" stroke-width="1"/>
  <text x="730" y="455" text-anchor="middle" fill="#8b949e" font-size="9">Reads length-prefixed binary data,</text>
  <text x="730" y="473" text-anchor="middle" fill="#8b949e" font-size="9">sets blob_len, returns data pointer</text>

  <!-- Check remaining -->
  <rect x="40" y="495" width="920" height="30" rx="4" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-width="1"/>
  <text x="500" y="515" text-anchor="middle" fill="#f85149" font-size="9">Always check BeaconDataLength(&amp;parser) == 0 after parsing — mismatched pack/extract = crash or wrong data</text>

  <text x="500" y="565" text-anchor="middle" fill="#58a6ff" font-size="10">CRTLP Module 09 — Beacon Data Parser Flow</text>
</svg>
