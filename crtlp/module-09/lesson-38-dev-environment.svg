<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="ar-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">BOF Development Environment</text>

  <!-- Component boxes across the top -->
  <!-- MinGW-w64 -->
  <rect x="40" y="60" width="170" height="100" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="125" y="82" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">MinGW-w64</text>
  <line x1="50" y1="90" x2="200" y2="90" stroke="#8b949e" stroke-width="0.5"/>
  <text x="55" y="108" fill="#c9d1d9" font-size="10">x86_64-w64-mingw32-gcc</text>
  <text x="55" y="124" fill="#8b949e" font-size="10">Cross-compiler for Windows</text>
  <text x="55" y="140" fill="#8b949e" font-size="10">COFF output (-c flag)</text>
  <text x="55" y="153" fill="#3fb950" font-size="9">apt install mingw-w64</text>

  <!-- beacon.h -->
  <rect x="230" y="60" width="170" height="100" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="315" y="82" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">beacon.h</text>
  <line x1="240" y1="90" x2="390" y2="90" stroke="#8b949e" stroke-width="0.5"/>
  <text x="240" y="108" fill="#c9d1d9" font-size="10">Beacon API declarations</text>
  <text x="240" y="124" fill="#c9d1d9" font-size="10">DFR macros (DECLSPEC_IMPORT)</text>
  <text x="240" y="140" fill="#c9d1d9" font-size="10">datap / formatp structs</text>
  <text x="240" y="153" fill="#8b949e" font-size="9">From Cobalt Strike package</text>

  <!-- BOF Macros -->
  <rect x="420" y="60" width="170" height="100" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="505" y="82" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="bold">BOF Macros</text>
  <line x1="430" y1="90" x2="580" y2="90" stroke="#8b949e" stroke-width="0.5"/>
  <text x="430" y="108" fill="#c9d1d9" font-size="10">DECLSPEC_IMPORT</text>
  <text x="430" y="124" fill="#c9d1d9" font-size="10">WINBASEAPI / WINAPI</text>
  <text x="430" y="140" fill="#c9d1d9" font-size="10">DFR(lib, func)</text>
  <text x="430" y="153" fill="#8b949e" font-size="9">Generates LIB$Func symbols</text>

  <!-- Makefile -->
  <rect x="610" y="60" width="170" height="100" rx="6" fill="#161b22" stroke="#c9d1d9" stroke-width="1.5"/>
  <text x="695" y="82" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="bold">Makefile</text>
  <line x1="620" y1="90" x2="770" y2="90" stroke="#8b949e" stroke-width="0.5"/>
  <text x="620" y="108" fill="#c9d1d9" font-size="10">CC = x86_64-w64-mingw32-gcc</text>
  <text x="620" y="124" fill="#c9d1d9" font-size="10">CFLAGS = -c -o bof.o</text>
  <text x="620" y="140" fill="#c9d1d9" font-size="10">clean / all targets</text>
  <text x="620" y="153" fill="#8b949e" font-size="9">Automates build process</text>

  <!-- COFFLoader -->
  <rect x="800" y="60" width="170" height="100" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="885" y="82" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">COFFLoader</text>
  <line x1="810" y1="90" x2="960" y2="90" stroke="#8b949e" stroke-width="0.5"/>
  <text x="810" y="108" fill="#c9d1d9" font-size="10">Test harness (no CS needed)</text>
  <text x="810" y="124" fill="#c9d1d9" font-size="10">Emulates Beacon loader</text>
  <text x="810" y="140" fill="#c9d1d9" font-size="10">Parses COFF, calls go()</text>
  <text x="810" y="153" fill="#8b949e" font-size="9">github.com/trustedsec</text>

  <!-- Compilation Flow -->
  <text x="500" y="200" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">Compilation Flow</text>

  <!-- Source file -->
  <rect x="60" y="220" width="180" height="110" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="150" y="242" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">source.c</text>
  <line x1="70" y1="250" x2="230" y2="250" stroke="#8b949e" stroke-width="0.5"/>
  <text x="75" y="268" fill="#c9d1d9" font-size="10">#include "beacon.h"</text>
  <text x="75" y="284" fill="#c9d1d9" font-size="10">DFR(KERNEL32, OpenProcess)</text>
  <text x="75" y="300" fill="#c9d1d9" font-size="10">void go(char* args, int l){</text>
  <text x="75" y="316" fill="#c9d1d9" font-size="10">  // BOF logic ...</text>

  <line x1="240" y1="275" x2="310" y2="275" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="275" y="265" text-anchor="middle" fill="#f0883e" font-size="10">gcc -c</text>

  <!-- Compiler -->
  <rect x="315" y="230" width="180" height="90" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="405" y="255" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">MinGW Compiler</text>
  <line x1="325" y1="263" x2="485" y2="263" stroke="#8b949e" stroke-width="0.5"/>
  <text x="330" y="282" fill="#c9d1d9" font-size="10">Preprocessor → Compiler</text>
  <text x="330" y="298" fill="#f0883e" font-size="10">No linker step (-c flag)</text>
  <text x="330" y="312" fill="#8b949e" font-size="10">Output: COFF object file</text>

  <line x1="495" y1="275" x2="565" y2="275" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="530" y="265" text-anchor="middle" fill="#f0883e" font-size="10">-o</text>

  <!-- Output .o -->
  <rect x="570" y="230" width="160" height="90" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="650" y="255" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">bof.o (COFF)</text>
  <line x1="580" y1="263" x2="720" y2="263" stroke="#8b949e" stroke-width="0.5"/>
  <text x="585" y="282" fill="#c9d1d9" font-size="10">Unlinked object file</text>
  <text x="585" y="298" fill="#c9d1d9" font-size="10">External symbols unresolved</text>
  <text x="585" y="312" fill="#8b949e" font-size="10">~1-10 KB typical</text>

  <!-- Two paths: test and deploy -->
  <line x1="730" y1="260" x2="800" y2="230" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ar-green)"/>
  <line x1="730" y1="290" x2="800" y2="310" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Test path -->
  <rect x="805" y="210" width="160" height="45" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="885" y="230" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">COFFLoader Test</text>
  <text x="885" y="248" text-anchor="middle" fill="#8b949e" font-size="10">Local validation</text>

  <!-- Deploy path -->
  <rect x="805" y="290" width="160" height="45" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="885" y="310" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">Cobalt Strike</text>
  <text x="885" y="328" text-anchor="middle" fill="#8b949e" font-size="10">inline-execute bof.o</text>

  <!-- Full compile command -->
  <rect x="60" y="370" width="880" height="80" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="1"/>
  <text x="80" y="392" fill="#58a6ff" font-size="12" font-weight="bold">Full Build Command</text>
  <line x1="70" y1="400" x2="930" y2="400" stroke="#8b949e" stroke-width="0.5"/>
  <text x="80" y="420" fill="#3fb950" font-size="12">$ x86_64-w64-mingw32-gcc -c source.c -o bof.o -I include/</text>
  <text x="80" y="440" fill="#8b949e" font-size="10">-c = compile only (no link)  |  -o = output file  |  -I = include path for beacon.h</text>

  <!-- Key requirements -->
  <rect x="60" y="470" width="430" height="75" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="80" y="492" fill="#3fb950" font-size="12" font-weight="bold">Required Setup</text>
  <line x1="70" y1="500" x2="480" y2="500" stroke="#8b949e" stroke-width="0.5"/>
  <text x="80" y="518" fill="#c9d1d9" font-size="10">1. Install MinGW-w64 (apt install gcc-mingw-w64-x86-64)</text>
  <text x="80" y="534" fill="#c9d1d9" font-size="10">2. Obtain beacon.h from Cobalt Strike or community headers</text>

  <!-- Tips -->
  <rect x="510" y="470" width="430" height="75" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1"/>
  <text x="530" y="492" fill="#f0883e" font-size="12" font-weight="bold">Development Tips</text>
  <line x1="520" y1="500" x2="930" y2="500" stroke="#8b949e" stroke-width="0.5"/>
  <text x="530" y="518" fill="#c9d1d9" font-size="10">Always test with COFFLoader before deploying to live Beacon</text>
  <text x="530" y="534" fill="#c9d1d9" font-size="10">Use -Wall -Werror to catch implicit declarations early</text>

  <!-- Footer -->
  <text x="500" y="570" text-anchor="middle" fill="#8b949e" font-size="10">CRTLP Module 09 — Lesson 38: Setting Up the BOF Development Environment</text>
</svg>