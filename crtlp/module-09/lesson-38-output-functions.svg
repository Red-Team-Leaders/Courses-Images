<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="30" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Beacon Output Functions — When to Use Each</text>

  <!-- BeaconPrintf -->
  <rect x="20" y="55" width="310" height="230" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="175" y="80" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">BeaconPrintf</text>
  <text x="175" y="98" text-anchor="middle" fill="#8b949e" font-size="9">Simple formatted output</text>

  <rect x="35" y="110" width="280" height="45" rx="3" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="175" y="130" text-anchor="middle" fill="#3fb950" font-size="9" font-family="Consolas">BeaconPrintf(CALLBACK_OUTPUT,</text>
  <text x="175" y="147" text-anchor="middle" fill="#3fb950" font-size="9" font-family="Consolas">  "User: %s PID: %d", user, pid);</text>

  <text x="35" y="175" fill="#c9d1d9" font-size="9">Use when:</text>
  <text x="45" y="195" fill="#8b949e" font-size="9">+ Single line output messages</text>
  <text x="45" y="212" fill="#8b949e" font-size="9">+ Quick debug/status messages</text>
  <text x="45" y="229" fill="#8b949e" font-size="9">+ Error reporting (CALLBACK_ERROR)</text>

  <text x="35" y="255" fill="#f85149" font-size="9">Avoid when:</text>
  <text x="45" y="272" fill="#f85149" font-size="8">- Many lines (each call = network round trip)</text>

  <!-- BeaconOutput -->
  <rect x="345" y="55" width="310" height="230" rx="8" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
  <text x="500" y="80" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">BeaconOutput</text>
  <text x="500" y="98" text-anchor="middle" fill="#8b949e" font-size="9">Raw byte output</text>

  <rect x="360" y="110" width="280" height="45" rx="3" fill="#161b22" stroke="#f0883e" stroke-width="1"/>
  <text x="500" y="130" text-anchor="middle" fill="#f0883e" font-size="9" font-family="Consolas">BeaconOutput(CALLBACK_OUTPUT,</text>
  <text x="500" y="147" text-anchor="middle" fill="#f0883e" font-size="9" font-family="Consolas">  rawBytes, sizeof(rawBytes));</text>

  <text x="360" y="175" fill="#c9d1d9" font-size="9">Use when:</text>
  <text x="370" y="195" fill="#8b949e" font-size="9">+ Binary data (screenshots, tokens)</text>
  <text x="370" y="212" fill="#8b949e" font-size="9">+ Pre-formatted byte arrays</text>
  <text x="370" y="229" fill="#8b949e" font-size="9">+ Large data chunks</text>

  <text x="360" y="255" fill="#f85149" font-size="9">Avoid when:</text>
  <text x="370" y="272" fill="#f85149" font-size="8">- Need printf-style formatting</text>

  <!-- BeaconFormat* -->
  <rect x="670" y="55" width="310" height="230" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="825" y="80" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">BeaconFormat* (Buffered)</text>
  <text x="825" y="98" text-anchor="middle" fill="#8b949e" font-size="9">Build then send once</text>

  <rect x="685" y="110" width="280" height="75" rx="3" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="825" y="128" text-anchor="middle" fill="#58a6ff" font-size="8" font-family="Consolas">formatp fmt;</text>
  <text x="825" y="143" text-anchor="middle" fill="#58a6ff" font-size="8" font-family="Consolas">BeaconFormatAlloc(&amp;fmt, 1024);</text>
  <text x="825" y="158" text-anchor="middle" fill="#58a6ff" font-size="8" font-family="Consolas">BeaconFormatPrintf(&amp;fmt, "line %d", i);</text>
  <text x="825" y="173" text-anchor="middle" fill="#58a6ff" font-size="8" font-family="Consolas">// ... repeat for each line ...</text>

  <text x="685" y="200" fill="#c9d1d9" font-size="9">Use when:</text>
  <text x="695" y="218" fill="#8b949e" font-size="9">+ Multi-line enumeration results</text>
  <text x="695" y="235" fill="#8b949e" font-size="9">+ Loop output (process list, users)</text>
  <text x="695" y="252" fill="#8b949e" font-size="9">+ Performance-critical output</text>

  <text x="685" y="272" fill="#f85149" font-size="9">Remember: BeaconFormatFree(&amp;fmt)!</text>

  <!-- Send pattern -->
  <rect x="670" y="295" width="310" height="55" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="825" y="315" text-anchor="middle" fill="#58a6ff" font-size="8" font-family="Consolas">int outLen;</text>
  <text x="825" y="330" text-anchor="middle" fill="#58a6ff" font-size="8" font-family="Consolas">char* out = BeaconFormatToString(&amp;fmt, &amp;outLen);</text>
  <text x="825" y="345" text-anchor="middle" fill="#58a6ff" font-size="8" font-family="Consolas">BeaconOutput(CALLBACK_OUTPUT, out, outLen);</text>

  <!-- Callback types -->
  <rect x="20" y="365" width="635" height="85" rx="6" fill="#0d1117" stroke="#f0883e" stroke-width="1"/>
  <text x="337" y="390" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">Callback Type Constants</text>
  <rect x="35" y="400" width="290" height="35" rx="3" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="180" y="422" text-anchor="middle" fill="#3fb950" font-size="9" font-family="Consolas">CALLBACK_OUTPUT (0x00) — normal</text>
  <rect x="340" y="400" width="300" height="35" rx="3" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="490" y="422" text-anchor="middle" fill="#f85149" font-size="9" font-family="Consolas">CALLBACK_ERROR (0x0D) — error (red)</text>

  <!-- Decision flowchart -->
  <rect x="20" y="465" width="960" height="80" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="500" y="490" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">Quick Decision Guide</text>
  <text x="170" y="515" text-anchor="middle" fill="#3fb950" font-size="9">Single message? BeaconPrintf</text>
  <text x="170" y="533" text-anchor="middle" fill="#8b949e" font-size="8">Simplest, one call</text>
  <text x="500" y="515" text-anchor="middle" fill="#f0883e" font-size="9">Raw bytes? BeaconOutput</text>
  <text x="500" y="533" text-anchor="middle" fill="#8b949e" font-size="8">Binary data, no formatting</text>
  <text x="830" y="515" text-anchor="middle" fill="#58a6ff" font-size="9">Loop/multi-line? BeaconFormat*</text>
  <text x="830" y="533" text-anchor="middle" fill="#8b949e" font-size="8">Buffer then send once</text>

  <text x="500" y="570" text-anchor="middle" fill="#58a6ff" font-size="10">CRTLP Module 09 — Beacon Output Functions</text>
</svg>
