<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">BOF Project Structure</text>

  <!-- Root directory -->
  <rect x="40" y="55" width="500" height="490" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="60" y="80" fill="#58a6ff" font-size="14" font-weight="bold">my-bof-project/</text>

  <!-- src/ -->
  <rect x="60" y="95" width="460" height="100" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="80" y="115" fill="#3fb950" font-size="13" font-weight="bold">src/</text>
  <text x="100" y="135" fill="#c9d1d9" font-size="11">whoami.c</text>
  <text x="250" y="135" fill="#8b949e" font-size="10">— Main BOF source: who am I query</text>
  <text x="100" y="155" fill="#c9d1d9" font-size="11">enumprocs.c</text>
  <text x="250" y="155" fill="#8b949e" font-size="10">— Process enumeration BOF</text>
  <text x="100" y="175" fill="#c9d1d9" font-size="11">regquery.c</text>
  <text x="250" y="175" fill="#8b949e" font-size="10">— Registry key query BOF</text>

  <!-- include/ -->
  <rect x="60" y="205" width="460" height="60" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="80" y="225" fill="#58a6ff" font-size="13" font-weight="bold">include/</text>
  <text x="100" y="248" fill="#c9d1d9" font-size="11">beacon.h</text>
  <text x="250" y="248" fill="#8b949e" font-size="10">— Beacon API prototypes, DFR macros</text>

  <!-- dist/ -->
  <rect x="60" y="275" width="460" height="80" rx="4" fill="#0d1117" stroke="#f0883e" stroke-width="1"/>
  <text x="80" y="295" fill="#f0883e" font-size="13" font-weight="bold">dist/</text>
  <text x="100" y="318" fill="#c9d1d9" font-size="11">whoami.x64.o</text>
  <text x="250" y="318" fill="#8b949e" font-size="10">— Compiled 64-bit COFF</text>
  <text x="100" y="338" fill="#c9d1d9" font-size="11">whoami.x86.o</text>
  <text x="250" y="338" fill="#8b949e" font-size="10">— Compiled 32-bit COFF (optional)</text>

  <!-- scripts/ -->
  <rect x="60" y="365" width="460" height="60" rx="4" fill="#0d1117" stroke="#f85149" stroke-width="1"/>
  <text x="80" y="385" fill="#f85149" font-size="13" font-weight="bold">scripts/</text>
  <text x="100" y="408" fill="#c9d1d9" font-size="11">whoami.cna</text>
  <text x="250" y="408" fill="#8b949e" font-size="10">— Aggressor script: alias + bof_pack</text>

  <!-- tests/ -->
  <rect x="60" y="435" width="460" height="50" rx="4" fill="#0d1117" stroke="#c9d1d9" stroke-width="1"/>
  <text x="80" y="455" fill="#c9d1d9" font-size="13" font-weight="bold">tests/</text>
  <text x="100" y="475" fill="#c9d1d9" font-size="11">test_whoami.py</text>
  <text x="250" y="475" fill="#8b949e" font-size="10">— COFFLoader test automation</text>

  <!-- Makefile -->
  <rect x="60" y="495" width="460" height="35" rx="4" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
  <text x="80" y="518" fill="#c9d1d9" font-size="13" font-weight="bold">Makefile</text>
  <text x="250" y="518" fill="#8b949e" font-size="10">— Build automation (all, clean, test)</text>

  <!-- Right side: Detail panels -->
  <!-- Makefile detail -->
  <rect x="570" y="55" width="400" height="145" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
  <text x="590" y="77" fill="#c9d1d9" font-size="12" font-weight="bold">Makefile</text>
  <line x1="580" y1="85" x2="960" y2="85" stroke="#8b949e" stroke-width="0.5"/>
  <text x="585" y="104" fill="#3fb950" font-size="11">CC64 = x86_64-w64-mingw32-gcc</text>
  <text x="585" y="120" fill="#3fb950" font-size="11">CC32 = i686-w64-mingw32-gcc</text>
  <text x="585" y="136" fill="#f0883e" font-size="11">CFLAGS = -c -I include/</text>
  <text x="585" y="156" fill="#c9d1d9" font-size="11">all:</text>
  <text x="620" y="172" fill="#8b949e" font-size="10">$(CC64) $(CFLAGS) src/whoami.c -o dist/whoami.x64.o</text>
  <text x="585" y="192" fill="#c9d1d9" font-size="11">clean:</text>
  <text x="620" y="192" fill="#8b949e" font-size="10">rm -f dist/*.o</text>

  <!-- Aggressor Script detail -->
  <rect x="570" y="215" width="400" height="155" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="590" y="237" fill="#f85149" font-size="12" font-weight="bold">whoami.cna (Aggressor Script)</text>
  <line x1="580" y1="245" x2="960" y2="245" stroke="#8b949e" stroke-width="0.5"/>
  <text x="585" y="265" fill="#c9d1d9" font-size="11">alias whoami-bof {</text>
  <text x="605" y="283" fill="#c9d1d9" font-size="11">local('$handle $data');</text>
  <text x="605" y="301" fill="#3fb950" font-size="11">$handle = openf(script_resource(</text>
  <text x="625" y="317" fill="#3fb950" font-size="11">"dist/whoami.x64.o"));</text>
  <text x="605" y="335" fill="#f0883e" font-size="11">$data = readb($handle, -1);</text>
  <text x="605" y="351" fill="#58a6ff" font-size="11">beacon_inline_execute($1,</text>
  <text x="625" y="365" fill="#58a6ff" font-size="11">$data, "go", $null);</text>

  <!-- beacon.h detail -->
  <rect x="570" y="385" width="400" height="150" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="590" y="407" fill="#58a6ff" font-size="12" font-weight="bold">beacon.h (Key Contents)</text>
  <line x1="580" y1="415" x2="960" y2="415" stroke="#8b949e" stroke-width="0.5"/>
  <text x="585" y="435" fill="#8b949e" font-size="10">/* DFR Macro */</text>
  <text x="585" y="453" fill="#c9d1d9" font-size="11">#define DFR(lib, fn) \</text>
  <text x="605" y="469" fill="#c9d1d9" font-size="10">__declspec(dllimport) ... lib##$##fn</text>
  <text x="585" y="489" fill="#8b949e" font-size="10">/* Beacon API prototypes */</text>
  <text x="585" y="507" fill="#3fb950" font-size="11">void BeaconPrintf(int, char*, ...);</text>
  <text x="585" y="523" fill="#3fb950" font-size="11">void BeaconDataParse(datap*, char*, int);</text>

  <!-- Arrows connecting left to right -->
  <line x1="520" y1="510" x2="568" y2="460" stroke="#f0883e" stroke-width="1" marker-end="url(#ar)" stroke-dasharray="3"/>
  <line x1="520" y1="390" x2="568" y2="290" stroke="#f0883e" stroke-width="1" marker-end="url(#ar)" stroke-dasharray="3"/>
  <line x1="520" y1="230" x2="568" y2="435" stroke="#f0883e" stroke-width="1" marker-end="url(#ar)" stroke-dasharray="3"/>

  <!-- Footer -->
  <text x="500" y="570" text-anchor="middle" fill="#8b949e" font-size="10">CRTLP Module 09 — Lesson 38: Organizing a Professional BOF Project</text>
</svg>