<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Windows x64 Calling Convention for BOFs</text>

  <!-- Register arguments -->
  <text x="50" y="70" fill="#f0883e" font-size="14" font-weight="bold">Register Arguments (first 4 parameters)</text>

  <rect x="50" y="85" width="200" height="50" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="80" y="107" fill="#58a6ff" font-size="14" font-weight="bold">RCX</text>
  <text x="155" y="107" fill="#c9d1d9" font-size="12">= 1st argument</text>
  <text x="155" y="125" fill="#8b949e" font-size="10">e.g. hProcess</text>

  <rect x="270" y="85" width="200" height="50" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="300" y="107" fill="#3fb950" font-size="14" font-weight="bold">RDX</text>
  <text x="375" y="107" fill="#c9d1d9" font-size="12">= 2nd argument</text>
  <text x="375" y="125" fill="#8b949e" font-size="10">e.g. lpAddress</text>

  <rect x="490" y="85" width="200" height="50" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="520" y="107" fill="#f0883e" font-size="14" font-weight="bold">R8</text>
  <text x="585" y="107" fill="#c9d1d9" font-size="12">= 3rd argument</text>
  <text x="585" y="125" fill="#8b949e" font-size="10">e.g. dwSize</text>

  <rect x="710" y="85" width="200" height="50" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="740" y="107" fill="#f85149" font-size="14" font-weight="bold">R9</text>
  <text x="805" y="107" fill="#c9d1d9" font-size="12">= 4th argument</text>
  <text x="805" y="125" fill="#8b949e" font-size="10">e.g. flProtect</text>

  <!-- Return value -->
  <rect x="50" y="150" width="200" height="50" rx="6" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
  <text x="80" y="172" fill="#7ee787" font-size="14" font-weight="bold">RAX</text>
  <text x="155" y="172" fill="#c9d1d9" font-size="12">= return value</text>
  <text x="155" y="190" fill="#8b949e" font-size="10">NTSTATUS / HANDLE / BOOL</text>

  <!-- Stack layout -->
  <text x="50" y="230" fill="#f0883e" font-size="14" font-weight="bold">Stack Layout (RSP at call site)</text>

  <rect x="50" y="245" width="400" height="300" rx="8" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>

  <!-- Shadow space -->
  <rect x="65" y="260" width="370" height="30" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="80" y="280" fill="#58a6ff" font-size="11">RSP+0x00</text>
  <text x="200" y="280" fill="#8b949e" font-size="11">Shadow: home for RCX</text>

  <rect x="65" y="295" width="370" height="30" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="80" y="315" fill="#58a6ff" font-size="11">RSP+0x08</text>
  <text x="200" y="315" fill="#8b949e" font-size="11">Shadow: home for RDX</text>

  <rect x="65" y="330" width="370" height="30" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="80" y="350" fill="#58a6ff" font-size="11">RSP+0x10</text>
  <text x="200" y="350" fill="#8b949e" font-size="11">Shadow: home for R8</text>

  <rect x="65" y="365" width="370" height="30" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="80" y="385" fill="#58a6ff" font-size="11">RSP+0x18</text>
  <text x="200" y="385" fill="#8b949e" font-size="11">Shadow: home for R9</text>

  <!-- Shadow space brace -->
  <text x="445" y="325" fill="#58a6ff" font-size="12" font-weight="bold">}</text>
  <text x="460" y="310" fill="#58a6ff" font-size="11">32-byte</text>
  <text x="460" y="325" fill="#58a6ff" font-size="11">shadow</text>
  <text x="460" y="340" fill="#58a6ff" font-size="11">space</text>

  <!-- 5th+ args -->
  <rect x="65" y="405" width="370" height="30" rx="4" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="80" y="425" fill="#f0883e" font-size="11">RSP+0x20</text>
  <text x="200" y="425" fill="#c9d1d9" font-size="11" font-weight="bold">5th argument</text>

  <rect x="65" y="440" width="370" height="30" rx="4" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="80" y="460" fill="#f0883e" font-size="11">RSP+0x28</text>
  <text x="200" y="460" fill="#c9d1d9" font-size="11" font-weight="bold">6th argument</text>

  <rect x="65" y="475" width="370" height="30" rx="4" fill="#161b22" stroke="#f0883e" stroke-width="1"/>
  <text x="80" y="495" fill="#f0883e" font-size="11">RSP+0x30</text>
  <text x="200" y="495" fill="#8b949e" font-size="11">7th argument ...</text>

  <rect x="65" y="510" width="370" height="25" rx="4" fill="#161b22" stroke="#8b949e" stroke-width="1"/>
  <text x="200" y="528" fill="#8b949e" font-size="10">Return address (pushed by CALL)</text>

  <!-- DFR example box -->
  <rect x="530" y="245" width="440" height="300" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="550" y="272" fill="#3fb950" font-size="14" font-weight="bold">DFR Example in BOF</text>

  <text x="550" y="300" fill="#8b949e" font-size="11">// Declare VirtualAllocEx via DFR:</text>
  <text x="550" y="320" fill="#f0883e" font-size="12">DECLSPEC_IMPORT</text>
  <text x="550" y="340" fill="#c9d1d9" font-size="12">LPVOID WINAPI KERNEL32$VirtualAllocEx(</text>
  <text x="570" y="360" fill="#58a6ff" font-size="12">HANDLE hProcess,    // RCX</text>
  <text x="570" y="380" fill="#3fb950" font-size="12">LPVOID lpAddress,   // RDX</text>
  <text x="570" y="400" fill="#f0883e" font-size="12">SIZE_T dwSize,      // R8</text>
  <text x="570" y="420" fill="#f85149" font-size="12">DWORD  flAllocType, // R9</text>
  <text x="570" y="440" fill="#ff7b72" font-size="12">DWORD  flProtect    // Stack [RSP+0x20]</text>
  <text x="550" y="460" fill="#c9d1d9" font-size="12">);</text>

  <text x="550" y="495" fill="#8b949e" font-size="11">// Compiler routes the call through the</text>
  <text x="550" y="515" fill="#8b949e" font-size="11">// Beacon's IAT to resolve KERNEL32.DLL</text>
  <text x="550" y="535" fill="#7ee787" font-size="11">// No static import → invisible to scanners</text>

  <!-- Footer note -->
  <text x="500" y="570" text-anchor="middle" fill="#8b949e" font-size="11">BOFs use this convention for all Win32 API calls via Dynamic Function Resolution (DFR)</text>
</svg>
