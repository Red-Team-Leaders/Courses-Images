<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="ar-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Dynamic Function Resolution (DFR)</text>

  <!-- Phase 1: Source Code -->
  <text x="170" y="62" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="bold">PHASE 1: SOURCE CODE</text>
  <rect x="40" y="72" width="350" height="100" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="60" y="94" fill="#58a6ff" font-size="12" font-weight="bold">DFR Macro Declaration</text>
  <line x1="50" y1="102" x2="380" y2="102" stroke="#8b949e" stroke-width="0.5"/>
  <text x="55" y="122" fill="#f0883e" font-size="12">DFR(KERNEL32, CreateProcessW)</text>
  <text x="55" y="142" fill="#8b949e" font-size="10">Expands to:</text>
  <text x="55" y="160" fill="#c9d1d9" font-size="10">__declspec(dllimport) BOOL WINAPI KERNEL32$CreateProcessW(...);</text>

  <!-- Arrow phase 1 → phase 2 -->
  <line x1="390" y1="122" x2="428" y2="122" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Phase 2: Compiled COFF -->
  <text x="680" y="62" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="bold">PHASE 2: COMPILED COFF</text>
  <rect x="430" y="72" width="350" height="100" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="450" y="94" fill="#f0883e" font-size="12" font-weight="bold">Symbol Table Entry</text>
  <line x1="440" y1="102" x2="770" y2="102" stroke="#8b949e" stroke-width="0.5"/>
  <text x="445" y="122" fill="#c9d1d9" font-size="11">Name: __imp_KERNEL32$CreateProcessW</text>
  <text x="445" y="140" fill="#f85149" font-size="11">Section: UNDEF  (external, unresolved)</text>
  <text x="445" y="158" fill="#8b949e" font-size="10">StorageClass: IMAGE_SYM_CLASS_EXTERNAL</text>

  <!-- Relocation entry detail -->
  <rect x="800" y="72" width="175" height="100" rx="6" fill="#161b22" stroke="#c9d1d9" stroke-width="1"/>
  <text x="820" y="94" fill="#c9d1d9" font-size="11" font-weight="bold">Relocation</text>
  <line x1="810" y1="102" x2="965" y2="102" stroke="#8b949e" stroke-width="0.5"/>
  <text x="810" y="120" fill="#c9d1d9" font-size="10">Offset: 0x001A</text>
  <text x="810" y="136" fill="#c9d1d9" font-size="10">Symbol: (above)</text>
  <text x="810" y="152" fill="#c9d1d9" font-size="10">Type: REL32</text>
  <text x="810" y="165" fill="#8b949e" font-size="9">Call site in .text</text>

  <!-- Big arrow down to phase 3 -->
  <line x1="500" y1="172" x2="500" y2="208" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="510" y="196" fill="#f0883e" font-size="10">Beacon loads COFF</text>

  <!-- Phase 3: Beacon Resolution -->
  <text x="500" y="225" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">PHASE 3: BEACON RUNTIME RESOLUTION</text>

  <!-- Step 1: Parse symbol -->
  <rect x="40" y="240" width="270" height="90" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="175" y="260" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Step 1: Parse Symbol Name</text>
  <line x1="50" y1="268" x2="300" y2="268" stroke="#8b949e" stroke-width="0.5"/>
  <text x="55" y="288" fill="#c9d1d9" font-size="11">"KERNEL32$CreateProcessW"</text>
  <text x="55" y="308" fill="#f0883e" font-size="11">Split on '$' delimiter</text>
  <text x="55" y="323" fill="#8b949e" font-size="10">lib = "KERNEL32"  fn = "CreateProcessW"</text>

  <line x1="310" y1="285" x2="358" y2="285" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Step 2: LoadLibrary -->
  <rect x="360" y="240" width="270" height="90" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="495" y="260" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">Step 2: LoadLibrary</text>
  <line x1="370" y1="268" x2="620" y2="268" stroke="#8b949e" stroke-width="0.5"/>
  <text x="375" y="288" fill="#c9d1d9" font-size="11">hMod = LoadLibraryA("KERNEL32")</text>
  <text x="375" y="308" fill="#8b949e" font-size="10">Gets module handle for DLL</text>
  <text x="375" y="323" fill="#8b949e" font-size="10">(Already loaded — returns existing)</text>

  <line x1="630" y1="285" x2="678" y2="285" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Step 3: GetProcAddress -->
  <rect x="680" y="240" width="290" height="90" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="825" y="260" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Step 3: GetProcAddress</text>
  <line x1="690" y1="268" x2="960" y2="268" stroke="#8b949e" stroke-width="0.5"/>
  <text x="695" y="288" fill="#c9d1d9" font-size="11">addr = GetProcAddress(hMod,</text>
  <text x="720" y="304" fill="#c9d1d9" font-size="11">"CreateProcessW")</text>
  <text x="695" y="323" fill="#3fb950" font-size="10">Returns: 0x00007FFB1A2E4560</text>

  <!-- Arrow down to step 4 -->
  <line x1="500" y1="330" x2="500" y2="360" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Step 4: Patch Relocation -->
  <rect x="200" y="365" width="600" height="75" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="500" y="388" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">Step 4: Patch Relocation</text>
  <line x1="210" y1="396" x2="790" y2="396" stroke="#8b949e" stroke-width="0.5"/>
  <text x="220" y="416" fill="#c9d1d9" font-size="11">.text + offset 0x001A:  <tspan fill="#f85149">00 00 00 00</tspan>  →  <tspan fill="#3fb950">60 45 2E 1A FB 7F 00 00</tspan></text>
  <text x="220" y="434" fill="#8b949e" font-size="10">Relocation entry patched with resolved address — call instruction now targets real API</text>

  <!-- Before/After visualization -->
  <rect x="40" y="460" width="450" height="85" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="60" y="482" fill="#f85149" font-size="12" font-weight="bold">Before Resolution (COFF raw)</text>
  <line x1="50" y1="490" x2="480" y2="490" stroke="#8b949e" stroke-width="0.5"/>
  <text x="55" y="510" fill="#c9d1d9" font-size="11">0x0018: E8 <tspan fill="#f85149">00 00 00 00</tspan>    ; call ???</text>
  <text x="55" y="530" fill="#8b949e" font-size="10">Placeholder — relocation pending</text>

  <line x1="490" y1="502" x2="528" y2="502" stroke="#3fb950" stroke-width="2" marker-end="url(#ar-green)"/>

  <rect x="530" y="460" width="440" height="85" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="550" y="482" fill="#3fb950" font-size="12" font-weight="bold">After Resolution (Patched)</text>
  <line x1="540" y1="490" x2="960" y2="490" stroke="#8b949e" stroke-width="0.5"/>
  <text x="545" y="510" fill="#c9d1d9" font-size="11">0x0018: FF 15 <tspan fill="#3fb950">60 45 2E 1A</tspan>  ; call [rip+0x1A2E4560]</text>
  <text x="545" y="530" fill="#3fb950" font-size="10">Resolved — calls kernel32!CreateProcessW</text>

  <!-- Footer -->
  <text x="500" y="570" text-anchor="middle" fill="#8b949e" font-size="10">CRTLP Module 09 — Lesson 39: How Beacon Resolves DFR Symbols at Runtime</text>
</svg>