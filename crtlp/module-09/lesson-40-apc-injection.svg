<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="arRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f85149"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">APC Queue Injection via BOF</text>

  <!-- Step 1: OpenProcess -->
  <rect x="30" y="65" width="150" height="55" rx="6" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="105" y="87" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">1. OpenProcess</text>
  <text x="105" y="103" text-anchor="middle" fill="#c9d1d9" font-size="9">Target PID handle</text>
  <line x1="180" y1="92" x2="218" y2="92" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 2: VirtualAllocEx RW -->
  <rect x="220" y="65" width="165" height="55" rx="6" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="302" y="87" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">2. VirtualAllocEx</text>
  <text x="302" y="103" text-anchor="middle" fill="#c9d1d9" font-size="9">PAGE_READWRITE</text>
  <line x1="385" y1="92" x2="418" y2="92" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 3: WriteProcessMemory -->
  <rect x="420" y="65" width="175" height="55" rx="6" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="507" y="87" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">3. WriteProcessMemory</text>
  <text x="507" y="103" text-anchor="middle" fill="#c9d1d9" font-size="9">Copy shellcode to alloc</text>
  <line x1="595" y1="92" x2="628" y2="92" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 4: VirtualProtectEx RX -->
  <rect x="630" y="65" width="165" height="55" rx="6" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <text x="712" y="87" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">4. VirtualProtectEx</text>
  <text x="712" y="103" text-anchor="middle" fill="#c9d1d9" font-size="9">RW → PAGE_EXECUTE_READ</text>

  <!-- Arrow down from step 4 -->
  <line x1="712" y1="120" x2="712" y2="165" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 5: OpenThread -->
  <rect x="630" y="167" width="165" height="55" rx="6" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="712" y="189" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">5. OpenThread</text>
  <text x="712" y="205" text-anchor="middle" fill="#c9d1d9" font-size="9">Alertable thread TID</text>

  <!-- Arrow left from step 5 -->
  <line x1="630" y1="194" x2="595" y2="194" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 6: QueueUserAPC -->
  <rect x="420" y="167" width="175" height="55" rx="6" fill="none" stroke="#f0883e" stroke-width="1.5"/>
  <text x="507" y="189" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">6. QueueUserAPC</text>
  <text x="507" y="205" text-anchor="middle" fill="#c9d1d9" font-size="9">pfnAPC = shellcode addr</text>

  <!-- Arrow left from step 6 -->
  <line x1="420" y1="194" x2="385" y2="194" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 7: Alertable Wait -->
  <rect x="220" y="167" width="165" height="55" rx="6" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <text x="302" y="189" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">7. Alertable State</text>
  <text x="302" y="205" text-anchor="middle" fill="#c9d1d9" font-size="9">SleepEx / WaitForSingle*</text>

  <!-- Arrow left from step 7 -->
  <line x1="220" y1="194" x2="185" y2="194" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 8: Execute -->
  <rect x="30" y="167" width="155" height="55" rx="6" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950" stroke-width="2"/>
  <text x="107" y="189" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">8. EXECUTE</text>
  <text x="107" y="205" text-anchor="middle" fill="#c9d1d9" font-size="9">Shellcode runs in target</text>

  <!-- Detection Points Section -->
  <rect x="30" y="260" width="940" height="30" rx="4" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-width="1"/>
  <text x="500" y="280" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">DETECTION POINTS</text>

  <!-- Detection 1 -->
  <rect x="30" y="305" width="220" height="90" rx="6" fill="#f85149" fill-opacity="0.08" stroke="#f85149" stroke-width="1"/>
  <text x="140" y="327" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">ETW: Cross-Process</text>
  <text x="140" y="345" text-anchor="middle" fill="#c9d1d9" font-size="9">OpenProcess with</text>
  <text x="140" y="359" text-anchor="middle" fill="#c9d1d9" font-size="9">PROCESS_ALL_ACCESS</text>
  <text x="140" y="377" text-anchor="middle" fill="#8b949e" font-size="9">Sysmon Event ID 10</text>

  <!-- Detection 2 -->
  <rect x="270" y="305" width="220" height="90" rx="6" fill="#f85149" fill-opacity="0.08" stroke="#f85149" stroke-width="1"/>
  <text x="380" y="327" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">Memory: RW→RX Flip</text>
  <text x="380" y="345" text-anchor="middle" fill="#c9d1d9" font-size="9">VirtualProtectEx changes</text>
  <text x="380" y="359" text-anchor="middle" fill="#c9d1d9" font-size="9">protection on remote mem</text>
  <text x="380" y="377" text-anchor="middle" fill="#8b949e" font-size="9">Kernel callback suspicious</text>

  <!-- Detection 3 -->
  <rect x="510" y="305" width="220" height="90" rx="6" fill="#f85149" fill-opacity="0.08" stroke="#f85149" stroke-width="1"/>
  <text x="620" y="327" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">API: QueueUserAPC</text>
  <text x="620" y="345" text-anchor="middle" fill="#c9d1d9" font-size="9">Hooking ntdll!NtQueueApcThread</text>
  <text x="620" y="359" text-anchor="middle" fill="#c9d1d9" font-size="9">Cross-process APC rare</text>
  <text x="620" y="377" text-anchor="middle" fill="#8b949e" font-size="9">EDR inline hook telemetry</text>

  <!-- Detection 4 -->
  <rect x="750" y="305" width="220" height="90" rx="6" fill="#f85149" fill-opacity="0.08" stroke="#f85149" stroke-width="1"/>
  <text x="860" y="327" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">Thread: Execution Origin</text>
  <text x="860" y="345" text-anchor="middle" fill="#c9d1d9" font-size="9">Shellcode runs from private</text>
  <text x="860" y="359" text-anchor="middle" fill="#c9d1d9" font-size="9">unbacked RX memory</text>
  <text x="860" y="377" text-anchor="middle" fill="#8b949e" font-size="9">Call-stack analysis</text>

  <!-- Dashed detection arrows -->
  <line x1="140" y1="305" x2="105" y2="125" stroke="#f85149" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arRed)"/>
  <line x1="380" y1="305" x2="712" y2="125" stroke="#f85149" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arRed)"/>
  <line x1="620" y1="305" x2="507" y2="225" stroke="#f85149" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arRed)"/>
  <line x1="860" y1="305" x2="107" y2="225" stroke="#f85149" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arRed)"/>

  <!-- BOF Context Box -->
  <rect x="30" y="420" width="940" height="140" rx="8" fill="#58a6ff" fill-opacity="0.05" stroke="#58a6ff" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="500" y="445" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">BOF Implementation Notes</text>
  <text x="50" y="470" fill="#c9d1d9" font-size="10">- BOF uses DFR (Dynamic Function Resolution): GetProcAddress at runtime to avoid IAT entries</text>
  <text x="50" y="490" fill="#c9d1d9" font-size="10">- Shellcode payload typically Beacon shellcode generated by Cobalt Strike</text>
  <text x="50" y="510" fill="#c9d1d9" font-size="10">- Target process should be long-lived and call alertable wait functions (e.g., explorer.exe, svchost.exe)</text>
  <text x="50" y="530" fill="#c9d1d9" font-size="10">- Early Bird variant: inject into suspended process before main thread becomes alertable naturally</text>
  <text x="50" y="550" fill="#8b949e" font-size="10">- OPSEC: Use NtQueueApcThread (direct syscall) instead of QueueUserAPC to bypass usermode hooks</text>
</svg>