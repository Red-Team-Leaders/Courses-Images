<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Process Injection Techniques Comparison</text>

  <!-- Table header -->
  <rect x="30" y="50" width="940" height="40" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="145" y="75" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Technique</text>
  <line x1="260" y1="52" x2="260" y2="88" stroke="#8b949e" stroke-width="1"/>
  <text x="335" y="75" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">New Thread?</text>
  <line x1="410" y1="52" x2="410" y2="88" stroke="#8b949e" stroke-width="1"/>
  <text x="490" y="75" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">New Process?</text>
  <line x1="570" y1="52" x2="570" y2="88" stroke="#8b949e" stroke-width="1"/>
  <text x="640" y="75" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Disk Touch?</text>
  <line x1="710" y1="52" x2="710" y2="88" stroke="#8b949e" stroke-width="1"/>
  <text x="790" y="75" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Stealth</text>
  <line x1="860" y1="52" x2="860" y2="88" stroke="#8b949e" stroke-width="1"/>
  <text x="920" y="75" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Detect</text>

  <!-- Row 1: Remote Thread -->
  <rect x="30" y="95" width="940" height="65" rx="4" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
  <text x="50" y="120" fill="#f0883e" font-size="13" font-weight="bold">Remote Thread</text>
  <text x="50" y="140" fill="#8b949e" font-size="10">CreateRemoteThread</text>
  <text x="335" y="125" text-anchor="middle" fill="#f85149" font-size="18">YES</text>
  <text x="490" y="125" text-anchor="middle" fill="#3fb950" font-size="18">NO</text>
  <text x="640" y="125" text-anchor="middle" fill="#3fb950" font-size="18">NO</text>
  <text x="780" y="125" fill="#f85149" font-size="12">★☆☆☆☆</text>
  <text x="910" y="125" text-anchor="middle" fill="#3fb950" font-size="12">Easy</text>

  <!-- Row 2: Thread Hijack -->
  <rect x="30" y="165" width="940" height="65" rx="4" fill="#161b22" stroke="#8b949e" stroke-width="1"/>
  <text x="50" y="190" fill="#f0883e" font-size="13" font-weight="bold">Thread Hijack</text>
  <text x="50" y="210" fill="#8b949e" font-size="10">SuspendThread + SetContext</text>
  <text x="335" y="195" text-anchor="middle" fill="#3fb950" font-size="18">NO</text>
  <text x="490" y="195" text-anchor="middle" fill="#3fb950" font-size="18">NO</text>
  <text x="640" y="195" text-anchor="middle" fill="#3fb950" font-size="18">NO</text>
  <text x="780" y="195" fill="#f0883e" font-size="12">★★★☆☆</text>
  <text x="910" y="195" text-anchor="middle" fill="#f0883e" font-size="12">Medium</text>

  <!-- Row 3: APC Injection -->
  <rect x="30" y="235" width="940" height="65" rx="4" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
  <text x="50" y="260" fill="#f0883e" font-size="13" font-weight="bold">APC Injection</text>
  <text x="50" y="280" fill="#8b949e" font-size="10">QueueUserAPC</text>
  <text x="335" y="265" text-anchor="middle" fill="#3fb950" font-size="18">NO</text>
  <text x="490" y="265" text-anchor="middle" fill="#3fb950" font-size="18">NO</text>
  <text x="640" y="265" text-anchor="middle" fill="#3fb950" font-size="18">NO</text>
  <text x="780" y="265" fill="#3fb950" font-size="12">★★★★☆</text>
  <text x="910" y="265" text-anchor="middle" fill="#f85149" font-size="12">Hard</text>

  <!-- Row 4: Early Bird -->
  <rect x="30" y="305" width="940" height="65" rx="4" fill="#161b22" stroke="#8b949e" stroke-width="1"/>
  <text x="50" y="330" fill="#f0883e" font-size="13" font-weight="bold">Early Bird</text>
  <text x="50" y="350" fill="#8b949e" font-size="10">CreateProcess(SUSPENDED) + APC</text>
  <text x="335" y="335" text-anchor="middle" fill="#3fb950" font-size="18">NO</text>
  <text x="490" y="335" text-anchor="middle" fill="#f85149" font-size="18">YES</text>
  <text x="640" y="335" text-anchor="middle" fill="#3fb950" font-size="18">NO</text>
  <text x="780" y="335" fill="#3fb950" font-size="12">★★★★☆</text>
  <text x="910" y="335" text-anchor="middle" fill="#f85149" font-size="12">Hard</text>

  <!-- Row 5: Module Stomp -->
  <rect x="30" y="375" width="940" height="65" rx="4" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
  <text x="50" y="400" fill="#f0883e" font-size="13" font-weight="bold">Module Stomp</text>
  <text x="50" y="420" fill="#8b949e" font-size="10">LoadLibrary + overwrite .text</text>
  <text x="335" y="405" text-anchor="middle" fill="#3fb950" font-size="18">NO</text>
  <text x="490" y="405" text-anchor="middle" fill="#3fb950" font-size="18">NO</text>
  <text x="640" y="405" text-anchor="middle" fill="#f85149" font-size="18">YES*</text>
  <text x="910" y="405" text-anchor="middle" fill="#f85149" font-size="12">V.Hard</text>
  <text x="780" y="405" fill="#7ee787" font-size="12">★★★★★</text>

  <!-- Legend -->
  <rect x="30" y="455" width="940" height="110" rx="8" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
  <text x="50" y="480" fill="#58a6ff" font-size="13" font-weight="bold">Key Takeaways</text>

  <circle cx="60" cy="500" r="5" fill="#f85149"/>
  <text x="75" y="505" fill="#c9d1d9" font-size="11">Remote Thread: simplest but loudest — every EDR detects CreateRemoteThread cross-process</text>

  <circle cx="60" cy="520" r="5" fill="#3fb950"/>
  <text x="75" y="525" fill="#c9d1d9" font-size="11">APC + Early Bird: no new thread creation event — bypasses thread-creation-based detections</text>

  <circle cx="60" cy="540" r="5" fill="#7ee787"/>
  <text x="75" y="545" fill="#c9d1d9" font-size="11">Module Stomp: memory is image-backed (MEM_IMAGE) — defeats private-memory scanners</text>

  <text x="640" y="545" fill="#8b949e" font-size="10">* Disk touch = LoadLibrary of legitimate DLL, then overwrite in memory</text>
</svg>
