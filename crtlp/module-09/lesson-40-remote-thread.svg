<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="arG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Classic Remote Thread Injection via BOF</text>

  <!-- BOF Process -->
  <rect x="30" y="50" width="200" height="60" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="130" y="76" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">BOF (Beacon)</text>
  <text x="130" y="98" text-anchor="middle" fill="#8b949e" font-size="10">Injector process</text>

  <!-- Step 1 -->
  <line x1="230" y1="80" x2="310" y2="80" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="315" y="50" width="280" height="65" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="330" y="72" fill="#f85149" font-size="11" font-weight="bold">Step 1: OpenProcess</text>
  <text x="330" y="90" fill="#c9d1d9" font-size="10">KERNEL32$OpenProcess(</text>
  <text x="340" y="105" fill="#8b949e" font-size="10">PROCESS_ALL_ACCESS, FALSE, targetPID)</text>
  <circle cx="585" cy="75" r="8" fill="#f85149" fill-opacity="0.3" stroke="#f85149"/>
  <text x="585" y="79" text-anchor="middle" fill="#f85149" font-size="9">H</text>

  <!-- Step 2 -->
  <line x1="455" y1="115" x2="455" y2="145" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="315" y="150" width="280" height="65" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="330" y="172" fill="#f85149" font-size="11" font-weight="bold">Step 2: VirtualAllocEx (RW)</text>
  <text x="330" y="190" fill="#c9d1d9" font-size="10">KERNEL32$VirtualAllocEx(</text>
  <text x="340" y="205" fill="#8b949e" font-size="10">hProc, NULL, scLen, COMMIT|RESERVE, RW)</text>
  <circle cx="585" cy="175" r="8" fill="#f85149" fill-opacity="0.3" stroke="#f85149"/>
  <text x="585" y="179" text-anchor="middle" fill="#f85149" font-size="9">H</text>

  <!-- Step 3 -->
  <line x1="455" y1="215" x2="455" y2="245" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="315" y="250" width="280" height="65" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="330" y="272" fill="#f85149" font-size="11" font-weight="bold">Step 3: WriteProcessMemory</text>
  <text x="330" y="290" fill="#c9d1d9" font-size="10">KERNEL32$WriteProcessMemory(</text>
  <text x="340" y="305" fill="#8b949e" font-size="10">hProc, remoteAddr, shellcode, scLen, NULL)</text>
  <circle cx="585" cy="275" r="8" fill="#f85149" fill-opacity="0.3" stroke="#f85149"/>
  <text x="585" y="279" text-anchor="middle" fill="#f85149" font-size="9">H</text>

  <!-- Step 4 -->
  <line x1="455" y1="315" x2="455" y2="345" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="315" y="350" width="280" height="50" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="330" y="372" fill="#f0883e" font-size="11" font-weight="bold">Step 4: VirtualProtectEx (RX)</text>
  <text x="330" y="390" fill="#8b949e" font-size="10">Change RW → RX (no more RWX)</text>

  <!-- Step 5 -->
  <line x1="455" y1="400" x2="455" y2="425" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="315" y="430" width="280" height="50" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="330" y="452" fill="#f85149" font-size="11" font-weight="bold">Step 5: CreateRemoteThread</text>
  <text x="330" y="470" fill="#8b949e" font-size="10">lpStartAddress = remoteAddr</text>
  <circle cx="585" cy="452" r="8" fill="#f85149" fill-opacity="0.3" stroke="#f85149"/>
  <text x="585" y="456" text-anchor="middle" fill="#f85149" font-size="9">H</text>

  <!-- Step 6: Target -->
  <line x1="595" y1="455" x2="670" y2="455" stroke="#3fb950" stroke-width="2" marker-end="url(#arG)"/>
  <rect x="675" y="425" width="290" height="60" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="820" y="450" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">Step 6: Shellcode Executes</text>
  <text x="820" y="472" text-anchor="middle" fill="#8b949e" font-size="10">Inside target process memory space</text>

  <!-- Hook legend -->
  <rect x="650" y="50" width="320" height="195" rx="8" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
  <text x="670" y="75" fill="#f85149" font-size="13" font-weight="bold">EDR Hook Points</text>
  <circle cx="670" cy="100" r="8" fill="#f85149" fill-opacity="0.3" stroke="#f85149"/>
  <text x="670" y="104" text-anchor="middle" fill="#f85149" font-size="9">H</text>
  <text x="688" y="105" fill="#c9d1d9" font-size="11">= EDR userland hook (ntdll.dll)</text>

  <text x="670" y="135" fill="#3fb950" font-size="12" font-weight="bold">Syscall Alternatives:</text>
  <text x="670" y="155" fill="#7ee787" font-size="10">NtOpenProcess (SSN 0x26)</text>
  <text x="670" y="170" fill="#7ee787" font-size="10">NtAllocateVirtualMemory (SSN 0x18)</text>
  <text x="670" y="185" fill="#7ee787" font-size="10">NtWriteVirtualMemory (SSN 0x3A)</text>
  <text x="670" y="200" fill="#7ee787" font-size="10">NtProtectVirtualMemory (SSN 0x50)</text>
  <text x="670" y="215" fill="#7ee787" font-size="10">NtCreateThreadEx (SSN 0xC2)</text>
  <text x="670" y="235" fill="#8b949e" font-size="9">SSN values vary by Windows build</text>

  <!-- Target process box -->
  <rect x="675" y="280" width="290" height="110" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="820" y="305" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Target Process Memory</text>
  <rect x="695" y="315" width="110" height="25" rx="4" fill="#161b22" stroke="#8b949e" stroke-width="1"/>
  <text x="750" y="332" text-anchor="middle" fill="#8b949e" font-size="9">.text (code)</text>
  <rect x="695" y="345" width="110" height="25" rx="4" fill="#161b22" stroke="#8b949e" stroke-width="1"/>
  <text x="750" y="362" text-anchor="middle" fill="#8b949e" font-size="9">.data</text>
  <rect x="830" y="315" width="115" height="55" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="887" y="337" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">Shellcode</text>
  <text x="887" y="355" text-anchor="middle" fill="#7ee787" font-size="9">VirtualAllocEx</text>
  <text x="887" y="367" text-anchor="middle" fill="#8b949e" font-size="8">MEM_PRIVATE (RX)</text>

  <!-- Footer -->
  <text x="500" y="515" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">Detection: CreateRemoteThread + unbacked start address = high-confidence alert</text>
  <text x="500" y="535" text-anchor="middle" fill="#3fb950" font-size="11">Mitigation: Use indirect syscalls + APC injection to avoid thread creation events</text>
  <text x="500" y="555" text-anchor="middle" fill="#8b949e" font-size="10">Every red API above is hooked by CrowdStrike, Defender, SentinelOne, and Elastic</text>
</svg>
