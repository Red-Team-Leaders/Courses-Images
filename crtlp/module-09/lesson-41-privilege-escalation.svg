  <text x="895" y="292" text-anchor="middle" fill="#3fb950" font-size="9">Token</text>

  <text x="50" y="330" fill="#8b949e" font-size="9">BOF: token_steal_bof → OpenProcess(lsass_pid) + DuplicateTokenEx → CreateProcessWithTokenW("cmd.exe")</text>
  <text x="50" y="347" fill="#8b949e" font-size="9">Alternative: Inject into SYSTEM process directly (winlogon.exe PID 4) or duplicate from any SYSTEM service</text>

