  <text x="885" y="452" text-anchor="middle" fill="#3fb950" font-size="9">Pass-the-Hash</text>

  <text x="50" y="485" fill="#8b949e" font-size="9">BOF: backup_priv_bof → CreateFileA(FILE_FLAG_BACKUP_SEMANTICS) → read SAM/SYSTEM/SECURITY hives</text>

