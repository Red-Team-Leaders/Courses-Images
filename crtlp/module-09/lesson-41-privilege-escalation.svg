  <rect x="50" y="415" width="130" height="50" rx="5" fill="none" stroke="#3fb950" stroke-width="1.2"/>
  <text x="115" y="436" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">SeBackup</text>
  <text x="115" y="452" text-anchor="middle" fill="#c9d1d9" font-size="9">Enabled</text>
  <line x1="180" y1="440" x2="218" y2="440" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="220" y="415" width="165" height="50" rx="5" fill="none" stroke="#f0883e" stroke-width="1.2"/>
  <text x="302" y="436" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="bold">reg save HKLM\SAM</text>
