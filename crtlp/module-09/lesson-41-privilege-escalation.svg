  <text x="50" y="82" fill="#f0883e" font-size="13" font-weight="bold">Path 1: SeImpersonatePrivilege → SYSTEM</text>
  <text x="500" y="82" fill="#8b949e" font-size="10">(Service accounts: IIS AppPool, MSSQL, Network Service)</text>

  <!-- Flow boxes -->
  <rect x="50" y="95" width="155" height="50" rx="5" fill="none" stroke="#f0883e" stroke-width="1.2"/>
  <text x="127" y="116" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="bold">SeImpersonate</text>
  <text x="127" y="132" text-anchor="middle" fill="#c9d1d9" font-size="9">Token present</text>
