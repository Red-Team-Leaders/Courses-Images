  <text x="317" y="132" text-anchor="middle" fill="#c9d1d9" font-size="9">JuicyPotato / Sweet</text>
  <line x1="395" y1="120" x2="428" y2="120" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

