  <text x="510" y="132" text-anchor="middle" fill="#c9d1d9" font-size="9">DCOM/BITS → OXID</text>
  <line x1="590" y1="120" x2="623" y2="120" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="625" y="95" width="160" height="50" rx="5" fill="none" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="705" y="116" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="bold">ImpersonateClient</text>
  <text x="705" y="132" text-anchor="middle" fill="#c9d1d9" font-size="9">Steal SYSTEM token</text>
  <line x1="785" y1="120" x2="818" y2="120" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arGreen)"/>

  <rect x="820" y="95" width="130" height="50" rx="5" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950" stroke-width="2"/>
