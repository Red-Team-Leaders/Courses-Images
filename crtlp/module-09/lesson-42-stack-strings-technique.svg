<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#58a6ff" font-size="20" font-weight="bold">Stack Strings Technique</text>
  <text x="500" y="58" text-anchor="middle" fill="#8b949e" font-size="12">Avoiding Static String Detection in BOF Payloads</text>
  <line x1="100" y1="68" x2="900" y2="68" stroke="#30363d" stroke-width="1"/>

  <!-- LEFT: BAD - .rdata string literals -->
  <g transform="translate(30,90)">
    <rect x="0" y="0" width="440" height="440" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="220" y="28" text-anchor="middle" fill="#f85149" font-size="16" font-weight="bold">DETECTABLE: .rdata String Literals</text>
    <text x="220" y="48" text-anchor="middle" fill="#8b949e" font-size="11">Strings visible in static analysis</text>

    <!-- Code block -->
    <rect x="20" y="65" width="400" height="55" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="35" y="85" fill="#8b949e" font-size="11">// Literal string in source</text>
    <text x="35" y="103" fill="#f85149" font-size="13">char* s = "cmd.exe";</text>

    <!-- .rdata section visualization -->
    <text x="220" y="145" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="bold">.rdata Section (PE File)</text>

    <rect x="40" y="158" width="360" height="100" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="1"/>
    <text x="55" y="180" fill="#8b949e" font-size="11">Offset    Hex                        ASCII</text>
    <line x1="50" y1="186" x2="390" y2="186" stroke="#30363d"/>
    <text x="55" y="202" fill="#f85149" font-size="12">0x0000    63 6D 64 2E 65 78 65 00   cmd.exe.</text>
    <text x="55" y="220" fill="#f85149" font-size="12">0x0008    6E 74 64 6C 6C 2E 64 6C   ntdll.dl</text>
    <text x="55" y="238" fill="#f85149" font-size="12">0x0010    6C 00 00 00 00 00 00 00   l.......</text>

    <!-- Scanner icon -->
    <g transform="translate(130,275)">
      <rect x="0" y="0" width="180" height="50" rx="6" fill="#2d1418" stroke="#f85149"/>
      <text x="90" y="20" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">YARA / strings.exe</text>
      <text x="90" y="38" text-anchor="middle" fill="#f85149" font-size="11">MATCH FOUND: "cmd.exe"</text>
    </g>

    <!-- Scanning arrows -->
    <line x1="220" y1="258" x2="220" y2="275" stroke="#f85149" stroke-width="1.5" marker-end="url(#ar-red)"/>

    <!-- Detection indicators -->
    <g transform="translate(60,345)">
      <circle cx="8" cy="8" r="6" fill="#f85149"/>
      <text x="22" y="13" fill="#c9d1d9" font-size="11">Visible to strings utility</text>
    </g>
    <g transform="translate(60,370)">
      <circle cx="8" cy="8" r="6" fill="#f85149"/>
      <text x="22" y="13" fill="#c9d1d9" font-size="11">Matched by YARA rules</text>
    </g>
    <g transform="translate(60,395)">
      <circle cx="8" cy="8" r="6" fill="#f85149"/>
      <text x="22" y="13" fill="#c9d1d9" font-size="11">Static analysis reveals intent</text>
    </g>
    <g transform="translate(60,420)">
      <circle cx="8" cy="8" r="6" fill="#f85149"/>
      <text x="22" y="13" fill="#c9d1d9" font-size="11">AV signature matches</text>
    </g>
  </g>

  <!-- VS Arrow -->
  <g transform="translate(480,280)">
    <rect x="0" y="0" width="40" height="40" rx="20" fill="#f0883e"/>
    <text x="20" y="27" text-anchor="middle" fill="#0d1117" font-size="14" font-weight="bold">VS</text>
  </g>

  <!-- RIGHT: GOOD - Stack strings -->
  <g transform="translate(530,90)">
    <rect x="0" y="0" width="440" height="440" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="220" y="28" text-anchor="middle" fill="#3fb950" font-size="16" font-weight="bold">EVASIVE: Stack-Constructed Strings</text>
    <text x="220" y="48" text-anchor="middle" fill="#8b949e" font-size="11">Strings built at runtime on the stack</text>

    <!-- Code block -->
    <rect x="20" y="65" width="400" height="80" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="35" y="85" fill="#8b949e" font-size="11">// Stack string construction</text>
    <text x="35" y="103" fill="#3fb950" font-size="12">char s[8];</text>
    <text x="35" y="119" fill="#3fb950" font-size="12">s[0]='c'; s[1]='m'; s[2]='d'; s[3]='.';</text>
    <text x="35" y="135" fill="#3fb950" font-size="12">s[4]='e'; s[5]='x'; s[6]='e'; s[7]='\0';</text>

    <!-- Stack memory visualization -->
    <text x="220" y="172" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="bold">Stack Frame (Runtime Only)</text>

    <rect x="80" y="185" width="280" height="130" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
    <text x="95" y="207" fill="#8b949e" font-size="11">RSP+0x00</text>
    <rect x="180" y="194" width="35" height="22" rx="3" fill="#1a3a1a" stroke="#3fb950"/>
    <text x="197" y="210" text-anchor="middle" fill="#3fb950" font-size="12">c</text>
    <rect x="220" y="194" width="35" height="22" rx="3" fill="#1a3a1a" stroke="#3fb950"/>
    <text x="237" y="210" text-anchor="middle" fill="#3fb950" font-size="12">m</text>
    <rect x="260" y="194" width="35" height="22" rx="3" fill="#1a3a1a" stroke="#3fb950"/>
    <text x="277" y="210" text-anchor="middle" fill="#3fb950" font-size="12">d</text>
    <rect x="300" y="194" width="35" height="22" rx="3" fill="#1a3a1a" stroke="#3fb950"/>
    <text x="317" y="210" text-anchor="middle" fill="#3fb950" font-size="12">.</text>

    <text x="95" y="240" fill="#8b949e" font-size="11">RSP+0x04</text>
    <rect x="180" y="227" width="35" height="22" rx="3" fill="#1a3a1a" stroke="#3fb950"/>
    <text x="197" y="243" text-anchor="middle" fill="#3fb950" font-size="12">e</text>
    <rect x="220" y="227" width="35" height="22" rx="3" fill="#1a3a1a" stroke="#3fb950"/>
    <text x="237" y="243" text-anchor="middle" fill="#3fb950" font-size="12">x</text>
    <rect x="260" y="227" width="35" height="22" rx="3" fill="#1a3a1a" stroke="#3fb950"/>
    <text x="277" y="243" text-anchor="middle" fill="#3fb950" font-size="12">e</text>
    <rect x="300" y="227" width="35" height="22" rx="3" fill="#1a3a1a" stroke="#3fb950"/>
    <text x="317" y="243" text-anchor="middle" fill="#3fb950" font-size="12">\0</text>

    <!-- Assembly instructions -->
    <text x="95" y="275" fill="#8b949e" font-size="10">MOV BYTE [RSP+0], 0x63</text>
    <text x="95" y="290" fill="#8b949e" font-size="10">MOV BYTE [RSP+1], 0x6D</text>
    <text x="95" y="305" fill="#8b949e" font-size="10">MOV BYTE [RSP+2], 0x64  ...</text>

    <!-- Scanner result -->
    <g transform="translate(130,325)">
      <rect x="0" y="0" width="180" height="50" rx="6" fill="#0d2818" stroke="#3fb950"/>
      <text x="90" y="20" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">YARA / strings.exe</text>
      <text x="90" y="38" text-anchor="middle" fill="#3fb950" font-size="11">NO MATCHES FOUND</text>
    </g>

    <!-- Evasion indicators -->
    <g transform="translate(60,395)">
      <circle cx="8" cy="8" r="6" fill="#3fb950"/>
      <text x="22" y="13" fill="#c9d1d9" font-size="11">Not in .rdata section</text>
    </g>
    <g transform="translate(60,415)">
      <circle cx="8" cy="8" r="6" fill="#3fb950"/>
      <text x="22" y="13" fill="#c9d1d9" font-size="11">Exists only during execution</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="500" y="560" text-anchor="middle" fill="#8b949e" font-size="10">Lesson 42 -- Stack Strings: .rdata Literals vs Runtime Construction | CRTLP Red Team Certification</text>
</svg>