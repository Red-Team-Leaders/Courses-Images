<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="ar-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#58a6ff"/></marker>
    <marker id="ar-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="500" y="32" text-anchor="middle" fill="#58a6ff" font-size="17" font-weight="bold">Data Exfiltration via BOF</text>

  <!-- ==================== Pattern 1: BeaconOutput ==================== -->
  <text x="50" y="70" fill="#3fb950" font-size="13" font-weight="bold">Pattern 1: Inline Output (BeaconOutput)</text>

  <rect x="50" y="82" width="130" height="50" rx="5" fill="#1a2332" stroke="#3fb950" stroke-width="1.5"/>
  <text x="115" y="103" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">BOF Code</text>
  <text x="115" y="120" text-anchor="middle" fill="#8b949e" font-size="9">collect data</text>

  <line x1="180" y1="107" x2="218" y2="107" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ar-green)"/>

  <rect x="220" y="82" width="160" height="50" rx="5" fill="#1a2332" stroke="#3fb950" stroke-width="1.5"/>
  <text x="300" y="103" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">BeaconOutput</text>
  <text x="300" y="120" text-anchor="middle" fill="#8b949e" font-size="9">CALLBACK_OUTPUT</text>

  <line x1="380" y1="107" x2="418" y2="107" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ar-green)"/>

  <rect x="420" y="82" width="130" height="50" rx="5" fill="#1a2332" stroke="#3fb950" stroke-width="1.5"/>
  <text x="485" y="103" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">C2 Channel</text>
  <text x="485" y="120" text-anchor="middle" fill="#8b949e" font-size="9">inline in task</text>

  <!-- Limits box -->
  <rect x="600" y="78" width="370" height="58" rx="5" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="615" y="98" fill="#3fb950" font-size="10" font-weight="bold">Best for:</text>
  <text x="700" y="98" fill="#c9d1d9" font-size="10">Small text output (&lt; ~1MB)</text>
  <text x="615" y="114" fill="#3fb950" font-size="10" font-weight="bold">OPSEC:</text>
  <text x="700" y="114" fill="#c9d1d9" font-size="10">Low risk — normal beacon callback traffic</text>
  <text x="615" y="130" fill="#f85149" font-size="10" font-weight="bold">Limit:</text>
  <text x="700" y="130" fill="#c9d1d9" font-size="10">Large data blocks beacon, may fragment</text>

  <!-- ==================== Pattern 2: File Download ==================== -->
  <text x="50" y="175" fill="#58a6ff" font-size="13" font-weight="bold">Pattern 2: File Download API</text>

  <rect x="50" y="187" width="130" height="50" rx="5" fill="#1a2332" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="115" y="208" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">BOF Code</text>
  <text x="115" y="225" text-anchor="middle" fill="#8b949e" font-size="9">read file bytes</text>

  <line x1="180" y1="212" x2="218" y2="212" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ar-blue)"/>

  <rect x="220" y="187" width="180" height="50" rx="5" fill="#1a2332" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="310" y="203" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="bold">BeaconOutput</text>
  <text x="310" y="218" text-anchor="middle" fill="#8b949e" font-size="9">(CALLBACK_FILE |</text>
  <text x="310" y="232" text-anchor="middle" fill="#8b949e" font-size="9">CALLBACK_FILE_WRITE)</text>

  <line x1="400" y1="212" x2="438" y2="212" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ar-blue)"/>

  <rect x="440" y="187" width="110" height="50" rx="5" fill="#1a2332" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="495" y="208" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">Chunked</text>
  <text x="495" y="225" text-anchor="middle" fill="#8b949e" font-size="9">transfer</text>

  <!-- Limits box -->
  <rect x="600" y="183" width="370" height="58" rx="5" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="615" y="203" fill="#58a6ff" font-size="10" font-weight="bold">Best for:</text>
  <text x="700" y="203" fill="#c9d1d9" font-size="10">Binary files, large datasets (multi-MB)</text>
  <text x="615" y="219" fill="#58a6ff" font-size="10" font-weight="bold">OPSEC:</text>
  <text x="700" y="219" fill="#c9d1d9" font-size="10">Medium — file download logged by CS</text>
  <text x="615" y="235" fill="#f85149" font-size="10" font-weight="bold">Limit:</text>
  <text x="700" y="235" fill="#c9d1d9" font-size="10">Requires staging data in BOF memory</text>

  <!-- ==================== Pattern 3: Named Pipe Relay ==================== -->
  <text x="50" y="280" fill="#f0883e" font-size="13" font-weight="bold">Pattern 3: Named Pipe Relay</text>

  <!-- BOF writes to pipe -->
  <rect x="50" y="295" width="130" height="50" rx="5" fill="#1a2332" stroke="#f0883e" stroke-width="1.5"/>
  <text x="115" y="316" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">BOF Code</text>
  <text x="115" y="333" text-anchor="middle" fill="#8b949e" font-size="9">WriteFile(hPipe)</text>

  <line x1="180" y1="320" x2="218" y2="320" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Named Pipe -->
  <rect x="220" y="290" width="160" height="60" rx="5" fill="#1a2332" stroke="#f0883e" stroke-width="2"/>
  <text x="300" y="313" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">Named Pipe</text>
  <text x="300" y="330" text-anchor="middle" fill="#c9d1d9" font-size="9">\\.\pipe\exfil_data</text>
  <text x="300" y="345" text-anchor="middle" fill="#8b949e" font-size="9">IPC buffer</text>

  <line x1="380" y1="320" x2="418" y2="320" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Beacon reads pipe -->
  <rect x="420" y="295" width="130" height="50" rx="5" fill="#1a2332" stroke="#f0883e" stroke-width="1.5"/>
  <text x="485" y="316" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">Beacon</text>
  <text x="485" y="333" text-anchor="middle" fill="#8b949e" font-size="9">ReadFile(hPipe)</text>

  <line x1="550" y1="320" x2="588" y2="320" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Chunks to C2 -->
  <rect x="590" y="290" width="130" height="60" rx="5" fill="#1a2332" stroke="#f0883e" stroke-width="1.5"/>
  <text x="655" y="313" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">C2 Server</text>
  <text x="655" y="330" text-anchor="middle" fill="#8b949e" font-size="9">chunked upload</text>
  <text x="655" y="345" text-anchor="middle" fill="#8b949e" font-size="9">(64KB blocks)</text>

  <!-- Limits box -->
  <rect x="770" y="288" width="200" height="65" rx="5" fill="#0d1117" stroke="#f0883e" stroke-width="1"/>
  <text x="785" y="308" fill="#f0883e" font-size="10" font-weight="bold">Best for:</text>
  <text x="785" y="323" fill="#c9d1d9" font-size="10">Very large data, streaming</text>
  <text x="785" y="338" fill="#f0883e" font-size="10" font-weight="bold">OPSEC:</text>
  <text x="785" y="353" fill="#3fb950" font-size="10">Best — decoupled from BOF</text>

  <!-- ==================== Comparison Table ==================== -->
  <text x="500" y="395" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="bold">Exfiltration Pattern Comparison</text>

  <!-- Table header -->
  <rect x="50" y="410" width="900" height="30" rx="4" fill="#1a2332"/>
  <text x="170" y="430" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">Method</text>
  <text x="370" y="430" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">Max Size</text>
  <text x="530" y="430" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">OPSEC Level</text>
  <text x="700" y="430" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">Complexity</text>
  <text x="870" y="430" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">Use Case</text>

  <!-- Row 1 -->
  <rect x="50" y="445" width="900" height="30" rx="0" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
  <text x="170" y="464" text-anchor="middle" fill="#3fb950" font-size="10">BeaconOutput</text>
  <text x="370" y="464" text-anchor="middle" fill="#c9d1d9" font-size="10">~1 MB</text>
  <text x="530" y="464" text-anchor="middle" fill="#3fb950" font-size="10">Low Risk</text>
  <text x="700" y="464" text-anchor="middle" fill="#3fb950" font-size="10">Simple</text>
  <text x="870" y="464" text-anchor="middle" fill="#8b949e" font-size="10">Config, tokens, enum</text>

  <!-- Row 2 -->
  <rect x="50" y="478" width="900" height="30" rx="0" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
  <text x="170" y="497" text-anchor="middle" fill="#58a6ff" font-size="10">File Download</text>
  <text x="370" y="497" text-anchor="middle" fill="#c9d1d9" font-size="10">Hundreds of MB</text>
  <text x="530" y="497" text-anchor="middle" fill="#f0883e" font-size="10">Medium Risk</text>
  <text x="700" y="497" text-anchor="middle" fill="#f0883e" font-size="10">Moderate</text>
  <text x="870" y="497" text-anchor="middle" fill="#8b949e" font-size="10">SAM/NTDS, databases</text>

  <!-- Row 3 -->
  <rect x="50" y="511" width="900" height="30" rx="0" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
  <text x="170" y="530" text-anchor="middle" fill="#f0883e" font-size="10">Named Pipe</text>
  <text x="370" y="530" text-anchor="middle" fill="#c9d1d9" font-size="10">Unlimited (streamed)</text>
  <text x="530" y="530" text-anchor="middle" fill="#3fb950" font-size="10">Lowest Risk</text>
  <text x="700" y="530" text-anchor="middle" fill="#f85149" font-size="10">Complex</text>
  <text x="870" y="530" text-anchor="middle" fill="#8b949e" font-size="10">Large exfil, memory</text>

  <text x="500" y="565" text-anchor="middle" fill="#8b949e" font-size="10">Choose exfiltration method based on data size, OPSEC requirements, and operator complexity tolerance</text>
  <text x="980" y="575" text-anchor="end" fill="#30363d" font-size="9">CRTLP Module 9 — Lesson 43</text>
</svg>