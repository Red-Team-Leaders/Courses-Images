<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="ar-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
    <marker id="ar-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#58a6ff"/></marker>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#58a6ff" font-size="20" font-weight="bold">BOF Development and Testing Workflow</text>
  <text x="500" y="58" text-anchor="middle" fill="#8b949e" font-size="12">From Source Code to Multi-C2 Deployment</text>
  <line x1="80" y1="68" x2="920" y2="68" stroke="#30363d" stroke-width="1"/>

  <!-- Pipeline flow -->

  <!-- Step 1: Write C -->
  <g transform="translate(30,95)">
    <rect x="0" y="0" width="130" height="100" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="65" y="22" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">1. Write C</text>
    <line x1="10" y1="28" x2="120" y2="28" stroke="#30363d"/>
    <text x="65" y="46" text-anchor="middle" fill="#c9d1d9" font-size="10">bof_source.c</text>
    <text x="65" y="62" text-anchor="middle" fill="#8b949e" font-size="9">beacon.h APIs</text>
    <text x="65" y="78" text-anchor="middle" fill="#8b949e" font-size="9">DLL$Func imports</text>
    <!-- Tool -->
    <rect x="15" y="82" width="100" height="14" rx="3" fill="#1c2333"/>
    <text x="65" y="93" text-anchor="middle" fill="#58a6ff" font-size="8">VS Code / vim</text>
  </g>

  <!-- Arrow -->
  <line x1="165" y1="145" x2="195" y2="145" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Step 2: Compile -->
  <g transform="translate(200,95)">
    <rect x="0" y="0" width="130" height="100" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
    <text x="65" y="22" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">2. Compile</text>
    <line x1="10" y1="28" x2="120" y2="28" stroke="#30363d"/>
    <text x="65" y="46" text-anchor="middle" fill="#c9d1d9" font-size="10">MinGW x64</text>
    <text x="65" y="62" text-anchor="middle" fill="#8b949e" font-size="9">-c (object only)</text>
    <text x="65" y="78" text-anchor="middle" fill="#8b949e" font-size="9">output: .x64.o</text>
    <rect x="8" y="82" width="114" height="14" rx="3" fill="#1c2333"/>
    <text x="65" y="93" text-anchor="middle" fill="#f0883e" font-size="8">x86_64-w64-mingw32-gcc</text>
  </g>

  <!-- Arrow -->
  <line x1="335" y1="145" x2="365" y2="145" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Step 3: Test Standalone -->
  <g transform="translate(370,95)">
    <rect x="0" y="0" width="130" height="100" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="65" y="22" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">3. Standalone</text>
    <line x1="10" y1="28" x2="120" y2="28" stroke="#30363d"/>
    <text x="65" y="46" text-anchor="middle" fill="#c9d1d9" font-size="10">COFFLoader.exe</text>
    <text x="65" y="62" text-anchor="middle" fill="#8b949e" font-size="9">Quick validation</text>
    <text x="65" y="78" text-anchor="middle" fill="#8b949e" font-size="9">No C2 needed</text>
    <rect x="15" y="82" width="100" height="14" rx="3" fill="#1c2333"/>
    <text x="65" y="93" text-anchor="middle" fill="#3fb950" font-size="8">TrustedSec COFFLoader</text>
  </g>

  <!-- Arrow -->
  <line x1="505" y1="145" x2="535" y2="145" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Step 4: Debug -->
  <g transform="translate(540,95)">
    <rect x="0" y="0" width="130" height="100" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="65" y="22" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">4. Debug</text>
    <line x1="10" y1="28" x2="120" y2="28" stroke="#30363d"/>
    <text x="65" y="46" text-anchor="middle" fill="#c9d1d9" font-size="10">x64dbg / WinDbg</text>
    <text x="65" y="62" text-anchor="middle" fill="#8b949e" font-size="9">Set BP on go()</text>
    <text x="65" y="78" text-anchor="middle" fill="#8b949e" font-size="9">Step through code</text>
    <rect x="15" y="82" width="100" height="14" rx="3" fill="#1c2333"/>
    <text x="65" y="93" text-anchor="middle" fill="#f85149" font-size="8">x64dbg + symbols</text>
  </g>

  <!-- Feedback loop arrow from Debug back to Write -->
  <path d="M 605,200 L 605,230 Q 605,245 590,245 L 100,245 Q 85,245 85,230 L 85,200" fill="none" stroke="#f85149" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ar)"/>
  <text x="345" y="260" text-anchor="middle" fill="#f85149" font-size="10">Fix bugs, iterate</text>

  <!-- Divider line -->
  <line x1="50" y1="285" x2="950" y2="285" stroke="#30363d" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="500" y="300" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">C2 Integration Testing</text>

  <!-- Step 5: Test Cobalt Strike -->
  <g transform="translate(70,320)">
    <rect x="0" y="0" width="180" height="115" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="90" y="22" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">5. Cobalt Strike</text>
    <line x1="10" y1="28" x2="170" y2="28" stroke="#30363d"/>
    <text x="90" y="48" text-anchor="middle" fill="#c9d1d9" font-size="10">inline-execute bof.o</text>
    <text x="90" y="65" text-anchor="middle" fill="#8b949e" font-size="9">Verify Beacon API calls</text>
    <text x="90" y="80" text-anchor="middle" fill="#8b949e" font-size="9">Check output formatting</text>
    <text x="90" y="95" text-anchor="middle" fill="#8b949e" font-size="9">Test argument parsing</text>
    <rect x="25" y="99" width="130" height="14" rx="3" fill="#1c2333"/>
    <text x="90" y="110" text-anchor="middle" fill="#58a6ff" font-size="8">Aggressor: beacon_inline_execute</text>
  </g>

  <!-- Arrow -->
  <line x1="255" y1="378" x2="300" y2="378" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Step 6: Test Sliver -->
  <g transform="translate(305,320)">
    <rect x="0" y="0" width="180" height="115" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="90" y="22" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">6. Sliver</text>
    <line x1="10" y1="28" x2="170" y2="28" stroke="#30363d"/>
    <text x="90" y="48" text-anchor="middle" fill="#c9d1d9" font-size="10">bof_exec bof.o args</text>
    <text x="90" y="65" text-anchor="middle" fill="#8b949e" font-size="9">Verify go-coff compat</text>
    <text x="90" y="80" text-anchor="middle" fill="#8b949e" font-size="9">Test output redirection</text>
    <text x="90" y="95" text-anchor="middle" fill="#8b949e" font-size="9">Check extension loading</text>
    <rect x="25" y="99" width="130" height="14" rx="3" fill="#1c2333"/>
    <text x="90" y="110" text-anchor="middle" fill="#3fb950" font-size="8">sliver> extensions install</text>
  </g>

  <!-- Arrow -->
  <line x1="490" y1="378" x2="535" y2="378" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Step 7: Package -->
  <g transform="translate(540,320)">
    <rect x="0" y="0" width="180" height="115" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
    <text x="90" y="22" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">7. Package</text>
    <line x1="10" y1="28" x2="170" y2="28" stroke="#30363d"/>
    <text x="90" y="48" text-anchor="middle" fill="#c9d1d9" font-size="10">Create release bundle</text>
    <text x="90" y="65" text-anchor="middle" fill="#8b949e" font-size="9">x86 + x64 objects</text>
    <text x="90" y="80" text-anchor="middle" fill="#8b949e" font-size="9">Aggressor script</text>
    <text x="90" y="95" text-anchor="middle" fill="#8b949e" font-size="9">README + usage docs</text>
    <rect x="25" y="99" width="130" height="14" rx="3" fill="#1c2333"/>
    <text x="90" y="110" text-anchor="middle" fill="#f0883e" font-size="8">Makefile + zip/tar</text>
  </g>

  <!-- Final deploy arrow -->
  <line x1="725" y1="378" x2="770" y2="378" stroke="#3fb950" stroke-width="2" marker-end="url(#ar-green)"/>

  <!-- Deploy result -->
  <g transform="translate(775,330)">
    <rect x="0" y="0" width="190" height="100" rx="10" fill="#0d2818" stroke="#3fb950" stroke-width="2"/>
    <text x="95" y="22" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">READY</text>
    <line x1="10" y1="28" x2="180" y2="28" stroke="#3fb950" stroke-opacity="0.3"/>
    <text x="95" y="48" text-anchor="middle" fill="#c9d1d9" font-size="10">bof_name.x64.o</text>
    <text x="95" y="63" text-anchor="middle" fill="#c9d1d9" font-size="10">bof_name.x86.o</text>
    <text x="95" y="78" text-anchor="middle" fill="#c9d1d9" font-size="10">bof_name.cna</text>
    <text x="95" y="93" text-anchor="middle" fill="#c9d1d9" font-size="10">README.md</text>
  </g>

  <!-- Tool chain summary at bottom -->
  <g transform="translate(50,460)">
    <rect x="0" y="0" width="900" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="450" y="18" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="bold">Development Toolchain</text>
    <line x1="15" y1="25" x2="885" y2="25" stroke="#30363d"/>

    <rect x="15" y="33" width="110" height="25" rx="4" fill="#1c2333" stroke="#58a6ff" stroke-width="0.5"/>
    <text x="70" y="50" text-anchor="middle" fill="#58a6ff" font-size="9">Editor (VS Code)</text>

    <rect x="140" y="33" width="110" height="25" rx="4" fill="#1c2333" stroke="#f0883e" stroke-width="0.5"/>
    <text x="195" y="50" text-anchor="middle" fill="#f0883e" font-size="9">MinGW-w64</text>

    <rect x="265" y="33" width="110" height="25" rx="4" fill="#1c2333" stroke="#3fb950" stroke-width="0.5"/>
    <text x="320" y="50" text-anchor="middle" fill="#3fb950" font-size="9">COFFLoader</text>

    <rect x="390" y="33" width="110" height="25" rx="4" fill="#1c2333" stroke="#f85149" stroke-width="0.5"/>
    <text x="445" y="50" text-anchor="middle" fill="#f85149" font-size="9">x64dbg / WinDbg</text>

    <rect x="515" y="33" width="110" height="25" rx="4" fill="#1c2333" stroke="#c9d1d9" stroke-width="0.5"/>
    <text x="570" y="50" text-anchor="middle" fill="#c9d1d9" font-size="9">PE-bear / CFF</text>

    <rect x="640" y="33" width="110" height="25" rx="4" fill="#1c2333" stroke="#bc8cff" stroke-width="0.5"/>
    <text x="695" y="50" text-anchor="middle" fill="#bc8cff" font-size="9">Process Hacker</text>

    <rect x="765" y="33" width="120" height="25" rx="4" fill="#1c2333" stroke="#8b949e" stroke-width="0.5"/>
    <text x="825" y="50" text-anchor="middle" fill="#8b949e" font-size="9">Make / CMake</text>
  </g>

  <!-- Footer -->
  <text x="500" y="565" text-anchor="middle" fill="#8b949e" font-size="10">Lesson 44 -- BOF Development and Testing Workflow | CRTLP Red Team Certification</text>
</svg>