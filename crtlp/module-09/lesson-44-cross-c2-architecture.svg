<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f0883e"/></marker>
    <marker id="ar-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="580" fill="url(#bg)"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#58a6ff" font-size="20" font-weight="bold">Cross-C2 BOF Architecture</text>
  <text x="500" y="58" text-anchor="middle" fill="#8b949e" font-size="12">Write Once, Run on Any C2 Framework</text>
  <line x1="80" y1="68" x2="920" y2="68" stroke="#30363d" stroke-width="1"/>

  <!-- Top: Single Source -->
  <g transform="translate(350,85)">
    <rect x="0" y="0" width="300" height="65" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="150" y="24" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="bold">Single BOF Source</text>
    <text x="150" y="44" text-anchor="middle" fill="#c9d1d9" font-size="11">whoami_bof.c</text>
    <text x="150" y="58" text-anchor="middle" fill="#8b949e" font-size="10">Uses only abstraction layer APIs</text>
  </g>

  <!-- Arrow down to abstraction -->
  <line x1="500" y1="150" x2="500" y2="178" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="520" y="168" fill="#f0883e" font-size="10">#include</text>

  <!-- Abstraction Layer -->
  <g transform="translate(250,180)">
    <rect x="0" y="0" width="500" height="75" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="2.5" filter="url(#glow)"/>
    <text x="250" y="24" text-anchor="middle" fill="#f0883e" font-size="16" font-weight="bold">Abstraction Layer</text>
    <text x="250" y="44" text-anchor="middle" fill="#c9d1d9" font-size="12">beacon_compatibility.h</text>
    <text x="250" y="62" text-anchor="middle" fill="#8b949e" font-size="10">BeaconPrintf | BeaconOutput | BeaconDataParse | BeaconGetSpawnTo | ...</text>
  </g>

  <!-- Arrow down to COFF -->
  <line x1="500" y1="255" x2="500" y2="283" stroke="#f0883e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="540" y="273" fill="#8b949e" font-size="10">x86_64-w64-mingw32-gcc -c</text>

  <!-- COFF Object -->
  <g transform="translate(370,285)">
    <rect x="0" y="0" width="260" height="55" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="130" y="22" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">COFF Object File</text>
    <text x="130" y="42" text-anchor="middle" fill="#c9d1d9" font-size="11">whoami_bof.x64.o</text>
  </g>

  <!-- Fan-out arrows to C2 frameworks -->
  <line x1="400" y1="340" x2="110" y2="395" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="450" y1="340" x2="310" y2="395" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="500" y1="340" x2="500" y2="395" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="550" y1="340" x2="690" y2="395" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="600" y1="340" x2="890" y2="395" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="500" y="380" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">loads on</text>

  <!-- C2 Framework boxes -->
  <!-- Cobalt Strike -->
  <g transform="translate(30,398)">
    <rect x="0" y="0" width="160" height="90" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="28" rx="8" fill="#1a2940"/>
    <rect x="0" y="14" width="160" height="14" fill="#1a2940"/>
    <text x="80" y="20" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Cobalt Strike</text>
    <text x="80" y="48" text-anchor="middle" fill="#c9d1d9" font-size="10">Native BOF support</text>
    <text x="80" y="64" text-anchor="middle" fill="#8b949e" font-size="9">beacon> inline-execute</text>
    <text x="80" y="80" text-anchor="middle" fill="#3fb950" font-size="9">FULL COMPAT</text>
  </g>

  <!-- Sliver -->
  <g transform="translate(220,398)">
    <rect x="0" y="0" width="160" height="90" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="28" rx="8" fill="#0d2818"/>
    <rect x="0" y="14" width="160" height="14" fill="#0d2818"/>
    <text x="80" y="20" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Sliver</text>
    <text x="80" y="48" text-anchor="middle" fill="#c9d1d9" font-size="10">go-coff extension</text>
    <text x="80" y="64" text-anchor="middle" fill="#8b949e" font-size="9">sliver> bof_exec</text>
    <text x="80" y="80" text-anchor="middle" fill="#3fb950" font-size="9">FULL COMPAT</text>
  </g>

  <!-- Havoc -->
  <g transform="translate(420,398)">
    <rect x="0" y="0" width="160" height="90" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="28" rx="8" fill="#2d1a00"/>
    <rect x="0" y="14" width="160" height="14" fill="#2d1a00"/>
    <text x="80" y="20" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">Havoc</text>
    <text x="80" y="48" text-anchor="middle" fill="#c9d1d9" font-size="10">Built-in COFF loader</text>
    <text x="80" y="64" text-anchor="middle" fill="#8b949e" font-size="9">demon> dotask bof</text>
    <text x="80" y="80" text-anchor="middle" fill="#3fb950" font-size="9">FULL COMPAT</text>
  </g>

  <!-- Brute Ratel -->
  <g transform="translate(615,398)">
    <rect x="0" y="0" width="160" height="90" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="28" rx="8" fill="#2d1418"/>
    <rect x="0" y="14" width="160" height="14" fill="#2d1418"/>
    <text x="80" y="20" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">Brute Ratel</text>
    <text x="80" y="48" text-anchor="middle" fill="#c9d1d9" font-size="10">COFF loader (native)</text>
    <text x="80" y="64" text-anchor="middle" fill="#8b949e" font-size="9">badger> coffee</text>
    <text x="80" y="80" text-anchor="middle" fill="#f0883e" font-size="9">API SUBSET</text>
  </g>

  <!-- Mythic -->
  <g transform="translate(810,398)">
    <rect x="0" y="0" width="160" height="90" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="28" rx="8" fill="#1a1030"/>
    <rect x="0" y="14" width="160" height="14" fill="#1a1030"/>
    <text x="80" y="20" text-anchor="middle" fill="#bc8cff" font-size="12" font-weight="bold">Mythic</text>
    <text x="80" y="48" text-anchor="middle" fill="#c9d1d9" font-size="10">Agent-dependent</text>
    <text x="80" y="64" text-anchor="middle" fill="#8b949e" font-size="9">via agent extension</text>
    <text x="80" y="80" text-anchor="middle" fill="#f0883e" font-size="9">VARIES</text>
  </g>

  <!-- Bottom note -->
  <g transform="translate(100,510)">
    <rect x="0" y="0" width="800" height="35" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="400" y="14" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">Key Insight:</text>
    <text x="400" y="28" text-anchor="middle" fill="#c9d1d9" font-size="11">The abstraction layer normalizes Beacon API differences -- one BOF binary works across all compatible C2 frameworks</text>
  </g>

  <!-- Footer -->
  <text x="500" y="568" text-anchor="middle" fill="#8b949e" font-size="10">Lesson 44 -- Cross-C2 BOF Architecture | CRTLP Red Team Certification</text>
</svg>