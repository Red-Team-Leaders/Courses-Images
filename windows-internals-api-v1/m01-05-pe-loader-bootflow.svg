<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .title{font:700 24px "Segoe UI",sans-serif;fill:#e6edf3}
      .h2{font:600 15px "Segoe UI",sans-serif;fill:#e6edf3}
      .lbl{font:500 13px "Segoe UI",sans-serif;fill:#e6edf3}
      .code{font:12px Consolas,monospace;fill:#e6edf3}
      .cap{font:italic 12px "Segoe UI",sans-serif;fill:#8b949e}
      .step{fill:#1f3a5f;stroke:#58a6ff;stroke-width:1.5}
      .step2{fill:#1f3a2a;stroke:#7ee787;stroke-width:1.5}
      .step3{fill:#3a2f1f;stroke:#f0883e;stroke-width:1.5}
      .step4{fill:#3a1f1f;stroke:#ff7b72;stroke-width:1.5}
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e6edf3"/></marker>
  </defs>
  <rect width="1200" height="800" fill="#0d1117"/>
  <text class="title" x="600" y="38" text-anchor="middle">Windows boot — from power-on to logon</text>
  <text class="cap" x="600" y="60" text-anchor="middle">UEFI / BIOS → bootmgr → winload → ntoskrnl Phase 0/1 → smss → csrss/wininit → services → logonui</text>

  <!-- Boxes vertical timeline -->
  <g>
    <rect class="step3" x="60" y="90" width="280" height="80" rx="6"/>
    <text class="lbl" x="200" y="115" text-anchor="middle">1. Firmware (UEFI / BIOS legacy)</text>
    <text class="code" x="80" y="138">  POST + Secure Boot verifies</text>
    <text class="code" x="80" y="156">  bootmgr (BootGuard, TPM PCR0-7)</text>

    <rect class="step3" x="60" y="190" width="280" height="80" rx="6"/>
    <text class="lbl" x="200" y="215" text-anchor="middle">2. bootmgfw.efi / bootmgr</text>
    <text class="code" x="80" y="238">  reads BCD store, chooses OS,</text>
    <text class="code" x="80" y="256">  loads signed winload.efi.</text>

    <rect class="step" x="60" y="290" width="280" height="120" rx="6"/>
    <text class="lbl" x="200" y="315" text-anchor="middle">3. winload.efi</text>
    <text class="code" x="80" y="338">  loads ntoskrnl, hal,</text>
    <text class="code" x="80" y="356">  ci.dll, boot-start drivers,</text>
    <text class="code" x="80" y="374">  SYSTEM hive.</text>
    <text class="code" x="80" y="392">  ELAM driver loaded.</text>

    <rect class="step" x="60" y="430" width="280" height="120" rx="6"/>
    <text class="lbl" x="200" y="455" text-anchor="middle">4. ntoskrnl Phase 0 (KiSystemStartup)</text>
    <text class="code" x="80" y="478">  initializes minimal KE, OB, MM,</text>
    <text class="code" x="80" y="496">  KiInitializeKernel,</text>
    <text class="code" x="80" y="514">  no PnP or full I/O yet,</text>
    <text class="code" x="80" y="532">  ProcessTypeInitialization</text>
  </g>

  <g>
    <rect class="step" x="380" y="90" width="290" height="180" rx="6"/>
    <text class="lbl" x="525" y="115" text-anchor="middle">5. ntoskrnl Phase 1 (Phase1Initialization)</text>
    <text class="code" x="400" y="138">  initializes Executive subsystems:</text>
    <text class="code" x="400" y="156">  Object Mgr, MM, IO, Cache,</text>
    <text class="code" x="400" y="174">  Security Reference Monitoritor,</text>
    <text class="code" x="400" y="192">  Configuration Mgr (loads</text>
    <text class="code" x="400" y="210">  hives), PnP, Power.</text>
    <text class="code" x="400" y="232">  Creates System Process (PID 4),</text>
    <text class="code" x="400" y="250">  starts smss.exe (Session Mgr).</text>

    <rect class="step2" x="380" y="290" width="290" height="180" rx="6"/>
    <text class="lbl" x="525" y="315" text-anchor="middle">6. smss.exe (Session Manager)</text>
    <text class="code" x="400" y="338">  creates pagefiles, mornts hives</text>
    <text class="code" x="400" y="356">  remaining (SOFTWARE, SAM,</text>
    <text class="code" x="400" y="374">  SECURITY).</text>
    <text class="code" x="400" y="392">  creates session 0 (services) and</text>
    <text class="code" x="400" y="410">  interactive sessions.</text>
    <text class="code" x="400" y="428">  for each session: spawns</text>
    <text class="code" x="400" y="446">  csrss.exe + wininit.exe</text>
    <text class="code" x="400" y="464">  (session 0) or winlogon.exe.</text>

    <rect class="step2" x="380" y="490" width="290" height="100" rx="6"/>
    <text class="lbl" x="525" y="515" text-anchor="middle">7. wininit.exe (session 0)</text>
    <text class="code" x="400" y="538">  starts services.exe (SCM),</text>
    <text class="code" x="400" y="556">  lsass.exe, fontdrvhost.exe,</text>
    <text class="code" x="400" y="574">  remains parent of subsystems.</text>
  </g>

  <g>
    <rect class="step4" x="710" y="90" width="280" height="120" rx="6"/>
    <text class="lbl" x="850" y="115" text-anchor="middle">8. services.exe (SCM)</text>
    <text class="code" x="730" y="138">  loads auto-start services</text>
    <text class="code" x="730" y="156">  (svchost grorps).</text>
    <text class="code" x="730" y="174">  loads demand/auto drivers.</text>
    <text class="code" x="730" y="192">  trigger-start awaiting ETW.</text>

    <rect class="step4" x="710" y="230" width="280" height="120" rx="6"/>
    <text class="lbl" x="850" y="255" text-anchor="middle">9. winlogon.exe (session N)</text>
    <text class="code" x="730" y="278">  starts LogonUI.exe,</text>
    <text class="code" x="730" y="296">  loads Credential Providers,</text>
    <text class="code" x="730" y="314">  authenticates via lsass.</text>
    <text class="code" x="730" y="332">  spawns userinit.exe.</text>

    <rect class="step4" x="710" y="370" width="280" height="120" rx="6"/>
    <text class="lbl" x="850" y="395" text-anchor="middle">10. userinit / explorer.exe</text>
    <text class="code" x="730" y="418">  mornts mapped drives,</text>
    <text class="code" x="730" y="436">  policies, shell.</text>
    <text class="code" x="730" y="454">  starts explorer.exe (shell)</text>
    <text class="code" x="730" y="472">  and items in Run/RunOnce.</text>

    <rect class="step3" x="710" y="510" width="280" height="80" rx="6"/>
    <text class="lbl" x="850" y="535" text-anchor="middle">Sysmon / EDR sensors</text>
    <text class="code" x="730" y="558">  hook ELAM, kernel ETW,</text>
    <text class="code" x="730" y="576">  notify rortines (Ps/Cm/Ob).</text>
  </g>

  <!-- Side panel: secure boot chain -->
  <rect class="step3" x="1010" y="90" width="170" height="500" rx="6" opacity="0.95"/>
  <text class="lbl" x="1095" y="115" text-anchor="middle">Chain of trust</text>
  <text class="code" x="1020" y="140">  TPM PCR0–PCR7</text>
  <text class="code" x="1020" y="158">  ─</text>
  <text class="code" x="1020" y="178">  UEFI Secure Boot</text>
  <text class="code" x="1020" y="196">  ─</text>
  <text class="code" x="1020" y="216">  signed bootmgr</text>
  <text class="code" x="1020" y="234">  ─</text>
  <text class="code" x="1020" y="254">  signed winload</text>
  <text class="code" x="1020" y="272">  ─</text>
  <text class="code" x="1020" y="292">  signed ntoskrnl</text>
  <text class="code" x="1020" y="310">  ─</text>
  <text class="code" x="1020" y="330">  ELAM driver</text>
  <text class="code" x="1020" y="350">  ─</text>
  <text class="code" x="1020" y="370">  WHQL/EV drivers</text>
  <text class="code" x="1020" y="388">  ─</text>
  <text class="code" x="1020" y="408">  Measured Boot</text>
  <text class="code" x="1020" y="426">  TCG log → Atestation</text>
  <text class="code" x="1020" y="450">  ─</text>
  <text class="code" x="1020" y="470">  Code Integrity (ci.dll)</text>
  <text class="code" x="1020" y="490">  HVCI in VTL 1</text>
  <text class="code" x="1020" y="510">  ─</text>
  <text class="code" x="1020" y="530">  Custom Kernel Signers</text>

  <line x1="200" y1="170" x2="200" y2="190" stroke="#e6edf3" marker-end="url(#ar)"/>
  <line x1="200" y1="270" x2="200" y2="290" stroke="#e6edf3" marker-end="url(#ar)"/>
  <line x1="200" y1="410" x2="200" y2="430" stroke="#e6edf3" marker-end="url(#ar)"/>
  <line x1="340" y1="490" x2="380" y2="180" stroke="#e6edf3" marker-end="url(#ar)" stroke-dasharray="3,3"/>
  <line x1="525" y1="270" x2="525" y2="290" stroke="#e6edf3" marker-end="url(#ar)"/>
  <line x1="525" y1="470" x2="525" y2="490" stroke="#e6edf3" marker-end="url(#ar)"/>
  <line x1="670" y1="540" x2="710" y2="150" stroke="#e6edf3" marker-end="url(#ar)" stroke-dasharray="3,3"/>
  <line x1="670" y1="540" x2="710" y2="290" stroke="#e6edf3" marker-end="url(#ar)" stroke-dasharray="3,3"/>
  <line x1="850" y1="350" x2="850" y2="370" stroke="#e6edf3" marker-end="url(#ar)"/>

  <text class="cap" x="600" y="660" text-anchor="middle">PID 0 = Idle Process; PID 4 = System Process; smss has variable PID (~88).</text>
  <text class="cap" x="600" y="688" text-anchor="middle">Inspect: Sysinternals "BootRevSoc"; WinDbg !logontable; bcdedit /enum; Process Explorer (Tree View).</text>
  <text class="cap" x="600" y="716" text-anchor="middle">Sysmon Event ID 1 (ProcessCreate) starts logging after the driver loads, typically after services.exe.</text>
</svg>
