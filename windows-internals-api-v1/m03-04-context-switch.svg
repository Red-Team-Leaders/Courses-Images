<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
<defs><style>
.t{font:700 24px "Segoe UI",sans-serif;fill:#e6edf3}.h{font:600 14px "Segoe UI",sans-serif;fill:#e6edf3}
.c{font:12px Consolas,monospace;fill:#e6edf3}.cap{font:italic 12px "Segoe UI",sans-serif;fill:#8b949e}
.b{fill:#1f3a5f;stroke:#58a6ff;stroke-width:1.5}.k{fill:#3a1f1f;stroke:#ff7b72;stroke-width:1.5}
.s{fill:#1f3a2a;stroke:#7ee787;stroke-width:1.5}.kpcr{fill:#2a1f3a;stroke:#d2a8ff;stroke-width:1.5}
</style>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e6edf3"/></marker></defs>
<rect width="1200" height="700" fill="#0d1117"/>
<text class="t" x="600" y="38" text-anchor="middle">Context Switch — KiSwapContext (x64)</text>
<text class="cap" x="600" y="60" text-anchor="middle">Saves current thread state into KTHREAD/stack, switches CR3 if cross-process, restores next</text>

<rect class="b" x="40" y="90" width="540" height="260" rx="8"/>
<text class="h" x="310" y="115" text-anchor="middle">Thread A (Running)</text>
<text class="c" x="60" y="142">  CPU executes A's code</text>
<text class="c" x="60" y="162">  KPRCB.CurrentThread = A</text>
<text class="c" x="60" y="182">  GS = KPCR; FS depends</text>
<text class="c" x="60" y="210">  event triggers switch:</text>
<text class="c" x="60" y="228">    timer DPC (KiClockInterrupt)</text>
<text class="c" x="60" y="246">    KeWaitForSingleObject (block)</text>
<text class="c" x="60" y="264">    KiSetPriorityThread</text>
<text class="c" x="60" y="282">    KiSwapThread, KiQuantumEnd</text>
<text class="c" x="60" y="310">  Decision: pick highest priority</text>
<text class="c" x="60" y="328">  from local KPRCB.ReadyListHead.</text>

<rect class="k" x="620" y="90" width="540" height="260" rx="8"/>
<text class="h" x="890" y="115" text-anchor="middle">SwapContext (asm)</text>
<text class="c" x="640" y="142">  cli                       ; IF=0</text>
<text class="c" x="640" y="160">  push  rbx, rbp, r12-r15  ; nonvolatile</text>
<text class="c" x="640" y="178">  fxsave / xsave [savearea] ; FPU/SSE/AVX</text>
<text class="c" x="640" y="196">  mov   [A.KernelStack], rsp</text>
<text class="c" x="640" y="214">  mov   rsp, [B.KernelStack]</text>
<text class="c" x="640" y="232">  // if process switch:</text>
<text class="c" x="640" y="250">  mov   rax, [B.Process.DirectoryTableBase]</text>
<text class="c" x="640" y="268">  mov   cr3, rax            ; swaps PML4</text>
<text class="c" x="640" y="286">  fxrstor [B.savearea]</text>
<text class="c" x="640" y="304">  pop   r15-r12, rbp, rbx</text>
<text class="c" x="640" y="322">  sti                       ; IF=1</text>
<text class="c" x="640" y="340">  ret                       ; returns to B's caller</text>

<rect class="kpcr" x="40" y="370" width="1120" height="180" rx="8"/>
<text class="h" x="600" y="395" text-anchor="middle">KPCR / KPRCB — per-CPU structures (one per LP, in GS base)</text>
<text class="c" x="60" y="425">  GS:[0x000] = KPCR (Self, IDT, GDT, IRQL, ...)</text>
<text class="c" x="60" y="445">  GS:[0x180] = Prcb (KPRCB)</text>
<text class="c" x="60" y="465">    +CurrentThread, NextThread, IdleThread</text>
<text class="c" x="60" y="485">    +ReadyListHead[32]   ← one queue per priority</text>
<text class="c" x="60" y="505">    +DpcQueue (pending DPCs)</text>
<text class="c" x="60" y="525">    +TimerEntries</text>
<text class="c" x="60" y="545">    +InterruptObject (vector → ISR)</text>
<text class="c" x="600" y="425">    +CycleTime / KernelTime / UserTime</text>
<text class="c" x="600" y="445">    +ProcessorState (TSS, GDT, IDT base)</text>
<text class="c" x="600" y="465">    +AffinityMask (LP id)</text>
<text class="c" x="600" y="485">    +IpiFrozen, BugCheckCornt</text>
<text class="c" x="600" y="525">  WinDbg: !pcr, !prcb, dt nt!_KPCR @$pcr</text>
<text class="c" x="600" y="545">  rdgsbase in user (Win10+) is forbidden (CPL=0).</text>

<rect class="s" x="40" y="570" width="1120" height="120" rx="8"/>
<text class="h" x="600" y="595" text-anchor="middle">Context switch costs</text>
<text class="c" x="60" y="620">  • save/restore non-volatile registers (~16 regs)</text>
<text class="c" x="60" y="640">  • save/restore XSTATE (up to ~2KB with AVX-512 + AMX)</text>
<text class="c" x="60" y="660">  • CR3 swap invalidates TLB (PCID mitigates, INVPCID sitctive)</text>
<text class="c" x="600" y="620">  • cache pollution (L1/L2/LLC)</text>
<text class="c" x="600" y="640">  • predictors (BTB) may be flushed (mitigations)</text>
<text class="c" x="600" y="660">  • typical: 1-5 µs on modern hardware; measured via PerfCornter</text>
</svg>
