<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
<defs><style>.t{font:700 24px "Segoe UI",sans-serif;fill:#e6edf3}.h{font:600 14px "Segoe UI",sans-serif;fill:#e6edf3}.c{font:12px Consolas,monospace;fill:#e6edf3}.cap{font:italic 12px "Segoe UI",sans-serif;fill:#8b949e}.act{fill:#1f3a2a;stroke:#7ee787;stroke-width:1.5}.std{fill:#1f3a5f;stroke:#58a6ff;stroke-width:1.5}.mod{fill:#3a2f1f;stroke:#f0883e;stroke-width:1.5}.free{fill:#3a1f1f;stroke:#ff7b72;stroke-width:1.5}.box{fill:#161b22;stroke:#30363d}</style><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e6edf3"/></marker></defs>
<rect width="1200" height="750" fill="#0d1117"/>
<text class="t" x="600" y="38" text-anchor="middle">PFN Database e Page State Lists</text>
<text class="cap" x="600" y="60" text-anchor="middle">Cada página física tem _MMPFN. Lists globais (Active, Standby, Modified, Free, Zeroed, Bad) controlam reuso.</text>

<rect class="box" x="40" y="90" width="540" height="280" rx="8"/>
<text class="h" x="310" y="115" text-anchor="middle">_MMPFN (entrada por PFN, ~30 bytes)</text>
<text class="c" x="60" y="142">  u1 (lista links via Flink/Blink)</text>
<text class="c" x="60" y="160">  u2 ShareCount, ReferenceCount</text>
<text class="c" x="60" y="178">  PteAddress : _MMPTE *  (PTE que aponta para esta página)</text>
<text class="c" x="60" y="196">  OriginalPte : _MMPTE  (cópia para restore)</text>
<text class="c" x="60" y="214">  u3 PageLocation (Active=6,Modified=5,Standby=4,Free=2,Zeroed=1,Bad=7)</text>
<text class="c" x="60" y="232">  u4 PrototypePte / Modified bit / WriteInProgress</text>
<text class="c" x="60" y="252">  Containing _PEB / WorkingSetIndex</text>
<text class="cap" x="60" y="290">  WinDbg: !pfn &lt;PFN&gt;</text>
<text class="cap" x="60" y="310">  Cada PFN ocupa ~30 bytes no DB; 64 GB RAM ≈ 16M pages = ~480 MB DB.</text>
<text class="cap" x="60" y="330">  Endereço base: nt!MmPfnDatabase  (em sysptes region).</text>

<rect class="act" x="620" y="90" width="540" height="50" rx="6"/><text class="c" x="890" y="120" text-anchor="middle">Active/Valid — em uma working set, PTE.Valid=1</text>
<rect class="std" x="620" y="150" width="540" height="50" rx="6"/><text class="c" x="890" y="180" text-anchor="middle">Standby — page frame "soft-livre", conteúdo intacto, second-chance cache</text>
<rect class="mod" x="620" y="210" width="540" height="50" rx="6"/><text class="c" x="890" y="240" text-anchor="middle">Modified — escrita pendente para pagefile/file (Lazy Writer)</text>
<rect class="mod" x="620" y="270" width="540" height="50" rx="6"/><text class="c" x="890" y="300" text-anchor="middle">ModifiedNoWrite — modificado, mas não persistente (sections AWE)</text>
<rect class="free" x="620" y="330" width="540" height="40" rx="6"/><text class="c" x="890" y="358" text-anchor="middle">Free — livre, conteúdo NÃO zerado</text>

<rect class="free" x="620" y="380" width="540" height="40" rx="6"/><text class="c" x="890" y="408" text-anchor="middle">Zeroed — livre + já zerado (entregue por demand-zero)</text>

<rect class="box" x="40" y="400" width="540" height="320" rx="8"/>
<text class="h" x="310" y="425" text-anchor="middle">Working Set por processo</text>
<text class="c" x="60" y="455">  EPROCESS.Vm.WorkingSetSize  (páginas atualmente residentes)</text>
<text class="c" x="60" y="475">  Working Set Manager (KeBalanceSetManager) ajusta dinamicamente:</text>
<text class="c" x="60" y="495">    aging (LRU aproximado via Accessed bit), trim, push para Standby.</text>
<text class="c" x="60" y="525">  APIs (user):</text>
<text class="c" x="60" y="545">    SetProcessWorkingSetSizeEx / GetProcessWorkingSetSizeEx</text>
<text class="c" x="60" y="563">    EmptyWorkingSet (libera todas)</text>
<text class="c" x="60" y="581">    QueryWorkingSet / QueryWorkingSetEx (psapi)</text>
<text class="c" x="60" y="599">    K32GetProcessMemoryInfo  (PROCESS_MEMORY_COUNTERS_EX)</text>
<text class="c" x="60" y="627">  Native:</text>
<text class="c" x="60" y="645">    NtQueryVirtualMemory(MemoryWorkingSetInformation)</text>
<text class="c" x="60" y="663">    NtSetInformationProcess(ProcessWorkingSetWatch)</text>
<text class="cap" x="60" y="700">  Diagnóstico WinDbg: !memusage, !vm 1, dt nt!_MMSUPPORT_FULL @$proc.Vm</text>

<line x1="620" y1="115" x2="600" y2="190" stroke="#e6edf3" marker-end="url(#ar)" stroke-dasharray="3,2"/>
<line x1="620" y1="175" x2="620" y2="295" stroke="#e6edf3" marker-end="url(#ar)" stroke-dasharray="3,2"/>
<line x1="620" y1="295" x2="620" y2="345" stroke="#e6edf3" marker-end="url(#ar)" stroke-dasharray="3,2"/>
<line x1="620" y1="355" x2="620" y2="395" stroke="#e6edf3" marker-end="url(#ar)" stroke-dasharray="3,2"/>
<line x1="1140" y1="395" x2="1140" y2="195" stroke="#7ee787" marker-end="url(#ar)" stroke-dasharray="3,2"/>

<text class="cap" x="600" y="745" text-anchor="middle">Standby é "first place to look" do MmAllocatePages (cache hit "soft" — page-fault resolvido sem I/O).</text>
</svg>
