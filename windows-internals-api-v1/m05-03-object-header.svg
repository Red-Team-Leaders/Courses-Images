<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
<defs><style>.t{font:700 24px "Segoe UI",sans-serif;fill:#e6edf3}.h{font:600 14px "Segoe UI",sans-serif;fill:#e6edf3}.c{font:12px Consolas,monospace;fill:#e6edf3}.cap{font:italic 12px "Segoe UI",sans-serif;fill:#8b949e}.opt{fill:#3a2f1f;stroke:#f0883e;stroke-width:1.5}.hdr{fill:#3a1f1f;stroke:#ff7b72;stroke-width:1.5}.body{fill:#1f3a2a;stroke:#7ee787;stroke-width:1.5}</style></defs>
<rect width="1200" height="800" fill="#0d1117"/>
<text class="t" x="600" y="38" text-anchor="middle">_OBJECT_HEADER + Optional Headers + Object Body</text>
<text class="cap" x="600" y="60" text-anchor="middle">Handle points to BODY; optionals come BEFORE the header (negative offsets)</text>

<rect class="opt" x="40" y="90" width="280" height="60" rx="6"/><text class="c" x="180" y="113" text-anchor="middle">_OBJECT_HEADER_PROCESS_INFO</text><text class="c" x="180" y="133" text-anchor="middle">se InfoMask &amp; 0x10</text>
<rect class="opt" x="40" y="160" width="280" height="60" rx="6"/><text class="c" x="180" y="183" text-anchor="middle">_OBJECT_HEADER_QUOTA_INFO</text><text class="c" x="180" y="203" text-anchor="middle">se InfoMask &amp; 0x08</text>
<rect class="opt" x="40" y="230" width="280" height="60" rx="6"/><text class="c" x="180" y="253" text-anchor="middle">_OBJECT_HEADER_HANDLE_INFO</text><text class="c" x="180" y="273" text-anchor="middle">se InfoMask &amp; 0x04</text>
<rect class="opt" x="40" y="300" width="280" height="60" rx="6"/><text class="c" x="180" y="323" text-anchor="middle">_OBJECT_HEADER_NAME_INFO</text><text class="c" x="180" y="343" text-anchor="middle">se InfoMask &amp; 0x02</text>
<rect class="opt" x="40" y="370" width="280" height="60" rx="6"/><text class="c" x="180" y="393" text-anchor="middle">_OBJECT_HEADER_CREATOR_INFO</text><text class="c" x="180" y="413" text-anchor="middle">se InfoMask &amp; 0x01</text>
<rect class="opt" x="40" y="440" width="280" height="40" rx="6"/><text class="c" x="180" y="467" text-anchor="middle">PaddingInfo (alignment)</text>

<rect class="hdr" x="40" y="490" width="280" height="200" rx="6"/>
<text class="h" x="180" y="515" text-anchor="middle">_OBJECT_HEADER (sem opt)</text>
<text class="c" x="60" y="540">  +0x00 PointerCornt</text>
<text class="c" x="60" y="558">  +0x08 HandleCornt</text>
<text class="c" x="60" y="576">  +0x10 Lock</text>
<text class="c" x="60" y="594">  +0x18 TypeIndex (xor cookie)</text>
<text class="c" x="60" y="612">  +0x19 TraceFlags</text>
<text class="c" x="60" y="630">  +0x1A InfoMask (bitmap)</text>
<text class="c" x="60" y="648">  +0x1B Flags</text>
<text class="c" x="60" y="666">  +0x20 ObjectCreateInfo / Name</text>
<text class="c" x="60" y="684">  +0x28 SecurityDescriptor</text>

<rect class="body" x="40" y="700" width="280" height="80" rx="6"/>
<text class="h" x="180" y="725" text-anchor="middle">Object Body  ← HANDLE aponta aqui</text>
<text class="c" x="180" y="748" text-anchor="middle">tipo específico</text>
<text class="c" x="180" y="768" text-anchor="middle">_FILE_OBJECT, _EPROCESS, _ETHREAD, …</text>

<rect fill="#161b22" stroke="#30363d" x="360" y="90" width="800" height="690" rx="8"/>
<text class="h" x="760" y="115" text-anchor="middle">Como navegar do handle ao corpo</text>
<text class="c" x="380" y="142">  PVOID body = ObReferenceObjectByHandle(h, ...);   // body = OBJECT</text>
<text class="c" x="380" y="160">  POBJECT_HEADER hdr = OBJECT_TO_OBJECT_HEADER(body);</text>
<text class="c" x="380" y="178">  // OBJECT_TO_OBJECT_HEADER = (POBJECT_HEADER)((PUCHAR)body - 0x30);</text>
<text class="c" x="380" y="200">  // (header está SEMPRE 0x30 antes do body em x64)</text>

<text class="h" x="760" y="240" text-anchor="middle">InfoMask — quais opt headers existem (varia por objeto)</text>
<text class="c" x="380" y="270">  bit 0  CreatorInfo (debugging)</text>
<text class="c" x="380" y="288">  bit 1  NameInfo  (objetos nameados — \BaseNamedObjects\…)</text>
<text class="c" x="380" y="306">  bit 2  HandleInfo</text>
<text class="c" x="380" y="324">  bit 3  QuotaInfo (cobrança de quota de pool)</text>
<text class="c" x="380" y="342">  bit 4  ProcessInfo (objects per-process)</text>
<text class="c" x="380" y="360">  bit 5  AuditInfo</text>
<text class="c" x="380" y="378">  bit 6  ExtendedInfo</text>
<text class="c" x="380" y="396">  bit 7  PaddingInfo</text>

<text class="h" x="760" y="430" text-anchor="middle">_OBJECT_TYPE — registersda via ObCreateObjectType</text>
<text class="c" x="380" y="460">  Name (UNICODE_STRING) — "Process","Thread","Event",…</text>
<text class="c" x="380" y="478">  TypeInfo (OBJECT_TYPE_INITIALIZER):</text>
<text class="c" x="380" y="496">    OpenProcedure, CloseProcedure, DitteProcedure,</text>
<text class="c" x="380" y="514">    ParseProcedure, SecurityProcedure, QueryNameProcedure,</text>
<text class="c" x="380" y="532">    OkayToCloseProcedure</text>
<text class="c" x="380" y="550">  TypeIndex: 1 byte; cookie:  byte = (TypeIndex ^ ObHeaderCookie ^ ((PUCHAR)hdr&gt;&gt;8))</text>
<text class="c" x="380" y="568">    →  protege contra type-confusion</text>

<text class="h" x="760" y="610" text-anchor="middle">Tipos common (ObTypeIndexTable)</text>
<text class="c" x="380" y="640">  Type, Directory, SymbolicLink, Token, Process, Thread, Job, Section,</text>
<text class="c" x="380" y="658">  File, Key, Mutant, Event, Semaphore, Timer, IoCompletion,</text>
<text class="c" x="380" y="676">  AlpcPort, Driver, Device, Adapter, Controller, WindowStation, Desktop,</text>
<text class="c" x="380" y="694">  EtwRegistration, EtwConsumer, WaitCompletionPacket, IRTimer.</text>
<text class="cap" x="380" y="730">  WinDbg: !object 0 ; !object \ObjectTypes ; dt nt!_OBJECT_TYPE</text>
<text class="cap" x="380" y="748">         dx Debugger.Utility.Collections.FromIndexableObject(@$cursession.Objects.Types)</text>
</svg>
