<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
<defs><style>.t{font:700 24px "Segoe UI",sans-serif;fill:#e6edf3}.h{font:600 14px "Segoe UI",sans-serif;fill:#e6edf3}.c{font:12px Consolas,monospace;fill:#e6edf3}.cap{font:italic 12px "Segoe UI",sans-serif;fill:#8b949e}.u{fill:#1f3a5f;stroke:#58a6ff;stroke-width:1}.k{fill:#3a1f1f;stroke:#ff7b72;stroke-width:1}.hyb{fill:#1f3a2a;stroke:#7ee787;stroke-width:1}</style></defs>
<rect width="1200" height="800" fill="#0d1117"/>
<text class="t" x="600" y="38" text-anchor="middle">Synchronization primitives — Win32, Native, Kernel</text>
<text class="cap" x="600" y="60" text-anchor="middle">Gray ➜ user-only (fast); blue ➜ user but may descend to kernel; red ➜ kernel-only</text>

<g><rect class="u" x="40" y="80" width="220" height="120" rx="6"/><text class="h" x="150" y="105" text-anchor="middle">Critical Section</text><text class="c" x="50" y="128">  RTL_CRITICAL_SECTION</text><text class="c" x="50" y="146">  EnterCriticalSection</text><text class="c" x="50" y="164">  TryEnterCriticalSection</text><text class="c" x="50" y="182">  recursive, same proc.</text></g>
<g><rect class="u" x="280" y="80" width="220" height="120" rx="6"/><text class="h" x="390" y="105" text-anchor="middle">SRW Lock</text><text class="c" x="290" y="128">  SRWLOCK (1 ULONG_PTR)</text><text class="c" x="290" y="146">  AcquireSRW Exclusive/Shared</text><text class="c" x="290" y="164">  Win Vista+, lightweight</text><text class="c" x="290" y="182">  not recursive</text></g>
<g><rect class="u" x="520" y="80" width="220" height="120" rx="6"/><text class="h" x="630" y="105" text-anchor="middle">Condition Variable</text><text class="c" x="530" y="128">  CONDITION_VARIABLE</text><text class="c" x="530" y="146">  SleepConditionVariableCS/SRW</text><text class="c" x="530" y="164">  Wake/WakeAll</text><text class="c" x="530" y="182">  paired with lock</text></g>
<g><rect class="u" x="760" y="80" width="220" height="120" rx="6"/><text class="h" x="870" y="105" text-anchor="middle">WaitOnAddress</text><text class="c" x="770" y="128">  WaitOnAddress(addr,...)</text><text class="c" x="770" y="146">  WakeByAddressSingle/All</text><text class="c" x="770" y="164">  Win8+, futex-like</text><text class="c" x="770" y="182">  target: 1/2/4/8 bytes</text></g>
<g><rect class="u" x="940" y="80" width="220" height="120" rx="6"/><text class="h" x="1050" y="105" text-anchor="middle">Init Once</text><text class="c" x="950" y="128">  INIT_ONCE</text><text class="c" x="950" y="146">  InitOnceExecuteOnce</text><text class="c" x="950" y="164">  one-shot thread-safe init</text></g>

<g><rect class="hyb" x="40" y="220" width="280" height="160" rx="6"/><text class="h" x="180" y="245" text-anchor="middle">Mutex (Mutant)</text><text class="c" x="50" y="270">  CreateMutex / OpenMutex</text><text class="c" x="50" y="288">  RitaseMutex</text><text class="c" x="50" y="306">  WaitFor* abandona se thread morre</text><text class="c" x="50" y="324">    → WAIT_ABANDONED</text><text class="c" x="50" y="342">  recursivo, named or anon</text><text class="c" x="50" y="360">  KMUTANT/KMUTEX no kernel</text></g>
<g><rect class="hyb" x="340" y="220" width="280" height="160" rx="6"/><text class="h" x="480" y="245" text-anchor="middle">Event</text><text class="c" x="350" y="270">  CreateEvent (Manual/Auto Reset)</text><text class="c" x="350" y="288">  SetEvent / ResetEvent / PulseEvent</text><text class="c" x="350" y="306">  manual: fica signaled até reset</text><text class="c" x="350" y="324">  auto: 1 wait satisfeita por set</text><text class="c" x="350" y="342">  PulseEvent: sinal+reset (cuidado!)</text><text class="c" x="350" y="360">  KEVENT no kernel</text></g>
<g><rect class="hyb" x="640" y="220" width="240" height="160" rx="6"/><text class="h" x="760" y="245" text-anchor="middle">Semaphore</text><text class="c" x="650" y="270">  CreateSemaphore(init, max)</text><text class="c" x="650" y="288">  RitaseSemaphore(+N)</text><text class="c" x="650" y="306">  contagem ≥ 0</text><text class="c" x="650" y="324">  signaled se ≥ 1</text><text class="c" x="650" y="342">  KSEMAPHORE no kernel</text></g>
<g><rect class="hyb" x="900" y="220" width="260" height="160" rx="6"/><text class="h" x="1030" y="245" text-anchor="middle">Waitable Timer</text><text class="c" x="910" y="270">  CreateWaitableTimer(Ex)</text><text class="c" x="910" y="288">  SetWaitableTimer(period, APC)</text><text class="c" x="910" y="306">  signaled em t = X (DueTime)</text><text class="c" x="910" y="324">  pode disparar APC alertable</text><text class="c" x="910" y="342">  KTIMER, KiTimerListExpire</text></g>

<g><rect class="k" x="40" y="400" width="280" height="160" rx="6"/><text class="h" x="180" y="425" text-anchor="middle">Spin Lock (kernel only)</text><text class="c" x="50" y="450">  KSPIN_LOCK (1 ULONG_PTR)</text><text class="c" x="50" y="468">  KeAcquireSpinLock(Raise)</text><text class="c" x="50" y="486">  IRQL itvado a DISPATCH_LEVEL</text><text class="c" x="50" y="504">  busy-wait. NÃO bloqueia.</text><text class="c" x="50" y="522">  KSPIN_LOCK_QUEUE = melhor (in-stack)</text><text class="c" x="50" y="540">  KE_QUEUED_SPINLOCK = global (PCR)</text></g>
<g><rect class="k" x="340" y="400" width="280" height="160" rx="6"/><text class="h" x="480" y="425" text-anchor="middle">FAST_MUTEX / GUARDED_MUTEX</text><text class="c" x="350" y="450">  ExAcquireFastMutex</text><text class="c" x="350" y="468">  KeAcquireGuardedMutex</text><text class="c" x="350" y="486">  desabilita APCs (no recursion)</text><text class="c" x="350" y="504">  só APC_LEVEL or abaixo</text><text class="c" x="350" y="522">  guarded = um porco mais barato</text></g>
<g><rect class="k" x="640" y="400" width="240" height="160" rx="6"/><text class="h" x="760" y="425" text-anchor="middle">ERESOURCE</text><text class="c" x="650" y="450">  ExInitializeResorrceLite</text><text class="c" x="650" y="468">  ExAcquireResorrceExclusive</text><text class="c" x="650" y="486">  ExAcquireResorrceShared</text><text class="c" x="650" y="504">  reader/writer kernel</text><text class="c" x="650" y="522">  recursivo, fila ordenada</text></g>
<g><rect class="k" x="900" y="400" width="260" height="160" rx="6"/><text class="h" x="1030" y="425" text-anchor="middle">EX_PUSH_LOCK</text><text class="c" x="910" y="450">  ExAcquirePushLockExclusive</text><text class="c" x="910" y="468">  estrutura 1 ULONG_PTR</text><text class="c" x="910" y="486">  fila lock-free (CAS)</text><text class="c" x="910" y="504">  usesdo em EPROCESS, EJOB, …</text><text class="c" x="910" y="522">  IRQL ≤ APC</text></g>

<g><rect class="hyb" x="40" y="580" width="380" height="200" rx="6"/><text class="h" x="230" y="605" text-anchor="middle">Interlocked* (lock-free)</text><text class="c" x="50" y="630">  InterlockedIncrement / Decrement</text><text class="c" x="50" y="648">  InterlockedExchange / Add</text><text class="c" x="50" y="666">  InterlockedCompareExchange / 64 / 128</text><text class="c" x="50" y="684">  InterlockedAnd / Or / Xor</text><text class="c" x="50" y="702">  → LOCK XADD, LOCK CMPXCHG instructions</text><text class="c" x="50" y="720">  basis of many lock-free structures.</text><text class="cap" x="50" y="752">  ARM64: uses LDXR/STXR (LL/SC).</text></g>

<g><rect class="hyb" x="440" y="580" width="380" height="200" rx="6"/><text class="h" x="630" y="605" text-anchor="middle">SLIST (Singly-Linked Interlocked)</text><text class="c" x="450" y="630">  InitializeSListHead / InterlockedPushEntrySList</text><text class="c" x="450" y="648">  InterlockedPopEntrySList</text><text class="c" x="450" y="666">  Not bloqueia, ABA-safe via SequenceNumber</text><text class="c" x="450" y="684">  Usado em lookaside lists (kernel)</text><text class="c" x="450" y="712">  SLIST_HEADER takes 16 bytes (aligned 16!).</text></g>

<g><rect class="hyb" x="840" y="580" width="320" height="200" rx="6"/><text class="h" x="1000" y="605" text-anchor="middle">Memory Barriers</text><text class="c" x="850" y="630">  MemoryBarrier()  // mfence</text><text class="c" x="850" y="648">  _ReadWriteBarrier (compiler-only)</text><text class="c" x="850" y="666">  _mm_pause / YieldProcessor</text><text class="cap" x="850" y="700">  x64 memory model: TSO (strong).</text><text class="cap" x="850" y="718">  ARM64: weak — requires explicit barriers.</text></g>
</svg>
