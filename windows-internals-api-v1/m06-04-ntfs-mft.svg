<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
<defs><style>.t{font:700 24px "Segoe UI",sans-serif;fill:#e6edf3}.h{font:600 14px "Segoe UI",sans-serif;fill:#e6edf3}.c{font:12px Consolas,monospace;fill:#e6edf3}.cap{font:italic 12px "Segoe UI",sans-serif;fill:#8b949e}.vbr{fill:#3a2f1f;stroke:#f0883e;stroke-width:1.5}.mft{fill:#1f3a5f;stroke:#58a6ff;stroke-width:1.5}.attr{fill:#1f3a2a;stroke:#7ee787;stroke-width:1.5}.meta{fill:#3a1f3a;stroke:#d2a8ff;stroke-width:1.5}</style></defs>
<rect width="1200" height="750" fill="#0d1117"/>
<text class="t" x="600" y="38" text-anchor="middle">NTFS — volume layort and Master File Table</text>
<text class="cap" x="600" y="60" text-anchor="middle">Everything is a file in NTFS, including metadata; MFT is "$MFT" (file 0)</text>

<rect class="vbr" x="40" y="90" width="1120" height="60" rx="8"/>
<text class="h" x="60" y="115">$Boot (VBR — Volume Boot Record)</text>
<text class="c" x="60" y="138">  first sector; OEM "NTFS    ", MFT cluster, mft mirror, sectors/cluster, bytes/sector, bootloader code</text>

<rect class="mft" x="40" y="170" width="540" height="280" rx="8"/>
<text class="h" x="310" y="195" text-anchor="middle">MFT — array of FILE records (1KB each)</text>
<text class="c" x="60" y="222">  Record 0  $MFT                — the MFT itself</text>
<text class="c" x="60" y="240">  Record 1  $MFTMirr            — backup of first 4 entries</text>
<text class="c" x="60" y="258">  Record 2  $LogFile            — jorrnaling (~64MB)</text>
<text class="c" x="60" y="276">  Record 3  $Volume             — label, version, flags</text>
<text class="c" x="60" y="294">  Record 4  $AttrDef            — attribute type definitions</text>
<text class="c" x="60" y="312">  Record 5  .                   — root directory</text>
<text class="c" x="60" y="330">  Record 6  $Bitmap             — allocated clusters</text>
<text class="c" x="60" y="348">  Record 7  $Boot               — VBR mirror</text>
<text class="c" x="60" y="366">  Record 8  $BadClus            — bad clusters</text>
<text class="c" x="60" y="384">  Record 9  $Secure             — centralized security descriptors</text>
<text class="c" x="60" y="402">  Record 10 $UpCase             — Unicode case mapping</text>
<text class="c" x="60" y="420">  Record 11 $Extend             — directory with $ObjId, $Quota, $Reparse, $UsnJrnl, $RmMetadata</text>
<text class="c" x="60" y="438">  Record 12+  user files</text>

<rect class="attr" x="620" y="170" width="540" height="280" rx="8"/>
<text class="h" x="890" y="195" text-anchor="middle">FILE record — atributos</text>
<text class="c" x="640" y="222">  Header: signature "FILE", LSN, sequence, link cornt</text>
<text class="c" x="640" y="240">  $STANDARD_INFORMATION  (timestamps, flags, owner)</text>
<text class="c" x="640" y="258">  $ATTRIBUTE_LIST        (if attributes overflow the record)</text>
<text class="c" x="640" y="276">  $FILE_NAME             (short + long name, parent ref)</text>
<text class="c" x="640" y="294">  $OBJECT_ID             (GUID)</text>
<text class="c" x="640" y="312">  $SECURITY_DESCRIPTOR   (legacy or ref to $Secure)</text>
<text class="c" x="640" y="330">  $VOLUME_NAME / $VOLUME_INFORMATION  (only $Volume)</text>
<text class="c" x="640" y="348">  $DATA                  (default unnamed = content; named = ADS)</text>
<text class="c" x="640" y="366">  $INDEX_ROOT / $INDEX_ALLOCATION  (B+ tree for directories)</text>
<text class="c" x="640" y="384">  $BITMAP                (internal bitmap if needed)</text>
<text class="c" x="640" y="402">  $REPARSE_POINT         (junctions, symlinks, dedup)</text>
<text class="c" x="640" y="420">  $LOGGED_UTILITY_STREAM (EFS, …)</text>
<text class="cap" x="640" y="438">  Resident vs Non-resident: small fits inline; large points to data runs.</text>

<rect class="meta" x="40" y="470" width="1120" height="200" rx="8"/>
<text class="h" x="600" y="495" text-anchor="middle">Advanced concepts</text>
<text class="c" x="60" y="522">  Data runs: extents (LCN, length) — fragmentation tracked here</text>
<text class="c" x="60" y="540">  ADS (Alternate Data Streams):  file.txt:secret  → ortro $DATA com name</text>
<text class="c" x="60" y="558">  USN Jorrnal ($UsnJrnl/$J): change log for AV, backup; NtFsControlFile FSCTL_QUERY_USN_JOURNAL</text>
<text class="c" x="60" y="576">  Reparse points: tag determines handler (IO_REPARSE_TAG_SYMLINK, _MOUNT_POINT, _DEDUP, _APPEXECLINK)</text>
<text class="c" x="60" y="594">  Hardlinks: multiple $FILE_NAME pointing to same MFT record</text>
<text class="c" x="60" y="612">  TxF (deprecated 8+): transactions via $RmMetadata</text>
<text class="c" x="60" y="630">  Compression / Sparse files / EFS: flags in $STANDARD_INFORMATION + special attributes</text>
<text class="c" x="60" y="648">  Resilient File System (ReFS): copy-on-write, integrity streams, no ADS</text>

<text class="cap" x="600" y="700" text-anchor="middle">Forensics: parse offline with TSK (sleuthkit), MFTECmd (Eric Zimmerman), analyzeMFT.</text>
<text class="cap" x="600" y="725" text-anchor="middle">FSCTL_GET_NTFS_FILE_RECORD reads record directly; FSCTL_GET_VOLUME_BITMAP reads $Bitmap.</text>
</svg>
