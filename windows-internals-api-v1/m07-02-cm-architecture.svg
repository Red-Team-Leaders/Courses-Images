<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
<defs><style>.t{font:700 24px "Segoe UI",sans-serif;fill:#e6edf3}.h{font:600 14px "Segoe UI",sans-serif;fill:#e6edf3}.c{font:12px Consolas,monospace;fill:#e6edf3}.cap{font:italic 12px "Segoe UI",sans-serif;fill:#8b949e}.cm{fill:#1f3a5f;stroke:#58a6ff;stroke-width:1.5}.hv{fill:#1f3a2a;stroke:#7ee787;stroke-width:1.5}.cell{fill:#3a2f1f;stroke:#f0883e;stroke-width:1.5}</style></defs>
<rect width="1200" height="700" fill="#0d1117"/>
<text class="t" x="600" y="38" text-anchor="middle">Configuration Manager (CM) — estruturas internas</text>

<rect class="cm" x="40" y="80" width="540" height="240" rx="8"/>
<text class="h" x="310" y="105" text-anchor="middle">_HHIVE</text>
<text class="c" x="60" y="130">  Signature 0xBEE0BEE0</text>
<text class="c" x="60" y="148">  GetCellRoutine, ReleaseCellRoutine</text>
<text class="c" x="60" y="166">  Allocate, Free, FileSetSize</text>
<text class="c" x="60" y="184">  HiveFlags, RefreshCount</text>
<text class="c" x="60" y="202">  StorageTypeCount</text>
<text class="c" x="60" y="220">  Storage[2] : _DUAL_BIN  (Stable + Volatile)</text>
<text class="c" x="60" y="238">    Length, Map (cell map directory)</text>
<text class="cap" x="60" y="270">  HivList linkada em CmpHiveListHead</text>
<text class="cap" x="60" y="288">  Cada entry tem CMHIVE wrapper.</text>

<rect class="hv" x="620" y="80" width="540" height="240" rx="8"/>
<text class="h" x="890" y="105" text-anchor="middle">_CMHIVE (wrapper, kernel-side)</text>
<text class="c" x="640" y="130">  Hive : HHIVE (embedded)</text>
<text class="c" x="640" y="148">  FileHandles[3] : Primary, External, Log</text>
<text class="c" x="640" y="166">  HiveList : LIST_ENTRY (linkada global)</text>
<text class="c" x="640" y="184">  HiveLock : EX_PUSH_LOCK</text>
<text class="c" x="640" y="202">  ViewLock : EX_PUSH_LOCK</text>
<text class="c" x="640" y="220">  FileObject (do hive backing file)</text>
<text class="c" x="640" y="238">  FileFullPath : UNICODE_STRING</text>
<text class="cap" x="640" y="270">  CmRegisterCallbackEx ataca aqui (CallbackList)</text>

<rect class="cell" x="40" y="340" width="540" height="320" rx="8"/>
<text class="h" x="310" y="365" text-anchor="middle">CM_KEY_NODE (cell tipo "nk")</text>
<text class="c" x="60" y="392">  Signature : USHORT  ('nk' = 0x6B6E)</text>
<text class="c" x="60" y="410">  Flags     : USHORT  (KEY_VOLATILE, KEY_HIVE_ENTRY,</text>
<text class="c" x="60" y="428">                       KEY_NO_DELETE, KEY_SYM_LINK, KEY_COMP_NAME)</text>
<text class="c" x="60" y="446">  LastWriteTime : LARGE_INTEGER</text>
<text class="c" x="60" y="464">  AccessBits : ULONG</text>
<text class="c" x="60" y="482">  Parent : HCELL_INDEX</text>
<text class="c" x="60" y="500">  SubKeyCounts[2]  / SubKeyLists[2]   (Stable, Volatile)</text>
<text class="c" x="60" y="518">  ValueList   : CHILD_LIST</text>
<text class="c" x="60" y="536">  Security    : HCELL_INDEX → CM_KEY_SECURITY (sk)</text>
<text class="c" x="60" y="554">  Class       : HCELL_INDEX (string opcional)</text>
<text class="c" x="60" y="572">  MaxNameLen / MaxClassLen / MaxValueNameLen / MaxValueDataLen</text>
<text class="c" x="60" y="590">  WorkVar     : ULONG</text>
<text class="c" x="60" y="608">  NameLength  : USHORT</text>
<text class="c" x="60" y="626">  Name[]      : CHAR/WCHAR (KEY_COMP_NAME = ASCII)</text>

<rect class="cell" x="620" y="340" width="540" height="320" rx="8"/>
<text class="h" x="890" y="365" text-anchor="middle">CM_KEY_VALUE (cell tipo "vk")</text>
<text class="c" x="640" y="392">  Signature : USHORT  ('vk' = 0x6B76)</text>
<text class="c" x="640" y="410">  NameLength : USHORT</text>
<text class="c" x="640" y="428">  DataLength : ULONG (top bit = "small data" inline)</text>
<text class="c" x="640" y="446">  Data       : HCELL_INDEX | inline</text>
<text class="c" x="640" y="464">  Type       : ULONG (REG_SZ, REG_DWORD, REG_BINARY, REG_QWORD,</text>
<text class="c" x="640" y="482">                      REG_MULTI_SZ, REG_EXPAND_SZ, REG_LINK,</text>
<text class="c" x="640" y="500">                      REG_RESOURCE_LIST, REG_FULL_RESOURCE_DESCRIPTOR)</text>
<text class="c" x="640" y="518">  Flags      : USHORT (VALUE_COMP_NAME)</text>
<text class="c" x="640" y="536">  Spare      : USHORT</text>
<text class="c" x="640" y="554">  Name[]     : CHAR/WCHAR</text>
<text class="cap" x="640" y="590">  CM_KEY_INDEX (lf, lh, ri, li): índices de subchaves</text>
<text class="cap" x="640" y="608">    lf usa hash + name; lh usa hash; ri é root index (≥ 16K subkeys)</text>
<text class="cap" x="640" y="630">  CM_KEY_SECURITY (sk): refs SecurityDescriptor compartilhado.</text>
<text class="cap" x="640" y="648">  CM_BIG_DATA (db): para valores ≥ 16344 bytes (segmentado).</text>
</svg>
