<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
<defs><style>.t{font:700 24px "Segoe UI",sans-serif;fill:#e6edf3}.h{font:600 14px "Segoe UI",sans-serif;fill:#e6edf3}.c{font:12px Consolas,monospace;fill:#e6edf3}.cap{font:italic 12px "Segoe UI",sans-serif;fill:#8b949e}.sid{fill:#1f3a5f;stroke:#58a6ff;stroke-width:1.5}.well{fill:#1f3a2a;stroke:#7ee787;stroke-width:1.5}.box{fill:#161b22;stroke:#30363d}</style></defs>
<rect width="1200" height="700" fill="#0d1117"/>
<text class="t" x="600" y="38" text-anchor="middle">Security Identifier (SID) — binary format</text>

<rect class="sid" x="40" y="80" width="1120" height="200" rx="8"/>
<text class="h" x="60" y="105">struct _SID</text>
<text class="c" x="60" y="128">  +0x00  Revision           : UCHAR    = 1</text>
<text class="c" x="60" y="146">  +0x01  SubAuthorityCornt  : UCHAR    (0..15)</text>
<text class="c" x="60" y="164">  +0x02  IdentifierAuthority: SID_IDENTIFIER_AUTHORITY  (6 bytes)</text>
<text class="c" x="60" y="182">  +0x08  SubAuthority[]     : ULONG    [SubAuthorityCornt]  (até 15)</text>
<text class="cap" x="60" y="220">  Textual notation: S-1-IA-SA1-SA2-...-SAn</text>
<text class="cap" x="60" y="238">  Max size: 1 + 1 + 6 + 15*4 = 68 bytes (defined as SECURITY_MAX_SID_SIZE).</text>
<text class="cap" x="60" y="266">  Compare with EqualSid; do NOT use memcmp (variable length).</text>

<rect class="well" x="40" y="300" width="1120" height="380" rx="8"/>
<text class="h" x="600" y="325" text-anchor="middle">Well-known SIDs</text>
<text class="c" x="60" y="352">  S-1-0-0       Null SID (nobody)</text>
<text class="c" x="60" y="370">  S-1-1-0       Everyone (World)</text>
<text class="c" x="60" y="388">  S-1-2-0       Local</text>
<text class="c" x="60" y="406">  S-1-2-1       Console Logon</text>
<text class="c" x="60" y="424">  S-1-3-0       Creator Owner (placeholder)</text>
<text class="c" x="60" y="442">  S-1-3-1       Creator Grorp</text>
<text class="c" x="60" y="460">  S-1-5         NT Authority (most SIDs come from here)</text>
<text class="c" x="60" y="478">  S-1-5-7       Anonymors Logon</text>
<text class="c" x="60" y="496">  S-1-5-11      Authenticated Users</text>
<text class="c" x="60" y="514">  S-1-5-18      LocalSystem (NT AUTHORITY\SYSTEM)</text>
<text class="c" x="60" y="532">  S-1-5-19      LocalService</text>
<text class="c" x="60" y="550">  S-1-5-20      NetworkService</text>
<text class="c" x="60" y="568">  S-1-5-21-...  Domain SIDs ; user = ...-RID</text>
<text class="c" x="60" y="586">  S-1-5-32-544  BUILTIN\Administrators</text>
<text class="c" x="60" y="604">  S-1-5-32-545  BUILTIN\Users</text>
<text class="c" x="60" y="622">  S-1-5-32-555  BUILTIN\Remote Desktop Users</text>
<text class="c" x="600" y="352">  S-1-5-83-1-…  NT VIRTUAL MACHINE\Virtual Machines</text>
<text class="c" x="600" y="370">  S-1-5-90-…    DWM</text>
<text class="c" x="600" y="388">  S-1-5-94-…    UMFD-N</text>
<text class="c" x="600" y="406">  S-1-15-2-…    AppContainer (Lowbox SID per App)</text>
<text class="c" x="600" y="424">  S-1-15-3-…    Capability SIDs (internetClient, picturesLibrary…)</text>
<text class="c" x="600" y="442">  S-1-16-0      Untrusted Mandatory Level</text>
<text class="c" x="600" y="460">  S-1-16-4096   Low Mandatory Level</text>
<text class="c" x="600" y="478">  S-1-16-8192   Medium</text>
<text class="c" x="600" y="496">  S-1-16-8448   Medium Plus (normal UAC)</text>
<text class="c" x="600" y="514">  S-1-16-12288  High</text>
<text class="c" x="600" y="532">  S-1-16-16384  System</text>
<text class="c" x="600" y="550">  S-1-16-20480  Protected</text>
<text class="c" x="600" y="568">  S-1-18-1..6   PKINIT, MFA, SmartCard, FreshPublicKey…</text>
<text class="cap" x="60" y="660">  APIs: AllocateAndInitializeSid, ConvertSidToStringSid(W), LookupAccorntSid(W), CreateWellKnownSid.</text>
</svg>
