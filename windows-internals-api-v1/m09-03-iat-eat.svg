<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
<defs><style>.t{font:700 24px "Segoe UI",sans-serif;fill:#e6edf3}.h{font:600 14px "Segoe UI",sans-serif;fill:#e6edf3}.c{font:12px Consolas,monospace;fill:#e6edf3}.cap{font:italic 12px "Segoe UI",sans-serif;fill:#8b949e}.imp{fill:#1f3a5f;stroke:#58a6ff;stroke-width:1.5}.exp{fill:#1f3a2a;stroke:#7ee787;stroke-width:1.5}.box{fill:#161b22;stroke:#30363d}</style></defs>
<rect width="1200" height="750" fill="#0d1117"/>
<text class="t" x="600" y="38" text-anchor="middle">Import Table (IAT/ILT) and Export Table (EAT)</text>

<rect class="imp" x="40" y="80" width="540" height="320" rx="8"/>
<text class="h" x="310" y="105" text-anchor="middle">IMPORT — DataDirectory[1]</text>
<text class="c" x="60" y="132">  Array of IMAGE_IMPORT_DESCRIPTOR (NULL-terminated):</text>
<text class="c" x="60" y="150">    OriginalFirstThunk → ILT (Import Lookup Table)</text>
<text class="c" x="60" y="168">    TimeDateStamp / ForwarderChain</text>
<text class="c" x="60" y="186">    Name → RVA "kernel32.dll"</text>
<text class="c" x="60" y="204">    FirstThunk → IAT (Import Address Table)</text>
<text class="c" x="60" y="232">  Each thunk = IMAGE_THUNK_DATA (8 bytes on x64):</text>
<text class="c" x="60" y="250">    bit 63 set → direct ordinal (low 16 bits)</text>
<text class="c" x="60" y="268">    else → RVA to IMAGE_IMPORT_BY_NAME { Hint, Name[] }</text>
<text class="c" x="60" y="296">  Loader resolves each IAT entry to final address.</text>
<text class="c" x="60" y="314">  After resolution, compiler-generated code does</text>
<text class="c" x="60" y="332">  call qword ptr [__imp_FunctionName]  → IAT[N]</text>
<text class="c" x="60" y="350">  and the jump goes directly to the function in the DLL.</text>
<text class="cap" x="60" y="382">  IAT is a classic hooking target — in-place slot patch.</text>

<rect class="imp" x="620" y="80" width="540" height="320" rx="8"/>
<text class="h" x="890" y="105" text-anchor="middle">DELAY-LOAD — DataDirectory[13]</text>
<text class="c" x="640" y="132">  IMAGE_DELAYLOAD_DESCRIPTOR:</text>
<text class="c" x="640" y="150">    DllNameRVA, ModuleHandleRVA, ImportAddressTableRVA,</text>
<text class="c" x="640" y="168">    ImportNameTableRVA, BorndImportAddressTableRVA,</text>
<text class="c" x="640" y="186">    UnloadInformationTableRVA, TimeDateStamp</text>
<text class="c" x="640" y="214">  Compiler emits __dityLoadHelper2 stub: on 1st call,</text>
<text class="c" x="640" y="232">  loads DLL via LoadLibrary, resolves, writes to dity IAT,</text>
<text class="c" x="640" y="250">  continues execution. Effective for rarely-used DLLs.</text>
<text class="cap" x="640" y="285">  Allows intercept via __pfnDliNotifyHook2 (linker /dity:NOBIND).</text>

<rect class="exp" x="40" y="420" width="1120" height="320" rx="8"/>
<text class="h" x="600" y="445" text-anchor="middle">EXPORT — DataDirectory[0]</text>
<text class="c" x="60" y="472">  IMAGE_EXPORT_DIRECTORY:</text>
<text class="c" x="60" y="490">    Characteristics, TimeDateStamp, MajorVersion, MinorVersion</text>
<text class="c" x="60" y="508">    Name (RVA of DLL name, e.g., "KERNEL32.dll")</text>
<text class="c" x="60" y="526">    Base (ordinal base, usually 1)</text>
<text class="c" x="60" y="544">    NumberOfFunctions  (size of AddressOfFunctions)</text>
<text class="c" x="60" y="562">    NumberOfNames      (size of AddressOfNames / NameOrdinals)</text>
<text class="c" x="60" y="580">    AddressOfFunctions  → array of RVAs (or string if forwarder)</text>
<text class="c" x="60" y="598">    AddressOfNames      → array of name RVAs (sorted alphabetically)</text>
<text class="c" x="60" y="616">    AddressOfNameOrdinals → array of USHORT, index into AddressOfFunctions</text>
<text class="c" x="60" y="644">  Resolution by name: GetProcAddress(h, "Foo")</text>
<text class="c" x="60" y="662">    binary search in AddressOfNames; fornd idx → ord = NameOrdinals[idx]</text>
<text class="c" x="60" y="680">    addr = h + AddressOfFunctions[ord - Base + ord]</text>
<text class="cap" x="60" y="710">  Forwarder: AddressOfFunctions[i] points inside EXPORT_TABLE → string "ntdll.NtFoo" → resolves recursively.</text>
<text class="cap" x="60" y="730">  EAT can be hooked to change the resolver for any future caller.</text>
</svg>
