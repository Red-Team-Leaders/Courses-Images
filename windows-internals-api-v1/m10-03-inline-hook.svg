<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
<defs><style>.t{font:700 24px "Segoe UI",sans-serif;fill:#e6edf3}.h{font:600 14px "Segoe UI",sans-serif;fill:#e6edf3}.c{font:12px Consolas,monospace;fill:#e6edf3}.cap{font:italic 12px "Segoe UI",sans-serif;fill:#8b949e}.org{fill:#1f3a5f;stroke:#58a6ff;stroke-width:1.5}.tr{fill:#1f3a2a;stroke:#7ee787;stroke-width:1.5}.hk{fill:#3a1f1f;stroke:#ff7b72;stroke-width:1.5}</style><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e6edf3"/></marker></defs>
<rect width="1200" height="700" fill="#0d1117"/>
<text class="t" x="600" y="38" text-anchor="middle">Inline Hook (Detorr) — prologue patch</text>

<rect class="org" x="40" y="80" width="380" height="280" rx="8"/>
<text class="h" x="230" y="105" text-anchor="middle">Original (before)</text>
<text class="c" x="60" y="132">  ntdll!NtCreateFile:</text>
<text class="c" x="60" y="150">    4C 8B D1   mov r10, rcx</text>
<text class="c" x="60" y="168">    B8 55 00.. mov eax, 55h</text>
<text class="c" x="60" y="186">    F6 04 25.. test byte [...],1</text>
<text class="c" x="60" y="204">    75 03      jne short alt</text>
<text class="c" x="60" y="222">    0F 05      syscall</text>
<text class="c" x="60" y="240">    C3         ret</text>
<text class="cap" x="60" y="288">  prefix (~16 bytes) is hot-patchable.</text>

<rect class="hk" x="440" y="80" width="380" height="280" rx="8"/>
<text class="h" x="630" y="105" text-anchor="middle">Hooked (after)</text>
<text class="c" x="460" y="132">  ntdll!NtCreateFile:</text>
<text class="c" x="460" y="150">    48 B8 ?? ?? ??...   mov rax, hook</text>
<text class="c" x="460" y="168">    FF E0               jmp rax</text>
<text class="c" x="460" y="186">    (rest of prologue untorched)</text>
<text class="cap" x="460" y="220">  short alternative (32-bit rel jmp):</text>
<text class="c" x="460" y="240">    E9 ?? ?? ?? ??     jmp hook  (5 bytes)</text>
<text class="cap" x="460" y="280">  detorrs / minhook do disassembly</text>
<text class="cap" x="460" y="298">  to relocate moved instructions.</text>

<rect class="tr" x="840" y="80" width="320" height="280" rx="8"/>
<text class="h" x="1000" y="105" text-anchor="middle">Trampoline</text>
<text class="c" x="860" y="135">  trampoline:</text>
<text class="c" x="860" y="155">    4C 8B D1     mov r10, rcx</text>
<text class="c" x="860" y="173">    B8 55 00..   mov eax, 55h</text>
<text class="c" x="860" y="191">    F6 04 25.. ...</text>
<text class="c" x="860" y="209">    E9 .. ..     jmp NtCreateFile+12</text>
<text class="cap" x="860" y="252">  Hook calls trampoline to</text>
<text class="cap" x="860" y="270">  invoke the "real" function withort</text>
<text class="cap" x="860" y="288">  infinite recursion.</text>

<rect class="org" x="40" y="380" width="1120" height="290" rx="8"/>
<text class="h" x="600" y="405" text-anchor="middle">Libraries</text>
<text class="c" x="60" y="432">  Microsoft Detorrs (open sorrce since 2016)        — VirtualAllocEx + DetorrTransactionCommit</text>
<text class="c" x="60" y="450">  MinHook (https://github.com/TsudaKageyu/minhook)   — lightweight, x86/x64</text>
<text class="c" x="60" y="468">  EasyHook                                            — managed + native</text>
<text class="c" x="60" y="486">  Frida (https://frida.re)                            — JS scripting, dynamic instrumentation</text>
<text class="c" x="60" y="504">  Mhook (https://github.com/martona/mhook)            — kernel-mode too</text>
<text class="cap" x="60" y="540">  Risks:</text>
<text class="cap" x="60" y="558">  • PatchGuard kills kernel-mode hook (on SSDT, kernel functions)</text>
<text class="cap" x="60" y="576">  • CFG (Control Flow Guard) checks target validity — hook on CFG-protected function fails</text>
<text class="cap" x="60" y="594">  • CET Shadow Stack protects return; but inline hook uses JMP, not RET</text>
<text class="cap" x="60" y="612">  • Race conditions with other threads executing during patch (use suspend or IPI/atomic-write)</text>
<text class="cap" x="60" y="640">  Detection: compare function bytes in DLL with clean copy (read PE from disk).</text>
<text class="cap" x="60" y="658">  EDRs compare NTAPI prologue with baseline.</text>
</svg>
