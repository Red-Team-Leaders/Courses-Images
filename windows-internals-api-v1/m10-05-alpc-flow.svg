<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
<defs><style>.t{font:700 24px "Segoe UI",sans-serif;fill:#e6edf3}.h{font:600 14px "Segoe UI",sans-serif;fill:#e6edf3}.c{font:12px Consolas,monospace;fill:#e6edf3}.cap{font:italic 12px "Segoe UI",sans-serif;fill:#8b949e}.srv{fill:#1f3a5f;stroke:#58a6ff;stroke-width:1.5}.cli{fill:#1f3a2a;stroke:#7ee787;stroke-width:1.5}.k{fill:#3a1f1f;stroke:#ff7b72;stroke-width:1.5}.box{fill:#161b22;stroke:#30363d}</style><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e6edf3"/></marker></defs>
<rect width="1200" height="750" fill="#0d1117"/>
<text class="t" x="600" y="38" text-anchor="middle">Advanced Local Procedure Call (ALPC)</text>
<text class="cap" x="600" y="60" text-anchor="middle">Sucessor de LPC (NT 6+); base de RPC, CSRSS, lsass IPC, COM local, UMPD; objetos: Port, Section, Region.</text>

<rect class="srv" x="40" y="90" width="540" height="240" rx="8"/>
<text class="h" x="310" y="115" text-anchor="middle">Servidor</text>
<text class="c" x="60" y="142">  NtAlpcCreatePort(handle, OBJECT_ATTRIBUTES{name="\RPC Control\foo"},</text>
<text class="c" x="60" y="160">                  PORT_ATTRIBUTES{Flags, MaxMessageLength, …});</text>
<text class="c" x="60" y="180">  loop:</text>
<text class="c" x="60" y="198">    NtAlpcSendWaitReceivePort(connectionPort, ALPC_MSGFLG_NONE,</text>
<text class="c" x="60" y="216">       NULL, NULL, &amp;rcvMsg, &amp;rcvSize, NULL, NULL);</text>
<text class="c" x="60" y="236">    if (msg.Type == LPC_CONNECTION_REQUEST) {</text>
<text class="c" x="60" y="254">      NtAlpcAcceptConnectPort(&amp;commPort, connectionPort, …);</text>
<text class="c" x="60" y="272">    }</text>
<text class="c" x="60" y="290">    process(msg) ; reply via NtAlpcSendWaitReceivePort</text>

<rect class="cli" x="620" y="90" width="540" height="240" rx="8"/>
<text class="h" x="890" y="115" text-anchor="middle">Cliente</text>
<text class="c" x="640" y="142">  NtAlpcConnectPort(&amp;clientPort,</text>
<text class="c" x="640" y="160">                    L"\\RPC Control\\foo",</text>
<text class="c" x="640" y="178">                    OBJECT_ATTRIBUTES, PortAttribs,</text>
<text class="c" x="640" y="196">                    flags, RequiredServerSid,</text>
<text class="c" x="640" y="214">                    ConnectionMessage, BufLen,</text>
<text class="c" x="640" y="232">                    OutMsgAttribs, InMsgAttribs, NULL);</text>
<text class="c" x="640" y="260">  send: NtAlpcSendWaitReceivePort(clientPort, FLAGS,</text>
<text class="c" x="640" y="278">         &amp;sendMsg, NULL, &amp;rcvMsg, &amp;rcvSize, NULL, NULL);</text>

<rect class="k" x="40" y="350" width="1120" height="240" rx="8"/>
<text class="h" x="600" y="375" text-anchor="middle">Estrutura no kernel</text>
<text class="c" x="60" y="402">  _ALPC_PORT</text>
<text class="c" x="60" y="420">    Type, ConnectionPort, ConnectedPort,</text>
<text class="c" x="60" y="438">    Communication / Connection / Server flags</text>
<text class="c" x="60" y="456">    PortQueue : ALPC_QUEUE (msg list)</text>
<text class="c" x="60" y="474">    OwnerProcess, OwnerSection</text>
<text class="c" x="60" y="492">    SecurityDescriptor</text>
<text class="cap" x="60" y="525">  Mensagens podem carregar atributos (PORT_MESSAGE + ALPC_MESSAGE_ATTRIBUTES):</text>
<text class="cap" x="60" y="543">    Token (impersonation), Section/View (shared mem),</text>
<text class="cap" x="60" y="561">    Handle (passar handles), Context (server-side), DataView.</text>

<rect class="box" x="40" y="610" width="1120" height="120" rx="8"/>
<text class="h" x="600" y="635" text-anchor="middle">Quem usa ALPC</text>
<text class="c" x="60" y="662">  • CSRSS (\Windows\ApiPort)            • lsass (\LSA, \SspiCall, \LSAA)</text>
<text class="c" x="60" y="680">  • RPC ncalrpc (RPC Endpoint Mapper)   • DCOM/COM local + dwm</text>
<text class="c" x="60" y="698">  • Print spooler, Audio, ShellHWDetection, AppContainer brokers</text>
<text class="cap" x="60" y="720">  Inspeção: NtObject!AlpcPort no PowerShell (Forshaw); WinDbg !alpc /lpp &lt;port&gt;.</text>
</svg>
